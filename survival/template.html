<!DOCTYPE html>
<html lang="el"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Επιβίωση 72+</title>
<!--PWA-->
<style>
:root{--fs:19px;--bg:#0d1b2a;--card:#16283d;--line:#2a4060;--tx:#f4f6f8;--mut:#a9b8c8;--red:#d62828;--org:#f77f00;--grn:#2a9d8f;--yel:#fcbf49;--blu:#3a86ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,"Segoe UI",Roboto,Arial,sans-serif;font-size:var(--fs);line-height:1.45}
header{position:sticky;top:0;z-index:5;background:#0a1522;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;border-bottom:1px solid var(--line)}
header h1{flex:1;font-size:1.05em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:12px;min-width:46px;height:46px;font-size:1em;font-weight:700;padding:0 10px}
main{padding:12px 12px calc(env(safe-area-inset-bottom) + 90px);max-width:760px;margin:0 auto}
.big{display:block;width:100%;border:0;border-radius:18px;padding:20px 14px;margin:0 0 12px;font-size:1.35em;font-weight:800;color:#fff;text-align:center}
.big small{display:block;font-size:.6em;font-weight:500;opacity:.9;margin-top:4px}
.red{background:var(--red)}.org{background:var(--org)}.grn{background:var(--grn)}.blu{background:var(--blu)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center;color:var(--tx);font-size:1em;font-weight:700;min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tile .e{font-size:2.1em;line-height:1}
.tile small{font-weight:400;color:var(--mut);font-size:.72em}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:9px;color:var(--tx);width:100%;text-align:left;font-size:1em}
.row .e{font-size:1.7em;width:1.4em;text-align:center}
.row b{display:block}.row small{color:var(--mut)}
h2{font-size:1.25em;margin:18px 0 8px;color:var(--yel)}
h3{font-size:1.05em;margin:18px 0 6px;color:var(--yel);border-bottom:1px solid var(--line);padding-bottom:4px}
.sub{color:var(--mut);margin:-4px 0 10px}
.step{display:flex;gap:10px;background:var(--card);border-radius:12px;padding:10px 12px;margin:7px 0}
.step .n{flex:none;width:1.8em;height:1.8em;border-radius:50%;background:var(--org);color:#000;font-weight:800;display:flex;align-items:center;justify-content:center}
.li{padding:5px 0 5px 1.1em;position:relative}.li:before{content:"•";position:absolute;left:.2em;color:var(--org)}
.warn{background:#4a1014;border-left:6px solid var(--red);padding:10px 12px;border-radius:10px;margin:8px 0;font-weight:600}
.tip{background:#123a36;border-left:6px solid var(--grn);padding:10px 12px;border-radius:10px;margin:8px 0}
.chk{display:flex;gap:12px;align-items:flex-start;padding:11px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.chk .bx{flex:none;width:1.5em;height:1.5em;border:2px solid var(--mut);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:900}
.chk.on .bx{background:var(--grn);border-color:var(--grn)}.chk.on span{color:var(--mut);text-decoration:line-through}
.bar{height:14px;background:var(--card);border-radius:8px;overflow:hidden;margin:6px 0 2px}.bar i{display:block;height:100%;background:var(--grn)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.btn{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:11px 14px;font-size:.95em;font-weight:700}
.btn.p{background:var(--blu);border-color:var(--blu);color:#fff}.btn.r{background:var(--red);border-color:var(--red);color:#fff}.btn.g{background:var(--grn);border-color:var(--grn);color:#fff}
input,select,textarea{width:100%;font-size:1em;padding:11px;border-radius:10px;border:1px solid var(--line);background:#0a1522;color:var(--tx);margin:4px 0 10px}
label{font-weight:700;color:var(--mut);font-size:.9em}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.phone{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:9px;color:var(--tx);text-decoration:none}
.phone .num{font-size:1.6em;font-weight:900;color:#fff;min-width:3.2em}
.phone.k .num{color:var(--red)}
.comp{position:relative;width:min(78vw,300px);height:min(78vw,300px);margin:8px auto}
.comp svg{width:100%;height:100%}
.hd{text-align:center;font-size:2.6em;font-weight:900;letter-spacing:1px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.coord{font-size:1.15em;text-align:center;font-weight:700}
.muted{color:var(--mut);font-size:.88em}
#ov{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:#fff;color:#000;font-weight:800;padding-bottom:calc(env(safe-area-inset-bottom) + 30px)}
.metro{width:150px;height:150px;border-radius:50%;margin:10px auto;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:2.6em;font-weight:900;transition:transform .08s}
.metro.b{transform:scale(1.15);background:#ff4d4d}
footer{text-align:center;color:var(--mut);font-size:.8em;margin-top:28px}
.wp{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}.wp b{flex:1}
.sel{outline:3px solid var(--yel)}
canvas{width:100%;background:#0a1522;border-radius:12px;border:1px solid var(--line)}
.card{background:#fff;color:#000;border-radius:14px;padding:14px;font-size:1.05em}.card b{color:#900}
.sunt{width:100%;border-collapse:collapse;font-size:.82em;margin:8px 0;font-variant-numeric:tabular-nums}
.sunt th{color:var(--mut);font-weight:600;font-size:.85em;padding:4px 2px;position:sticky;top:62px;background:var(--bg)}
.sunt td{text-align:center;padding:6px 2px;border-bottom:1px solid var(--line)}
.smh td{text-align:left;background:var(--card);color:var(--yel);font-weight:800;padding:10px 8px;cursor:pointer}.smh.cur td{background:#3a2a10}
#al{position:fixed;inset:0;z-index:90;background:#b00000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:6px}
#al .big{max-width:420px}
#gbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#1d3557;color:#fff;text-align:center;font-weight:700;padding:10px 10px calc(env(safe-area-inset-bottom) + 10px);border-top:2px solid var(--blu)}
</style></head><body>
<header><button class="hb" id="bk" onclick="back()" aria-label="Πίσω">◀</button><h1 id="ttl">Επιβίωση 72+</h1>
<button class="hb" onclick="fz(-1)">A−</button><button class="hb" onclick="fz(1)">A+</button><button class="hb" onclick="go('home')" aria-label="Αρχική">🏠</button></header>
<main id="m"></main>
<div id="ov" onclick="ovOff()"><span id="ovt">Πάτα για κλείσιμο</span></div>
<script>
const D=/*DATA*/;
const $=s=>document.querySelector(s),M=$('#m');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={g(k,d){try{const v=localStorage.getItem('sv_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},s(k,v){try{localStorage.setItem('sv_'+k,JSON.stringify(v))}catch(e){}}};
let fs=LS.g('fs',19);document.documentElement.style.setProperty('--fs',fs+'px');
function fz(d){fs=Math.max(15,Math.min(28,fs+d*2));LS.s('fs',fs);document.documentElement.style.setProperty('--fs',fs+'px')}
const CATS={now:['🚨','Τι συμβαίνει τώρα;','red'],aid:['🩹','Πρώτες βοήθειες','org'],list:['🎒','Λίστες εξοπλισμού','blu'],gear:['🛒','Οδηγός εξοπλισμού','blu'],wild:['🏕️','Μετά τις 72 ώρες – Επιβίωση','grn'],tips:['💡','Συμβουλές','grn']};
const byId={};D.forEach(a=>byId[a.id]=a);
function go(r){if(location.hash.slice(1)===r){stopAll();render(r);window.scrollTo(0,0)}else location.hash=r}
function back(){history.length>1?history.back():go('home')}
window.addEventListener('hashchange',()=>{stopAll();render(location.hash.slice(1)||'home');window.scrollTo(0,0)});
function T(t){$('#ttl').textContent=t;$('#bk').style.visibility=(t==='Επιβίωση 72+')?'hidden':'visible'}

function render(r){
 const [a,b]=r.split('/');
 if(a==='home'||!a)return home();
 if(a==='cat')return cat(b);
 if(a==='a')return art(b);
 if(a==='compass')return compass();
 if(a==='sos')return sos();
 if(a==='phones')return phones();
 if(a==='me')return me();
 if(a==='search')return search();
 if(a==='cpr')return cprPage();
 if(a==='morse')return morse();
 if(a==='wx')return wx();
 if(a==='sun')return sun();
 if(a==='tools')return tools();
 if(a==='near')return tNear(b);
 if(a==='t')return tool(b);
 home();
}
function home(){T('Επιβίωση 72+');
 M.innerHTML=`<button class="big red" onclick="go('cat/now')">🚨 ΕΚΤΑΚΤΟ – ΤΩΡΑ!<small>Σεισμός, φωτιά, πλημμύρα, πόλεμος…</small></button>
 <div class="grid">
 <button class="tile" onclick="go('phones')"><span class="e">📞</span>Τηλέφωνα<small>112 · 166 · 199</small></button>
 <button class="tile" onclick="go('cat/aid')"><span class="e">🩹</span>Πρώτες βοήθειες<small>ΚΑΡΠΑ, αίμα, εγκαύματα</small></button>
 <button class="tile" onclick="go('compass')"><span class="e">🧭</span>Πυξίδα & GPS<small>θέση, γυρισμός</small></button>
 <button class="tile" onclick="go('sos')"><span class="e">🔦</span>SOS<small>φως, σφυρίχτρα, Morse</small></button>
 <button class="tile" onclick="go('cat/list')"><span class="e">🎒</span>Λίστες 72 ωρών<small>σακίδιο, σπίτι, φαρμακείο</small></button>
 <button class="tile" onclick="go('me')"><span class="e">🪪</span>Η κάρτα μου<small>υγεία, επαφές, σχέδιο</small></button>
 <button class="tile" onclick="go('cat/gear')"><span class="e">🛒</span>Τι να αγοράσω<small>κουβέρτα, φακός, σκηνή</small></button>
 <button class="tile" onclick="go('cat/wild')"><span class="e">🏕️</span>Μετά τις 72 ώρες<small>νερό, φωτιά, καταφύγιο</small></button>
 <button class="tile" onclick="go('cat/tips')"><span class="e">💡</span>Συμβουλές<small>και για παιδιά</small></button>
 <button class="tile" onclick="go('wx')"><span class="e">🌦️</span>Καιρός & Υψόμετρο<small>βαρόμετρο, GPS ύψος</small></button>
 <button class="tile" onclick="go('morse')"><span class="e">📡</span>Morse<small>λέξεις με φως & ήχο</small></button>
 <button class="tile" onclick="go('sun')"><span class="e">🌅</span>Ήλιος<small>ανατολή – δύση, όλο τον χρόνο</small></button>
 <button class="tile" onclick="go('near')" style="grid-column:1/-1;min-height:80px;background:#3a1014;border-color:var(--red)"><span class="e" style="font-size:1.6em">📍</span>Κοντά μου – χωρίς internet<small>πιο κοντινό νοσοκομείο · φαρμακείο · απινιδωτής · νερό · χώρος συγκέντρωσης</small></button>
 <button class="tile" onclick="go('tools')" style="grid-column:1/-1;min-height:80px;background:#1d3557;border-color:var(--blu)"><span class="e" style="font-size:1.6em">🧰</span>Εργαλεία κινητού<small>φύλακας πτώσης · check-in · παλμοί · σεισμογράφος · σελήνη · έγγραφα…</small></button>
 <button class="tile" onclick="go('search')" style="grid-column:1/-1;min-height:70px"><span class="e" style="font-size:1.4em">🔎</span>Αναζήτηση</button>
 </div>
 <div class="tip">Δουλεύει χωρίς internet. Τα δεδομένα σου μένουν μόνο σε αυτό το κινητό. <b>A+</b> πάνω δεξιά για μεγαλύτερα γράμματα.</div>
 <footer>Επιβίωση 72+ · Created by George Barbaris<br>Οι οδηγίες δεν αντικαθιστούν το 112, τις επίσημες αρχές ή την εκπαίδευση σε πρώτες βοήθειες.</footer>`}
function cat(c){const k=CATS[c];if(!k)return home();T(k[1]);
 const L=D.filter(a=>a.cat===c);
 let h='';
 if(c==='aid')h+=`<button class="big red" onclick="go('cpr')">❤️ ΚΑΡΠΑ – δεν αναπνέει<small>με ρυθμό ♪ για τις πιέσεις</small></button>`;
 if(c==='now'){h+=`<div class="grid">`+L.map(a=>`<button class="tile" onclick="go('a/${a.id}')"><span class="e">${a.emoji}</span>${esc(a.title)}</button>`).join('')+`<button class="tile" onclick="go('cat/aid')"><span class="e">🩹</span>Τραυματισμός</button></div>`;M.innerHTML=h;return}
 h+=L.map(a=>{let p='';if(a.cat==='list'){const t=a.blocks.filter(x=>x.t==='chk').length,on=a.blocks.filter(x=>x.t==='chk'&&LS.g('c_'+a.id,{})[x.x]).length;p=` · ${on}/${t} ✓`}
  return `<button class="row" onclick="go('a/${a.id}')"><span class="e">${a.emoji}</span><span><b>${esc(a.title)}</b><small>${esc(a.sub)}${p}</small></span></button>`}).join('');
 M.innerHTML=h}
function art(id){const a=byId[id];if(!a)return home();T(a.title);
 let h=`<h2>${a.emoji} ${esc(a.title)}</h2><div class="sub">${esc(a.sub)}</div><div class="tools"><button class="btn" id="spk" onclick="speak('${id}')">🔊 Διάβασέ το</button>`;
 if(a.cat==='now'||a.cat==='aid')h+=`<a class="btn r" href="tel:112" style="text-decoration:none">📞 112</a>`;
 if(id==='cpr')h+=`<button class="btn r" onclick="go('cpr')">♪ Ρυθμός ΚΑΡΠΑ</button>`;
 if(id==='lost'||id==='sea')h+=`<button class="btn p" onclick="go('compass')">🧭 Η θέση μου</button>`;
 if(a.cat==='list')h+=`<button class="btn" onclick="clr('${id}')">↺ Από την αρχή</button>`;
 h+=`</div>`;
 if(id==='home72'||id==='nuclearkit')h+=calcBox();
 if(a.cat==='list'){h+=`<div id="prog"></div>`}
 let n=0;const st=LS.g('c_'+id,{});
 for(const b of a.blocks){
  if(b.t!=='step')n=0;
  if(b.t==='h')h+=`<h3>${esc(b.x)}</h3>`;
  else if(b.t==='step'){n++;h+=`<div class="step"><span class="n">${n}</span><span>${esc(b.x)}</span></div>`}
  else if(b.t==='li')h+=`<div class="li">${esc(b.x)}</div>`;
  else if(b.t==='warn')h+=`<div class="warn">⚠️ ${esc(b.x)}</div>`;
  else if(b.t==='tip')h+=`<div class="tip">💡 ${esc(b.x)}</div>`;
  else if(b.t==='chk')h+=`<div class="chk${st[b.x]?' on':''}" data-k="${esc(b.x)}" onclick="tg(this,'${id}')"><span class="bx">${st[b.x]?'✓':''}</span><span>${esc(b.x)}</span></div>`;
 }
 const same=D.filter(x=>x.cat===a.cat),i=same.indexOf(a);
 h+=`<div class="tools" style="margin-top:20px">${i>0?`<button class="btn" onclick="go('a/${same[i-1].id}')">◀ ${esc(same[i-1].title)}</button>`:''}${i<same.length-1?`<button class="btn" onclick="go('a/${same[i+1].id}')">${esc(same[i+1].title)} ▶</button>`:''}</div>`;
 M.innerHTML=h;if(a.cat==='list')prog(id);if($('#cp'))calc()}
function tg(el,id){const st=LS.g('c_'+id,{}),k=el.dataset.k;st[k]=!st[k];if(!st[k])delete st[k];LS.s('c_'+id,st);el.classList.toggle('on',!!st[k]);el.querySelector('.bx').textContent=st[k]?'✓':'';prog(id)}
function prog(id){const a=byId[id],t=a.blocks.filter(x=>x.t==='chk').length,on=Object.keys(LS.g('c_'+id,{})).length,p=Math.round(100*on/t);
 $('#prog').innerHTML=`<div class="bar"><i style="width:${p}%"></i></div><div class="muted">${on} από ${t} έτοιμα (${p}%)</div>`}
function clr(id){if(!confirm('Να ξεκαθαρίσουν όλα τα ✓ αυτής της λίστας;'))return;LS.s('c_'+id,{});art(id)}
function calcBox(){const c=LS.g('calc',{p:4,d:3});return `<div class="box"><b>🧮 Υπολογισμός αποθεμάτων</b><div class="grid" style="margin-top:8px"><div><label>Άτομα</label><input id="cp" type="number" min="1" value="${c.p}" oninput="calc()"></div><div><label>Ημέρες</label><select id="cd" onchange="calc()">${[3,7,14,30].map(x=>`<option ${x==c.d?'selected':''}>${x}</option>`).join('')}</select></div></div><div id="cr"></div></div>`}
function calc(){const p=Math.max(1,+$('#cp').value||1),d=+$('#cd').value;LS.s('calc',{p,d});
 $('#cr').innerHTML=`<div class="li"><b>Νερό πόσιμο:</b> ${4*p*d} λίτρα (4 L/άτομο/μέρα)</div><div class="li"><b>Θερμίδες:</b> ~${(2000*p*d).toLocaleString('el')} kcal (≈ ${Math.ceil(p*d*2000/400)} κονσέρβες/μερίδες των 400 kcal)</div><div class="li"><b>Χαρτί υγείας:</b> ~${Math.ceil(p*d/4)} ρολά</div><div class="li"><b>Μπαταρίες ΑΑ:</b> ~${Math.max(8,p*4+d*2)} τεμ.</div><div class="li"><b>Σακούλες σκουπιδιών:</b> ~${Math.ceil(p*d/2)+5}</div><div class="muted">Πρόσθεσε 50% νερό σε καύσωνα, για θηλάζουσες ή αρρώστους.</div>`}

/* ---- speech ---- */
let speaking=false;
function speak(id){const s=window.speechSynthesis;if(!s){alert('Το κινητό δεν υποστηρίζει ανάγνωση.');return}
 if(speaking){s.cancel();speaking=false;$('#spk').textContent='🔊 Διάβασέ το';return}
 const a=byId[id];let txt=a.title+'. '+a.sub+'. ';let n=0;a.blocks.forEach(b=>{if(b.t==='step'){n++;txt+=n+'. '+b.x+' '}else{n=0;txt+=(b.t==='warn'?'Προσοχή! ':'')+b.x+'. '}});
 const u=new SpeechSynthesisUtterance(txt.replace(/[•→]/g,' '));u.lang='el-GR';u.rate=.95;const v=s.getVoices().find(v=>v.lang&&v.lang.startsWith('el'));if(v)u.voice=v;
 u.onend=()=>{speaking=false;const b=$('#spk');if(b)b.textContent='🔊 Διάβασέ το'};s.cancel();s.speak(u);speaking=true;$('#spk').textContent='⏹ Σταμάτα'}

/* ---- phones ---- */
const PH=[['112','Ευρωπαϊκός αριθμός έκτακτης ανάγκης','Δουλεύει χωρίς SIM, από κάθε δίκτυο, και με SMS',1],['166','ΕΚΑΒ – Ασθενοφόρο','',1],['199','Πυροσβεστική','',1],['100','Αστυνομία','',1],['108','Λιμενικό Σώμα','Θάλασσα, ναυάγιο, άνθρωπος στη θάλασσα',1],['2107793777','Κέντρο Δηλητηριάσεων','24 ώρες – φάρμακα, χημικά, μανιτάρια, φίδια',0],['1056','Χαμόγελο του Παιδιού','Παιδί σε κίνδυνο / εξαφάνιση',0],['197','Κοινωνική Βοήθεια (ΕΚΚΑ)','',0],['1018','Γραμμή παρέμβασης για την αυτοκτονία','Κλίμακα – 24 ώρες',0]];
function phones(){T('Τηλέφωνα');const my=LS.g('me',{});
 let h=PH.map(p=>`<a class="phone ${p[3]?'k':''}" href="tel:${p[0]}"><span class="num">${p[0].length>6?'☎':p[0]}</span><span><b>${p[1]}</b>${p[0].length>6?`<br><span class="mono">${p[0].replace(/(\d{3})(\d{7})/,'$1 $2')}</span>`:''}${p[2]?`<br><small class="muted">${p[2]}</small>`:''}</span></a>`).join('');
 const cs=(my.contacts||'').split('\n').map(x=>x.trim()).filter(Boolean);
 if(cs.length)h+=`<h3>Οι επαφές μου</h3>`+cs.map(c=>{const t=(c.match(/[+\d][\d\s]{6,}/)||[''])[0].replace(/\s/g,'');return `<a class="phone" ${t?`href="tel:${t}"`:''}><span class="num">👤</span><span><b>${esc(c)}</b></span></a>`}).join('');

function draw(){const cv=$('#cv');if(!cv)return;const x=cv.getContext('2d'),W=cv.width,H=cv.height;x.clearRect(0,0,W,H);
 const w=LS.g('wps',[]),pts=[...trk,...w];if(pos)pts.push(pos);
 if(!pts.length){x.fillStyle='#a9b8c8';x.font='28px sans-serif';x.textAlign='center';x.fillText('Δεν υπάρχουν ακόμα σημεία',W/2,H/2);return}
 const c=pos||pts[pts.length-1],k=Math.cos(rad(c.lat));let mx=50;pts.forEach(p=>{mx=Math.max(mx,Math.abs((p.lon-c.lon)*k*111320),Math.abs((p.lat-c.lat)*110540))});
 const sc=(W/2-50)/mx,P=p=>[W/2+(p.lon-c.lon)*k*111320*sc,H/2-(p.lat-c.lat)*110540*sc];
 // grid rings
 x.strokeStyle='#2a4060';x.lineWidth=2;x.fillStyle='#a9b8c8';x.font='22px sans-serif';x.textAlign='left';
 const ring=[10,25,50,100,250,500,1000,2500,5000,10000,25000,50000,100000,250000,500000,1e6,2.5e6,5e6].find(r=>r*sc>W/6)||mx;
 for(let i=1;i<=3;i++){x.beginPath();x.arc(W/2,H/2,ring*i*sc,0,7);x.stroke();x.fillText(fmD(ring*i),W/2+ring*i*sc*.71+4,H/2-ring*i*sc*.71)}
 x.fillStyle='#ff4d4d';x.font='bold 30px sans-serif';x.textAlign='center';x.fillText('Β ▲',W/2,34);
 if(trk.length>1){x.strokeStyle='#fcbf49';x.lineWidth=4;x.beginPath();trk.forEach((p,i)=>{const [a,b]=P(p);i?x.lineTo(a,b):x.moveTo(a,b)});x.stroke()}
 w.forEach((p,i)=>{const [a,b]=P(p);x.font='34px sans-serif';x.fillText('⭐',a,b+12);x.fillStyle=tgt===i?'#fcbf49':'#fff';x.font='bold 22px sans-serif';x.fillText(p.n,a,b-22);x.fillStyle='#ff4d4d'});
 if(pos){const [a,b]=P(pos);x.fillStyle='rgba(58,134,255,.25)';x.beginPath();x.arc(a,b,Math.max(10,pos.acc*sc),0,7);x.fill();x.fillStyle='#3a86ff';x.strokeStyle='#fff';x.lineWidth=4;x.beginPath();x.arc(a,b,13,0,7);x.fill();x.stroke()}}
