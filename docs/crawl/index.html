<style>
:root{--bg:#1a1918;--card:#262422;--line:#3d3935;--tx:#f5f0e8;--mut:#a8a29e;--red:#d9534f;--org:#d97757;--grn:#5f9e7a;--yel:#e8b86d;--blu:#6a9fb5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,"Segoe UI",Roboto,Arial,sans-serif;font-size:18px;line-height:1.45}
header{position:sticky;top:0;z-index:5;background:#1f1e1d;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 12px 8px;border-bottom:1px solid var(--line)}
header img{width:44px;height:44px;border-radius:10px}
.tw{flex:1;min-width:0}header h1{font-size:1.08em;margin:0;white-space:nowrap}
#tag{font-size:.72em;color:#c96442;font-style:italic;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:12px;min-width:48px;height:44px;font-size:.9em;font-weight:800}
main{padding:12px 12px calc(env(safe-area-inset-bottom) + 40px);max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:0 0 14px}
.card h2{font-size:1.05em;margin:0 0 10px;color:var(--org)}
.card h2 b{display:inline-block;background:var(--org);color:#1a1918;border-radius:50%;width:1.6em;height:1.6em;text-align:center;line-height:1.6em;margin-right:6px;font-size:.85em}
label{display:block;font-size:.78em;color:var(--mut);margin:0 0 3px}
input,select{width:100%;font-size:1.05em;padding:11px 10px;border-radius:12px;border:1px solid var(--line);background:#1a1918;color:var(--tx);font-family:inherit}
input:focus,select:focus{outline:2px solid var(--org);border-color:transparent}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:.8em;color:var(--mut);margin:8px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.chip{background:#1a1918;color:var(--tx);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:.95em;font-weight:700}

.tx{margin:4px 0 0}.tx summary{font-size:.78em;color:var(--mut);cursor:pointer;padding:4px 0}
.chip.on{background:var(--org);border-color:var(--org);color:#1a1918}
.btn{border:0;border-radius:12px;padding:12px 14px;font-size:.95em;font-weight:800;background:var(--blu);color:#fff}
.btn.g{background:var(--grn)}.btn.r{background:#4a2b2a;color:#f3b9b7}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.big3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.kpi{background:#1a1918;border:1px solid var(--line);border-radius:14px;padding:10px 4px}
.kpi .v{font-size:1.55em;font-weight:900;line-height:1.1}.kpi .l{font-size:.68em;color:var(--mut);margin-top:3px}
.scale{position:relative;height:14px;border-radius:7px;margin:16px 0 4px;background:linear-gradient(90deg,#6b6460 0%,#6a9fb5 25%,#5f9e7a 45%,#e8b86d 70%,#d9534f 100%)}
.mk{position:absolute;top:-6px;width:4px;height:26px;border-radius:2px;background:#fff;box-shadow:0 0 0 2px #1a1918}
.mk.s{background:#a8a29e}
.sl{display:flex;justify-content:space-between;font-size:.65em;color:var(--mut)}
.verdict{margin-top:10px;padding:10px 12px;border-radius:12px;background:#1a1918;border-left:5px solid var(--org);font-size:.92em}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}.opt .t{font-size:.9em}.opt .t small{display:block;color:var(--mut);font-size:.8em}
.opt .n{font-size:1.25em;font-weight:900;color:var(--yel);text-align:right;white-space:nowrap}.opt .n small{display:block;font-size:.55em;color:var(--mut);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:.88em}
th{color:var(--mut);font-weight:600;font-size:.78em;text-align:right;padding:6px 4px}th:first-child,td:first-child{text-align:left}
td{padding:9px 4px;border-top:1px solid var(--line);text-align:right;font-weight:700}
td .lim{display:block;font-size:.72em;font-weight:500;color:var(--mut)}
.bar{height:8px;border-radius:4px;background:#1a1918;margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--grn)}
details{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:0 14px;margin:0 0 14px}
#howto{border-color:var(--org)}
summary{padding:14px 0;font-weight:800;color:var(--org);list-style:none;cursor:pointer}summary::-webkit-details-marker{display:none}
summary:after{content:"＋";float:right;color:var(--mut)}details[open] summary:after{content:"－"}
details .in{padding:0 0 14px;font-size:.93em}details p{margin:0 0 10px}
.s10{background:#2f2a24;border-radius:12px;padding:10px 12px;margin:0 0 10px;border-left:5px solid var(--yel)}
.good{color:#8fd1a8}.bad{color:#f08a86}.warn{color:var(--yel)}
footer{text-align:center;color:var(--mut);font-size:.75em;padding:8px 0 20px}
footer b{color:var(--org)}
</style></head>

<details open><summary>🔩 ${L('Μικραίνουν τα γρανάζια όσο ανεβαίνει το crawl; Σπάνε;','Do gears get smaller as crawl goes up? Do they break?')}</summary><div class="in">
 <div class="s10">${L('<b>Με απλά λόγια:</b> το μεγάλο λάστιχο είναι σαν μακρύ κλειδί. Με μακρύ κλειδί σφίγγεις πιο δυνατά, αλλά σπας και πιο εύκολα τη βίδα. Τα κοντά γρανάζια σού δίνουν πίσω τη δύναμη, αλλά τα δόντια του μικρού γραναζιού (pinion) γίνονται πιο λίγα και πιο μικρά.','<b>In plain words:</b> a big tyre is like a long wrench. A long wrench tightens harder, but it also snaps the bolt more easily. Lower gears give you the force back, but the small gear (pinion) ends up with fewer, smaller teeth.')}</div>
 <p><b>${L('Στέκει; Ναι, στο διαφορικό.','Is it true? Yes, in the axle.')}</b> ${L('Η κορώνα (ring gear) έχει το ίδιο μέγεθος γιατί την περιορίζει το κέλυφος. Για πιο κοντή σχέση, το pinion παίρνει λιγότερα δόντια και μικραίνει (π.χ. 5.38 = 43/8 δόντια, 2.73 = 49/18). Στις πολύ κοντές σχέσεις μπορεί να πατάει σχεδόν ένα δόντι τη φορά. Γι’ αυτό στην Αμερική πολλοί σταματούν στο 4.88 στον Dana 44 και πάνω από εκεί πάνε σε μεγαλύτερο άξονα.','The ring gear stays the same size because the housing limits it. For a lower ratio the pinion gets fewer teeth and shrinks (e.g. 5.38 = 43/8 teeth, 2.73 = 49/18). At very low ratios almost one tooth carries the load at a time. That is why many in the US stop at 4.88 in a Dana 44 and go to a bigger axle beyond that.')}</p>
 <p><b>${L('Στο βοηθητικό:','In the transfer case:')}</b> ${L('τα κιτ μπαίνουν στο ίδιο κουτί, άρα δεν μεγαλώνουν. Οι σοβαροί κατασκευαστές το καλύπτουν με σκληρότερο ατσάλι (π.χ. SCM415 με ενανθράκωση). Όταν κονταίνεις στο βοηθητικό, μεγαλύτερη ροπή περνάει από τους άξονες μετάδοσης, τα διαφορικά και τα ημιαξόνια. Το καλό: οι δρόμοι στην εθνική δεν αλλάζουν, γιατί το high μένει ίδιο (σε πολλά κιτ του Jimny αλλάζει λίγο και το high).','kits fit the same case, so the gears cannot grow. Good makers make up for it with harder steel (e.g. carburised SCM415). Gearing down in the transfer case sends more torque through the driveshafts, diffs and axle shafts. The upside: highway revs stay the same because high range is untouched (many Jimny kits change high range a little too).')}</p>
 <p><b>${L('Το μεγάλο μυστικό:','The big secret:')}</b> ${L('δεν σπάει μόνο το γρανάζι, σπάει ό,τι είναι πιο αδύνατο. Η μέγιστη ροπή που φτάνει στον άξονα είναι όση επιτρέπει η πρόσφυση: τριβή × βάρος × ακτίνα λάστιχου. Μεγαλύτερη ακτίνα = περισσότερη ροπή πριν σπινάρει = μεγαλύτερο φορτίο σε ημιαξόνια, μπιλιοφόρους (CV) και pinion. Τα χειρότερα είναι τα χτυπήματα: σπινάρισμα που ξαφνικά πιάνει, πήδημα τροχού (wheel hop), γκάζι με μπλοκέ.','it is not just the gear that breaks, it is the weakest part. The most torque the axle can see is what grip allows: friction × weight × tyre radius. Bigger radius = more torque before the tyre spins = more load on axle shafts, CV joints and pinion. Shock loads are the killer: wheelspin that suddenly grips, wheel hop, throttle with lockers in.')}</p>
 <p><b>${L('Κανόνες:','Rules:')}</b> ${L('① Κόντυνε τόσο όσο να πάρεις πίσω το εργοστασιακό, όχι υπερβολές. ② Άλλαξε και τα δύο διαφορικά στην ίδια σχέση, αλλιώς σφίγγει στο 4×4. ③ Πάνω από +2″ λάστιχο, σκέψου πιο γερά ημιαξόνια/μπιλιοφόρους. ④ Ομαλό γκάζι, ποτέ σπινάρισμα με μπλοκέ. ⑤ Σωστό crawl ξεκουράζει συμπλέκτη και κιβώτιο, γιατί δεν τα «καις» στο crawl.','① Gear down only enough to get stock back, no excess. ② Change both axles to the same ratio or it binds in 4×4. ③ Beyond +2″ of tyre, think about stronger axle shafts/CVs. ④ Smooth throttle, never wheelspin with lockers in. ⑤ The right crawl ratio spares the clutch and gearbox because you are not slipping them to crawl.')}</p>
</div></details>

<details><summary>📏 ${L('Τι σημαίνουν τα νούμερα','What the numbers mean')}</summary><div class="in">
 <p>${L('<b>Crawl ratio</b> = 1η × βοηθητικό low × διαφορικό. Πόσες φορές γυρίζει η μηχανή για μία στροφή του τροχού. Μεγαλύτερο = πιο αργά και πιο δυνατά.','<b>Crawl ratio</b> = 1st × transfer low × axle ratio. How many times the engine turns for one turn of the wheel. Higher = slower and stronger.')}</p>
 <p>${L('<b>Με μεγαλύτερο λάστιχο</b> κάθε στροφή του τροχού πάει πιο μακριά, άρα το «πραγματικό» crawl πέφτει: crawl × (παλιό λάστιχο ÷ νέο).','<b>With a bigger tyre</b> each wheel turn travels further, so the real crawl drops: crawl × (old tyre ÷ new).')}</p>
 <p>${L('Κάτω από 30 = δρόμος / χωματόδρομος · 30–49 = trail & overland · 50–69 = καλό για βράχια · 70–99 = πολύ τεχνικό · 100+ = extreme. Για ταξίδι overland προτείνεται περίπου 30–38 με αυτόματο και 45–60 με μηχανικό.','Under 30 = road / gravel · 30–49 = trail & overland · 50–69 = good for rocks · 70–99 = very technical · 100+ = extreme. For an overland rig, roughly 30–38 with an automatic and 45–60 with a manual is often suggested.')}</p>

  const src=prompt(L('Από πού τα βρήκες; (σελίδα, βιβλιαράκι, φόρουμ)','Where did you find them? (site, manual, forum)'),'')||'';
  const o={name:nm,tq:num(S.tq),rpm:S.rpm||'',g1:num(S.g1),lo:num(S.lo),fd:num(S.fd),tyre:S.tyre,kg:num(S.kg),src};
  const txt=`Overland’s Habit · Crawl Calculator\n${L('Νέο αυτοκίνητο για τη λίστα','New vehicle for the list')}:\n${nm}\n${L('Ροπή','Torque')}: ${o.tq} Nm @ ${o.rpm||'?'} rpm\n1η: ${o.g1} · Low: ${o.lo} · ${L('Διαφορικό','Axle')}: ${o.fd}\n${L('Λάστιχο','Tyre')}: ${o.tyre} · ${L('Βάρος','Weight')}: ${o.kg} kg\n${L('Πηγή','Source')}: ${src||'-'}\n#CRAWLADD ${JSON.stringify(o)}`;
  const done=()=>alert(L('Αντιγράφηκε! Στείλ’ το με DM στο @overlandshabit στο Instagram για να μπει στη λίστα για όλους. Ευχαριστούμε!','Copied! Send it by DM to @overlandshabit on Instagram so it goes into the list for everyone. Thank you!'));
  if(navigator.share){navigator.share({text:txt}).catch(()=>{});}else if(navigator.clipboard){navigator.clipboard.writeText(txt).then(done,()=>prompt('',txt));}else prompt('',txt);};
 document.getElementById('lang').onclick=()=>{LANG=LANG==='el'?'en':'el';localStorage.setItem('crawl_lang',LANG);render();};}
function climb(T,CR,eff,Dmm,m,mu,crr){crr=crr||CRR;const r=Dmm/2000,F=T*CR*eff/r,k=F/(m*G),h=Math.hypot(1,crr);
 const te=k>=h?90:(Math.asin(Math.min(1,k/h))-Math.atan(crr))*180/Math.PI, tg=Math.atan(Math.max(0,mu-crr))*180/Math.PI;
 const t=Math.max(0,Math.min(te,tg));return{t,pct:Math.tan(t*Math.PI/180)*100,grip:tg<=te,axle:Math.min(T*CR*eff,mu*m*G*r)};}
function rating(c){return c<30?[L('δρόμος / χωματόδρομος','road / gravel'),'#a8a29e']:c<50?[L('trail & overland','trail & overland'),'#6a9fb5']:c<70?[L('καλό για βράχια','good for rocks'),'#5f9e7a']:c<100?[L('πολύ τεχνικό','very technical'),'#e8b86d']:['extreme','#d9534f'];}
function near(x){let lo=null,hi=null;COMMON.forEach(c=>{if(c<=x+1e-3)lo=c;if(hi===null&&c>=x-1e-3)hi=c;});return[lo,hi];}
function calc(){
 const $=id=>document.getElementById(id);
 const T=num(S.tq),g1=num(S.g1),lo=num(S.lo),fd=num(S.fd),m=num(S.kg),eff=num(S.eff)||0.8,SF=SURF[S.surf]||SURF.dry,mu=SF.mu*(SF.cross?CROSSF[S.lock||'0']:1),crr=SF.crr;
 const D0=tyreMM(S.tyre),D1=tyreMM(S.ntyre)||D0;
 const nfd=num(S.nfd)>0?num(S.nfd):fd, nlo=num(S.nlo)>0?num(S.nlo):lo, Tn=num(S.ntq)>0?num(S.ntq):T, mn=num(S.nkg)>0?num(S.nkg):m;
 const v=allV().find(x=>x.id===S.vid);
 $('vnote').textContent=v&&v.n?v.n[LANG==='el'?0:1]:(v?'':L('Γράψε τις σχέσεις από το εγχειρίδιο ή το βιβλιαράκι του αυτοκινήτου.','Type the ratios from your owner’s manual or spec sheet.'));
 const inch=d=>f(d/25.4,1)+'″';
 const tl=x=>/\d{3}\s*\//.test(String(x||''))?String(x).toUpperCase().replace(/\s/g,''):'';
 $('tnote').innerHTML=isFinite(D0)?'<b>'+(tl(S.tyre)||nearestMetric(D0,10)||'')+'</b>'+(tl(S.tyre)||nearestMetric(D0,10)?' = ':'')+L('διάμετρος ','diameter ')+inch(D0):L('⚠️ Δεν καταλαβαίνω το μέγεθος','⚠️ Can’t read the size');
 const ok=[T,g1,lo,fd,m,D0,D1].every(x=>isFinite(x)&&x>0);
 if(!ok){['k0','k1','k2'].forEach(k=>$(k).textContent='–');$('fix').innerHTML=$('plan').innerHTML=$('climb').innerHTML=$('verd').innerHTML='';$('nnote').textContent='';return;}
 const grow=D1/D0;
 $('nnote').innerHTML=(tl(S.ntyre)?'<b>'+tl(S.ntyre)+'</b> = ':'')+L('διάμετρος ','diameter ')+inch(D1)+' · <b class="'+(grow>1?'warn':'good')+'">'+(grow>=1?'+':'')+f((grow-1)*100,1)+'%</b> '+L('από το εργοστασιακό','vs stock');
 if(!/\d{3}\s*\//.test(S.ntyre||'')){const rm=String(S.tyre||'').match(/R\s*(\d{2})/i),eq=nearestMetric(D1,15,rm?rm[1]:'');if(eq)$('nnote').innerHTML+=' · '+L('αντιστοιχεί περίπου σε','roughly equals')+' <b>'+eq+'</b>';}
 const CR0=g1*lo*fd, CR1=CR0/grow, CR2=g1*nlo*nfd/grow;
 $('k0').textContent=f(CR0,1);$('k1').textContent=f(CR1,1);$('k2').textContent=f(CR2,1);
 $('k1').className='v '+(grow>1.005?'bad':'good');
 $('k2').className='v '+(CR2>=CR0*0.98?'good':'warn');
 const pos=c=>Math.min(100,c)/100*100;
 $('scale').innerHTML=`<i class="mk s" style="left:calc(${pos(CR0)}% - 2px)"></i><i class="mk" style="left:calc(${pos(CR2)}% - 2px);background:${rating(CR2)[1]}"></i>`;
 const [rt]=rating(CR2);
 $('verd').innerHTML=(grow>1.001?L(`Με τα νέα λάστιχα χάνεις <b>${f((1-1/grow)*100,0)}%</b> από τη δύναμη και το crawl. `,`The new tyres cost you <b>${f((1-1/grow)*100,0)}%</b> of pulling force and crawl. `):'')+
  L(`Με το σχέδιό σου: <b>${f(CR2,1)}:1</b> → ${rt}`,`With your plan: <b>${f(CR2,1)}:1</b> → ${rt}`)+
  (CR2<CR0*0.98?L(' · ακόμα κάτω από το εργοστασιακό.',' · still below stock.'):CR2>CR0*1.25?L(' · πολύ πάνω από το εργοστασιακό, πρόσεξε την αντοχή.',' · well above stock, mind the strength.'):L(' · σωστό ✔',' · on target ✔'));
 /* προτάσεις */
 const fdX=fd*grow, loX=lo*grow, sq=Math.sqrt(grow), fdH=fd*sq, loH=lo*sq;
 const [a,b]=near(fdX),[ha,hb]=near(fdH);
 const pick=(x,y)=>`<button class="chip" style="padding:5px 10px;font-size:.8em" data-fd="${x||''}" data-lo="${y||''}">${L('βάλ’ το','use it')}</button>`;
 $('fix').innerHTML=grow<=1.001?`<div class="note">${L('Το λάστιχο δεν μεγάλωσε, δεν χρειάζεται αλλαγή.','The tyre did not get bigger, no change needed.')}</div>`:`
 <div class="opt"><div class="t">① ${L('Μόνο διαφορικά (και τα δύο)','Axles only (both)')}<small>${L('Διορθώνει και τις στροφές στην εθνική','Also fixes highway revs')} ${a?pick(a,''):''}${b&&b!==a?' '+pick(b,''):''}</small></div><div class="n">${f(fdX,2)}<small>${L('στην αγορά','on the market')}: ${a?f(a,2):'–'} / ${b?f(b,2):'–'}</small></div></div>
 <div class="opt"><div class="t">② ${L('Μόνο βοηθητικό (low)','Transfer case only (low)')}<small>${L('Η εθνική μένει ίδια, μόνο το 4L δυναμώνει','Highway stays the same, only 4L gets stronger')} ${pick('',+loX.toFixed(3))}</small></div><div class="n">${f(loX,3)}<small>${L('κιτ με','kit with')} ≈${f((grow-1)*100,0)}% ${L('μείωση','reduction')}</small></div></div>
 <div class="opt"><div class="t">③ ${L('Λίγο και από τα δύο','A bit of both')}<small>${L('Μοιράζει το φορτίο','Shares the load')} ${pick(hb||ha,+(CR0*grow/(g1*(hb||ha))).toFixed(3))}</small></div><div class="n">${f(fdH,2)} + ${f(loH,3)}<small>${L('π.χ.','e.g.')} ${f(hb||ha,2)} + ${f(CR0*grow/(g1*(hb||ha)),3)}</small></div></div>`;
 document.querySelectorAll('#fix [data-fd]').forEach(btn=>btn.onclick=()=>{S.nfd=btn.dataset.fd?String(btn.dataset.fd):'';S.nlo=btn.dataset.lo?String(btn.dataset.lo):'';save();render();});
 /* σχέδιο */
 const kmh=(cr,D)=>1000*Math.PI*D/1000*60/(cr*1000);
 const hw=(nfd/fd)/grow, spd=grow*fd/nfd;
 const idle=num(S.idle)||800,rr=String(S.rpm||'').match(/\d+/g)||[],rpmA=+(rr[0]||0),rpmB=+(rr[rr.length-1]||0),rpmT=rpmA,rng=(k)=>f(k*rpmA/1000,1)+(rpmB>rpmA?'–'+f(k*rpmB/1000,1):'');
 $('plan').innerHTML=`<div class="opt"><div class="t">🐢 ${L('Crawl στο ρελαντί, χωρίς γκάζι','Idle crawl, no throttle')}<small>${L('1η, 4L, στις','1st, 4L, at')} ${f(idle,0)} rpm · ${L('Εργοστασιακό','Stock')}: ${f(kmh(CR0,D0)*idle/1000,2)} km/h · ${L('όσο πιο αργά, τόσο καλύτερα στα βράχια','the slower, the better on rocks')}</small></div><div class="n">${f(kmh(CR2*grow,D1)*idle/1000,2)}<small>km/h</small></div></div>
 ${rpmT>0?`<div class="opt"><div class="t">💪 ${L('Ταχύτητα στη μέγιστη ροπή','Speed at max torque')}<small>${f(T,0)} Nm ${L('στις','at')} ${S.rpm} rpm · 1η, 4L · ${L('Εργοστασιακό','Stock')}: ${rng(kmh(CR0,D0))} km/h</small></div><div class="n">${rng(kmh(CR2*grow,D1))}<small>km/h</small></div></div>`:''}
 <div class="opt"><div class="t">⚙️ ${L('Ταχύτητα στις 1000 στροφές (1η, 4L)','Speed at 1000 rpm (1st, 4L)')}<small>${L('Εργοστασιακό','Stock')}: ${f(kmh(CR0,D0),2)} km/h</small></div><div class="n">${f(kmh(CR2*grow,D1),2)}<small>km/h</small></div></div>
 <div class="opt"><div class="t">🛣 ${L('Στροφές στην εθνική','Highway revs')}<small>${L('σε σχέση με το εργοστασιακό','vs stock')}</small></div><div class="n ${Math.abs(hw-1)<.03?'good':'warn'}">${hw>=1?'+':''}${f((hw-1)*100,0)}%</div></div>
 <div class="opt"><div class="t">⏱ ${L('Κοντέρ: όταν δείχνει 100','Speedo: when it shows 100')}<small>${L('η πραγματική ταχύτητα (αν μετράει από το κιβώτιο)','actual speed (if read from the gearbox)')}</small></div><div class="n">${f(100*spd,0)}<small>km/h</small></div></div>`;
 /* ανηφόρα */
 const rows=[[L('Εργοστασιακό','Stock'),climb(T,CR0,eff,D0,m,mu,crr)],[L('Νέα λάστιχα','New tyres'),climb(T,CR0,eff,D1,m,mu,crr)],[L('Νέα λάστιχα + σχέδιο','New tyres + plan')+(Tn!==T||mn!==m?' ('+(Tn!==T?f(Tn,0)+' Nm':'')+(Tn!==T&&mn!==m?', ':'')+(mn!==m?f(mn,0)+' kg':'')+')':''),climb(Tn,g1*nlo*nfd,eff,D1,mn,mu,crr)]];
 const ax0=rows[0][1].axle;
 $('stip').innerHTML=(SF.tel?L(SF.tel,SF.ten)+' ':'')+L(`Πρόσφυση μ≈${f(mu,2)} · αντίσταση κύλισης ${f(crr*100,1)}%`,`Grip μ≈${f(mu,2)} · rolling resistance ${f(crr*100,1)}%`);
 $('climb').innerHTML=`<table><tr><th></th><th>${L('Κλίση','Grade')}</th><th>${L('Μοίρες','Degrees')}</th><th>${L('Ροπή αξόνων','Axle torque')}</th></tr>`+
 rows.map(([n,c])=>`<tr><td>${n}<span class="lim">${c.grip?L('ταβάνι: πρόσφυση','limit: grip'):L('ταβάνι: κινητήρας','limit: engine')}</span><div class="bar"><i style="width:${Math.min(100,c.t/45*100)}%;background:${c.grip?'#5f9e7a':'#e8b86d'}"></i></div></td><td>${f(c.pct,0)}%</td><td>${f(c.t,1)}°</td><td>${f(c.axle/1000,1)} kNm<span class="lim ${c.axle>ax0*1.05?'bad':''}">${c===rows[0][1]?L('βάση','base'):(c.axle>=ax0?'+':'')+f((c.axle/ax0-1)*100,0)+'%'}</span></td></tr>`).join('')+`</table>`;
 strengthCalc(T,m,eff,D0,D1,CR0,g1*nlo*nfd,Tn,mn);
}
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
