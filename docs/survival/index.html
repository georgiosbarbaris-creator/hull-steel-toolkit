:"Write on paper the frequencies of the stations in your area (ERT)."}],"te":"Radio","se":"The only news when everything goes down"},{"cat":"gear","id":"g_cook","emoji":"🍳","title":"Μαγειρικά – γκαζάκια","sub":"Ζεστό φαγητό χωρίς ρεύμα","blocks":[{"t":"li","x":"Γκαζάκι camping με φιαλίδια βουτανίου: φθηνό, εύκολο. Στο κρύο (κάτω από ~0 °C) το βουτάνιο δεν δουλεύει καλά – πάρε μείγμα ισοβουτανίου/προπανίου.","e":"Camping stove with butane canisters: cheap, easy. In the cold (below ~0 °C) butane works poorly – get an isobutane/propane mix."},{"t":"li","x":"Εστία οινοπνεύματος: απλή, αθόρυβη, χωρίς κομμάτια που χαλάνε. Αργή.","e":"Alcohol stove: simple, silent, no parts to break. Slow."},{"t":"li","x":"Εστία ξύλων (μικρή, πτυσσόμενη): καύσιμο από τη φύση, για έξω.","e":"Wood stove (small, foldable): fuel from nature, for outdoors."},{"t":"li","x":"Ψησταριά κάρβουνου: ΜΟΝΟ έξω.","e":"Charcoal grill: ONLY outdoors."},{"t":"warn","x":"Καμία εστία με φλόγα μέσα σε κλειστό χώρο ή σκηνή. Μονοξείδιο και φωτιά.","e":"No flame stove inside a closed space or tent. Carbon monoxide and fire."},{"t":"h","x":"Σκεύη","e":"Cookware"},{"t":"li","x":"Κατσαρολάκι ανοξείδωτο ή τιτάνιο με καπάκι (το καπάκι κάνει το βράσιμο 2 φορές πιο γρήγορο).","e":"Stainless steel or titanium pot with a lid (the lid makes boiling 2 times faster)."},{"t":"li","x":"Ανοξείδωτη κούπα που μπαίνει στη φωτιά (για βράσιμο νερού).","e":"Stainless steel mug that can go on the fire (for boiling water)."},{"t":"li","x":"Spork (κουτάλι-πιρούνι), μαχαίρι, σφουγγαράκι, αναπτήρας.","e":"Spork (spoon-fork), knife, small sponge, lighter."},{"t":"li","x":"Οικογένεια: κατσαρόλα 2–3 L, τηγάνι, ξύλινη κουτάλα.","e":"Family: 2–3 L pot, frying pan, wooden spoon."},{"t":"li","x":"Θερμός: κρατάει νερό ζεστό – λιγότερο καύσιμο.","e":"Thermos: keeps water hot – less fuel."},{"t":"tip","x":"Μαγείρεμα «θερμοκουτί»: βράσε ρύζι/όσπρια 5 λεπτά, τύλιξε την κατσαρόλα σε κουβέρτες για 1–2 ώρες. Μαγειρεύεται με λίγο καύσιμο.","e":"\"Haybox\" cooking: boil rice/beans 5 minutes, wrap the pot in blankets for 1–2 hours. It cooks with little fuel."}],"te":"Cooking – camping stoves","se":"Hot food without power"},{"cat":"gear","id":"g_water","emoji":"💧","title":"Νερό: φίλτρα και καθαρισμός","sub":"Τι πραγματικά καθαρίζει","blocks":[{"t":"li","x":"Φίλτρο κοίλων ινών (0,1–0,2 μm): σταματάει βακτήρια και παράσιτα. ΔΕΝ σταματάει ιούς και χημικά.","e":"Hollow-fibre filter (0.1–0.2 μm): stops bacteria and parasites. Does NOT stop viruses and chemicals."},{"t":"li","x":"Purifier (καθαριστής 0,02 μm ή με χημικό): και ιούς. Για πόλεις μετά από καταστροφή, προτίμησε αυτό ή φίλτρο + χλώριο.","e":"Purifier (0.02 μm or with chemical): also viruses. For cities after a disaster, prefer this or filter + chlorine."},{"t":"li","x":"Ταμπλέτες διοξειδίου του χλωρίου: σκοτώνουν σχεδόν τα πάντα, περίμενε 30 λεπτά έως 4 ώρες (δες οδηγίες).","e":"Chlorine dioxide tablets: kill almost everything, wait 30 minutes to 4 hours (see instructions)."},{"t":"li","x":"Βράσιμο: το πιο σίγουρο για μικρόβια. Δεν καθαρίζει χημικά.","e":"Boiling: the surest against germs. Does not remove chemicals."},{"t":"li","x":"Φίλτρο ενεργού άνθρακα: βελτιώνει γεύση, κόβει κάποια χημικά, όχι μικρόβια.","e":"Activated carbon filter: improves taste, removes some chemicals, not germs."},{"t":"li","x":"Φίλτρο βαρύτητας (κουβάς/σακούλα που κρέμεται): ιδανικό για οικογένεια.","e":"Gravity filter (hanging bucket/bag): ideal for a family."},{"t":"tip","x":"Καλύτερος συνδυασμός: προφιλτράρισμα με πανί → φίλτρο → χλώριο ή βράσιμο.","e":"Best combination: pre-filter with cloth → filter → chlorine or boiling."}],"te":"Water: filters and treatment","se":"What really cleans it"},{"cat":"gear","id":"g_tools","emoji":"🔪","title":"Μαχαίρι – εργαλεία","sub":"Τα απαραίτητα","blocks":[{"t":"li","x":"Μαχαίρι σταθερής λάμας 10–12 cm, ανοξείδωτο ή carbon. Για ξύλα, φωτιά, φαγητό.","e":"Fixed-blade knife 10–12 cm, stainless or carbon steel. For wood, fire, food."},{"t":"li","x":"Πολυεργαλείο με πένσα: για επισκευές.","e":"Multitool with pliers: for repairs."},{"t":"li","x":"Πριόνι πτυσσόμενο: καθαρό κόψιμο ξύλων, καλύτερο και πιο ασφαλές από τσεκούρι.","e":"Folding saw: clean wood cutting, better and safer than an axe."},{"t":"li","x":"Paracord 550: 250 kg αντοχή, 7 εσωτερικές κλωστές.","e":"Paracord 550: 250 kg strength, 7 inner strands."},{"t":"li","x":"Duct tape: επισκευές, επιδέσεις, φουσκάλες.","e":"Duct tape: repairs, bandaging, blisters."},{"t":"li","x":"Φτυάρι πτυσσόμενο: τουαλέτα, φωτιά, χιόνι.","e":"Folding shovel: toilet, fire, snow."},{"t":"li","x":"Λοστός (crowbar): πόρτες μετά από σεισμό.","e":"Crowbar: doors after an earthquake."},{"t":"warn","x":"Έλεγξε τη νομοθεσία για μεταφορά μαχαιριών σε πόλη. Στο σακίδιο σπιτιού δεν υπάρχει θέμα.","e":"Check the law on carrying knives in the city. In the home backpack it is no problem."}],"te":"Knife – tools","se":"The essentials"},{"cat":"gear","id":"g_fire","emoji":"🔥","title":"Φωτιά: αναπτήρες και προσάναμμα","sub":"3 τρόποι, πάντα","blocks":[{"t":"li","x":"Αναπτήρας BIC ή αντίστοιχος: ο πιο αξιόπιστος. Πάρε 3.","e":"BIC lighter or similar: the most reliable. Get 3."},{"t":"li","x":"Αδιάβροχα / αντιανεμικά σπίρτα (storm matches): καίνε και στον αέρα.","e":"Waterproof / windproof matches (storm matches): burn even in wind."},{"t":"li","x":"Ράβδος σιδηροκερίου (ferro rod): χιλιάδες σπίθες, δουλεύει και βρεγμένη.","e":"Ferro rod: thousands of sparks, works even when wet."},{"t":"li","x":"Προσάναμμα έτοιμο: βαμβάκι με βαζελίνη σε κουτάκι φιλμ/zip, κύβοι προσανάμματος, κομμάτια κουκουναριάς με ρετσίνι.","e":"Ready tinder: cotton with petroleum jelly in a film canister/zip bag, fire starter cubes, pine cone pieces with resin."}],"te":"Fire: lighters and tinder","se":"3 ways, always"},{"cat":"gear","id":"g_clothes","emoji":"🧥","title":"Ρούχα – παπούτσια","sub":"Σύστημα στρώσεων","blocks":[{"t":"step","x":"Βάση (στο δέρμα): merino μαλλί ή συνθετικό που βγάζει ιδρώτα. ΟΧΙ βαμβάκι.","e":"Base (next to skin): merino wool or synthetic that wicks sweat. NO cotton."},{"t":"step","x":"Μόνωση: fleece ή μπουφάν πούπουλο/συνθετικό.","e":"Insulation: fleece or down/synthetic jacket."},{"t":"step","x":"Εξωτερικό: αδιάβροχο αντιανεμικό με κουκούλα (Gore-Tex ή παρόμοιο).","e":"Outer: waterproof windproof shell with hood (Gore-Tex or similar)."},{"t":"li","x":"Βγάζεις στρώση ΠΡΙΝ ιδρώσεις. Ο ιδρώτας στο κρύο = υποθερμία.","e":"Remove a layer BEFORE you sweat. Sweat in the cold = hypothermia."},{"t":"warn","x":"«Το βαμβάκι σκοτώνει» στο κρύο: βρεγμένο, χάνει τη ζέστη και δεν στεγνώνει.","e":"\"Cotton kills\" in the cold: when wet, it loses warmth and does not dry."},{"t":"h","x":"Παπούτσια","e":"Footwear"},{"t":"li","x":"Πεζοπορίας, φορεμένα, με καλή σόλα. Στη φωτιά: δερμάτινα, όχι συνθετικά διχτυωτά.","e":"Hiking boots, broken in, with a good sole. Near fire: leather, not synthetic mesh."},{"t":"li","x":"Μάλλινες κάλτσες + ένα εφεδρικό ζευγάρι πάντα στεγνό σε σακουλάκι.","e":"Wool socks + one spare pair always dry in a small bag."},{"t":"li","x":"Σκούφος: ο φθηνότερος τρόπος να ζεσταθείς.","e":"Beanie: the cheapest way to get warm."}],"te":"Clothes – footwear","se":"Layering system"},{"cat":"gear","id":"g_masks","emoji":"😷","title":"Μάσκες – προστασία","sub":"Τι προστατεύει από τι","blocks":[{"t":"li","x":"FFP2: σκόνη, καπνός (σωματίδια), ιοί. Για σεισμό, φωτιά.","e":"FFP2: dust, smoke (particles), viruses. For earthquake, fire."},{"t":"li","x":"FFP3: περισσότερη προστασία σε σωματίδια, ραδιενεργή σκόνη.","e":"FFP3: more protection against particles, radioactive dust."},{"t":"li","x":"Μάσκα με φίλτρα (ημίσεια/ολόκληρη) A2B2E2K2-P3: αέρια και ατμοί – θέλει εκπαίδευση, εφαρμογή χωρίς γένια.","e":"Respirator with filters (half/full face) A2B2E2K2-P3: gases and vapours – needs training, a fit without a beard."},{"t":"warn","x":"Καμία μάσκα σωματιδίων δεν προστατεύει από αέρια ή μονοξείδιο του άνθρακα.","e":"No particle mask protects against gases or carbon monoxide."},{"t":"li","x":"Γυαλιά προστασίας κλειστού τύπου για στάχτη και καπνό.","e":"Closed safety goggles for ash and smoke."}],"te":"Masks – protection","se":"What protects from what"},{"cat":"gear","id":"g_nav","emoji":"🗺️","title":"Χάρτης – πυξίδα – GPS","sub":"Μην στηρίζεσαι μόνο στο κινητό","blocks":[{"t":"li","x":"Χάρτινος χάρτης της περιοχής σου και των διαδρομών διαφυγής.","e":"Paper map of your area and your escape routes."},{"t":"li","x":"Πυξίδα με πλάκα (baseplate) – φθηνή και δεν θέλει μπαταρία.","e":"Baseplate compass – cheap and needs no battery."},{"t":"li","x":"Στο κινητό: κατέβασε από πριν offline χάρτες (Google Maps offline, Organic Maps, Maps.me). Το GPS δουλεύει χωρίς internet.","e":"On the phone: download offline maps in advance (Google Maps offline, Organic Maps, Maps.me). GPS works without internet."},{"t":"li","x":"Στην εφαρμογή: η 🧭 Πυξίδα δείχνει συντεταγμένες και σε οδηγεί πίσω στα σημεία σου χωρίς internet.","e":"In the app: the 🧭 “Compass” shows coordinates and guides you back to your saved points without internet."}],"te":"Map – compass – GPS","se":"Don't rely only on your phone"},{"cat":"gear","id":"g_store","emoji":"📦","title":"Αποθήκευση – ανανέωση","sub":"Να μη χαλάσουν","blocks":[{"t":"li","x":"Νερό εμφιαλωμένο: σε σκοτεινό δροσερό μέρος, όχι δίπλα σε χημικά. Άλλαζέ το όπως λέει η ημερομηνία.","e":"Bottled water: in a dark cool place, not next to chemicals. Replace it as the date says."},{"t":"li","x":"Τρόφιμα: «πρώτα μπαίνει, πρώτα φεύγει». Τρως από το απόθεμα και αναπληρώνεις.","e":"Food: \"first in, first out\". Eat from the stock and refill."},{"t":"li","x":"Μπαταρίες εκτός συσκευών. Powerbank φόρτιση κάθε 3 μήνες.","e":"Batteries out of devices. Power bank charging every 3 months."},{"t":"li","x":"Φάρμακα: έλεγχος λήξεων κάθε 6 μήνες.","e":"Medicines: check expiry dates every 6 months."},{"t":"li","x":"Σακίδιο: αλλαγή ρούχων ανά εποχή (Μάρτιο & Σεπτέμβριο).","e":"Backpack: change clothes by season (March & September)."},{"t":"tip","x":"Βάλε υπενθύμιση στο ημερολόγιο του κινητού για 1η Μαρτίου και 1η Σεπτεμβρίου: «Έλεγχος κιτ επιβίωσης».","e":"Set a reminder in your phone calendar for 1 March and 1 September: “Survival kit check”."}],"te":"Storage – rotation","se":"So nothing goes bad"},{"cat":"wild","id":"w_rule3","emoji":"3️⃣","title":"Ο κανόνας των 3","sub":"Τι είναι πιο επείγον","blocks":[{"t":"li","x":"3 ΛΕΠΤΑ χωρίς αέρα (ή με μεγάλη αιμορραγία).","e":"3 MINUTES without air (or with heavy bleeding)."},{"t":"li","x":"3 ΩΡΕΣ χωρίς προστασία σε σκληρό καιρό (κρύο, βροχή, καύσωνας).","e":"3 HOURS without protection in harsh weather (cold, rain, heatwave)."},{"t":"li","x":"3 ΜΕΡΕΣ χωρίς νερό.","e":"3 DAYS without water."},{"t":"li","x":"3 ΕΒΔΟΜΑΔΕΣ χωρίς φαγητό.","e":"3 WEEKS without food."},{"t":"h","x":"Άρα η σειρά είναι:","e":"So the order is:"},{"t":"step","x":"Ασφάλεια και πρώτες βοήθειες.","e":"Safety and first aid."},{"t":"step","x":"Καταφύγιο – ζέστη/δροσιά.","e":"Shelter – warmth/cooling."},{"t":"step","x":"Νερό.","e":"Water."},{"t":"step","x":"Σήματα για να σε βρουν.","e":"Signals so they can find you."},{"t":"step","x":"Φαγητό (το τελευταίο!).","e":"Food (last!)."},{"t":"tip","x":"Και πάνω από όλα: ΨΥΧΡΑΙΜΙΑ και θέληση. Όσοι επιβιώνουν συνήθως δεν είναι οι πιο δυνατοί, αλλά όσοι δεν τα παρατάνε.","e":"And above all: STAY CALM and keep the will to live. Survivors are usually not the strongest, but those who do not give up."}],"te":"The rule of 3","se":"What is most urgent"},{"cat":"wild","id":"w_mind","emoji":"🧠","title":"Μυαλό – ψυχραιμία","sub":"Το πιο σημαντικό εργαλείο","blocks":[{"t":"li","x":"Ανάσα 4-4-4-4: εισπνοή 4, κράτα 4, εκπνοή 4, κράτα 4. Τρεις φορές. Ηρεμεί τον πανικό.","e":"Box breathing 4-4-4-4: breathe in 4, hold 4, breathe out 4, hold 4. Three times. It calms panic."},{"t":"li","x":"Κάνε ΜΙΚΡΑ βήματα: «τώρα φτιάχνω το καταφύγιο», όχι «πώς θα σωθώ».","e":"Take SMALL steps: “now I build the shelter”, not “how will I get out of this”."},{"t":"li","x":"Ρουτίνα: ώρες για νερό, φαγητό, ύπνο, έλεγχο. Η ρουτίνα κρατάει το μυαλό.","e":"Routine: set times for water, food, sleep, checks. Routine keeps the mind steady."},{"t":"li","x":"Δώσε σε όλους δουλειά, και στα παιδιά. Η δουλειά διώχνει τον φόβο.","e":"Give everyone a job, children too. Work drives fear away."},{"t":"li","x":"Μίλα, γράψε ημερολόγιο, προσευχήσου αν σε βοηθάει. Σκέψου αυτούς που σε περιμένουν.","e":"Talk, keep a diary, pray if it helps you. Think of the people waiting for you."},{"t":"li","x":"Μετά την κρίση: είναι φυσιολογικό να έχεις άγχος, εφιάλτες, θυμό. Μίλα με κάποιον. Ζήτα βοήθεια αν κρατάει.","e":"After the crisis: anxiety, nightmares and anger are normal. Talk to someone. Ask for help if it lasts."}],"te":"Mind – staying calm","se":"The most important tool"},{"cat":"wild","id":"w_shelter","emoji":"🏕️","title":"Καταφύγιο στη φύση","sub":"Από τον αέρα, τη βροχή και το έδαφος","blocks":[{"t":"h","x":"Πού","e":"Where"},{"t":"li","x":"Προστατευμένο από αέρα (πίσω από βράχο, μέσα σε δάσος), ΟΧΙ σε ρέμα ή κοίτη, ΟΧΙ κάτω από ξερά κλαδιά, ΟΧΙ σε κορυφή.","e":"Sheltered from wind (behind a rock, inside a forest), NOT in a stream or dry riverbed, NOT under dead branches, NOT on a summit."},{"t":"li","x":"Κοντά σε νερό αλλά όχι δίπλα (50+ m).","e":"Near water but not next to it (50+ m)."},{"t":"h","x":"Πώς","e":"How"},{"t":"step","x":"Μόνωση από το έδαφος ΠΡΩΤΑ: 20–30 cm κλαδιά, φύλλα, πευκοβελόνες.","e":"Insulate from the ground FIRST: 20–30 cm of branches, leaves, pine needles."},{"t":"step","x":"Μικρό καταφύγιο – ζεσταίνεις μικρό χώρο με το σώμα σου.","e":"Small shelter – you heat a small space with your body."},{"t":"step","x":"Με tarp/νάιλον: σχοινί ανάμεσα σε 2 δέντρα, το πανί σαν «Α», πλευρά προς τον αέρα κλειστή.","e":"With a tarp/plastic sheet: rope between 2 trees, sheet over it like an “A”, windward side closed."},{"t":"step","x":"Χωρίς τίποτα: κλαδί-ραχοκοκαλιά ακουμπισμένο σε κορμό, κλαδιά στα πλάγια σαν πλευρά, από πάνω φύλλα 50+ cm.","e":"With nothing: a ridge pole leaning on a trunk, branches along the sides like ribs, 50+ cm of leaves on top."},{"t":"step","x":"Είσοδος αντίθετα από τον αέρα.","e":"Entrance facing away from the wind."},{"t":"h","x":"Σε χιόνι","e":"In snow"},{"t":"li","x":"Σκάψε κοίλωμα στο χιόνι ή κάτω από έλατο. Τρύπα αερισμού. Το χιόνι μονώνει.","e":"Dig a hollow in the snow or under a fir tree. Make an air hole. Snow insulates."},{"t":"tip","x":"Μεγάλη σακούλα σκουπιδιών με τρύπα για το κεφάλι = αδιάβροχο και αντιανεμικό σε 10 δευτερόλεπτα.","e":"A large bin bag with a hole for the head = waterproof and windproof in 10 seconds."}],"te":"Shelter in the wild","se":"From wind, rain and the ground"},{"cat":"wild","id":"w_water","emoji":"💧","title":"Νερό: πού το βρίσκω","sub":"Κάθε νερό από τη φύση το θεωρώ μολυσμένο","blocks":[{"t":"h","x":"Πόσο χρειάζομαι","e":"How much I need"},{"t":"li","x":"2–3 λίτρα τη μέρα για να πίνεις, ανά άτομο. Με ζέστη ή κόπο: 4–6 λίτρα.","e":"2–3 litres a day for drinking, per person. In heat or hard work: 4–6 litres."},{"t":"li","x":"Συν 1–2 λίτρα για μαγείρεμα και πλύσιμο χεριών.","e":"Plus 1–2 litres for cooking and hand washing."},{"t":"tip","x":"Μη «φυλάς» το νερό στο μπουκάλι ενώ διψάς. Πίνε λίγο-λίγο, αλλά ΠΙΝΕ. Μείωσε τον κόπο και τον ιδρώτα, όχι το νερό.","e":"Do not “save” water in the bottle while you are thirsty. Drink little and often, but DRINK. Cut effort and sweat, not water."},{"t":"warn","x":"Σημάδια αφυδάτωσης: σκούρα ούρα, πονοκέφαλος, ζάλη, ξερό στόμα. Παιδιά και ηλικιωμένοι αφυδατώνονται πιο γρήγορα.","e":"Signs of dehydration: dark urine, headache, dizziness, dry mouth. Children and elderly people dehydrate faster."},{"t":"h","x":"Στο σπίτι (όταν κοπεί το νερό)","e":"At home (when the water is cut off)"},{"t":"li","x":"Θερμοσίφωνας: κλείσε το ρεύμα, κλείσε την παροχή, άνοιξε το κάτω βρυσάκι. 40–120 λίτρα καθαρό νερό.","e":"Water heater: switch off the power, close the supply, open the drain tap at the bottom. 40–120 litres of clean water."},{"t":"li","x":"Καζανάκι (το δοχείο, ΟΧΙ η λεκάνη), αν δεν έχει χημικά ταμπλέτας.","e":"Toilet cistern (the tank, NOT the bowl), if it has no chemical tablets."},{"t":"li","x":"Σωλήνες: άνοιξε τη βρύση στο ψηλότερο σημείο του σπιτιού και μάζεψε από τη χαμηλότερη.","e":"Pipes: open the tap at the highest point of the house and collect from the lowest."},{"t":"li","x":"Κονσέρβες φρούτων και λαχανικών (το υγρό τους), παγάκια στην κατάψυξη.","e":"Canned fruit and vegetables (their liquid), ice cubes in the freezer."},{"t":"li","x":"Μόλις ακούσεις ότι θα κοπεί: γέμισε μπανιέρα, κατσαρόλες και μπουκάλια.","e":"As soon as you hear the water will be cut: fill the bathtub, pots and bottles."},{"t":"warn","x":"Νερό καλοριφέρ, πισίνας, ενυδρείου: μόνο για καζανάκι και πλύσιμο, ΟΧΙ για να πιεις.","e":"Water from radiators, pools, aquariums: only for flushing and washing, NOT for drinking."},{"t":"h","x":"Στη φύση","e":"In the wild"},{"t":"li","x":"Τρεχούμενο νερό (πηγή, ρέμα) είναι καλύτερο από στάσιμο. Η πηγή εκεί που βγαίνει από τον βράχο είναι το καλύτερο.","e":"Running water (spring, stream) is better than still water. A spring where it comes out of the rock is best."},{"t":"li","x":"Ψάξε χαμηλά: χαράδρες, πυθμένες κοιλάδων, πρασινάδα, πλατάνια, καλαμιές, βάτα.","e":"Look low: gorges, valley floors, green vegetation, plane trees, reeds, brambles."},{"t":"li","x":"Μονοπάτια ζώων που κατηφορίζουν, πουλιά που πετάνε χαμηλά και ίσια το σούρουπο, μέλισσες και σφήκες (νερό σε 1–2 km).","e":"Animal trails going downhill, birds flying low and straight at dusk, bees and wasps (water within 1–2 km)."},{"t":"li","x":"Ξερό ρέμα: σκάψε στην εξωτερική πλευρά της στροφής, στο πιο χαμηλό σημείο. Αν βρεις υγρή άμμο, σκάψε 30–50 cm και περίμενε να μαζευτεί.","e":"Dry stream: dig on the outside of a bend, at the lowest point. If you find wet sand, dig 30–50 cm and wait for water to collect."},{"t":"li","x":"Στην παραλία: σκάψε πίσω από την πρώτη αμμοθίνα, πάνω από τη γραμμή της παλίρροιας. Το πρώτο νερό που μαζεύεται είναι λιγότερο αλμυρό.","e":"On the beach: dig behind the first sand dune, above the high-tide line. The first water to collect is less salty."},{"t":"h","x":"Μάζεψε από τον ουρανό","e":"Collect from the sky"},{"t":"step","x":"Βροχή: άπλωσε νάιλον, μουσαμά ή tarp με κλίση προς δοχείο. Άσε τα πρώτα λεπτά να ξεπλύνουν τη σκόνη.","e":"Rain: spread plastic, canvas or a tarp sloping into a container. Let the first minutes rinse off the dust."},{"t":"step","x":"Δροσιά: τα ξημερώματα σκούπισε το γρασίδι με βαμβακερό πανί ή μπλούζα και στύψε. Μισό λίτρο την ώρα με καλή δροσιά.","e":"Dew: at dawn wipe the grass with a cotton cloth or T-shirt and wring it out. Half a litre an hour with good dew."},{"t":"step","x":"Χιόνι και πάγος: λιώσε τα σε κατσαρόλα. Βάλε πρώτα λίγο νερό στον πάτο για να μην καεί. Ο πάγος δίνει περισσότερο νερό από το χιόνι.","e":"Snow and ice: melt them in a pot. Put a little water in the bottom first so it does not burn. Ice gives more water than snow."},{"t":"warn","x":"Μην τρως χιόνι – ρίχνει τη θερμοκρασία του σώματος και φέρνει υποθερμία.","e":"Do not eat snow – it lowers your body temperature and causes hypothermia."},{"t":"h","x":"Σακούλα στα φύλλα (transpiration bag)","e":"Transpiration bag"},{"t":"step","x":"Βάλε διάφανη νάιλον σακούλα γύρω από κλαδί με πολλά πράσινα φύλλα, στον ήλιο.","e":"Put a clear plastic bag around a branch with lots of green leaves, in the sun."},{"t":"step","x":"Δέσε σφιχτά το στόμιο. Βάλε ένα πετραδάκι μέσα για να μαζεύεται το νερό σε μια γωνία.","e":"Tie the opening tightly. Put a small pebble inside so the water collects in one corner."},{"t":"step","x":"Σε 4–6 ώρες έχεις λίγο καθαρό νερό. Βάλε πολλές σακούλες σε διαφορετικά δέντρα.","e":"In 4–6 hours you have a little clean water. Use many bags on different trees."},{"t":"warn","x":"Όχι σε δηλητηριώδη φυτά (π.χ. πικροδάφνη). Αν δεν ξέρεις το φυτό, μην το πιεις.","e":"Not on poisonous plants (e.g. oleander). If you do not know the plant, do not drink it."},{"t":"h","x":"Ηλιακός αποστακτήρας (solar still)","e":"Solar still"},{"t":"step","x":"Σκάψε λάκκο 60 cm πλάτος και 50 cm βάθος, σε ήλιο, σε υγρό έδαφος.","e":"Dig a pit 60 cm wide and 50 cm deep, in the sun, in damp ground."},{"t":"step","x":"Βάλε δοχείο στο κέντρο. Γύρω βάλε πράσινα φύλλα ή αλμυρό/βρόμικο νερό ή ούρα.","e":"Put a container in the centre. Around it put green leaves or salty/dirty water or urine."},{"t":"step","x":"Σκέπασε με διάφανο νάιλον, κλείσε τις άκρες με χώμα, βάλε πέτρα στο κέντρο, ακριβώς πάνω από το δοχείο.","e":"Cover with clear plastic, seal the edges with soil, put a stone in the centre, right above the container."},{"t":"step","x":"Το νερό εξατμίζεται, κάνει σταγόνες στο νάιλον και στάζει στο δοχείο ΚΑΘΑΡΟ.","e":"Water evaporates, forms drops on the plastic and drips CLEAN into the container."},{"t":"tip","x":"Δίνει λίγο (0,2–0,5 λίτρα τη μέρα). Είναι για ανάγκη, όχι για να ζήσεις από αυτό.","e":"It gives little (0.2–0.5 litres a day). It is for emergencies, not to live on."},{"t":"h","x":"Νερό που ΔΕΝ πίνεις","e":"Water you DO NOT drink"},{"t":"warn","x":"ΠΟΤΕ θαλασσινό νερό, ούρα ή αλκοόλ – σε αφυδατώνουν πιο γρήγορα.","e":"NEVER seawater, urine or alcohol – they dehydrate you faster."},{"t":"warn","x":"Πλημμύρα: το νερό έχει λύματα, πετρέλαια και χημικά. Ούτε με καθαρισμό αν υπάρχει άλλη λύση.","e":"Flood water: it contains sewage, oil and chemicals. Not even treated, if there is another option."},{"t":"warn","x":"Απόφυγε νερό με νεκρά ζώα κοντά, με πράσινο-μπλε αφρό (κυανοβακτήρια – οι τοξίνες ΔΕΝ φεύγουν με βράσιμο), κάτω από χωριά, χωράφια με φάρμακα, ορυχεία, εργοστάσια.","e":"Avoid water with dead animals nearby, with green-blue scum (cyanobacteria – the toxins are NOT removed by boiling), downstream of villages, sprayed fields, mines, factories."}],"te":"Water: where to find it","se":"Treat all water from nature as contaminated"},{"cat":"wild","id":"w_water2","emoji":"🚰","title":"Φίλτρο & καθαρισμός νερού","sub":"Βράσιμο, χλωρίνη, ταμπλέτες, φίλτρα, DIY φίλτρο","blocks":[{"t":"h","x":"Τα 3 βήματα","e":"The 3 steps"},{"t":"step","x":"ΔΙΑΥΓΑΣΗ: βγάζω λάσπη και σκουπίδια (κατακάθισμα, πανί, φίλτρο από άμμο).","e":"CLARIFY: remove mud and debris (settling, cloth, sand filter)."},{"t":"step","x":"ΦΙΛΤΡΑΡΙΣΜΑ: βγάζω βακτήρια και παράσιτα (φίλτρο 0,1–0,2 μm).","e":"FILTER: remove bacteria and parasites (0.1–0.2 μm filter)."},{"t":"step","x":"ΑΠΟΛΥΜΑΝΣΗ: σκοτώνω και τους ιούς (βράσιμο, χλωρίνη, ταμπλέτες, UV).","e":"DISINFECT: kill viruses too (boiling, bleach, tablets, UV)."},{"t":"tip","x":"Θολό νερό; Πάντα πρώτα το 1. Η λάσπη «κρύβει» τα μικρόβια από τη χλωρίνη και τον ήλιο, και βουλώνει τα φίλτρα.","e":"Cloudy water? Always do step 1 first. Mud “hides” germs from bleach and sunlight, and clogs filters."},{"t":"h","x":"1. Βράσιμο – το πιο σίγουρο","e":"1. Boiling – the surest method"},{"t":"step","x":"Πέρασε το νερό από πανί αν είναι θολό.","e":"Pass the water through a cloth if it is cloudy."},{"t":"step","x":"Φέρε σε ΔΥΝΑΤΟ βρασμό (μεγάλες φυσαλίδες) για 1 λεπτό. Πάνω από 2000 m υψόμετρο: 3 λεπτά.","e":"Bring to a ROLLING boil (big bubbles) for 1 minute. Above 2000 m altitude: 3 minutes."},{"t":"step","x":"Άφησέ το να κρυώσει σκεπασμένο. Για να φύγει η «άνοστη» γεύση, χτύπησέ το από δοχείο σε δοχείο.","e":"Let it cool covered. To remove the “flat” taste, pour it back and forth between containers."},{"t":"li","x":"Σκοτώνει ΟΛΑ τα μικρόβια: βακτήρια, ιούς, παράσιτα.","e":"Kills ALL germs: bacteria, viruses, parasites."},{"t":"warn","x":"ΔΕΝ βγάζει αλάτι, χημικά, πετρέλαια, βαρέα μέταλλα ή τοξίνες από φύκια.","e":"Does NOT remove salt, chemicals, oil, heavy metals or algae toxins."},{"t":"tip","x":"Χωρίς κατσαρόλα: πλαστικό μπουκάλι γεμάτο ΤΕΛΕΙΩΣ νερό, κρεμασμένο πάνω από κάρβουνα (όχι φλόγα), βράζει χωρίς να λιώσει. Ή ζέστανε πέτρες στη φωτιά και ρίξ' τες σε δοχείο με νερό (όχι πέτρες από ποτάμι – σκάνε).","e":"No pot: a plastic bottle filled COMPLETELY with water, hung over embers (not flames), boils without melting. Or heat stones in the fire and drop them into a container of water (not river stones – they explode)."},{"t":"h","x":"2. Χλωρίνη του σπιτιού","e":"2. Household bleach"},{"t":"step","x":"ΜΟΝΟ απλή χλωρίνη, χωρίς άρωμα, χωρίς απορρυπαντικό (5–6% υποχλωριώδες νάτριο, γράφει στην ετικέτα).","e":"ONLY plain bleach, unscented, no detergent (5–6% sodium hypochlorite, it says on the label)."},{"t":"step","x":"Καθαρό νερό: 2 σταγόνες ανά λίτρο (8 σταγόνες ανά 4 λίτρα).","e":"Clear water: 2 drops per litre (8 drops per 4 litres)."},{"t":"step","x":"Θολό ή πολύ κρύο νερό: 4 σταγόνες ανά λίτρο.","e":"Cloudy or very cold water: 4 drops per litre."},{"t":"step","x":"Ανακάτεψε και περίμενε 30 λεπτά (κρύο νερό: 1 ώρα).","e":"Stir and wait 30 minutes (cold water: 1 hour)."},{"t":"step","x":"Πρέπει να μυρίζει ΕΛΑΦΡΑ χλώριο. Αν δεν μυρίζει, ξαναβάλε την ίδια δόση και περίμενε άλλα 15 λεπτά.","e":"It should smell SLIGHTLY of chlorine. If it does not, add the same dose again and wait another 15 minutes."},{"t":"li","x":"Σκοτώνει βακτήρια και ιούς. Κάποια παράσιτα (κρυπτοσπορίδιο) αντέχουν.","e":"Kills bacteria and viruses. Some parasites (Cryptosporidium) survive."},{"t":"tip","x":"Βάλε ένα μικρό σταγονόμετρο με χλωρίνη στο σακίδιο. Η χλωρίνη χάνει δύναμη μετά από 6–12 μήνες – άλλαζέ την.","e":"Keep a small dropper bottle of bleach in your backpack. Bleach loses strength after 6–12 months – replace it."},{"t":"h","x":"3. Ταμπλέτες","e":"3. Tablets"},{"t":"li","x":"Διοξείδιο του χλωρίου (π.χ. Micropur MP1, Aquamira): σκοτώνει ΚΑΙ τα παράσιτα. Περίμενε 30 λεπτά για βακτήρια/ιούς και 4 ώρες για κρυπτοσπορίδιο. Η καλύτερη ταμπλέτα για το σακίδιο.","e":"Chlorine dioxide (e.g. Micropur MP1, Aquamira): kills parasites TOO. Wait 30 minutes for bacteria/viruses and 4 hours for Cryptosporidium. The best tablet for the backpack."},{"t":"li","x":"NaDCC / χλώριο (π.χ. Aquatabs): γρήγορες, φθηνές, όπως η χλωρίνη.","e":"NaDCC / chlorine (e.g. Aquatabs): fast, cheap, like bleach."},{"t":"li","x":"Ιώδιο: 5 σταγόνες βάμμα ιωδίου 2% ανά λίτρο, 30 λεπτά. ΟΧΙ για εγκύους, παιδιά, παθήσεις θυρεοειδούς ή χρήση πάνω από λίγες εβδομάδες.","e":"Iodine: 5 drops of 2% iodine tincture per litre, 30 minutes. NOT for pregnant women, children, thyroid conditions or use for more than a few weeks."},{"t":"tip","x":"Ακολούθα ΠΑΝΤΑ τη συσκευασία. Κοίτα την ημερομηνία λήξης.","e":"ALWAYS follow the package instructions. Check the expiry date."},{"t":"h","x":"4. Φορητά φίλτρα","e":"4. Portable filters"},{"t":"li","x":"Φίλτρα κοίλων ινών 0,1 μm (Sawyer Squeeze/Mini, LifeStraw, Katadyn BeFree): κόβουν βακτήρια και παράσιτα, όχι ιούς. Ελαφριά, φθηνά, φιλτράρουν χιλιάδες λίτρα.","e":"0.1 μm hollow-fibre filters (Sawyer Squeeze/Mini, LifeStraw, Katadyn BeFree): stop bacteria and parasites, not viruses. Light, cheap, filter thousands of litres."},{"t":"li","x":"Φίλτρα κεραμικά (π.χ. Katadyn): ανθεκτικά, καθαρίζονται με βούρτσα.","e":"Ceramic filters (e.g. Katadyn): tough, cleaned with a brush."},{"t":"li","x":"Φίλτρα με ενεργό άνθρακα: βελτιώνουν τη γεύση και κόβουν κάποια χημικά – μόνα τους δεν σκοτώνουν μικρόβια.","e":"Activated carbon filters: improve taste and remove some chemicals – on their own they do not kill germs."},{"t":"step","x":"Φιλτράρισε από το πιο καθαρό σημείο, όχι από τον βυθό.","e":"Filter from the cleanest spot, not from the bottom."},{"t":"step","x":"Μην αφήνεις το «βρόμικο» στόμιο να ακουμπήσει το καθαρό μπουκάλι.","e":"Do not let the “dirty” end touch the clean bottle."},{"t":"step","x":"Ξέπλυνε ανάποδα (backflush) όταν πέφτει η ροή.","e":"Backflush when the flow drops."},{"t":"warn","x":"Ο ΠΑΓΟΣ ΧΑΛΑΕΙ τα φίλτρα ινών χωρίς να φαίνεται. Το χειμώνα κοιμήσου με το φίλτρο μέσα στο sleeping bag.","e":"FREEZING DAMAGES fibre filters without showing it. In winter sleep with the filter inside your sleeping bag."},{"t":"warn","x":"Στην πλημμύρα ή κοντά σε χωριά (λύματα = ιοί): μετά το φίλτρο βάλε ΚΑΙ χλωρίνη ή βράσε.","e":"In floods or near villages (sewage = viruses): after filtering ALSO add bleach or boil."},{"t":"li","x":"UV στυλό (π.χ. SteriPEN): σκοτώνει όλα τα μικρόβια σε 90″ σε ΔΙΑΥΓΕΣ νερό. Θέλει μπαταρία.","e":"UV pen (e.g. SteriPEN): kills all germs in 90″ in CLEAR water. Needs a battery."},{"t":"h","x":"5. Ήλιος – SODIS","e":"5. Sun – SODIS"},{"t":"step","x":"Διάφανο πλαστικό μπουκάλι PET έως 2 λίτρα, χωρίς ετικέτα, ΧΩΡΙΣ γρατζουνιές.","e":"Clear PET plastic bottle up to 2 litres, no label, NO scratches."},{"t":"step","x":"Γέμισέ το με ΔΙΑΥΓΕΣ νερό (αν διαβάζεις γράμματα από πίσω, είναι εντάξει).","e":"Fill it with CLEAR water (if you can read letters through it, it is fine)."},{"t":"step","x":"Ξάπλωσέ το στον ήλιο, ιδανικά πάνω σε λαμαρίνα ή στέγη, 6 ώρες. Με συννεφιά: 2 μέρες. Με βροχή: δεν δουλεύει.","e":"Lay it in the sun, ideally on metal sheeting or a roof, for 6 hours. Cloudy: 2 days. Rain: it does not work."},{"t":"tip","x":"Τελευταία λύση, αλλά καλύτερη από το τίποτα. Δεν χρειάζεται καύσιμο.","e":"Last resort, but better than nothing. Needs no fuel."},{"t":"h","x":"DIY φίλτρο με μπουκάλι","e":"DIY bottle filter"},{"t":"step","x":"Κόψε τον πάτο από πλαστικό μπουκάλι 1,5–2 λίτρων και γύρισέ το ανάποδα (το καπάκι κάτω, τρυπημένο ή ξεβιδωμένο).","e":"Cut the bottom off a 1.5–2 litre plastic bottle and turn it upside down (cap at the bottom, pierced or unscrewed)."},{"t":"step","x":"Στον λαιμό βάλε βαμβάκι, γάζα ή κομμάτι μπλούζας.","e":"Put cotton wool, gauze or a piece of T-shirt in the neck."},{"t":"step","x":"Από πάνω 3–5 cm θρυμματισμένο ΚΑΡΒΟΥΝΟ από τη φωτιά σου (όχι μπρικέτες με χημικά).","e":"On top, 3–5 cm of crushed CHARCOAL from your fire (not briquettes with chemicals)."},{"t":"step","x":"Μετά λεπτή άμμο, μετά χοντρή άμμο, πάνω-πάνω ψιλό χαλίκι.","e":"Then fine sand, then coarse sand, fine gravel on the very top."},{"t":"step","x":"Ρίξε νερό σιγά. Πέτα το νερό από τα πρώτα 2–3 γεμίσματα (βγάζει σκόνη από το κάρβουνο).","e":"Pour water slowly. Throw away the water from the first 2–3 fillings (it washes out charcoal dust)."},{"t":"warn","x":"Αυτό το φίλτρο μόνο ΔΙΑΥΓΑΖΕΙ. ΔΕΝ κάνει το νερό πόσιμο. Μετά ΠΑΝΤΑ βράσιμο, χλωρίνη ή ταμπλέτα.","e":"This filter only CLARIFIES. It does NOT make water safe to drink. ALWAYS boil, add bleach or a tablet afterwards."},{"t":"tip","x":"Γρήγορη λύση: δέσε μια κάλτσα ή μπλούζα σε σχήμα χωνιού, γέμισέ τη με άμμο και ρίξε το νερό από πάνω.","e":"Quick fix: tie a sock or T-shirt into a funnel shape, fill it with sand and pour the water through."},{"t":"h","x":"Αλμυρό ή χημικά – απόσταξη","e":"Salty or chemical water – distillation"},{"t":"li","x":"Μόνο η απόσταξη βγάζει αλάτι και τα περισσότερα χημικά.","e":"Only distillation removes salt and most chemicals."},{"t":"step","x":"Κατσαρόλα με θαλασσινό/βρόμικο νερό στη φωτιά.","e":"Pot with seawater/dirty water on the fire."},{"t":"step","x":"Μέσα, στο κέντρο, μια κούπα πάνω σε πέτρα (να μην ακουμπάει το νερό).","e":"Inside, in the centre, a mug standing on a stone (not touching the water)."},{"t":"step","x":"Σκέπασε με το καπάκι ΑΝΑΠΟΔΑ (το χερούλι προς τα κάτω, πάνω από την κούπα). Βάλε κρύο νερό ή χιόνι πάνω στο καπάκι.","e":"Cover with the lid UPSIDE DOWN (handle pointing down, above the mug). Put cold water or snow on top of the lid."},{"t":"step","x":"Ο ατμός γίνεται σταγόνες στο καπάκι και στάζει καθαρός στην κούπα.","e":"The steam forms drops on the lid and drips clean into the mug."},{"t":"tip","x":"Ή: σωλήνας/καλαμιά από το στόμιο ενός καπακωμένου δοχείου που βράζει, προς δοχείο μέσα σε κρύο νερό.","e":"Or: a tube/reed from the spout of a covered boiling container, leading to a container sitting in cold water."},{"t":"h","x":"Πίνακας γρήγορα","e":"Quick table"},{"t":"li","x":"Θολό νερό → κατακάθισμα + πανί → βράσιμο ή χλωρίνη.","e":"Cloudy water → settling + cloth → boiling or bleach."},{"t":"li","x":"Ρέμα στο βουνό → φίλτρο 0,1 μm (ή βράσιμο).","e":"Mountain stream → 0.1 μm filter (or boiling)."},{"t":"li","x":"Νερό πλημμύρας ή από χωριό → πανί → φίλτρο → ΚΑΙ χλωρίνη ή βράσιμο.","e":"Flood water or water near a village → cloth → filter → AND bleach or boiling."},{"t":"li","x":"Θαλασσινό νερό → μόνο απόσταξη.","e":"Seawater → distillation only."},{"t":"li","x":"Νερό με πετρέλαια, χημικά, πράσινο αφρό → ΜΗΝ το πιεις. Ψάξε άλλο.","e":"Water with oil, chemicals, green scum → DO NOT drink it. Find another source."}],"te":"Water filtering & treatment","se":"Boiling, bleach, tablets, filters, DIY filter"},{"cat":"wild","id":"w_fire","emoji":"🔥","title":"Φωτιά: πώς τη στήνω","sub":"Ζέστη, βράσιμο, σήμα, ηθικό","blocks":[{"t":"h","x":"Τα 3 υλικά – μάζεψέ τα ΠΡΙΝ ανάψεις","e":"The 3 materials – gather them BEFORE you light"},{"t":"li","x":"ΠΡΟΣΑΝΑΜΜΑ (πιάνει με σπίθα): μία μεγάλη χούφτα.","e":"TINDER (catches from a spark): one big handful."},{"t":"li","x":"ΜΙΚΡΑ ΚΛΑΔΙΑ (πάχος σπίρτου έως μολυβιού): ΠΟΛΛΑ – δύο αγκαλιές.","e":"KINDLING (match to pencil thickness): LOTS – two armfuls."},{"t":"li","x":"ΞΥΛΑ (πάχος δαχτύλου έως μπράτσου): αρκετά για όλη τη νύχτα. Όσα νομίζεις, φέρε τα διπλά.","e":"FUEL WOOD (finger to arm thickness): enough for the whole night. Whatever you think, bring double."},{"t":"tip","x":"Η πιο συχνή αποτυχία είναι λίγα μικρά κλαδιά. Η φωτιά πεθαίνει εκεί.","e":"The most common failure is too little kindling. That is where the fire dies."},{"t":"h","x":"Το καλύτερο προσάναμμα","e":"The best tinder"},{"t":"li","x":"Βαμβάκι με βαζελίνη: πιάνει με μία σπίθα και καίει 2–3 λεπτά. Βάλε 10–20 μπαλάκια σε σακουλάκι ή κουτάκι – το Νο1 του σακιδίου.","e":"Cotton balls with petroleum jelly: catch with one spark and burn 2–3 minutes. Put 10–20 balls in a small bag or tin – the No.1 item in your backpack."},{"t":"li","x":"Δαδί (ρετσινωμένο ξύλο από ρίζα ή κούτσουρο πεύκου, μυρίζει ρετσίνι, είναι κοκκινωπό): ανάβει ακόμα και βρεγμένο.","e":"Fatwood (resin-soaked wood from a pine root or stump, smells of resin, reddish): lights even when wet."},{"t":"li","x":"Ρετσίνι πεύκου που τρέχει από τον κορμό.","e":"Pine resin running from the trunk."},{"t":"li","x":"Φλούδα σημύδας, κέδρου, κυπαρισσιού, κληματαριάς – τρίψε την σε χνούδι.","e":"Bark of birch, cedar, cypress, grapevine – rub it into fluff."},{"t":"li","x":"Ξερό χορτάρι, ξερά πευκοβελόνες, φωλιές πουλιών, χνούδι από ψαθί (Typha) και γαϊδουράγκαθα.","e":"Dry grass, dry pine needles, bird nests, cattail (Typha) and thistle fluff."},{"t":"li","x":"Ξύσματα: ξύσε ξερό ξυλάκι με το μαχαίρι σε λεπτές «μπούκλες» που μένουν κολλημένες (feather stick).","e":"Shavings: carve a dry stick with the knife into thin “curls” that stay attached (feather stick)."},{"t":"li","x":"Από το σπίτι/αυτοκίνητο: χαρτί, χαρτόνι αυγών, χνούδι από στεγνωτήριο, αντισηπτικό τζελ (οινόπνευμα), πατατάκια, κερί, γάζα με βαζελίνη από το φαρμακείο.","e":"From home/car: paper, egg cartons, dryer lint, hand sanitiser gel (alcohol), crisps, candle wax, petroleum-jelly gauze from the pharmacy."},{"t":"h","x":"Βροχή και υγρασία","e":"Rain and damp"},{"t":"li","x":"Πάρε ξερά κλαδιά που είναι ΑΚΟΜΑ πάνω στο δέντρο, όχι από το έδαφος.","e":"Take dead branches that are STILL on the tree, not from the ground."},{"t":"li","x":"Κάτω από πεσμένους κορμούς, βράχους, πυκνά έλατα το ξύλο είναι πιο στεγνό.","e":"Under fallen trunks, rocks and dense firs the wood is drier."},{"t":"li","x":"Σκίσε τα χοντρά ξύλα: μέσα είναι στεγνά. Κάνε από αυτά feather sticks.","e":"Split thick wood: the inside is dry. Make feather sticks from it."},{"t":"li","x":"Βάλε τα υγρά ξύλα ΓΥΡΩ από τη φωτιά να στεγνώσουν πριν τα ρίξεις.","e":"Put damp wood AROUND the fire to dry before adding it."},{"t":"li","x":"Βάση από ξυλάκια ή φλούδα, όχι πάνω σε βρεγμένο χώμα ή χιόνι.","e":"Make a base of sticks or bark, not on wet soil or snow."},{"t":"li","x":"Νεκρά κλαδιά που ΣΠΑΝΕ με «κρακ» είναι στεγνά. Αν λυγίζουν, είναι υγρά.","e":"Dead branches that SNAP with a “crack” are dry. If they bend, they are damp."},{"t":"h","x":"Πώς την ανάβω","e":"How to light it"},{"t":"step","x":"Καθάρισε κύκλο 3 m από ξερά. Μακριά από δέντρα, κλαδιά από πάνω και σκηνές. Σε δυνατό αέρα – μην ανάβεις.","e":"Clear a 3 m circle of dry material. Away from trees, overhanging branches and tents. In strong wind – do not light."},{"t":"step","x":"Κύκλος από πέτρες (ΟΧΙ πέτρες από ποτάμι ή βρεγμένες – σκάνε) ή σκάψε λίγο λάκκο.","e":"Ring of stones (NOT river stones or wet stones – they explode) or dig a small pit."},{"t":"step","x":"Βάση από ξερά ξυλάκια. Προσάναμμα στη μέση.","e":"Base of dry sticks. Tinder in the middle."},{"t":"step","x":"Γύρω από το προσάναμμα στήσε τα μικρά κλαδιά σε σχήμα σκηνής (tipi), αφήνοντας «πόρτα» από την πλευρά του αέρα.","e":"Around the tinder stand the kindling in a tent shape (tipi), leaving a “door” on the windward side."},{"t":"step","x":"Άναψε το προσάναμμα από την πλευρά του αέρα. Φύσα απαλά και σταθερά στη βάση, όχι από πάνω.","e":"Light the tinder from the windward side. Blow gently and steadily at the base, not from above."},{"t":"step","x":"Όταν πιάσουν τα μικρά, πρόσθετε σιγά-σιγά μεγαλύτερα. Μην το πνίξεις – η φωτιά θέλει αέρα.","e":"When the kindling catches, slowly add bigger pieces. Do not smother it – fire needs air."},{"t":"h","x":"Σχήματα φωτιάς","e":"Fire lays"},{"t":"li","x":"Tipi (σκηνή): ανάβει γρήγορα, δυνατή φλόγα. Για ζέστη, βράσιμο, σήμα.","e":"Tipi (tent): lights fast, strong flame. For warmth, boiling, signalling."},{"t":"li","x":"Log cabin (σαν καλύβι, ξύλα σταυρωτά): σταθερή, βγάζει ωραία κάρβουνα. Για μαγείρεμα.","e":"Log cabin (crossed logs like a hut): stable, makes good embers. For cooking."},{"t":"li","x":"Lean-to (στηριγμένη): ένα χοντρό ξύλο προς τον αέρα, τα μικρά στηριγμένα πάνω του. Για αέρα.","e":"Lean-to: one thick log toward the wind, kindling leaning on it. For windy conditions."},{"t":"li","x":"Αστέρι: 5–6 χοντρά ξύλα σαν ακτίνες, σπρώχνεις προς τα μέσα όσο καίγονται. Κάνει οικονομία, κρατάει όλη τη νύχτα.","e":"Star: 5–6 thick logs like spokes, push them inward as they burn. Saves wood, lasts all night."},{"t":"li","x":"Dakota (κρυφή): δύο λάκκοι 30 cm που ενώνονται στον πάτο με τούνελ. Φωτιά στον έναν, αέρας από τον άλλο. Λίγος καπνός, λίγα ξύλα, δεν φαίνεται, αντέχει στον αέρα.","e":"Dakota (hidden): two 30 cm pits joined at the bottom by a tunnel. Fire in one, air from the other. Little smoke, little wood, not visible, wind-resistant."},{"t":"h","x":"Ζέστη για ύπνο","e":"Warmth for sleeping"},{"t":"li","x":"Τοίχος-ανακλαστήρας πίσω από τη φωτιά (κορμοί ή πέτρες): γυρίζει τη ζέστη προς το μέρος σου.","e":"Reflector wall behind the fire (logs or stones): turns the heat toward you."},{"t":"li","x":"Κοιμήσου 1–1,5 m από μια μακριά, χαμηλή φωτιά, με τον τοίχο πίσω από τη φωτιά ή πίσω από σένα.","e":"Sleep 1–1.5 m from a long, low fire, with the wall behind the fire or behind you."},{"t":"li","x":"Ζεστές πέτρες (όχι από ποτάμι) τυλιγμένες σε πανί στο sleeping bag, ή μπουκάλι με ζεστό νερό.","e":"Hot stones (not from a river) wrapped in cloth in the sleeping bag, or a bottle of hot water."},{"t":"warn","x":"ΠΟΤΕ φωτιά, μαγκάλι, κάρβουνα ή γκαζάκι μέσα σε σκηνή, αυτοκίνητο ή κλειστό δωμάτιο. Μονοξείδιο του άνθρακα: δεν μυρίζει και σκοτώνει στον ύπνο.","e":"NEVER a fire, brazier, charcoal or gas stove inside a tent, car or closed room. Carbon monoxide: it has no smell and kills in your sleep."},{"t":"h","x":"Ασφάλεια και νόμος","e":"Safety and the law"},{"t":"warn","x":"Στην Ελλάδα, την αντιπυρική περίοδο (1 Μαΐου – 31 Οκτωβρίου) απαγορεύεται η φωτιά σε δάση, αγρούς και ύπαιθρο. Μόνο σε πραγματικό κίνδυνο ζωής, με απόλυτη προσοχή.","e":"In Greece, during the fire season (1 May – 31 October) fires are banned in forests, fields and open country. Only in real danger to life, with extreme care."},{"t":"warn","x":"Πάντα νερό ή χώμα δίπλα σου. Ποτέ μη φεύγεις από αναμμένη φωτιά.","e":"Always keep water or soil next to you. Never leave a burning fire."},{"t":"warn","x":"Σβήσιμο: νερό, ανακάτεμα με ξύλο, ξανά νερό, μέχρι να είναι ΚΡΥΟ στο χέρι. Τα κάρβουνα κάτω από τη στάχτη ξανανάβουν μετά από ώρες.","e":"Putting it out: water, stir with a stick, water again, until it is COLD to the touch. Embers under the ash can reignite hours later."},{"t":"tip","x":"Αν ξεφύγει: μην προσπαθήσεις να τη σβήσεις μόνος αν μεγάλωσε. Φύγε αντίθετα από τον αέρα και κατηφορικά, και κάλεσε 199/112.","e":"If it gets away: do not try to put it out alone if it has grown. Move upwind and downhill, and call 199/112."}],"te":"Fire: how to build it","se":"Warmth, boiling, signal, morale"},{"cat":"wild","id":"w_fire2","emoji":"🪵","title":"8 τρόποι να ανάψεις φωτιά","sub":"Από τον αναπτήρα ως το τόξο","blocks":[{"t":"h","x":"1. Αναπτήρας","e":"1. Lighter"},{"t":"li","x":"Ο πιο εύκολος. Πάρε 2–3 απλούς αναπτήρες με τροχό (π.χ. BIC) – σε διαφορετικές τσέπες.","e":"The easiest. Carry 2–3 simple flint-wheel lighters (e.g. BIC) – in different pockets."},{"t":"li","x":"Στο κρύο το αέριο δεν βγαίνει: κράτα τον στην εσωτερική τσέπη, κοντά στο σώμα.","e":"In the cold the gas will not flow: keep it in an inside pocket, close to your body."},{"t":"li","x":"Βράχηκε; Φύσα και τρίψε τον τροχό σε ρούχο μέχρι να στεγνώσει. Ακόμα και άδειος, ο τροχός βγάζει σπίθες πάνω σε βαμβάκι με βαζελίνη.","e":"Got wet? Blow on it and rub the wheel on clothing until dry. Even empty, the wheel throws sparks onto petroleum-jelly cotton."},{"t":"tip","x":"Με αέρα: κάνε «σπηλιά» με το σώμα και τις παλάμες και άναψε κοντά στο προσάναμμα.","e":"In wind: make a “cave” with your body and palms and light close to the tinder."},{"t":"h","x":"2. Σπίρτα","e":"2. Matches"},{"t":"li","x":"Σπίρτα θύελλας (stormproof): καίνε στον αέρα και ξανανάβουν αφού βραχούν. Σε αδιάβροχο κουτάκι μαζί με την επιφάνεια τριβής.","e":"Stormproof matches: burn in wind and relight after getting wet. In a waterproof case together with the striker."},{"t":"li","x":"Κανονικά σπίρτα: βούτηξε τα κεφάλια σε λιωμένο κερί – γίνονται αδιάβροχα. Ξύσε το κερί πριν τα ανάψεις.","e":"Ordinary matches: dip the heads in melted wax – they become waterproof. Scrape off the wax before lighting."},{"t":"step","x":"Κράτα το σπίρτο με το κεφάλι λίγο προς τα κάτω, για να ανέβει η φλόγα στο ξυλάκι.","e":"Hold the match with the head slightly down, so the flame climbs the stick."},{"t":"step","x":"Φέρε το αμέσως στο προσάναμμα, προστατευμένο από τον αέρα.","e":"Bring it straight to the tinder, sheltered from the wind."},{"t":"h","x":"3. Ράβδος πυρίτη (ferro rod)","e":"3. Ferro rod"},{"t":"li","x":"Δουλεύει βρεγμένη, σε αέρα, σε κρύο, σε χιλιάδες ανάμματα. Η καλύτερη εφεδρεία – βάλε μία στο κιτ σου.","e":"Works wet, in wind, in cold, for thousands of strikes. The best backup – put one in your kit."},{"t":"step","x":"Βάλε την άκρη της ράβδου ΜΕΣΑ στο προσάναμμα.","e":"Put the tip of the rod INTO the tinder."},{"t":"step","x":"Κράτα σταθερό το ξέστρο (ή τη ράχη του μαχαιριού) πάνω στη ράβδο.","e":"Hold the striker (or the knife spine) still against the rod."},{"t":"step","x":"ΤΡΑΒΑ τη ράβδο προς τα πίσω, όχι το ξέστρο προς τα μπρος – έτσι δεν σκορπίζεις το προσάναμμα.","e":"PULL the rod back, do not push the striker forward – this way you do not scatter the tinder."},{"t":"step","x":"Σπίθες στους 3.000 °C πέφτουν στο προσάναμμα. Φύσα απαλά.","e":"Sparks at 3,000 °C fall on the tinder. Blow gently."},{"t":"tip","x":"Με ράβδο μαγνησίου: ξύσε πρώτα ένα σωρό ρινίσματα σε μέγεθος νομίσματος πάνω στο προσάναμμα και μετά ρίξε σπίθα.","e":"With a magnesium rod: first scrape a coin-sized pile of shavings onto the tinder, then strike a spark."},{"t":"h","x":"4. Μπαταρία και σύρμα κουζίνας","e":"4. Battery and steel wool"},{"t":"li","x":"Χρειάζεσαι πολύ λεπτό ατσαλόσυρμα (σύρμα κουζίνας 0000, όχι ανοξείδωτο).","e":"You need very fine steel wool (grade 0000, not stainless)."},{"t":"step","x":"Τέντωσε ένα κομμάτι σύρμα, φούσκωσέ το.","e":"Stretch out a piece of steel wool, fluff it up."},{"t":"step","x":"Ακούμπησε το σύρμα και στους δύο πόλους μπαταρίας 9V – ανάβει αμέσως.","e":"Touch the wool to both terminals of a 9V battery – it lights at once."},{"t":"step","x":"Με μπαταρία AA/AAA ή powerbank: ένα λεπτό νήμα από το σύρμα από τον έναν πόλο στον άλλο.","e":"With an AA/AAA battery or powerbank: one thin strand of wool from one terminal to the other."},{"t":"step","x":"Ρίξε το σύρμα που κοκκινίζει μέσα στο προσάναμμα και φύσα.","e":"Drop the glowing wool into the tinder and blow."},{"t":"warn","x":"Μην κρατάς ποτέ μαζί μπαταρία 9V και σύρμα στην ίδια τσέπη – μπορεί να ανάψει μόνο του.","e":"Never carry a 9V battery and steel wool in the same pocket – it can ignite by itself."},{"t":"tip","x":"Αυτοκίνητο: ο αναπτήρας του ταμπλό ανάβει χαρτί, βαμβάκι ή φλούδα. Πάντα μακριά από βενζίνη.","e":"Car: the dashboard cigarette lighter lights paper, cotton or bark. Always away from petrol."},{"t":"h","x":"5. Φακός και ήλιος","e":"5. Lens and sun"},{"t":"li","x":"Μεγεθυντικός φακός, γυαλιά ΠΡΕΣΒΥΩΠΙΑΣ (για κοντά – τα γυαλιά μυωπίας δεν δουλεύουν), φακός κιάλιου ή κάμερας, φακός Fresnel σε μέγεθος κάρτας.","e":"Magnifying glass, READING glasses (for close-up – glasses for short-sightedness do not work), binocular or camera lens, card-sized Fresnel lens."},{"t":"li","x":"Και: διάφανο μπουκάλι ή σακουλάκι γεμάτο νερό, πάγος λειασμένος σε φακό.","e":"Also: a clear bottle or bag full of water, ice polished into a lens."},{"t":"step","x":"Μόνο με δυνατό ήλιο, ιδανικά 10:00–15:00.","e":"Only in strong sun, ideally 10:00–15:00."},{"t":"step","x":"Σκούρο, ξερό προσάναμμα: char cloth, σάπιο ξερό ξύλο (ίσκα), μαυρισμένο χαρτί.","e":"Dark, dry tinder: char cloth, dry rotten wood (punk), blackened paper."},{"t":"step","x":"Κράτα τον φακό ώστε η φωτεινή κουκκίδα να γίνει όσο πιο ΜΙΚΡΗ γίνεται, και ΑΚΙΝΗΤΗ.","e":"Hold the lens so the bright dot is as SMALL as possible, and STILL."},{"t":"step","x":"Μόλις βγει καπνός και κόκκινη κουκκίδα, βάλ' το σε προσάναμμα και φύσα.","e":"As soon as smoke and a red dot appear, put it into tinder and blow."},{"t":"tip","x":"Δεν θέλει καύσιμο ποτέ. Βάλε ένα φακό Fresnel στο πορτοφόλι.","e":"Never needs fuel. Keep a Fresnel lens in your wallet."},{"t":"h","x":"6. Πυρόλιθος, ατσάλι και char cloth","e":"6. Flint, steel and char cloth"},{"t":"li","x":"Ατσάλι με πολύ άνθρακα (παλιά λίμα, ράχη μαχαιριού carbon) + σκληρή πέτρα με κοφτερή άκρη (πυρόλιθος, χαλαζίας).","e":"High-carbon steel (old file, carbon knife spine) + hard stone with a sharp edge (flint, quartz)."},{"t":"step","x":"Κράτα την πέτρα με ένα κομμάτι char cloth πάνω της, κάτω από την κοφτερή άκρη.","e":"Hold the stone with a piece of char cloth on it, just below the sharp edge."},{"t":"step","x":"Χτύπα το ατσάλι προς τα κάτω, ξυστά πάνω στην άκρη της πέτρας. Οι σπίθες πέφτουν στο char cloth.","e":"Strike the steel downward, glancing off the edge of the stone. The sparks fall on the char cloth."},{"t":"step","x":"Όταν το πανί κάνει κόκκινη κουκκίδα, βάλ' το μέσα σε «φωλιά» από ξερό χορτάρι, κλείσε την και φύσα μέχρι να πάρει φλόγα.","e":"When the cloth shows a red dot, put it inside a “nest” of dry grass, close it and blow until it flames."},{"t":"h","x":"Φτιάξε char cloth (στο σπίτι ή στη φωτιά)","e":"Make char cloth (at home or on the fire)"},{"t":"step","x":"Κόψε 100% βαμβακερό πανί (παλιό τζιν, μπλούζα) σε τετράγωνα 5×5 cm.","e":"Cut 100% cotton cloth (old jeans, T-shirt) into 5×5 cm squares."},{"t":"step","x":"Βάλ' τα σε μεταλλικό κουτάκι με μία μικρή τρύπα στο καπάκι.","e":"Put them in a metal tin with one small hole in the lid."},{"t":"step","x":"Βάλε το κουτάκι στη φωτιά. Βγαίνει καπνός από την τρύπα.","e":"Put the tin in the fire. Smoke comes out of the hole."},{"t":"step","x":"Όταν σταματήσει ο καπνός, βγάλε το και άφησέ το να κρυώσει ΚΛΕΙΣΤΟ.","e":"When the smoke stops, take it out and let it cool CLOSED."},{"t":"step","x":"Τα πανάκια πρέπει να είναι μαύρα, όχι στάχτη. Πιάνουν με την πιο μικρή σπίθα.","e":"The squares must be black, not ash. They catch with the smallest spark."},{"t":"h","x":"7. Τόξο (bow drill) – χωρίς τίποτα","e":"7. Bow drill – with nothing"},{"t":"li","x":"Δύσκολο. Θέλει εξάσκηση στο σπίτι, όχι πρώτη φορά σε ανάγκη. Τα ξύλα πρέπει να είναι ΚΑΤΑΞΕΡΑ.","e":"Hard. Needs practice at home, not your first try in an emergency. The wood must be BONE DRY."},{"t":"li","x":"Καλά ξύλα: ιτιά, λεύκα, φλαμουριά, κέδρος, κυπαρίσσι, ρίζα από κισσό. Όχι ρετσινωμένο πεύκο, όχι σκληρή βελανιδιά.","e":"Good woods: willow, poplar, lime (linden), cedar, cypress, ivy root. Not resinous pine, not hard oak."},{"t":"step","x":"Άτρακτος: ίσιο ξυλάκι 20 cm, πάχος αντίχειρα, μυτερό στην πάνω άκρη, στρογγυλό κάτω.","e":"Spindle: straight stick 20 cm, thumb-thick, pointed at the top end, rounded at the bottom."},{"t":"step","x":"Σανίδα: ίδιο ξύλο, πάχος 2 cm. Κάνε ένα λακκάκι κοντά στην άκρη και μια εγκοπή σε σχήμα V (1/8 του κύκλου) από την άκρη ως το κέντρο του λακκακιού.","e":"Hearth board: same wood, 2 cm thick. Make a small depression near the edge and a V-shaped notch (1/8 of the circle) from the edge to the centre of the depression."},{"t":"step","x":"Λαβή από πάνω: πέτρα με βαθούλωμα ή σκληρό ξύλο. Λίπανε με σαπούνι, λίπος ή φύλλα.","e":"Handhold on top: a stone with a hollow or hard wood. Lubricate with soap, fat or leaves."},{"t":"step","x":"Τόξο: κλαδί σε μήκος χεριού, ελαφρώς κυρτό, με κορδόνι ελαφρώς χαλαρό.","e":"Bow: a branch about arm length, slightly curved, with a slightly slack cord."},{"t":"step","x":"Τύλιξε μία φορά την άτρακτο στο κορδόνι. Βάλε φύλλο ή φλούδα κάτω από την εγκοπή.","e":"Wrap the cord once around the spindle. Put a leaf or bark under the notch."},{"t":"step","x":"Πάτα τη σανίδα με το πόδι, το χέρι με τη λαβή κλειδωμένο στο γόνατο.","e":"Hold the board down with your foot, the hand with the handhold locked against your knee."},{"t":"step","x":"Πριόνιζε με μεγάλες, σταθερές κινήσεις, στην αρχή αργά, μετά γρήγορα και με πίεση. Όταν βγαίνει πολύς καπνός και μαύρη σκόνη, κάνε άλλες 10–20.","e":"Saw with long, steady strokes, slowly at first, then fast and with pressure. When there is lots of smoke and black dust, do 10–20 more."},{"t":"step","x":"Η σκόνη στην εγκοπή γίνεται κόκκινο κάρβουνο. Μετάφερέ το ΜΕ ΤΟ ΦΥΛΛΟ στη φωλιά από χορτάρι και φύσα.","e":"The dust in the notch becomes a red ember. Carry it ON THE LEAF to the grass nest and blow."},{"t":"h","x":"8. Φωτιά από τη φωτιά σου – κράτα την ζωντανή","e":"8. Fire from your fire – keep it alive"},{"t":"li","x":"Το πιο εύκολο άναμμα είναι αυτό που δεν χρειάζεται: σκέπασε τα κάρβουνα με στάχτη το βράδυ, το πρωί ξεσκέπασε και ρίξε λεπτά κλαδιά.","e":"The easiest lighting is the one you do not need: cover the embers with ash at night, uncover in the morning and add thin twigs."},{"t":"li","x":"Μεταφορά: κάρβουνο μέσα σε κονσερβοκούτι με τρύπες ή σε ξερό μύκητα (ίσκα), τυλιγμένο σε πράσινα φύλλα.","e":"Carrying: an ember in a tin can with holes or in a dry tinder fungus, wrapped in green leaves."},{"t":"h","x":"Τι να έχεις πάντα μαζί","e":"Always carry"},{"t":"chk","x":"2 αναπτήρες BIC σε διαφορετικές τσέπες","e":"2 BIC lighters in different pockets"},{"t":"chk","x":"Ράβδος πυρίτη","e":"Ferro rod"},{"t":"chk","x":"Σπίρτα θύελλας σε αδιάβροχο κουτάκι","e":"Stormproof matches in a waterproof case"},{"t":"chk","x":"Βαμβάκι με βαζελίνη (10–20 μπαλάκια)","e":"Petroleum-jelly cotton balls (10–20)"},{"t":"chk","x":"Φακός Fresnel σε μέγεθος κάρτας","e":"Card-sized Fresnel lens"},{"t":"chk","x":"Ένα κομμάτι δαδί ή κερί","e":"A piece of fatwood or a candle"},{"t":"chk","x":"Μαχαίρι για ξύσματα (feather sticks)","e":"Knife for shavings (feather sticks)"}],"te":"8 ways to start a fire","se":"From the lighter to the bow drill"},{"cat":"wild","id":"w_car","emoji":"🚙","title":"Ύπνος στο αυτοκίνητο – σαν overlander","sub":"Ζεστά, ασφαλή, χωρίς μονοξείδιο","blocks":[{"t":"warn","x":"ΠΟΤΕ δεν κοιμάσαι με τη μηχανή αναμμένη. Το μονοξείδιο (CO) μπαίνει στην καμπίνα, ειδικά αν το χιόνι κλείσει την εξάτμιση. Δεν μυρίζει και δεν ξυπνάς.","e":"NEVER sleep with the engine running. Carbon monoxide (CO) gets into the cabin, especially if snow blocks the exhaust. It has no smell and you do not wake up."},{"t":"h","x":"Πού παρκάρω","e":"Where I park"},{"t":"li","x":"Επίπεδο σημείο (κοιμάσαι πολύ καλύτερα). Μύτη ή πίσω μέρος προς τον αέρα, ώστε να μη χτυπάει το πλάι.","e":"Level ground (you sleep much better). Nose or rear into the wind, so it does not hit the side."},{"t":"li","x":"ΟΧΙ σε κοίτη ρέματος, κάτω από ξερά κλαδιά/δέντρα, κάτω από πλαγιά με πέτρες ή χιονοστιβάδα, δίπλα σε γκρεμό.","e":"NOT in a stream bed, under dead branches/trees, below a slope with loose rocks or avalanche risk, next to a cliff."},{"t":"li","x":"Μακριά από τον δρόμο (φώτα, εκχιονιστικά), αλλά κάπου που μπορείς να βγεις αν χιονίσει. Στο χιόνι: μύτη προς την έξοδο.","e":"Away from the road (lights, snowploughs), but somewhere you can get out if it snows. In snow: nose toward the exit."},{"t":"li","x":"Πες σε κάποιον πού είσαι (στείλε τις συντεταγμένες από την Πυξίδα).","e":"Tell someone where you are (send the coordinates from the “Compass”)."},{"t":"h","x":"Μόνωση της καμπίνας","e":"Insulating the cabin"},{"t":"step","x":"Μόνωσε τα ΤΖΑΜΙΑ: από εκεί φεύγει η περισσότερη ζέστη. Κομμένα πάνελ από reflectix (αλουμινένια φυσαλίδα) ή αφρώδες υπόστρωμα, στο σχήμα κάθε τζαμιού. Μπαίνουν πιεστά, χωρίς κόλλα.","e":"Insulate the WINDOWS: that is where most heat escapes. Cut panels of reflectix (foil bubble wrap) or foam underlay, shaped to each window. They press-fit, no glue."},{"t":"step","x":"Αυτοσχέδια: κουβέρτες, πετσέτες, ασημοκουβέρτες, χαρτόνια στερεωμένα με τις πόρτες/ηλιοπροστασίες.","e":"Improvised: blankets, towels, foil blankets, cardboard held in by the doors/sun visors."},{"t":"step","x":"Κουρτίνα/κουβέρτα ανάμεσα στα μπροστινά καθίσματα και στο πίσω μέρος – ζεσταίνεις μόνο τον χώρο του ύπνου (μικροκλίμα).","e":"Curtain/blanket between the front seats and the rear – you heat only the sleeping area (microclimate)."},{"t":"step","x":"Στο πάτωμα/πορτμπαγκάζ: υπόστρωμα foam + στρώμα. Το μέταλλο του αυτοκινήτου είναι πολύ κρύο.","e":"On the floor/boot: foam pad + mattress. The car's metal is very cold."},{"t":"h","x":"Αερισμός – υγρασία","e":"Ventilation – condensation"},{"t":"li","x":"Άφησε 1–2 παράθυρα ανοιχτά 1–2 cm (με σήτα ή ανεμοθραύστη). Χωρίς αερισμό η ανάσα σου γίνεται νερό και πάγος στα τζάμια και στον υπνόσακο.","e":"Leave 1–2 windows open 1–2 cm (with a mesh or wind deflector). Without ventilation your breath turns to water and ice on the windows and sleeping bag."},{"t":"li","x":"Πετσέτα μικροϊνών για τα τζάμια το πρωί. Βρεγμένα ρούχα σε σακούλα, όχι ανοιχτά στην καμπίνα.","e":"Microfibre towel for the windows in the morning. Wet clothes in a bag, not spread out in the cabin."},{"t":"h","x":"Ζέστη","e":"Warmth"},{"t":"li","x":"Ο υπνόσακος σε ζεσταίνει, όχι η μηχανή. Χειμώνας στα βόρεια: comfort −15 έως −20 °C, liner, ασημοκουβέρτα από κάτω.","e":"The sleeping bag keeps you warm, not the engine. Winter in the north: comfort −15 to −20 °C, liner, foil blanket underneath."},{"t":"li","x":"Θερμοφόρα με ζεστό νερό (ζέστανε νερό σε γκαζάκι ΕΞΩ από το αυτοκίνητο).","e":"Hot-water bottle (heat water on a gas stove OUTSIDE the car)."},{"t":"li","x":"Αν έχεις diesel heater (αυτόνομο καλοριφέρ): ΜΟΝΟ με σωστή εγκατάσταση, εξάτμιση έξω, και ανιχνευτή CO μέσα. Χωρίς ανιχνευτή CO, όχι.","e":"If you have a diesel heater: ONLY with proper installation, exhaust outside, and a CO detector inside. No CO detector, no heater."},{"t":"li","x":"Αν είσαι εγκλωβισμένος ξύπνιος στο χιόνι: μηχανή μόνο 10 λεπτά κάθε ώρα, εξάτμιση καθαρή από χιόνι, παράθυρο λίγο ανοιχτό.","e":"If you are stuck awake in snow: engine only 10 minutes every hour, exhaust clear of snow, window slightly open."},{"t":"h","x":"Καύσιμα και ασφάλεια","e":"Fuel and safety"},{"t":"warn","x":"Μπιτόνια βενζίνης/πετρελαίου και φιαλίδια γκαζιού ΠΟΤΕ μέσα στην καμπίνα όπου κοιμάσαι. Αναθυμιάσεις και φωτιά. Έξω, στη σχάρα ή σε κλειστό εξωτερικό κουτί.","e":"Petrol/diesel cans and gas canisters NEVER inside the cabin where you sleep. Fumes and fire. Outside, on the roof rack or in a closed external box."},{"t":"warn","x":"Ποτέ γκαζάκι, κερί ή μαγκάλι μέσα στο κλειστό αυτοκίνητο.","e":"Never a gas stove, candle or brazier inside the closed car."},{"t":"li","x":"Ντεπόζιτο πάντα πάνω από τη μέση. Στο κρύο το diesel θέλει αντιπηκτικό/χειμερινό πετρέλαιο.","e":"Fuel tank always above half. In the cold, diesel needs anti-gel additive/winter diesel."},{"t":"li","x":"Μην αδειάσεις τη μπαταρία εκκίνησης με φώτα και φορτίσεις. Ιδανικά δεύτερη μπαταρία (dual battery) ή power station.","e":"Do not drain the starter battery with lights and charging. Ideally a second battery (dual battery) or a power station."},{"t":"li","x":"Κλείδωσε τις πόρτες, κλειδιά σε σταθερό σημείο (π.χ. στην ίδια τσέπη πάντα), φακός κεφαλής δίπλα σου.","e":"Lock the doors, keys in a fixed place (e.g. always the same pocket), head torch next to you."},{"t":"h","x":"Μέσα στον υπνόσακο βάζω","e":"Inside the sleeping bag I put"},{"t":"li","x":"Τα ρούχα της επόμενης μέρας (ζεστά το πρωί).","e":"Next day's clothes (warm in the morning)."},{"t":"li","x":"Το μπουκάλι νερό (να μην παγώσει) και το κινητό/powerbank (το κρύο αδειάζει τις μπαταρίες).","e":"The water bottle (so it does not freeze) and the phone/powerbank (cold drains batteries)."},{"t":"li","x":"Μπουκάλι για ούρηση τη νύχτα (σημαδεμένο!) – δεν βγαίνεις στο κρύο.","e":"A bottle for peeing at night (marked!) – you do not go out into the cold."},{"t":"h","x":"Το πρωί","e":"In the morning"},{"t":"step","x":"Καθάρισε χιόνι από ταράτσα, τζάμια, φώτα, εξάτμιση ΠΡΙΝ ανάψεις μηχανή.","e":"Clear snow from the roof, windows, lights, exhaust BEFORE starting the engine."},{"t":"step","x":"Μάζεψε τα πάνελ, αέρισε την καμπίνα.","e":"Put away the panels, air out the cabin."},{"t":"step","x":"Ζέστανε λίγο τη μηχανή, οδήγα ήπια τα πρώτα χιλιόμετρα.","e":"Warm up the engine a little, drive gently for the first kilometres."},{"t":"h","x":"Αν πρέπει να κινηθείς με το αυτοκίνητο (εκκένωση, χιόνι)","e":"If you must move by car (evacuation, snow)"},{"t":"li","x":"Φύγε με φως, πες τη διαδρομή σε κάποιον, ακολούθησε τις οδηγίες των αρχών και τους κεντρικούς δρόμους.","e":"Leave in daylight, tell someone your route, follow the authorities' instructions and the main roads."},{"t":"li","x":"Αλυσίδες ΜΕΣΑ στο αυτοκίνητο και ξέρεις να τις βάζεις (δοκίμασέ το μια φορά στο σπίτι).","e":"Snow chains INSIDE the car and you know how to fit them (try once at home)."},{"t":"li","x":"Κιτ αυτοκινήτου (δες λίστα), νερό, φαγητό, υπνόσακος για κάθε επιβάτη – μπορεί να μείνεις ώρες ακινητοποιημένος.","e":"Car kit (see list), water, food, a sleeping bag for each passenger – you may be stuck for hours."},{"t":"li","x":"Σε κακοκαιρία: αργά, μεγάλες αποστάσεις, χωρίς απότομα φρένα. Αν δεν βλέπεις, σταμάτα σε ασφαλές σημείο.","e":"In bad weather: slow, long distances between cars, no sudden braking. If you cannot see, stop in a safe place."},{"t":"li","x":"Μην οδηγήσεις ποτέ μέσα σε νερό που τρέχει ή μέσα σε καπνό πυρκαγιάς.","e":"Never drive into flowing water or into wildfire smoke."}],"te":"Sleeping in the car – like an overlander","se":"Warm, safe, no carbon monoxide"},{"cat":"wild","id":"w_signal","emoji":"📣","title":"Σήματα για να σε βρουν","sub":"Γίνε ορατός","blocks":[{"t":"li","x":"ΤΡΙΑ από οτιδήποτε = SOS: 3 σφυρίγματα, 3 φωτιές σε τρίγωνο, 3 λάμψεις.","e":"THREE of anything = SOS: 3 whistle blasts, 3 fires in a triangle, 3 flashes."},{"t":"li","x":"Σφυρίχτρα: ακούγεται πολύ πιο μακριά από φωνή και δεν κουράζει.","e":"Whistle: carries much farther than your voice and does not tire you."},{"t":"li","x":"Καθρέφτης / CD / κινητό: λάμψεις προς αεροπλάνο ή πλοίο. Σημάδεψε με τα δάχτυλα σε σχήμα V.","e":"Mirror / CD / phone: flashes toward an aircraft or ship. Aim with your fingers in a V shape."},{"t":"li","x":"Καπνός τη μέρα: πράσινα κλαδιά πάνω σε δυνατή φωτιά = λευκός καπνός.","e":"Smoke by day: green branches on a strong fire = white smoke."},{"t":"li","x":"Φως τη νύχτα: φακός σε SOS (… – – – …). Στην εφαρμογή: κουμπί 🔦 SOS.","e":"Light at night: torch in SOS (… – – – …). In the app: the 🔦 SOS button."},{"t":"li","x":"Φωτεινά ρούχα/πανιά σε ανοιχτό σημείο.","e":"Bright clothes/cloths in an open spot."},{"t":"h","x":"Σήματα εδάφους προς αεροσκάφος (μεγάλα, 3 m+)","e":"Ground-to-air signals (large, 3 m+)"},{"t":"li","x":"V = Χρειάζομαι βοήθεια","e":"V = I need help"},{"t":"li","x":"X = Χρειάζομαι ιατρική βοήθεια","e":"X = I need medical help"},{"t":"li","x":"Y = Ναι","e":"Y = Yes"},{"t":"li","x":"N = Όχι","e":"N = No"},{"t":"li","x":"→ (βέλος) = Πάω προς τα εκεί","e":"→ (arrow) = I am going this way"},{"t":"h","x":"Σήμα με τα χέρια","e":"Arm signals"},{"t":"li","x":"Και τα δύο χέρια ψηλά σε V = «Χρειάζομαι βοήθεια».","e":"Both arms up in a V = “I need help”."},{"t":"li","x":"Ένα χέρι ψηλά, ένα κάτω = «Δεν χρειάζομαι βοήθεια».","e":"One arm up, one down = “I do not need help”."},{"t":"h","x":"Morse SOS","e":"Morse SOS"},{"t":"li","x":"··· ––– ··· (3 σύντομα, 3 μακριά, 3 σύντομα).","e":"··· ––– ··· (3 short, 3 long, 3 short)."},{"t":"tip","x":"Όλο το αλφάβητο Morse (ελληνικό και λατινικό) και αποστολή λέξεων με φως και ήχο: 🔦 SOS → 📡 Morse.","e":"The full Morse alphabet (Greek and Latin) and sending words with light and sound: 🔦 SOS → 📡 Morse."}],"te":"Signals so they can find you","se":"Make yourself visible"},{"cat":"wild","id":"w_navi","emoji":"🌞","title":"Προσανατολισμός χωρίς πυξίδα","sub":"Ήλιος, σκιά, αστέρια","blocks":[{"t":"h","x":"Ο ήλιος","e":"The sun"},{"t":"li","x":"Ανατέλλει περίπου ΑΝΑΤΟΛΙΚΑ, δύει περίπου ΔΥΤΙΚΑ. Το μεσημέρι (στην Ελλάδα) είναι ΝΟΤΙΑ.","e":"It rises roughly in the EAST and sets roughly in the WEST. At midday (in Greece) it is in the SOUTH."},{"t":"h","x":"Ραβδί και σκιά (πολύ σίγουρο)","e":"Stick and shadow (very reliable)"},{"t":"step","x":"Κάρφωσε ίσιο ραβδί στο έδαφος. Βάλε πετραδάκι στην άκρη της σκιάς.","e":"Push a straight stick into the ground. Put a pebble at the tip of the shadow."},{"t":"step","x":"Περίμενε 15–20 λεπτά. Βάλε δεύτερο πετραδάκι στη νέα άκρη.","e":"Wait 15–20 minutes. Put a second pebble at the new tip."},{"t":"step","x":"Η γραμμή από το 1ο στο 2ο δείχνει ΔΥΣΗ → ΑΝΑΤΟΛΗ.","e":"The line from the 1st to the 2nd points WEST → EAST."},{"t":"step","x":"Στάσου με το 1ο αριστερά και το 2ο δεξιά: κοιτάς ΒΟΡΡΑ.","e":"Stand with the 1st on your left and the 2nd on your right: you are facing NORTH."},{"t":"h","x":"Ρολόι με δείκτες","e":"Analogue watch"},{"t":"li","x":"Στρέψε τον ωροδείκτη στον ήλιο. Η μέση ανάμεσα στον ωροδείκτη και στο 12 (στο 1 το καλοκαίρι, λόγω θερινής ώρας) δείχνει ΝΟΤΟ.","e":"Point the hour hand at the sun. Halfway between the hour hand and 12 (1 in summer, due to daylight saving time) points SOUTH."},{"t":"h","x":"Πολικός Αστέρας (νύχτα)","e":"Polaris (night)"},{"t":"li","x":"Βρες τη Μεγάλη Άρκτο («κατσαρόλα»). Τα δύο αστέρια της άκρης δείχνουν τον Πολικό, ~5 φορές την απόσταση τους. Ο Πολικός = ΒΟΡΡΑΣ.","e":"Find the Big Dipper (the “saucepan”). The two stars at its end point to Polaris, ~5 times the distance between them. Polaris = NORTH."},{"t":"h","x":"Σημάδια που ΔΕΝ είναι σίγουρα","e":"Signs that are NOT reliable"},{"t":"warn","x":"Τα βρύα «στη βόρεια πλευρά» και τα μυρμήγκια δεν είναι αξιόπιστα. Μην τα εμπιστεύεσαι.","e":"Moss “on the north side” and ants are not reliable. Do not trust them."},{"t":"tip","x":"Στην Πυξίδα της εφαρμογής: κράτα το κινητό οριζόντια, μακριά από μέταλλα και ηχεία. Αν κάνει λάθος, κάνε «οκτάρια» στον αέρα για να βαθμονομηθεί.","e":"In the app's “Compass”: hold the phone flat, away from metal and speakers. If it is wrong, move it in “figure eights” in the air to calibrate."}],"te":"Navigation without a compass","se":"Sun, shadow, stars"},{"cat":"wild","id":"w_food","emoji":"🍞","title":"Φαγητό στην ύπαιθρο","sub":"Το τελευταίο που σε απασχολεί","blocks":[{"t":"li","x":"Άνθρωπος υγιής ζει εβδομάδες χωρίς φαγητό. Χωρίς νερό, μην τρως (η πέψη χρειάζεται νερό).","e":"A healthy person can live weeks without food. Without water, do not eat (digestion needs water)."},{"t":"li","x":"Πρώτα τρως ό,τι κουβαλάς, σε μερίδες. Μοίρασε τις θερμίδες – μισή μερίδα για πολλές μέρες.","e":"First eat what you carry, in portions. Spread the calories – half a portion for many days."},{"t":"h","x":"Ασφαλέστερες πηγές","e":"Safer sources"},{"t":"li","x":"Ψάρι (μαγειρεμένο καλά). Πετονιά και αγκίστρια χωράνε σε σακουλάκι.","e":"Fish (well cooked). Fishing line and hooks fit in a small bag."},{"t":"li","x":"Θαλασσινά από καθαρά νερά: πεταλίδες, κυδώνια – προσοχή σε κλειστούς κόλπους και μετά από βροχές.","e":"Shellfish from clean waters: limpets, clams – beware of enclosed bays and after rain."},{"t":"li","x":"Σαλιγκάρια: ΜΟΝΟ καλά καθαρισμένα (νηστεία μερών) και καλά βρασμένα.","e":"Snails: ONLY well purged (starved for days) and well boiled."},{"t":"li","x":"Γνωστά φρούτα που ξέρεις 100%: βατόμουρα, σύκα, κούμαρα, κάστανα, καρύδια, αμύγδαλα (γλυκά), χαρούπια.","e":"Known fruit you are 100% sure of: blackberries, figs, strawberry-tree fruit, chestnuts, walnuts, almonds (sweet), carob."},{"t":"warn","x":"ΠΟΤΕ άγνωστα φυτά, μούρα, μανιτάρια. Δες «Μανιτάρια & άγρια φυτά».","e":"NEVER unknown plants, berries, mushrooms. See “Mushrooms & wild plants”."},{"t":"warn","x":"Πικρά αμύγδαλα και πολλά κουκούτσια φρούτων έχουν κυάνιο.","e":"Bitter almonds and many fruit pits contain cyanide."}],"te":"Food in the wild","se":"The last thing to worry about"},{"cat":"wild","id":"w_mush","emoji":"🍄","title":"Μανιτάρια & άγρια φυτά: γιατί ΟΧΙ","sub":"Η πιο συχνή θανατηφόρα παγίδα","blocks":[{"t":"warn","x":"Σε συνθήκες επιβίωσης ΔΕΝ τρώμε άγρια μανιτάρια. Ποτέ με βάση φωτογραφία, εφαρμογή ή «μοιάζει με».","e":"In a survival situation we DO NOT eat wild mushrooms. Never based on a photo, an app or “it looks like”."},{"t":"h","x":"Γιατί","e":"Why"},{"t":"li","x":"Ο ΘΑΝΑΤΙΤΗΣ (Amanita phalloides) και οι συγγενείς του φυτρώνουν και στην Ελλάδα και μοιάζουν με φαγώσιμα.","e":"The DEATH CAP (Amanita phalloides) and its relatives grow in Greece too and look like edible ones."},{"t":"li","x":"Τα συμπτώματα αργούν 6–24 ώρες. Όταν φανούν, το συκώτι έχει ήδη πάθει ζημιά. Μπορεί να ακολουθήσει μια «ψεύτικη βελτίωση».","e":"Symptoms are delayed 6–24 hours. When they appear, the liver is already damaged. A “false recovery” may follow."},{"t":"li","x":"Το μαγείρεμα, το ξίδι, το «ασημένιο κουτάλι», το «το έφαγαν τα ζώα» ΔΕΝ ισχύουν. Είναι μύθοι.","e":"Cooking, vinegar, the “silver spoon” test, “animals ate it” do NOT work. They are myths."},{"t":"li","x":"Τα μανιτάρια δίνουν ελάχιστες θερμίδες. Ο κίνδυνος είναι τεράστιος, το κέρδος μηδέν.","e":"Mushrooms give very few calories. The risk is huge, the gain is zero."},{"t":"h","x":"Αν κάποιος έφαγε άγριο μανιτάρι και νιώθει άσχημα (ή δεν είσαι σίγουρος)","e":"If someone ate a wild mushroom and feels unwell (or you are not sure)"},{"t":"step","x":"Κέντρο Δηλητηριάσεων 210 7793777 ή 166 ΑΜΕΣΩΣ – ακόμα κι αν νιώθει καλά.","e":"Poison Centre 210 7793777 or 166 IMMEDIATELY – even if they feel fine."},{"t":"step","x":"Κράτα τα υπόλοιπα μανιτάρια (και αποφάγια) για αναγνώριση.","e":"Keep the remaining mushrooms (and leftovers) for identification."},{"t":"step","x":"Πες ώρα που τα έφαγε και ποιοι έφαγαν. Όλοι στο νοσοκομείο.","e":"Note the time they were eaten and who ate them. Everyone to hospital."},{"t":"h","x":"Άγρια φυτά","e":"Wild plants"},{"t":"li","x":"Πολλά δηλητηριώδη μοιάζουν με φαγώσιμα (π.χ. το κώνειο με τον άγριο καρότο/μάραθο, η πικροδάφνη, ο τάτουλας).","e":"Many poisonous plants look like edible ones (e.g. hemlock like wild carrot/fennel, oleander, thorn apple)."},{"t":"li","x":"Τρώμε μόνο χόρτα/φρούτα που ξέρουμε 100% από πριν, όπως τα μάζευε η γιαγιά, και μακριά από δρόμους και ψεκασμένα χωράφια.","e":"Eat only greens/fruit you already know 100%, the way grandma picked them, and away from roads and sprayed fields."},{"t":"tip","x":"Για χόμπι: μάθε μανιτάρια με μυκητολογική εταιρεία και εξορμήσεις με ειδικούς. Όχι από εφαρμογές.","e":"As a hobby: learn mushrooms with a mycological society and on outings with experts. Not from apps."}],"te":"Mushrooms & wild plants: why NOT","se":"The most common deadly trap"},{"cat":"wild","id":"w_hyg","emoji":"🧼","title":"Υγιεινή και τουαλέτα","sub":"Οι αρρώστιες σκοτώνουν μετά την καταστροφή","blocks":[{"t":"li","x":"Πλύσιμο χεριών πριν φας και μετά την τουαλέτα. ΠΑΝΤΑ.","e":"Wash hands before eating and after the toilet. ALWAYS."},{"t":"li","x":"Τουαλέτα στη φύση: λάκκος 15–20 cm, 60+ m μακριά από νερό και καταφύγιο, σκέπασε.","e":"Toilet in the wild: hole 15–20 cm deep, 60+ m away from water and shelter, cover it."},{"t":"li","x":"Τουαλέτα στο σπίτι χωρίς νερό: κουβάς με διπλή σακούλα, λίγη χλωρίνη ή στάχτη/πριονίδι μετά από κάθε χρήση, καπάκι, έξω.","e":"Toilet at home with no water: bucket with a double bag, a little bleach or ash/sawdust after each use, lid, keep it outside."},{"t":"li","x":"Σκουπίδια: σε κλειστές σακούλες, μακριά από το σπίτι (ποντίκια).","e":"Rubbish: in closed bags, away from the house (rats)."},{"t":"li","x":"Πόδια: στεγνές κάλτσες, έλεγχος για φουσκάλες κάθε βράδυ.","e":"Feet: dry socks, check for blisters every evening."},{"t":"li","x":"Δόντια: βούρτσισμα και με αλάτι/μαγειρική σόδα.","e":"Teeth: brush, even with salt/baking soda."}],"te":"Hygiene and toilet","se":"Disease kills after the disaster"},{"cat":"wild","id":"w_knots","emoji":"🪢","title":"Κόμποι που αξίζει να ξέρεις","sub":"4 κόμποι για όλα","blocks":[{"t":"li","x":"ΚΑΡΙΚΟΜΠΙ / ΘΗΛΙΑ ΣΤΑΘΕΡΗ (bowline): θηλιά που δεν σφίγγει. Διάσωση, δέσιμο σε δέντρο. «Το κουνέλι βγαίνει από την τρύπα, γυρίζει γύρω από το δέντρο και ξαναμπαίνει».","e":"BOWLINE: a loop that does not tighten. Rescue, tying to a tree. “The rabbit comes out of the hole, goes around the tree and goes back in”."},{"t":"li","x":"ΣΤΑΥΡΟΚΟΜΠΟΣ (clove hitch): δένεις γρήγορα σε στύλο/κλαδί.","e":"CLOVE HITCH: tie quickly to a post/branch."},{"t":"li","x":"ΣΥΡΤΟΘΗΛΙΑ ΣΚΗΝΗΣ (taut-line hitch): ρυθμιζόμενο τέντωμα για tarp και σκηνή.","e":"TAUT-LINE HITCH: adjustable tension for tarp and tent."},{"t":"li","x":"ΣΚΟΤΑΣΤΡΑΒΟΚΟΜΠΟΣ (sheet bend): ενώνεις δύο σχοινιά διαφορετικού πάχους.","e":"SHEET BEND: joins two ropes of different thickness."},{"t":"tip","x":"Μάθε τους στο σπίτι με ένα κορδόνι, μέχρι να τους κάνεις με κλειστά μάτια.","e":"Learn them at home with a cord, until you can tie them with your eyes closed."}],"te":"Knots worth knowing","se":"4 knots for everything"},{"cat":"wild","id":"w_weather","emoji":"🌦️","title":"Ο καιρός σου μιλάει","sub":"Σημάδια χωρίς πρόγνωση","blocks":[{"t":"li","x":"Σύννεφα που χτίζονται ψηλά σαν πύργοι το απόγευμα = καταιγίδα, κεραυνοί.","e":"Clouds building up high like towers in the afternoon = thunderstorm, lightning."},{"t":"li","x":"Άλω (κύκλος) γύρω από ήλιο/φεγγάρι = έρχεται υγρασία, συχνά βροχή σε 12–24 ώρες.","e":"Halo (ring) around the sun/moon = moisture coming, often rain in 12–24 hours."},{"t":"li","x":"Ξαφνική πτώση θερμοκρασίας και αλλαγή αέρα = μέτωπο.","e":"Sudden temperature drop and wind change = a front."},{"t":"li","x":"Κόκκινος ουρανός το βράδυ: συνήθως καλός καιρός. Κόκκινος το πρωί: συχνά χαλάει.","e":"Red sky at night: usually good weather. Red in the morning: often turns bad."},{"t":"li","x":"Αστραπή: μέτρα δευτερόλεπτα μέχρι τη βροντή ÷ 3 = χιλιόμετρα. Κάτω από 30 δευτερόλεπτα = κάλυψη τώρα.","e":"Lightning: count seconds until the thunder ÷ 3 = kilometres. Under 30 seconds = take cover now."}],"te":"The weather talks to you","se":"Signs without a forecast"},{"cat":"wild","id":"w_after","emoji":"🔄","title":"Μετά τις 72 ώρες","sub":"Οργάνωση για εβδομάδες","blocks":[{"t":"h","x":"Πρώτα","e":"First"},{"t":"li","x":"Απογραφή: τι νερό, φαγητό, φάρμακα, καύσιμα έχουμε; Για πόσες μέρες;","e":"Inventory: how much water, food, medicine, fuel do we have? For how many days?"},{"t":"li","x":"Μερίδες: σχέδιο κατανάλωσης. Πρώτα τα φρέσκα που χαλάνε.","e":"Rations: a consumption plan. Perishable fresh food first."},{"t":"li","x":"Βάρδιες: ποιος φέρνει νερό, ποιος μαγειρεύει, ποιος φυλάει, ποιος προσέχει παιδιά/ηλικιωμένους.","e":"Shifts: who fetches water, who cooks, who keeps watch, who looks after children/elderly people."},{"t":"h","x":"Κοινότητα","e":"Community"},{"t":"li","x":"Οργανωθείτε με τους γείτονες: κοινή κουζίνα, λίστα ποιος χρειάζεται τι, ποιος ξέρει τι (γιατρός, ηλεκτρολόγος, μάστορας).","e":"Organise with your neighbours: shared kitchen, a list of who needs what, who knows what (doctor, electrician, handyman)."},{"t":"li","x":"Μάθε πού είναι τα σημεία διανομής βοήθειας και οι δομές φιλοξενίας του δήμου.","e":"Find out where the aid distribution points and the municipality's shelters are."},{"t":"h","x":"Ασφάλεια","e":"Safety"},{"t":"li","x":"Μην επιδεικνύεις αποθέματα. Κλείδωνε.","e":"Do not show off your supplies. Lock up."},{"t":"li","x":"Κινήσου σε ομάδες. Πες πού πας και πότε γυρίζεις.","e":"Move in groups. Say where you are going and when you will be back."},{"t":"li","x":"Πρόσεχε απάτες (ψεύτικοι «υπάλληλοι», ψεύτικες εράνους).","e":"Beware of scams (fake “officials”, fake fundraisers)."},{"t":"h","x":"Υγεία","e":"Health"},{"t":"li","x":"Νερό καθαρό, πλύσιμο χεριών, τουαλέτα μακριά – σταματάς τις επιδημίες.","e":"Clean water, hand washing, toilet far away – you stop epidemics."},{"t":"li","x":"Μικρές πληγές: καθάρισμα καθημερινά (μολύνονται εύκολα).","e":"Small wounds: clean them daily (they get infected easily)."},{"t":"li","x":"Χρόνιες ασθένειες: ψάξε φαρμακείο/γιατρό νωρίς, πριν τελειώσουν τα φάρμακα.","e":"Chronic illnesses: find a pharmacy/doctor early, before the medicine runs out."},{"t":"h","x":"Επιστροφή στο σπίτι","e":"Returning home"},{"t":"li","x":"Μόνο όταν πουν οι αρχές. Έλεγχος για ρωγμές, γκάζι, ρεύμα, νερό. Φωτογράφισε ζημιές για αποζημίωση πριν καθαρίσεις.","e":"Only when the authorities say so. Check for cracks, gas, electricity, water. Photograph damage for compensation before you clean up."}],"te":"After 72 hours","se":"Organising for weeks"},{"cat":"tips","id":"t_top","emoji":"💡","title":"30 χρυσές συμβουλές","sub":"Από την πράξη","blocks":[{"t":"step","x":"Το καλύτερο κιτ είναι αυτό που έχεις ΜΑΖΙ σου τη στιγμή που χρειάζεται. Μικρό κιτ στην τσάντα, μεσαίο στο αυτοκίνητο, μεγάλο στο σπίτι.","e":"The best kit is the one you have WITH you when you need it. A small kit in your bag, a medium one in the car, a big one at home."},{"t":"step","x":"Μη φυλάς «για όταν γίνει». Χρησιμοποίησε τον εξοπλισμό σου μια φορά σε camping για να ξέρεις ότι δουλεύει.","e":"Don't save it \"for when it happens\". Use your gear once on a camping trip so you know it works."},{"t":"step","x":"Ντεπόζιτο πάντα πάνω από τη μέση.","e":"Keep the fuel tank always above half."},{"t":"step","x":"Κινητό πάντα φορτισμένο το βράδυ, powerbank πάντα γεμάτο.","e":"Charge your phone every night, keep the powerbank always full."},{"t":"step","x":"Έχε μετρητά στο σπίτι. Χωρίς ρεύμα δεν δουλεύουν κάρτες και ATM.","e":"Keep cash at home. Without power, cards and ATMs don't work."},{"t":"step","x":"Γράψε τα σημαντικά τηλέφωνα σε χαρτί.","e":"Write the important phone numbers on paper."},{"t":"step","x":"Φύλαξε παπούτσια και φακό δίπλα στο κρεβάτι (σεισμός τη νύχτα = σπασμένα γυαλιά).","e":"Keep shoes and a torch next to the bed (earthquake at night = broken glass)."},{"t":"step","x":"Κλειδιά σε σταθερό σημείο δίπλα στην πόρτα.","e":"Keys in a fixed spot next to the door."},{"t":"step","x":"Μάθε πού κλείνουν γκάζι, νερό, ρεύμα – και δείξ' το σε όλους.","e":"Learn where to shut off gas, water, power – and show everyone."},{"t":"step","x":"Κάνε σεμινάριο πρώτων βοηθειών. Είναι η πιο χρήσιμη γνώση της ζωής σου.","e":"Take a first aid course. It is the most useful skill of your life."},{"t":"step","x":"Στερέωσε έπιπλα στον τοίχο.","e":"Fix furniture to the wall."},{"t":"step","x":"Ανιχνευτής καπνού και CO. Δοκιμή κάθε μήνα.","e":"Smoke and CO detector. Test every month."},{"t":"step","x":"Γέμισε μπουκάλια με νερό στα κενά του καταψύκτη.","e":"Fill bottles with water in the empty spaces of the freezer."},{"t":"step","x":"Αγόρασε κάθε φορά που πας σούπερ μάρκετ 1–2 πράγματα για το απόθεμα. Σε λίγους μήνες έχεις 2 εβδομάδες.","e":"Every time you go to the supermarket, buy 1–2 extra things for your stock. In a few months you have 2 weeks."},{"t":"step","x":"Σφυρίχτρα σε κάθε σακίδιο και κλειδιά. Κοστίζει ελάχιστα, σώζει ζωές.","e":"A whistle on every backpack and keyring. It costs very little, it saves lives."},{"t":"step","x":"Κατέβασε offline χάρτες της περιοχής σου στο κινητό από τώρα.","e":"Download offline maps of your area to your phone now."},{"t":"step","x":"Ενεργοποίησε το Medical ID (iPhone: Υγεία → Ιατρικό ID / Android: Πληροφορίες έκτακτης ανάγκης) να φαίνεται στην κλειδωμένη οθόνη.","e":"Turn on Medical ID (iPhone: Health → Medical ID / Android: Emergency information) so it shows on the lock screen."},{"t":"step","x":"Κράτα ένα συγγενή σε άλλη πόλη ως «κέντρο επικοινωνίας».","e":"Pick a relative in another town as your \"contact centre\"."},{"t":"step","x":"SMS περνάει όταν δεν περνούν οι κλήσεις.","e":"SMS gets through when calls don't."},{"t":"step","x":"Φωτογράφισε σπίτι και πράγματα (για ασφάλεια/αποζημίωση).","e":"Take photos of your home and belongings (for insurance/compensation)."},{"t":"step","x":"Αν φύγεις από το σπίτι, άφησε σημείωμα: πού πήγες, πότε.","e":"If you leave home, leave a note: where you went, when."},{"t":"step","x":"Μάθε τον πλησιέστερο ανοιχτό χώρο συγκέντρωσης και καταφύγιο.","e":"Learn your nearest open assembly area and shelter."},{"t":"step","x":"Ακολούθα τις επίσημες οδηγίες (112, Πολιτική Προστασία), όχι φήμες στα social.","e":"Follow official instructions (112, Civil Protection), not rumours on social media."},{"t":"step","x":"Στην κρίση: πρώτα ΕΣΥ ασφαλής, μετά βοηθάς τους άλλους (όπως η μάσκα στο αεροπλάνο).","e":"In a crisis: first YOU are safe, then you help others (like the mask on the plane)."},{"t":"step","x":"Ο πανικός είναι ο μεγαλύτερος εχθρός. ΣΤΑΣΟΥ – ανάσα – σκέψου.","e":"Panic is the biggest enemy. STOP – breathe – think."},{"t":"step","x":"Μην αγγίζεις ποτέ άγνωστα πυρομαχικά, καλώδια που έπεσαν, νερά πλημμύρας με ρεύμα.","e":"Never touch unknown ammunition, fallen cables, or flood water with electricity in it."},{"t":"step","x":"Κανένα μαγκάλι, γκαζάκι ή γεννήτρια μέσα στο σπίτι. Ποτέ.","e":"No charcoal brazier, camping gas stove or generator inside the house. Ever."},{"t":"step","x":"Μην τρως άγρια μανιτάρια.","e":"Don't eat wild mushrooms."},{"t":"step","x":"Γνώρισε τους γείτονές σου. Στην καταστροφή, ο γείτονας φτάνει πρώτος.","e":"Get to know your neighbours. In a disaster, the neighbour arrives first."},{"t":"step","x":"Κάνε άσκηση με την οικογένεια: «Σεισμός τώρα! Πού πάμε;». Δύο φορές τον χρόνο.","e":"Practise with your family: \"Earthquake now! Where do we go?\". Twice a year."}],"te":"30 golden tips","se":"From real experience"},{"cat":"tips","id":"t_more","emoji":"🧠","title":"Δυνατά κόλπα επιβίωσης","sub":"Μικρά μυστικά με μεγάλη διαφορά","blocks":[{"t":"h","x":"Πριν χτυπήσει (όταν έρχεται προειδοποίηση)","e":"Before it hits (when a warning comes)"},{"t":"step","x":"Γέμισε μπανιέρα και δοχεία με νερό.","e":"Fill the bathtub and containers with water."},{"t":"step","x":"Φόρτισε ΟΛΑ: κινητά, powerbank, power station, φακούς, λάπτοπ.","e":"Charge EVERYTHING: phones, powerbank, power station, flashlights, laptop."},{"t":"step","x":"Γέμισε το ντεπόζιτο και τράβα μετρητά (χαρτονομίσματα μικρά).","e":"Fill the fuel tank and withdraw cash (small notes)."},{"t":"step","x":"Βάλε μπουκάλια νερό στην κατάψυξη: κρατούν το ψυγείο κρύο και μετά είναι πόσιμο νερό.","e":"Put bottles of water in the freezer: they keep the fridge cold and then become drinking water."},{"t":"step","x":"Ρύθμισε ψυγείο και καταψύκτη στο πιο κρύο.","e":"Set the fridge and freezer to the coldest setting."},{"t":"h","x":"Ψυγείο χωρίς ρεύμα","e":"Fridge without power"},{"t":"li","x":"ΜΗΝ το ανοίγεις. Κλειστό ψυγείο κρατάει ~4 ώρες. Γεμάτος καταψύκτης ~48 ώρες, μισογεμάτος ~24.","e":"DO NOT open it
