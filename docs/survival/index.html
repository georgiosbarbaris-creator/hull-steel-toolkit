<!DOCTYPE html>
<html lang="el"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Επιβίωση 72+</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Επιβίωση 72+">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#0a1522">
<style>
:root{--fs:19px;--bg:#0d1b2a;--card:#16283d;--line:#2a4060;--tx:#f4f6f8;--mut:#a9b8c8;--red:#d62828;--org:#f77f00;--grn:#2a9d8f;--yel:#fcbf49;--blu:#3a86ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,"Segoe UI",Roboto,Arial,sans-serif;font-size:var(--fs);line-height:1.45}
header{position:sticky;top:0;z-index:5;background:#0a1522;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;border-bottom:1px solid var(--line)}
header h1{flex:1;font-size:.98em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:12px;min-width:40px;height:46px;font-size:.92em;font-weight:700;padding:0 6px}
main{padding:12px 12px calc(env(safe-area-inset-bottom) + 90px);max-width:760px;margin:0 auto}
.big{display:block;width:100%;border:0;border-radius:18px;padding:20px 14px;margin:0 0 12px;font-size:1.35em;font-weight:800;color:#fff;text-align:center}
.big small{display:block;font-size:.6em;font-weight:500;opacity:.9;margin-top:4px}
.red{background:var(--red)}.org{background:var(--org)}.grn{background:var(--grn)}.blu{background:var(--blu)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center;color:var(--tx);font-size:1em;font-weight:700;min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tile .e{font-size:2.1em;line-height:1}
.tile small{font-weight:400;color:var(--mut);font-size:.72em}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:9px;color:var(--tx);width:100%;text-align:left;font-size:1em}
.row .e{font-size:1.7em;width:1.4em;text-align:center}
.row b{display:block}.row small{color:var(--mut)}
h2{font-size:1.25em;margin:18px 0 8px;color:var(--yel)}
h3{font-size:1.05em;margin:18px 0 6px;color:var(--yel);border-bottom:1px solid var(--line);padding-bottom:4px}
.sub{color:var(--mut);margin:-4px 0 10px}
.step{display:flex;gap:10px;background:var(--card);border-radius:12px;padding:10px 12px;margin:7px 0}
.step .n{flex:none;width:1.8em;height:1.8em;border-radius:50%;background:var(--org);color:#000;font-weight:800;display:flex;align-items:center;justify-content:center}
.li{padding:5px 0 5px 1.1em;position:relative}.li:before{content:"•";position:absolute;left:.2em;color:var(--org)}
.warn{background:#4a1014;border-left:6px solid var(--red);padding:10px 12px;border-radius:10px;margin:8px 0;font-weight:600}
.tip{background:#123a36;border-left:6px solid var(--grn);padding:10px 12px;border-radius:10px;margin:8px 0}
.chk{display:flex;gap:12px;align-items:flex-start;padding:11px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.chk .bx{flex:none;width:1.5em;height:1.5em;border:2px solid var(--mut);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:900}
.chk.on .bx{background:var(--grn);border-color:var(--grn)}.chk.on span{color:var(--mut);text-decoration:line-through}
.bar{height:14px;background:var(--card);border-radius:8px;overflow:hidden;margin:6px 0 2px}.bar i{display:block;height:100%;background:var(--grn)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.btn{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:11px 14px;font-size:.95em;font-weight:700}
.btn.p{background:var(--blu);border-color:var(--blu);color:#fff}.btn.r{background:var(--red);border-color:var(--red);color:#fff}.btn.g{background:var(--grn);border-color:var(--grn);color:#fff}
input,select,textarea{width:100%;font-size:1em;padding:11px;border-radius:10px;border:1px solid var(--line);background:#0a1522;color:var(--tx);margin:4px 0 10px}
label{font-weight:700;color:var(--mut);font-size:.9em}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.phone{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:9px;color:var(--tx);text-decoration:none}
.phone .num{font-size:1.6em;font-weight:900;color:#fff;min-width:3.2em}
.phone.k .num{color:var(--red)}
.comp{position:relative;width:min(78vw,300px);height:min(78vw,300px);margin:8px auto}
.comp svg{width:100%;height:100%}
.hd{text-align:center;font-size:2.6em;font-weight:900;letter-spacing:1px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.coord{font-size:1.15em;text-align:center;font-weight:700}
.muted{color:var(--mut);font-size:.88em}
#ov{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:#fff;color:#000;font-weight:800;padding-bottom:calc(env(safe-area-inset-bottom) + 30px)}
.metro{width:150px;height:150px;border-radius:50%;margin:10px auto;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:2.6em;font-weight:900;transition:transform .08s}
.metro.b{transform:scale(1.15);background:#ff4d4d}
footer{text-align:center;color:var(--mut);font-size:.8em;margin-top:28px}
.wp{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}.wp b{flex:1}
.sel{outline:3px solid var(--yel)}
canvas{width:100%;background:#0a1522;border-radius:12px;border:1px solid var(--line)}
.card{background:#fff;color:#000;border-radius:14px;padding:14px;font-size:1.05em}.card b{color:#900}
.sunt{width:100%;border-collapse:collapse;font-size:.82em;margin:8px 0;font-variant-numeric:tabular-nums}
.sunt th{color:var(--mut);font-weight:600;font-size:.85em;padding:4px 2px;position:sticky;top:62px;background:var(--bg)}
.sunt td{text-align:center;padding:6px 2px;border-bottom:1px solid var(--line)}
.smh td{text-align:left;background:var(--card);color:var(--yel);font-weight:800;padding:10px 8px;cursor:pointer}.smh.cur td{background:#3a2a10}
#al{position:fixed;inset:0;z-index:90;background:#b00000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:6px}
#al .big{max-width:420px}
#gbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#1d3557;color:#fff;text-align:center;font-weight:700;padding:10px 10px calc(env(safe-area-inset-bottom) + 10px);border-top:2px solid var(--blu)}
html.night header,html.night main{filter:grayscale(1) sepia(1) saturate(12) hue-rotate(-50deg) brightness(.55)}html.night,html.night body{background:#000}
.fig{margin:10px 0 12px;background:#16283d;border:1px solid var(--line);border-radius:14px;padding:6px 6px 10px}.fig svg{width:100%;display:block;border-radius:10px}.fig figcaption{color:var(--mut);font-size:.86em;padding:6px 6px 0;line-height:1.35}
</style></head><body>

<div id="ov" onclick="ovOff()"><span id="ovt">Πάτα για κλείσιμο</span></div>
<script>
const D=[{"cat":"now","id":"quake","emoji":"🏚️","title":"Σεισμός","sub":"Σκύψε – Κάλυψε – Κρατήσου","blocks":[{"t":"h","x":"ΤΩΡΑ, όσο κουνιέται","e":"NOW, while it is shaking"},{"t":"step","x":"ΣΚΥΨΕ στα γόνατα, για να μη σε ρίξει ο σεισμός.","e":"DROP to your knees, so the quake does not knock you down."},{"t":"step","x":"ΚΑΛΥΨΕ το κεφάλι και τον λαιμό. Μπες κάτω από γερό τραπέζι ή γραφείο.","e":"COVER your head and neck. Get under a strong table or desk."},{"t":"step","x":"ΚΡΑΤΗΣΟΥ από το πόδι του τραπεζιού μέχρι να σταματήσει το κούνημα.","e":"HOLD ON to the table leg until the shaking stops."},{"t":"step","x":"Αν δεν έχει τραπέζι: κάτσε δίπλα σε εσωτερικό τοίχο, μακριά από τζάμια, και κάλυψε το κεφάλι με τα χέρια.","e":"If there is no table: sit next to an inside wall, away from glass, and cover your head with your arms."},{"t":"warn","x":"ΜΗΝ τρέξεις έξω την ώρα του σεισμού. Οι περισσότεροι τραυματίζονται από πράγματα που πέφτουν.","e":"DO NOT run outside during the quake. Most people are hurt by falling objects."},{"t":"warn","x":"ΜΗΝ μπεις σε ασανσέρ. ΜΗΝ σταθείς σε σκάλες ή μπαλκόνι.","e":"DO NOT use the lift. DO NOT stand on stairs or a balcony."},{"t":"h","x":"Αν είσαι στο κρεβάτι","e":"If you are in bed"},{"t":"li","x":"Μείνε εκεί. Γύρνα μπρούμυτα και κάλυψε το κεφάλι με το μαξιλάρι.","e":"Stay there. Turn face down and cover your head with the pillow."},{"t":"h","x":"Αν είσαι έξω","e":"If you are outside"},{"t":"li","x":"Πήγαινε σε ανοιχτό χώρο, μακριά από κτίρια, κολώνες, καλώδια και δέντρα.","e":"Go to an open space, away from buildings, poles, power lines and trees."},{"t":"li","x":"Σκύψε και κάλυψε το κεφάλι.","e":"Drop down and cover your head."},{"t":"h","x":"Αν οδηγείς","e":"If you are driving"},{"t":"li","x":"Σταμάτα σιγά-σιγά σε ασφαλές σημείο. Όχι κάτω από γέφυρες, κολώνες, καλώδια.","e":"Slow down and stop in a safe place. Not under bridges, poles or power lines."},{"t":"li","x":"Μείνε μέσα στο αυτοκίνητο με τη ζώνη μέχρι να σταματήσει.","e":"Stay in the car with your seat belt on until it stops."},{"t":"h","x":"Μόλις σταματήσει","e":"As soon as it stops"},{"t":"step","x":"Έλεγξε αν είσαι καλά εσύ και όσοι είναι μαζί σου.","e":"Check that you and the people with you are OK."},{"t":"step","x":"Φόρεσε παπούτσια (σπασμένα γυαλιά!).","e":"Put on shoes (broken glass!)."},{"t":"step","x":"Κλείσε γκάζι/υγραέριο και τον γενικό διακόπτη ρεύματος αν υπάρχει ζημιά ή μυρωδιά.","e":"Turn off the gas/LPG and the main power switch if there is damage or a smell."},{"t":"step","x":"Πάρε το σακίδιο έκτακτης ανάγκης και βγες ΗΡΕΜΑ από τις σκάλες.","e":"Take the emergency backpack and leave CALMLY by the stairs."},{"t":"step","x":"Πήγαινε στον χώρο συγκέντρωσης της περιοχής σου (ανοιχτός χώρος).","e":"Go to your area's assembly point (an open space)."},{"t":"step","x":"Άκου ραδιόφωνο και τα μηνύματα 112.","e":"Listen to the radio and the 112 messages."},{"t":"warn","x":"Μυρίζει γκάζι; ΜΗΝ ανάβεις φως, αναπτήρα ή διακόπτες. Άνοιξε παράθυρα και βγες έξω.","e":"Smell of gas? DO NOT turn on lights, lighters or switches. Open the windows and get out."},{"t":"warn","x":"Περίμενε μετασεισμούς. Μην ξαναμπείς σε κτίριο με ρωγμές μέχρι να το δει μηχανικός.","e":"Expect aftershocks. Do not go back into a building with cracks until an engineer checks it."},{"t":"h","x":"Αν εγκλωβιστείς στα συντρίμμια","e":"If you are trapped under rubble"},{"t":"step","x":"Μην ανάβεις φωτιά ή σπίρτο.","e":"Do not light a fire or a match."},{"t":"step","x":"Κάλυψε στόμα και μύτη με ύφασμα για τη σκόνη.","e":"Cover your mouth and nose with cloth against the dust."},{"t":"step","x":"Χτύπα σε σωλήνα ή τοίχο (3 χτυπήματα, παύση) ή φύσα σφυρίχτρα.","e":"Tap on a pipe or wall (3 taps, pause) or blow a whistle."},{"t":"step","x":"Φώναξε μόνο όταν ακούς διασώστες – κράτα δυνάμεις.","e":"Shout only when you hear rescuers – save your strength."},{"t":"step","x":"Μην κουνιέσαι άσκοπα, μη σηκώνεις σκόνη.","e":"Do not move without need, do not raise dust."},{"t":"h","x":"Κοντά στη θάλασσα;","e":"Near the sea?"},{"t":"warn","x":"Αν ο σεισμός ήταν δυνατός ή κράτησε πολύ και είσαι στην ακτή: φύγε ΑΜΕΣΩΣ για ψηλά. Δες «Τσουνάμι».","e":"If the quake was strong or lasted long and you are on the coast: go to high ground AT ONCE. See “Tsunami”."},{"t":"tip","x":"Προετοιμασία: στερέωσε ντουλάπες και βιβλιοθήκες στον τοίχο, βάρη χαμηλά, όχι κάδρα πάνω από το κρεβάτι.","e":"Get ready: fix wardrobes and bookcases to the wall, heavy things low, no pictures above the bed."},{"t":"tip","x":"Μάθε στα παιδιά το «Σκύψε-Κάλυψε-Κρατήσου» και κάντε άσκηση 2 φορές τον χρόνο.","e":"Teach children “Drop-Cover-Hold on” and practise 2 times a year."}],"te":"Earthquake","se":"Drop – Cover – Hold on"},{"cat":"now","id":"quake_night","emoji":"🌙","title":"Σεισμός τη νύχτα","sub":"Στο σκοτάδι, από τον ύπνο","blocks":[{"t":"h","x":"Την ώρα που κουνάει","e":"While the ground is shaking"},{"t":"step","x":"Αν είσαι στο κρεβάτι: ΜΕΙΝΕ εκεί. Γύρνα μπρούμυτα και σκέπασε κεφάλι και σβέρκο με το μαξιλάρι.","e":"If you are in bed: STAY there. Turn face down and cover your head and neck with the pillow."},{"t":"step","x":"Αν πάνω από το κρεβάτι υπάρχει βαρύ φωτιστικό, ράφι ή κάδρο: κατέβα στο πάτωμα δίπλα στο κρεβάτι, «ΣΚΥΨΕ – ΚΑΛΥΨΟΥ – ΚΡΑΤΗΣΟΥ».","e":"If there is a heavy light fitting, shelf or picture above the bed: get down on the floor next to the bed, “DROP – COVER – HOLD ON”."},{"t":"step","x":"ΜΗΝ τρέχεις στο σκοτάδι: σπασμένα γυαλιά, πεσμένα έπιπλα, σκάλες.","e":"DO NOT run in the dark: broken glass, fallen furniture, stairs."},{"t":"h","x":"Μόλις σταματήσει","e":"As soon as it stops"},{"t":"step","x":"Παπούτσια ΠΡΩΤΑ (τα έχεις δίπλα στο κρεβάτι).","e":"Shoes FIRST (keep them next to the bed)."},{"t":"step","x":"Φακός – ΟΧΙ αναπτήρας, σπίρτο ή κερί (μπορεί να έχει διαρροή γκαζιού).","e":"Flashlight – NOT a lighter, match or candle (there may be a gas leak)."},{"t":"step","x":"Φώναξε τα ονόματα όλων. Πήγαινε πρώτα στα παιδιά.","e":"Call out everyone’s name. Go to the children first."},{"t":"step","x":"Μυρίζει γκάζι; Μην ανάβεις διακόπτες, άνοιξε παράθυρα, κλείσε τη φιάλη ή τον γενικό, βγείτε έξω.","e":"Smell gas? Do not touch switches, open the windows, close the gas bottle or the main valve, get out."},{"t":"step","x":"Βγες με ψυχραιμία από τις σκάλες – ΠΟΤΕ ασανσέρ. Πάρε σακίδιο, ζεστά ρούχα, κουβέρτα.","e":"Leave calmly by the stairs – NEVER the lift. Take your backpack, warm clothes, a blanket."},{"t":"step","x":"Πήγαινε στον χώρο συγκέντρωσης ή σε ανοιχτό χώρο, μακριά από κτίρια, κολόνες, καλώδια.","e":"Go to the assembly point or an open area, away from buildings, poles, power lines."},{"t":"warn","x":"Περίμενε μετασεισμούς. Μη γυρίσεις μέσα αν το κτίριο έχει ρωγμές, μέχρι να το δει μηχανικός.","e":"Expect aftershocks. Do not go back inside if the building has cracks, until an engineer has checked it."},{"t":"h","x":"Ετοίμασε το υπνοδωμάτιο από ΑΠΟΨΕ","e":"Prepare the bedroom TONIGHT"},{"t":"chk","x":"Παπούτσια, φακός, γυαλιά, κινητό δίπλα στο κρεβάτι (σε σακουλάκι δεμένο στο πόδι του κρεβατιού)","e":"Shoes, flashlight, glasses, mobile phone next to the bed (in a small bag tied to the bed leg)"},{"t":"chk","x":"Σφυρίχτρα στο κομοδίνο","e":"Whistle on the bedside table"},{"t":"chk","x":"Τίποτα βαρύ πάνω από το κρεβάτι (κάδρα, ράφια, κλιματιστικό χωρίς στήριξη)","e":"Nothing heavy above the bed (pictures, shelves, unsecured air conditioner)"},{"t":"chk","x":"Κρεβάτι μακριά από μεγάλα τζάμια","e":"Bed away from large windows"},{"t":"chk","x":"Ντουλάπες και βιβλιοθήκες στερεωμένες στον τοίχο","e":"Wardrobes and bookcases fixed to the wall"},{"t":"chk","x":"Ρούχα για έξω σε μια καρέκλα (για να μη βγεις με πιτζάμες στο κρύο)","e":"Outdoor clothes on a chair (so you do not go out in pyjamas in the cold)"}],"te":"Earthquake at night","se":"In the dark, woken from sleep"},{"cat":"now","id":"trapped","emoji":"🧱","title":"Εγκλωβισμένος στα ερείπια","sub":"Πώς σε βρίσκουν και πώς αντέχεις","blocks":[{"t":"tip","x":"Οι διασώστες ψάχνουν για ΜΕΡΕΣ. Πολλοί άνθρωποι βγαίνουν ζωντανοί μετά από 3, 5 ή και περισσότερες μέρες. Η δουλειά σου είναι να αντέξεις και να σε ακούσουν.","e":"Rescuers search for DAYS. Many people come out alive after 3, 5 or even more days. Your job is to hold on and to be heard."},{"t":"h","x":"Αμέσως","e":"Right away"},{"t":"step","x":"ΜΗΝ ανάψεις φωτιά, σπίρτο ή αναπτήρα – γκάζι και σκόνη μπορεί να πάρουν φωτιά.","e":"DO NOT light a fire, match or lighter – gas and dust can catch fire."},{"t":"step","x":"Κάλυψε μύτη και στόμα με ύφασμα ή μπλούζα (σκόνη).","e":"Cover your nose and mouth with cloth or a T-shirt (dust)."},{"t":"step","x":"Κινήσου ελάχιστα, για να μη σηκώσεις σκόνη και να μην πέσουν άλλα μπάζα. Μην τραβάς δοκάρια που στηρίζουν.","e":"Move as little as possible, so you do not raise dust or bring down more debris. Do not pull on beams that hold things up."},{"t":"step","x":"Έλεγξε τον εαυτό σου για αιμορραγία – πίεσε δυνατά με ύφασμα.","e":"Check yourself for bleeding – press hard with cloth."},{"t":"h","x":"Να σε ακούσουν","e":"Make them hear you"},{"t":"step","x":"ΧΤΥΠΑ σε σωλήνα, κολόνα ή τοίχο: 3 χτυπήματα, παύση, πάλι 3. Ο ήχος ταξιδεύει μακριά μέσα στο μπετόν και στα μέταλλα.","e":"TAP on a pipe, column or wall: 3 taps, pause, 3 again. Sound travels far through concrete and metal."},{"t":"step","x":"Σφυρίχτρα: 3 σφυρίγματα, παύση, ξανά.","e":"Whistle: 3 blasts, pause, again."},{"t":"step","x":"ΦΩΝΑΞΕ μόνο όταν ακούς διασώστες κοντά. Η φωνή κουράζει και σε κάνει να εισπνέεις σκόνη.","e":"SHOUT only when you hear rescuers nearby. Shouting tires you and makes you breathe in dust."},{"t":"step","x":"Όταν ακούσεις «ησυχία» από τους διασώστες (σταματούν τα μηχανήματα για να ακούσουν): τότε χτύπα ή φώναξε.","e":"When you hear rescuers call for “silence” (they stop the machines to listen): then tap or shout."},{"t":"h","x":"Το κινητό","e":"Your mobile phone"},{"t":"li","x":"Αν έχει σήμα: 112 – πες πού ακριβώς είσαι (όροφος, δωμάτιο, ποιοι άλλοι). Αν δεν περνάει κλήση, στείλε SMS στο 112 ή σε δικούς σου.","e":"If it has signal: 112 – say exactly where you are (floor, room, who else is with you). If the call does not go through, send an SMS to 112 or to your family."},{"t":"li","x":"Μετά λειτουργία χαμηλής ενέργειας, χαμηλή φωτεινότητα. Άνοιγε το σήμα κάθε 30–60 λεπτά για λίγο. Ο φακός του μόνο για λίγο.","e":"Then low-power mode, low brightness. Turn the signal on for a short time every 30–60 minutes. Use its flashlight only briefly."},{"t":"h","x":"Να αντέξεις","e":"Hold on"},{"t":"li","x":"Ό,τι νερό έχεις, πίνε λίγο λίγο αλλά τακτικά.","e":"Whatever water you have, drink it little by little but regularly."},{"t":"li","x":"Κράτα ζεστό το σώμα: ό,τι ύφασμα βρεις, από κάτω και από πάνω.","e":"Keep your body warm: any cloth you find, underneath you and on top."},{"t":"li","x":"Κράτα το μυαλό απασχολημένο: μέτρα, προσευχήσου, σκέψου τους δικούς σου, μίλα με άλλους εγκλωβισμένους. Πες στον εαυτό σου: «Με ψάχνουν. Θα με βρουν.»","e":"Keep your mind busy: count, pray, think of your loved ones, talk to others who are trapped. Tell yourself: “They are looking for me. They will find me.”"},{"t":"li","x":"Κοιμήσου όταν μπορείς – αλλά χτύπα ξανά όταν ξυπνάς.","e":"Sleep when you can – but tap again when you wake up."}],"te":"Trapped under rubble","se":"How they find you and how you hold on"},{"cat":"now","id":"evac10","emoji":"🏃","title":"Εκκένωση σε 10 λεπτά","sub":"Τι αρπάζω και με ποια σειρά","blocks":[{"t":"tip","x":"Όταν πουν «φύγετε», οι άνθρωποι χάνουν λεπτά ψάχνοντας πράγματα. Μάθε αυτή τη σειρά από ΤΩΡΑ και κόλλησέ τη μέσα στην πόρτα της ντουλάπας.","e":"When they say “leave”, people lose minutes looking for things. Learn this order NOW and stick it inside the wardrobe door."},{"t":"warn","x":"Αν δεις φωτιά, νερό ή καπνό να έρχεται: ΦΥΓΕ ΑΜΕΣΩΣ, με ό,τι έχεις πάνω σου. Οι άνθρωποι πρώτα. Τα πράγματα αντικαθίστανται.","e":"If you see fire, water or smoke coming: LEAVE IMMEDIATELY, with whatever you have on you. People first. Things can be replaced."},{"t":"h","x":"Λεπτό 0–1: Άνθρωποι","e":"Minute 0–1: People"},{"t":"chk","x":"Όλοι μαζί: παιδιά, ηλικιωμένοι, κατοικίδια (λουρί / κλουβί)","e":"Everyone together: children, elderly people, pets (lead / carrier)"},{"t":"chk","x":"Παπούτσια σε όλους","e":"Shoes on everyone"},{"t":"chk","x":"Κινητό","e":"Mobile phone"},{"t":"h","x":"Λεπτό 1–3: Τα αναντικατάστατα","e":"Minute 1–3: What cannot be replaced"},{"t":"chk","x":"Σακίδιο 72 ωρών (έτοιμο δίπλα στην πόρτα)","e":"72-hour backpack (ready by the door)"},{"t":"chk","x":"ΦΑΡΜΑΚΑ καθημερινά + συνταγές, γυαλιά, ακουστικά, μασέλα","e":"Daily MEDICINES + prescriptions, glasses, hearing aids, dentures"},{"t":"chk","x":"Φάκελος εγγράφων (ταυτότητες, διαβατήρια, ασφάλειες, συμβόλαια)","e":"Document folder (ID cards, passports, insurance, contracts)"},{"t":"chk","x":"Κλειδιά σπιτιού και αυτοκινήτου, πορτοφόλι, μετρητά","e":"House and car keys, wallet, cash"},{"t":"chk","x":"Φορτιστές και powerbank","e":"Chargers and powerbank"},{"t":"h","x":"Λεπτό 3–5: Ζωή εκτός σπιτιού","e":"Minute 3–5: Life away from home"},{"t":"chk","x":"Νερό (μπουκάλια)","e":"Water (bottles)"},{"t":"chk","x":"Ζεστό μπουφάν, αλλαξιές, κουβέρτα","e":"Warm jacket, change of clothes, blanket"},{"t":"chk","x":"Βρεφικά / φαγητό κατοικίδιου αν χρειάζεται","e":"Baby supplies / pet food if needed"},{"t":"h","x":"Λεπτό 5–8: Το σπίτι (μόνο αν υπάρχει χρόνος)","e":"Minute 5–8: The house (only if there is time)"},{"t":"chk","x":"Γκάζι κλειστό (φιάλη / γενικός)","e":"Gas off (bottle / main valve)"},{"t":"chk","x":"Πλημμύρα: ρεύμα κλειστό στον γενικό – ΜΟΝΟ με στεγνά χέρια και πόδια. Νερό κλειστό","e":"Flood: power off at the main switch – ONLY with dry hands and feet. Water off"},{"t":"chk","x":"Πυρκαγιά: παράθυρα και πόρτες ΚΛΕΙΣΤΑ (όχι κλειδωμένα), κουρτίνες μακριά από τζάμια, εύφλεκτα μακριά από το σπίτι, φώτα ανοιχτά για να φαίνεται το σπίτι στον καπνό","e":"Wildfire: windows and doors CLOSED (not locked), curtains away from the glass, flammables away from the house, lights on so the house can be seen in the smoke"},{"t":"chk","x":"Χαρτί στην πόρτα: «Είμαστε Χ άτομα, όλοι καλά, πήγαμε στο …, ημερομηνία-ώρα»","e":"Note on the door: “We are X people, all OK, gone to …, date-time”"},{"t":"h","x":"Λεπτό 8–10: Φεύγω σωστά","e":"Minute 8–10: Leave the right way"},{"t":"step","x":"Ακολούθησε τον δρόμο που λέει το 112 ή η Πολιτική Προστασία – όχι τον «συντομότερο».","e":"Follow the route given by 112 or Civil Protection – not the “shortest” one."},{"t":"step","x":"Στείλε SMS στην επαφή εκτός περιοχής: «Φύγαμε, όλοι καλά, πάμε στο …».","e":"Send an SMS to your out-of-area contact: “We have left, all OK, going to …”."},{"t":"step","x":"Φωνάξε ή χτύπα την πόρτα στους γείτονες – ειδικά ηλικιωμένους που μένουν μόνοι.","e":"Call out or knock on your neighbours’ doors – especially elderly people who live alone."},{"t":"warn","x":"ΜΗ γυρίσεις πίσω για τίποτα μέχρι να πουν οι αρχές ότι είναι ασφαλές.","e":"DO NOT go back for anything until the authorities say it is safe."},{"t":"h","x":"Προετοιμασία από σήμερα","e":"Prepare from today"},{"t":"li","x":"Σακίδιο έτοιμο, φάκελος εγγράφων σε ένα σημείο, φωτογραφίες εγγράφων στο κινητό.","e":"Backpack ready, document folder in one place, photos of documents on your phone."},{"t":"li","x":"Κάντε άσκηση: χρονομέτρησε την οικογένεια – μπορείτε να βγείτε σε 10 λεπτά;","e":"Do a drill: time your family – can you get out in 10 minutes?"},{"t":"li","x":"Ντεπόζιτο αυτοκινήτου πάντα πάνω από τη μέση, παρκαρισμένο με τη μούρη προς την έξοδο.","e":"Car fuel tank always above half, parked facing the exit."}],"te":"Evacuation in 10 minutes","se":"What to grab and in what order"},{"cat":"now","id":"tsunami","emoji":"🌊","title":"Τσουνάμι","sub":"Φεύγω ψηλά, αμέσως","blocks":[{"t":"h","x":"Σημάδια ότι έρχεται","e":"Signs that it is coming"},{"t":"li","x":"Δυνατός ή μακρύς σεισμός ενώ είσαι κοντά στη θάλασσα.","e":"A strong or long earthquake while you are near the sea."},{"t":"li","x":"Η θάλασσα τραβιέται ξαφνικά πίσω και φαίνεται ο βυθός.","e":"The sea suddenly pulls back and the seabed shows."},{"t":"li","x":"Δυνατός βρυχηθμός από τη θάλασσα.","e":"A loud roar from the sea."},{"t":"li","x":"Μήνυμα 112.","e":"A 112 message."},{"t":"h","x":"Τι κάνω","e":"What to do"},{"t":"step","x":"ΜΗΝ περιμένεις οδηγίες. Φύγε αμέσως.","e":"DO NOT wait for instructions. Leave at once."},{"t":"step","x":"Πήγαινε σε ψηλό σημείο (λόφο) ή όσο πιο μακριά από την ακτή μπορείς.","e":"Go to high ground (a hill) or as far from the coast as you can."},{"t":"step","x":"Αν δεν προλαβαίνεις: ανέβα σε ψηλό γερό κτίριο από μπετό (3ος όροφος και πάνω).","e":"If there is no time: go up a tall, strong concrete building (3rd floor and above)."},{"t":"step","x":"Πήγαινε με τα πόδια αν οι δρόμοι είναι μπλοκαρισμένοι.","e":"Go on foot if the roads are blocked."},{"t":"step","x":"Μείνε ψηλά για ώρες. Έρχονται πολλά κύματα και το πρώτο συχνά ΔΕΝ είναι το μεγαλύτερο.","e":"Stay high for hours. Many waves come and the first is often NOT the biggest."},{"t":"warn","x":"ΠΟΤΕ μην πας να δεις τη θάλασσα που τραβήχτηκε.","e":"NEVER go to look at the sea that has pulled back."},{"t":"h","x":"Αν είσαι σε σκάφος","e":"If you are on a boat"},{"t":"li","x":"Σε βαθιά νερά (πάνω από ~50 m) το τσουνάμι σχεδόν δεν φαίνεται. Αν προλαβαίνεις, βγες ανοιχτά.","e":"In deep water (over ~50 m) a tsunami can hardly be seen. If there is time, head out to open sea."},{"t":"li","x":"Μέσα στο λιμάνι: άφησε το σκάφος και ανέβα ψηλά στη στεριά.","e":"Inside the harbour: leave the boat and go to high ground on land."},{"t":"tip","x":"Αν ζεις ή κάνεις διακοπές σε ακτή: βρες από πριν τον πιο κοντινό λόφο και τον δρόμο προς τα εκεί.","e":"If you live or holiday on a coast: find the nearest hill and the road to it in advance."}],"te":"Tsunami","se":"Go high, right now"},{"cat":"now","id":"housefire","emoji":"🔥","title":"Φωτιά στο σπίτι","sub":"Βγες, μείνε έξω, κάλεσε 199","blocks":[{"t":"h","x":"Τι κάνω","e":"What to do"},{"t":"step","x":"Φώναξε «ΦΩΤΙΑ!» για να ξυπνήσουν όλοι.","e":"Shout “FIRE!” to wake everyone up."},{"t":"step","x":"Βγείτε έξω αμέσως. Μην μαζεύεις πράγματα.","e":"Get out at once. Do not collect things."},{"t":"step","x":"Αν έχει καπνό: σκύψε και μπουσούλα. Ο καθαρός αέρας είναι χαμηλά.","e":"If there is smoke: get low and crawl. Clean air is near the floor."},{"t":"step","x":"Πριν ανοίξεις πόρτα, ακούμπησε την πόρτα με την ανάποδη του χεριού. Αν καίει, ΜΗΝ την ανοίξεις – βρες άλλη έξοδο.","e":"Before you open a door, touch it with the back of your hand. If it is hot, DO NOT open it – find another way out."},{"t":"step","x":"Κλείνε τις πόρτες πίσω σου. Μια κλειστή πόρτα καθυστερεί τη φωτιά.","e":"Close doors behind you. A closed door slows the fire."},{"t":"step","x":"Έξω, κάλεσε 199 ή 112.","e":"Outside, call 199 or 112."},{"t":"warn","x":"ΠΟΤΕ μην ξαναμπείς μέσα. Ούτε για κατοικίδιο, ούτε για πράγματα.","e":"NEVER go back inside. Not for a pet, not for things."},{"t":"warn","x":"ΜΗΝ πάρεις ασανσέρ.","e":"DO NOT use the lift."},{"t":"h","x":"Αν παγιδευτείς σε δωμάτιο","e":"If you are trapped in a room"},{"t":"step","x":"Κλείσε την πόρτα και βάλε βρεγμένες πετσέτες στις χαραμάδες.","e":"Close the door and put wet towels in the gaps."},{"t":"step","x":"Κάλεσε 112 και πες ακριβώς σε ποιο δωμάτιο και όροφο είσαι.","e":"Call 112 and say exactly which room and floor you are on."},{"t":"step","x":"Άνοιξε το παράθυρο και κάνε σήμα με φακό ή ύφασμα.","e":"Open the window and signal with a torch or a cloth."},{"t":"h","x":"Αν πιάσουν φωτιά τα ρούχα σου","e":"If your clothes catch fire"},{"t":"step","x":"ΣΤΑΜΑΤΑ (μην τρέχεις).","e":"STOP (do not run)."},{"t":"step","x":"ΠΕΣΕ κάτω.","e":"DROP to the ground."},{"t":"step","x":"ΚΥΛΗΣΟΥ και κάλυψε το πρόσωπο με τα χέρια.","e":"ROLL and cover your face with your hands."},{"t":"h","x":"Μικρή φωτιά στην κουζίνα","e":"Small kitchen fire"},{"t":"li","x":"Τηγάνι με λάδι: σβήσε το μάτι και σκέπασε με καπάκι ή βρεγμένη πετσέτα (στυμμένη). ΠΟΤΕ νερό σε λάδι!","e":"Pan with oil: turn off the hob and cover with a lid or a wet towel (wrung out). NEVER water on oil!"},{"t":"li","x":"Μικρή φωτιά: πυροσβεστήρας. Τράβα την ασφάλεια, σημάδεψε τη ΒΑΣΗ της φωτιάς, πάτα, σκούπα δεξιά-αριστερά.","e":"Small fire: fire extinguisher. Pull the pin, aim at the BASE of the fire, squeeze, sweep side to side."},{"t":"warn","x":"Αν η φωτιά δεν σβήνει σε λίγα δευτερόλεπτα ή μεγαλώνει: φύγε.","e":"If the fire does not go out in a few seconds or grows: get out."},{"t":"tip","x":"Βάλε ανιχνευτή καπνού σε κάθε όροφο και ανιχνευτή μονοξειδίου (CO) κοντά σε κρεβατοκάμαρες. Δοκίμασέ τους κάθε μήνα.","e":"Fit a smoke alarm on every floor and a carbon monoxide (CO) alarm near bedrooms. Test them every month."},{"t":"tip","x":"Έχε πυροσβεστήρα ξηράς σκόνης 6 kg στην κουζίνα και κουβέρτα πυρόσβεσης.","e":"Keep a 6 kg dry powder fire extinguisher and a fire blanket in the kitchen."}],"te":"House fire","se":"Get out, stay out, call 199"},{"cat":"now","id":"wildfire","emoji":"🌲","title":"Δασική πυρκαγιά","sub":"Φεύγω νωρίς – ακούω το 112","blocks":[{"t":"h","x":"Πριν έρθει","e":"Before it comes"},{"t":"li","x":"Φύγε ΝΩΡΙΣ όταν σου πει το 112 ή η Πολιτική Προστασία. Η πιο επικίνδυνη στιγμή είναι η καθυστερημένη φυγή με το αυτοκίνητο μέσα στον καπνό.","e":"Leave EARLY when 112 or Civil Protection tells you. The most dangerous moment is a late escape by car through the smoke."},{"t":"li","x":"Πάρε σακίδιο, φάρμακα, έγγραφα, κατοικίδια.","e":"Take your backpack, medicines, documents, pets."},{"t":"li","x":"Φόρεσε ρούχα από βαμβάκι ή μαλλί που καλύπτουν όλο το σώμα, γερά παπούτσια, μαντήλι βρεγμένο. ΟΧΙ συνθετικά (λιώνουν).","e":"Wear cotton or wool clothes that cover the whole body, strong shoes, a wet scarf. NO synthetics (they melt)."},{"t":"li","x":"Κλείσε γκάζι, φιάλες υγραερίου μακριά από το σπίτι.","e":"Turn off the gas, move LPG bottles away from the house."},{"t":"h","x":"Αν είσαι σε αυτοκίνητο και σε προλαβαίνει","e":"If you are in a car and the fire catches you"},{"t":"step","x":"Σταμάτα σε σημείο χωρίς βλάστηση (χωματόδρομος, άσφαλτος, βράχια).","e":"Stop in a place with no plants (dirt road, asphalt, rocks)."},{"t":"step","x":"Κλείσε παράθυρα και αεραγωγούς, άναψε φώτα, άφησε τη μηχανή να δουλεύει.","e":"Close windows and air vents, turn on the lights, leave the engine running."},{"t":"step","x":"Ξάπλωσε στο πάτωμα του αυτοκινήτου και σκεπάσου με μάλλινη κουβέρτα.","e":"Lie on the floor of the car and cover yourself with a wool blanket."},{"t":"step","x":"Μείνε μέσα μέχρι να περάσει το μέτωπο. Το αυτοκίνητο προστατεύει από τη θερμότητα.","e":"Stay inside until the fire front passes. The car protects you from the heat."},{"t":"warn","x":"ΜΗΝ βγεις να τρέξεις μέσα στον καπνό. Η ακτινοβολούμενη θερμότητα σκοτώνει.","e":"DO NOT get out and run through the smoke. Radiant heat kills."},{"t":"h","x":"Αν είσαι σε σπίτι και δεν μπορείς να φύγεις","e":"If you are in a house and cannot leave"},{"t":"step","x":"Μείνε μέσα σε γερό σπίτι (πέτρα, μπετό). Κλείσε όλα τα παράθυρα και τις πόρτες.","e":"Stay inside a strong house (stone, concrete). Close all windows and doors."},{"t":"step","x":"Κατέβασε τα ρολά, βγάλε κουρτίνες από τα παράθυρα.","e":"Lower the shutters, take curtains off the windows."},{"t":"step","x":"Γέμισε μπανιέρες και κουβάδες με νερό, έχε βρεγμένες πετσέτες.","e":"Fill baths and buckets with water, keep wet towels ready."},{"t":"step","x":"Μείνε σε δωμάτιο μακριά από την πλευρά της φωτιάς.","e":"Stay in a room away from the side of the fire."},{"t":"step","x":"Όταν περάσει το μέτωπο, βγες και σβήσε τις μικρές εστίες γύρω από το σπίτι.","e":"When the fire front has passed, go out and put out small fires around the house."},{"t":"h","x":"Αν είσαι με τα πόδια","e":"If you are on foot"},{"t":"li","x":"Πήγαινε σε καμένη ήδη περιοχή, βραχώδη, ή σε θάλασσα/νερό.","e":"Go to an area that has already burned, a rocky area, or into the sea/water."},{"t":"li","x":"Μην ανεβαίνεις ανηφόρα προς τα πάνω – η φωτιά ανεβαίνει πιο γρήγορα από σένα.","e":"Do not climb uphill – fire goes uphill faster than you."},{"t":"li","x":"Κινήσου κάθετα στη φορά του ανέμου, όχι μπροστά από τη φωτιά.","e":"Move across the wind direction, not in front of the fire."},{"t":"li","x":"Αν είσαι σε παραλία: μπες στο νερό αν χρειαστεί, κάλυψε το κεφάλι με βρεγμένο ύφασμα.","e":"If you are on a beach: go into the water if needed, cover your head with a wet cloth."},{"t":"tip","x":"Καθάρισε ξερά χόρτα και κλαδιά 10 m γύρω από το σπίτι πριν το καλοκαίρι.","e":"Clear dry grass and branches 10 m around the house before summer."},{"t":"tip","x":"Έχε λάστιχο ποτίσματος που φτάνει σε όλο το σπίτι και αντλία/γεννήτρια αν έχεις πηγάδι.","e":"Keep a garden hose that reaches all around the house, and a pump/generator if you have a well."}],"te":"Wildfire","se":"Leave early – listen to 112"},{"cat":"now","id":"flood","emoji":"🌧️","title":"Πλημμύρα – καταιγίδα","sub":"Όχι στα ορμητικά νερά","blocks":[{"t":"h","x":"Τι κάνω","e":"What to do"},{"t":"step","x":"Ανέβα ψηλά (όροφο, λόφο). Όχι σε υπόγεια.","e":"Go up high (upper floor, hill). Not into basements."},{"t":"step","x":"Κλείσε ρεύμα και γκάζι αν μπαίνει νερό στο σπίτι.","e":"Turn off power and gas if water is coming into the house."},{"t":"step","x":"Μην περπατάς σε νερό που τρέχει. Μόλις 15 cm ορμητικό νερό ρίχνει άνθρωπο.","e":"Do not walk in moving water. Just 15 cm of fast water can knock a person down."},{"t":"step","x":"Μην οδηγείς σε πλημμυρισμένο δρόμο. 30 cm νερό σηκώνει αυτοκίνητο, 60 cm το παρασύρει.","e":"Do not drive on a flooded road. 30 cm of water lifts a car, 60 cm sweeps it away."},{"t":"step","x":"Μακριά από ρέματα, γέφυρες ρεμάτων, φρεάτια.","e":"Keep away from streams, stream bridges, drains."},{"t":"warn","x":"Ο δρόμος που ξέρεις μπορεί να έχει φύγει κάτω από το νερό. Μην βασίζεσαι στο «από εδώ περνάω κάθε μέρα».","e":"The road you know may be washed away under the water. Do not rely on “I drive this way every day”."},{"t":"h","x":"Αν παγιδευτείς στο αυτοκίνητο και ανεβαίνει νερό","e":"If you are trapped in the car and the water is rising"},{"t":"step","x":"Βγάλε ζώνη.","e":"Take off your seat belt."},{"t":"step","x":"Άνοιξε ή σπάσε το ΠΛΑΪΝΟ παράθυρο (όχι παρμπρίζ).","e":"Open or break the SIDE window (not the windscreen)."},{"t":"step","x":"Βγες από το παράθυρο. Πρώτα τα παιδιά.","e":"Get out through the window. Children first."},{"t":"tip","x":"Έχε στο αυτοκίνητο σφυράκι θραύσης τζαμιών με κόφτη ζώνης.","e":"Keep a window-breaking hammer with a belt cutter in the car."},{"t":"h","x":"Αν σε παρασύρει το νερό","e":"If the water sweeps you away"},{"t":"li","x":"Πόδια μπροστά, προς τα κάτω ρεύμα, ανάσκελα. Πιάσε κάτι σταθερό. Μην παλεύεις κόντρα στο ρεύμα.","e":"Feet first, pointing downstream, on your back. Grab something fixed. Do not fight against the current."},{"t":"h","x":"Κεραυνοί","e":"Lightning"},{"t":"li","x":"Όταν ακούς βροντή, ο κεραυνός μπορεί να σε βρει. Μπες σε κτίριο ή κλειστό αυτοκίνητο.","e":"If you can hear thunder, lightning can reach you. Go into a building or a closed car."},{"t":"li","x":"Όχι κάτω από μοναχικό δέντρο, όχι σε κορυφή, έξω από το νερό.","e":"Not under a lone tree, not on a hilltop, get out of the water."},{"t":"li","x":"Αν είσαι στο ύπαιθρο χωρίς κάλυψη: σκύψε στις μύτες, πόδια ενωμένα, χέρια στα αυτιά. Μην ξαπλώσεις.","e":"If you are outdoors with no cover: crouch on your toes, feet together, hands over your ears. Do not lie down."},{"t":"li","x":"Μετά την τελευταία βροντή περίμενε 30 λεπτά.","e":"After the last thunder, wait 30 minutes."},{"t":"h","x":"Μετά την πλημμύρα","e":"After the flood"},{"t":"li","x":"Μην ανάβεις ρεύμα αν βράχηκε η εγκατάσταση. Ηλεκτρολόγος πρώτα.","e":"Do not turn on the power if the wiring got wet. Electrician first."},{"t":"li","x":"Το νερό της πλημμύρας είναι βρόμικο (λύματα). Γάντια, μπότες. Πέτα φαγητά που βράχηκαν.","e":"Flood water is dirty (sewage). Gloves, boots. Throw away food that got wet."}],"te":"Flood – storm","se":"Stay out of fast water"},{"cat":"now","id":"flood_road","emoji":"🌊","title":"Πλημμυρισμένος δρόμος – αυτοκίνητο στο νερό","sub":"Γύρνα πίσω – μην πνιγείς","blocks":[{"t":"warn","x":"Οι περισσότεροι θάνατοι στις πλημμύρες γίνονται ΜΕΣΑ ΣΕ ΑΥΤΟΚΙΝΗΤΑ που προσπάθησαν να περάσουν νερό. ΠΟΤΕ μην περνάς δρόμο, ρέμα ή υπόγεια διάβαση με νερό που τρέχει.","e":"Most flood deaths happen INSIDE CARS that tried to drive through water. NEVER cross a road, stream or underpass with flowing water."},{"t":"h","x":"Πόσο νερό είναι επικίνδυνο","e":"How much water is dangerous"},{"t":"li","x":"15 cm νερό που τρέχει: ρίχνει άνθρωπο κάτω.","e":"15 cm of flowing water: knocks a person down."},{"t":"li","x":"30 cm: σηκώνει και παρασύρει τα περισσότερα αυτοκίνητα.","e":"30 cm: lifts and sweeps away most cars."},{"t":"li","x":"60 cm: παρασύρει ακόμα και τζιπ και φορτηγάκια.","e":"60 cm: sweeps away even 4x4s and vans."},{"t":"li","x":"Δεν ξέρεις αν από κάτω ο δρόμος υπάρχει ακόμα – το νερό τρώει την άσφαλτο. Δεν βλέπεις φρεάτια χωρίς καπάκι.","e":"You do not know if the road is still there underneath – water eats away the asphalt. You cannot see open manholes."},{"t":"li","x":"Υπόγειες διαβάσεις: γεμίζουν μέσα σε λίγα λεπτά. Είναι παγίδες.","e":"Underpasses: they fill up within a few minutes. They are traps."},{"t":"h","x":"Τι κάνω","e":"What to do"},{"t":"step","x":"Βλέπεις νερό στον δρόμο: ΓΥΡΝΑ ΠΙΣΩ. Ψάξε ψηλότερο δρόμο ή σταμάτα σε ψηλό σημείο και περίμενε.","e":"You see water on the road: TURN BACK. Look for a higher road, or stop on high ground and wait."},{"t":"step","x":"Μη σταθμεύεις δίπλα σε ρέματα, κοίτες χειμάρρων, κάτω από γέφυρες.","e":"Do not park next to streams, dry riverbeds or under bridges."},{"t":"step","x":"Αν το αυτοκίνητο σβήσει μέσα σε νερό που ανεβαίνει: βγες ΑΜΕΣΩΣ και πήγαινε σε ψηλό σημείο. Άφησε το αυτοκίνητο.","e":"If the car stalls in rising water: get out IMMEDIATELY and go to high ground. Leave the car."},{"t":"h","x":"Αν το αυτοκίνητο πέσει ή παρασυρθεί μέσα στο νερό: Ζ-Π-Π-Β","e":"If the car falls or is swept into the water: B-W-C-O"},{"t":"step","x":"ΖΩΝΗ: λύσε τη ζώνη αμέσως.","e":"BELT: undo your seat belt at once."},{"t":"step","x":"ΠΑΡΑΘΥΡΟ: άνοιξε το πλαϊνό παράθυρο ΑΜΕΣΑ, πριν πέσει το ηλεκτρικό. Αν δεν ανοίγει, σπάσε το πλαϊνό με σφυράκι ή κόφτη ζώνης (στη γωνία του τζαμιού). ΟΧΙ το παρμπρίζ – δεν σπάει.","e":"WINDOW: open the side window IMMEDIATELY, before the electrics fail. If it does not open, break the side window with a safety hammer or belt cutter (in the corner of the glass). NOT the windscreen – it does not break."},{"t":"step","x":"ΠΑΙΔΙΑ: βγάλε τα παιδιά από το παράθυρο ΠΡΙΝ από σένα – τα μεγαλύτερα πρώτα (για να βοηθάνε), τα μικρά τα κρατάς μαζί σου.","e":"CHILDREN: get the children out of the window BEFORE you – the older ones first (so they can help), keep the small ones with you."},{"t":"step","x":"ΒΓΕΣ: εσύ τελευταίος, με τα μικρά, από το παράθυρο, αμέσως. ΜΗΝ περιμένεις να γεμίσει, μην προσπαθείς να ανοίξεις πόρτα, μην τηλεφωνείς πρώτα.","e":"OUT: you last, with the small ones, through the window, at once. DO NOT wait for it to fill up, do not try to open a door, do not phone first."},{"t":"tip","x":"Αγόρασε ΣΗΜΕΡΑ ένα σφυράκι ασφαλείας με κόφτη ζώνης και βάλ' το εκεί που φτάνει ο οδηγός (όχι στο ντουλαπάκι πίσω). Κοστίζει όσο ένας καφές.","e":"Buy a safety hammer with a belt cutter TODAY and keep it where the driver can reach it (not in the glovebox or the back). It costs as much as a coffee."},{"t":"h","x":"Αν πέσεις στο νερό","e":"If you fall into the water"},{"t":"li","x":"Ξάπλωσε ανάσκελα με τα πόδια μπροστά, προς τη ροή – για να σπρώχνεις εμπόδια με τα πόδια.","e":"Lie on your back with your feet first, pointing downstream – so you push obstacles away with your feet."},{"t":"li","x":"Μην πολεμάς το ρεύμα. Κολύμπα λοξά προς την όχθη.","e":"Do not fight the current. Swim at an angle towards the bank."},{"t":"li","x":"Πιάσου από κάτι σταθερό και φώναξε / σφύρα για βοήθεια.","e":"Hold on to something fixed and shout / whistle for help."}],"te":"Flooded road – car in the water","se":"Turn back – do not drown"},{"cat":"now","id":"heat","emoji":"☀️","title":"Καύσωνας","sub":"Δροσιά, νερό, σκιά","blocks":[{"t":"h","x":"Τι κάνω","e":"What to do"},{"t":"step","x":"Μείνε μέσα 11:00–17:00. Κλείσε παντζούρια τη μέρα, άνοιξε το βράδυ.","e":"Stay inside 11:00–17:00. Close shutters by day, open them at night."},{"t":"step","x":"Πίνε νερό συχνά, ακόμα κι αν δεν διψάς. Όχι αλκοόλ, λίγος καφές.","e":"Drink water often, even if you are not thirsty. No alcohol, little coffee."},{"t":"step","x":"Ελαφριά, ανοιχτόχρωμα, φαρδιά ρούχα, καπέλο.","e":"Light, light-coloured, loose clothes, a hat."},{"t":"step","x":"Δροσερά ντους, βρεγμένη πετσέτα στον λαιμό.","e":"Cool showers, a wet towel on the neck."},{"t":"step","x":"Αν δεν έχεις κλιματισμό: πήγαινε σε κλιματιζόμενο χώρο (κλιματιζόμενες αίθουσες δήμου, εμπορικό κέντρο).","e":"If you have no air conditioning: go to a cool place (municipal cooling centres, shopping centre)."},{"t":"step","x":"Τηλεφώνα κάθε μέρα σε ηλικιωμένους γείτονες και συγγενείς.","e":"Call elderly neighbours and relatives every day."},{"t":"warn","x":"ΠΟΤΕ παιδί ή ζώο μέσα σε κλειστό αυτοκίνητο. Ούτε για 2 λεπτά.","e":"NEVER leave a child or an animal in a closed car. Not even for 2 minutes."},{"t":"h","x":"Θερμοπληξία – ΕΠΕΙΓΟΝ","e":"Heatstroke – URGENT"},{"t":"li","x":"Σημάδια: πολύ ζεστό δέρμα, σύγχυση, παράξενη συμπεριφορά, λιποθυμία, σπασμοί.","e":"Signs: very hot skin, confusion, strange behaviour, fainting, fits."},{"t":"step","x":"Κάλεσε 166 / 112.","e":"Call 166 / 112."},{"t":"step","x":"Βάλ' τον σε σκιά/δροσερό μέρος, βγάλε ρούχα.","e":"Move the person to shade/a cool place, take off clothes."},{"t":"step","x":"Δρόσισέ τον ΑΜΕΣΩΣ: νερό σε όλο το σώμα και αέρας, πάγος σε λαιμό, μασχάλες, βουβώνες.","e":"Cool them AT ONCE: water all over the body and air, ice on the neck, armpits, groin."},{"t":"step","x":"Αν έχει πλήρεις αισθήσεις, λίγο δροσερό νερό να πιει.","e":"If fully awake, give a little cool water to drink."},{"t":"h","x":"Θερμική εξάντληση","e":"Heat exhaustion"},{"t":"li","x":"Ζάλη, έντονος ιδρώτας, πονοκέφαλος, ναυτία, κράμπες: σκιά, ξάπλωμα, νερό με λίγο αλάτι/ηλεκτρολύτες. Αν δεν βελτιωθεί σε 30 λεπτά → γιατρός.","e":"Dizziness, heavy sweating, headache, nausea, cramps: shade, lie down, water with a little salt/electrolytes. If not better in 30 minutes → doctor."}],"te":"Heatwave","se":"Cool, water, shade"},{"cat":"now","id":"heat_nopower","emoji":"🥵","title":"Καύσωνας χωρίς ρεύμα","sub":"Δροσιά χωρίς κλιματιστικό","blocks":[{"t":"tip","x":"Στον καύσωνα κινδυνεύουν πρώτα οι ηλικιωμένοι, τα μωρά, οι άρρωστοι και όσοι μένουν μόνοι. Τηλεφώνα τους 2 φορές τη μέρα.","e":"In a heatwave, elderly people, babies, sick people and those who live alone are at risk first. Call them 2 times a day."},{"t":"h","x":"Το σπίτι","e":"The house"},{"t":"step","x":"Μείνε στο πιο δροσερό δωμάτιο: χαμηλός όροφος, βόρεια πλευρά, μακριά από ταράτσα.","e":"Stay in the coolest room: lower floor, north side, away from the roof."},{"t":"step","x":"ΜΕΡΑ: παντζούρια, κουρτίνες, τέντες ΚΛΕΙΣΤΑ. Ο ήλιος δεν πρέπει να μπαίνει.","e":"DAYTIME: shutters, curtains, awnings CLOSED. Keep the sun out."},{"t":"step","x":"ΝΥΧΤΑ και νωρίς το πρωί: άνοιξε τα παράθυρα σε αντίθετες πλευρές για ρεύμα αέρα.","e":"NIGHT and early morning: open windows on opposite sides for a draught."},{"t":"step","x":"Βρεγμένο σεντόνι κρεμασμένο στο ανοιχτό παράθυρο ή πάνω από ανεμιστήρα μπαταρίας = δροσερός αέρας.","e":"A wet sheet hung in the open window or over a battery fan = cool air."},{"t":"step","x":"Μπουκάλια με πάγο (αν υπάρχουν) μπροστά σε ανεμιστήρα.","e":"Bottles of ice (if you have them) in front of a fan."},{"t":"step","x":"Σβήσε ό,τι ζεσταίνει: φούρνο, φώτα, συσκευές.","e":"Switch off anything that heats: oven, lights, appliances."},{"t":"h","x":"Το σώμα","e":"The body"},{"t":"li","x":"Νερό συχνά, πριν διψάσεις. Ανοιχτόχρωμα ούρα = καλά. Σκούρα = πίνε περισσότερο.","e":"Drink water often, before you get thirsty. Light-coloured urine = good. Dark = drink more."},{"t":"li","x":"Χλιαρό ντους (όχι παγωμένο) ή βρεγμένο πανί σε σβέρκο, μασχάλες, καρπούς, πόδια σε λεκάνη με νερό.","e":"Lukewarm shower (not ice-cold) or a wet cloth on the neck, armpits, wrists, feet in a basin of water."},{"t":"li","x":"Βρέξε τα ρούχα ή μια μπλούζα και φόρεσέ τη – η εξάτμιση δροσίζει.","e":"Wet your clothes or a T-shirt and wear it – evaporation cools you."},{"t":"li","x":"Ελαφριά, φαρδιά, ανοιχτόχρωμα βαμβακερά ρούχα. Καπέλο έξω.","e":"Light, loose, light-coloured cotton clothes. A hat outdoors."},{"t":"li","x":"Ελαφρύ φαγητό, φρούτα, αλάτι αν ιδρώνεις πολύ. ΟΧΙ αλκοόλ, λιγότερος καφές.","e":"Light meals, fruit, salt if you sweat a lot. NO alcohol, less coffee."},{"t":"li","x":"Βγες έξω μόνο νωρίς το πρωί ή αργά το απόγευμα.","e":"Go out only early in the morning or late in the afternoon."},{"t":"li","x":"Αν το σπίτι δεν παλεύεται: κλιματιζόμενες αίθουσες του δήμου, εκκλησίες, εμπορικά κέντρα, βιβλιοθήκες.","e":"If the house is unbearable: municipal cooling centres, churches, shopping centres, libraries."},{"t":"h","x":"Φάρμακα στη ζέστη","e":"Medicines in the heat"},{"t":"li","x":"Ινσουλίνη και ορισμένα φάρμακα χαλάνε στη ζέστη. Ειδικές θήκες δροσισμού που βρέχεις με νερό κρατάνε την ινσουλίνη δροσερή για μέρες χωρίς ψυγείο.","e":"Insulin and some medicines spoil in the heat. Special cooling cases that you soak in water keep insulin cool for days without a fridge."},{"t":"li","x":"Κάποια φάρμακα (διουρητικά, για πίεση, ψυχιατρικά) αυξάνουν τον κίνδυνο θερμοπληξίας. Ρώτα τον γιατρό σου από πριν.","e":"Some medicines (diuretics, blood pressure, psychiatric medicines) increase the risk of heatstroke. Ask your doctor in advance."},{"t":"warn","x":"ΠΟΤΕ παιδί ή ζώο μέσα σε σταματημένο αυτοκίνητο – ούτε για 2 λεπτά.","e":"NEVER leave a child or animal in a parked car – not even for 2 minutes."},{"t":"h","x":"Θερμοπληξία = ΕΠΕΙΓΟΝ","e":"Heatstroke = EMERGENCY"},{"t":"li","x":"Σημάδια: πολύ ζεστό δέρμα (ξηρό ή ιδρωμένο), μπερδεμένος, παραληρεί, λιποθυμά, σπασμοί, έμετος, πονοκέφαλος.","e":"Signs: very hot skin (dry or sweaty), confusion, delirium, fainting, seizures, vomiting, headache."},{"t":"step","x":"Κάλεσε 166 / 112.","e":"Call 166 / 112."},{"t":"step","x":"Σε σκιά ή δροσερό χώρο, βγάλε ρούχα.","e":"Move to shade or a cool place, remove clothing."},{"t":"step","x":"Δρόσισέ τον ΑΜΕΣΩΣ και δυνατά: κρύο νερό σε όλο το σώμα + αέρας (βεντάλια, ανεμιστήρας), βρεγμένες πετσέτες που αλλάζεις συνέχεια, πάγος σε λαιμό, μασχάλες, βουβώνες. Αν υπάρχει, βύθιση σε κρύο νερό μέχρι τον λαιμό.","e":"Cool them IMMEDIATELY and aggressively: cold water over the whole body + air (fan, hand fan), wet towels changed constantly, ice on the neck, armpits, groin. If possible, immerse in cold water up to the neck."},{"t":"step","x":"Νερό να πιει ΜΟΝΟ αν είναι εντελώς ξύπνιος και καταπίνει.","e":"Give water to drink ONLY if they are fully awake and able to swallow."}],"te":"Heatwave without power","se":"Staying cool without air conditioning"},{"cat":"now","id":"cold","emoji":"❄️","title":"Κρύο – χιόνι – παγετός","sub":"Ζέστη χωρίς κινδύνους","blocks":[{"t":"h","x":"Στο σπίτι χωρίς θέρμανση","e":"At home without heating"},{"t":"step","x":"Μάζεψε την οικογένεια σε ΕΝΑ δωμάτιο, το μικρότερο, με λίγα παράθυρα.","e":"Gather the family in ONE room, the smallest one, with few windows."},{"t":"step","x":"Κλείσε τα υπόλοιπα δωμάτια. Κουβέρτες στα παράθυρα, πετσέτες κάτω από τις πόρτες.","e":"Close the other rooms. Blankets on the windows, towels under the doors."},{"t":"step","x":"Ντύσου σε στρώσεις: εσωτερικό μάλλινο/θερμικό, fleece, εξωτερικό. Σκούφος (χάνεται πολλή ζέστη από το κεφάλι), κάλτσες μάλλινες.","e":"Dress in layers: inner wool/thermal, fleece, outer layer. A hat (you lose a lot of heat from your head), wool socks."},{"t":"step","x":"Κοιμηθείτε μαζί, με υπόστρωμα κάτω από το στρώμα/sleeping bag – το κρύο έρχεται από κάτω. Ακόμα καλύτερα: στήσε σκηνή μέσα στο δωμάτιο (δες «Σπίτι χωρίς θέρμανση – μικροκλίμα»).","e":"Sleep together, with a mat under the mattress/sleeping bag – the cold comes from below. Even better: set up a tent inside the room (see “Home without heating – microclimate”)."},{"t":"step","x":"Ζεστά ροφήματα και φαγητό. Το σώμα χρειάζεται «καύσιμα» για να ζεσταθεί.","e":"Hot drinks and food. The body needs “fuel” to warm up."},{"t":"step","x":"Μπουκάλι με ζεστό νερό (όχι βραστό) μέσα στο sleeping bag.","e":"A bottle of hot water (not boiling) inside the sleeping bag."},{"t":"warn","x":"ΠΟΤΕ μαγκάλι, ψησταριά, γκαζάκι camping ή γεννήτρια μέσα στο σπίτι. Το μονοξείδιο του άνθρακα (CO) δεν μυρίζει και σκοτώνει στον ύπνο.","e":"NEVER use a charcoal brazier, barbecue, camping gas stove or generator inside the house. Carbon monoxide (CO) has no smell and kills in your sleep."},{"t":"warn","x":"Σόμπα υγραερίου/πετρελαίου: μόνο με αερισμό (χαραμάδα παραθύρου) και ποτέ στον ύπνο.","e":"Gas/paraffin heater: only with air flow (window slightly open) and never while sleeping."},{"t":"h","x":"Υποθερμία","e":"Hypothermia"},{"t":"li","x":"Σημάδια: έντονο τρέμουλο, μετά σταματάει το τρέμουλο (κακό σημάδι!), μπερδεμένα λόγια, νύστα, αδεξιότητα.","e":"Signs: strong shivering, then the shivering stops (bad sign!), mixed-up speech, sleepiness, clumsiness."},{"t":"step","x":"Μέσα σε ζεστό χώρο ή προφυλαγμένο από αέρα.","e":"Get inside a warm place or out of the wind."},{"t":"step","x":"Βγάλε τα βρεγμένα ρούχα, βάλε στεγνά.","e":"Take off wet clothes, put on dry ones."},{"t":"step","x":"Τύλιξε σε κουβέρτες, κεφάλι και λαιμό επίσης. Ζέστανε πρώτα τον κορμό (στήθος, λαιμός, βουβώνες).","e":"Wrap in blankets, head and neck too. Warm the body core first (chest, neck, groin)."},{"t":"step","x":"Ζεστό γλυκό ρόφημα μόνο αν είναι ξύπνιος και καταπίνει.","e":"A warm sweet drink only if the person is awake and can swallow."},{"t":"step","x":"Κάλεσε 166 / 112 σε σοβαρή υποθερμία.","e":"Call 166 / 112 for serious hypothermia."},{"t":"warn","x":"Χειρίσου τον απαλά. ΜΗΝ τρίβεις χέρια-πόδια. ΜΗΝ δώσεις αλκοόλ.","e":"Handle the person gently. DO NOT rub arms and legs. DO NOT give alcohol."},{"t":"h","x":"Κρυοπαγήματα","e":"Frostbite"},{"t":"li","x":"Λευκό, κηρώδες, αναίσθητο δέρμα σε δάχτυλα, μύτη, αυτιά.","e":"White, waxy, numb skin on fingers, nose, ears."},{"t":"li","x":"Ζέστανε σε χλιαρό (όχι καυτό) νερό. Μην τρίβεις. Μην το ξαναζεστάνεις αν μπορεί να ξαναπαγώσει.","e":"Warm in lukewarm (not hot) water. Do not rub. Do not rewarm if it may freeze again."},{"t":"h","x":"Εγκλωβισμός σε αυτοκίνητο στο χιόνι","e":"Stuck in a car in the snow"},{"t":"step","x":"Μείνε στο αυτοκίνητο. Κάλεσε 112.","e":"Stay in the car. Call 112."},{"t":"step","x":"Μηχανή 10 λεπτά κάθε ώρα για ζέστη, με λίγο ανοιχτό παράθυρο.","e":"Run the engine 10 minutes every hour for heat, with a window slightly open."},{"t":"step","x":"ΚΑΘΑΡΙΣΕ την εξάτμιση από χιόνι πριν ανάψεις μηχανή (κίνδυνος CO).","e":"CLEAR snow from the exhaust before you start the engine (danger of CO)."},{"t":"step","x":"Κίνησε χέρια-πόδια, κουβέρτες, μη κοιμάστε όλοι μαζί – ένας ξύπνιος.","e":"Move arms and legs, use blankets, do not all sleep at once – one stays awake."},{"t":"step","x":"Δέσε κόκκινο ύφασμα στην κεραία.","e":"Tie a red cloth to the aerial."},{"t":"tip","x":"Αναλυτικά: «Σπίτι χωρίς θέρμανση – μικροκλίμα» και «Ύπνος στο αυτοκίνητο».","e":"More details: “Home without heating – microclimate” and “Sleeping in the car”."}],"te":"Cold – snow – frost","se":"Warmth without danger"},{"cat":"now","id":"car_snow","emoji":"🚗","title":"Αυτοκίνητο σε χιονοθύελλα","sub":"Κόλλησα στο χιόνι – τι κάνω","blocks":[{"t":"h","x":"Πριν ξεκινήσεις","e":"Before you set off"},{"t":"chk","x":"Δες την πρόγνωση και αν οι δρόμοι είναι ανοιχτοί. Αν λένε «μόνο με αλυσίδες» ή «αποφύγετε τις μετακινήσεις» – μην πας.","e":"Check the forecast and whether the roads are open. If they say “snow chains only” or “avoid travel” – do not go."},{"t":"chk","x":"Γεμάτο ντεπόζιτο, αλυσίδες που ξέρεις να βάζεις, κιτ αυτοκινήτου, sleeping bag ή κουβέρτες, νερό, φαγητό, φτυάρι, φακός","e":"Full fuel tank, snow chains you know how to fit, car kit, sleeping bag or blankets, water, food, shovel, flashlight"},{"t":"chk","x":"Πες σε κάποιον τη διαδρομή και τι ώρα θα φτάσεις","e":"Tell someone your route and what time you will arrive"},{"t":"h","x":"Αν κολλήσεις","e":"If you get stuck"},{"t":"step","x":"ΜΕΙΝΕ ΣΤΟ ΑΥΤΟΚΙΝΗΤΟ. Είναι καταφύγιο και φαίνεται από μακριά. Σε χιονοθύελλα χάνεσαι μέσα σε λίγα μέτρα.","e":"STAY IN THE CAR. It is a shelter and can be seen from far away. In a snowstorm you get lost within a few metres."},{"t":"step","x":"Κάλεσε 112: πες δρόμο, κατεύθυνση, χιλιομετρική πινακίδα ή κοντινό χωριό, πόσα άτομα είστε. Στείλε και τις συντεταγμένες από την πυξίδα/GPS της εφαρμογής.","e":"Call 112: give the road, direction, kilometre marker or nearest village, how many people you are. Also send the coordinates from the app’s compass/GPS."},{"t":"step","x":"Αλάρμ αναμμένα για λίγο κάθε τόσο. Δέσε κάτι χρωματιστό στην κεραία ή στο παράθυρο.","e":"Hazard lights on for a short time every now and then. Tie something brightly coloured to the aerial or the window."},{"t":"step","x":"ΚΑΘΑΡΙΣΕ ΤΗΝ ΕΞΑΤΜΙΣΗ από χιόνι – και ξανά κάθε ώρα.","e":"CLEAR THE EXHAUST of snow – and again every hour."},{"t":"step","x":"Μηχανή 10 λεπτά κάθε ώρα για θέρμανση, με το παράθυρο λίγο ανοιχτό από την πλευρά που δεν φυσάει.","e":"Run the engine 10 minutes every hour for heat, with the window slightly open on the side away from the wind."},{"t":"warn","x":"Θαμμένη εξάτμιση = το μονοξείδιο μπαίνει μέσα και σκοτώνει στον ύπνο. Αν πονάει το κεφάλι, ζαλίζεσαι ή νυστάζεις παράξενα: σβήσε τη μηχανή, άνοιξε παράθυρα.","e":"Blocked exhaust = carbon monoxide gets inside and kills in your sleep. If you have a headache, feel dizzy or unusually sleepy: switch off the engine, open the windows."},{"t":"h","x":"Μείνε ζεστός","e":"Stay warm"},{"t":"li","x":"Όλοι μαζί, κουβέρτες, sleeping bag, κουβέρτα αλουμινίου. Σκούφος, γάντια.","e":"Everyone close together, blankets, sleeping bag, foil blanket. Hat, gloves."},{"t":"li","x":"Κινήσου μέσα στο αυτοκίνητο: χέρια, πόδια, δάχτυλα – για κυκλοφορία.","e":"Move inside the car: arms, legs, fingers and toes – for circulation."},{"t":"li","x":"Πίνε νερό και τρώγε λίγο λίγο. Χιόνι ΜΗΝ τρως – σε παγώνει. Λιώσε το σε μπουκάλι μέσα στο μπουφάν ή με τη θέρμανση.","e":"Drink water and eat little by little. DO NOT eat snow – it chills you. Melt it in a bottle inside your jacket or with the heater."},{"t":"li","x":"Αν είστε πολλοί: κοιμάστε με βάρδιες – ένας πάντα ξύπνιος να ελέγχει εξάτμιση και θέρμανση.","e":"If there are several of you: sleep in shifts – one person always awake to check the exhaust and heating."},{"t":"li","x":"Βγες έξω ΜΟΝΟ για να καθαρίσεις την εξάτμιση ή αν βλέπεις βοήθεια ή σπίτι πολύ κοντά. Δέσε σχοινί στο αυτοκίνητο αν δεν βλέπεις.","e":"Go outside ONLY to clear the exhaust, or if you see help or a house very close. Tie a rope to the car if you cannot see."}],"te":"Car in a snowstorm","se":"Stuck in the snow – what to do"},{"cat":"now","id":"micro","emoji":"🏠","title":"Σπίτι χωρίς θέρμανση – μικροκλίμα","sub":"Το σώμα σου είναι η σόμπα","blocks":[{"t":"tip","x":"Όταν πέφτει το ρεύμα για πολλές ώρες τον χειμώνα, το σπίτι γίνεται ένα μεγάλο ψυγείο. Δεν ζεσταίνεις όλο το σπίτι. Ζεσταίνεις έναν ΜΙΚΡΟ χώρο γύρω από το σώμα σου.","e":"When the power is off for many hours in winter, the house becomes a big fridge. You do not heat the whole house. You heat a SMALL space around your body."},{"t":"h","x":"Τι είναι το μικροκλίμα (Σ10)","e":"What is a microclimate (in simple words)"},{"t":"li","x":"Το σώμα σου βγάζει ζέστη συνέχεια, σαν μικρή σόμπα (περίπου όσο μια λάμπα 100 W).","e":"Your body gives off heat all the time, like a small heater (about as much as a 100 W bulb)."},{"t":"li","x":"Σε μεγάλο δωμάτιο η ζέστη αυτή χάνεται. Σε μικρό κλειστό χώρο (sleeping bag, σκηνή) μένει γύρω σου και ζεσταίνει τον αέρα.","e":"In a big room this heat is lost. In a small closed space (sleeping bag, tent) it stays around you and warms the air."},{"t":"li","x":"Όσο πιο μικρός και πιο καλά μονωμένος ο χώρος, τόσο πιο ζεστός. Γι' αυτό θέλουμε καλό sleeping bag: για να μην «δραπετεύει» η ζέστη μας.","e":"The smaller and better insulated the space, the warmer it is. That is why we want a good sleeping bag: so our heat does not “escape”."},{"t":"li","x":"Στις βόρειες χώρες (Σκανδιναβία, Καναδάς) το κάνουν όταν πέφτει το ρεύμα: στήνουν σκηνή ΜΕΣΑ στο σπίτι.","e":"In northern countries (Scandinavia, Canada) people do this when the power goes off: they set up a tent INSIDE the house."},{"t":"h","x":"Πώς το στήνω – βήμα βήμα","e":"How to set it up – step by step"},{"t":"step","x":"Διάλεξε το πιο μικρό δωμάτιο, με λίγα παράθυρα, κατά προτίμηση εσωτερικό ή προς τον ήλιο.","e":"Choose the smallest room, with few windows, if possible an inner room or one facing the sun."},{"t":"step","x":"Κλείσε τα υπόλοιπα δωμάτια. Κουβέρτες στα παράθυρα, πετσέτες κάτω από τις πόρτες, κουρτίνες κλειστές.","e":"Close the other rooms. Blankets on the windows, towels under the doors, curtains closed."},{"t":"step","x":"ΣΤΗΣΕ ΣΚΗΝΗ μέσα στο δωμάτιο (δεν θέλει πασσάλους – βάλε βάρη στις γωνίες). Αν δεν έχεις σκηνή: «σπηλιά» από τραπέζι σκεπασμένο με κουβέρτες, ή κουβέρτες κρεμασμένες γύρω από το κρεβάτι.","e":"SET UP A TENT inside the room (no pegs needed – put weights in the corners). If you have no tent: a “cave” made of a table covered with blankets, or blankets hung around the bed."},{"t":"step","x":"ΜΟΝΩΣΗ ΑΠΟ ΚΑΤΩ: ποτέ κατευθείαν σε πλακάκι ή μάρμαρο. Χαλί → υπόστρωμα (foam) → φουσκωτό ή στρώμα → κουβέρτα. Δες «Μόνωση από κάτω».","e":"INSULATION FROM BELOW: never directly on tiles or marble. Rug → mat (foam) → air mattress or mattress → blanket. See “Insulation from below”."},{"t":"step","x":"Μέσα στη σκηνή: sleeping bag για κάθε άτομο. Κοιμηθείτε κοντά ο ένας στον άλλο – κάθε άνθρωπος είναι μια ακόμα σόμπα.","e":"Inside the tent: a sleeping bag for each person. Sleep close to each other – every person is one more heater."},{"t":"step","x":"Κουβέρτα αλουμινίου (ασημοκουβέρτα) πάνω από τη σκηνή ή κάτω από το υπόστρωμα, γυαλιστερή πλευρά προς τα μέσα: γυρίζει πίσω τη ζέστη.","e":"Foil blanket (space blanket) over the tent or under the mat, shiny side in: it sends the heat back."},{"t":"step","x":"Τη μέρα: μείνετε στο ίδιο δωμάτιο, ντυμένοι σε στρώσεις, με σκούφο. Μπείτε στα sleeping bag και ενώ κάθεστε.","e":"In the daytime: stay in the same room, dressed in layers, with a hat. Get into the sleeping bags even while sitting."},{"t":"h","x":"Το κεφάλι ΕΞΩ από τον υπνόσακο","e":"Head OUT of the sleeping bag"},{"t":"warn","x":"Μην χώνεις μύτη και στόμα μέσα στο sleeping bag. Η ανάσα βγάζει πολλή υγρασία που μένει στη γέμιση – ο υπνόσακος βρέχεται από μέσα και παγώνει.","e":"Do not put your nose and mouth inside the sleeping bag. Your breath gives off a lot of moisture that stays in the filling – the sleeping bag gets wet inside and freezes."},{"t":"li","x":"Κράτα το πρόσωπο έξω. Σκούφος, σφίξε την κουκούλα γύρω από το πρόσωπο ώστε να μένει μόνο μια μικρή τρύπα για μύτη και στόμα.","e":"Keep your face out. Wear a hat, pull the hood tight around your face so only a small hole is left for nose and mouth."},{"t":"li","x":"Buff ή μαντήλι στον λαιμό αν κάνει πολύ κρύο στο πρόσωπο.","e":"A buff or scarf on your neck if your face is very cold."},{"t":"h","x":"Μόνωση από κάτω","e":"Insulation from below"},{"t":"li","x":"Το έδαφος/πάτωμα «ρουφάει» τη ζέστη 10 φορές πιο γρήγορα από τον αέρα. Μόνωση από κάτω είναι πιο σημαντική από κουβέρτα από πάνω.","e":"The ground/floor “sucks” heat away 10 times faster than air. Insulation below is more important than a blanket on top."},{"t":"li","x":"Καλύτερα: αφρώδες υπόστρωμα (foam) + φουσκωτό με R-value 4–5+ από πάνω. Τα R-value αθροίζονται.","e":"Best: foam mat + air mattress with R-value 4–5+ on top. R-values add up."},{"t":"li","x":"Αυτοσχέδια: χαρτόνια (πολλές στρώσεις), χαλιά, στρώμα κρεβατιού στο πάτωμα, μαξιλάρια καναπέ, χοντρές κουβέρτες διπλωμένες, πολυστερίνη.","e":"Improvised: cardboard (many layers), rugs, a bed mattress on the floor, sofa cushions, thick folded blankets, polystyrene."},{"t":"li","x":"Ασημοκουβέρτα κάτω από το υπόστρωμα: επιστρέφει θερμότητα και κόβει την υγρασία του δαπέδου.","e":"Foil blanket under the mat: sends heat back and blocks the damp from the floor."},{"t":"h","x":"Κόλπα για ζεστό ύπνο","e":"Tricks for a warm sleep"},{"t":"li","x":"Φάε κάτι λιπαρό/ζεστό πριν τον ύπνο (ξηροί καρποί, σοκολάτα, σούπα). Το σώμα χρειάζεται «καύσιμο».","e":"Eat something fatty/hot before sleep (nuts, chocolate, soup). The body needs “fuel”."},{"t":"li","x":"Κάνε 2 λεπτά κίνηση (καθίσματα) πριν μπεις στον υπνόσακο – μπαίνεις ζεστός, όχι κρύος.","e":"Do 2 minutes of exercise (squats) before getting into the sleeping bag – you go in warm, not cold."},{"t":"li","x":"Μπουκάλι με ζεστό (όχι βραστό) νερό, καλά κλεισμένο, ανάμεσα στους μηρούς ή στα πόδια.","e":"A bottle of hot (not boiling) water, tightly closed, between your thighs or at your feet."},{"t":"li","x":"Στεγνές μάλλινες κάλτσες ΜΟΝΟ για τον ύπνο. Όχι ρούχα που ίδρωσαν.","e":"Dry wool socks ONLY for sleeping. Not clothes you sweated in."},{"t":"li","x":"Βάλε τα ρούχα της επόμενης μέρας μέσα στον υπνόσακο – το πρωί είναι ζεστά.","e":"Put the next day's clothes inside the sleeping bag – in the morning they are warm."},{"t":"li","x":"Ούρησε πριν κοιμηθείς. Έχε δοχείο κοντά για τη νύχτα.","e":"Pee before you sleep. Keep a container nearby for the night."},{"t":"warn","x":"ΠΟΤΕ μαγκάλι, ψησταριά, γκαζάκι ή γεννήτρια μέσα στο σπίτι ή μέσα στη σκηνή. Μονοξείδιο (CO) – δεν μυρίζει, σκοτώνει στον ύπνο. Η σκηνή μέσα στο σπίτι είναι μόνο για τη ζέστη του σώματος.","e":"NEVER use a charcoal brazier, barbecue, gas stove or generator inside the house or inside the tent. Carbon monoxide (CO) – no smell, kills in your sleep. The tent inside the house is only for body heat."},{"t":"tip","x":"Βάλε ανιχνευτή CO με μπαταρία στο δωμάτιο που κοιμάστε.","e":"Put a battery CO alarm in the room where you sleep."}],"te":"Home without heating – microclimate","se":"Your body is the heater"},{"cat":"now","id":"bodystove","emoji":"🔥","title":"Το σώμα σου είναι η σόμπα","sub":"Πώς κρατάς τη ζέστη χωρίς θέρμανση","blocks":[{"t":"tip","x":"Το πιο σημαντικό μυστικό του κρύου: το sleeping bag και η κουβέρτα ΔΕΝ ζεσταίνουν. Απλά ΚΡΑΤΑΝΕ τη ζέστη που φτιάχνει το σώμα σου. Η σόμπα είσαι εσύ.","e":"The most important secret about cold: a sleeping bag and a blanket DO NOT make heat. They just KEEP the heat your body makes. You are the stove."},{"t":"h","x":"Πώς δουλεύει (απλά)","e":"How it works (simply)"},{"t":"li","x":"Το σώμα σου, ξαπλωμένο, βγάζει ζέστη σαν μια λάμπα 80–100 W. Όλη τη νύχτα, χωρίς ρεύμα.","e":"Lying down, your body gives off heat like an 80–100 W light bulb. All night, without electricity."},{"t":"li","x":"Το φαγητό είναι το καύσιμο. Χωρίς φαγητό η σόμπα σβήνει.","e":"Food is the fuel. Without food the stove goes out."},{"t":"li","x":"Το νερό κρατάει τη σόμπα σε λειτουργία. Αφυδατωμένος κρυώνεις πιο γρήγορα.","e":"Water keeps the stove running. When you are dehydrated you get cold faster."},{"t":"li","x":"Η δουλειά σου: να ΜΗ χάνεις τη ζέστη – από κάτω (έδαφος), από τον αέρα, από τα βρεγμένα ρούχα.","e":"Your job: DO NOT lose the heat – from below (the ground), to the air, through wet clothes."},{"t":"h","x":"Βάλε «καύσιμο» πριν τον ύπνο","e":"Add “fuel” before sleep"},{"t":"step","x":"Φάε κάτι λιπαρό και γλυκό πριν ξαπλώσεις: ξηροί καρποί, χαλβάς, σοκολάτα, φυστικοβούτυρο, τυρί. Τα λιπαρά «καίγονται» αργά, όλη τη νύχτα.","e":"Eat something fatty and sweet before lying down: nuts, halva, chocolate, peanut butter, cheese. Fats “burn” slowly, all night."},{"t":"step","x":"Πιες κάτι ζεστό και γλυκό (τσάι με μέλι, κακάο).","e":"Drink something hot and sweet (tea with honey, cocoa)."},{"t":"step","x":"Κάνε 20–30 καθίσματα ή κάμψεις λίγο πριν μπεις στο sleeping bag – να ζεσταθείς, ΟΧΙ να ιδρώσεις.","e":"Do 20–30 squats or push-ups just before getting into the sleeping bag – to warm up, NOT to sweat."},{"t":"step","x":"Πήγαινε τουαλέτα πριν τον ύπνο. Το σώμα ξοδεύει ζέστη για να κρατάει ζεστή τη γεμάτη κύστη.","e":"Go to the toilet before sleep. The body uses heat to keep a full bladder warm."},{"t":"h","x":"Το κόλπο με το θερμό / το μπουκάλι","e":"The hot water bottle trick"},{"t":"step","x":"Βράσε νερό και γέμισε μεταλλικό μπουκάλι ή μπουκάλι που αντέχει βραστό νερό (π.χ. Nalgene). Βίδωσε ΠΟΛΥ καλά και γύρισέ το ανάποδα να δεις ότι δεν στάζει.","e":"Boil water and fill a metal bottle or a bottle that can take boiling water (e.g. Nalgene). Screw it VERY tight and turn it upside down to check it does not drip."},{"t":"step","x":"Τύλιξέ το σε κάλτσα ή πετσέτα – ΠΟΤΕ γυμνό πάνω στο δέρμα.","e":"Wrap it in a sock or towel – NEVER bare against the skin."},{"t":"step","x":"Βάλ' το μέσα στο sleeping bag 10 λεπτά πριν μπεις, να ζεσταθεί.","e":"Put it in the sleeping bag 10 minutes before you get in, to warm it up."},{"t":"step","x":"Μετά βάλ' το ανάμεσα στους μηρούς (εκεί περνούν μεγάλες φλέβες και ζεσταίνεται όλο το αίμα) ή στα πόδια.","e":"Then place it between your thighs (large veins pass there and all your blood warms up) or at your feet."},{"t":"li","x":"Ένα λίτρο βραστό νερό μένει ζεστό 6–8 ώρες μέσα στο sleeping bag. Το πρωί το πίνεις – ζεστό νερό χωρίς να ανάψεις φωτιά.","e":"One litre of boiling water stays warm for 6–8 hours inside the sleeping bag. In the morning you drink it – warm water without lighting a fire."},{"t":"li","x":"Η κλασική θερμοφόρα (λαστιχένια) κάνει την ίδια δουλειά: ζεστό (όχι βραστό) νερό, βγάλε τον αέρα, κλείσε καλά.","e":"A classic rubber hot water bottle does the same job: hot (not boiling) water, squeeze out the air, close it well."},{"t":"li","x":"Θερμός (θερμός-φλάσκα) με βραστό νερό δίπλα στο κρεβάτι: ζεστό ρόφημα μέσα στη νύχτα και το πρωί.","e":"A thermos flask of boiling water next to the bed: a hot drink during the night and in the morning."},{"t":"warn","x":"Μωρά, μικρά παιδιά, ηλικιωμένοι, διαβητικοί: δεν καταλαβαίνουν καλά το κάψιμο. Μόνο χλιαρό μπουκάλι, καλά τυλιγμένο, και έλεγχος.","e":"Babies, small children, elderly people, diabetics: they do not feel burns well. Only a lukewarm bottle, well wrapped, and keep checking."},{"t":"h","x":"Μη χάνεις τη ζέστη","e":"Do not lose heat"},{"t":"li","x":"ΑΠΟ ΚΑΤΩ χάνεις τα περισσότερα: το πάτωμα και το έδαφος «ρουφάνε» τη ζέστη. Υπόστρωμα, χαρτόνια, κουβέρτες ΚΑΤΩ από σένα – περισσότερα από όσα βάζεις από πάνω.","e":"You lose the most FROM BELOW: the floor and the ground “suck out” heat. Sleeping mat, cardboard, blankets UNDER you – more than you put on top."},{"t":"li","x":"Σκούφος και στο κρεβάτι. Καλύπτει κεφάλι και αυτιά που χάνουν πολύ.","e":"Wear a hat in bed too. It covers your head and ears, which lose a lot."},{"t":"li","x":"Στεγνές κάλτσες για τον ύπνο, όχι σφιχτές (το σφίξιμο κόβει το αίμα και κρυώνεις).","e":"Dry socks for sleeping, not tight (tightness cuts off blood flow and you get cold)."},{"t":"li","x":"Μην αναπνέεις μέσα στο sleeping bag: η υγρασία της ανάσας το βρέχει και χάνει τη ζέστη του.","e":"Do not breathe inside the sleeping bag: the moisture of your breath makes it damp and it loses its warmth."},{"t":"li","x":"Βρεγμένο ή ιδρωμένο ρούχο = ψυγείο. Άλλαξε αμέσως.","e":"Wet or sweaty clothes = a fridge. Change at once."},{"t":"li","x":"Κοιμηθείτε μαζί, σε ΕΝΑ δωμάτιο. Τα παιδιά στη μέση. Κάθε άνθρωπος είναι μια σόμπα 100 W – 4 άτομα = 400 W σε ένα μικρό δωμάτιο.","e":"Sleep together, in ONE room. Children in the middle. Each person is a 100 W stove – 4 people = 400 W in a small room."},{"t":"li","x":"Μικρό δωμάτιο, κλειστές πόρτες, κουβέρτες ή χαρτόνια στα παράθυρα, πετσέτα στη χαραμάδα της πόρτας.","e":"Small room, doors closed, blankets or cardboard on the windows, a towel along the gap under the door."},{"t":"warn","x":"ΟΧΙ αλκοόλ για ζέστη. Σου δίνει ψεύτικη ζέστη αλλά ανοίγει τα αγγεία και χάνεις θερμότητα πιο γρήγορα.","e":"NO alcohol to warm up. It gives a false feeling of warmth but widens the blood vessels and you lose heat faster."},{"t":"warn","x":"ΟΧΙ γκαζάκι, μαγκάλι, κάρβουνα ή ψησταριά σε κλειστό χώρο – το μονοξείδιο σκοτώνει στον ύπνο χωρίς μυρωδιά.","e":"NO camping gas heater, brazier, charcoal or barbecue indoors – carbon monoxide kills in your sleep and has no smell."},{"t":"h","x":"Υποθερμία: πότε κινδυνεύει κάποιος","e":"Hypothermia: when someone is in danger"},{"t":"li","x":"Αρχή: τρέμει, κρύα χέρια, κόκκινη μύτη. Βάλε στεγνά, φαγητό, ζεστό γλυκό ρόφημα, κίνηση.","e":"Early stage: shivering, cold hands, red nose. Put on dry clothes, give food, a hot sweet drink, movement."},{"t":"li","x":"ΚΙΝΔΥΝΟΣ: σκοντάφτει, μπερδεύει τα λόγια, δεν μπορεί να κουμπωθεί, γκρινιάζει ή είναι αδιάφορος.","e":"DANGER: stumbling, slurred speech, cannot do up buttons, irritable or apathetic."},{"t":"warn","x":"Αν ΣΤΑΜΑΤΗΣΕΙ να τρέμει και είναι μπερδεμένος ή νυσταγμένος: ΣΟΒΑΡΗ ΥΠΟΘΕΡΜΙΑ. Κάλεσε 112/166. Τύλιξέ τον (και από κάτω), μάλλον οριζόντιος, απαλές κινήσεις, ζέστη στον κορμό (μασχάλες, στήθος) – ΟΧΙ τρίψιμο χεριών-ποδιών.","e":"If they STOP shivering and are confused or drowsy: SEVERE HYPOTHERMIA. Call 112/166. Wrap them up (underneath too), keep them lying flat, handle gently, warm the trunk (armpits, chest) – NO rubbing of arms and legs."}],"te":"Your body is the stove","se":"How to keep warm without heating"},{"cat":"now","id":"power","emoji":"💡","title":"Διακοπή ρεύματος","sub":"Φως, ψυγείο, ασφάλεια","blocks":[{"t":"h","x":"Τι κάνω","e":"What to do"},{"t":"step","x":"Φακοί – ΟΧΙ κεριά αν γίνεται (φωτιές).","e":"Torches – NOT candles if possible (fires)."},{"t":"step","x":"Βγάλε από την πρίζα ευαίσθητες συσκευές (όταν έρθει ξανά, κάνει υπέρταση).","e":"Unplug sensitive devices (when the power comes back, there is a surge)."},{"t":"step","x":"Άφησε ένα φως αναμμένο για να καταλάβεις πότε ήρθε το ρεύμα.","e":"Leave one light switched on so you know when the power is back."},{"t":"step","x":"Ψυγείο και καταψύκτης ΚΛΕΙΣΤΑ. Το ψυγείο κρατάει ~4 ώρες, ο γεμάτος καταψύκτης ~48 ώρες (μισογεμάτος ~24).","e":"Keep fridge and freezer CLOSED. The fridge keeps cold ~4 hours, a full freezer ~48 hours (half full ~24)."},{"t":"step","x":"Φόρτισε κινητά στο αυτοκίνητο ή με powerbank. Βάλε το κινητό σε εξοικονόμηση ενέργειας.","e":"Charge phones in the car or with a powerbank. Put the phone on power saving mode."},{"t":"step","x":"Ραδιόφωνο μπαταρίας για ειδήσεις.","e":"Battery radio for news."},{"t":"warn","x":"Γεννήτρια ΜΟΝΟ έξω, μακριά από πόρτες και παράθυρα (τουλάχιστον 6 m). Ποτέ σε γκαράζ ή μπαλκόνι κλειστό.","e":"Generator ONLY outside, away from doors and windows (at least 6 m). Never in a garage or a closed balcony."},{"t":"warn","x":"Αν κάποιος στο σπίτι χρειάζεται ιατρικό μηχάνημα με ρεύμα (οξυγόνο κ.λπ.): έχε σχέδιο από πριν και ειδοποίησε τον πάροχο ρεύματος.","e":"If someone at home needs a medical device that uses power (oxygen etc.): have a plan in advance and tell your power company."},{"t":"h","x":"Φαγητό που χάλασε;","e":"Has the food gone bad?"},{"t":"li","x":"Αν ψυγείο πάνω από 4 °C για 2+ ώρες: πέτα κρέας, ψάρι, γάλα, αυγά, μαγειρεμένα. «Όταν έχεις αμφιβολία, πέτα το».","e":"If the fridge was above 4 °C for 2+ hours: throw away meat, fish, milk, eggs, cooked food. “When in doubt, throw it out”."},{"t":"tip","x":"Γέμισε τα κενά του καταψύκτη με μπουκάλια νερό. Κρατάει πιο πολύ το κρύο και έχεις πόσιμο νερό.","e":"Fill the empty space in the freezer with bottles of water. It keeps the cold longer and you have drinking water."}],"te":"Power cut","se":"Light, fridge, safety"},{"cat":"now","id":"homewater","emoji":"🛁","title":"Νερό στο σπίτι: μπανιέρα και κρυφές αποθήκες","sub":"Γέμισε ΠΡΙΝ κοπεί το νερό","blocks":[{"t":"tip","x":"Μόλις ακούσεις για σεισμό, πόλεμο, καταιγίδα ή διακοπή νερού: ΓΕΜΙΣΕ ΤΗ ΜΠΑΝΙΕΡΑ ΑΜΕΣΩΣ. Το νερό στις σωλήνες μπορεί να κοπεί μέσα σε λίγες ώρες.","e":"As soon as you hear of an earthquake, war, storm or water cut: FILL THE BATHTUB IMMEDIATELY. The water in the pipes can be cut within a few hours."},{"t":"h","x":"Πόσο νερό βγάζει μια μπανιέρα","e":"How much water a bathtub holds"},{"t":"li","x":"Μικρή μπανιέρα (150 × 70 cm): περίπου 120–150 λίτρα.","e":"Small bathtub (150 × 70 cm): about 120–150 litres."},{"t":"li","x":"Κανονική μπανιέρα (170 × 70 cm): περίπου 150–200 λίτρα.","e":"Standard bathtub (170 × 70 cm): about 150–200 litres."},{"t":"li","x":"Μεγάλη ή γωνιακή μπανιέρα: 250–350 λίτρα.","e":"Large or corner bathtub: 250–350 litres."},{"t":"li","x":"Υπολογισμός για τη δική σου: μάκρος × φάρδος × ύψος νερού σε δεκάμετρα (10 cm = 1 dm) × 0,7 (γιατί τα τοιχώματα είναι λοξά). Παράδειγμα: 16 × 6 × 3,5 × 0,7 ≈ 235 λίτρα.","e":"To work out yours: length × width × water depth in decimetres (10 cm = 1 dm) × 0.7 (because the sides slope). Example: 16 × 6 × 3.5 × 0.7 ≈ 235 litres."},{"t":"h","x":"Πόσες μέρες σε κρατάει","e":"How many days it lasts"},{"t":"li","x":"Για ΠΟΣΙΜΟ (4 λίτρα/άτομο/μέρα): 200 λίτρα = 4 άτομα για 12 μέρες.","e":"For DRINKING only (4 litres/person/day): 200 litres = 4 people for 12 days."},{"t":"li","x":"Για ΟΛΑ μαζί (πόσιμο, μαγείρεμα, πλύσιμο, τουαλέτα ~10–15 λίτρα/άτομο/μέρα): 200 λίτρα = 4 άτομα για 3–5 μέρες. Γι' αυτό κάνε οικονομία από την πρώτη ώρα.","e":"For EVERYTHING (drinking, cooking, washing, toilet ~10–15 litres/person/day): 200 litres = 4 people for 3–5 days. So save water from the first hour."},{"t":"h","x":"Σωστά βήματα","e":"The right steps"},{"t":"step","x":"Πλύνε γρήγορα τη μπανιέρα (χωρίς πολλά χημικά) και ξέβγαλε.","e":"Quickly wash the bathtub (without many chemicals) and rinse."},{"t":"step","x":"Βάλε την τάπα και σφράγισέ τη από πάνω με μεμβράνη ή ταινία – οι τάπες χάνουν σιγά σιγά νερό. Δοκίμασέ το από ΤΩΡΑ μια φορά.","e":"Put in the plug and seal over it with cling film or tape – plugs slowly leak. Test this once NOW."},{"t":"step","x":"Γέμισε μέχρι κάτω από την υπερχείλιση.","e":"Fill to just below the overflow."},{"t":"step","x":"Σκέπασε με νάιλον ή σανίδα για σκόνη, ζώα και ΠΑΙΔΙΑ.","e":"Cover with plastic sheeting or a board against dust, animals and CHILDREN."},{"t":"step","x":"Πάρε νερό με καθαρή κανάτα – όχι με τα χέρια μέσα.","e":"Take water with a clean jug – not with your hands in it."},{"t":"warn","x":"Γεμάτη μπανιέρα = κίνδυνος πνιγμού για μικρό παιδί. Κλειστή πόρτα μπάνιου, σκέπασμα, επιτήρηση.","e":"A full bathtub = drowning risk for a small child. Keep the bathroom door closed, the tub covered, and supervise."},{"t":"warn","x":"Το νερό της μπανιέρας ΔΕΝ είναι καθαρό για πόσιμο. Βράσε 1 λεπτό ή απολύμανε (χλωρίνη: 2 σταγόνες/λίτρο, αναμονή 30 λεπτά) ή φίλτρο. Χωρίς επεξεργασία: μόνο για τουαλέτα και πλύσιμο.","e":"Bathtub water is NOT safe to drink. Boil for 1 minute or disinfect (bleach: 2 drops/litre, wait 30 minutes) or filter. Untreated: only for the toilet and washing."},{"t":"tip","x":"Υπάρχουν ειδικές σακούλες-δοχεία για μπανιέρα (100–400 L) με βρυσάκι: κρατούν το νερό καθαρό για πόσιμο. Φθηνές και χρήσιμες.","e":"There are special bathtub water bags (100–400 L) with a tap: they keep the water clean for drinking. Cheap and useful."},{"t":"h","x":"Γέμισε ΚΑΙ αυτά","e":"ALSO fill these"},{"t":"chk","x":"Κατσαρόλες, μπουκάλια, μπιτόνια, κουβάδες – ό,τι κλείνει","e":"Pots, bottles, jerrycans, buckets – anything with a lid"},{"t":"chk","x":"Νεροχύτες με τάπα (για πλύσιμο)","e":"Sinks with the plug in (for washing)"},{"t":"chk","x":"Πλυντήριο: βάλε μια πλύση ΤΩΡΑ, μετά δεν θα μπορείς","e":"Washing machine: run a wash NOW, later you will not be able to"},{"t":"h","x":"Κρυφές αποθήκες νερού στο σπίτι","e":"Hidden water stores at home"},{"t":"li","x":"Θερμοσίφωνας ρεύματος: 60–120 λίτρα. ΚΛΕΙΣΕ πρώτα το ρεύμα του. Κλείσε την παροχή, άνοιξε μια βρύση ζεστού για αέρα, και πάρε νερό από τη βάνα κάτω. Βράσε πριν το πιεις.","e":"Electric water heater: 60–120 litres. Switch OFF its power first. Close the supply, open a hot tap to let air in, and drain water from the valve at the bottom. Boil before drinking."},{"t":"li","x":"Ηλιακός θερμοσίφωνας στην ταράτσα: 120–200 λίτρα. Μεγάλη αποθήκη που ξεχνάμε.","e":"Solar water heater on the roof: 120–200 litres. A big store we forget about."},{"t":"li","x":"Σωλήνες: κλείσε τον γενικό, άνοιξε την πιο ψηλή βρύση για αέρα, μάζεψε από την πιο χαμηλή: 5–20 λίτρα.","e":"Pipes: close the main valve, open the highest tap to let air in, collect from the lowest: 5–20 litres."},{"t":"li","x":"Καζανάκι (ΟΧΙ η λεκάνη): 6–9 λίτρα καθαρό νερό – αν δεν έχει ταμπλέτες χρώματος/χημικά.","e":"Toilet cistern (NOT the bowl): 6–9 litres of clean water – if it has no colour tablets/chemicals."},{"t":"li","x":"Πάγος από καταψύκτη και υγρό από κονσέρβες λαχανικών/φρούτων.","e":"Ice from the freezer and liquid from canned vegetables/fruit."},{"t":"li","x":"Βρόχινο νερό από υδρορροές: για πλύσιμο. Για πόσιμο μόνο με φίλτρο + βράσιμο.","e":"Rainwater from gutters: for washing. For drinking only with a filter + boiling."},{"t":"warn","x":"Αν οι αρχές πουν ότι το νερό του δικτύου είναι μολυσμένο, ΜΗΝ γεμίσεις από τη βρύση – και κλείσε τον γενικό για να μη μπει βρώμικο νερό στον θερμοσίφωνα.","e":"If the authorities say the mains water is contaminated, DO NOT fill up from the tap – and close the main valve so dirty water does not get into the water heater."},{"t":"h","x":"Τουαλέτα με λίγο νερό","e":"Toilet with little water"},{"t":"li","x":"Ένας κουβάς 4–6 λίτρα ρίχνεται γρήγορα και απότομα στη λεκάνη = καζανάκι. Μόνο για τα «μεγάλα».","e":"A 4–6 litre bucket poured quickly and sharply into the bowl = a flush. Only for “number two”."},{"t":"li","x":"Για τα «μικρά»: σακούλα σκουπιδιών μέσα στη λεκάνη + άμμος γάτας, πριονίδι ή στάχτη. Δένεις και αλλάζεις.","e":"For “number one”: a rubbish bag inside the bowl + cat litter, sawdust or ash. Tie it up and change it."}],"te":"Water at home: bathtub and hidden stores","se":"Fill up BEFORE the water is cut"},{"cat":"now","id":"war","emoji":"🛡️","title":"Πόλεμος – αεροπορική επιδρομή","sub":"Προστασία αμάχων","blocks":[{"t":"h","x":"Σειρήνα / προειδοποίηση επιδρομής","e":"Siren / air raid warning"},{"t":"step","x":"Πήγαινε αμέσως σε καταφύγιο, υπόγειο ή υπόγειο σταθμό.","e":"Go at once to a shelter, basement or underground station."},{"t":"step","x":"Αν δεν προλαβαίνεις: εσωτερικό δωμάτιο ή διάδρομος, χαμηλός όροφος, μακριά από παράθυρα. Κανόνας των «2 τοίχων»: βάλε δύο τοίχους ανάμεσα σε σένα και τον δρόμο.","e":"If there is no time: an inner room or corridor, low floor, away from windows. The “2 walls” rule: put two walls between you and the street."},{"t":"step","x":"Μπάνιο ή διάδρομος χωρίς παράθυρα είναι συχνά το καλύτερο μέρος στο διαμέρισμα.","e":"A bathroom or corridor with no windows is often the best place in a flat."},{"t":"step","x":"Αν είσαι έξω: ξάπλωσε μπρούμυτα σε χαντάκι ή πίσω από πεζούλι, χέρια στο κεφάλι, στόμα ελαφρά ανοιχτό.","e":"If you are outside: lie face down in a ditch or behind a low wall, hands on your head, mouth slightly open."},{"t":"step","x":"Μείνε στο καταφύγιο μέχρι το σήμα λήξης.","e":"Stay in the shelter until the all-clear signal."},{"t":"warn","x":"ΜΗΝ βγαίνεις να δεις ή να φωτογραφίσεις. ΜΗΝ ανεβάζεις στα social βίντεο με θέσεις ή στρατιωτικά οχήματα – μπορεί να βοηθήσει τον εχθρό και να σε βάλει σε κίνδυνο.","e":"DO NOT go out to look or take photos. DO NOT post videos showing positions or military vehicles on social media – it can help the enemy and put you in danger."},{"t":"h","x":"Προετοιμασία σπιτιού","e":"Preparing the home"},{"t":"li","x":"Ταινία σε σχήμα Χ στα τζάμια ή αντιθρυμματική μεμβράνη, κουρτίνες κλειστές.","e":"Tape in an X shape on the glass or anti-shatter film, curtains closed."},{"t":"li","x":"Συσκότιση το βράδυ αν το ζητήσουν οι αρχές (κουβέρτες/μαύρο πλαστικό).","e":"Blackout at night if the authorities ask (blankets/black plastic)."},{"t"
