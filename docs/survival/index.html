:"li","x":"Απόθεμα 2 εβδομάδων: νερό, τρόφιμα, φάρμακα, μπαταρίες, μετρητά.","e":"Supplies for 2 weeks: water, food, medicines, batteries, cash."},{"t":"li","x":"Σακίδιο έτοιμο δίπλα στην πόρτα για κάθε μέλος.","e":"A backpack ready by the door for each member."},{"t":"li","x":"Αντίγραφα εγγράφων (χαρτί + USB), φωτογραφίες των μελών της οικογένειας.","e":"Copies of documents (paper + USB), photos of the family members."},{"t":"h","x":"Αν χωριστεί η οικογένεια","e":"If the family gets separated"},{"t":"li","x":"Συμφωνήστε από πριν 2 σημεία συνάντησης (ένα κοντά, ένα έξω από την πόλη) και έναν συγγενή μακριά που θα είναι «κέντρο επικοινωνίας».","e":"Agree in advance on 2 meeting points (one nearby, one outside the city) and a relative far away who will be the “contact centre”."},{"t":"li","x":"Στα παιδιά: καρτέλα στην τσέπη με όνομα, τηλέφωνα, ομάδα αίματος, αλλεργίες.","e":"For children: a card in the pocket with name, phone numbers, blood group, allergies."},{"t":"h","x":"Μετακίνηση – σημεία ελέγχου","e":"Moving – checkpoints"},{"t":"li","x":"Ήρεμα, χέρια ορατά, απαντάς σύντομα και αληθινά. Έγγραφα σε εύκολη τσέπη.","e":"Stay calm, hands visible, answer briefly and truthfully. Documents in an easy pocket."},{"t":"li","x":"Κινήσου τη μέρα, σε γνωστούς δρόμους, ακολούθησε τους επίσημους διαδρόμους απομάκρυνσης.","e":"Move by day, on known roads, follow the official evacuation routes."},{"t":"li","x":"Μην φοράς παραλλαγή ή ρούχα που μοιάζουν στρατιωτικά.","e":"Do not wear camouflage or clothes that look military."},{"t":"h","x":"Ύποπτα αντικείμενα / πυρομαχικά","e":"Suspicious objects / ammunition"},{"t":"warn","x":"ΜΗΝ αγγίζεις, μη σηκώνεις, μην κλοτσάς άγνωστο μεταλλικό αντικείμενο, οβίδα, νάρκη, drone που έπεσε.","e":"DO NOT touch, pick up or kick an unknown metal object, shell, mine or fallen drone."},{"t":"step","x":"Σταμάτα. Γύρνα πίσω από τα ίδια σου τα βήματα.","e":"Stop. Go back the way you came, in your own footsteps."},{"t":"step","x":"Σημάδεψε το σημείο από απόσταση (πέτρες, ύφασμα).","e":"Mark the spot from a distance (stones, cloth)."},{"t":"step","x":"Ειδοποίησε 100 / 112.","e":"Report to 100 / 112."},{"t":"step","x":"Δίδαξε τα παιδιά: «Δεν αγγίζω, φεύγω, λέω σε μεγάλο».","e":"Teach children: “I don't touch, I go away, I tell a grown-up”."},{"t":"h","x":"Drones","e":"Drones"},{"t":"li","x":"Αν ακούς drone από κοντά: μπες σε κτίριο ή κάτω από δέντρα/κάλυψη, μην κοιτάς και μην τρέχεις σε ανοιχτό χώρο.","e":"If you hear a drone close by: go into a building or under trees/cover, do not look up and do not run into open ground."},{"t":"tip","x":"Μάθε από τώρα πού είναι τα πλησιέστερα καταφύγια και υπόγειοι χώροι στη γειτονιά σου, στη δουλειά και στο σχολείο των παιδιών.","e":"Find out now where the nearest shelters and basements are in your neighbourhood, at work and at your children's school."}],"te":"War – air raid","se":"Protecting civilians"},{"cat":"now","id":"nuclear","emoji":"☢️","title":"Πυρηνική έκρηξη – ραδιενέργεια","sub":"Μπες μέσα – Μείνε μέσα – Ενημερώσου","blocks":[{"t":"h","x":"Αν δεις λάμψη / έκρηξη","e":"If you see a flash / explosion"},{"t":"step","x":"ΜΗΝ κοιτάξεις τη λάμψη.","e":"DO NOT look at the flash."},{"t":"step","x":"Πέσε μπρούμυτα πίσω από ό,τι προστατεύει, κάλυψε κεφάλι και χέρια κάτω από το σώμα.","e":"Drop face down behind anything that protects you, cover your head and put your hands under your body."},{"t":"step","x":"Μείνε κάτω μέχρι να περάσει το ωστικό κύμα (μπορεί να έρθει δευτερόλεπτα έως και λεπτά μετά).","e":"Stay down until the blast wave passes (it may come seconds or even minutes later)."},{"t":"h","x":"Μετά: η ραδιενεργή σκόνη (fallout)","e":"After: the radioactive dust (fallout)"},{"t":"li","x":"Η επικίνδυνη σκόνη πέφτει μέσα σε 10–30 λεπτά. Έχεις λίγο χρόνο να μπεις σε καλό κτίριο.","e":"The dangerous dust falls within 10–30 minutes. You have a little time to get into a good building."},{"t":"step","x":"ΜΠΕΣ ΜΕΣΑ στο πιο γερό κτίριο που βρίσκεις (μπετό, τούβλο).","e":"GET INSIDE the strongest building you can find (concrete, brick)."},{"t":"step","x":"Πήγαινε στο υπόγειο ή στη ΜΕΣΗ του κτιρίου, μακριά από εξωτερικούς τοίχους και ταράτσα. Σε πολυκατοικία: μεσαίοι όροφοι στο κέντρο είναι καλοί.","e":"Go to the basement or the MIDDLE of the building, away from outer walls and the roof. In a block of flats: the middle floors in the centre are good."},{"t":"step","x":"Κλείσε πόρτες, παράθυρα, κλιματισμό, εξαερισμό.","e":"Close doors, windows, air conditioning, ventilation."},{"t":"step","x":"ΜΕΙΝΕ ΜΕΣΑ τουλάχιστον 24 ώρες, εκτός αν οι αρχές πουν κάτι άλλο. Η ραδιενέργεια πέφτει γρήγορα: μετά από 7 ώρες ~10 φορές λιγότερη, μετά από 2 μέρες ~100 φορές λιγότερη.","e":"STAY INSIDE at least 24 hours, unless the authorities say otherwise. Radiation drops fast: after 7 hours ~10 times less, after 2 days ~100 times less."},{"t":"step","x":"ΕΝΗΜΕΡΩΣΟΥ από ραδιόφωνο μπαταρίας και 112.","e":"STAY TUNED to a battery radio and 112."},{"t":"warn","x":"Μην μπεις σε αυτοκίνητο για να φύγεις αν δεν σου το πουν. Το αυτοκίνητο δεν προστατεύει από τη ραδιενέργεια.","e":"Do not get into a car to leave unless you are told to. A car does not protect from radiation."},{"t":"h","x":"Απορρύπανση (αν ήσουν έξω)","e":"Decontamination (if you were outside)"},{"t":"step","x":"Πριν μπεις στον καθαρό χώρο, βγάλε τα εξωτερικά ρούχα – φεύγει έτσι το μεγαλύτερο μέρος της σκόνης.","e":"Before you enter the clean space, take off your outer clothes – this removes most of the dust."},{"t":"step","x":"Βάλ' τα σε πλαστική σακούλα, δεμένη, μακριά από ανθρώπους.","e":"Put them in a plastic bag, tied, away from people."},{"t":"step","x":"Ντους με σαπούνι και σαμπουάν. ΟΧΙ conditioner (κολλάει τη σκόνη στα μαλλιά). Μην τρίβεις δυνατά.","e":"Shower with soap and shampoo. NO conditioner (it sticks the dust to the hair). Do not scrub hard."},{"t":"step","x":"Αν δεν υπάρχει ντους: σκούπισε με βρεγμένο πανί πρόσωπο, χέρια, μαλλιά. Φύσα τη μύτη, καθάρισε αυτιά, βλεφαρίδες.","e":"If there is no shower: wipe face, hands, hair with a wet cloth. Blow your nose, clean ears and eyelashes."},{"t":"step","x":"Καθαρά ρούχα από κλειστή ντουλάπα.","e":"Clean clothes from a closed wardrobe."},{"t":"h","x":"Φαγητό και νερό","e":"Food and water"},{"t":"li","x":"Τρόφιμα σε κλειστές συσκευασίες και νερό σε κλειστά μπουκάλια είναι ασφαλή. Σκούπισε το εξωτερικό πριν τα ανοίξεις.","e":"Food in sealed packs and water in sealed bottles are safe. Wipe the outside before you open them."},{"t":"li","x":"Μην τρως φρούτα/λαχανικά από τον κήπο ή γάλα από ζώα της περιοχής χωρίς οδηγία των αρχών.","e":"Do not eat fruit/vegetables from the garden or milk from local animals without instructions from the authorities."},{"t":"h","x":"Ιωδιούχο κάλιο (KI)","e":"Potassium iodide (KI)"},{"t":"warn","x":"ΜΟΝΟ όταν το πουν οι αρχές. Προστατεύει ΜΟΝΟ τον θυρεοειδή από το ραδιενεργό ιώδιο. Δεν προστατεύει από τίποτα άλλο. Μην παίρνεις «προληπτικά». Ποτέ ιώδιο αντισηπτικό (Betadine) από το στόμα.","e":"ONLY when the authorities say so. It protects ONLY the thyroid from radioactive iodine. It does not protect from anything else. Do not take it “just in case”. Never take iodine antiseptic (Betadine) by mouth."},{"t":"h","x":"Ατύχημα σε πυρηνικό εργοστάσιο (π.χ. σε γειτονική χώρα)","e":"Accident at a nuclear power plant (e.g. in a nearby country)"},{"t":"li","x":"Συνήθως υπάρχει χρόνος. Ακολούθησε τις οδηγίες: παραμονή μέσα, κλειστά παράθυρα, ενημέρωση. Μην πανικοβάλλεσαι.","e":"Usually there is time. Follow the instructions: stay inside, windows closed, stay informed. Do not panic."},{"t":"tip","x":"Ραδιόφωνο μπαταρίας ή μανιβέλας είναι το πιο σημαντικό εργαλείο εδώ. Έχε και νερό/φαγητό για 3–14 μέρες μέσα.","e":"A battery or wind-up radio is the most important tool here. Also keep water/food for 3–14 days inside."}],"te":"Nuclear explosion – radiation","se":"Get inside – Stay inside – Stay tuned"},{"cat":"now","id":"chem","emoji":"☣️","title":"Χημικό – τοξικό νέφος","sub":"Μέσα, σφραγισμένα, ψηλά","blocks":[{"t":"h","x":"Τι κάνω","e":"What to do"},{"t":"step","x":"Μπες αμέσως μέσα σε κτίριο. Κλείσε πόρτες, παράθυρα, τζάκι.","e":"Get inside a building at once. Close doors, windows, fireplace."},{"t":"step","x":"Σβήσε κλιματισμό, εξαερισμό, απορροφητήρα.","e":"Turn off air conditioning, ventilation, cooker hood."},{"t":"step","x":"Πήγαινε σε δωμάτιο ΨΗΛΑ (τα περισσότερα χημικά αέρια είναι βαριά και μαζεύονται χαμηλά – το ΑΝΤΙΘΕΤΟ από τη ραδιενέργεια).","e":"Go to a room HIGH UP (most chemical gases are heavy and collect low down – the OPPOSITE of radiation)."},{"t":"step","x":"Σφράγισε χαραμάδες με βρεγμένες πετσέτες ή νάιλον και ταινία.","e":"Seal gaps with wet towels or plastic sheet and tape."},{"t":"step","x":"Άκου ραδιόφωνο/112. Βγες μόνο όταν πουν οι αρχές.","e":"Listen to the radio/112. Go out only when the authorities say so."},{"t":"h","x":"Αν είσαι έξω","e":"If you are outside"},{"t":"li","x":"Απομακρύνσου κάθετα στη φορά του ανέμου, προς ψηλότερο σημείο. Κάλυψε μύτη-στόμα με βρεγμένο πανί.","e":"Move away across the wind direction, towards higher ground. Cover nose and mouth with a wet cloth."},{"t":"li","x":"Μακριά από το σύννεφο, τη μυρωδιά, υγρά στο έδαφος.","e":"Keep away from the cloud, the smell, liquids on the ground."},{"t":"h","x":"Αν εκτέθηκες","e":"If you were exposed"},{"t":"step","x":"Βγάλε ρούχα (κόψε τα αντί να τα περάσεις από το κεφάλι).","e":"Take off your clothes (cut them off instead of pulling them over your head)."},{"t":"step","x":"Ξέπλυνε με άφθονο νερό και σαπούνι.","e":"Rinse with plenty of water and soap."},{"t":"step","x":"Μάτια: ξέπλυμα με καθαρό νερό 15 λεπτά.","e":"Eyes: rinse with clean water for 15 minutes."},{"t":"step","x":"Κάλεσε 166 και Κέντρο Δηλητηριάσεων 210 7793777.","e":"Call 166 and the Poison Centre 210 7793777."},{"t":"warn","x":"Μάσκα FFP2/FFP3 φιλτράρει σκόνη, ΟΧΙ αέρια. Μη νομίζεις ότι προστατεύεσαι από χημικό αέριο με απλή μάσκα.","e":"An FFP2/FFP3 mask filters dust, NOT gases. Do not think a simple mask protects you from chemical gas."},{"t":"h","x":"Διαρροή γκαζιού στο σπίτι","e":"Gas leak at home"},{"t":"li","x":"Μην ανάβεις/σβήνεις διακόπτες, μη χτυπάς κουδούνι. Κλείσε τη βάνα, άνοιξε παράθυρα, βγες έξω, κάλεσε 199 από έξω.","e":"Do not turn switches on/off, do not ring the doorbell. Close the valve, open windows, get out, call 199 from outside."}],"te":"Chemical – toxic cloud","se":"Inside, sealed, up high"},{"cat":"now","id":"sea","emoji":"⚓","title":"Ναυάγιο – άνθρωπος στη θάλασσα","sub":"Σωσίβιο, ζέστη, εντοπισμός","blocks":[{"t":"h","x":"Πριν εγκαταλείψεις το σκάφος","e":"Before you abandon ship"},{"t":"step","x":"Φόρεσε σωσίβιο (lifejacket) και ζεστά ρούχα – όσο πιο πολλά, ακόμα και βρεγμένα κρατάνε ζέστη.","e":"Put on a lifejacket and warm clothes – as many as possible, they keep heat even when wet."},{"t":"step","x":"Πάρε grab bag, EPIRB, SART, VHF φορητό, νερό, φάρμακα.","e":"Take the grab bag, EPIRB, SART, portable VHF, water, medicines."},{"t":"step","x":"Στείλε MAYDAY (VHF Ch16 / DSC) με θέση.","e":"Send MAYDAY (VHF Ch16 / DSC) with your position."},{"t":"step","x":"Μπες στη σχεδία κατευθείαν αν μπορείς, χωρίς να βραχείς. Αν πρέπει να πηδήξεις: από χαμηλά, σταυρωτά χέρια στο σωσίβιο, κλείσε μύτη, πόδια ενωμένα, κοίτα μπροστά.","e":"Get into the liferaft directly if you can, without getting wet. If you must jump: from low down, arms crossed over the lifejacket, hold your nose, feet together, look ahead."},{"t":"h","x":"Στο νερό","e":"In the water"},{"t":"li","x":"Πρώτο λεπτό: σοκ κρύου νερού – μην πανικοβληθείς, έλεγξε την αναπνοή σου (κανόνας 1-10-1: 1 λεπτό αναπνοή, 10 λεπτά χρήσιμες κινήσεις, ~1 ώρα πριν την υποθερμία σε κρύο νερό).","e":"First minute: cold water shock – do not panic, control your breathing (1-10-1 rule: 1 minute to breathe, 10 minutes of useful movement, ~1 hour before hypothermia in cold water)."},{"t":"li","x":"Μην κολυμπάς άσκοπα. Στάση H.E.L.P.: γόνατα στο στήθος, χέρια σφιχτά γύρω από το σώμα.","e":"Do not swim without need. H.E.L.P. position: knees to chest, arms tight around the body."},{"t":"li","x":"Με άλλους: σφιχτός κύκλος (huddle), παιδιά/τραυματίες στη μέση.","e":"With others: a tight circle (huddle), children/injured in the middle."},{"t":"li","x":"Ανέβα πάνω σε ό,τι επιπλέει – λιγότερο σώμα στο νερό = λιγότερη απώλεια ζέστης.","e":"Climb onto anything that floats – less body in the water = less heat loss."},{"t":"h","x":"Στη σχεδία","e":"In the liferaft"},{"t":"step","x":"Κόψε το painter, απομακρύνσου από το σκάφος, ρίξε την άγκυρα θάλασσας (drogue).","e":"Cut the painter, get clear of the ship, stream the sea anchor (drogue)."},{"t":"step","x":"Μάζεψε άλλους επιζώντες, κλείσε την είσοδο, στέγνωσε τον πάτο.","e":"Pick up other survivors, close the entrance, dry the floor."},{"t":"step","x":"Πάρε φάρμακο ναυτίας ΑΜΕΣΩΣ (ο εμετός = χάνεις νερό).","e":"Take seasickness medicine AT ONCE (vomiting = losing water)."},{"t":"step","x":"Ενεργοποίησε EPIRB/SART. Βάλε βάρδιες σκοπιάς.","e":"Activate EPIRB/SART. Set lookout watches."},{"t":"step","x":"ΚΑΘΟΛΟΥ νερό το πρώτο 24ωρο (εκτός τραυματίες), μετά ~0,5 λίτρο/άτομο/μέρα. Μάζευε βρόχινο νερό.","e":"NO water in the first 24 hours (except the injured), then ~0.5 litre/person/day. Collect rainwater."},{"t":"warn","x":"ΠΟΤΕ θαλασσινό νερό, ΠΟΤΕ ούρα. Χωρίς νερό, μην τρως.","e":"NEVER seawater, NEVER urine. Without water, do not eat."},{"t":"li","x":"Φωτοβολίδες ΜΟΝΟ όταν βλέπεις/ακούς σκάφος ή αεροσκάφος. Καθρέφτης σήματος τη μέρα.","e":"Flares ONLY when you see/hear a ship or aircraft. Signal mirror by day."},{"t":"h","x":"Άνθρωπος στη θάλασσα (MOB) από σκάφος","e":"Man overboard (MOB) from a boat"},{"t":"step","x":"Φώναξε «Άνθρωπος στη θάλασσα – δεξιά/αριστερά!».","e":"Shout “Man overboard – starboard/port!”."},{"t":"step","x":"Ρίξε σωσίβιο κουλούρα/φωτοσημαντήρα αμέσως.","e":"Throw a lifebuoy/light buoy at once."},{"t":"step","x":"Ένας ΜΟΝΟ κοιτάζει και δείχνει με το χέρι συνέχεια.","e":"ONE person only keeps watching and pointing with the arm all the time."},{"t":"step","x":"Πάτα MOB στο GPS. Κάλεσε VHF/112/108 Λιμενικό.","e":"Press MOB on the GPS. Call VHF/112/108 Coast Guard."},{"t":"tip","x":"Τηλέφωνο Λιμενικού: 108. Από θάλασσα, το 112 επίσης δουλεύει όπου υπάρχει σήμα.","e":"Coast Guard phone: 108. At sea, 112 also works where there is signal."}],"te":"Shipwreck – man overboard","se":"Lifejacket, warmth, being found"},{"cat":"now","id":"lost","emoji":"🧭","title":"Χάθηκα στη φύση","sub":"ΣΤΑΣΟΥ – Σκέψου – Παρατήρησε – Σχεδίασε","blocks":[{"t":"h","x":"Κανόνας ΣΤΟΠ","e":"The STOP rule"},{"t":"step","x":"ΣΤΑΣΟΥ. Κάτσε. Πιες νερό. Ο πανικός σκοτώνει περισσότερο από το κρύο.","e":"STOP. Sit down. Drink water. Panic kills more than the cold."},{"t":"step","x":"ΣΚΕΨΟΥ: από πού ήρθα; Πόση ώρα έχω φως; Τι έχω μαζί μου;","e":"THINK: where did I come from? How many hours of light do I have? What do I have with me?"},{"t":"step","x":"ΠΑΡΑΤΗΡΗΣΕ: δρόμοι, ήχοι αυτοκινήτων, ρέματα, κορυφές, ηλεκτρικοί στύλοι.","e":"OBSERVE: roads, sounds of cars, streams, peaks, power poles."},{"t":"step","x":"ΣΧΕΔΙΑΣΕ: Συνήθως το καλύτερο είναι να ΜΕΙΝΕΙΣ ΕΚΕΙ και να σε βρουν.","e":"PLAN: Usually the best thing is to STAY WHERE YOU ARE and let them find you."},{"t":"h","x":"Τι κάνω","e":"What to do"},{"t":"li","x":"Κάλεσε 112 (δουλεύει και με οποιοδήποτε δίκτυο). Στείλε τις συντεταγμένες σου από την Πυξίδα της εφαρμογής.","e":"Call 112 (it works on any network). Send your coordinates from the app's Compass."},{"t":"li","x":"Κράτα μπαταρία: κλείσε δεδομένα, φωτεινότητα χαμηλά, άνοιγε το κινητό ανά ώρα.","e":"Save battery: turn off mobile data, screen brightness low, turn on the phone once an hour."},{"t":"li","x":"Κάνε τον εαυτό σου ορατό: φωτεινά ρούχα σε ανοιχτό σημείο, σφυρίχτρα 3 φορές, καπνός τη μέρα, φως τη νύχτα.","e":"Make yourself visible: bright clothes in an open spot, whistle 3 times, smoke by day, light at night."},{"t":"li","x":"Πριν νυχτώσει: φτιάξε καταφύγιο από τον αέρα, με μόνωση από το έδαφος (κλαδιά, φύλλα). Δες «Καταφύγιο».","e":"Before dark: build a shelter from the wind, with insulation from the ground (branches, leaves). See “Shelter”."},{"t":"li","x":"Αν αποφασίσεις να κινηθείς: ακολούθησε ρέμα ή μονοπάτι προς τα ΚΑΤΩ – αλλά πρόσεχε γκρεμούς και καταρράκτες. Άφηνε σημάδια πίσω σου.","e":"If you decide to move: follow a stream or path DOWNHILL – but watch out for cliffs and waterfalls. Leave marks behind you."},{"t":"warn","x":"Μην περπατάς τη νύχτα. Μην μπαίνεις σε φαράγγι αν δεν ξέρεις πού βγαίνει.","e":"Do not walk at night. Do not enter a gorge if you do not know where it comes out."},{"t":"tip","x":"Πάντα λέμε σε κάποιον πού πάμε και πότε γυρίζουμε.","e":"Always tell someone where you are going and when you will be back."}],"te":"Lost in the wild","se":"STOP – Think – Observe – Plan"},{"cat":"now","id":"blackout_comm","emoji":"📻","title":"Χωρίς internet και τηλέφωνο","sub":"Πώς ενημερώνομαι και επικοινωνώ","blocks":[{"t":"h","x":"Τι κάνω","e":"What to do"},{"t":"li","x":"Ραδιόφωνο FM/AM μπαταρίας ή μανιβέλας: η ΕΡΤ μεταδίδει ανακοινώσεις έκτακτης ανάγκης.","e":"Battery or wind-up FM/AM radio: ERT (Greek public radio) broadcasts emergency announcements."},{"t":"li","x":"SMS περνάει συχνά όταν οι κλήσεις δεν περνάνε. Γράφε σύντομα.","e":"SMS often gets through when calls do not. Keep it short."},{"t":"li","x":"Το 112 δουλεύει και χωρίς κάρτα SIM ή με άλλο δίκτυο.","e":"112 works even without a SIM card or on another network."},{"t":"li","x":"Συμφωνημένο σημείο και ώρα συνάντησης (π.χ. «κάθε μέρα στις 12:00 στην πλατεία»).","e":"An agreed meeting place and time (e.g. “every day at 12:00 in the square”)."},{"t":"li","x":"Σημείωμα στην πόρτα: ποιος, πότε έφυγε, πού πήγε.","e":"A note on the door: who, when they left, where they went."},{"t":"li","x":"Ραδιοερασιτέχνες (ham radio) βοηθούν σε μεγάλες καταστροφές.","e":"Radio amateurs (ham radio) help in big disasters."},{"t":"tip","x":"Γράψε σε χαρτί τα τηλέφωνα που χρειάζεσαι. Κανείς δεν θυμάται τηλέφωνα πια.","e":"Write the phone numbers you need on paper. Nobody remembers phone numbers any more."}],"te":"No internet and no phone","se":"How to get news and stay in touch"},{"cat":"aid","id":"aid_first","emoji":"🆘","title":"Πρώτα απ' όλα","sub":"Ασφάλεια – Έλεγχος – Κλήση","blocks":[{"t":"step","x":"ΑΣΦΑΛΕΙΑ: Είναι ασφαλές να πλησιάσω; (φωτιά, ρεύμα, κίνηση αυτοκινήτων, κατάρρευση). Αν όχι, μη γίνεις κι εσύ θύμα.","e":"SAFETY: Is it safe to approach? (fire, electricity, traffic, collapse). If not, do not become a victim too."},{"t":"step","x":"ΑΠΑΝΤΑΕΙ; Χτύπα ελαφρά στους ώμους και ρώτα δυνατά «Είσαι καλά;».","e":"RESPONDING? Tap the shoulders gently and ask loudly “Are you OK?”."},{"t":"step","x":"ΑΝΑΠΝΕΕΙ; Γείρε το κεφάλι πίσω, σήκωσε το πηγούνι, κοίτα-άκου-νιώσε για 10 δευτερόλεπτα.","e":"BREATHING? Tilt the head back, lift the chin, look-listen-feel for 10 seconds."},{"t":"step","x":"ΚΑΛΕΣΕ 112 ή 166. Βάλε ανοιχτή ακρόαση και κάνε ό,τι σου λένε.","e":"CALL 112 or 166. Put the phone on speaker and do what they tell you."},{"t":"step","x":"Δεν αναπνέει φυσιολογικά → ΚΑΡΠΑ αμέσως (κουμπί «ΚΑΡΠΑ»).","e":"Not breathing normally → CPR right away (“CPR” button)."},{"t":"step","x":"Αναπνέει αλλά δεν απαντάει → Θέση ανάνηψης (στο πλάι).","e":"Breathing but not responding → Recovery position (on the side)."},{"t":"step","x":"Μεγάλη αιμορραγία → Πίεση αμέσως.","e":"Heavy bleeding → Press on it right away."},{"t":"h","x":"Τι λες στο 112 / 166","e":"What to say to 112 / 166"},{"t":"li","x":"ΠΟΥ είσαι (διεύθυνση ή συντεταγμένες από την Πυξίδα).","e":"WHERE you are (address or coordinates from the “Compass”)."},{"t":"li","x":"ΤΙ έγινε. ΠΟΣΟΙ τραυματίες. Αν ΑΝΑΠΝΕΟΥΝ.","e":"WHAT happened. HOW MANY injured. Whether they are BREATHING."},{"t":"li","x":"Το τηλέφωνό σου. ΜΗΝ κλείνεις πρώτος.","e":"Your phone number. DO NOT hang up first."}],"te":"First things first","se":"Safety – Check – Call"},{"cat":"aid","id":"panic","emoji":"🫁","title":"Κρίση πανικού – ψυχολογικές πρώτες βοήθειες","sub":"Για τον άλλον και για τον εαυτό σου","blocks":[{"t":"tip","x":"Στις καταστροφές οι περισσότεροι άνθρωποι δεν τραυματίζονται στο σώμα – τραυματίζονται στην ψυχή. Ένας ήρεμος άνθρωπος δίπλα τους είναι η πρώτη βοήθεια.","e":"In disasters most people are not injured in the body – they are hurt in the mind. A calm person beside them is the first aid."},{"t":"h","x":"Πώς καταλαβαίνω κρίση πανικού","e":"How to recognise a panic attack"},{"t":"li","x":"Ξαφνικός, πολύ δυνατός φόβος. Καρδιά που χτυπάει δυνατά, λαχάνιασμα, «δεν μου φτάνει ο αέρας», σφίξιμο στο στήθος, ζάλη, μούδιασμα σε χέρια ή χείλη, τρέμουλο, ιδρώτας, «θα πεθάνω» ή «θα τρελαθώ».","e":"Sudden, very intense fear. Pounding heart, breathlessness, “I can’t get enough air”, chest tightness, dizziness, numbness in hands or lips, trembling, sweating, “I’m going to die” or “I’m going crazy”."},{"t":"li","x":"Κορυφώνεται μέσα σε περίπου 10 λεπτά και μετά υποχωρεί. Είναι πολύ τρομακτική αλλά ΔΕΝ είναι επικίνδυνη από μόνη της.","e":"It peaks within about 10 minutes and then eases. It is very frightening but is NOT dangerous in itself."},{"t":"warn","x":"Μπορεί να είναι ΚΑΡΔΙΑ και όχι πανικός: πρώτη φορά, πάνω από 40 ετών, πόνος που πάει σε χέρι, σαγόνι ή πλάτη, κρύος ιδρώτας, δεν περνάει σε 15–20 λεπτά, γνωστή καρδιοπάθεια ή άσθμα. Αν έχεις ΑΜΦΙΒΟΛΙΑ: 166 / 112. Καλύτερα ένα άσκοπο τηλεφώνημα.","e":"It may be the HEART and not panic: first time, over 40 years old, pain spreading to the arm, jaw or back, cold sweat, not passing within 15–20 minutes, known heart disease or asthma. If in DOUBT: 166 / 112. Better an unnecessary call."},{"t":"h","x":"Βοηθάω κάποιον σε κρίση πανικού","e":"Helping someone having a panic attack"},{"t":"step","x":"Μείνε ήρεμος. Ο πανικός «κολλάει» – και η ηρεμία επίσης. Μίλα αργά και χαμηλά.","e":"Stay calm. Panic is “contagious” – and so is calm. Speak slowly and softly."},{"t":"step","x":"Πήγαινέ τον σε πιο ήσυχο σημείο, μακριά από κόσμο και θόρυβο. Κάτσε στο ύψος του.","e":"Take them to a quieter place, away from crowds and noise. Get down to their level."},{"t":"step","x":"Πες απλά: «Είμαι εδώ. Είσαι ασφαλής. Είναι κρίση πανικού, θα περάσει σε λίγα λεπτά. Ανάπνευσε μαζί μου.»","e":"Say simply: “I am here. You are safe. This is a panic attack, it will pass in a few minutes. Breathe with me.”"},{"t":"step","x":"Αναπνοή μαζί του: ΜΕΣΑ από τη μύτη μετρώντας 4 … ΕΞΩ από το στόμα αργά μετρώντας 6. Η μεγάλη ΕΚΠΝΟΗ ηρεμεί την καρδιά. Μέτρα δυνατά εσύ.","e":"Breathe with them: IN through the nose counting 4 … OUT through the mouth slowly counting 6. The long EXHALE calms the heart. You count out loud."},{"t":"step","x":"Γείωση 5-4-3-2-1: «Πες μου 5 πράγματα που βλέπεις, 4 που αγγίζεις, 3 που ακούς, 2 που μυρίζεις, 1 που γεύεσαι.» Φέρνει το μυαλό στο τώρα.","e":"Grounding 5-4-3-2-1: “Tell me 5 things you see, 4 you can touch, 3 you hear, 2 you smell, 1 you taste.” It brings the mind back to the present."},{"t":"step","x":"Δώσ' του κάτι να κρατάει: δροσερό μπουκάλι νερό, πετσέτα βρεγμένη στο πρόσωπο, πόδια σταθερά στο πάτωμα.","e":"Give them something to hold: a cool bottle of water, a wet towel on the face, feet firmly on the floor."},{"t":"step","x":"Μείνε μαζί του μέχρι να περάσει. Μετά νερό και ξεκούραση.","e":"Stay with them until it passes. Then water and rest."},{"t":"li","x":"ΜΗΝ λες «ηρέμησε», «δεν είναι τίποτα», «σταμάτα». Δεν βοηθάει και ντροπιάζει.","e":"DO NOT say “calm down”, “it’s nothing”, “stop it”. It does not help and causes shame."},{"t":"li","x":"ΜΗΝ βάζεις χάρτινη σακούλα στο στόμα. Είναι παλιά συμβουλή και μπορεί να βλάψει – ειδικά αν τελικά είναι καρδιά ή άσθμα.","e":"DO NOT put a paper bag over their mouth. It is outdated advice and can cause harm – especially if it turns out to be the heart or asthma."},{"t":"h","x":"Αν τον πάθω εγώ","e":"If it happens to me"},{"t":"step","x":"Πες στον εαυτό σου: «Είναι πανικός. Τον έχω ξαναζήσει ή τον ξέρω. Θα περάσει. Δεν θα πάθω τίποτα.»","e":"Tell yourself: “This is panic. I have had it before or I know about it. It will pass. Nothing will happen to me.”"},{"t":"step","x":"Κάτσε ή ακούμπησε σε τοίχο. Πόδια στο πάτωμα.","e":"Sit down or lean against a wall. Feet on the floor."},{"t":"step","x":"Αναπνοή 4 μέσα – 6 έξω, για 2–3 λεπτά. Ή «τετράγωνο»: 4 μέσα, κράτα 4, 4 έξω, κράτα 4.","e":"Breathe 4 in – 6 out, for 2–3 minutes. Or “box breathing”: 4 in, hold 4, 4 out, hold 4."},{"t":"step","x":"Γείωση 5-4-3-2-1 μόνος σου, ή μέτρα αντικείμενα γύρω σου.","e":"Grounding 5-4-3-2-1 on your own, or count objects around you."},{"t":"step","x":"Μην τρέξεις να φύγεις αν είσαι ασφαλής – το κύμα περνάει πιο γρήγορα όταν δεν το πολεμάς.","e":"Do not run away if you are safe – the wave passes faster when you do not fight it."},{"t":"h","x":"Ψυχολογικές πρώτες βοήθειες μετά από καταστροφή","e":"Psychological first aid after a disaster"},{"t":"li","x":"ΚΟΙΤΑ: είναι ασφαλής ο χώρος; Ποιος είναι τραυματισμένος, ποιος είναι σε σοκ, ποιος μένει μόνος;","e":"LOOK: is the area safe? Who is injured, who is in shock, who is alone?"},{"t":"li","x":"ΑΚΟΥ: πλησίασε, συστήσου, ρώτα τι χρειάζεται. Άκου χωρίς να πιέζεις να μιλήσει. Η σιωπή δίπλα του είναι κι αυτή βοήθεια.","e":"LISTEN: approach, introduce yourself, ask what they need. Listen without pressing them to talk. Silent presence beside them is also help."},{"t":"li","x":"ΣΥΝΔΕΣΕ: νερό, κουβέρτα, φαγητό, τηλέφωνο να βρει τους δικούς του, σωστές πληροφορίες. Μην υπόσχεσαι ό,τι δεν ξέρεις («θα βρεθεί σίγουρα»).","e":"LINK: water, blanket, food, a phone to find their family, accurate information. Do not promise what you do not know (“they will surely be found”)."},{"t":"li","x":"Δώσε του μια μικρή δουλειά αν μπορεί: να κρατάει τον φακό, να μοιράσει νερό. Νιώθει ξανά ότι ελέγχει κάτι.","e":"Give them a small task if they can: holding the flashlight, handing out water. They feel in control of something again."},{"t":"li","x":"Κλάμα, θυμός, μούδιασμα, αϋπνία, εφιάλτες τις πρώτες μέρες είναι ΦΥΣΙΟΛΟΓΙΚΑ μετά από κάτι τρομακτικό.","e":"Crying, anger, numbness, sleeplessness, nightmares in the first days are NORMAL after something frightening."},{"t":"h","x":"Παιδιά","e":"Children"},{"t":"li","x":"Κράτα τα ΜΑΖΙ με τους γονείς τους. Αγκαλιά, χέρι, κοντά.","e":"Keep them TOGETHER with their parents. Hugs, holding hands, close by."},{"t":"li","x":"Εξήγησε απλά και αληθινά: «Έγινε σεισμός. Τώρα είμαστε ασφαλείς. Οι μεγάλοι φροντίζουμε.»","e":"Explain simply and truthfully: “There was an earthquake. Now we are safe. The grown-ups are taking care of things.”"},{"t":"li","x":"Άφησέ τα να παίξουν, να ζωγραφίσουν, να ρωτάνε τα ίδια ξανά και ξανά – έτσι το «χωνεύουν».","e":"Let them play, draw, ask the same questions again and again – that is how they “digest” it."},{"t":"li","x":"Κλείσε την τηλεόραση με τις εικόνες της καταστροφής. Κράτα όσο γίνεται ρουτίνα: φαγητό, ύπνος, παραμύθι.","e":"Turn off the TV showing images of the disaster. Keep routine as much as possible: meals, sleep, bedtime story."},{"t":"h","x":"Πότε χρειάζεται ειδικός","e":"When a specialist is needed"},{"t":"li","x":"Αν μετά από 2–4 εβδομάδες κάποιος δεν μπορεί να λειτουργήσει, δεν κοιμάται, ξαναζεί συνέχεια το γεγονός, ή μιλάει για θάνατο ή ότι «δεν αξίζει να ζει».","e":"If after 2–4 weeks someone cannot function, cannot sleep, keeps reliving the event, or talks about death or that life is “not worth living”."},{"t":"li","x":"10306: Εθνική Γραμμή Ψυχοκοινωνικής Υποστήριξης – δωρεάν, ανώνυμα, όλο το 24ωρο (και για παιδιά και οικογένειες).","e":"10306: National Psychosocial Support Line – free, anonymous, 24 hours a day (also for children and families)."},{"t":"li","x":"1018: Γραμμή Παρέμβασης για την Αυτοκτονία (ΚΛΙΜΑΚΑ), 24ωρη.","e":"1018: Suicide Prevention Helpline (KLIMAKA), 24 hours."},{"t":"li","x":"1056: Το Χαμόγελο του Παιδιού – γραμμή για παιδιά, 24ωρη.","e":"1056: The Smile of the Child – helpline for children, 24 hours."},{"t":"warn","x":"Αν κάποιος κινδυνεύει να βλάψει τον εαυτό του ΤΩΡΑ: μην τον αφήνεις μόνο και κάλεσε 112.","e":"If someone is at risk of harming themselves NOW: do not leave them alone and call 112."}],"te":"Panic attack – psychological first aid","se":"For someone else and for yourself"},{"cat":"aid","id":"cpr","emoji":"❤️","title":"ΚΑΡΠΑ ενήλικα","sub":"Δυνατά και γρήγορα στο κέντρο του στήθους","blocks":[{"t":"step","x":"Ξάπλωσέ τον ανάσκελα σε σκληρή επιφάνεια.","e":"Lay the person on their back on a hard surface."},{"t":"step","x":"Κάλεσε 112/166. Αν υπάρχει απινιδωτής (AED), φώναξε κάποιον να τον φέρει.","e":"Call 112/166. If there is a defibrillator (AED), shout for someone to bring it."},{"t":"step","x":"Βάλε τη βάση της παλάμης στο ΚΕΝΤΡΟ του στήθους, το άλλο χέρι από πάνω, χέρια ίσια.","e":"Put the heel of your hand on the CENTRE of the chest, the other hand on top, arms straight."},{"t":"step","x":"Πίεζε ΔΥΝΑΤΑ 5–6 cm βάθος, ΓΡΗΓΟΡΑ 100–120 φορές το λεπτό. Πάτα το κουμπί ♪ για ρυθμό.","e":"Push HARD 5–6 cm deep, FAST 100–120 times a minute. Press the ♪ button for the rhythm."},{"t":"step","x":"Αν ξέρεις: 30 πιέσεις – 2 εμφυσήσεις. Αν δεν ξέρεις ή δεν θες: ΜΟΝΟ πιέσεις χωρίς σταματημό.","e":"If you know how: 30 compressions – 2 rescue breaths. If you don't know or don't want to: compressions ONLY, without stopping."},{"t":"step","x":"Μόλις έρθει απινιδωτής: άνοιξέ τον και κάνε ό,τι λέει φωναχτά.","e":"As soon as a defibrillator arrives: switch it on and do what it says out loud."},{"t":"step","x":"Μη σταματάς μέχρι να έρθει το ΕΚΑΒ, να αρχίσει να αναπνέει ή να εξαντληθείς. Αλλάζετε κάθε 2 λεπτά αν είστε δύο.","e":"Do not stop until the EKAB ambulance (166) arrives, the person starts breathing, or you are exhausted. Swap every 2 minutes if there are two of you."},{"t":"warn","x":"Καλύτερα να κάνεις ΚΑΡΠΑ λάθος, παρά να μην κάνεις τίποτα. Δεν μπορείς να τον κάνεις χειρότερα.","e":"Doing CPR wrong is better than doing nothing. You cannot make them worse."},{"t":"h","x":"Παιδί (1 έτους – εφηβεία)","e":"Child (1 year – puberty)"},{"t":"li","x":"Ένα ή δύο χέρια, βάθος ~5 cm (1/3 του στήθους). Αν είσαι μόνος, 1 λεπτό ΚΑΡΠΑ πριν φύγεις να καλέσεις.","e":"One or two hands, depth ~5 cm (1/3 of the chest). If you are alone, do 1 minute of CPR before you leave to call."},{"t":"h","x":"Βρέφος (κάτω από 1 έτους)","e":"Baby (under 1 year)"},{"t":"li","x":"Δύο δάχτυλα στο κέντρο του στήθους, κάτω από τις θηλές, βάθος ~4 cm, 100–120 το λεπτό.","e":"Two fingers in the centre of the chest, just below the nipples, depth ~4 cm, 100–120 a minute."},{"t":"tip","x":"Κάνε σεμινάριο Βασικής Υποστήριξης Ζωής (BLS) – λίγες ώρες, μπορεί να σώσει έναν δικό σου άνθρωπο.","e":"Take a Basic Life Support (BLS) course – a few hours, it could save someone you love."}],"te":"Adult CPR","se":"Hard and fast in the centre of the chest"},{"cat":"aid","id":"choke","emoji":"😮","title":"Πνιγμονή","sub":"Κάτι κόλλησε στον λαιμό","blocks":[{"t":"h","x":"Ενήλικας / παιδί που βήχει","e":"Adult / child who is coughing"},{"t":"li","x":"Ενθάρρυνέ τον να βήχει δυνατά. Μην χτυπάς ακόμα.","e":"Encourage them to cough hard. Do not hit yet."},{"t":"h","x":"Δεν μπορεί να βήξει, μιλήσει, αναπνεύσει","e":"Cannot cough, speak or breathe"},{"t":"step","x":"5 χτυπήματα στην πλάτη: σκύψε τον μπροστά, χτύπα δυνατά ανάμεσα στις ωμοπλάτες με τη βάση της παλάμης.","e":"5 back blows: lean them forward, hit hard between the shoulder blades with the heel of your hand."},{"t":"step","x":"5 κοιλιακές ωθήσεις (Heimlich): από πίσω, γροθιά πάνω από τον αφαλό, το άλλο χέρι πάνω, τράβα απότομα μέσα και πάνω.","e":"5 abdominal thrusts (Heimlich): from behind, fist above the belly button, other hand on top, pull sharply in and up."},{"t":"step","x":"Συνέχισε 5 + 5 μέχρι να βγει.","e":"Keep going 5 + 5 until it comes out."},{"t":"step","x":"Αν χάσει τις αισθήσεις: ξάπλωσέ τον, κάλεσε 112, ξεκίνα ΚΑΡΠΑ.","e":"If they become unconscious: lay them down, call 112, start CPR."},{"t":"h","x":"Βρέφος","e":"Baby"},{"t":"li","x":"Μπρούμυτα στο αντιβράχιό σου, κεφάλι χαμηλά: 5 χτυπήματα στην πλάτη. Μετά ανάσκελα: 5 πιέσεις στο στήθος με 2 δάχτυλα. ΟΧΙ κοιλιακές ωθήσεις σε βρέφος.","e":"Face down along your forearm, head low: 5 back blows. Then on the back: 5 chest thrusts with 2 fingers. NO abdominal thrusts on a baby."},{"t":"h","x":"Είσαι μόνος σου;","e":"Are you alone?"},{"t":"li","x":"Κάνε κοιλιακές ωθήσεις στον εαυτό σου με τη γροθιά ή πιέσου απότομα στην πλάτη μιας καρέκλας.","e":"Give yourself abdominal thrusts with your fist, or push hard against the back of a chair."}],"te":"Choking","se":"Something stuck in the throat"},{"cat":"aid","id":"bleed","emoji":"🩸","title":"Μεγάλη αιμορραγία","sub":"ΠΙΕΣΗ – ΠΙΕΣΗ – ΠΙΕΣΗ","blocks":[{"t":"step","x":"Φόρεσε γάντια αν έχεις (ή σακούλα).","e":"Put on gloves if you have them (or a plastic bag)."},{"t":"step","x":"Πίεσε ΔΥΝΑΤΑ πάνω στην πληγή με καθαρό πανί/γάζα. Με όλο σου το βάρος.","e":"Press HARD on the wound with a clean cloth/gauze. Use all your weight."},{"t":"step","x":"Μην σηκώνεις το πανί να δεις. Αν ποτίσει, βάλε κι άλλο από πάνω.","e":"Do not lift the cloth to look. If it soaks through, put more on top."},{"t":"step","x":"Δέσε σφιχτά με επίδεσμο πάνω στο πανί.","e":"Tie a bandage tightly over the cloth."},{"t":"step","x":"Ξάπλωσέ τον, σκέπασέ τον (σοκ). Κάλεσε 166.","e":"Lay them down, cover them (shock). Call 166."},{"t":"h","x":"Αίμα που πετάγεται ή δεν σταματάει σε χέρι/πόδι → Ίσχαιμη περίδεση (tourniquet)","e":"Blood spurting or not stopping on an arm/leg → Tourniquet"},{"t":"step","x":"Βάλε το tourniquet 5–7 cm ΠΑΝΩ από την πληγή (όχι πάνω σε άρθρωση).","e":"Put the tourniquet 5–7 cm ABOVE the wound (not on a joint)."},{"t":"step","x":"Σφίξε γυρνώντας τη ράβδο μέχρι να σταματήσει το αίμα. Πονάει – είναι φυσιολογικό.","e":"Tighten by turning the rod until the bleeding stops. It hurts – that is normal."},{"t":"step","x":"Γράψε την ΩΡΑ (στο μέτωπο ή στο tourniquet).","e":"Write down the TIME (on the forehead or on the tourniquet)."},{"t":"step","x":"ΜΗΝ το χαλαρώσεις. Μόνο το νοσοκομείο το βγάζει.","e":"DO NOT loosen it. Only the hospital removes it."},{"t":"tip","x":"Αυτοσχέδιο: φαρδύ ύφασμα (4 cm+) και ένα ξύλο/κουτάλι για στρίψιμο. Όχι σύρμα ή λεπτό κορδόνι.","e":"Improvised: wide cloth (4 cm+) and a stick/spoon to twist. No wire or thin cord."},{"t":"h","x":"Πληγή στον κορμό / λαιμό / μασχάλη / βουβώνα","e":"Wound on the body / neck / armpit / groin"},{"t":"li","x":"Γέμισε την πληγή με γάζα (packing) και πίεσε δυνατά τουλάχιστον 3 λεπτά. Μην βγάζεις αντικείμενα που έχουν καρφωθεί – στερέωσέ τα.","e":"Pack the wound with gauze (packing) and press hard for at least 3 minutes. Do not pull out objects stuck in the body – hold them in place."},{"t":"h","x":"Αιμορραγία μύτης","e":"Nosebleed"},{"t":"li","x":"Κάτσε, σκύψε ΜΠΡΟΣΤΑ (όχι πίσω), πίεσε το μαλακό μέρος της μύτης 10–15 λεπτά.","e":"Sit, lean FORWARD (not back), pinch the soft part of the nose for 10–15 minutes."}],"te":"Heavy bleeding","se":"PRESS – PRESS – PRESS"},{"cat":"aid","id":"shock","emoji":"😰","title":"Σοκ – λιποθυμία","sub":"Ξάπλωσε, ζέστανε, κάλεσε","blocks":[{"t":"li","x":"Σημάδια: χλωμό κρύο ιδρωμένο δέρμα, γρήγορος αδύναμος σφυγμός, ζάλη, δίψα, σύγχυση.","e":"Signs: pale, cold, sweaty skin, fast weak pulse, dizziness, thirst, confusion."},{"t":"step","x":"Σταμάτα αιμορραγίες.","e":"Stop any bleeding."},{"t":"step","x":"Ξάπλωσέ τον ανάσκελα. Αν δεν τραυματίστηκαν πόδια/λεκάνη, σήκωσε λίγο τα πόδια.","e":"Lay them on their back. If the legs/pelvis are not injured, raise the legs a little."},{"t":"step","x":"Σκέπασέ τον (και από κάτω). Μίλα του ήρεμα.","e":"Cover them (underneath too). Talk to them calmly."},{"t":"step","x":"Τίποτα να φάει ή να πιει.","e":"Nothing to eat or drink."},{"t":"step","x":"Κάλεσε 166.","e":"Call 166."},{"t":"h","x":"Λιποθυμία","e":"Fainting"},{"t":"li","x":"Ξάπλωμα, πόδια ψηλά. Αν δεν συνέλθει σε 1 λεπτό → 166 και θέση ανάνηψης.","e":"Lie down, legs up. If not recovered in 1 minute → 166 and recovery position."}],"te":"Shock – fainting","se":"Lay down, keep warm, call"},{"cat":"aid","id":"recovery","emoji":"🛌","title":"Θέση ανάνηψης","sub":"Αναπνέει αλλά δεν απαντά","blocks":[{"t":"step","x":"Γονάτισε δίπλα του. Το κοντινό σου χέρι του σε ορθή γωνία προς τα πάνω.","e":"Kneel beside them. Place their arm nearest you at a right angle, palm up."},{"t":"step","x":"Το άλλο του χέρι, ανάποδη παλάμη στο μάγουλό του.","e":"Their other arm: back of the hand against their cheek."},{"t":"step","x":"Λύγισε το μακρινό γόνατο, και τράβα τον από το γόνατο να γυρίσει στο πλάι προς εσένα.","e":"Bend the far knee and pull on the knee to roll them onto their side towards you."},{"t":"step","x":"Γείρε το κεφάλι πίσω να είναι ανοιχτός ο αεραγωγός, στόμα προς τα κάτω (να βγαίνουν εμετοί).","e":"Tilt the head back to keep the airway open, mouth facing down (so vomit can drain)."},{"t":"step","x":"Έλεγχε την αναπνοή συνέχεια. Αν σταματήσει → ΚΑΡΠΑ.","e":"Keep checking their breathing. If it stops → CPR."},{"t":"warn","x":"Αν υποψιάζεσαι κάκωση σπονδυλικής (πτώση, τροχαίο), μη τον κουνάς εκτός αν πρέπει για να αναπνέει ή να σωθεί.","e":"If you suspect a spinal injury (fall, car crash), do not move them unless needed for them to breathe or to save them."}],"te":"Recovery position","se":"Breathing but not responding"},{"cat":"aid","id":"burn","emoji":"🔥","title":"Εγκαύματα","sub":"Δροσερό νερό 20 λεπτά","blocks":[{"t":"step","x":"Απομάκρυνε από τη φωτιά/πηγή. Ρούχα που καίγονται: σβήσε τα.","e":"Move away from the fire/source. Clothes on fire: put them out."},{"t":"step","x":"Δροσερό τρεχούμενο νερό (όχι παγωμένο, όχι πάγος) για 20 λεπτά.","e":"Cool running water (not ice-cold, no ice) for 20 minutes."},{"t":"step","x":"Βγάλε δαχτυλίδια, ρολόι, ρούχα (αν δεν έχουν κολλήσει).","e":"Remove rings, watch, clothing (if not stuck to the skin)."},{"t":"step","x":"Κάλυψε χαλαρά με διάφανη μεμβράνη κουζίνας ή καθαρή σακούλα.","e":"Cover loosely with clear cling film or a clean plastic bag."},{"t":"step","x":"Κάλεσε 166 αν: μεγάλο έγκαυμα, πρόσωπο, χέρια, γεννητικά, παιδί/ηλικιωμένος, ηλεκτρικό ή χημικό.","e":"Call 166 if: large burn, face, hands, genitals, child/elderly person, electrical or chemical."},{"t":"warn","x":"ΟΧΙ βούτυρο, οδοντόκρεμα, λάδι, γιαούρτι. ΟΧΙ σπάσιμο φουσκάλων.","e":"NO butter, toothpaste, oil, yoghurt. DO NOT pop blisters."},{"t":"h","x":"Χημικό έγκαυμα","e":"Chemical burn"},{"t":"li","x":"Ξέπλυμα με άφθονο νερό τουλάχιστον 20 λεπτά. Βγάλε μολυσμένα ρούχα.","e":"Rinse with plenty of water for at least 20 minutes. Remove contaminated clothing."},{"t":"h","x":"Ηλεκτροπληξία","e":"Electric shock"},{"t":"li","x":"Κλείσε το ρεύμα ΠΡΩΤΑ. Μην τον αγγίξεις όσο είναι σε επαφή. Μετά έλεγχος αναπνοής → 166.","e":"Turn off the power FIRST. Do not touch them while they are in contact. Then check breathing → 166."}],"te":"Burns","se":"Cool water for 20 minutes"},{"cat":"aid","id":"fracture","emoji":"🦴","title":"Κάταγμα – διάστρεμμα","sub":"Ακινητοποίησε","blocks":[{"t":"step","x":"Μην προσπαθήσεις να ισιώσεις το κόκκαλο.","e":"Do not try to straighten the bone."},{"t":"step","x":"Ακινητοποίησε όπως βρίσκεται: νάρθηκας από χαρτόνι, περιοδικό, κλαδί, δεμένο πάνω και κάτω από το κάταγμα.","e":"Keep it still as it is: splint from cardboard, a magazine, a branch, tied above and below the fracture."},{"t":"step","x":"Χέρι: αναρτήρας από τρίγωνο ύφασμα ή μπλούζα.","e":"Arm: sling from a triangular cloth or a T-shirt."},{"t":"step","x":"Πάγος τυλιγμένος σε πανί 20 λεπτά.","e":"Ice wrapped in a cloth for 20 minutes."},{"t":"step","x":"Ανοιχτό κάταγμα (κόκκαλο έξω): κάλυψε με καθαρή γάζα, πίεση γύρω (όχι πάνω), 166.","e":"Open fracture (bone showing): cover with clean gauze, press around it (not on it), 166."},{"t":"h","x":"Διάστρεμμα (στραμπούληγμα)","e":"Sprain (twisted joint)"},{"t":"li","x":"Ξεκούραση, πάγος 20΄, ελαστικός επίδεσμος, ανύψωση.","e":"Rest, ice 20 min, elastic bandage, raise it."},{"t":"h","x":"Κάκωση κεφαλής","e":"Head injury"},{"t":"li","x":"Εμετοί, νύστα, σύγχυση, άνισες κόρες, υγρό από μύτη/αυτιά → 166 αμέσως. Μην αφήνεις μόνο του για 24 ώρες.","e":"Vomiting, drowsiness, confusion, unequal pupils, fluid from nose/ears → 166 at once. Do not leave them alone for 24 hours."}],"te":"Fracture – sprain","se":"Keep it still"},{"cat":"aid","id":"wound","emoji":"🩹","title":"Κοψίματα – πληγές","sub":"Καθάρισε, κάλυψε, πρόσεχε μόλυνση","blocks":[{"t":"step","x":"Πλύνε τα χέρια, φόρεσε γάντια.","e":"Wash your hands, put on gloves."},{"t":"step","x":"Ξέπλυνε την πληγή με άφθονο καθαρό νερό (πόσιμο) για αρκετά λεπτά. Βγάλε χώμα.","e":"Rinse the wound with plenty of clean (drinking) water for several minutes. Remove dirt."},{"t":"step","x":"Αντισηπτικό γύρω από την πληγή, όχι οινόπνευμα μέσα.","e":"Antiseptic around the wound, no alcohol inside it."},{"t":"step","x":"Κάλυψε με αποστειρωμένη γάζα ή επίθεμα. Άλλαζε καθημερινά.","e":"Cover with sterile gauze or a dressing. Change it every day."},{"t":"li","x":"Σημάδια μόλυνσης: κοκκίνισμα που μεγαλώνει, ζέστη, πύον, πυρετός, κόκκινες γραμμές → γιατρός.","e":"Signs of infection: spreading redness, warmth, pus, fever, red streaks → doctor."},{"t":"tip","x":"Ελέγχεις το εμβόλιο τετάνου; Ενισχυτική δόση κάθε 10 χρόνια.","e":"Is your tetanus vaccine up to date? Booster every 10 years."}],"te":"Cuts – wounds","se":"Clean, cover, watch for infection"},{"cat":"aid","id":"allergy","emoji":"💉","title":"Σοβαρή αλλεργία (αναφυλαξία)","sub":"Αδρεναλίνη αμέσως","blocks":[{"t":"li","x":"Σημάδια: πρήξιμο σε πρόσωπο/γλώσσα, δυσκολία αναπνοής, σφύριγμα, κνίδωση σε όλο το σώμα, ζάλη.","e":"Signs: swelling of face/tongue, trouble breathing, wheezing, hives all over the body, dizziness."},{"t":"step","x":"Αν έχει ένεση αδρεναλίνης (EpiPen κ.ά.): στο έξω μέρος του μηρού, και από πάνω από το ρούχο.","e":"If they have an adrenaline auto-injector (EpiPen etc.): into the outer thigh, even through clothing."},{"t":"step","x":"Κάλεσε 166 – ακόμα κι αν βελτιωθεί.","e":"Call 166 – even if they get better."},{"t":"step","x":"Δυσκολία αναπνοής: να κάθεται. Ζάλη: ξάπλωμα, πόδια ψηλά.","e":"Trouble breathing: let them sit up. Dizzy: lie down, legs up."},{"t":"step","x":"Αν δεν βελτιωθεί σε 5–15 λεπτά και έχει δεύτερη ένεση, κάν' την.","e":"If no better in 5–15 minutes and there is a second injector, use it."}],"te":"Severe allergy (anaphylaxis)","se":"Adrenaline at once"},{"cat":"aid","id":"heart","emoji":"🫀","title":"Έμφραγμα – Εγκεφαλικό","sub":"Κάθε λεπτό μετράει","blocks":[{"t":"h","x":"Έμφραγμα","e":"Heart attack"},{"t":"li","x":"Πόνος/σφίξιμο στο στήθος που πάει σε χέρι, σαγόνι, πλάτη, με ιδρώτα, ναυτία, δύσπνοια.","e":"Chest pain/tightness spreading to the arm, jaw, back, with sweating, nausea, shortness of breath."},{"t":"step","x":"166 αμέσως.","e":"166 at once."},{"t":"step","x":"Κάθισέ τον να ξεκουραστεί.","e":"Sit them down to rest."},{"t":"step","x":"Αν δεν είναι αλλεργικός και δεν το απαγορεύει γιατρός: 1 ασπιρίνη 300 mg να τη μασήσει.","e":"If not allergic and not forbidden by a doctor: 1 aspirin 300 mg to chew."},{"t":"h","x":"Εγκεφαλικό – τεστ Π.Χ.Λ.","e":"Stroke – FAST test"},{"t":"li","x":"ΠΡΟΣΩΠΟ: Χαμογέλα – στραβώνει η μία πλευρά;","e":"FACE: Smile – does one side droop?"},{"t":"li","x":"ΧΕΡΙΑ: Σήκωσε τα δύο χέρια – πέφτει το ένα;","e":"ARMS: Raise both arms – does one drift down?"},{"t":"li","x":"ΛΟΓΙΑ: Πες μια πρόταση – μπερδεύει τα λόγια;","e":"SPEECH: Say a sentence – are the words mixed up?"},{"t":"li","x":"Ένα από αυτά = 166 ΤΩΡΑ. Σημείωσε την ώρα που ξεκίνησε.","e":"Any one of these = 166 NOW. Note the time it started."}],"te":"Heart attack – Stroke","se":"Every minute counts"},{"cat":"aid","id":"seizure","emoji":"⚡","title":"Σπασμοί – Επιληψία","sub":"Προστάτευσε, μην κρατάς","blocks":[{"t":"step","x":"Απομάκρυνε σκληρά αντικείμενα. Κάτι μαλακό κάτω από το κεφάλι.","e":"Move hard objects away. Something soft under the head."},{"t":"step","x":"ΜΗΝ τον κρατάς. ΜΗΝ βάζεις τίποτα στο στόμα.","e":"DO NOT hold them down. DO NOT put anything in the mouth."},{"t":"step","x":"Μέτρα τον χρόνο. Πάνω από 5 λεπτά → 166.","e":"Time it. Over 5 minutes → 166."},{"t":"step","x":"Όταν σταματήσει: θέση ανάνηψης, μείνε μαζί του.","e":"When it stops: recovery position, stay with them."}],"te":"Seizures – Epilepsy","se":"Protect, do not hold down"},{"cat":"aid","id":"diabetes","emoji":"🍬","title":"Υπογλυκαιμία","sub":"Ζάχαρη γρήγορα","blocks":[{"t":"li","x":"Διαβητικός που ιδρώνει, τρέμει, μπερδεύεται: δώσε 15–20 g ζάχαρη (χυμό, 4 κύβους ζάχαρη, καραμέλες).","e":"Diabetic who is sweating, shaking, confused: give 15–20 g sugar (juice, 4 sugar cubes, sweets)."},{"t":"li","x":"Αν δεν βελτιωθεί σε 15 λεπτά, δώσε ξανά. Αν χάσει τις αισθήσεις: τίποτα από το στόμα, θέση ανάνηψης, 166.","e":"If no better in 15 minutes, give again. If they become unconscious: nothing by mouth, recovery position, 166."}],"te":"Low blood sugar (hypoglycaemia)","se":"Sugar fast"},{"cat":"aid","id":"poison","emoji":"🧪","title":"Δηλητηρίαση","sub":"Κέντρο Δηλητηριάσεων 210 7793777","blocks":[{"t":"step","x":"Κάλεσε Κέντρο Δηλητηριάσεων 210 7793777 (24 ώρες) ή 166.","e":"Call the Poison Centre 210 7793777 (24 hours) or 166."},{"t":"step","x":"Κράτα τη συσκευασία του προϊόντος.","e":"Keep the product packaging."},{"t":"step","x":"ΜΗΝ προκαλείς εμετό. ΜΗΝ δίνεις γάλα ή λάδι αν δεν σου πουν.","e":"DO NOT make them vomit. DO NOT give milk or oil unless told to."},{"t":"step","x":"Στο δέρμα/μάτια: ξέπλυμα με νερό 15–20 λεπτά.","e":"On skin/eyes: rinse with water for 15–20 minutes."},{"t":"h","x":"Μονοξείδιο του άνθρακα (CO)","e":"Carbon monoxide (CO)"},{"t":"li","x":"Πονοκέφαλος, ζάλη, ναυτία σε πολλούς μαζί στο ίδιο σπίτι, νύστα → ΚΑΘΑΡΟΣ ΑΕΡΑΣ αμέσως, βγάλτε όλους έξω, 166.","e":"Headache, dizziness, nausea in several people in the same house, drowsiness → FRESH AIR at once, get everyone out, 166."}],"te":"Poisoning","se":"Poison Centre 210 7793777"},{"cat":"aid","id":"bite","emoji":"🐍","title":"Δαγκώματα – τσιμπήματα","sub":"Φίδι, σκορπιός, μέλισσα, τσιμπούρι","blocks":[{"t":"h","x":"Οχιά","e":"Viper"},{"t":"step","x":"Ηρεμία. Ακινητοποίησε το μέλος, χαμηλά στο ύψος της καρδιάς.","e":"Stay calm. Keep the limb still, low at heart level."},{"t":"step","x":"Βγάλε δαχτυλίδια, ρολόγια (θα πρηστεί).","e":"Remove rings, watches (it will swell)."},{"t":"step","x":"Πήγαινε σε νοσοκομείο/166. Σημείωσε την ώρα.","e":"Go to hospital/166. Note the time."},{"t":"warn","x":"ΟΧΙ κόψιμο, ΟΧΙ ρούφηγμα, ΟΧΙ tourniquet, ΟΧΙ πάγος.","e":"NO cutting, NO sucking, NO tourniquet, NO ice."},{"t":"h","x":"Μέλισσα – σφήκα","e":"Bee – wasp"},{"t":"li","x":"Ξύσε το κεντρί με νύχι ή κάρτα. Κρύο. Δες αλλεργία αν πρηστεί πρόσωπο/λαιμός.","e":"Scrape the sting out with a fingernail or a card. Cold compress. Watch for allergy if face/throat swells."},{"t":"h","x":"Τσιμπούρι","e":"Tick"},{"t":"li","x":"Λαβίδα πολύ κοντά στο δέρμα, τράβα ίσια χωρίς στρίψιμο. Σημείωσε ημερομηνία. Πυρετός ή κόκκινος κύκλος τις επόμενες εβδομάδες → γιατρός.","e":"Tweezers very close to the skin, pull straight out without twisting. Note the date. Fever or red ring in the following weeks → doctor."},{"t":"h","x":"Αχινός – δράκαινα","e":"Sea urchin – weever fish"},{"t":"li","x":"Δράκαινα/σαλάχι: βούτα σε ζεστό νερό (όσο αντέχεις, ~45 °C) 30–90 λεπτά – ο πόνος υποχωρεί.","e":"Weever fish/stingray: soak in hot water (as hot as you can bear, ~45 °C) for 30–90 minutes – the pain eases."}],"te":"Bites – stings","se":"Snake, scorpion, bee, tick"},{"cat":"aid","id":"eye","emoji":"👁️","title":"Μάτι","sub":"Ξέπλυμα, όχι τρίψιμο","blocks":[{"t":"li","x":"Σκόνη/χημικό: ξέπλυμα με καθαρό νερό τουλάχιστον 15 λεπτά, από τη μύτη προς τα έξω.","e":"Dust/chemical: rinse with clean water for at least 15 minutes, from the nose side outwards."},{"t":"li","x":"Αντικείμενο καρφωμένο: μην το βγάζεις, κάλυψε ΚΑΙ τα δύο μάτια (για να μην κινούνται), 166.","e":"Object stuck in the eye: do not remove it, cover BOTH eyes (so they don't move), 166."}],"te":"Eye","se":"Rinse, do not rub"},{"cat":"aid","id":"dehyd","emoji":"💧","title":"Αφυδάτωση – διάρροια","sub":"Υγρά με αλάτι και ζάχαρη","blocks":[{"t":"li","x":"Σημάδια: δίψα, σκούρα ούρα, ξηρό στόμα, ζάλη. Σε παιδιά: λίγα βρεγμένα πανάκια, βυθισμένα μάτια.","e":"Signs: thirst, dark urine, dry mouth, dizziness. In children: few wet nappies, sunken eyes."},{"t":"li","x":"Διάλυμα επανυδάτωσης (αν δεν έχεις φακελάκια φαρμακείου): 1 λίτρο καθαρό νερό + 6 κουταλάκια ζάχαρη + 1/2 κουταλάκι αλάτι. Γουλιά-γουλιά.","e":"Rehydration drink (if you have no pharmacy sachets): 1 litre clean water + 6 teaspoons sugar + 1/2 teaspoon salt. Sip by sip."},{"t":"warn","x":"Βρέφη, ηλικιωμένοι, αίμα στις κενώσεις, υψηλός πυρετός → γιατρός.","e":"Babies, elderly people, blood in the stool, high fever → doctor."}],"te":"Dehydration – diarrhoea","se":"Fluids with salt and sugar"},{"cat":"list","id":"bag72","emoji":"🎒","title":"Σακίδιο 72 ωρών (ανά άτομο)","sub":"Το παίρνεις και φεύγεις σε 2 λεπτά","blocks":[{"t":"tip","x":"Βάρος: όχι πάνω από ~20% του βάρους σου (παιδιά λιγότερο). Δοκίμασε να περπατήσεις 1 ώρα με αυτό.","e":"Weight: no more than ~20% of your body weight (less for children). Try walking for 1 hour with it."},{"t":"h","x":"Νερό και φαγητό","e":"Water and food"},{"t":"chk","x":"Νερό 3 λίτρα (μπουκάλια ή παγούρια)","e":"Water 3 litres (bottles or flasks)"},{"t":"chk","x":"Φίλτρο νερού ή ταμπλέτες καθαρισμού νερού","e":"Water filter or water purification tablets"},{"t":"chk","x":"Μπάρες δημητριακών / ενέργειας (6+)","e":"Cereal / energy bars (6+)"},{"t":"chk","x":"Ξηροί καρποί, αποξηραμένα φρούτα","e":"Nuts, dried fruit"},{"t":"chk","x":"Κονσέρβες με εύκολο άνοιγμα (τόνος, φασόλια) ή έτοιμα γεύματα (MRE)","e":"Easy-open cans (tuna, beans) or ready meals (MRE)"},{"t":"chk","x":"Σοκολάτα, παξιμάδια, κρακεράκια","e":"Chocolate, rusks, crackers"},{"t":"chk","x":"Κουτάλι-πιρούνι, ανοιχτήρι κονσερβών","e":"Spoon-fork, can opener"},{"t":"h","x":"Ρούχα και ύπνος","e":"Clothes and sleep"},{"t":"chk","x":"Αλλαξιά: εσώρουχα, μάλλινες κάλτσες (2 ζευγάρια)","e":"Change of clothes: underwear, wool socks ments","se":"Copies in a waterproof pouch and USB/cloud"},{"cat":"list","id":"nuclearkit","emoji":"☢️","title":"Καταφύγιο: πυρηνικό / πόλεμος","sub":"Για παραμονή μέσα 2 εβδομάδες","blocks":[{"t":"chk","x":"Δωμάτιο επιλεγμένο: υπόγειο ή κέντρο κτιρίου, χωρίς παράθυρα","e":"Chosen room: basement or centre of the building, no windows"},{"t":"chk","x":"Νερό 4 L/άτομο/μέρα × 14 μέρες","e":"Water 4 L/person/day × 14 days"},{"t":"chk","x":"Τρόφιμα 14 ημερών χωρίς μαγείρεμα","e":"Food for 14 days with no cooking"},{"t":"chk","x":"Ραδιόφωνο μπαταρίας/μανιβέλας + μπαταρίες","e":"Battery/crank radio + batteries"},{"t":"chk","x":"Φακοί, φανάρια LED","e":"Torches, LED lanterns"},{"t":"chk","x":"Κουβάς-τουαλέτα, σακούλες, χλωρίνη, πριονίδι/άμμος","e":"Bucket toilet, bags, bleach, sawdust/sand"},{"t":"chk","x":"Νάιλον χοντρό και ταινία για παράθυρα/χαραμάδες","e":"Thick plastic sheeting and tape for windows/gaps"},{"t":"chk","x":"Κουβέρτες, sleeping bags, στρώματα","e":"Blankets, sleeping bags, mattresses"},{"t":"chk","x":"Φαρμακείο και φάρμακα","e":"First-aid kit and medicines"},{"t":"chk","x":"Μάσκες FFP3, γάντια, αδιάβροχα ρούχα (για έξοδο έκτακτης ανάγκης)","e":"FFP3 masks, gloves, waterproof clothes (for emergency trips outside)"},{"t":"chk","x":"Σακούλες για μολυσμένα ρούχα","e":"Bags for contaminated clothes"},{"t":"chk","x":"Υγρά μαντηλάκια, σαπούνι, σαμπουάν χωρίς conditioner","e":"Wet wipes, soap, shampoo without conditioner"},{"t":"chk","x":"Βιβλία, παιχνίδια – μεγάλη αναμονή","e":"Books, games – long wait"},{"t":"chk","x":"Ιωδιούχο κάλιο ΜΟΝΟ αν το διανείμουν οι αρχές – λήψη μόνο με οδηγία","e":"Potassium iodide ONLY if the authorities hand it out – take only when instructed"}],"te":"Shelter: nuclear / war","se":"For staying inside 2 weeks"},{"cat":"list","id":"winter","emoji":"🧤","title":"Χειμερινό κιτ","sub":"Κρύο, χιονοθύελλα, χωρίς θέρμανση","blocks":[{"t":"chk","x":"Sleeping bag comfort −15 έως −20 °C (βόρεια Ελλάδα / ορεινά) ή −5 °C (νότια)","e":"Sleeping bag comfort −15 to −20 °C (northern Greece / mountains) or −5 °C (south)"},{"t":"chk","x":"Liner υπνόσακου (+2 έως +5 °C)","e":"Sleeping bag liner (+2 to +5 °C)"},{"t":"chk","x":"Σκηνή που στήνεται ΜΕΣΑ στο σπίτι (μικροκλίμα) ή swag / bivy","e":"Tent set up INSIDE the house (microclimate) or swag / bivy"},{"t":"chk","x":"Ασημοκουβέρτα για κάθε μέλος (+ μία στο αυτοκίνητο)","e":"Foil blanket for each person (+ one in the car)"},{"t":"chk","x":"Μάλλινες κουβέρτες","e":"Wool blankets"},{"t":"chk","x":"Υπόστρωμα μόνωσης (R-value 3+)","e":"Insulating mat (R-value 3+)"},{"t":"chk","x":"Θερμικά εσώρουχα merino","e":"Merino thermal underwear"},{"t":"chk","x":"Μάλλινες κάλτσες, σκούφος, κασκόλ, γάντια (και γάντια-μπαλάκι)","e":"Wool socks, hat, scarf, gloves (and mittens)"},{"t":"chk","x":"Μπουφάν πούπουλο ή συνθετικό","e":"Down or synthetic jacket"},{"t":"chk","x":"Θερμοφόρες νερού","e":"Hot water bottles"},{"t":"chk","x":"Θερμικά επιθέματα χεριών/ποδιών","e":"Hand/foot warmers"},{"t":"chk","x":"Θερμός για ζεστά ροφήματα","e":"Thermos for hot drinks"},{"t":"chk","x":"Ανιχνευτής CO με μπαταρία","e":"Battery CO alarm"},{"t":"chk","x":"Αλάτι/άμμος για πάγο στην είσοδο","e":"Salt/sand for ice at the entrance"},{"t":"chk","x":"Φτυάρι χιονιού","e":"Snow shovel"}],"te":"Winter kit","se":"Cold, snowstorm, no heating"},{"cat":"list","id":"summer","emoji":"🌡️","title":"Καλοκαίρι – φωτιές","sub":"Καύσωνας και δασική πυρκαγιά","blocks":[{"t":"chk","x":"Μάσκες FFP2 για καπνό","e":"FFP2 masks for smoke"},{"t":"chk","x":"Γυαλιά προστασίας (καπνός, στάχτη)","e":"Safety goggles (smoke, ash)"},{"t":"chk","x":"Βαμβακερά/μάλλινα ρούχα που καλύπτουν όλο το σώμα (όχι συνθετικά)","e":"Cotton/wool clothes that cover the whole body (not synthetic)"},{"t":"chk","x":"Γερά παπούτσια με δερμάτινη σόλα","e":"Sturdy shoes with leather soles"},{"t":"chk","x":"Λάστιχο ποτίσματος που φτάνει γύρω από όλο το σπίτι","e":"Garden hose that reaches all around the house"},{"t":"chk","x":"Κουβάδες, φτυάρι, τσουγκράνα","e":"Buckets, shovel, rake"},{"t":"chk","x":"Μάλλινη κουβέρτα","e":"Wool blanket"},{"t":"chk","x":"Ηλεκτρολύτες, πολύ νερό","e":"Electrolytes, lots of water"},{"t":"chk","x":"Ανεμιστήρας μπαταρίας, ψεκαστήρας νερού","e":"Battery fan, water spray bottle"},{"t":"chk","x":"Ξερά χόρτα κομμένα γύρω από το σπίτι (10 m)","e":"Dry grass cut around the house (10 m)"},{"t":"chk","x":"Εγγραφή στο 112 / γνώση διαδρομών διαφυγής","e":"Registered with 112 alerts / know the escape routes"}],"te":"Summer – wildfires","se":"Heatwave and forest fire"},{"cat":"list","id":"boat","emoji":"⛵","title":"Grab bag σκάφους","sub":"Για σκάφος αναψυχής και πλήρωμα","blocks":[{"t":"chk","x":"EPIRB / PLB καταχωρημένο","e":"Registered EPIRB / PLB"},{"t":"chk","x":"VHF φορητό αδιάβροχο + μπαταρίες","e":"Waterproof handheld VHF + batteries"},{"t":"chk","x":"SART (αν υπάρχει)","e":"SART (if available)"},{"t":"chk","x":"Φωτοβολίδες χειρός και καπνογόνα (σε ισχύ)","e":"Hand flares and smoke signals (in date)"},{"t":"chk","x":"Καθρέφτης σήματος, σφυρίχτρα","e":"Signal mirror, whistle"},{"t":"chk","x":"Νερό σε μικρά δοχεία, γεμάτα 3/4 (να επιπλέουν)","e":"Water in small containers, 3/4 full (so they float)"},{"t":"chk","x":"Μπάρες επιβίωσης","e":"Survival bars"},{"t":"chk","x":"Φάρμακα ναυτίας","e":"Seasickness medicine"},{"t":"chk","x":"Αδιάβροχος φακός, light sticks","e":"Waterproof torch, light sticks"},{"t":"chk","x":"Μαχαίρι με στρογγυλή μύτη (για σχεδία)","e":"Blunt-tip knife (for life raft)"},{"t":"chk","x":"Κουβέρτες αλουμινίου / thermal protective aids","e":"Foil blankets / thermal protective aids"},{"t":"chk","x":"Αντηλιακό, καπέλο, γυαλιά","e":"Sunscreen, hat, sunglasses"},{"t":"chk","x":"Φαρμακείο αδιάβροχο","e":"Waterproof first-aid kit"},{"t":"chk","x":"Αντίγραφα εγγράφων σε αδιάβροχη θήκη","e":"Copies of documents in a waterproof pouch"},{"t":"chk","x":"Κινητό σε αδιάβροχη θήκη + powerbank","e":"Phone in a waterproof pouch + power bank"},{"t":"chk","x":"Σωσίβια για όλους με φωτάκι και σφυρίχτρα","e":"Lifejackets for everyone with light and whistle"}],"te":"Boat grab bag","se":"For leisure boats and crew"},{"cat":"list","id":"plan","emoji":"📋","title":"Οικογενειακό σχέδιο – έλεγχος","sub":"Τι πρέπει να έχουμε συμφωνήσει","blocks":[{"t":"chk","x":"Ξέρουν όλοι το 112 και πότε το καλούν","e":"Everyone knows 112 and when to call it"},{"t":"chk","x":"Σημείο συνάντησης κοντά στο σπίτι","e":"Meeting point near the house"},{"t":"chk","x":"Σημείο συνάντησης έξω από τη γειτονιά/πόλη","e":"Meeting point outside the neighbourhood/town"},{"t":"chk","x":"Συγγενής «κέντρο επικοινωνίας» σε άλλη πόλη","e":"Relative as “contact centre” in another town"},{"t":"chk","x":"Ξέρουμε πού κλείνει γκάζι, νερό, ρεύμα","e":"We know where to shut off gas, water, power"},{"t":"chk","x":"Ξέρουμε 2 διαδρομές εξόδου από το σπίτι και από τη γειτονιά","e":"We know 2 exit routes from the house and from the neighbourhood"},{"t":"chk","x":"Ξέρουμε το πλησιέστερο καταφύγιο / ανοιχτό χώρο συγκέντρωσης","e":"We know the nearest shelter / open assembly area"},{"t":"chk","x":"Ξέρουμε το σχέδιο του σχολείου για τα παιδιά","e":"We know the school's plan for the children"},{"t":"chk","x":"Κάθε μέλος έχει σακίδιο","e":"Every person has a bag"},{"t":"chk","x":"Άσκηση σεισμού και φωτιάς 2 φορές τον χρόνο","e":"Earthquake and fire drill 2 times a year"},{"t":"chk","x":"Έλεγχος αποθεμάτων και λήξεων κάθε 6 μήνες (π.χ. Μάρτιο και Σεπτέμβριο)","e":"Check supplies and expiry dates every 6 months (e.g. March and September)"},{"t":"chk","x":"Μάθαμε ΚΑΡΠΑ και πρώτες βοήθειες","e":"We learned CPR and first aid"},{"t":"chk","x":"Ξέρουμε ποιος γείτονας χρειάζεται βοήθεια","e":"We know which neighbour needs help"},{"t":"chk","x":"Συμπληρώσαμε την «Κάρτα μου» σε αυτή την εφαρμογή","e":"We filled in “My Card” in this app"}],"te":"Family plan – check","se":"What we must have agreed"},{"cat":"gear","id":"g_sleep","emoji":"🛏️","title":"Κουβέρτα ή sleeping bag;","sub":"Τι ζεσταίνει καλύτερα","blocks":[{"t":"h","x":"Σύντομη απάντηση","e":"Short answer"},{"t":"li","x":"Για ΥΠΝΟ σε κρύο: sleeping bag + υπόστρωμα. Ζεσταίνει πολύ περισσότερο ανά κιλό.","e":"For SLEEPING in the cold: sleeping bag + sleeping pad. Much more warmth per kilo."},{"t":"li","x":"Για ΣΠΙΤΙ, ΑΥΤΟΚΙΝΗΤΟ, ΦΩΤΙΑ: μάλλινη κουβέρτα. Ανθεκτική, δεν παίρνει εύκολα φωτιά, ζεσταίνει και βρεγμένη.","e":"For HOME, CAR, FIRE: wool blanket. Tough, does not catch fire easily, stays warm even when wet."},{"t":"li","x":"Για ΣΑΚΙΔΙΟ: κουβέρτα αλουμινίου (έκτακτη) + sleeping bag αν χωράει.","e":"For the BACKPACK: emergency (foil) blanket + sleeping bag if it fits."},{"t":"h","x":"Σύγκριση","e":"Comparison"},{"t":"li","x":"Μάλλινη κουβέρτα: + ζεσταίνει βρεγμένη, δύσκολα καίγεται, αντέχει χρόνια, πολλές χρήσεις (αναρτήρας, φορείο). − βαριά (2–3 kg), ογκώδης.","e":"Wool blanket: + warm when wet, hard to burn, lasts for years, many uses (sling, stretcher). − heavy (2–3 kg), bulky."},{"t":"li","x":"Fleece κουβέρτα: + ελαφριά, φθηνή, στεγνώνει γρήγορα. − λιώνει στη φωτιά, λιγότερη ζέστη.","e":"Fleece blanket: + light, cheap, dries fast. − melts in fire, less warmth."},{"t":"li","x":"Βαμβακερή κουβέρτα: − βρεγμένη δεν ζεσταίνει καθόλου. Όχι για επιβίωση.","e":"Cotton blanket: − gives no warmth at all when wet. Not for survival."},{"t":"li","x":"Κουβέρτα αλουμινίου (mylar): + 60 γραμμάρια, κόβει αέρα, κρατάει ζέστη σώματος, σήμα. − σκίζεται, κάνει υγρασία μέσα. Μόνο για έκτακτη ανάγκη.","e":"Foil blanket (mylar): + 60 grams, blocks wind, keeps body heat, signalling. − tears, traps moisture inside. Emergencies only."},{"t":"li","x":"Bivy / σάκος επιβίωσης (σαν mylar σακούλα): καλύτερο από κουβέρτα αλουμινίου, ~100–300 g.","e":"Bivy / survival bag (like a mylar sack): better than a foil blanket, ~100–300 g."},{"t":"h","x":"Sleeping bag: τι κοιτάω","e":"Sleeping bag: what to look for"},{"t":"li","x":"Θερμοκρασία COMFORT (ISO 23537 / EN 13537): εκεί κοιμάσαι άνετα. Το LIMIT είναι για «επιβίωση με κρύο». Το EXTREME αγνόησέ το.","e":"COMFORT temperature (ISO 23537 / EN 13537): you sleep comfortably at this. LIMIT means \"survive while cold\". Ignore EXTREME."},{"t":"li","x":"Νότια Ελλάδα / νησιά, χειμώνας: comfort περίπου 0 °C έως −5 °C. Καλοκαίρι: +10 °C.","e":"Southern Greece / islands, winter: comfort about 0 °C to −5 °C. Summer: +10 °C."},{"t":"li","x":"ΒΟΡΕΙΑ Ελλάδα, ορεινά, χειμερινοί μήνες (και σπίτι χωρίς ρεύμα): comfort −15 °C έως −20 °C. Ένα σπίτι χωρίς θέρμανση στη Φλώρινα ή στο Μέτσοβο πέφτει κάτω από το μηδέν μέσα σε λίγες μέρες.","e":"NORTHERN Greece, mountains, winter months (and a home with no power): comfort −15 °C to −20 °C. An unheated house in Florina or Metsovo drops below zero within a few days."},{"t":"li","x":"Καλύτερα πιο ζεστό παρά πιο κρύο: αν ζεσταίνεσαι, ανοίγεις το φερμουάρ. Αν κρυώνεις, δεν μπορείς να κάνεις τίποτα.","e":"Better too warm than too cold: if you are warm, open the zip. If you are cold, there is nothing you can do."},{"t":"li","x":"Πούπουλο (down): ελαφρύ, μικρό όγκο, ζεστό – αλλά βρεγμένο δεν ζεσταίνει. Fill power 600+.","e":"Down: light, packs small, warm – but gives no warmth when wet. Fill power 600+."},{"t":"li","x":"Συνθετικό: βαρύτερο και ογκωδέστερο, αλλά ζεσταίνει και υγρό. Καλύτερο για σπίτι/αυτοκίνητο/υγρασία.","e":"Synthetic: heavier and bulkier, but stays warm when damp. Better for home/car/humidity."},{"t":"li","x":"Σχήμα «μούμια» κρατάει πιο πολλή ζέστη. Θέλει κουκούλα με κορδόνι.","e":"A \"mummy\" shape keeps more heat. It needs a hood with a drawcord."},{"t":"li","x":"Πρόσθετο: liner (εσωτερικός σάκος) +2 έως +5 °C.","e":"Extra: a liner (inner bag) adds +2 to +5 °C."},{"t":"h","x":"Το κεφάλι έξω","e":"Head outside"},{"t":"li","x":"Κράτα μύτη και στόμα ΕΞΩ από τον υπνόσακο. Η ανάσα μέσα = υγρασία = βρεγμένη γέμιση = κρύο. Σφίξε την κουκούλα γύρω από το πρόσωπο και φόρα σκούφο.","e":"Keep your nose and mouth OUTSIDE the sleeping bag. Breath inside = moisture = wet filling = cold. Tighten the hood around your face and wear a beanie."},{"t":"h","x":"Ασημοκουβέρτα (κουβέρτα αλουμινίου): όλοι μία μαζί","e":"Foil blanket (emergency blanket): one for everyone"},{"t":"li","x":"60 γραμμάρια, μικρότερη από πορτοφόλι, γυρίζει πίσω τη ζέστη του σώματος. Κάθε μέλος της οικογένειας μία στο σακίδιο, μία στο αυτοκίνητο, μία στο μπουφάν.","e":"60 grams, smaller than a wallet, reflects body heat back. One for each family member in the backpack, one in the car, one in the jacket."},{"t":"li","x":"Χρήση: κάτω από το υπόστρωμα, ή τυλιγμένη ΕΞΩ από τον υπνόσακο/κουβέρτα. Μέσα στον υπνόσακο μόνο για 1 νύχτα έκτακτης ανάγκης (κρατάει την υγρασία).","e":"Use: under the sleeping pad, or wrapped OUTSIDE the sleeping bag/blanket. Inside the sleeping bag only for 1 emergency night (it traps moisture)."},{"t":"li","x":"Σε ναυάγιο/τραυματία: τυλίγεις όλο το σώμα και το κεφάλι, αφήνεις ελεύθερο το πρόσωπο.","e":"In a shipwreck/for an injured person: wrap the whole body and head, leave the face free."},{"t":"h","x":"ΥΠΟΣΤΡΩΜΑ: το πιο ξεχασμένο","e":"SLEEPING PAD: the most forgotten item"},{"t":"li","x":"Το έδαφος σου «ρουφάει» τη ζέστη. Χωρίς μόνωση κρυώνεις και με το καλύτερο sleeping bag.","e":"The ground \"sucks\" the heat out of you. Without insulation you get cold even in the best sleeping bag."},{"t":"li","x":"Δείκτης R-value: καλοκαίρι 2, χειμώνας 4+, χιόνι 5+. Δύο υποστρώματα μαζί = αθροίζονται.","e":"R-value: summer 2, winter 4+, snow 5+. Two pads together = values add up."},{"t":"li","x":"Αφρώδες (foam): δεν τρυπιέται, φθηνό. Φουσκωτό: άνετο, μικρό, αλλά θέλει κιτ επισκευής.","e":"Foam: cannot puncture, cheap. Inflatable: comfortable, small, but needs a repair kit."},{"t":"tip","x":"Κοιμήσου με ΣΤΕΓΝΑ ρούχα και σκούφο. Φάε κάτι λιπαρό πριν τον ύπνο. Ούρησε πριν κοιμηθείς – το σώμα δεν ζεσταίνει άσκοπα υγρά.","e":"Sleep in DRY clothes and a beanie. Eat something fatty before bed. Pee before you sleep – the body wastes no heat on extra fluid."}],"te":"Blanket or sleeping bag?","se":"What keeps you warmer"},{"cat":"gear","id":"g_swag","emoji":"🛌","title":"Swag, bivy και μονές σκηνές","sub":"Κρεβάτι-καταφύγιο για ένα άτομο","blocks":[{"t":"li","x":"SWAG (Αυστραλία): καραβόπανο αδιάβροχο με ενσωματωμένο στρώμα αφρού και μικρή «σκηνή» από πάνω. Ανοίγει σε 1 λεπτό, μέσα βάζεις τον υπνόσακο. Ιδανικό για overlanding, ταράτσα αυτοκινήτου, αλλά και ΜΕΣΑ στο σπίτι όταν δεν έχει θέρμανση.","e":"SWAG (Australia): waterproof canvas with a built-in foam mattress and a small \"tent\" on top. Opens in 1 minute, you put your sleeping bag inside. Ideal for overlanding, a car roof, and also INSIDE the house when there is no heating."},{"t":"li","x":"BIVY (bivvy bag): αδιάβροχος σάκος που μπαίνει πάνω από τον υπνόσακο. Κόβει τον αέρα, προσθέτει 3–5 °C, ελαφρύς (300–700 g). Κάποια έχουν τόξο πάνω από το κεφάλι σαν μίνι σκηνή.","e":"BIVY (bivvy bag): a waterproof bag that goes over the sleeping bag. Blocks wind, adds 3–5 °C, light (300–700 g). Some have a hoop over the head like a mini tent."},{"t":"li","x":"Σάκος επιβίωσης (emergency bivy, ασημένιος): 100–300 g, για το σακίδιο και το αυτοκίνητο. Καλύτερος από απλή ασημοκουβέρτα γιατί κλείνει γύρω σου.","e":"Survival bag (emergency bivy, silver): 100–300 g, for the backpack and the car. Better than a plain foil blanket because it closes around you."},{"t":"h","x":"Ο συνδυασμός που δουλεύει στο κρύο","e":"The combination that works in the cold"},{"t":"step","x":"Μόνωση από κάτω (foam + φουσκωτό ή το στρώμα του swag).","e":"Insulation underneath (foam + inflatable, or the swag mattress)."},{"t":"step","x":"Υπνόσακος comfort −15 έως −20 °C για βόρεια Ελλάδα/βουνό τον χειμώνα.","e":"Sleeping bag comfort −15 to −20 °C for northern Greece/mountains in winter."},{"t":"step","x":"Liner μέσα (+2 έως +5 °C).","e":"Liner inside (+2 to +5 °C)."},{"t":"step","x":"Bivy ή swag από έξω (αέρας, υγρασία, +3–5 °C).","e":"Bivy or swag outside (wind, moisture, +3–5 °C)."},{"t":"step","x":"Ασημοκουβέρτα κάτω από όλα ή από πάνω σε πολύ κρύο.","e":"Foil blanket under everything, or on top in very cold weather."},{"t":"step","x":"Σκούφος, κάλτσες μάλλινες, πρόσωπο έξω.","e":"Beanie, wool socks, face outside."},{"t":"tip","x":"Όλα αυτά δουλεύουν και μέσα σε κρύο σπίτι: ένα swag ή μια μικρή σκηνή στο σαλόνι κάνει τεράστια διαφορά.","e":"All of this also works inside a cold house: a swag or a small tent in the living room makes a huge difference."}],"te":"Swag, bivy and one-person tents","se":"A bed-shelter for one person"},{"cat":"gear","id":"g_tent","emoji":"⛺","title":"Σκηνή – καταφύγιο","sub":"Χρειάζομαι σκηνή;","blocks":[{"t":"li","x":"Για καταστροφή στην πόλη: συνήθως ΟΧΙ. Δομές φιλοξενίας, συγγενείς, αυτοκίνητο. Μια σκηνή βοηθάει όμως αν δεν μπορείς να μείνεις σε σπίτι μετά από σεισμό.","e":"For a disaster in the city: usually NO. Shelters, relatives, the car. But a tent helps if you cannot stay in a house after an earthquake."},{"t":"li","x":"Για έξω από την πόλη/βουνό: ναι, ή tarp (μουσαμάς) + σχοινί που είναι ελαφρύτερο.","e":"For outside the city/mountains: yes, or a tarp + rope, which is lighter."},{"t":"h","x":"Τι κοιτάω σε σκηνή","e":"What to look for in a tent"},{"t":"li","x":"3 εποχών για Ελλάδα. 4 εποχών μόνο για χιόνι/βουνό.","e":"3-season for Greece. 4-season only for snow/mountains."},{"t":"li","x":"Στήσιμο σε 5 λεπτά από 1 άτομο. Δοκίμασέ το στο σπίτι πρώτα.","e":"Pitched in 5 minutes by 1 person. Try it at home first."},{"t":"li","x":"Υδροστατική στήλη: πανί 2000+ mm, πάτος 3000+ mm.","e":"Hydrostatic head: fly 2000+ mm, floor 3000+ mm."},{"t":"li","x":"Χωρητικότητα: πάρε 1 άτομο μεγαλύτερη (2 άτομα → σκηνή 3 ατόμων) για πράγματα.","e":"Capacity: get 1 person bigger (2 people → 3-person tent) for gear."},{"t":"li","x":"Οικογενειακή σκηνή: μπορεί να γίνει «δωμάτιο» μετά από σεισμό στον κήπο.","e":"Family tent: can become a \"room\" in the garden after an earthquake."},{"t":"h","x":"Tarp (μουσαμάς)","e":"Tarp"},{"t":"li","x":"3×3 m με κρίκους, 300–600 g. Χίλιοι τρόποι στησίματος. Μαζί με σχοινί και πασσαλάκια.","e":"3×3 m with grommets, 300–600 g. A thousand ways to pitch it. Together with rope and pegs."},{"t":"li","x":"Φθηνή λύση: χοντρό νάιλον οικοδομής + σχοινί.","e":"Cheap option: thick builder's plastic sheet + rope."},{"t":"tip","x":"Πάντα στήνεις σε ψηλότερο σημείο από νερό, ΠΟΤΕ σε ξερό ρέμα (πλημμύρα) και ΠΟΤΕ κάτω από ξερό κλαδί.","e":"Always pitch higher than water, NEVER in a dry stream bed (flood) and NEVER under a dead branch."}],"te":"Tent – shelter","se":"Do I need a tent?"},{"cat":"gear","id":"g_light","emoji":"🔦","title":"Φακοί και φωτισμός","sub":"Τι να πάρω","blocks":[{"t":"li","x":"Φακός ΚΕΦΑΛΗΣ (headlamp) για κάθε μέλος: ελεύθερα χέρια. Ο πιο χρήσιμος φακός.","e":"A HEADLAMP for each member: hands free. The most useful light."},{"t":"li","x":"Φανάρι LED για το δωμάτιο/τραπέζι.","e":"LED lantern for the room/table."},{"t":"li","x":"Φακός χειρός γερός, αδιάβροχος IPX4 ή καλύτερα IPX7.","e":"Sturdy handheld torch, waterproof IPX4 or better IPX7."},{"t":"h","x":"Τι κοιτάω","e":"What to look for"},{"t":"li","x":"Μπαταρίες: προτίμησε ΑΑ ή ΑΑΑ – βρίσκονται παντού. Ή επαναφορτιζόμενο με USB-C + εφεδρικές.","e":"Batteries: prefer AA or AAA – found everywhere. Or rechargeable via USB-C + spares."},{"t":"li","x":"Lumens: 200–400 φτάνουν για τα πάντα. Τα 3000 lumens τελειώνουν την μπαταρία σε λίγο.","e":"Lumens: 200–400 are enough for everything. 3000 lumens drain the battery quickly."},{"t":"li","x":"Χαμηλή στάθμη (5–20 lm) που κρατάει 50+ ώρες – αυτή χρησιμοποιείς τις περισσότερες ώρες.","e":"A low mode (5–20 lm) that lasts 50+ hours – this is what you use most of the time."},{"t":"li","x":"Κόκκινο φως: δεν χαλάει τη νυχτερινή όραση, δεν ξυπνάει τους άλλους.","e":"Red light: does not ruin night vision, does not wake others."},{"t":"li","x":"Λειτουργία SOS/strobe.","e":"SOS/strobe mode."},{"t":"li","x":"Μπαταρίες λιθίου ΑΑ: αντέχουν κρύο και 10–20 χρόνια αποθήκευση. Οι αλκαλικές μπορεί να «τρέξουν» – βγάλ' τες από φακούς που φυλάς.","e":"Lithium AA batteries: handle cold and 10–20 years of storage. Alkaline ones can leak – take them out of torches in storage."},{"t":"h","x":"Κεριά;","e":"Candles?"},{"t":"li","x":"Μόνο σε σταθερή βάση, μακριά από κουρτίνες, ποτέ στον ύπνο, ποτέ με παιδιά μόνα. Προτίμησε LED.","e":"Only on a stable base, away from curtains, never while sleeping, never with children alone. Prefer LED."},{"t":"tip","x":"Δέσε ένα headlamp πάνω σε μπουκάλι νερό με το φως προς το μπουκάλι = φανάρι για όλο το δωμάτιο.","e":"Strap a headlamp onto a water bottle with the light facing the bottle = a lantern for the whole room."}],"te":"Torches and lighting","se":"What to get"},{"cat":"gear","id":"g_power","emoji":"🔋","title":"Ενέργεια – φόρτιση","sub":"Powerbank, ηλιακό, γεννήτρια","blocks":[{"t":"li","x":"Powerbank 10.000 mAh ≈ 2 φορτίσεις κινητού. 20.000 mAh ≈ 4. Φόρτιζέ τα κάθε 3 μήνες.","e":"Power bank 10,000 mAh ≈ 2 phone charges. 20,000 mAh ≈ 4. Recharge them every 3 months."},{"t":"li","x":"Ηλιακό πάνελ πτυσσόμενο 20–30 W: φορτίζει κινητό τη μέρα (μόνο σε ήλιο).","e":"Foldable solar panel 20–30 W: charges a phone during the day (only in sun)."},{"t":"li","x":"Power station (μπαταρία μεγάλη 300–1000 Wh): φως, ρούτερ, ιατρικά μηχανήματα, φόρτιση. Ασφαλής μέσα στο σπίτι. Με ηλιακό πάνελ = ανεξαρτησία.","e":"Power station (large battery 300–1000 Wh): light, router, medical devices, charging. Safe inside the house. With a solar panel = independence."},{"t":"li","x":"Γεννήτρια βενζίνης: πολλή ενέργεια αλλά θόρυβος, καύσιμο, και ΜΟΝΟ έξω (μονοξείδιο).","e":"Petrol generator: lots of power but noise, fuel, and ONLY outdoors (carbon monoxide)."},{"t":"li","x":"Φορτιστής αυτοκινήτου USB.","e":"USB car charger."},{"t":"tip","x":"Κινητό: λειτουργία χαμηλής ενέργειας, χωρίς δεδομένα/Bluetooth, σκοτεινή οθόνη, όχι βίντεο. Λειτουργία πτήσης όταν δεν χρειάζεσαι σήμα. Το GPS δουλεύει και σε λειτουργία πτήσης στα περισσότερα κινητά.","e":"Phone: low power mode, no data/Bluetooth, dim screen, no video. Airplane mode when you don't need signal. GPS still works in airplane mode on most phones."}],"te":"Power – charging","se":"Power bank, solar, generator"},{"cat":"gear","id":"g_solar","emoji":"☀️","title":"Ηλιακά πάνελ: σωστή χρήση","sub":"Ρεύμα από τον ήλιο όταν όλα έχουν πέσει","blocks":[{"t":"tip","x":"Ένα ηλιακό πάνελ με μια μπαταρία (power station ή powerbank) είναι η μόνη πηγή ρεύματος που δεν τελειώνει. Σε κρίση πολλών ημερών είναι ζωτικής σημασίας.","e":"A solar panel with a battery (power station or powerbank) is the only power source that does not run out. In a crisis lasting many days it is vital."},{"t":"h","x":"Τα δύο νούμερα που πρέπει να ξέρεις","e":"The two numbers you need to know"},{"t":"li","x":"W (Watt) = πόσο «δυνατό» είναι κάτι ΤΩΡΑ. Πάνελ 100 W, λάμπα 5 W.","e":"W (Watt) = how “strong” something is RIGHT NOW. 100 W panel, 5 W lamp."},{"t":"li","x":"Wh (βατώρες) = πόση ενέργεια χωράει ή ξοδεύεται. Μπαταρία 500 Wh. Λάμπα 5 W για 10 ώρες = 50 Wh.","e":"Wh (watt-hours) = how much energy is stored or used. 500 Wh battery. 5 W lamp for 10 hours = 50 Wh."},{"t":"li","x":"Σαν βρύση και ντεπόζιτο: τα W είναι πόσο ανοιχτή είναι η βρύση, τα Wh πόσο νερό έχει το ντεπόζιτο.","e":"Like a tap and a tank: W is how far the tap is open, Wh is how much water is in the tank."},{"t":"h","x":"Πόσο βγάζει στην πράξη","e":"How much it really produces"},{"t":"li","x":"Ένα πάνελ δίνει στην πράξη περίπου 50–70% των W που γράφει. Πάνελ 100 W ≈ 60–70 W σε καλό ήλιο.","e":"In practice a panel gives about 50–70% of the W written on it. 100 W panel ≈ 60–70 W in good sun."},{"t":"li","x":"Ελλάδα: ~3 ώρες «δυνατού ήλιου» τον χειμώνα, ~6–7 το καλοκαίρι.","e":"Greece: ~3 hours of “strong sun” in winter, ~6–7 in summer."},{"t":"li","x":"Παράδειγμα: πάνελ 100 W τον χειμώνα ≈ 100 × 3 × 0,7 ≈ 200 Wh τη μέρα. Το καλοκαίρι ≈ 450 Wh.","e":"Example: 100 W panel in winter ≈ 100 × 3 × 0.7 ≈ 200 Wh per day. In summer ≈ 450 Wh."},{"t":"li","x":"Συννεφιά: πέφτει στο 10–25%. Σκιά: σχεδόν μηδέν.","e":"Cloud: drops to 10–25%. Shade: almost zero."},{"t":"h","x":"Τι μπορώ να τροφοδοτήσω με 200 Wh τη μέρα","e":"What can I power with 200 Wh a day"},{"t":"li","x":"Κινητό: ~15 Wh η πλήρης φόρτιση → 10+ κινητά.","e":"Mobile phone: ~15 Wh per full charge → 10+ phones."},{"t":"li","x":"Λάμπα LED 5 W: 40 ώρες φως.","e":"5 W LED lamp: 40 hours of light."},{"t":"li","x":"Ραδιόφωνο: πρακτικά όλη μέρα.","e":"Radio: practically all day."},{"t":"li","x":"Ρούτερ internet 10 W: ~20 ώρες (αν υπάρχει γραμμή).","e":"10 W internet router: ~20 hours (if the line works)."},{"t":"li","x":"Laptop: 3–4 φορτίσεις.","e":"Laptop: 3–4 charges."},{"t":"warn","x":"Ψυγείο, ηλεκτρική σόμπα, κλιματιστικό, βραστήρας, πιστολάκι: ΟΧΙ με μικρό σύστημα. Ένας βραστήρας 2000 W αδειάζει μια μπαταρία 500 Wh σε 15 λεπτά.","e":"Fridge, electric heater, air conditioner, kettle, hair dryer: NOT with a small system. A 2000 W kettle empties a 500 Wh battery in 15 minutes."},{"t":"h","x":"Σωστή χρήση – βήμα βήμα","e":"Correct use – step by step"},{"t":"step","x":"Βάλε το πάνελ ΕΞΩ. Πίσω από τζάμι χάνει 30–60% (τα σύγχρονα θερμομονωτικά τζάμια ακόμα περισσότερο).","e":"Put the panel OUTSIDE. Behind glass it loses 30–60% (modern insulated glazing even more)."},{"t":"step","x":"Στρέψ' το προς τον ΝΟΤΟ (με την πυξίδα της εφαρμογής).","e":"Point it SOUTH (use the app’s compass)."},{"t":"step","x":"Κλίση: τον ΧΕΙΜΩΝΑ σχεδόν όρθιο (~55° από το έδαφος). Το ΚΑΛΟΚΑΙΡΙ πιο ξαπλωτό (~25°). Απλό τεστ: η σκιά του πάνελ πίσω του να είναι η μικρότερη δυνατή.","e":"Tilt: in WINTER almost upright (~55° from the ground). In SUMMER flatter (~25°). Simple test: the panel’s shadow behind it should be as small as possible."},{"t":"step","x":"Γύρνα το προς τον ήλιο κάθε 2–3 ώρες: πρωί ανατολικά, μεσημέρι νότια, απόγευμα δυτικά. Κερδίζεις 20–40%.","e":"Turn it towards the sun every 2–3 hours: morning east, midday south, afternoon west. You gain 20–40%."},{"t":"step","x":"ΚΑΜΙΑ σκιά – ούτε κλαδί, ούτε κάγκελο. Λίγη σκιά σε ένα κομμάτι ρίχνει ΟΛΟ το πάνελ.","e":"NO shade at all – not even a branch or a railing. A little shade on one part drops the WHOLE panel."},{"t":"step","x":"Καθάρισε σκόνη, χιόνι, φύλλα με ένα πανί.","e":"Clean off dust, snow, leaves with a cloth."},{"t":"step","x":"Άφησε αέρα από πίσω: η πολλή ζέστη ρίχνει την απόδοση.","e":"Leave air space behind it: too much heat lowers output."},{"t":"h","x":"Το μεγάλο μυστικό: φόρτιζε ΜΠΑΤΑΡΙΑ, όχι κινητό","e":"The big secret: charge a BATTERY, not the phone"},{"t":"li","x":"Τη μέρα: πάνελ → powerbank ή power station. Το βράδυ: μπαταρία → κινητό, φως, ραδιόφωνο.","e":"By day: panel → powerbank or power station. At night: battery → phone, light, radio."},{"t":"li","x":"Όταν περνάει σύννεφο, το κινητό σταματάει και ξαναρχίζει τη φόρτιση και κουράζεται. Η μπαταρία στη μέση το προστατεύει.","e":"When a cloud passes, the phone stops and restarts charging and gets worn out. The battery in between protects it."},{"t":"li","x":"Ξεκίνα να φορτίζεις από το ΠΡΩΙ. Ο ήλιος της μέρας δεν ξαναγυρίζει.","e":"Start charging in the MORNING. The day’s sun does not come back."},{"t":"h","x":"Τι να αγοράσω","e":"What to buy"},{"t":"chk","x":"Πτυσσόμενο πάνελ 60–100 W με έξοδο USB-C (PD) και DC – για σακίδιο και αυτοκίνητο","e":"Foldable 60–100 W panel with USB-C (PD) and DC output – for backpack and car"},{"t":"chk","x":"Power station 300–1000 Wh (μπαταρία LiFePO4: πιο ασφαλής, χιλιάδες κύκλοι) με είσοδο ηλιακού (MPPT)","e":"300–1000 Wh power station (LiFePO4 battery: safer, thousands of cycles) with solar input (MPPT)"},{"t":"chk","x":"Ταίριαξε ΦΙΣΕΣ πριν την κρίση (MC4, Anderson, DC8020, USB-C). Δοκίμασε όλο το σύστημα μια φορά","e":"Match the PLUGS before the crisis (MC4, Anderson, DC8020, USB-C). Test the whole system once"},{"t":"chk","x":"Μικρό πάνελ 10–20 W + powerbank 20.000 mAh για κάθε σακίδιο","e":"Small 10–20 W panel + 20,000 mAh powerbank for each backpack"},{"t":"chk","x":"Κοντά καλώδια (μακρύ καλώδιο = χαμένη ενέργεια)","e":"Short cables (long cable = lost energy)"},{"t":"h","x":"Ασφάλεια","e":"Safety"},{"t":"warn","x":"Μπαταρίες λιθίου: όχι σε καυτό αυτοκίνητο το καλοκαίρι, όχι σκεπασμένες ενώ φορτίζουν, όχι δίπλα σε κρεβάτι παιδιού. Αν φουσκώσουν, μυρίσουν ή καπνίσουν: βγάλ' τες έξω και απομακρύνσου.","e":"Lithium batteries: not in a hot car in summer, not covered while charging, not next to a child’s bed. If they swell, smell or smoke: take them outside and move away."},{"t":"li","x":"Τα πτυσσόμενα πάνελ αντέχουν ψιχάλα, αλλά οι υποδοχές και το κουτάκι στο πίσω μέρος ΟΧΙ. Μάζεψέ τα στη βροχή.","e":"Foldable panels can take drizzle, but the sockets and the box on the back CANNOT. Bring them in when it rains."},{"t":"li","x":"Ιατρικά μηχανήματα (CPAP, συμπυκνωτής οξυγόνου): μέτρησε από ΤΩΡΑ πόσα W τραβάνε και πόσες ώρες χρειάζεσαι. Αυτά έχουν την πρώτη προτεραιότητα στο ρεύμα.","e":"Medical devices (CPAP, oxygen concentrator): measure NOW how many W they draw and how many hours you need. These get first priority for power."},{"t":"li","x":"Το αυτοκίνητο είναι κι αυτό γεννήτρια: φορτίζει USB με τη μηχανή αναμμένη – ΜΟΝΟ έξω, ποτέ σε κλειστό γκαράζ.","e":"The car is also a generator: it charges USB with the engine running – ONLY outdoors, never in a closed garage."}],"te":"Solar panels: correct use","se":"Power from the sun when everything is down"},{"cat":"gear","id":"g_radio","emoji":"📻","title":"Ραδιόφωνο","sub":"Η μόνη ενημέρωση όταν πέσουν όλα","blocks":[{"t":"li","x":"FM + AM (μεσαία) τουλάχιστον. Μανιβέλα + ηλιακό + μπαταρίες ΑΑ = 3 τρόποι φόρτισης.","e":"FM + AM (medium wave) at least. Hand crank + solar + AA batteries = 3 ways to charge."},{"t":"li","x":"Χρήσιμο: φακός και έξοδος USB για κινητό (λίγη φόρτιση).","e":"Useful: a torch and a USB output for the phone (a little charge)."},{"t":"li","x":"Βραχέα κύματα (SW): ακούς ειδήσεις από το εξωτερικό αν πέσουν οι τοπικοί σταθμοί.","e":"Shortwave (SW): you hear news from abroad if local stations go down."},{"t":"li","x":"Γράψε σε χαρτί τις συχνότητες των σταθμών της περιοχής σου (ΕΡΤ).","e"
