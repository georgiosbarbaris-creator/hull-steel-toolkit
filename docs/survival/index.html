. A closed fridge stays cold ~4 hours. A full freezer ~48 hours, half full ~24."},{"t":"li","x":"Σειρά φαγητού: πρώτα ψυγείο, μετά καταψύκτης, ΤΕΛΕΥΤΑΙΑ κονσέρβες και ξηρά τροφή.","e":"Order of eating: fridge first, then freezer, canned and dry food LAST."},{"t":"warn","x":"Κρέας, ψάρι, γάλα, αυγά πάνω από 2 ώρες σε ζέστη: πέτα τα. Αν έχεις αμφιβολία, πέτα το. Η διάρροια σε κρίση είναι επικίνδυνη.","e":"Meat, fish, milk, eggs more than 2 hours in the heat: throw them away. If in doubt, throw it out. Diarrhoea in a crisis is dangerous."},{"t":"h","x":"Μαγείρεμα με το μισό καύσιμο","e":"Cooking with half the fuel"},{"t":"li","x":"Θερμομαγείρεμα: βράσε ρύζι, ζυμαρικά ή όσπρια 5–10 λεπτά, κλείσε το καπάκι και τύλιξε την κατσαρόλα σε sleeping bag ή κουβέρτες. Μαγειρεύεται μόνο του σε 1–2 ώρες. Γλιτώνεις μέχρι 2/3 του γκαζιού.","e":"Retained-heat cooking: boil rice, pasta or pulses 5–10 minutes, put the lid on and wrap the pot in a sleeping bag or blankets. It cooks by itself in 1–2 hours. You save up to 2/3 of the gas."},{"t":"li","x":"Μούλιασε τα όσπρια από το βράδυ: μισός χρόνος βρασίματος.","e":"Soak pulses overnight: half the boiling time."},{"t":"li","x":"Χύτρα ταχύτητας = λιγότερο καύσιμο και λιγότερο νερό.","e":"Pressure cooker = less fuel and less water."},{"t":"li","x":"Πάντα με καπάκι. Χωρίς καπάκι ξοδεύεις διπλό γκάζι.","e":"Always use a lid. Without a lid you use twice the gas."},{"t":"li","x":"Ζέστανε κονσέρβα στον ήλιο ή πάνω στο καπό αυτοκινήτου που δουλεύει (ανοιγμένη λίγο, όχι κλειστή).","e":"Warm a can in the sun or on the bonnet of a running car (opened slightly, not sealed)."},{"t":"h","x":"Μπαταρία κινητού","e":"Phone battery"},{"t":"li","x":"Στην οικογένεια: ΕΝΑ κινητό ανοιχτό κάθε φορά, τα άλλα κλειστά. Αλλάζετε κάθε λίγες ώρες.","e":"In the family: ONE phone on at a time, the others off. Swap every few hours."},{"t":"li","x":"Στο κρύο η μπαταρία «πέφτει»: κράτα το κινητό μέσα στο μπουφάν, κοντά στο σώμα. Στον ύπνο μέσα στο sleeping bag.","e":"In the cold the battery “drops”: keep the phone inside your jacket, close to your body. When sleeping, inside the sleeping bag."},{"t":"li","x":"Ένα παλιό κινητό με offline χάρτες, αυτή την εφαρμογή και φορτιστή = εφεδρικό σε σακούλα στο σακίδιο.","e":"An old phone with offline maps, this app and a charger = a spare in a bag in the backpack."},{"t":"h","x":"Το αυτοκίνητο είναι εργαλείο","e":"The car is a tool"},{"t":"li","x":"Καταφύγιο, θέρμανση, φορτιστής, ραδιόφωνο, φώτα για σήμα.","e":"Shelter, heating, charger, radio, lights for signalling."},{"t":"li","x":"Θέρμανση: μηχανή 10 λεπτά κάθε ώρα, με λίγο ανοιχτό παράθυρο.","e":"Heating: engine 10 minutes every hour, with the window slightly open."},{"t":"warn","x":"Χιόνι ή λάσπη στην εξάτμιση = μονοξείδιο μέσα στο αυτοκίνητο. Καθάρισέ την πριν ανάψεις.","e":"Snow or mud in the exhaust = carbon monoxide inside the car. Clear it before starting the engine."},{"t":"h","x":"Σπίτι χωρίς θέρμανση","e":"House without heating"},{"t":"li","x":"Μονωτικό από τα πράγματα του σπιτιού: χαρτόνια στο πάτωμα, κουβέρτες στα παράθυρα, αφρολέξ ή φυσαλίδες συσκευασίας στο τζάμι (ψεκάζεις νερό και κολλάνε).","e":"Insulation from household items: cardboard on the floor, blankets on the windows, foam or bubble wrap on the glass (spray with water and it sticks)."},{"t":"li","x":"Στήσε σκηνή μέσα στο δωμάτιο: μικρός χώρος = ζεσταίνεται από τις ανάσες και τα σώματα.","e":"Pitch a tent inside the room: a small space = it warms up from breath and bodies."},{"t":"li","x":"Γλάστρα με κεριά «θερμάστρα»: δίνει πολύ λίγη ζέστη και έχει κίνδυνο φωτιάς. Καλύτερα σώμα, sleeping bag, ένα δωμάτιο.","e":"Flowerpot-and-candle “heater”: gives very little heat and is a fire risk. Better: body, sleeping bag, one room."},{"t":"h","x":"Νερό και υγιεινή","e":"Water and hygiene"},{"t":"li","x":"Αντισηπτικό χεριών ΠΡΙΝ το φαγητό και ΜΕΤΑ την τουαλέτα. Στις καταστροφές η διάρροια σκοτώνει περισσότερους από ό,τι νομίζουμε.","e":"Hand sanitiser BEFORE eating and AFTER the toilet. In disasters diarrhoea kills more people than we think."},{"t":"li","x":"Μωρομάντηλα = μπάνιο χωρίς νερό.","e":"Baby wipes = a bath without water."},{"t":"li","x":"Ένα μπουκάλι με τρύπα στο καπάκι κρεμασμένο = βρύση για πλύσιμο χεριών με ελάχιστο νερό.","e":"A hanging bottle with a hole in the cap = a tap for hand washing with very little water."},{"t":"li","x":"Νερό από το πλύσιμο → τουαλέτα. Τίποτα δεν πετιέται.","e":"Washing water → toilet. Nothing is thrown away."},{"t":"h","x":"Επικοινωνία και αναζήτηση","e":"Communication and searching"},{"t":"li","x":"Αν φύγετε από το σπίτι: γράψε με μαρκαδόρο σε χαρτί στην πόρτα «Είμαστε 3, όλοι καλά, πήγαμε στο …, ημερομηνία».","e":"If you leave home: write with a marker on paper on the door “We are 3, all OK, gone to …, date”."},{"t":"li","x":"SMS αντί για κλήση. Σύντομο: «Καλά. Σπίτι. Αύριο 10:00 στο σημείο συνάντησης.»","e":"SMS instead of a call. Keep it short: “OK. Home. Tomorrow 10:00 at the meeting point.”"},{"t":"li","x":"3 σφυρίγματα / 3 λάμψεις / 3 φωτιές = ΒΟΗΘΕΙΑ σε όλο τον κόσμο.","e":"3 whistle blasts / 3 flashes / 3 fires = HELP all over the world."},{"t":"h","x":"Υγεία","e":"Health"},{"t":"li","x":"Έχε πάντα 2 εβδομάδες επιπλέον από τα φάρμακα που παίρνεις καθημερινά (μίλα με τον γιατρό σου).","e":"Always keep 2 weeks’ extra supply of the medicines you take daily (talk to your doctor)."},{"t":"li","x":"Εφεδρικά γυαλιά οράσεως στο σακίδιο. Χωρίς γυαλιά πολλοί δεν μπορούν να κάνουν τίποτα.","e":"Spare prescription glasses in the backpack. Without glasses many people cannot do anything."},{"t":"li","x":"Κράτα σε χαρτί: ομάδα αίματος, αλλεργίες, φάρμακα, τηλέφωνα.","e":"Keep on paper: blood group, allergies, medicines, phone numbers."},{"t":"h","x":"Μυαλό","e":"Mind"},{"t":"li","x":"Πρόγραμμα κάθε μέρα: ώρα φαγητού, νερού, ύπνου, δουλειές. Η ρουτίνα κρατάει την ψυχραιμία.","e":"A daily schedule: times for food, water, sleep, chores. Routine keeps you calm."},{"t":"li","x":"Δώσε στα παιδιά δουλειές («εσύ είσαι υπεύθυνος για τους φακούς»). Νιώθουν χρήσιμα και φοβούνται λιγότερο.","e":"Give children jobs (“you are in charge of the flashlights”). They feel useful and are less afraid."},{"t":"li","x":"Βοήθα τον γείτονα. Στις κρίσεις επιβιώνουν οι γειτονιές, όχι οι μοναχικοί.","e":"Help your neighbour. In crises neighbourhoods survive, not loners."}],"te":"Powerful survival tricks","se":"Small secrets that make a big difference"},{"cat":"tips","id":"t_kids","emoji":"🧒","title":"Για παιδιά","sub":"Απλά λόγια για μικρούς ήρωες","blocks":[{"t":"li","x":"Σεισμός: «Σκύβω, μπαίνω κάτω από το τραπέζι, κρατιέμαι». Μετά βγαίνω μόνο με μεγάλο.","e":"Earthquake: \"I drop, I get under the table, I hold on\". Then I go out only with a grown-up."},{"t":"li","x":"Φωτιά: «Βγαίνω έξω, δεν κρύβομαι, δεν ξαναμπαίνω». Ποτέ κάτω από κρεβάτι ή σε ντουλάπα.","e":"Fire: \"I go outside, I don't hide, I don't go back in\". Never under the bed or in a wardrobe."},{"t":"li","x":"Καπνός: «Πάω χαμηλά, μπουσουλώντας».","e":"Smoke: \"I go low, on hands and knees\"."},{"t":"li","x":"Ρούχα πήραν φωτιά: «Σταματάω – πέφτω – κυλάω».","e":"My clothes caught fire: \"Stop – drop – roll\"."},{"t":"li","x":"Χάθηκα: «Μένω εκεί που είμαι, αγκαλιάζω ένα δέντρο, σφυρίζω 3 φορές». Δεν φοβάμαι αυτούς που με ψάχνουν, ακόμα κι αν φωνάζουν το όνομά μου.","e":"I am lost: \"I stay where I am, I hug a tree, I whistle 3 times\". I am not afraid of the people looking for me, even if they shout my name."},{"t":"li","x":"Βρήκα κάτι παράξενο μεταλλικό: «ΔΕΝ το αγγίζω, φεύγω, λέω σε μεγάλο».","e":"I found something strange made of metal: \"I DON'T touch it, I walk away, I tell a grown-up\"."},{"t":"li","x":"Τηλέφωνο: «Παίρνω 112 και λέω το όνομά μου, πού είμαι, τι έγινε».","e":"Phone: \"I call 112 and say my name, where I am, what happened\"."},{"t":"li","x":"Ξέρω απ' έξω το τηλέφωνο της μαμάς ή του μπαμπά.","e":"I know Mum's or Dad's phone number by heart."},{"t":"li","x":"Ξέρω το σημείο συνάντησης της οικογένειας.","e":"I know my family's meeting place."},{"t":"tip","x":"Κάντε τα παιχνίδι: «Ποιος βρίσκει πρώτος το ασφαλές σημείο στο δωμάτιο;».","e":"Make it a game: \"Who finds the safe spot in the room first?\"."}],"te":"For kids","se":"Simple words for little heroes"},{"cat":"tips","id":"t_books","emoji":"📚","title":"Βιβλία και πηγές","sub":"Για να μάθεις περισσότερα","blocks":[{"t":"li","x":"Πολιτική Προστασία – οδηγίες ανά κίνδυνο: civilprotection.gov.gr","e":"Greek Civil Protection – advice for each hazard: civilprotection.gov.gr"},{"t":"li","x":"112 Ελλάδα: 112.gr","e":"112 Greece: 112.gr"},{"t":"li","x":"Ελληνικός Ερυθρός Σταυρός – σεμινάρια πρώτων βοηθειών.","e":"Hellenic Red Cross – first aid courses."},{"t":"li","x":"ΕΚΑΒ – σεμινάρια ΚΑΡΠΑ.","e":"EKAB (Greek National Ambulance Service) – CPR courses."},{"t":"li","x":"«SAS Survival Handbook» – John «Lofty» Wiseman (ο κλασικός οδηγός επιβίωσης των SAS).","e":"\"SAS Survival Handbook\" – John \"Lofty\" Wiseman (the classic SAS survival guide)."},{"t":"li","x":"«Bushcraft 101» – Dave Canterbury.","e":"\"Bushcraft 101\" – Dave Canterbury."},{"t":"li","x":"«98.6 Degrees: The Art of Keeping Your Ass Alive» – Cody Lundin (ψύξη/υπερθέρμανση).","e":"\"98.6 Degrees: The Art of Keeping Your Ass Alive\" – Cody Lundin (cold/overheating)."},{"t":"li","x":"«Deep Survival» – Laurence Gonzales (η ψυχολογία της επιβίωσης).","e":"\"Deep Survival\" – Laurence Gonzales (the psychology of survival)."},{"t":"li","x":"Οδηγίες Ευρωπαϊκής Ένωσης για ετοιμότητα 72 ωρών (Preparedness Union Strategy).","e":"European Union guidance on 72-hour preparedness (Preparedness Union Strategy)."},{"t":"li","x":"Οδηγοί ετοιμότητας Σουηδίας «Om krisen eller kriget kommer» και Φινλανδίας (72tuntia.fi).","e":"Preparedness guides from Sweden \"Om krisen eller kriget kommer\" and Finland (72tuntia.fi)."},{"t":"li","x":"Ready.gov (ΗΠΑ) και Get Prepared (Καναδάς) – για πυρηνικά/ραδιολογικά.","e":"Ready.gov (USA) and Get Prepared (Canada) – for nuclear/radiological."},{"t":"li","x":"Ναυτικοί: SOLAS LSA Code, IAMSAR Vol. III (on board), οδηγίες σωστικών μέσων του πλοίου.","e":"Seafarers: SOLAS LSA Code, IAMSAR Vol. III (on board), the ship's life-saving appliances instructions."}],"te":"Books and sources","se":"To learn more"}];
/* ===== Επιβίωση 72+: βοηθητικά για τα σχέδια (SVG, offline) – Created by George Barbaris =====
   Κάθε αρχείο survival/img/<κατηγορία>.js γράφει: Object.assign(SIMG,{ cardId:[{at, c:['ελληνικά','English'], f:()=>'<svg inner>'}] })
   at = σε ποια ενότητα ## μπαίνει, ακριβώς κάτω από τον τίτλο της (0 = 1η ενότητα, 1 = 2η…). -1 = στην αρχή, πριν από όλα.
   f() επιστρέφει το ΕΣΩΤΕΡΙΚΟ ενός SVG με viewBox 0 0 320 180. Κείμενο μέσα στο σχέδιο ΜΟΝΟ με L2('ελ','en'), λίγες λέξεις. */
const SIMG={};
const L2=(el,en)=>(typeof LANG!=='undefined'&&LANG==='en')?en:el;
const IC={bg:'#16283d',ln:'#e8eef5',dk:'#0a1522',or:'#f77f00',rd:'#d62828',yl:'#fcbf49',gn:'#2a9d8f',bl:'#3a86ff',wt:'#2b6cb0',gr:'#8a9bb0',sk:'#24405f',sm:'#5c6b7a',sn:'#f2f6fa',gd:'#3d3226',wd:'#8b5e3c',sk2:'#e0ac69'};
/* κείμενο: o={c:χρώμα,s:μέγεθος,a:'start|middle|end',b:bold} */
const iT=(x,y,t,o)=>{o=o||{};return`<text x="${x}" y="${y}" fill="${o.c||IC.ln}" font-size="${o.s||11}" text-anchor="${o.a||'middle'}" font-weight="${o.b?700:400}" font-family="system-ui,-apple-system,sans-serif">${t}</text>`};
const iL=(x1,y1,x2,y2,c,w,d)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c||IC.ln}" stroke-width="${w||2}" stroke-linecap="round"${d?' stroke-dasharray="5 4"':''}/>`;
/* βέλος από (x1,y1) σε (x2,y2) */
function iA(x1,y1,x2,y2,c,w){c=c||IC.yl;w=w||3;const a=Math.atan2(y2-y1,x2-x1),h=9,p1=[x2-h*Math.cos(a-.5),y2-h*Math.sin(a-.5)],p2=[x2-h*Math.cos(a+.5),y2-h*Math.sin(a+.5)];
 return iL(x1,y1,x2-4*Math.cos(a),y2-4*Math.sin(a),c,w)+`<polygon points="${x2},${y2} ${p1[0].toFixed(1)},${p1[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}" fill="${c}"/>`}
const iOK=(x,y,r)=>{r=r||10;return`<circle cx="${x}" cy="${y}" r="${r}" fill="${IC.gn}"/><path d="M${x-r*.45},${y} l${r*.32},${r*.38} l${r*.6},-${r*.75}" fill="none" stroke="#fff" stroke-width="${r*.27}" stroke-linecap="round" stroke-linejoin="round"/>`};
const iNO=(x,y,r)=>{r=r||10;return`<circle cx="${x}" cy="${y}" r="${r}" fill="${IC.rd}"/><path d="M${x-r*.38},${y-r*.38} l${r*.76},${r*.76} M${x+r*.38},${y-r*.38} l-${r*.76},${r*.76}" stroke="#fff" stroke-width="${r*.27}" stroke-linecap="round"/>`};
/* «απαγορεύεται»: κόκκινος κύκλος με διαγώνια πάνω από ό,τι βρίσκεται στο (x,y) με ακτίνα r */
const iBan=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${IC.rd}" stroke-width="${r/7}"/><line x1="${x-r*.7}" y1="${y-r*.7}" x2="${x+r*.7}" y2="${y+r*.7}" stroke="${IC.rd}" stroke-width="${r/7}"/>`;
/* αριθμός βήματος σε πορτοκαλί κύκλο */
const iNum=(x,y,n)=>`<circle cx="${x}" cy="${y}" r="10" fill="${IC.or}"/>`+iT(x,y+4.5,n,{c:'#000',b:1,s:13});
const iGround=(y,c)=>`<rect x="0" y="${y}" width="320" height="${180-y}" fill="${c||IC.gd}"/>`;
const iFloor=(y)=>iL(0,y,320,y,IC.gr,3);
/* ΑΝΘΡΩΠΟΣ σε οποιαδήποτε στάση. Δίνεις σημεία: h=κεφάλι, n=λαιμός/ώμοι, p=λεκάνη, e1/a1=αγκώνας/χέρι, e2/a2, k1/f1=γόνατο/πόδι, k2/f2.
   Όλα [x,y]. Παραλείπεις ό,τι δεν φαίνεται. o={c:χρώμα,w:πάχος,r:ακτίνα κεφαλιού} */
function iP(j,o){o=o||{};const c=o.c||IC.ln,w=o.w||6,r=o.r||8,seg=(a,b)=>a&&b?`M${a[0]},${a[1]} L${b[0]},${b[1]} `:'';
 let d=seg(j.n,j.p)+seg(j.n,j.e1)+seg(j.e1,j.a1)+seg(j.n,j.e2)+seg(j.e2,j.a2)+seg(j.p,j.k1)+seg(j.k1,j.f1)+seg(j.p,j.k2)+seg(j.k2,j.f2);
 return`<path d="${d}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`+(j.h?`<circle cx="${j.h[0]}" cy="${j.h[1]}" r="${r}" fill="${c}"/>`:'')}

/* Επιβίωση 72+ – σχέδια κατηγορίας 'now' (μέρος 2) – Created by George Barbaris */
/* ξαπλωμένος σε sleeping bag: κεφάλι στο (x,y-10), σώμα προς τα δεξιά, μήκος len, πάτωμα στο y. pad=υπόστρωμα από κάτω */
function n2_bag(x,y,len,o){o=o||{};let h='';
 if(o.pad)h+=`<rect x="${x-12}" y="${y-5}" width="${len+20}" height="6" rx="2" fill="${IC.bl}"/>`;
 const yb=o.pad?y-5:y;
 h+=`<path d="M${x+6},${yb-20} Q${x+len*0.4},${yb-24} ${x+len},${yb-14} L${x+len},${yb} L${x+6},${yb} Q${x-4},${yb-10} ${x+6},${yb-20} Z" fill="${o.c||IC.or}" stroke="${IC.dk}" stroke-width="1.5"/>`;
 if(o.covered){h+=`<path d="M${x-2},${yb-10} Q${x-4},${yb-24} ${x+12},${yb-22} L${x+12},${yb} Q${x-4},${yb} ${x-2},${yb-10} Z" fill="${o.c||IC.or}" stroke="${IC.dk}" stroke-width="1.5"/>`;}
 else{h+=`<circle cx="${x}" cy="${yb-10}" r="8" fill="${IC.sk2}"/><path d="M${x-8},${yb-12} A8,8 0 0 1 ${x+6},${yb-17} L${x+8},${yb-10}" fill="${IC.rd}"/>`+
  `<path d="M${x+4},${yb-20} Q${x-12},${yb-10} ${x+4},${yb}" fill="none" stroke="${IC.dk}" stroke-width="3"/>`;}
 return h}
/* μικρό κυματιστό βέλος ζέστης προς τα πάνω */
const n2_heat=(x,y,c)=>`<path d="M${x},${y} q-4,-5 0,-10 t0,-10" fill="none" stroke="${c||IC.or}" stroke-width="2.4" stroke-linecap="round"/><path d="M${x-4},${y-17} L${x},${y-24} L${x+4},${y-17} Z" fill="${c||IC.or}"/>`;
const n2_flake=(x,y,s)=>{s=s||5;return`<g stroke="${IC.sn}" stroke-width="1.5" stroke-linecap="round">${iL(x-s,y,x+s,y,IC.sn,1.5)}${iL(x-s*.5,y-s*.87,x+s*.5,y+s*.87,IC.sn,1.5)}${iL(x-s*.5,y+s*.87,x+s*.5,y-s*.87,IC.sn,1.5)}</g>`};
/* γεννήτρια: κάτω αριστερά (x,y) */
const n2_gen=(x,y)=>`<rect x="${x}" y="${y-26}" width="40" height="24" rx="3" fill="${IC.yl}" stroke="${IC.dk}" stroke-width="1.5"/><rect x="${x+6}" y="${y-20}" width="14" height="12" fill="${IC.dk}"/><rect x="${x+2}" y="${y-30}" width="36" height="5" rx="2" fill="${IC.gr}"/><circle cx="${x+8}" cy="${y-1}" r="3" fill="${IC.dk}"/><circle cx="${x+32}" cy="${y-1}" r="3" fill="${IC.dk}"/>`;
/* ραδιόφωνο */
const n2_radio=(x,y)=>`<rect x="${x-26}" y="${y-18}" width="52" height="34" rx="5" fill="${IC.or}" stroke="${IC.dk}" stroke-width="1.5"/><circle cx="${x-10}" cy="${y}" r="10" fill="${IC.dk}"/><circle cx="${x-10}" cy="${y}" r="5" fill="${IC.gr}"/><rect x="${x+4}" y="${y-10}" width="16" height="7" fill="${IC.sn}"/>${iL(x+12,y-18,x+24,y-40,IC.gr,2)}<circle cx="${x+12}" cy="${y+7}" r="3" fill="${IC.dk}"/>`;
/* τομή κτιρίου: x αριστερά, y έδαφος, n όροφοι πάνω από το έδαφος, fh ύψος ορόφου, w πλάτος, υπόγειο από κάτω (bh) */
function n2_bldg(x,y,w,n,fh,bh){let h=`<rect x="${x}" y="${y-n*fh}" width="${w}" height="${n*fh+(bh||0)}" fill="${IC.sk}" stroke="${IC.ln}" stroke-width="3"/>`;
 for(let i=1;i<n;i++)h+=iL(x,y-i*fh,x+w,y-i*fh,IC.gr,2);
 if(bh)h+=iL(x,y,x+w,y,IC.gr,2);
 return h}

 // ήρεμο πρόσωπο

/* ===== Καταφύγιο ===== */
w_shelter:[
{at:0,c:['Στήσε το καταφύγιο σε σημείο προστατευμένο από τον αέρα (π.χ. πίσω από βράχο). ΟΧΙ σε ρέμα ή κοίτη, ΟΧΙ κάτω από ξερά κλαδιά, ΟΧΙ σε κορυφή.','Put the shelter where it is sheltered from the wind (e.g. behind a rock). NOT in a stream or dry riverbed, NOT under dead branches, NOT on a summit.'],f:()=>{

 // 2 κοίτη

 // 3 ξερά κλαδιά

{at:1,c:['Σχοινί ανάμεσα σε 2 δέντρα, το νάιλον από πάνω σαν «Α». Πρώτα μόνωση από το έδαφος, 20–30 cm κλαδιά και φύλλα. Η κλειστή πλευρά προς τον αέρα, η είσοδος αντίθετα.','Rope between 2 trees, sheet over it like an “A”. First insulate from the ground with 20–30 cm of branches and leaves. Closed side to the wind, entrance facing away.'],f:()=>{
 let h=iGround(124);
 const A1=[110,78],L1=[72,150],R1=[148,150],dx=110,dy=-14,A2=[A1[0]+dx,A1[1]+dy],L2p=[L1[0]+dx,L1[1]+dy],R2=[R1[0]+dx,R1[1]+dy];
 const P=a=>a.map(p=>p.join(',')).join(' ');
 const ry=x=>A1[1]+(x-A1[0])*dy/dx;
 h+=wild_tree(300,138,96,22);
 // πίσω κλειστή πλευρά, εσωτερικό, μόνωση
 h+=`<polygon points="${P([A2,L2p,R2])}" fill="#a85a00"/>`;
 h+=`<polygon points="${P([A1,A2,L2p,L1])}" fill="#7a4300"/>`;
 h+=`<polygon points="${P([[L1[0]+6,L1[1]-2],[R1[0]-6,R1[1]-2],[R2[0]-6,R2[1]-2],[L2p[0]+6,L2p[1]-2]])}" fill="#4f7a3a"/>`;
 h+=`<rect x="${L1[0]+6}" y="${L1[1]-12}" width="${R1[0]-L1[0]-12}" height="12" fill="#5d8a45" stroke="${IC.wd}" stroke-width="2"/>`;
 for(let x=L1[0]+10;x<R1[0]-8;x+=9)h+=iL(x,L1[1]-10,x+5,L1[1]-3,IC.wd,1.6);
 // δεξιά πλευρά (μπροστινή)
 h+=`<polygon points="${P([A1,A2,R2,R1])}" fill="${IC.or}" stroke="${IC.dk}" stroke-width="1.5"/>`;
 // σχοινί
 h+=iL(34,ry(34),300,ry(300),IC.ln,2.5)+wild_tree(34,156,70,20).replace(/^/,'');
 h+=iL(34,ry(34),A1[0],A1[1],IC.ln,2.5);
 // αέρας στην κλειστή πλευρά
 h+=iA(316,60,272,78,'#9cc3d6',3)+iA(316,84,276,98,'#9cc3d6',3)+iT(234,42,L2('ΑΕΡΑΣ','WIND'),{b:1,s:12,c:'#9cc3d6'});
 // ετικέτες
 h+=iA(66,160,84,151,IC.yl,2.5)+iT(40,174,L2('ΕΙΣΟΔΟΣ','ENTRANCE'),{b:1,s:10,c:IC.yl});
 h+=iA(146,164,126,150,IC.yl,2.5)+iT(150,174,L2('ΜΟΝΩΣΗ 20–30 cm','INSULATION 20–30 cm'),{b:1,s:10,c:IC.yl,a:'start'});
 h+=iT(180,24,L2('ΣΧΟΙΝΙ','ROPE'),{s:10,c:IC.ln})+iL(180,28,180,ry(180)-3,IC.ln,1);
 return h}}],

{at:5,c:['Λάκκος 60 cm πλάτος και 50 cm βάθος, δοχείο στη μέση, πράσινα φύλλα γύρω. Νάιλον από πάνω, χώμα στις άκρες, πέτρα στο κέντρο. Οι σταγόνες στάζουν καθαρές στο δοχείο.','A pit 60 cm wide and 50 cm deep, a container in the middle, green leaves around it. Clear plastic on top, soil on the edges, a stone in the centre. Drops run down and fall clean into the container.'],f:()=>{

 // λάκκος

 // φύλλα
 [[100,140],[112,152],[208,140],[220,150],[96,120],[226,118]].forEach(([x,y])=>{h+=`<ellipse cx="${x}" cy="${y}" rx="10" ry="5" fill="${IC.gn}" transform="rotate(${x<160?-25:25} ${x} ${y})"/>`});
 // δοχείο

 // νάιλον
 h+=`<path d="M66,${g} L160,112 L254,${g}" fill="none" stroke="#cfe6f5" stroke-width="3"/>`;
 h+=`<path d="M60,${g} q12,-12 24,0 Z M236,${g} q12,-12 24,0 Z" fill="${IC.gd}" stroke="${IC.wd}" stroke-width="1.5"/>`;
 h+=wild_rock(160,108,16,10,IC.sn);
 [[110,94],[132,104],[190,102],[212,92]].forEach(([x,y])=>{h+=wild_drop(x,y+6,.22,'#9cc3d6')});
 h+=wild_drop(160,124,.3,'#9cc3d6');
 h+=iA(100,86,140,106,'#9cc3d6',2)+iA(220,86,180,106,'#9cc3d6',2);
 h+=iL(80,176,240,176,IC.yl,1.5)+iT(160,174,'60 cm',{s:10,b:1,c:IC.yl});
 h+=iL(262,g+4,262,160,IC.yl,1.5)+iT(266,120,'50 cm',{s:10,b:1,c:IC.yl,a:'start'});
 return h}}],

w_water2:[
{at:1,c:['1 Θολό νερό; πέρασέ το από πανί. 2 Δυνατός βρασμός για 1 λεπτό (πάνω από 2000 m: 3 λεπτά). 3 Άφησέ το να κρυώσει σκεπασμένο.','1 Cloudy water? Pass it through a cloth. 2 Rolling boil for 1 minute (above 2000 m: 3 minutes). 3 Let it cool covered.'],f:()=>{

 // 2: βρασμός

{at:2,c:['Απλή χλωρίνη χωρίς άρωμα: 2 σταγόνες σε 1 λίτρο καθαρό νερό (θολό ή πολύ κρύο: 4). Ανακάτεψε και περίμενε 30 λεπτά.','Plain unscented bleach: 2 drops in 1 litre of clear water (cloudy or very cold: 4). Stir and wait 30 minutes.'],f:()=>{
 let h=iPanels(2);const g=162;
 h+=iNum(16,20,'1')+iT(90,25,L2('2 ΣΤΑΓΟΝΕΣ','2 DROPS'),{b:1,s:13,c:IC.yl});
 h+=iNum(176,20,'2')+iT(250,25,L2('30 ΛΕΠΤΑ','30 MIN'),{b:1,s:13,c:IC.yl});

 h+=wild_drop(92,92,.28,IC.yl)+wild_drop(92,108,.28,IC.yl);
 h+=wild_bottle(96,g,1.05,'#9cc3d6','1 L');
 h+=iT(40,150,'×2',{s:20,b:1,c:IC.yl});

 h+=iT(250,160,L2('ανακάτεψε, περίμενε','stir, wait'),{s:11,c:IC.ln});

{at:6,c:['DIY φίλτρο: ανάποδο μπουκάλι, από κάτω προς τα πάνω πανί, κάρβουνο, λεπτή άμμος, χοντρή άμμος, χαλίκι. Μόνο ξεθολώνει – μετά ΠΑΝΤΑ βράσιμο ή χλωρίνη.','DIY filter: an upside-down bottle, from bottom to top: cloth, charcoal, fine sand, coarse sand, gravel. It only clears the water – then ALWAYS boil it or add bleach.'],f:()=>{
 let h='';const x=80,w=56,top=20;
 const lay=[[L2('χαλίκι','gravel'),'#9a8f80',20],[L2('χοντρή άμμος','coarse sand'),'#c9a86b',22],[L2('λεπτή άμμος','fine sand'),'#e6cf9a',22],[L2('κάρβουνο','charcoal'),'#2a2a2a',18]];
 let y=top+12;h+=`<rect x="${x-w/2}" y="${top}" width="${w}" height="12" fill="#3a7bd5" opacity=".7"/>`;
 lay.forEach(([t,c,hh])=>{h+=`<rect x="${x-w/2}" y="${y}" width="${w}" height="${hh}" fill="${c}"/>`+iL(x+w/2+4,y+hh/2,x+w/2+16,y+hh/2,IC.gr,1)+iT(x+w/2+19,y+hh/2+4,t,{s:10,a:'start'});y+=hh});
 // λαιμός με πανί

 h+=`<path d="M${x-w/2},${top} L${x-w/2},${y} L${x-8},${y+16} L${x-8},${y+22} L${x+8},${y+22} L${x+8},${y+16} L${x+w/2},${y} L${x+w/2},${top}" fill="none" stroke="${IC.ln}" stroke-width="2"/>`;
 h+=wild_drop(x,y+34,.3,'#9cc3d6');
 h+=`<path d="M${x-18},${y+40} L${x+18},${y+40} L${x+15},170 L${x-15},170 Z" fill="${IC.gr}" stroke="${IC.ln}" stroke-width="1.5"/>`;
 // μετά βράσιμο
 h+=iA(196,120,226,120,IC.yl,3)+wild_pot(268,158,50,30)+iFire(256,172,.6)+iFire(280,172,.6)+`<circle cx="258" cy="140" r="3" fill="none" stroke="${IC.sn}"/><circle cx="270" cy="134" r="3" fill="none" stroke="${IC.sn}"/><circle cx="280" cy="142" r="3" fill="none" stroke="${IC.sn}"/>`;
 h+=iT(268,98,L2('ΜΕΤΑ','THEN'),{b:1,s:12,c:IC.yl})+iT(268,114,L2('ΒΡΑΣΕ','BOIL'),{b:1,s:12,c:IC.yl});
 return h}}],

/* ===== Φωτιά ===== */
w_fire:[
{at:0,c:['Μάζεψε ΠΡΙΝ ανάψεις: 1 προσάναμμα (μια χούφτα), 2 μικρά κλαδιά (πολλά – δύο αγκαλιές), 3 ξύλα για όλη τη νύχτα, και φέρε τα διπλά.','Gather BEFORE you light: 1 tinder (a handful), 2 kindling (lots – two armfuls), 3 fuel wood for the whole night, and bring double.'],f:()=>{

 // προσάναμμα: χνούδι

 for(let i=0;i<10;i++){const a=i*0.63;h+=iL(60+10*Math.cos(a),g-12+7*Math.sin(a),60+20*Math.cos(a),g-12+12*Math.sin(a),'#bfa977',1.2)}

 h+=iT(60,g+22,L2('ΠΡΟΣΑΝΑΜΜΑ','TINDER'),{b:1,s:11,c:IC.yl})+iT(60,g+38,L2('1 χούφτα','1 handful'),{s:11});
 h+=iT(160,g+22,L2('ΜΙΚΡΑ ΚΛΑΔΙΑ','KINDLING'),{b:1,s:11,c:IC.yl})+iT(160,g+38,L2('2 αγκαλιές','2 armfuls'),{s:11});
 h+=iT(274,g+22,L2('ΞΥΛΑ','FUEL WOOD'),{b:1,s:12,c:IC.yl})+iT(274,g+38,L2('όλη νύχτα ×2','all night ×2'),{s:11});
 return h}},
{at:3,c:['Στήσιμο «σκηνή» (tipi): προσάναμμα στη μέση, μικρά κλαδιά γύρω, με «πόρτα» από την πλευρά του αέρα. Άναψε από εκεί και φύσα απαλά στη βάση. Καθαρό κύκλο 3 m γύρω.','Tipi lay: tinder in the middle, kindling around it, with a “door” on the wind side. Light it from there and blow gently at the base. A clear circle of 3 m around.'],f:()=>{

 [[150,g+8],[166,g+9],[180,g+8],[194,g+5],[206,g],[196,g-6],[176,g-8],[146,g-6]].forEach(([x,y])=>{h+=iL(x,y,ap[0]+(x-160)*.08,ap[1],'#a77b52',4)});

 h+=`<ellipse cx="160" cy="${g}" rx="14" ry="6" fill="#d9c79a"/>`+iFire(160,g-2,1.1);

 for(let i=0;i<9;i++){const a=i*Math.PI/8;h+=`<ellipse cx="${160+64*Math.cos(a)}" cy="${g+2+14*Math.sin(a)}" rx="11" ry="7" fill="${IC.gr}" stroke="${IC.dk}"/>`}

 h+=iA(16,96,70,112,'#9cc3d6',3)+iA(12,120,66,128,'#9cc3d6',3)+iT(40,82,L2('ΑΕΡΑΣ','WIND'),{b:1,s:12,c:'#9cc3d6'});
 h+=iA(84,160,136,140,IC.yl,2.5)+iT(60,174,L2('ΠΟΡΤΑ','DOOR'),{b:1,s:12,c:IC.yl});
 h+=iT(232,40,L2('ΜΙΚΡΑ ΚΛΑΔΙΑ','KINDLING'),{s:11,c:IC.ln})+iL(196,44,170,62,IC.ln,1);
 return h}},
{at:5,c:['ΠΟΤΕ φωτιά, μαγκάλι, κάρβουνα ή γκαζάκι μέσα σε σκηνή, αυτοκίνητο ή κλειστό δωμάτιο. Το μονοξείδιο του άνθρακα (CO) δεν μυρίζει και σκοτώνει στον ύπνο.','NEVER a fire, brazier, charcoal or gas stove inside a tent, car or closed room. Carbon monoxide (CO) has no smell and kills in your sleep.'],f:()=>{

/* ===== Τρόποι φωτιάς ===== */

/* ===== Ύπνος στο αυτοκίνητο ===== */
w_car:[
{at:-1,c:['ΠΟΤΕ ύπνος με τη μηχανή αναμμένη. Το μονοξείδιο (CO) μπαίνει στην καμπίνα, ειδικά αν το χιόνι κλείσει την εξάτμιση. Δεν μυρίζει και δεν ξυπνάς.','NEVER sleep with the engine running. Carbon monoxide (CO) gets into the cabin, especially if snow blocks the exhaust. It has no smell and you do not wake up.'],f:()=>{

 h+=iBan(196,g-44,64);

{at:1,c:['Μόνωσε τα ΤΖΑΜΙΑ: εκεί χάνεται η περισσότερη ζέστη. Πάνελ από reflectix ή αφρώδες υπόστρωμα, κομμένα στο σχήμα κάθε παραθύρου, σφηνώνουν χωρίς κόλλα.','Insulate the WINDOWS: that is where most heat escapes. Panels of reflectix or foam underlay, cut to the shape of each window, press-fit with no glue.'],f:()=>{

 h+=iT(64,30,L2('ΜΟΝΩΣΗ','INSULATE'),{b:1,s:13,c:IC.yl})+iT(64,46,L2('ΤΖΑΜΙΩΝ','WINDOWS'),{b:1,s:13,c:IC.yl});

{at:2,c:['Άφησε 1–2 παράθυρα ανοιχτά 1–2 cm. Χωρίς αερισμό η ανάσα σου γίνεται νερό και πάγος στα τζάμια και στον υπνόσακο.','Leave 1–2 windows open 1–2 cm. Without ventilation your breath turns to water and ice on the windows and sleeping bag.'],f:()=>{

 h+=`<path d="M40,170 L40,92 L84,30 L260,30 L280,92 L280,170 Z" fill="${IC.or}" stroke="${IC.dk}" stroke-width="2"/>`;

 // αέρας μέσα-έξω

/* ===== Σήματα ===== */
w_signal:[
{at:-1,c:['ΤΡΙΑ από οτιδήποτε = SOS, π.χ. 3 φωτιές σε τρίγωνο. Με καθρέφτη ή CD στείλε λάμψεις προς αεροπλάνο – σημάδεψε με τα δάχτυλα σε σχήμα V.','THREE of anything = SOS, e.g. 3 fires in a triangle. With a mirror or CD, flash toward an aircraft – aim with your fingers in a V shape.'],f:()=>{

 // 3 φωτιές τρίγωνο
 h+=`<polygon points="80,104 36,156 124,156" fill="none" stroke="${IC.yl}" stroke-width="1.5" stroke-dasharray="4 4"/>`;

 h+=pl;
 const man=[200,g];

 h+=`<polygon points="226,${g-62} 246,34 256,40" fill="${IC.yl}" opacity=".5"/>`+iL(226,g-62,250,37,IC.yl,2);
 [[250,28],[244,44],[258,48]].forEach(([x,y])=>{h+=iL(x-6,y,x+6,y,IC.yl,2)});
 return h}},
{at:0,c:['Σήματα στο έδαφος προς αεροσκάφος, μεγάλα (3 m+), με πέτρες, κλαδιά ή πανιά: V βοήθεια, X ιατρική βοήθεια, Y ναι, N όχι, βέλος = πάω προς τα εκεί.','Ground-to-air signals, large (3 m+), with stones, branches or cloth: V help, X medical help, Y yes, N no, arrow = I am going this way.'],f:()=>{

 const cols=[32,96,160,224,288];

 h+=iL(cols[4]-20,96,cols[4]+16,96,c,w)+`<polygon points="${cols[4]+26},96 ${cols[4]+8},80 ${cols[4]+8},112" fill="${c}"/>`;

 h+=iT(286,170,'3 m+',{b:1,s:11,c:IC.gr});
 return h}},
{at:1,c:['Και τα δύο χέρια ψηλά σε V = «Χρειάζομαι βοήθεια». Ένα χέρι πάνω, ένα κάτω = «Δεν χρειάζομαι βοήθεια».','Both arms up in a V = “I need help”. One arm up, one down = “I do not need help”.'],f:()=>{

/* ===== Προσανατολισμός ===== */
w_navi:[
{at:1,c:['Ραβδί στο έδαφος. Πέτρα 1 στην άκρη της σκιάς, μετά από 15–20 λεπτά πέτρα 2 στη νέα άκρη. Η γραμμή 1→2 δείχνει ΔΥΣΗ→ΑΝΑΤΟΛΗ. Με την 1 αριστερά και τη 2 δεξιά κοιτάς ΒΟΡΡΑ.','Stick in the ground. Pebble 1 at the tip of the shadow, after 15–20 minutes pebble 2 at the new tip. The line 1→2 points WEST→EAST. With 1 on your left and 2 on your right you face NORTH.'],f:()=>{
 let h=`<rect x="0" y="40" width="320" height="140" fill="${IC.gd}"/>`;

 h+=iL(s1[0],s1[1],s2[0],s2[1],IC.yl,3,1);
 h+=iL(b[0],b[1],b[0],b[1]-22,IC.wd,5)+`<circle cx="${b[0]}" cy="${b[1]}" r="3" fill="${IC.wd}"/>`;
 h+=`<ellipse cx="${s1[0]}" cy="${s1[1]}" rx="8" ry="5" fill="${IC.sn}"/><ellipse cx="${s2[0]}" cy="${s2[1]}" rx="8" ry="5" fill="${IC.sn}"/>`;
 h+=iT(s1[0],s1[1]+22,'1',{b:1,s:14})+iT(s2[0],s2[1]+22,'2',{b:1,s:14})+iT(s2[0]+34,s2[1]+30,'15–20′',{s:11,c:IC.gr});
 h+=iT(s1[0]-24,s1[1]+5,L2('Δ','W'),{b:1,s:18,c:IC.yl})+iT(s2[0]+26,s2[1]+5,L2('Α','E'),{b:1,s:18,c:IC.yl});
 h+=iA(155,104,155,52,IC.rd,4)+iT(155,32,L2('ΒΟΡΡΑΣ','NORTH'),{b:1,s:14,c:IC.rd});
  return h}},
{at:3,c:['Βρες τη Μεγάλη Άρκτο («κατσαρόλα»). Τα δύο αστέρια της άκρης δείχνουν τον Πολικό, περίπου 5 φορές την απόστασή τους. Ο Πολικός = ΒΟΡΡΑΣ.','Find the Big Dipper (the “saucepan”). The two stars at its end point to Polaris, about 5 times the distance between them. Polaris = NORTH.'],f:()=>{
 let h=`<rect x="0" y="0" width="320" height="160" fill="#0b1626"/>`+`<path d="M0,160 L40,150 L90,156 L150,146 L210,154 L270,148 L320,156 L320,180 L0,180 Z" fill="${IC.dk}"/>`;
 [[20,20],[60,40],[250,30],[290,70],[230,110],[270,130],[40,140],[140,30],[300,20],[210,60]].forEach(([x,y])=>{h+=wild_star(x,y,1.2,IC.gr)});
 const M=[110,140],D=[122,122],Me=[96,112],Ph=[84,132],Al=[74,98],Mi=[58,92],Ak=[38,98];
 const P=[182,32];
 h+=`<path d="M${D} L${Me} L${Al} L${Mi} L${Ak} M${Me} L${Ph} L${M} L${D}" stroke="${IC.gr}" stroke-width="1.2" fill="none"/>`;

 h+=`<circle cx="${P[0]}" cy="${P[1]}" r="9" fill="${IC.yl}" opacity=".25"/>`+wild_star(P[0],P[1],5,IC.yl);
 h+=iT(142,80,'×5',{b:1,s:14,c:IC.yl,a:'end'});
 h+=iT(P[0]+12,P[1]+5,L2('ΠΟΛΙΚΟΣ','POLARIS'),{b:1,s:12,c:IC.yl,a:'start'});
 h+=iT(66,70,L2('ΜΕΓΑΛΗ ΑΡΚΤΟΣ','BIG DIPPER'),{s:11,c:IC.ln});
 h+=iL(P[0],P[1]+12,P[0],140,IC.rd,1.5,1)+iA(P[0],120,P[0],146,IC.rd,3)+iT(P[0],172,L2('ΒΟΡΡΑΣ','NORTH'),{b:1,s:13,c:IC.rd});

/* ===== Φαγητό ===== */
w_food:[{at:0,c:['Ψάρι καλά μαγειρεμένο και γνωστά φρούτα που ξέρεις 100% (π.χ. σύκα, βατόμουρα): ναι. ΠΟΤΕ άγνωστα φυτά, μούρα ή μανιτάρια.','Well-cooked fish and known fruit you are 100% sure of (e.g. figs, blackberries): yes. NEVER unknown plants, berries or mushrooms.'],f:()=>{

{at:-1,c:['Σε κατάσταση επιβίωσης ΔΕΝ τρώμε άγρια μανιτάρια – ποτέ με βάση φωτογραφία, εφαρμογή ή «μοιάζει». Το μαγείρεμα δεν τα κάνει ασφαλή.','In a survival situation we DO NOT eat wild mushrooms – never based on a photo, an app or “it looks like”. Cooking does not make them safe.'],f:()=>{

 h+=iPhone(240,150,.5)+iNO(256,142,7);
 return h}},
{at:1,c:['1 Κάλεσε ΑΜΕΣΩΣ Κέντρο Δηλητηριάσεων 210 7793777 ή 166, ακόμα κι αν νιώθει καλά. 2 Κράτα τα μανιτάρια που περίσσεψαν. 3 Σημείωσε την ώρα και ποιοι έφαγαν.','1 Call the Poison Centre 210 7793777 or 166 IMMEDIATELY, even if they feel fine. 2 Keep the remaining mushrooms. 3 Note the time and who ate them.'],f:()=>{
 let h=iPanels(3);
 h+=iNum(16,20,'1')+iNum(123,20,'2')+iNum(229,20,'3');
 h+=iPhone(53,96,1.5,'166')+iT(53,160,'210 7793777',{s:11,b:1,c:IC.yl});
 h+=`<path d="M136,80 L184,80 L188,150 L132,150 Z" fill="#cfe6f5" opacity=".85" stroke="${IC.ln}" stroke-width="1.5"/>`+iL(132,88,188,88,IC.bl,3)+wild_mush(150,140,.6)+wild_mush(170,144,.5);
 h+=iT(160,166,L2('κράτα τα','keep them'),{s:11});

 return h}}],

/* ===== Υγιεινή ===== */
w_hyg:[{at:-1,c:['Τουαλέτα στη φύση: λάκκος 15–20 cm βάθος, 60+ m μακριά από νερό και από το καταφύγιο. Μετά σκέπασέ τον με χώμα. Πλύσιμο χεριών ΠΑΝΤΑ.','Toilet in the wild: a hole 15–20 cm deep, 60+ m away from water and from the shelter. Then cover it with soil. ALWAYS wash your hands.'],f:()=>{

 // λάκκος

 // αποστάσεις

/* ===== Κόμποι ===== */
w_knots:[{at:-1,c:['Καρικόμπι (bowline): θηλιά που δεν σφίγγει – «το κουνέλι βγαίνει από την τρύπα, γυρίζει γύρω από το δέντρο και ξαναμπαίνει». Σταυρόκομπος (clove hitch): δύο γύροι γύρω από στύλο, χιαστί.','Bowline: a loop that does not tighten – “the rabbit comes out of the hole, goes around the tree and goes back in”. Clove hitch: two turns around a post, crossed.'],f:()=>{
 let h=iPanels(2);
 // ΚΑΡΙΚΟΜΠΙ: πρώτα το κομμάτι της ουράς που περνά ΠΙΣΩ από το «δέντρο»
 h+=wild_rope('M76,40 C78,30 92,28 94,40',IC.or);
 h+=wild_rope('M80,12 L80,56');
 // μικρή θηλιά «τρύπα» και μεγάλη θηλιά
 h+=wild_rope('M80,56 C80,70 70,80 60,76 C48,70 52,56 64,56 C74,56 86,66 96,80 C112,104 110,150 82,154 C54,156 48,112 66,90');
 // ουρά: βγαίνει από την τρύπα, γύρω από το δέντρο, ξαναμπαίνει
 h+=wild_rope('M66,90 C68,72 72,52 76,40',IC.or);
 h+=wild_rope('M94,40 C94,56 86,70 80,104',IC.or);
 h+=iT(80,174,L2('ΚΑΡΙΚΟΜΠΙ','BOWLINE'),{b:1,s:12,c:IC.yl});
 h+=iT(116,20,L2('δέντρο','tree'),{s:10,c:IC.gr,a:'start'})+iL(114,18,86,18,IC.gr,1);
 h+=iT(14,52,L2('τρύπα','hole'),{s:10,c:IC.gr,a:'start'})+iL(30,56,50,64,IC.gr,1);
 h+=iT(126,120,L2('θηλιά','loop'),{s:10,c:IC.gr,a:'start'})+iL(124,117,108,116,IC.gr,1);
 h+=iT(126,62,L2('κουνέλι','rabbit'),{s:10,c:IC.or,a:'start'})+iL(124,60,100,46,IC.or,1);
 // ΣΤΑΥΡΟΚΟΜΠΟΣ (όψη με το Χ)
 h+=wild_rope('M172,90 L240,90');
 h+=wild_rope('M240,84 L306,84');
 h+=`<rect x="226" y="18" width="28" height="140" rx="3" fill="${IC.wd}"/>`;
 h+=wild_rope('M228,64 L252,108');
 h+=wild_rope('M228,108 L252,64');
 h+=iT(240,174,L2('ΣΤΑΥΡΟΚΟΜΠΟΣ','CLOVE HITCH'),{b:1,s:12,c:IC.yl});
 return h}}],

/* ===== Καιρός ===== */
w_weather:[{at:-1,c:['Αστραπή: μέτρα τα δευτερόλεπτα μέχρι τη βροντή και διαίρεσε με 3 = χιλιόμετρα. Κάτω από 30 δευτερόλεπτα = κάλυψη τώρα. Σύννεφα σαν πύργοι το απόγευμα = καταιγίδα.','Lightning: count the seconds until the thunder and divide by 3 = kilometres. Under 30 seconds = take cover now. Clouds building like towers in the afternoon = thunderstorm.'],f:()=>{
 let h='';
 // πύργος σύννεφου
 h+=`<g fill="${IC.sm}"><circle cx="70" cy="40" r="20"/><circle cx="52" cy="58" r="18"/><circle cx="88" cy="60" r="20"/><circle cx="40" cy="80" r="18"/><circle cx="70" cy="78" r="22"/><circle cx="102" cy="82" r="18"/><rect x="24" y="80" width="96" height="16"/></g>`;
 h+=`<path d="M70,96 L58,124 L70,124 L56,158 L84,116 L72,116 L82,96 Z" fill="${IC.yl}"/>`;
 h+=iClock(160,60,16);
 h+=iT(240,66,L2('δευτ. ÷ 3','sec ÷ 3'),{b:1,s:16,c:IC.ln})+iT(240,88,'= km',{b:1,s:16,c:IC.ln});
 h+=`<rect x="146" y="112" width="166" height="54" rx="10" fill="${IC.rd}" opacity=".9"/>`;
 h+=iT(229,134,L2('< 30 δευτ.','< 30 sec'),{b:1,s:15,c:'#fff'})+iT(229,156,L2('ΚΑΛΥΨΗ ΤΩΡΑ','TAKE COVER'),{b:1,s:14,c:'#fff'});
 return h}}],

/* ===== Μετά τις 72 ώρες ===== */
w_after:[{at:0,c:['Απογραφή: πόσο νερό, φαγητό, φάρμακα και καύσιμα έχουμε, και για πόσες μέρες φτάνουν. Μετά σχέδιο κατανάλωσης και βάρδιες.','Inventory: how much water, food, medicine and fuel we have, and for how many days. Then a consumption plan and shifts.'],f:()=>{
 let h=`<rect x="40" y="16" width="150" height="156" rx="8" fill="${IC.sn}"/><rect x="92" y="10" width="46" height="14" rx="4" fill="${IC.gr}"/>`;
 const rows=[[46,L2('νερό','water')],[78,L2('φαγητό','food')],[110,L2('φάρμακα','medicine')],[142,L2('καύσιμα','fuel')]];
 h+=wild_drop(64,rows[0][0]+4,.55);
 h+=`<rect x="54" y="${rows[1][0]-10}" width="20" height="22" rx="3" fill="${IC.or}"/><rect x="54" y="${rows[1][0]-4}" width="20" height="8" fill="${IC.yl}"/>`;
 h+=`<rect x="54" y="${rows[2][0]-5}" width="22" height="10" rx="5" fill="${IC.rd}"/><rect x="65" y="${rows[2][0]-5}" width="11" height="10" rx="0" fill="${IC.sn}" stroke="${IC.rd}"/>`;
 h+=`<path d="M54,${rows[3][0]+10} L54,${rows[3][0]-6} L60,${rows[3][0]-12} L74,${rows[3][0]-12} L74,${rows[3][0]+10} Z" fill="${IC.gn}"/>`;
 rows.forEach(([y,t])=>{h+=iT(86,y+5,t,{s:12,c:IC.dk,a:'start',b:1})+`<rect x="160" y="${y-8}" width="16" height="16" fill="none" stroke="${IC.dk}" stroke-width="2"/>`+`<path d="M163,${y} l4,5 l8,-10" stroke="${IC.gn}" stroke-width="3" fill="none" stroke-linecap="round"/>`});
 // ημερολόγιο
 h+=`<rect x="214" y="44" width="88" height="80" rx="6" fill="${IC.sn}"/><rect x="214" y="44" width="88" height="20" rx="6" fill="${IC.rd}"/>`;
 for(let r=0;r<3;r++)for(let c=0;c<5;c++)h+=`<rect x="${222+c*16}" y="${72+r*16}" width="10" height="10" fill="${IC.gr}"/>`;
 h+=iT(258,146,L2('ΠΟΣΕΣ ΜΕΡΕΣ;','HOW MANY DAYS?'),{b:1,s:12,c:IC.yl});
 return h}}],

/* ---- i18n EL/EN ---- */
const LANG=(()=>{try{const v=localStorage.getItem('sv_lang');if(v)return JSON.parse(v)}catch(e){}return (navigator.language||'el').toLowerCase().startsWith('el')?'el':'en'})();
const TRM=LANG==='en'?{"ο ήλιος ανατέλλει ακριβώς Ανατολικά και δύει ακριβώς Δυτικά μόνο στις ισημερίες (~21 Μαρτίου, ~23 Σεπτεμβρίου). Το καλοκαίρι ανατέλλει πιο βόρεια (ΒΑ), τον χειμώνα πιο νότια (ΝΑ). Το μεσημέρι (ηλιακό) ο ήλιος είναι ακριβώς Νότια.":"the sun rises exactly in the East and sets exactly in the West only at the equinoxes (~21 March, ~23 September). In summer it rises further north (NE), in winter further south (SE). At (solar) noon the sun is exactly South.","Το GPS δίνει υψόμετρο με ακρίβεια ±10–30 m. Περίμενε 1–2 λεπτά σε ανοιχτό ουρανό για καλύτερη τιμή. Για ακρίβεια μέτρου: η εφαρμογή «Πυξίδα» του iPhone και τα ρολόγια με αλτίμετρο χρησιμοποιούν το βαρόμετρο της συσκευής.":"GPS gives altitude accurate to ±10–30 m. Wait 1–2 minutes under open sky for a better value. For accuracy to the metre: the iPhone «Compass» app and watches with an altimeter use the device's barometer.","Το Safari/Chrome δεν επιτρέπουν σε καμία web εφαρμογή να διαβάσει τον αισθητήρα πίεσης του κινητού. Γράφεις εδώ τις ενδείξεις από βαρόμετρο, ρολόι, σταθμό ή VHF/NAVTEX, και η εφαρμογή βγάζει την τάση και την πρόγνωση.":"Safari/Chrome do not let any web app read the phone's pressure sensor. Write here the readings from a barometer, watch, weather station or VHF/NAVTEX, and the app works out the trend and the forecast.","«Long foretold, long last – short notice, soon past»: αργή αλλαγή = μεγάλη διάρκεια, απότομη αλλαγή = περνάει γρήγορα. Κανόνας Buys Ballot: με την πλάτη στον άνεμο, το χαμηλό είναι αριστερά σου (βόρειο ημισφαίριο).":"«Long foretold, long last – short notice, soon past»: slow change = lasts long, sudden change = passes quickly. Buys Ballot's law: with your back to the wind, the low is on your left (northern hemisphere).","Βάλε το δάχτυλο να σκεπάζει την πίσω κάμερα, ακίνητο, για 20″. Στο iPhone ο φακός δεν ανάβει από εδώ: κράτα το δάχτυλο κάτω από δυνατό φως (λάμπα ή φακό άλλου κινητού). Στο Android ανάβει μόνος του.":"Put your finger over the back camera and keep it still for 20″. On iPhone the flashlight cannot be turned on from here: hold your finger under a strong light (a lamp or another phone's flashlight). On Android it turns on by itself.","Για κανονική χρήση άφησέ το 0. Στην Ελλάδα η μαγνητική απόκλιση είναι περίπου +5° E. Αν η πυξίδα κάνει λάθος, κάνε «οκτάρια» με το κινητό στον αέρα και κράτα το μακριά από μέταλλα, ηχεία, μαγνήτες.":"For normal use leave it at 0. In Greece the magnetic declination is about +5° E. If the compass is wrong, wave the phone in a «figure 8» in the air and keep it away from metal, speakers and magnets.","Δεν είναι επιστημονικός σεισμογράφος και δεν δίνει Ρίχτερ ούτε προειδοποίηση. Για επίσημα στοιχεία: Γεωδυναμικό Ινστιτούτο (ΕΑΑ). Αν ο σεισμός είναι δυνατός: Σκύψε – Κάλυψε – Κρατήσου.":"This is not a scientific seismograph and does not give Richter magnitude or warnings. For official data: Geodynamic Institute (NOA). If the earthquake is strong: Drop – Cover – Hold on.","το κινητό στην τσέπη ή στη ζώνη και φορτισμένο. Το iPhone δεν αφήνει web εφαρμογές να στείλουν SMS μόνες τους ή να δουλεύουν κλειστές. Για αυτόματη κλήση, άνοιξε επίσης στο iPhone":"your phone in your pocket or on your belt, and charged. iPhone does not let web apps send SMS by themselves or work while closed. For automatic calling, also turn on on the iPhone","Κάθε εγγραφή κρατάει ώρα και θέση GPS (αν βρεθεί). Οι φωτογραφίες μπαίνουν σε χαμηλή ανάλυση για να μη γεμίζει το κινητό. Γράψε πρώτα σημείωση και μετά πάτα 📷 για να μπει μαζί.":"Each entry keeps the time and the GPS position (if found). Photos are saved in low resolution so the phone does not fill up. Write the note first, then tap 📷 to add it together.","Κατέβασε το σπίτι σου, τη δουλειά, το εξοχικό και όπου ταξιδεύεις. Ανανέωνε κάθε λίγους μήνες. Δεδομένα © OpenStreetMap contributors – μπορεί να λείπουν σημεία.":"Download your home, your work, your holiday home and wherever you travel. Refresh every few months. Data © OpenStreetMap contributors – some places may be missing.","πολιτικό λυκόφως): ο ήλιος είναι κάτω από τον ορίζοντα αλλά βλέπεις να περπατάς και να δουλεύεις χωρίς φακό. Περίπου 25–30′ πριν την ανατολή και μετά τη δύση.":"civil twilight): the sun is below the horizon but you can see well enough to walk and work without a flashlight. About 25–30′ before sunrise and after sunset.","Χωρίς καταφύγιο: μακριά από κορυφές, μεμονωμένα δέντρα, νερό και μέταλλα. Κάτσε στις φτέρνες, πόδια ενωμένα, πάνω σε υπόστρωμα. Η ομάδα σκορπίζει 15 m.":"No shelter: stay away from peaks, lone trees, water and metal. Crouch on your heels, feet together, on a mat. The group spreads out 15 m apart.","ανοίγει έτοιμο SMS με τη θέση σου, την ομάδα αίματος και τα φάρμακα από την «Κάρτα μου», προς τις επαφές σου. Εσύ ή όποιος σε βρει πατάει «Αποστολή».":"opens a ready SMS with your position, blood type and medicines from «My card», to your contacts. You, or whoever finds you, taps «Send».","Πάνελ 20–30 W με θύρα USB: γεμίζει κινητό σε 2–3 ώρες ήλιου. Τα μικρά powerbank με «ηλιακό» στο καπάκι γεμίζουν ελάχιστα – μην τα εμπιστεύεσαι.":"A 20–30 W panel with a USB port: charges a phone in 2–3 hours of sun. Small powerbanks with a «solar» lid charge very little – don't rely on them.","· = σύντομο, − = μακρύ (3 φορές το σύντομο). Κενό ανάμεσα σε γράμματα = 3, ανάμεσα σε λέξεις = 7. Το SOS στέλνεται ενωμένο, χωρίς κενά.":"· = short, − = long (3 times the short). Gap between letters = 3, between words = 7. SOS is sent joined, with no gaps.","φώναξε «Ακούει κανείς; Χτύπα 3 φορές!», μετά ΗΣΥΧΙΑ όλοι και άφησε το κινητό να ακούει. Καταγράφει σφυρίχτρες και χτυπήματα με την ώρα.":"shout «Can anyone hear me? Knock 3 times!», then everyone keeps QUIET and let the phone listen. It records whistles and knocks with the time.","iPhone: για τον φακό σύρε από πάνω δεξιά προς τα κάτω (Κέντρο Ελέγχου) → 🔦. Για SOS κλήση: κράτα πατημένο το πλαϊνό κουμπί + ένταση.":"iPhone: for the flashlight swipe down from the top right (Control Centre) → 🔦. For an SOS call: hold down the side button + a volume button.","ακούμπα το επίπεδα στο πάτωμα ή στο ταμπλό. «Πλάγια» = side slope, «Μπρος–πίσω» = ανηφόρα. Πάτα «Μηδένισε» σε επίπεδο έδαφος πρώτα.":"lay it flat on the floor or the dashboard. «Side» = side slope, «Front–back» = uphill. Tap «Zero» on level ground first.","πριν φύγεις, πάτα «📤 Στείλε το σχέδιο» σε έναν δικό σου. Αν δεν του στείλεις μέχρι την ώρα αυτή, ξέρει ότι πρέπει να ψάξει και πού.":"before you leave, tap «📤 Send the plan» to someone you trust. If you don't message them by that time, they know they must search, and where.","τέντωσε το χέρι, παλάμη οριζόντια κάτω από τον ήλιο. Κάθε δάχτυλο ανάμεσα στον ήλιο και τον ορίζοντα ≈ 15 λεπτά. 4 δάχτυλα ≈ 1 ώρα.":"stretch out your arm, palm flat below the sun. Each finger between the sun and the horizon ≈ 15 minutes. 4 fingers ≈ 1 hour.","Αν πέσεις ή χτυπήσεις και μετά μείνεις ακίνητος, ή αν δεν κουνηθείς για τον χρόνο που διάλεξες, το κινητό χτυπάει δυνατά για 30″.":"If you fall or get hit and then stay still, or if you don't move for the time you chose, the phone rings loudly for 30″.","100 % = 45°. 30 % ≈ 17°. Τα περισσότερα αυτοκίνητα: όριο πλευρικής κλίσης ~30–35° στα χαρτιά, στην πράξη μην περνάς τις 20–25°.":"100 % = 45°. 30 % ≈ 17°. Most cars: side tilt limit ~30–35° on paper, in practice don't go beyond 20–25°.","μη φωνάζεις συνέχεια (σκόνη, κούραση). Χτύπα σε σωλήνα ή τοίχο 3 φορές ή σφύρα. Η σφυρίχτρα SOS της εφαρμογής ακούγεται μακριά.":"don't keep shouting (dust, tiredness). Knock on a pipe or wall 3 times, or whistle. The app's SOS whistle can be heard far away.",". Για να θυμάσαι τα γράμματα, άκουσέ τα (ρυθμός), μη μετράς τελείες. Με φακό στη νύχτα το σήμα φαίνεται χιλιόμετρα μακριά.":". To remember the letters, listen to them (the rhythm), don't count dots. With a flashlight at night the signal can be seen kilometres away.","Όταν λήξει ο χρόνος και η εφαρμογή είναι ανοιχτή, χτυπάει συναγερμός για 60″ και μετά ανοίγει SMS βοήθειας με τη θέση σου.":"When the time runs out and the app is open, an alarm rings for 60″ and then a help SMS with your position opens.","Βάλε κωδικό/Face ID στο κινητό. Κράτα και αντίγραφα σε στικάκι USB στο σακίδιο και χάρτινες φωτοτυπίες σε αδιάβροχη θήκη.":"Set a passcode/Face ID on the phone. Also keep copies on a USB stick in your backpack and paper photocopies in a waterproof pouch.","Ο ήλιος είναι κάτω από τον ορίζοντα. Τη νύχτα: βρες τον Πολικό αστέρα (Βορράς) ή χρησιμοποίησε τον μηνίσκο της σελήνης.":"The sun is below the horizon. At night: find the Pole Star (North) or use the crescent moon.","τελευταία Κυριακή Μαρτίου +1 ώρα (θερινή), τελευταία Κυριακή Οκτωβρίου −1 ώρα (χειμερινή). Ο πίνακας τη λογαριάζει ήδη.":"last Sunday of March +1 hour (summer time), last Sunday of October −1 hour (winter time). The table already takes it into account.","από οτιδήποτε: 3 σφυρίγματα, 3 λάμψεις, 3 φωτιές. Κράτα μπαταρία: χρησιμοποίησε το SOS όταν ακούς ή βλέπεις διασώστες.":"from anything: 3 whistles, 3 flashes, 3 fires. Save battery: use SOS when you hear or see rescuers.","Ανοίγε το κινητό 2 φορές τη μέρα σε σταθερή ώρα (π.χ. 9:00 και 21:00) για μηνύματα – συμφωνήστε το με την οικογένεια.":"Turn the phone on 2 times a day at a fixed time (e.g. 9:00 and 21:00) for messages – agree on it with your family.","Δείξε αυτή την οθόνη σε διασώστη. Βάλε τα ίδια και στο Ιατρικό ID του κινητού για να φαίνονται στην κλειδωμένη οθόνη.":"Show this screen to a rescuer. Put the same details in the phone's Medical ID so they show on the lock screen.","Η μαγνητική πυξίδα κάνει λάθη δίπλα σε αυτοκίνητο, σίδερα, καλώδια ή μέσα σε θήκη με μαγνήτη. Ο ήλιος δεν κάνει ποτέ.":"A magnetic compass is wrong next to a car, iron, cables or inside a case with a magnet. The sun never is.","Κενό. Γράφε τι έγινε, πότε ήπιες νερό, φάρμακα, πού πήγες. Βοηθάει γιατρούς και διασώστες και σε κρατάει ψύχραιμο.":"Empty. Write what happened, when you drank water, medicines, where you went. It helps doctors and rescuers and keeps you calm.","Βγάλε φωτογραφία όλη την οικογένεια (και τα κατοικίδια) πρόσφατα: αν χαθεί κάποιος, τη δείχνεις στους διασώστες.":"Take a recent photo of the whole family (and the pets): if someone gets lost, you show it to the rescuers.","Σε βουνό ή φαράγγι ο ήλιος «χάνεται» πίσω από την κορυφή πολύ πριν τη δύση. Λογάριασε ακόμα 30–60′ λιγότερο φως.":"In mountains or a gorge the sun «disappears» behind the ridge long before sunset. Count on 30–60′ less light.","στρέψε τον ωροδείκτη στον ήλιο. Η διχοτόμος ανάμεσα στον ωροδείκτη και το 12 (το 1 με θερινή ώρα) δείχνει Νότο.":"point the hour hand at the sun. The line halfway between the hour hand and 12 (1 in summer time) points South.","Ο Βορράς είναι πάνω. 🔵 εσύ · ⭐ σημεία · κίτρινη γραμμή η διαδρομή σου (για να γυρίσεις από τον ίδιο δρόμο).":"North is up. 🔵 you · ⭐ points · yellow line your route (to go back the same way).","Το φεγγάρι ανατέλλει κάθε μέρα ~50′ αργότερα. Αύξουσα: φαίνεται το απόγευμα–βράδυ. Φθίνουσα: τα ξημερώματα.":"The moon rises ~50′ later every day. Waxing: seen in the afternoon–evening. Waning: before dawn.","σημάδεψε την άκρη της σκιάς, περίμενε 15′, σημάδεψε ξανά. Η γραμμή από το 1ο στο 2ο σημάδι δείχνει Ανατολή.":"mark the tip of the shadow, wait 15′, mark it again. The line from the 1st to the 2nd mark points East.","όταν δεν έχει σήμα: το κινητό που ψάχνει κεραία αδειάζει γρήγορα. Το GPS δουλεύει και σε λειτουργία πτήσης.":"when there is no signal: a phone searching for a mast drains fast. GPS works in airplane mode too.","Αυτό το κινητό δεν επιτρέπει φακό από εφαρμογή web. Χρησιμοποίησε τον φακό του κινητού ή το «Φως οθόνης».":"This phone does not allow the flashlight from a web app. Use the phone's own flashlight or «Screen light».","φαρμακείο: 1434 (Αττική) ή ο Φαρμακευτικός Σύλλογος της περιοχής σου. Η εφαρμογή δεν ξέρει τις εφημερίες.":"pharmacy: 1434 (Attica) or the Pharmacists' Association of your area. The app does not know the duty rosters.","κράτα το κινητό και το powerbank μέσα στα ρούχα, κοντά στο σώμα. Στους 0°C η μπαταρία χάνει 20–40%.":"keep the phone and the powerbank inside your clothes, close to your body. At 0°C the battery loses 20–40%.","Καταγράφει κάθε δόνηση πάνω από το όριο με ώρα και ένταση: βλέπεις αν οι μετασεισμοί λιγοστεύουν.":"It records every shake above the threshold with time and strength: you can see if the aftershocks are getting fewer.","Μέτρα πόσες φορές ανεβαίνει το στήθος σε 30″ (μην το πεις στον ασθενή – αλλάζει την αναπνοή του).":"Count how many times the chest rises in 30″ (don't tell the patient – it changes their breathing).","ακούμπα το κινητό στο έδαφος (ή πάνω σε μπαστούνι στο έδαφος), με την πάνω άκρη προς την ανηφόρα.":"lay the phone on the ground (or on a stick on the ground), with its top edge pointing uphill.","σύγκρινε τη γωνία του ήλιου εδώ με αυτό που δείχνει η πυξίδα της εφαρμογής προς τον ήλιο. Διαφορά":"compare the sun's angle here with what the app's compass shows towards the sun. A difference","Το «📅 Ημερολόγιο» βάζει υπενθύμιση στο κινητό που χτυπάει ακόμα κι αν η εφαρμογή είναι κλειστή.":"«📅 Calendar» sets a reminder on the phone that rings even if the app is closed.","ένωσε τις δυο μύτες του μηνίσκου και συνέχισε τη γραμμή ως τον ορίζοντα – δείχνει περίπου Νότο.":"join the two tips of the crescent and continue the line down to the horizon – it points roughly South.","νοσοκομεία: 1434 ή 14944 (Αττική). Για επείγον: 166 (ΕΚΑΒ). Η εφαρμογή δεν ξέρει τις εφημερίες.":"hospitals: 1434 or 14944 (Attica). For an emergency: 166 (EKAB ambulance). The app does not know the duty rosters.","⛈️ Θύελλα / πολύ δυνατός άνεμος πλησιάζει. Βρες καταφύγιο ΤΩΡΑ, ασφάλισε σκάφος και πράγματα.":"⛈️ A storm / very strong wind is coming. Find shelter NOW, secure your boat and belongings.","Κανένα σημείο ακόμα. Πάτα «Αποθήκευσε αυτό το σημείο» όταν είσαι σπίτι, στο αυτοκίνητο κ.λπ.":"No points yet. Tap «Save this point» when you are at home, in the car, etc.","Οι οδηγίες δεν αντικαθιστούν το 112, τις επίσημες αρχές ή την εκπαίδευση σε πρώτες βοήθειες.":"These instructions do not replace 112, the official authorities or first aid training.","🌬️ Δυνατός άνεμος και μπόρες τις επόμενες ώρες. Μην ξεκινάς πορεία στο βουνό ή στη θάλασσα.":"🌬️ Strong wind and showers in the next hours. Don't set off on a mountain hike or out to sea.","απόλυτο σκοτάδι, καλύτερα αστέρια για προσανατολισμό (Πολικός). Μην κινείσαι χωρίς φακό.":"total darkness, best stars for finding your way (Pole Star). Don't move without a flashlight.","Αν σβήσεις τα δεδομένα του Safari ή διαγράψεις την εφαρμογή, σβήνονται και τα έγγραφα.":"If you clear Safari's data or delete the app, the documents are deleted too.","Η ένδειξη είναι στο ύψος όπου βρίσκομαι (station). Να γίνει αναγωγή στη θάλασσα (QNH).":"The reading is at my height (station). Convert it to sea level (QNH).","Μη σταματάς μέχρι να έρθει βοήθεια. Αν φέρουν απινιδωτή, άνοιξέ τον και άκου τι λέει.":"Don't stop until help arrives. If they bring a defibrillator, turn it on and listen to what it says.","αρκετό φως για να περπατήσεις χωρίς φακό σε ανοιχτό μέρος, αλλά σε βλέπουν κι εσένα.":"enough light to walk without a flashlight in an open place, but others can see you too.","iPhone 13–15 ≈ 3.200–4.400 mAh · Android ≈ 4.500–5.000 mAh. Οι απώλειες είναι ~35%.":"iPhone 13–15 ≈ 3,200–4,400 mAh · Android ≈ 4,500–5,000 mAh. Losses are ~35%.","Στρέψε το πάνελ κάθετα στον ήλιο, φόρτιζε πρώτα powerbank και από αυτό το κινητό.":"Point the panel straight at the sun, charge the powerbank first and the phone from it.","Κράτα τον φακό του κινητού μόνο για ανάγκη – πάρε κανονικό φακό με μπαταρίες AA.":"Keep the phone's flashlight only for need – take a real flashlight with AA batteries.","Νερό, ξύλα και κρεβάτι θέλουν φως. Στο σκοτάδι όλα γίνονται αργά και επικίνδυνα.":"Water, firewood and a bed need light. In the dark everything is slow and dangerous.","Το iPhone δεν δείχνει μπαταρία σε web εφαρμογές – δες την πάνω δεξιά στην οθόνη.":"iPhone does not show the battery to web apps – look at the top right of the screen.","⚠️ 30–45°: ζώνη χιονοστιβάδας σε χιόνι. Απόφυγε πλαγιές με χιόνι στη γωνία αυτή.":"⚠️ 30–45°: avalanche zone in snow. Avoid snowy slopes at this angle.","iPhone: Ρυθμίσεις → Απόρρητο → Υπηρεσίες τοποθεσίας → Safari → «Κατά τη χρήση».":"iPhone: Settings → Privacy → Location Services → Safari → «While Using».","Δεν κατέβηκε. Χρειάζεται internet. Δοκίμασε ξανά σε λίγο ή με μικρότερη ακτίνα.":"Not downloaded. Internet is needed. Try again in a while or with a smaller radius.","Ο ήχος κάνει ~3 δευτερόλεπτα το χιλιόμετρο. Μέτρα από τη λάμψη μέχρι τη βροντή.":"Sound travels ~3 seconds per kilometre. Count from the flash to the thunder.","Ο φακός δεν ελέγχεται σε αυτό το κινητό (π.χ. iPhone). Χρησιμοποιώ φως οθόνης.":"The flashlight can't be controlled on this phone (e.g. iPhone). Using screen light.","Όλα δουλεύουν χωρίς internet. Ό,τι χρησιμοποιεί αισθητήρες θέλει την εφαρμογή":"Everything works without internet. Anything that uses sensors needs the app","Η κόκκινη μύτη δείχνει πάντα Βορρά. Η λευκή γραμμή πάνω = προς τα πού κοιτάς.":"The red tip always points North. The white line at the top = where you are facing.","τραυματίες. Μην κλείνεις πρώτος. Τις επαφές σου τις γράφεις στην «Κάρτα μου».":"injured. Don't hang up first. You write your contacts in «My card».","νοσοκομείο, φαρμακείο, απινιδωτή, βρύση ή πηγή, χώρο συγκέντρωσης, καταφύγιο":"hospital, pharmacy, defibrillator, tap or spring, assembly point, shelter","περνάνε ακόμα και όταν το δίκτυο είναι πεσμένο και τρώνε λιγότερη ενέργεια.":"get through even when the network is down and use less power.","πιο κοντινό νοσοκομείο · φαρμακείο · απινιδωτής · νερό · χώρος συγκέντρωσης":"nearest hospital · pharmacy · defibrillator · water · assembly point","χωρίς internet. Αποθηκεύονται σε χαμηλή ανάλυση για να μη γεμίζει η μνήμη.":"without internet. They are saved in low resolution so the memory does not fill up.","Δεν άναψε ο φακός. Χρησιμοποίησε τον φακό του κινητού ή το «Φως οθόνης».":"The flashlight didn't turn on. Use the phone's own flashlight or «Screen light».","Η συσκευή δεν δίνει πυξίδα (π.χ. υπολογιστής). Το GPS δουλεύει κανονικά.":"This device has no compass (e.g. a computer). GPS works normally.","Δουλεύει χωρίς internet. Τα δεδομένα σου μένουν μόνο σε αυτό το κινητό.":"Works without internet. Your data stays only on this phone.","Δεν βγήκε καθαρό σήμα. Δοκίμασε με περισσότερο φως ή μέτρα με το χέρι.":"No clear signal. Try with more light or count by hand.","Κάτω από 10 km (30″): ΜΠΕΣ ΜΕΣΑ ΤΩΡΑ – σε κτίριο ή κλειστό αυτοκίνητο.":"Under 10 km (30″): GO INSIDE NOW – into a building or a closed car.","Πιάσε σφυγμό στον καρπό ή στον λαιμό και πάτα το κουμπί σε κάθε χτύπο.":"Find the pulse at the wrist or the neck and tap the button at each beat.","Φόρτιζε όταν έχεις ευκαιρία (αυτοκίνητο, ηλιακό πάνελ), μέχρι 80–100%.":"Charge whenever you can (car, solar panel), up to 80–100%.","Ώρα Ελλάδας (με τη θερινή ώρα). Πάτα έναν μήνα για να δεις κάθε μέρα.":"Greek time (with summer time). Tap a month to see every day.","φύλακας πτώσης · check-in · παλμοί · σεισμογράφος · σελήνη · έγγραφα…":"fall guard · check-in · pulse · seismograph · moon · documents…","όχι σε τραπέζι ή κρεβάτι), με την οθόνη πάνω, και μην περπατάς δίπλα.":"not on a table or bed), screen up, and don't walk next to it.","Λιγότερο από 2 ώρες φως! Στήσε τώρα καταφύγιο, μάζεψε νερό και ξύλα.":"Less than 2 hours of light! Set up shelter now, collect water and firewood.","Νερό από πηγή ή βρύση στη φύση: βράσε ή φιλτράρισέ το πριν το πιεις.":"Water from a spring or tap in nature: boil or filter it before you drink it.","iPhone: Ρυθμίσεις → Μπαταρία) / Εξοικονόμηση ενέργειας (Android).":"iPhone: Settings → Battery) / Battery saver (Android).","Καμία ένδειξη ακόμα. Κατέγραφε κάθε 1–3 ώρες για να φανεί η τάση.":"No readings yet. Record every 1–3 hours to see the trend.","Παλάμη στο ΚΕΝΤΡΟ του στήθους, το άλλο χέρι από πάνω, χέρια ίσια.":"Palm on the CENTRE of the chest, the other hand on top, arms straight.","Δεν βρέθηκε ακόμα θέση. Βγες σε ανοιχτό χώρο με θέα στον ουρανό.":"No position found yet. Go to an open place with a view of the sky.","Το GPS δεν έδωσε ακόμα υψόμετρο – περίμενε λίγο σε ανοιχτό χώρο.":"GPS has not given an altitude yet – wait a little in an open place.","Κλείσε Bluetooth, Wi-Fi, ανανέωση στο παρασκήνιο, ειδοποιήσεις.":"Turn off Bluetooth, Wi-Fi, background refresh, notifications.","International Code of Signals – ισχύουν διεθνώς στη θάλασσα.":"International Code of Signals – valid worldwide at sea.","μετά από χαμηλό: καθαρίζει, αλλά δυνατός και ριπαίος άνεμος.":"after a low: clearing, but strong and gusty wind.","50 με ζάλη, ιδρώτα, πόνο στο στήθος ή λιποθυμία, ή αναπνοές":"50 with dizziness, sweating, chest pain or fainting, or breaths","Χρειάζεται δεύτερη ένδειξη τουλάχιστον 1 ώρα μετά για τάση.":"A second reading at least 1 hour later is needed for a trend.","Δεν δόθηκε άδεια τοποθεσίας. Διάλεξε την πιο κοντινή πόλη.":"Location permission not given. Choose the nearest city.","Αν δεν πατήσεις, ετοιμάζεται SMS βοήθειας με τη θέση σου.":"If you don't tap, a help SMS with your position is prepared.","Πάτα «Ενεργοποίηση πυξίδας» και κράτα το κινητό οριζόντια":"Tap «Turn on compass» and hold the phone flat","Πάτα οποιοδήποτε γράμμα στους πίνακες για να το ακούσεις.":"Tap any letter in the tables to hear it.","Πρόσθεσε 50% νερό σε καύσωνα, για θηλάζουσες ή αρρώστους.":"Add 50% water in a heatwave, for breastfeeding mothers or sick people.","π.χ. Ανάβαση Πάρνηθα από Μόλα, 2 άτομα, μπλε Land Cruiser":"e.g. Climbing Parnitha from Mola, 2 people, blue Land Cruiser","⚠️ Σκέπασε καλά την κάμερα με το δάχτυλο, με φως από πίσω":"⚠️ Cover the camera well with your finger, with light behind it","Φωτεινότητα στο ελάχιστο, σκοτεινή εμφάνιση (dark mode).":"Brightness to minimum, dark appearance (dark mode).","Φακός αναμμένος. Πάτα ξανά «Φακός κινητού» για σβήσιμο.":"Flashlight on. Tap «Phone flashlight» again to turn it off.","🌬️ Καθαρίζει, αλλά δυνατός και ριπαίος άνεμος για λίγο.":"🌬️ Clearing, but strong and gusty wind for a while.","Ακολούθα το κίτρινο βέλος. Απόσταση σε ευθεία γραμμή.":"Follow the yellow arrow. Distance in a straight line.","Αποτέλεσμα (ενδεικτικό, ±10). Επιβεβαίωσε με το χέρι.":"Result (approximate, ±10). Check by hand.","Σημείωση (πάτα το 🎤 του πληκτρολογίου για υπαγόρευση)":"Note (tap the keyboard's 🎤 to dictate)","Συμπλήρωσε ό,τι θέλεις. Μένει μόνο σε αυτό το κινητό.":"Fill in whatever you want. It stays only on this phone.","Συντεταγμένες σε δεκαδικό (π.χ. 37.97510, 23.73480):":"Coordinates in decimal (e.g. 37.97510, 23.73480):","⏳ Περιμένω GPS – απόσταση από το κέντρο της περιοχής":"⏳ Waiting for GPS – distance from the centre of the area","1–3,5 hPa): πιθανή επιδείνωση, βροχή σε 12–24 ώρες.":"1–3.5 hPa): weather may get worse, rain in 12–24 hours.","Επαφές έκτακτης ανάγκης (μία ανά γραμμή: Όνομα 69…)":"Emergency contacts (one per line: Name 69…)","πάνω από 6 hPa): θύελλα πλησιάζει – καταφύγιο τώρα!":"over 6 hPa): a storm is coming – take shelter now!","25°: τα περισσότερα 4×4 κινδυνεύουν να ανατραπούν.":"25°: most 4×4s are at risk of rolling over.","8: κάλεσε 112. Αν δεν αναπνέει φυσιολογικά: ΚΑΡΠΑ.":"8: call 112. If not breathing normally: CPR.","Όνομα σημείου (π.χ. Σπίτι, Αυτοκίνητο, Συνάντηση):":"Point name (e.g. Home, Car, Meeting point):","⚓ Μονογραμματικά σήματα ICS (με φως, ήχο ή σημαία)":"⚓ ICS single-letter signals (by light, sound or flag)","3,6–6 hPa): δυνατός άνεμος, μπόρες σε λίγες ώρες.":"3.6–6 hPa): strong wind, showers within a few hours.","Το σκάφος μου είναι υγιές – ζητώ ελεύθερη πρατική":"My vessel is healthy – I request free pratique","Καλημέρα / Καλό απόγευμα / Καλησπέρα / Καληνύχτα":"Good morning / Good afternoon / Good evening / Good night","Πάνω από 2 λεπτά – μάλλον ξέχασες. Ξαναδοκίμασε.":"Over 2 minutes – you probably forgot. Try again.","Παιδί 1–10 ετών: σφυγμός 70–130, αναπνοές 20–30.":"Child 1–10 years: pulse 70–130, breaths 20–30.","Δεν βρέθηκε θέση. Δι
