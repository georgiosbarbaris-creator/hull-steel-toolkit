Δύση":"Sunset","Μέρα":"Day","Πίσω":"Back","Ποτέ":"Never","Τελ.":"Last","Τώρα":"Now","Φάση":"Phase","Χίος":"Chios","δεξί":"right","προς":"towards","ρολά":"rolls","τεμ.":"pcs","ύψος":"altitude","ώρες":"hours",". Ο":". The","ΑΒΑ":"ENE","ΑΝΑ":"ESE","Β ▲":"N ▲","ΒΒΑ":"NNE","ΒΒΔ":"NNW","ΔΒΔ":"WNW","ΔΝΔ":"WSW","Εδώ":"Here","Και":"And","ΝΝΑ":"SSE","ΝΝΔ":"SSW","ΠΟΥ":"WHERE","Πού":"Where","ΤΕΠ":"ER","Φως":"Light","από":"of","και":"and","σου":"of you","φως":"light","ώρα":"hour","ΒΑ":"NE","ΒΔ":"NW","ΝΑ":"SE","ΝΔ":"SW","ΤΙ":"WHAT","σε":"in","bitchat: iPhone (App Store) και Android (επίσημα από τη σελίδα GitHub «permissionlesstech/bitchat-android»). iPhone και Android μιλάνε μεταξύ τους. Χωρίς λογαριασμό, χωρίς αριθμό τηλεφώνου. Νέα εφαρμογή, χωρίς ανεξάρτητο έλεγχο ασφαλείας ακόμα.":"bitchat: iPhone (App Store) and Android (official, from the GitHub page «permissionlesstech/bitchat-android»). iPhone and Android talk to each other. No account, no phone number. New app, no independent security audit yet.","Πολλά νεότερα κινητά (π.χ. iPhone 14 και μετά, κάποια Android) έχουν «SOS μέσω δορυφόρου». Δεν είναι διαθέσιμο σε όλες τις χώρες – κοίτα στις Ρυθμίσεις του κινητού σου αν υπάρχει στην Ελλάδα και κάνε τη δοκιμή (demo) από τώρα.":"Many newer phones (e.g. iPhone 14 and later, some Android) have «SOS via satellite». It is not available in every country – check your phone's Settings to see if it works in Greece, and try the demo now.","Οικογενειακό κανάλι: Channels → πρόσθεσε κανάλι (π.χ. «Οικογένεια») με τυχαίο κλειδί → Share/QR. Οι άλλοι το σκανάρουν από την εφαρμογή τους. Κράτα και το προεπιλεγμένο (LongFast) για να μιλάς με άλλους χρήστες στην περιοχή.":"Family channel: Channels → add a channel (e.g. «Family») with a random key → Share/QR. The others scan it from their app. Keep the default one (LongFast) too, to talk with other users in the area.","Briar: μόνο Android (Google Play / F-Droid). Πολύ ασφαλής, Bluetooth + Wi-Fi χωρίς internet. Προσθέτεις επαφές πρόσωπο με πρόσωπο με QR. Το έργο πλέον κάνει μόνο διορθώσεις, όχι νέες λειτουργίες – δουλεύει κανονικά.":"Briar: Android only (Google Play / F-Droid). Very secure, Bluetooth + Wi-Fi with no internet. You add contacts face to face with QR. The project now only makes fixes, no new features – it works fine.","Πολλά χρονόμετρα τρέχουν μαζί και θυμούνται την ώρα ακόμα κι αν κλείσεις την εφαρμογή. Όταν τελειώσει κάποιο, χτυπάει και δονείται – αλλά μόνο με την εφαρμογή ανοιχτή. Για κάτι κρίσιμο βάλε ΚΑΙ ξυπνητήρι στο κινητό.":"Many timers run together and remember the time even if you close the app. When one finishes, it rings and vibrates – but only with the app open. For something critical, ALSO set an alarm on your phone.","Μικρό ραδιοπομπό (LoRa, 868 MHz στην Ευρώπη) που ζευγαρώνει με το κινητό σου μέσω Bluetooth. Γράφεις στην εφαρμογή Meshtastic και το μήνυμα φεύγει με ραδιοκύματα – όχι από κεραίες κινητής.":"A small radio transmitter (LoRa, 868 MHz in Europe) that pairs with your phone over Bluetooth. You type in the Meshtastic app and the message goes by radio waves – not through mobile masts.","Στέλνουν μηνύματα από κινητό σε κινητό με Bluetooth (και Wi-Fi), χωρίς internet και χωρίς σήμα. Τα μηνύματα «πηδάνε» από κινητό σε κινητό μέσω όσων έχουν την ίδια εφαρμογή (mesh).":"They send messages from phone to phone over Bluetooth (and Wi-Fi), with no internet and no signal. Messages «hop» from phone to phone through everyone who has the same app (mesh).","Το κουμπί πανικού της εφαρμογής θέλει 1 πάτημα «Αποστολή». Το SOS του ίδιου του κινητού στέλνει ΜΟΝΟ ΤΟΥ, ακόμα και με κλειδωμένη οθόνη, μέσα από την τσέπη. Ρύθμισέ το και τα δύο.":"The app's panic button needs 1 tap on «Send». The phone's own SOS sends BY ITSELF, even with the screen locked, from inside your pocket. Set up both.","Ρυθμίσεις → SOS έκτακτης ανάγκης: άνοιξε «Κλήση με πάτημα 5 φορές» (ή κράτημα πλαϊνού + έντασης). Καλεί 112 και μετά στέλνει μόνο του SMS με τη θέση στις επαφές έκτακτης ανάγκης.":"Settings → Emergency SOS: turn on «Call with 5 presses» (or hold side + volume button). It calls 112 and then sends an SMS with your location to your emergency contacts by itself.","Εμβέλεια: 1–3 km σε πόλη, 5–15 km στο ανοιχτό, πολύ περισσότερο από κορυφή σε κορυφή. Κάθε άλλη συσκευή Meshtastic ενδιάμεσα αναμεταδίδει (mesh), οπότε φτάνει και πιο μακριά.":"Range: 1–3 km in a city, 5–15 km in open country, much more from hilltop to hilltop. Every other Meshtastic device in between relays the message (mesh), so it reaches even further.","Ακόμα καλύτερα: ένα μικρό φορητό router μπαταρίας (travel router) ή το Wi-Fi του αυτοκινήτου. Τότε και τα δύο κινητά είναι απλοί «πελάτες» και η σύνδεση πιάνει πιο σίγουρα.":"Even better: a small battery travel router or the car's Wi-Fi. Then both phones are simple «clients» and the connection is more reliable.","Πήγαινε σε νοσοκομείο, ακόμα κι αν δεν πονάς. Σε σεξουαλική επίθεση, αν μπορείς μην πλυθείς και μην αλλάξεις ρούχα πριν την εξέταση – κράτα τα ρούχα σε χάρτινη σακούλα.":"Go to a hospital, even if you feel no pain. After a sexual assault, if you can, do not wash or change clothes before the examination – keep the clothes in a paper bag.","Κράτα το κινητό ίσια μπροστά σου. Το πράσινο βέλος δείχνει πού να πας. Όταν φτάσεις κοντά σε κάθε σημείο, περνάει μόνο του στο επόμενο, μέχρι την αρχή της διαδρομής.":"Hold the phone flat in front of you. The green arrow shows where to go. When you get close to each point, it moves on to the next by itself, all the way to the start of the route.","Ρυθμίσεις → Προσβασιμότητα → Αφή → Πάτημα πίσω πλευράς → Τριπλό πάτημα → διάλεξε αυτή τη συντόμευση. Τώρα 3 χτυπήματα στην πλάτη του κινητού = SMS με θέση, κρυφά.":"Settings → Accessibility → Touch → Back Tap → Triple Tap → choose this shortcut. Now 3 taps on the back of the phone = SMS with location, secretly.","Πάτα ΤΩΡΑ «Κατέγραφε» πριν ξεκινήσεις να περπατάς (στο βουνό, στο δάσος, μέσα σε καπνό ή σκοτάδι). Μετά από εδώ σε γυρίζει πίσω από τον ίδιο δρόμο, βήμα βήμα.":"Tap «Record» NOW, before you start walking (on a mountain, in a forest, in smoke or darkness). Later, from here it takes you back the same way, step by step.","Ρυθμίσεις → Ασφάλεια και έκτακτη ανάγκη → SOS έκτακτης ανάγκης: πάτημα 5 φορές το κουμπί λειτουργίας → κλήση 112, κοινοποίηση τοποθεσίας στις επαφές, βίντεο.":"Settings → Safety and emergency → Emergency SOS: press the power button 5 times → call 112, share location with contacts, video.","Η καταγραφή δουλεύει χωρίς internet. Κράτα την εφαρμογή ανοιχτή και την οθόνη αναμμένη (ή σε ανοιχτή τσέπη), γιατί με κλειδωμένο κινητό το GPS σταματάει.":"Recording works without internet. Keep the app open and the screen on (or in an open pocket), because with the phone locked the GPS stops.","Ο άλλος στέλνει Morse με φως (οθόνη ή φακό) από την εφαρμογή ή με οποιονδήποτε φακό. Εσύ στοχεύεις την κάμερα στο φως και η εφαρμογή γράφει τα γράμματα.":"The other person sends Morse with light (screen or flashlight) from the app or with any flashlight. You point the camera at the light and the app writes the letters.","iPhone: σκάναρε με την κανονική Κάμερα → ανοίγει το Safari με το σχέδιο → πάτα «Αντιγραφή» και επικόλλησέ το εδώ, μέσα στην εφαρμογή στην αρχική οθόνη.":"iPhone: scan with the normal Camera → Safari opens with the plan → tap «Copy» and paste it here, inside the app on the home screen.","Αθόρυβο SMS (χωρίς κλήση): Συντομεύσεις → + → «Λήψη τρέχουσας τοποθεσίας» → «Αποστολή μηνύματος» (κείμενο «ΚΙΝΔΥΝΕΥΩ» + τοποθεσία) προς τη μαμά. Τρέξ\\":"Silent SMS (no call): Shortcuts → + → «Get Current Location» → «Send Message» (text «I'M IN DANGER» + location) to Mum. Run","Άνοιξε Bluetooth → στην εφαρμογή πάτα + / σύνδεση συσκευής → διάλεξε τη δική σου. PIN: δείχνεται στην οθόνη της· αν δεν έχει οθόνη, συνήθως 123456.":"Turn on Bluetooth → in the app tap + / connect device → choose yours. PIN: shown on its screen; if it has no screen, usually 123456.","SenseCAP T1000-E (Seeed): μέγεθος πιστωτικής κάρτας, αδιάβροχη IP65, με GPS και μπαταρία. Η πιο εύκολη – ανοίγεις και δουλεύει. Περίπου 40–60 €.":"SenseCAP T1000-E (Seeed): credit-card size, waterproof IP65, with GPS and battery. The easiest – switch on and it works. About 40–60 €.","Ησυχία γύρω. Ο αποστολέας να διαλέξει το ίδιο: κανονικά ή 🐢 αργά (τα πιάνει και τα δύο). Το κινητό πρέπει να μείνει ανοιχτό σε αυτή την οθόνη.":"Quiet around you. The sender must pick the same: normal or 🐢 slow (it hears both). The phone must stay open on this screen.","Έτοιμη τσάντα κρυμμένη ή σε φίλη: ταυτότητα, κάρτες, κλειδιά, φάρμακα, φορτιστής, λίγα μετρητά. Φωτογραφίες εγγράφων στο 📄 «Τα έγγραφά μου».":"A ready bag, hidden or at a friend's: ID, cards, keys, medicines, charger, a little cash. Photos of documents in 📄 «My documents».","Συμφωνήστε από πριν: ποιος κάνει τι, πού συναντιέστε, ποια ώρα ανοίγετε τα κινητά (π.χ. κάθε ώρα στο :00 για 10 λεπτά – κρατάει μπαταρία).":"Agree in advance: who does what, where you meet, what time you switch on your phones (e.g. every hour at :00 for 10 minutes – saves battery).","Πόσο θα κάνεις να φτάσεις; Αν δεν πατήσεις «✅ Έφτασα» μέχρι τότε, χτυπάει συναγερμός και μετά ανοίγει SMS με τη θέση σου στις επαφές σου.":"How long will it take you to get there? If you don't tap «✅ I've arrived» by then, an alarm rings and then an SMS with your location opens for your contacts.","Καλύτερα να κάνει hotspot ένα Android. Στο iPhone το «Προσωπικό hotspot» συχνά δεν ανοίγει χωρίς ενεργή κάρτα SIM με πακέτο δεδομένων.":"Better if an Android makes the hotspot. On iPhone, «Personal Hotspot» often won't turn on without an active SIM card with a data plan.","Το παιδί πρέπει να ξέρει απέξω ένα τηλέφωνο γονιού και να έχει γραμμένο χαρτάκι στην τσέπη – το κινητό μπορεί να πέσει ή να το πάρουν.":"The child should know a parent's phone number by heart and have it written on a note in their pocket – the phone can be dropped or taken.","Τα σημεία προστίθενται στα δικά σου. Τα στοιχεία του σχεδίου αντικαθιστούν όσα έχεις στα ίδια πεδία (τα ιατρικά σου δεν αλλάζουν).":"The points are added to yours. The plan's details replace what you have in the same fields (your medical info does not change).","Φώναξε δυνατά και συγκεκριμένα: «ΒΟΗΘΕΙΑ! ΔΕΝ ΤΟΝ ΞΕΡΩ! ΚΑΛΕΣΤΕ 100!». Δείξε έναν άνθρωπο: «Εσύ με το μπλε μπουφάν – κάλεσε 100!».":"Shout loudly and clearly: «HELP! I DON'T KNOW HIM! CALL 100!». Point at one person: «You in the blue jacket – call 100!».","Χρήσιμο σε πλοήγηση, χρονόμετρα, ΚΑΡΠΑ, SOS. Η αναμμένη οθόνη τρώει μπαταρία – χαμήλωσε τη φωτεινότητα ή βάλε την 🌙 κόκκινη οθόνη.":"Useful for navigation, timers, CPR, SOS. A screen that stays on uses battery – lower the brightness or use the 🌙 red screen.","Android: Ρυθμίσεις → Συνδέσεις (ή Δίκτυο) → Σημείο πρόσβασης κινητής → Σημείο πρόσβασης Wi-Fi. Βάλε όνομα και κωδικό, άνοιξέ το.":"Android: Settings → Connections (or Network) → Mobile Hotspot → Wi-Fi hotspot. Set a name and password, turn it on.","Ο άλλος σκανάρει το QR με την κάμερα του κινητού του και παίρνει το οικογενειακό σας σχέδιο (και την εφαρμογή, αν δεν την έχει).":"The other person scans the QR with their phone camera and gets your family plan (and the app, if they don't have it).","Το άλλο κινητό: Wi-Fi → διάλεξε αυτό το δίκτυο → κωδικός. Αν πει «Χωρίς internet – να μείνω συνδεδεμένος;», πάτα ΝΑΙ / Παραμονή.":"The other phone: Wi-Fi → choose this network → password. If it says «No internet – stay connected?», tap YES / Stay.","Σε Android κλείσε την «αυτόματη αλλαγή σε δεδομένα κινητής» (Έξυπνη εναλλαγή / Adaptive Wi-Fi), για να μη φεύγει από το Wi-Fi.":"On Android turn off «switch to mobile data automatically» (Smart switch / Adaptive Wi-Fi), so it doesn't leave the Wi-Fi.","Μετράει από τη στιγμή που μπήκε. Γράψε «Τ» και την ώρα στον επίδεσμο ή στο μέτωπο. ΜΗΝ τον χαλαρώσεις – πες την ώρα στο ΕΚΑΒ.":"It counts from the moment it went on. Write «T» and the time on the bandage or on the forehead. DO NOT loosen it – tell the time to EKAB ambulance.","Μοιράσου τη ζωντανή τοποθεσία σου με ένα άτομο εμπιστοσύνης (Εύρεση στο iPhone ή Κοινοποίηση τοποθεσίας στους Χάρτες Google).":"Share your live location with one person you trust (Find My on iPhone or Location sharing in Google Maps).","Το SMS περνάει συχνά εκεί που οι κλήσεις δεν περνούν. Αν δεν φύγει αμέσως, το κινητό το ξαναστέλνει μόνο του μόλις βρει σήμα.":"SMS often gets through where calls don't. If it doesn't go at once, the phone resends it by itself as soon as it finds a signal.","Δοκιμή: λειτουργία πτήσης + άνοιξε ξανά Bluetooth (και Wi-Fi). Στείλτε μήνυμα από δωμάτιο σε δωμάτιο και μετά από τον δρόμο.":"Test: airplane mode + turn Bluetooth (and Wi-Fi) back on. Send a message from room to room and then from the street.","Δύο κινητά με την Επιβίωση 72+. Το ένα κάνει «Hotspot» (σημείο πρόσβασης Wi-Fi). Δεν χρειάζονται δεδομένα, σήμα ή internet.":"Two phones with Survival 72+. One makes a «Hotspot» (Wi-Fi access point). No data, signal or internet needed.","Στην κρίση: Bluetooth ανοιχτό, εφαρμογή ανοιχτή στην οθόνη (το iPhone την «κοιμίζει» στο παρασκήνιο), φορτιστής/powerbank.":"In a crisis: Bluetooth on, app open on the screen (iPhone «puts it to sleep» in the background), charger/powerbank.","Bridgefy: iPhone και Android, Bluetooth mesh. Γνωστή από διαδηλώσεις και συναυλίες. Για απλά μηνύματα, όχι για ευαίσθητα.":"Bridgefy: iPhone and Android, Bluetooth mesh. Known from protests and concerts. For simple messages, not for sensitive ones.","Το iPhone πρέπει να έχει την εφαρμογή ανοιχτή στην οθόνη – αν κλειδώσει, η σύνδεση μπορεί να κοπεί. Ξανασυνδεθείτε (30″).":"The iPhone must have the app open on the screen – if it locks, the connection may drop. Reconnect (30″).","Heltec LoRa 32 V4: η φθηνότερη (περίπου 25–40 €), αλλά είναι γυμνή πλακέτα – θέλει κουτί, μπαταρία και λίγο «μαστόρεμα».":"Heltec LoRa 32 V4: the cheapest (about 25–40 €), but it is a bare board – it needs a case, a battery and a little «tinkering».","Μια συσκευή μόνιμα ψηλά (ταράτσα ή αυτοκίνητο σε ύψωμα) με powerbank/ηλιακό γίνεται αναμεταδότης για όλη την οικογένεια.":"One device kept up high (rooftop or a car on high ground) with a powerbank/solar panel becomes a relay for the whole family.","Πρόσθεσε παραλήπτες. Διάλεξε πόσες φορές πατάς το πλαϊνό κουμπί (3 ή 4). Μπορεί να στέλνει και φωτογραφίες + ηχογράφηση.":"Add recipients. Choose how many times you press the side button (3 or 4). It can also send photos + an audio recording.","Δουλεύει σε iPhone και Android, χωρίς internet. Αν η κάμερα δεν «πιάνει», ο άλλος να ανεβάσει τη φωτεινότητα στο τέρμα.":"Works on iPhone and Android, with no internet. If the camera doesn't «catch» it, the other person should turn brightness all the way up.","Εμβέλεια: 30–50 m, στο ανοιχτό και ψηλά περισσότερο. Τοίχοι από μπετό τη μικραίνουν. Το hotspot τρώει μπαταρία – κλείσ\\":"Range: 30–50 m, more in the open and up high. Concrete walls make it shorter. The hotspot uses battery – turn","Πάρε έκδοση 868 MHz (Ευρώπη), ΟΧΙ 915 MHz (Αμερική). Στο T1000-E διάλεξε την έκδοση «for Meshtastic», όχι τη LoRaWAN.":"Get the 868 MHz version (Europe), NOT 915 MHz (America). For the T1000-E choose the «for Meshtastic» version, not LoRaWAN.","Πήγαινε σε ασφαλές μέρος και κάλεσε 100. Στο 15900 βρίσκεις στήριξη, χωρίς να είσαι υποχρεωμένη να κάνεις καταγγελία.":"Go to a safe place and call 100. At 15900 you get support, without having to file a complaint.","Όσο πιο ψηλά, τόσο πιο μακριά: σε μπαλκόνι, ταράτσα, λόφο, κεραία κάθετα. Το σώμα και τα αυτοκίνητα κόβουν το σήμα.":"The higher, the further: on a balcony, rooftop, hill, antenna upright. Bodies and cars block the signal.","Το κινητό ανοίγει το SMS έτοιμο – εσύ πατάς «Αποστολή». Καμία εφαρμογή web δεν επιτρέπεται να στείλει SMS μόνη της.":"The phone opens the SMS ready – you tap «Send». No web app is allowed to send an SMS by itself.","Αντιγράφηκε. Άνοιξε την εφαρμογή «Επιβίωση 72+» από την αρχική οθόνη → Εργαλεία → Μοίρασε το σχέδιο → επικόλληση.":"Copied. Open the «Survival 72+» app from the home screen → Tools → Share the plan → paste.","Μην μπεις ΠΟΤΕ σε αυτοκίνητο ή σε δεύτερο χώρο με τον επιτιθέμενο. Η μεταφορά αλλού είναι ο μεγαλύτερος κίνδυνος.":"NEVER get into a car or go to a second place with the attacker. Being moved somewhere else is the biggest danger.","Ο 🅱️ δείχνει τον κωδικό 2 (απάντηση). Ο 🅰️ πατάει «Σκάναρε την απάντηση». Σε λίγα δευτερόλεπτα ανοίγει το chat 🟢.":"🅱️ shows code 2 (the answer). 🅰️ taps «Scan the answer». In a few seconds the chat opens 🟢.","Ενεργοποίησε το αυτόματο SOS του κινητού (5 πατήματα / τριπλό χτύπημα στην πλάτη). Δες τον οδηγό «Αυτόματο SOS».":"Turn on your phone's automatic SOS (5 presses / triple tap on the back). See the guide «Automatic SOS».","Η εφαρμογή «🌤️ Γρήγορη έξοδος» κρύβει τα πάντα πίσω από καιρό. Κράτα πατημένη τη θερμοκρασία 2″ για να γυρίσεις.":"The «🌤️ Quick exit» hides everything behind a weather screen. Hold the temperature for 2″ to come back.","Μάθε στο παιδί: «Αν φοβηθείς, πάτα το κουμπί 5 φορές / χτύπα την πλάτη 3 φορές, μετά φώναξε και τρέξε σε κόσμο.»":"Teach the child: «If you're scared, press the button 5 times / tap the back 3 times, then shout and run to people.»","Πολύς κόσμος γύρω με κινητά (πόλη, συναυλία, καταυλισμός) → 📲 bitchat / Briar (Bluetooth από κινητό σε κινητό).":"Lots of people around with phones (city, concert, camp) → 📲 bitchat / Briar (Bluetooth from phone to phone).","Κράτα κλειδιά/κινητό στο χέρι, μακριά από ακουστικά στα αυτιά τη νύχτα. Περπάτα εκεί που έχει φως και κόσμο.":"Keep keys/phone in your hand, no headphones in your ears at night. Walk where there is light and people.","Κράτα τα πάντα: ηχογράφηση (📓 Ημερολόγιο), μηνύματα, φωτογραφίες τραυμάτων με ημερομηνία, ονόματα μαρτύρων.":"Keep everything: audio recordings (📓 Log), messages, dated photos of injuries, names of witnesses.","Ρυθμίσεις → Ασφάλεια και έκτακτη ανάγκη (σε παλιά: Προηγμένες λειτουργίες) → Αποστολή μηνυμάτων SOS → ΝΑΙ.":"Settings → Safety and emergency (on older phones: Advanced features) → Send SOS messages → ON.","Ο ένας πατάει 🅰️ «Ξεκινάω εγώ» και δείχνει τον κωδικό 1. Ο άλλος πατάει 🅱️ «Συνδέομαι» και τον σκανάρει.":"One taps 🅰️ «I'll start» and shows code 1. The other taps 🅱️ «Join» and scans it.","🚶‍♀️ «Συνόδευσέ με σπίτι» πριν ξεκινήσεις. Αν δεν πατήσεις «Έφτασα», οι δικοί σου παίρνουν τη θέση σου.":"🚶‍♀️ «Walk me home» before you set off. If you don't tap «I've arrived», your people get your location.","και το Wi-Fi στο hotspot. Αν κλειδώσει η οθόνη, η σύνδεση μπορεί να κοπεί – τότε ξανασυνδεθείτε (30″).":"and Wi-Fi on the hotspot. If the screen locks, the connection may drop – then reconnect (30″).","Εμβέλεια περίπου 10–100 m ανά κινητό. Σε γεμάτη πόλη φτάνει πιο μακριά, γιατί αναμεταδίδουν οι άλλοι.":"Range about 10–100 m per phone. In a crowded city it reaches further, because the others relay it.","Κράτα πατημένο το 🆘 1″ (αθόρυβο SOS) ή το αυτόματο SOS του κινητού. Η ηχογράφηση γράφει ό,τι λέγεται.":"Hold 🆘 for 1″ (silent SOS) or use the phone's automatic SOS. The recording captures everything that is said.","Υπάρχει λίγο σήμα κινητής αλλά όχι internet → ✉️ SMS με τη θέση σου. Το 112 δουλεύει από κάθε δίκτυο.":"There is a little mobile signal but no internet → ✉️ SMS with your location. 112 works on any network.","Η κάμερα χρειάζεται για το σκανάρισμα. Εμβέλεια 30–50 m (στο ανοιχτό περισσότερο). Δείτε τον οδηγό":"The camera is needed for scanning. Range 30–50 m (more in the open). See the guide","Οικογένεια με iPhone ΚΑΙ Android → bitchat. Όλοι με Android → Briar. Για χιλιόμετρα → Meshtastic.":"Family with iPhone AND Android → bitchat. Everyone on Android → Briar. For kilometres → Meshtastic.","Κείμενο, ✅ Είμαι καλά, 📍 Η θέση μου (ο άλλος πατάει και η πυξίδα τον οδηγεί σε σένα), 📣 Έλα εδώ.":"Text, ✅ I'm OK, 📍 My location (the other person taps it and the compass guides them to you), 📣 Come here.","15900: 24ώρη, δωρεάν, εμπιστευτική γραμμή. Σε συνδέει με ξενώνες φιλοξενίας και νομική βοήθεια.":"15900: 24-hour, free, confidential line. It connects you with shelters and legal help.","Briar: προσθέστε ο ένας τον άλλον με QR, ενώ είστε μαζί. Δεν γίνεται από μακριά χωρίς internet.":"Briar: add each other with QR while you are together. It can't be done from far away without internet.","Αν σε πιάσει: χτύπα σε μάτια, μύτη, λαιμό, γόνατο, βουβωνική χώρα – και τρέξε μόλις χαλαρώσει.":"If he grabs you: hit the eyes, nose, throat, knee, groin – and run as soon as his grip loosens.","Συμφώνησε με τους δικούς σου την ΚΡΥΦΗ ΦΡΑΣΗ και τι σημαίνει (π.χ. «έλα τώρα» ή «κάλεσε 100»).":"Agree with your people on the CODE PHRASE and what it means (e.g. «come now» or «call 100»).","Συσκευή με βιδωτή κεραία (π.χ. Heltec): ΠΟΤΕ μην την ανάψεις χωρίς κεραία – καίγεται ο πομπός.":"Device with a screw-on antenna (e.g. Heltec): NEVER switch it on without the antenna – the transmitter burns out.","Συμφωνήστε ώρες επικοινωνίας και ένα απλό σύστημα: «ΟΚ» = όλα καλά, «ΒΟΗΘΕΙΑ + θέση» = ελάτε.":"Agree on contact times and a simple system: «OK» = all fine, «HELP + location» = come.","Ρυθμίσεις → Υγεία (εφαρμογή Υγεία) → Ιατρικό ID → Επαφές έκτακτης ανάγκης: βάλε μαμά/μπαμπά.":"Settings → Health (Health app) → Medical ID → Emergency contacts: add mum/dad.","Χιλιόμετρα μακριά, χωρίς κανένα δίκτυο → 📻 Meshtastic (θέλει συσκευή – αγόρασέ τη από τώρα).":"Kilometres away, with no network at all → 📻 Meshtastic (needs a device – buy it now).","ΔΟΚΙΜΗ μαζί με το παιδί (στο Samsung/συντόμευση δεν καλεί 112 – στο iPhone «SOS» ΚΑΛΕΙ, γι\\":"TEST it together with the child (on Samsung/the shortcut it doesn't call 112 – on iPhone «SOS» DOES CALL, so","Άνοιξε αυτό το link για να περάσεις το οικογενειακό μας σχέδιο στην εφαρμογή Επιβίωση 72+:":"Open this link to load our family plan into the Survival 72+ app:","Τα ελληνικά και τα λατινικά μοιράζονται πολλά σήματα – διάβασε τη γραμμή που βγάζει νόημα.":"Greek and Latin share many signals – read the line that makes sense.","ηχείο προς το μικρόφωνο του άλλου, 1–3 m. Κοντά κείμενα = πιο γρήγορα (~5 γράμματα/δευτ.).":"speaker towards the other phone's microphone, 1–3 m. Short texts = faster (~5 letters/sec).","🔔 Φώναξέ τον: το άλλο κινητό χτυπάει δυνατά και δονείται – για να ξυπνήσει ή να κοιτάξει.":"🔔 Call them: the other phone rings loudly and vibrates – to wake them up or make them look.","Δεν έχεις γράψει ακόμα σχέδιο. Συμπλήρωσε στην «Κάρτα μου» επαφές και σημεία συνάντησης.":"You haven't written a plan yet. Fill in contacts and meeting points in «My card».","Σύρε για μεγέθυνση. Στο iPhone άναψε τον φακό από το Κέντρο ελέγχου, αν χρειάζεσαι φως.":"Swipe to zoom. On iPhone turn on the flashlight from Control Centre if you need light.","Φόρτισε τη συσκευή. Κατέβασε τη δωρεάν εφαρμογή «Meshtastic» (App Store / Google Play).":"Charge the device. Download the free «Meshtastic» app (App Store / Google Play).","Εμπιστεύσου το ένστικτο: αν κάτι μοιάζει λάθος, φύγε. Δεν χρωστάς ευγένεια σε κανέναν.":"Trust your instinct: if something feels wrong, leave. You don't owe anyone politeness.","Καμία από αυτές δεν αντικαθιστά το 112. Αν έχεις έστω και λίγο σήμα, κάλεσε πρώτα 112.":"None of these replaces 112. If you have even a little signal, call 112 first.","τα. Η ζωή σου αξίζει περισσότερο. Πέτα την τσάντα μακριά και τρέξε από την άλλη μεριά.":"it to them. Your life is worth more. Throw the bag far away and run the other way.","LilyGO T-Echo / Heltec MeshPocket: με οθόνη e-ink και GPS, μεγάλη διάρκεια μπαταρίας.":"LilyGO T-Echo / Heltec MeshPocket: with e-ink screen and GPS, long battery life.","να στείλει SMS μόνη της – ανοίγει το SMS έτοιμο και πατάς «Αποστολή» (1 πάτημα). Για":"to send an SMS by itself – it opens the SMS ready and you tap «Send» (1 tap). For","Δοκιμή: ο ένας μένει σπίτι, ο άλλος απομακρύνεται 1, 3, 5 km. Σημειώστε πού πιάνει.":"Test: one stays at home, the other moves 1, 3, 5 km away. Note where it works.","με την οικογένεια, σε λειτουργία πτήσης. Στην κρίση δεν είναι ώρα για πρώτη φορά.":"with the family, in airplane mode. A crisis is no time to try it for the first time.","Ρυθμίσεις ασφάλειας function cat(c){const k=CATS[c];if(!k)return home();T(k[1]);
 const L=D.filter(a=>a.cat===c);
 let h='';
 if(c==='aid')h+=`<button class="big red" onclick="go('cpr')">❤️ ΚΑΡΠΑ – δεν αναπνέει<small>με ρυθμό ♪ για τις πιέσεις</small></button>`;
 if(c==='now'){h+=`<div class="grid">`+L.map(a=>`<button class="tile" onclick="go('a/${a.id}')"><span class="e">${a.emoji}</span>${esc(a.title)}</button>`).join('')+`<button class="tile" onclick="go('cat/aid')"><span class="e">🩹</span>Τραυματισμός</button></div>`;M.innerHTML=h;return}
 h+=L.map(a=>{let p='';if(a.cat==='list'){const t=a.blocks.filter(x=>x.t==='chk').length,on=a.blocks.filter(x=>x.t==='chk'&&LS.g('c_'+a.id,{})[x.k||x.x]).length;p=` · ${on}/${t} ✓`}
  return `<button class="row" onclick="go('a/${a.id}')"><span class="e">${a.emoji}</span><span><b>${esc(a.title)}</b><small>${esc(a.sub)}${p}</small></span></button>`}).join('');
 M.innerHTML=h}
function art(id){const a=byId[id];if(!a)return home();T(a.title);
 let h=`<h2>${a.emoji} ${esc(a.title)}</h2><div class="sub">${esc(a.sub)}</div><div class="tools"><button class="btn" id="spk" onclick="speak('${id}')">🔊 Διάβασέ το</button>`;
 if(a.cat==='now'||a.cat==='aid')h+=`<a class="btn r" href="tel:112" style="text-decoration:none">📞 112</a>`;
 if(id==='cpr')h+=`<button class="btn r" onclick="go('cpr')">♪ Ρυθμός ΚΑΡΠΑ</button>`;
 if(id==='lost'||id==='sea')h+=`<button class="btn p" onclick="go('compass')">🧭 Η θέση μου</button>`;
 if(a.cat==='list')h+=`<button class="btn" onclick="clr('${id}')">↺ Από την αρχή</button>`;
 h+=`</div>`;
 if(id==='home72'||id==='nuclearkit')h+=calcBox();
 if(a.cat==='list'){h+=`<div id="prog"></div>`}
 let n=0,hi=-1;const st=LS.g('c_'+id,{}),FG=(typeof SIMG!=='undefined'&&SIMG[id])||[],fg=k=>FG.filter(x=>x.at===k).map(figH).join('');h+=fg(-1);
 for(const b of a.blocks){
  if(b.t!=='step')n=0;
  if(b.t==='h'){hi++;h+=`<h3>${esc(b.x)}</h3>`+fg(hi)}
  else if(b.t==='step'){n++;h+=`<div class="step"><span class="n">${n}</span><span>${esc(b.x)}</span></div>`}
  else if(b.t==='li')h+=`<div class="li">${esc(b.x)}</div>`;
  else if(b.t==='warn')h+=`<div class="warn">⚠️ ${esc(b.x)}</div>`;
  else if(b.t==='tip')h+=`<div class="tip">💡 ${esc(b.x)}</div>`;
  else if(b.t==='chk'){const k=b.k||b.x;h+=`<div class="chk${st[k]?' on':''}" data-k="${esc(k)}" onclick="tg(this,'${id}')"><span class="bx">${st[k]?'✓':''}</span><span>${esc(b.x)}</span></div>`}
 }
 const same=D.filter(x=>x.cat===a.cat),i=same.indexOf(a);
 h+=`<div class="tools" style="margin-top:20px">${i>0?`<button class="btn" onclick="go('a/${same[i-1].id}')">◀ ${esc(same[i-1].title)}</button>`:''}${i<same.length-1?`<button class="btn" onclick="go('a/${same[i+1].id}')">${esc(same[i+1].title)} ▶</button>`:''}</div>`;
 M.innerHTML=h;if(a.cat==='list')prog(id);if($('#cp'))calc()}
function figH(x){let s='';try{s=x.f()}catch(e){return ''}return `<figure class="fig notr"><svg viewBox="0 0 320 180" role="img">${s}</svg><figcaption>${esc(x.c[LANG==='en'?1:0])}</figcaption></figure>`}
function tg(el,id){const st=LS.g('c_'+id,{}),k=el.dataset.k;st[k]=!st[k];if(!st[k])delete st[k];LS.s('c_'+id,st);el.classList.toggle('on',!!st[k]);el.querySelector('.bx').textContent=st[k]?'✓':'';prog(id)}
function prog(id){const a=byId[id],t=a.blocks.filter(x=>x.t==='chk').length,on=Object.keys(LS.g('c_'+id,{})).length,p=Math.round(100*on/t);
 $('#prog').innerHTML=`<div class="bar"><i style="width:${p}%"></i></div><div class="muted">${on} από ${t} έτοιμα (${p}%)</div>`}
function clr(id){if(!confirm('Να ξεκαθαρίσουν όλα τα ✓ αυτής της λίστας;'))return;LS.s('c_'+id,{});art(id)}
function calcBox(){const c=LS.g('calc',{p:4,d:3});return `<div class="box"><b>🧮 Υπολογισμός αποθεμάτων</b><div class="grid" style="margin-top:8px"><div><label>Άτομα</label><input id="cp" type="number" min="1" value="${c.p}" oninput="calc()"></div><div><label>Ημέρες</label><select id="cd" onchange="calc()">${[3,7,14,30].map(x=>`<option ${x==c.d?'selected':''}>${x}</option>`).join('')}</select></div></div><div id="cr"></div></div>`}
function calc(){const p=Math.max(1,+$('#cp').value||1),d=+$('#cd').value;LS.s('calc',{p,d});
 $('#cr').innerHTML=`<div class="li"><b>Νερό πόσιμο:</b> ${4*p*d} λίτρα (4 L/άτομο/μέρα)</div><div class="li"><b>Θερμίδες:</b> ~${(2000*p*d).toLocaleString('el')} kcal (≈ ${Math.ceil(p*d*2000/400)} κονσέρβες/μερίδες των 400 kcal)</div><div class="li"><b>Χαρτί υγείας:</b> ~${Math.ceil(p*d/4)} ρολά</div><div class="li"><b>Μπαταρίες ΑΑ:</b> ~${Math.max(8,p*4+d*2)} τεμ.</div><div class="li"><b>Σακούλες σκουπιδιών:</b> ~${Math.ceil(p*d/2)+5}</div><div class="muted">Πρόσθεσε 50% νερό σε καύσωνα, για θηλάζουσες ή αρρώστους.</div>`}

/* ---- speech ---- */
let speaking=false;
function speak(id){const s=window.speechSynthesis;if(!s){alert('Το κινητό δεν υποστηρίζει ανάγνωση.');return}
 if(speaking){s.cancel();speaking=false;$('#spk').textContent='🔊 Διάβασέ το';return}
 const a=byId[id];let txt=a.title+'. '+a.sub+'. ';let n=0;a.blocks.forEach(b=>{if(b.t==='step'){n++;txt+=n+'. '+b.x+' '}else{n=0;txt+=(b.t==='warn'?'Προσοχή! ':'')+b.x+'. '}});
 const u=new SpeechSynthesisUtterance(txt.replace(/[•→]/g,' '));u.lang=LANG==='en'?'en-US':'el-GR';u.rate=.95;const v=s.getVoices().find(v=>v.lang&&v.lang.startsWith(LANG));if(v)u.voice=v;
 u.onend=()=>{speaking=false;const b=$('#spk');if(b)b.textContent='🔊 Διάβασέ το'};s.cancel();s.speak(u);speaking=true;$('#spk').textContent='⏹ Σταμάτα'}

const PH=[['112','Ευρωπαϊκός αριθμός έκτακτης ανάγκης','Δουλεύει χωρίς SIM, από κάθε δίκτυο, και με SMS',1],['166','ΕΚΑΒ – Ασθενοφόρο','',1],['199','Πυροσβεστική','',1],['100','Αστυνομία','',1],['108','Λιμενικό Σώμα','Θάλασσα, ναυάγιο, άνθρωπος στη θάλασσα',1],['2107793777','Κέντρο Δηλητηριάσεων','24 ώρες – φάρμακα, χημικά, μανιτάρια, φίδια',0],['1056','Χαμόγελο του Παιδιού','Παιδί σε κίνδυνο / εξαφάνιση',0],['197','Κοινωνική Βοήθεια (ΕΚΚΑ)','',0],['1018','Γραμμή παρέμβασης για την αυτοκτονία','Κλίμακα – 24 ώρες',0]];
function phones(){T('Τηλέφωνα');const my=LS.g('me',{});
 let h=PH.map(p=>`<a class="phone ${p[3]?'k':''}" href="tel:${p[0]}"><span class="num">${p[0].length>6?'☎':p[0]}</span><span><b>${p[1]}</b>${p[0].length>6?`<br><span class="mono">${p[0].replace(/(\d{3})(\d{7})/,'$1 $2')}</span>`:''}${p[2]?`<br><small class="muted">${p[2]}</small>`:''}</span></a>`).join('');

const MEF=[['name','Όνομα'],['blood','Ομάδα αίματος'],['allergy','Αλλεργίες'],['meds','Φάρμακα που παίρνω'],['cond','Παθήσεις / σημειώσεις υγείας'],['contacts','Επαφές έκτακτης ανάγκης (μία ανά γραμμή: Όνομα 69…)'],['meet1','Σημείο συνάντησης κοντά στο σπίτι'],['meet2','Σημείο συνάντησης έξω από την πόλη'],['out','Συγγενής «κέντρο επικοινωνίας» σε άλλη πόλη'],['shut','Πού κλείνει γκάζι / νερό / ρεύμα'],['notes','Άλλες σημειώσεις']];
function me(edit){T('Η κάρτα μου');const m=LS.g('me',{});const has=MEF.some(f=>m[f[0]]);
 if(!edit&&has){M.innerHTML=`<div class="card">${MEF.filter(f=>m[f[0]]).map(f=>`<div style="margin-bottom:8px"><b>${f[1].split(' (')[0]}</b><b>:</b><br><span class="notr">${esc(m[f[0]]).replace(/\n/g,'<br>')}</span></div>`).join('')}</div><div class="tools" style="margin-top:12px"><button class="btn p" onclick="me(1)">✏️ Αλλαγή</button><button class="btn" onclick="go('phones')">📞 Τηλέφωνα</button></div><div class="tip">Δείξε αυτή την οθόνη σε διασώστη. Βάλε τα ίδια και στο Ιατρικό ID του κινητού για να φαίνονται στην κλειδωμένη οθόνη.</div>`;return}
 M.innerHTML=`<div class="muted">Συμπλήρωσε ό,τι θέλεις. Μένει μόνο σε αυτό το κινητό.</div>`+MEF.map(f=>`<label>${f[1]}</label>${['contacts','cond','notes','meds'].includes(f[0])?`<textarea rows="3" id="f_${f[0]}">${esc(m[f[0]]||'')}</textarea>`:`<input id="f_${f[0]}" value="${esc(m[f[0]]||'')}">`}`).join('')+`<button class="big grn" onclick="saveMe()">💾 Αποθήκευση</button>`}

/* ---- search ---- */
function search(){T('Αναζήτηση');M.innerHTML=`<input id="q" placeholder="π.χ. αίμα, νερό, σεισμός, κουβέρτα" oninput="sq()" autofocus><div id="sr"></div>`;$('#q').focus()}
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function sq(){const q=norm($('#q').value.trim());if(q.length<2){$('#sr').innerHTML='';return}
 const r=D.map(a=>{const tt=norm(a.title+' '+a.sub);const hits=a.blocks.filter(b=>norm(b.x).includes(q));return {a,s:(tt.includes(q)?10:0)+hits.length,h:hits[0]}}).filter(x=>x.s>0).sort((x,y)=>y.s-x.s).slice(0,25);
 $('#sr').innerHTML=r.length?r.map(x=>`<button class="row" onclick="go('a/${x.a.id}')"><span class="e">${x.a.emoji}</span><span><b>${esc(x.a.title)}</b><small>${esc(x.h?x.h.x:x.a.sub).slice(0,110)}</small></span></button>`).join(''):'<div class="muted">Δεν βρέθηκε. Δοκίμασε άλλη λέξη.</div>'}

/* ---- audio ---- */
let AC=null;function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function beep(f,ms,vol=.9,type='square'){const c=ac(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.value=vol;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+ms/1000)}

let cprT=null,cprN=0,cprMode=LS.g('cprm',0);
function cprPage(){T('ΚΑΡΠΑ');M.innerHTML=`<div class="warn">Πρώτα κάλεσε 112 / 166 με ανοιχτή ακρόαση.</div><a class="big red" href="tel:112" style="text-decoration:none">📞 Κάλεσε 112</a>
 <div class="metro" id="mt">▶</div><div class="hd" id="mc" style="font-size:1.6em">Πάτα ΕΝΑΡΞΗ</div>
 <button class="big org" id="mb" onclick="cprTog()">▶ ΕΝΑΡΞΗ ρυθμού (110/λεπτό)</button>
 <div class="tools"><button class="btn ${cprMode?'':'p'}" onclick="cprMode=0;LS.s('cprm',0);cprPage()">Μόνο πιέσεις</button><button class="btn ${cprMode?'p':''}" onclick="cprMode=1;LS.s('cprm',1);cprPage()">30 πιέσεις + 2 αναπνοές</button></div>
 <div class="step"><span class="n">1</span><span>Παλάμη στο ΚΕΝΤΡΟ του στήθους, το άλλο χέρι από πάνω, χέρια ίσια.</span></div>
 <div class="step"><span class="n">2</span><span>Πίεζε ΔΥΝΑΤΑ 5–6 cm, σε κάθε «μπιπ».</span></div>
 <div class="step"><span class="n">3</span><span>Άσε το στήθος να ανέβει πλήρως ανάμεσα.</span></div>
 <div class="step"><span class="n">4</span><span>Μη σταματάς μέχρι να έρθει βοήθεια. Αν φέρουν απινιδωτή, άνοιξέ τον και άκου τι λέει.</span></div>
 <button class="btn" onclick="go('a/cpr')">📖 Παιδί / βρέφος / αναλυτικά</button>`}
function cprTog(){if(cprT){stopAll();cprPage();return}cprN=0;wake(1);$('#mb').textContent='⏹ ΣΤΟΠ';let pause=0;
 cprT=setInterval(()=>{if(pause>0){pause--;return}cprN++;const mt=$('#mt');if(!mt)return stopAll();
  if(cprMode&&cprN>30){cprN=0;pause=Math.round(5000/545);$('#mc').textContent='2 ΑΝΑΠΝΟΕΣ';mt.textContent='💨';beep(440,600,.6,'sine');return}
  beep(cprMode&&cprN===30?1200:880,70,.8,'sine');mt.textContent=cprMode?cprN:'⬇';$('#mc').textContent=cprMode?`Πίεση ${cprN} / 30`:'ΠΙΕΣΕ – ΠΙΕΣΕ';mt.classList.add('b');setTimeout(()=>mt.classList.remove('b'),90)},545)}

let sosT=null,torchTrack=null;
function sos(){T('SOS');M.innerHTML=`<button class="big grn" onclick="go('morse')">📡 Morse – γράψε λέξεις<small>Παίζει με φως και ήχο · όλο το λεξιλόγιο</small></button><button class="big" style="background:#fff;color:#000" onclick="ovOn('#fff','Πάτα για κλείσιμο')">⬜ Φως οθόνης<small>Άσπρη οθόνη στο φουλ</small></button>
 <button class="big red" onclick="sosLight()">🔦 SOS με φως<small>··· ––– ··· στην οθόνη</small></button>
 <button class="big org" id="wh" onclick="whistle()">📣 Σφυρίχτρα SOS<small>Δυνατός ήχος – βάλε ένταση στο τέρμα</small></button>
 <button class="big blu" onclick="torch()">💡 Φακός κινητού<small>Δουλεύει σε Android (Chrome)</small></button>
 <div class="tip">iPhone: για τον φακό σύρε από πάνω δεξιά προς τα κάτω (Κέντρο Ελέγχου) → 🔦. Για SOS κλήση: κράτα πατημένο το πλαϊνό κουμπί + ένταση.</div>
 <div class="tip">Σήμα κινδύνου = <b>3</b> από οτιδήποτε: 3 σφυρίγματα, 3 λάμψεις, 3 φωτιές. Κράτα μπαταρία: χρησιμοποίησε το SOS όταν ακούς ή βλέπεις διασώστες.</div>
 <button class="btn" onclick="go('a/w_signal')">📖 Όλα τα σήματα (εδάφους, χεριών, Morse)</button>`}
function ovOn(bg,t){const o=$('#ov');o.style.display='flex';o.style.background=bg;$('#ovt').textContent=t;wake(1)}
function ovOff(){if($('#ov').dataset.mo)return moStop();$('#ov').style.display='none';$('#ov').style.alignItems='';if(sosT){clearTimeout(sosT);sosT=null}wakeRel()}
const SOSP=[1,1,1,1,1,3,3,1,3,1,3,3,1,1,1,1,1,7];// on,off pairs in units
function sosLight(){ovOn('#000','SOS – πάτα για κλείσιμο');const o=$('#ov');let i=0;const u=250;
 const stp=()=>{if($('#ov').style.display==='none')return;const on=i%2===0;o.style.background=on?'#fff':'#000';const d=SOSP[i%SOSP.length]*u;i=(i+1)%SOSP.length;sosT=setTimeout(stp,d)};stp()}
let whT=null;
function whistle(){if(whT){clearTimeout(whT);whT=null;$('#wh').innerHTML='📣 Σφυρίχτρα SOS<small>Δυνατός ήχος – βάλε ένταση στο τέρμα</small>';return}
 $('#wh').innerHTML='⏹ ΣΤΟΠ σφυρίχτρα';let i=0;const u=200;
 const stp=()=>{const on=i%2===0,d=SOSP[i%SOSP.length]*u;if(on)beep(3150,d,1,'square');i=(i+1)%SOSP.length;whT=setTimeout(stp,d)};stp()}
async function torch(){if(torchTrack){torchTrack.stop();torchTrack=null;return}
 try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const t=s.getVideoTracks()[0];const cap=t.getCapabilities?t.getCapabilities():{};
  if(!cap.torch){t.stop();alert('Αυτό το κινητό δεν επιτρέπει φακό από εφαρμογή web. Χρησιμοποίησε τον φακό του κινητού ή το «Φως οθόνης».');return}

/* ===== 2. Δεδομένα με ήχο (17 τόνοι MFSK, αυτο-χρονιζόμενο) ===== */
const SND={f0:1800,df:200,n:17,mk:1400,ts:.1};
const sndF=i=>i===17?SND.mk:SND.f0+i*SND.df;
function crc8(b){let c=0;for(const x of b){c^=x;for(let i=0;i<8;i++)c=c&0x80?((c<<1)^7)&255:(c<<1)&255}return c}
function sndPack(o){const te=new TextEncoder();let fl=Math.max(0,MKC.indexOf(o.k));const hp=o.la!=null;if(hp)fl|=8;const out=[fl];
 if(hp){const dv=new DataView(new ArrayBuffer(8));dv.setInt32(0,Math.round(o.la*1e5));dv.setInt32(4,Math.round(o.lo*1e5));out.push(...new Uint8Array(dv.buffer))}

function sndUnpack(b){const fl=b[0],o={k:MKC[fl&7]||'txt',t:Date.now()};let i=1;if(fl&8){const dv=new DataView(new Uint8Array(b.slice(1,9)).buffer);o.la=dv.getInt32(0)/1e5;o.lo=dv.getInt32(4)/1e5;i=9}const x=new TextDecoder().decode(new Uint8Array(b.slice(i)));if(x)o.x=x;return o}
function sndSyms(p){const fr=[p.length,...p,crc8(p)],s=[];let prev=0;fr.forEach(by=>[by>>4,by&15].forEach(v=>{const t=(prev+1+v)%SND.n;s.push(t);prev=t}));return s}
function sndPCM(p,sr,ts){ts=ts||SND.ts;const seq=[[17,.45],...sndSyms(p).map(t=>[t,ts]),[17,.3]],tot=seq.reduce((a,x)=>a+x[1],0)+.1,N=Math.ceil(tot*sr),y=new Float32Array(N);let ph=0,k=0;
 seq.forEach(([t,d])=>{const n=Math.round(d*sr),w=2*Math.PI*sndF(t)/sr;for(let j=0;j<n&&k<N;j++,k++){ph+=w;y[k]=.85*Math.sin(ph)}});const r=Math.round(.006*sr),e=k;for(let j=0;j<r;j++){y[j]*=j/r;if(e-1-j>=0)y[e-1-j]*=j/r}return y}
let sndPl=null;
function sndSend(rep){cmBuild(o=>{const p=sndPack(o),c=ac(),sl=LS.g('sslow',0)?.16:SND.ts,y=sndPCM(p,c.sampleRate,sl);const n=rep?3:1,gap=Math.round(.5*c.sampleRate),buf=c.createBuffer(1,y.length*n+gap*(n-1),c.sampleRate),ch=buf.getChannelData(0);for(let i=0;i<n;i++)ch.set(y,i*(y.length+gap));

  s.onended=()=>{sndPl=null;const q=$('#cms');if(q)q.textContent='✅ Στάλθηκε. Αν ο άλλος δεν το έπιασε, ξαναπάτα (ή «3 φορές»).'};CS.push(()=>{try{s.stop()}catch(e){}})},true)}

/* αποκωδικοποιητής: δέχεται διαδοχικές «αποφάσεις τόνου» (−1 = τίποτα) */
function sndDecoder(onMsg,onSt){let cand=-1,cnt=0,acc=-1,state=0,prev=0,nib=[],need=0,lastT=0;
 const reset=()=>{state=0;nib=[];prev=0;need=0};
 return function(t,now){if(t===cand)cnt++;else{cand=t;cnt=1}if(cnt!==3||t<0||t===acc){if(state===2&&now-lastT>900){reset();onSt&&onSt('⏳ Χάθηκε – περιμένω ξανά')}return}
  acc=t;lastT=now;if(t===17){if(state===2&&nib.length)onSt&&onSt('⏳ Διακοπή');reset();state=1;onSt&&onSt('🎵 Ακούω μήνυμα…');return}
  if(state===0)return;state=2;const v=(t-prev-1+SND.n)%SND.n;prev=t;if(v>15){reset();onSt&&onSt('⚠️ Θόρυβος – περιμένω ξανά');return}nib.push(v);
  if(nib.length===2)need=2*((nib[0]<<4|nib[1])+2);if(need&&nib.length>=need){const by=[];for(let i=0;i<nib.length;i+=2)by.push(nib[i]<<4|nib[i+1]);const p=by.slice(1,-1);reset();
   if(crc8(p)===by[by.length-1]){acc=-1;onMsg(p)}else onSt&&onSt('⚠️ Λάθος στη λήψη – ζήτα να το ξαναπαίξει')}else onSt&&onSt(`🎵 Λαμβάνω… ${need?Math.round(100*nib.length/need)+'%':''}`)}}

 const bins=[...Array(18)].map((_,i)=>Math.round(sndF(i)/bw)),lo=Math.round(1200/bw),hi=Math.round(5600/bw);
 let lastP='',lastPt=0;const dec=sndDecoder(p=>{const ks=p.join(','),nw=Date.now();if(ks===lastP&&nw-lastPt<20000){lastPt=nw;return}lastP=ks;lastPt=nw;const o=sndUnpack(p);inboxAdd(o,'🔊 Ήχος');const r=$('#sndr');if(r)r.insertAdjacentHTML('afterbegin',msgHtml(o,'🔊 Ελήφθη με ήχο'));const s=$('#snds');if(s)s.textContent='✅ Ελήφθη! Ακούω για επόμενο…'},m=>{const s=$('#snds');if(s)s.textContent=m});
 const cv=$('#sndc'),cx=cv&&cv.getContext('2d');wake(1);
 const iv=setInterval(()=>{an.getFloatFrequencyData(F);const lv=bins.map(b=>Math.max(F[b-1],F[b],F[b+1]));let bi=0;lv.forEach((v,i)=>{if(v>lv[bi])bi=i});const band=Array.from(F.slice(lo,hi)).sort((a,b)=>a-b),med=band[band.length>>1];
  dec(lv[bi]-med>20?bi:-1,performance.now());
  if(cx){cx.fillStyle='#0a1522';cx.fillRect(0,0,600,90);lv.forEach((v,i)=>{const h=Math.max(0,Math.min(86,(v-med)*2));cx.fillStyle=i===17?'#f77f00':(i===bi&&v-med>20?'#2a9d8f':'#3a86ff');cx.fillRect(i*33+4,88-h,26,h)})}},12);
 sndRx=()=>{clearInterval(iv);st.getTracks().forEach(t=>t.stop());try{src.disconnect()}catch(e){}sndRx=null;const b=$('#sndb');if(b)b.textContent='👂 Ξεκίνα να ακούς';const s=$('#snds');if(s)s.textContent=''};CS.push(()=>sndRx&&sndRx());
 $('#sndb').textContent='⏹ Σταμάτα';$('#snds').textContent='👂 Ακούω… (οι μπάρες δείχνουν τους τόνους)'}
