 καθαρό νερό. Βάλε πολλές σακούλες σε διαφορετικά δέντρα."},{"t":"warn","x":"Όχι σε δηλητηριώδη φυτά (π.χ. πικροδάφνη). Αν δεν ξέρεις το φυτό, μην το πιεις."},{"t":"h","x":"Ηλιακός αποστακτήρας (solar still)"},{"t":"step","x":"Σκάψε λάκκο 60 cm πλάτος και 50 cm βάθος, σε ήλιο, σε υγρό έδαφος."},{"t":"step","x":"Βάλε δοχείο στο κέντρο. Γύρω βάλε πράσινα φύλλα ή αλμυρό/βρόμικο νερό ή ούρα."},{"t":"step","x":"Σκέπασε με διάφανο νάιλον, κλείσε τις άκρες με χώμα, βάλε πέτρα στο κέντρο, ακριβώς πάνω από το δοχείο."},{"t":"step","x":"Το νερό εξατμίζεται, κάνει σταγόνες στο νάιλον και στάζει στο δοχείο ΚΑΘΑΡΟ."},{"t":"tip","x":"Δίνει λίγο (0,2–0,5 λίτρα τη μέρα). Είναι για ανάγκη, όχι για να ζήσεις από αυτό."},{"t":"h","x":"Νερό που ΔΕΝ πίνεις"},{"t":"warn","x":"ΠΟΤΕ θαλασσινό νερό, ούρα ή αλκοόλ – σε αφυδατώνουν πιο γρήγορα."},{"t":"warn","x":"Πλημμύρα: το νερό έχει λύματα, πετρέλαια και χημικά. Ούτε με καθαρισμό αν υπάρχει άλλη λύση."},{"t":"warn","x":"Απόφυγε νερό με νεκρά ζώα κοντά, με πράσινο-μπλε αφρό (κυανοβακτήρια – οι τοξίνες ΔΕΝ φεύγουν με βράσιμο), κάτω από χωριά, χωράφια με φάρμακα, ορυχεία, εργοστάσια."}]},{"cat":"wild","id":"w_water2","emoji":"🚰","title":"Φίλτρο & καθαρισμός νερού","sub":"Βράσιμο, χλωρίνη, ταμπλέτες, φίλτρα, DIY φίλτρο","blocks":[{"t":"h","x":"Τα 3 βήματα"},{"t":"step","x":"ΔΙΑΥΓΑΣΗ: βγάζω λάσπη και σκουπίδια (κατακάθισμα, πανί, φίλτρο από άμμο)."},{"t":"step","x":"ΦΙΛΤΡΑΡΙΣΜΑ: βγάζω βακτήρια και παράσιτα (φίλτρο 0,1–0,2 μm)."},{"t":"step","x":"ΑΠΟΛΥΜΑΝΣΗ: σκοτώνω και τους ιούς (βράσιμο, χλωρίνη, ταμπλέτες, UV)."},{"t":"tip","x":"Θολό νερό; Πάντα πρώτα το 1. Η λάσπη «κρύβει» τα μικρόβια από τη χλωρίνη και τον ήλιο, και βουλώνει τα φίλτρα."},{"t":"h","x":"1. Βράσιμο – το πιο σίγουρο"},{"t":"step","x":"Πέρασε το νερό από πανί αν είναι θολό."},{"t":"step","x":"Φέρε σε ΔΥΝΑΤΟ βρασμό (μεγάλες φυσαλίδες) για 1 λεπτό. Πάνω από 2000 m υψόμετρο: 3 λεπτά."},{"t":"step","x":"Άφησέ το να κρυώσει σκεπασμένο. Για να φύγει η «άνοστη» γεύση, χτύπησέ το από δοχείο σε δοχείο."},{"t":"li","x":"Σκοτώνει ΟΛΑ τα μικρόβια: βακτήρια, ιούς, παράσιτα."},{"t":"warn","x":"ΔΕΝ βγάζει αλάτι, χημικά, πετρέλαια, βαρέα μέταλλα ή τοξίνες από φύκια."},{"t":"tip","x":"Χωρίς κατσαρόλα: πλαστικό μπουκάλι γεμάτο ΤΕΛΕΙΩΣ νερό, κρεμασμένο πάνω από κάρβουνα (όχι φλόγα), βράζει χωρίς να λιώσει. Ή ζέστανε πέτρες στη φωτιά και ρίξ' τες σε δοχείο με νερό (όχι πέτρες από ποτάμι – σκάνε)."},{"t":"h","x":"2. Χλωρίνη του σπιτιού"},{"t":"step","x":"ΜΟΝΟ απλή χλωρίνη, χωρίς άρωμα, χωρίς απορρυπαντικό (5–6% υποχλωριώδες νάτριο, γράφει στην ετικέτα)."},{"t":"step","x":"Καθαρό νερό: 2 σταγόνες ανά λίτρο (8 σταγόνες ανά 4 λίτρα)."},{"t":"step","x":"Θολό ή πολύ κρύο νερό: 4 σταγόνες ανά λίτρο."},{"t":"step","x":"Ανακάτεψε και περίμενε 30 λεπτά (κρύο νερό: 1 ώρα)."},{"t":"step","x":"Πρέπει να μυρίζει ΕΛΑΦΡΑ χλώριο. Αν δεν μυρίζει, ξαναβάλε την ίδια δόση και περίμενε άλλα 15 λεπτά."},{"t":"li","x":"Σκοτώνει βακτήρια και ιούς. Κάποια παράσιτα (κρυπτοσπορίδιο) αντέχουν."},{"t":"tip","x":"Βάλε ένα μικρό σταγονόμετρο με χλωρίνη στο σακίδιο. Η χλωρίνη χάνει δύναμη μετά από 6–12 μήνες – άλλαζέ την."},{"t":"h","x":"3. Ταμπλέτες"},{"t":"li","x":"Διοξείδιο του χλωρίου (π.χ. Micropur MP1, Aquamira): σκοτώνει ΚΑΙ τα παράσιτα. Περίμενε 30 λεπτά για βακτήρια/ιούς και 4 ώρες για κρυπτοσπορίδιο. Η καλύτερη ταμπλέτα για το σακίδιο."},{"t":"li","x":"NaDCC / χλώριο (π.χ. Aquatabs): γρήγορες, φθηνές, όπως η χλωρίνη."},{"t":"li","x":"Ιώδιο: 5 σταγόνες βάμμα ιωδίου 2% ανά λίτρο, 30 λεπτά. ΟΧΙ για εγκύους, παιδιά, παθήσεις θυρεοειδούς ή χρήση πάνω από λίγες εβδομάδες."},{"t":"tip","x":"Ακολούθα ΠΑΝΤΑ τη συσκευασία. Κοίτα την ημερομηνία λήξης."},{"t":"h","x":"4. Φορητά φίλτρα"},{"t":"li","x":"Φίλτρα κοίλων ινών 0,1 μm (Sawyer Squeeze/Mini, LifeStraw, Katadyn BeFree): κόβουν βακτήρια και παράσιτα, όχι ιούς. Ελαφριά, φθηνά, φιλτράρουν χιλιάδες λίτρα."},{"t":"li","x":"Φίλτρα κεραμικά (π.χ. Katadyn): ανθεκτικά, καθαρίζονται με βούρτσα."},{"t":"li","x":"Φίλτρα με ενεργό άνθρακα: βελτιώνουν τη γεύση και κόβουν κάποια χημικά – μόνα τους δεν σκοτώνουν μικρόβια."},{"t":"step","x":"Φιλτράρισε από το πιο καθαρό σημείο, όχι από τον βυθό."},{"t":"step","x":"Μην αφήνεις το «βρόμικο» στόμιο να ακουμπήσει το καθαρό μπουκάλι."},{"t":"step","x":"Ξέπλυνε ανάποδα (backflush) όταν πέφτει η ροή."},{"t":"warn","x":"Ο ΠΑΓΟΣ ΧΑΛΑΕΙ τα φίλτρα ινών χωρίς να φαίνεται. Το χειμώνα κοιμήσου με το φίλτρο μέσα στο sleeping bag."},{"t":"warn","x":"Στην πλημμύρα ή κοντά σε χωριά (λύματα = ιοί): μετά το φίλτρο βάλε ΚΑΙ χλωρίνη ή βράσε."},{"t":"li","x":"UV στυλό (π.χ. SteriPEN): σκοτώνει όλα τα μικρόβια σε 90″ σε ΔΙΑΥΓΕΣ νερό. Θέλει μπαταρία."},{"t":"h","x":"5. Ήλιος – SODIS"},{"t":"step","x":"Διάφανο πλαστικό μπουκάλι PET έως 2 λίτρα, χωρίς ετικέτα, ΧΩΡΙΣ γρατζουνιές."},{"t":"step","x":"Γέμισέ το με ΔΙΑΥΓΕΣ νερό (αν διαβάζεις γράμματα από πίσω, είναι εντάξει)."},{"t":"step","x":"Ξάπλωσέ το στον ήλιο, ιδανικά πάνω σε λαμαρίνα ή στέγη, 6 ώρες. Με συννεφιά: 2 μέρες. Με βροχή: δεν δουλεύει."},{"t":"tip","x":"Τελευταία λύση, αλλά καλύτερη από το τίποτα. Δεν χρειάζεται καύσιμο."},{"t":"h","x":"DIY φίλτρο με μπουκάλι"},{"t":"step","x":"Κόψε τον πάτο από πλαστικό μπουκάλι 1,5–2 λίτρων και γύρισέ το ανάποδα (το καπάκι κάτω, τρυπημένο ή ξεβιδωμένο)."},{"t":"step","x":"Στον λαιμό βάλε βαμβάκι, γάζα ή κομμάτι μπλούζας."},{"t":"step","x":"Από πάνω 3–5 cm θρυμματισμένο ΚΑΡΒΟΥΝΟ από τη φωτιά σου (όχι μπρικέτες με χημικά)."},{"t":"step","x":"Μετά λεπτή άμμο, μετά χοντρή άμμο, πάνω-πάνω ψιλό χαλίκι."},{"t":"step","x":"Ρίξε νερό σιγά. Πέτα το νερό από τα πρώτα 2–3 γεμίσματα (βγάζει σκόνη από το κάρβουνο)."},{"t":"warn","x":"Αυτό το φίλτρο μόνο ΔΙΑΥΓΑΖΕΙ. ΔΕΝ κάνει το νερό πόσιμο. Μετά ΠΑΝΤΑ βράσιμο, χλωρίνη ή ταμπλέτα."},{"t":"tip","x":"Γρήγορη λύση: δέσε μια κάλτσα ή μπλούζα σε σχήμα χωνιού, γέμισέ τη με άμμο και ρίξε το νερό από πάνω."},{"t":"h","x":"Αλμυρό ή χημικά – απόσταξη"},{"t":"li","x":"Μόνο η απόσταξη βγάζει αλάτι και τα περισσότερα χημικά."},{"t":"step","x":"Κατσαρόλα με θαλασσινό/βρόμικο νερό στη φωτιά."},{"t":"step","x":"Μέσα, στο κέντρο, μια κούπα πάνω σε πέτρα (να μην ακουμπάει το νερό)."},{"t":"step","x":"Σκέπασε με το καπάκι ΑΝΑΠΟΔΑ (το χερούλι προς τα κάτω, πάνω από την κούπα). Βάλε κρύο νερό ή χιόνι πάνω στο καπάκι."},{"t":"step","x":"Ο ατμός γίνεται σταγόνες στο καπάκι και στάζει καθαρός στην κούπα."},{"t":"tip","x":"Ή: σωλήνας/καλαμιά από το στόμιο ενός καπακωμένου δοχείου που βράζει, προς δοχείο μέσα σε κρύο νερό."},{"t":"h","x":"Πίνακας γρήγορα"},{"t":"li","x":"Θολό νερό → κατακάθισμα + πανί → βράσιμο ή χλωρίνη."},{"t":"li","x":"Ρέμα στο βουνό → φίλτρο 0,1 μm (ή βράσιμο)."},{"t":"li","x":"Νερό πλημμύρας ή από χωριό → πανί → φίλτρο → ΚΑΙ χλωρίνη ή βράσιμο."},{"t":"li","x":"Θαλασσινό νερό → μόνο απόσταξη."},{"t":"li","x":"Νερό με πετρέλαια, χημικά, πράσινο αφρό → ΜΗΝ το πιεις. Ψάξε άλλο."}]},{"cat":"wild","id":"w_fire","emoji":"🔥","title":"Φωτιά: πώς τη στήνω","sub":"Ζέστη, βράσιμο, σήμα, ηθικό","blocks":[{"t":"h","x":"Τα 3 υλικά – μάζεψέ τα ΠΡΙΝ ανάψεις"},{"t":"li","x":"ΠΡΟΣΑΝΑΜΜΑ (πιάνει με σπίθα): μία μεγάλη χούφτα."},{"t":"li","x":"ΜΙΚΡΑ ΚΛΑΔΙΑ (πάχος σπίρτου έως μολυβιού): ΠΟΛΛΑ – δύο αγκαλιές."},{"t":"li","x":"ΞΥΛΑ (πάχος δαχτύλου έως μπράτσου): αρκετά για όλη τη νύχτα. Όσα νομίζεις, φέρε τα διπλά."},{"t":"tip","x":"Η πιο συχνή αποτυχία είναι λίγα μικρά κλαδιά. Η φωτιά πεθαίνει εκεί."},{"t":"h","x":"Το καλύτερο προσάναμμα"},{"t":"li","x":"Βαμβάκι με βαζελίνη: πιάνει με μία σπίθα και καίει 2–3 λεπτά. Βάλε 10–20 μπαλάκια σε σακουλάκι ή κουτάκι – το Νο1 του σακιδίου."},{"t":"li","x":"Δαδί (ρετσινωμένο ξύλο από ρίζα ή κούτσουρο πεύκου, μυρίζει ρετσίνι, είναι κοκκινωπό): ανάβει ακόμα και βρεγμένο."},{"t":"li","x":"Ρετσίνι πεύκου που τρέχει από τον κορμό."},{"t":"li","x":"Φλούδα σημύδας, κέδρου, κυπαρισσιού, κληματαριάς – τρίψε την σε χνούδι."},{"t":"li","x":"Ξερό χορτάρι, ξερά πευκοβελόνες, φωλιές πουλιών, χνούδι από ψαθί (Typha) και γαϊδουράγκαθα."},{"t":"li","x":"Ξύσματα: ξύσε ξερό ξυλάκι με το μαχαίρι σε λεπτές «μπούκλες» που μένουν κολλημένες (feather stick)."},{"t":"li","x":"Από το σπίτι/αυτοκίνητο: χαρτί, χαρτόνι αυγών, χνούδι από στεγνωτήριο, αντισηπτικό τζελ (οινόπνευμα), πατατάκια, κερί, γάζα με βαζελίνη από το φαρμακείο."},{"t":"h","x":"Βροχή και υγρασία"},{"t":"li","x":"Πάρε ξερά κλαδιά που είναι ΑΚΟΜΑ πάνω στο δέντρο, όχι από το έδαφος."},{"t":"li","x":"Κάτω από πεσμένους κορμούς, βράχους, πυκνά έλατα το ξύλο είναι πιο στεγνό."},{"t":"li","x":"Σκίσε τα χοντρά ξύλα: μέσα είναι στεγνά. Κάνε από αυτά feather sticks."},{"t":"li","x":"Βάλε τα υγρά ξύλα ΓΥΡΩ από τη φωτιά να στεγνώσουν πριν τα ρίξεις."},{"t":"li","x":"Βάση από ξυλάκια ή φλούδα, όχι πάνω σε βρεγμένο χώμα ή χιόνι."},{"t":"li","x":"Νεκρά κλαδιά που ΣΠΑΝΕ με «κρακ» είναι στεγνά. Αν λυγίζουν, είναι υγρά."},{"t":"h","x":"Πώς την ανάβω"},{"t":"step","x":"Καθάρισε κύκλο 3 m από ξερά. Μακριά από δέντρα, κλαδιά από πάνω και σκηνές. Σε δυνατό αέρα – μην ανάβεις."},{"t":"step","x":"Κύκλος από πέτρες (ΟΧΙ πέτρες από ποτάμι ή βρεγμένες – σκάνε) ή σκάψε λίγο λάκκο."},{"t":"step","x":"Βάση από ξερά ξυλάκια. Προσάναμμα στη μέση."},{"t":"step","x":"Γύρω από το προσάναμμα στήσε τα μικρά κλαδιά σε σχήμα σκηνής (tipi), αφήνοντας «πόρτα» από την πλευρά του αέρα."},{"t":"step","x":"Άναψε το προσάναμμα από την πλευρά του αέρα. Φύσα απαλά και σταθερά στη βάση, όχι από πάνω."},{"t":"step","x":"Όταν πιάσουν τα μικρά, πρόσθετε σιγά-σιγά μεγαλύτερα. Μην το πνίξεις – η φωτιά θέλει αέρα."},{"t":"h","x":"Σχήματα φωτιάς"},{"t":"li","x":"Tipi (σκηνή): ανάβει γρήγορα, δυνατή φλόγα. Για ζέστη, βράσιμο, σήμα."},{"t":"li","x":"Log cabin (σαν καλύβι, ξύλα σταυρωτά): σταθερή, βγάζει ωραία κάρβουνα. Για μαγείρεμα."},{"t":"li","x":"Lean-to (στηριγμένη): ένα χοντρό ξύλο προς τον αέρα, τα μικρά στηριγμένα πάνω του. Για αέρα."},{"t":"li","x":"Αστέρι: 5–6 χοντρά ξύλα σαν ακτίνες, σπρώχνεις προς τα μέσα όσο καίγονται. Κάνει οικονομία, κρατάει όλη τη νύχτα."},{"t":"li","x":"Dakota (κρυφή): δύο λάκκοι 30 cm που ενώνονται στον πάτο με τούνελ. Φωτιά στον έναν, αέρας από τον άλλο. Λίγος καπνός, λίγα ξύλα, δεν φαίνεται, αντέχει στον αέρα."},{"t":"h","x":"Ζέστη για ύπνο"},{"t":"li","x":"Τοίχος-ανακλαστήρας πίσω από τη φωτιά (κορμοί ή πέτρες): γυρίζει τη ζέστη προς το μέρος σου."},{"t":"li","x":"Κοιμήσου 1–1,5 m από μια μακριά, χαμηλή φωτιά, με τον τοίχο πίσω από τη φωτιά ή πίσω από σένα."},{"t":"li","x":"Ζεστές πέτρες (όχι από ποτάμι) τυλιγμένες σε πανί στο sleeping bag, ή μπουκάλι με ζεστό νερό."},{"t":"warn","x":"ΠΟΤΕ φωτιά, μαγκάλι, κάρβουνα ή γκαζάκι μέσα σε σκηνή, αυτοκίνητο ή κλειστό δωμάτιο. Μονοξείδιο του άνθρακα: δεν μυρίζει και σκοτώνει στον ύπνο."},{"t":"h","x":"Ασφάλεια και νόμος"},{"t":"warn","x":"Στην Ελλάδα, την αντιπυρική περίοδο (1 Μαΐου – 31 Οκτωβρίου) απαγορεύεται η φωτιά σε δάση, αγρούς και ύπαιθρο. Μόνο σε πραγματικό κίνδυνο ζωής, με απόλυτη προσοχή."},{"t":"warn","x":"Πάντα νερό ή χώμα δίπλα σου. Ποτέ μη φεύγεις από αναμμένη φωτιά."},{"t":"warn","x":"Σβήσιμο: νερό, ανακάτεμα με ξύλο, ξανά νερό, μέχρι να είναι ΚΡΥΟ στο χέρι. Τα κάρβουνα κάτω από τη στάχτη ξανανάβουν μετά από ώρες."},{"t":"tip","x":"Αν ξεφύγει: μην προσπαθήσεις να τη σβήσεις μόνος αν μεγάλωσε. Φύγε αντίθετα από τον αέρα και κατηφορικά, και κάλεσε 199/112."}]},{"cat":"wild","id":"w_fire2","emoji":"🪵","title":"8 τρόποι να ανάψεις φωτιά","sub":"Από τον αναπτήρα ως το τόξο","blocks":[{"t":"h","x":"1. Αναπτήρας"},{"t":"li","x":"Ο πιο εύκολος. Πάρε 2–3 απλούς αναπτήρες με τροχό (π.χ. BIC) – σε διαφορετικές τσέπες."},{"t":"li","x":"Στο κρύο το αέριο δεν βγαίνει: κράτα τον στην εσωτερική τσέπη, κοντά στο σώμα."},{"t":"li","x":"Βράχηκε; Φύσα και τρίψε τον τροχό σε ρούχο μέχρι να στεγνώσει. Ακόμα και άδειος, ο τροχός βγάζει σπίθες πάνω σε βαμβάκι με βαζελίνη."},{"t":"tip","x":"Με αέρα: κάνε «σπηλιά» με το σώμα και τις παλάμες και άναψε κοντά στο προσάναμμα."},{"t":"h","x":"2. Σπίρτα"},{"t":"li","x":"Σπίρτα θύελλας (stormproof): καίνε στον αέρα και ξανανάβουν αφού βραχούν. Σε αδιάβροχο κουτάκι μαζί με την επιφάνεια τριβής."},{"t":"li","x":"Κανονικά σπίρτα: βούτηξε τα κεφάλια σε λιωμένο κερί – γίνονται αδιάβροχα. Ξύσε το κερί πριν τα ανάψεις."},{"t":"step","x":"Κράτα το σπίρτο με το κεφάλι λίγο προς τα κάτω, για να ανέβει η φλόγα στο ξυλάκι."},{"t":"step","x":"Φέρε το αμέσως στο προσάναμμα, προστατευμένο από τον αέρα."},{"t":"h","x":"3. Ράβδος πυρίτη (ferro rod)"},{"t":"li","x":"Δουλεύει βρεγμένη, σε αέρα, σε κρύο, σε χιλιάδες ανάμματα. Η καλύτερη εφεδρεία – βάλε μία στο κιτ σου."},{"t":"step","x":"Βάλε την άκρη της ράβδου ΜΕΣΑ στο προσάναμμα."},{"t":"step","x":"Κράτα σταθερό το ξέστρο (ή τη ράχη του μαχαιριού) πάνω στη ράβδο."},{"t":"step","x":"ΤΡΑΒΑ τη ράβδο προς τα πίσω, όχι το ξέστρο προς τα μπρος – έτσι δεν σκορπίζεις το προσάναμμα."},{"t":"step","x":"Σπίθες στους 3.000 °C πέφτουν στο προσάναμμα. Φύσα απαλά."},{"t":"tip","x":"Με ράβδο μαγνησίου: ξύσε πρώτα ένα σωρό ρινίσματα σε μέγεθος νομίσματος πάνω στο προσάναμμα και μετά ρίξε σπίθα."},{"t":"h","x":"4. Μπαταρία και σύρμα κουζίνας"},{"t":"li","x":"Χρειάζεσαι πολύ λεπτό ατσαλόσυρμα (σύρμα κουζίνας 0000, όχι ανοξείδωτο)."},{"t":"step","x":"Τέντωσε ένα κομμάτι σύρμα, φούσκωσέ το."},{"t":"step","x":"Ακούμπησε το σύρμα και στους δύο πόλους μπαταρίας 9V – ανάβει αμέσως."},{"t":"step","x":"Με μπαταρία AA/AAA ή powerbank: ένα λεπτό νήμα από το σύρμα από τον έναν πόλο στον άλλο."},{"t":"step","x":"Ρίξε το σύρμα που κοκκινίζει μέσα στο προσάναμμα και φύσα."},{"t":"warn","x":"Μην κρατάς ποτέ μαζί μπαταρία 9V και σύρμα στην ίδια τσέπη – μπορεί να ανάψει μόνο του."},{"t":"tip","x":"Αυτοκίνητο: ο αναπτήρας του ταμπλό ανάβει χαρτί, βαμβάκι ή φλούδα. Πάντα μακριά από βενζίνη."},{"t":"h","x":"5. Φακός και ήλιος"},{"t":"li","x":"Μεγεθυντικός φακός, γυαλιά ΠΡΕΣΒΥΩΠΙΑΣ (για κοντά – τα γυαλιά μυωπίας δεν δουλεύουν), φακός κιάλιου ή κάμερας, φακός Fresnel σε μέγεθος κάρτας."},{"t":"li","x":"Και: διάφανο μπουκάλι ή σακουλάκι γεμάτο νερό, πάγος λειασμένος σε φακό."},{"t":"step","x":"Μόνο με δυνατό ήλιο, ιδανικά 10:00–15:00."},{"t":"step","x":"Σκούρο, ξερό προσάναμμα: char cloth, σάπιο ξερό ξύλο (ίσκα), μαυρισμένο χαρτί."},{"t":"step","x":"Κράτα τον φακό ώστε η φωτεινή κουκκίδα να γίνει όσο πιο ΜΙΚΡΗ γίνεται, και ΑΚΙΝΗΤΗ."},{"t":"step","x":"Μόλις βγει καπνός και κόκκινη κουκκίδα, βάλ' το σε προσάναμμα και φύσα."},{"t":"tip","x":"Δεν θέλει καύσιμο ποτέ. Βάλε ένα φακό Fresnel στο πορτοφόλι."},{"t":"h","x":"6. Πυρόλιθος, ατσάλι και char cloth"},{"t":"li","x":"Ατσάλι με πολύ άνθρακα (παλιά λίμα, ράχη μαχαιριού carbon) + σκληρή πέτρα με κοφτερή άκρη (πυρόλιθος, χαλαζίας)."},{"t":"step","x":"Κράτα την πέτρα με ένα κομμάτι char cloth πάνω της, κάτω από την κοφτερή άκρη."},{"t":"step","x":"Χτύπα το ατσάλι προς τα κάτω, ξυστά πάνω στην άκρη της πέτρας. Οι σπίθες πέφτουν στο char cloth."},{"t":"step","x":"Όταν το πανί κάνει κόκκινη κουκκίδα, βάλ' το μέσα σε «φωλιά» από ξερό χορτάρι, κλείσε την και φύσα μέχρι να πάρει φλόγα."},{"t":"h","x":"Φτιάξε char cloth (στο σπίτι ή στη φωτιά)"},{"t":"step","x":"Κόψε 100% βαμβακερό πανί (παλιό τζιν, μπλούζα) σε τετράγωνα 5×5 cm."},{"t":"step","x":"Βάλ' τα σε μεταλλικό κουτάκι με μία μικρή τρύπα στο καπάκι."},{"t":"step","x":"Βάλε το κουτάκι στη φωτιά. Βγαίνει καπνός από την τρύπα."},{"t":"step","x":"Όταν σταματήσει ο καπνός, βγάλε το και άφησέ το να κρυώσει ΚΛΕΙΣΤΟ."},{"t":"step","x":"Τα πανάκια πρέπει να είναι μαύρα, όχι στάχτη. Πιάνουν με την πιο μικρή σπίθα."},{"t":"h","x":"7. Τόξο (bow drill) – χωρίς τίποτα"},{"t":"li","x":"Δύσκολο. Θέλει εξάσκηση στο σπίτι, όχι πρώτη φορά σε ανάγκη. Τα ξύλα πρέπει να είναι ΚΑΤΑΞΕΡΑ."},{"t":"li","x":"Καλά ξύλα: ιτιά, λεύκα, φλαμουριά, κέδρος, κυπαρίσσι, ρίζα από κισσό. Όχι ρετσινωμένο πεύκο, όχι σκληρή βελανιδιά."},{"t":"step","x":"Άτρακτος: ίσιο ξυλάκι 20 cm, πάχος αντίχειρα, μυτερό στην πάνω άκρη, στρογγυλό κάτω."},{"t":"step","x":"Σανίδα: ίδιο ξύλο, πάχος 2 cm. Κάνε ένα λακκάκι κοντά στην άκρη και μια εγκοπή σε σχήμα V (1/8 του κύκλου) από την άκρη ως το κέντρο του λακκακιού."},{"t":"step","x":"Λαβή από πάνω: πέτρα με βαθούλωμα ή σκληρό ξύλο. Λίπανε με σαπούνι, λίπος ή φύλλα."},{"t":"step","x":"Τόξο: κλαδί σε μήκος χεριού, ελαφρώς κυρτό, με κορδόνι ελαφρώς χαλαρό."},{"t":"step","x":"Τύλιξε μία φορά την άτρακτο στο κορδόνι. Βάλε φύλλο ή φλούδα κάτω από την εγκοπή."},{"t":"step","x":"Πάτα τη σανίδα με το πόδι, το χέρι με τη λαβή κλειδωμένο στο γόνατο."},{"t":"step","x":"Πριόνιζε με μεγάλες, σταθερές κινήσεις, στην αρχή αργά, μετά γρήγορα και με πίεση. Όταν βγαίνει πολύς καπνός και μαύρη σκόνη, κάνε άλλες 10–20."},{"t":"step","x":"Η σκόνη στην εγκοπή γίνεται κόκκινο κάρβουνο. Μετάφερέ το ΜΕ ΤΟ ΦΥΛΛΟ στη φωλιά από χορτάρι και φύσα."},{"t":"h","x":"8. Φωτιά από τη φωτιά σου – κράτα την ζωντανή"},{"t":"li","x":"Το πιο εύκολο άναμμα είναι αυτό που δεν χρειάζεται: σκέπασε τα κάρβουνα με στάχτη το βράδυ, το πρωί ξεσκέπασε και ρίξε λεπτά κλαδιά."},{"t":"li","x":"Μεταφορά: κάρβουνο μέσα σε κονσερβοκούτι με τρύπες ή σε ξερό μύκητα (ίσκα), τυλιγμένο σε πράσινα φύλλα."},{"t":"h","x":"Τι να έχεις πάντα μαζί"},{"t":"chk","x":"2 αναπτήρες BIC σε διαφορετικές τσέπες"},{"t":"chk","x":"Ράβδος πυρίτη"},{"t":"chk","x":"Σπίρτα θύελλας σε αδιάβροχο κουτάκι"},{"t":"chk","x":"Βαμβάκι με βαζελίνη (10–20 μπαλάκια)"},{"t":"chk","x":"Φακός Fresnel σε μέγεθος κάρτας"},{"t":"chk","x":"Ένα κομμάτι δαδί ή κερί"},{"t":"chk","x":"Μαχαίρι για ξύσματα (feather sticks)"}]},{"cat":"wild","id":"w_car","emoji":"🚙","title":"Ύπνος στο αυτοκίνητο – σαν overlander","sub":"Ζεστά, ασφαλή, χωρίς μονοξείδιο","blocks":[{"t":"warn","x":"ΠΟΤΕ δεν κοιμάσαι με τη μηχανή αναμμένη. Το μονοξείδιο (CO) μπαίνει στην καμπίνα, ειδικά αν το χιόνι κλείσει την εξάτμιση. Δεν μυρίζει και δεν ξυπνάς."},{"t":"h","x":"Πού παρκάρω"},{"t":"li","x":"Επίπεδο σημείο (κοιμάσαι πολύ καλύτερα). Μύτη ή πίσω μέρος προς τον αέρα, ώστε να μη χτυπάει το πλάι."},{"t":"li","x":"ΟΧΙ σε κοίτη ρέματος, κάτω από ξερά κλαδιά/δέντρα, κάτω από πλαγιά με πέτρες ή χιονοστιβάδα, δίπλα σε γκρεμό."},{"t":"li","x":"Μακριά από τον δρόμο (φώτα, εκχιονιστικά), αλλά κάπου που μπορείς να βγεις αν χιονίσει. Στο χιόνι: μύτη προς την έξοδο."},{"t":"li","x":"Πες σε κάποιον πού είσαι (στείλε τις συντεταγμένες από την Πυξίδα)."},{"t":"h","x":"Μόνωση της καμπίνας"},{"t":"step","x":"Μόνωσε τα ΤΖΑΜΙΑ: από εκεί φεύγει η περισσότερη ζέστη. Κομμένα πάνελ από reflectix (αλουμινένια φυσαλίδα) ή αφρώδες υπόστρωμα, στο σχήμα κάθε τζαμιού. Μπαίνουν πιεστά, χωρίς κόλλα."},{"t":"step","x":"Αυτοσχέδια: κουβέρτες, πετσέτες, ασημοκουβέρτες, χαρτόνια στερεωμένα με τις πόρτες/ηλιοπροστασίες."},{"t":"step","x":"Κουρτίνα/κουβέρτα ανάμεσα στα μπροστινά καθίσματα και στο πίσω μέρος – ζεσταίνεις μόνο τον χώρο του ύπνου (μικροκλίμα)."},{"t":"step","x":"Στο πάτωμα/πορτμπαγκάζ: υπόστρωμα foam + στρώμα. Το μέταλλο του αυτοκινήτου είναι πολύ κρύο."},{"t":"h","x":"Αερισμός – υγρασία"},{"t":"li","x":"Άφησε 1–2 παράθυρα ανοιχτά 1–2 cm (με σήτα ή ανεμοθραύστη). Χωρίς αερισμό η ανάσα σου γίνεται νερό και πάγος στα τζάμια και στον υπνόσακο."},{"t":"li","x":"Πετσέτα μικροϊνών για τα τζάμια το πρωί. Βρεγμένα ρούχα σε σακούλα, όχι ανοιχτά στην καμπίνα."},{"t":"h","x":"Ζέστη"},{"t":"li","x":"Ο υπνόσακος σε ζεσταίνει, όχι η μηχανή. Χειμώνας στα βόρεια: comfort −15 έως −20 °C, liner, ασημοκουβέρτα από κάτω."},{"t":"li","x":"Θερμοφόρα με ζεστό νερό (ζέστανε νερό σε γκαζάκι ΕΞΩ από το αυτοκίνητο)."},{"t":"li","x":"Αν έχεις diesel heater (αυτόνομο καλοριφέρ): ΜΟΝΟ με σωστή εγκατάσταση, εξάτμιση έξω, και ανιχνευτή CO μέσα. Χωρίς ανιχνευτή CO, όχι."},{"t":"li","x":"Αν είσαι εγκλωβισμένος ξύπνιος στο χιόνι: μηχανή μόνο 10 λεπτά κάθε ώρα, εξάτμιση καθαρή από χιόνι, παράθυρο λίγο ανοιχτό."},{"t":"h","x":"Καύσιμα και ασφάλεια"},{"t":"warn","x":"Μπιτόνια βενζίνης/πετρελαίου και φιαλίδια γκαζιού ΠΟΤΕ μέσα στην καμπίνα όπου κοιμάσαι. Αναθυμιάσεις και φωτιά. Έξω, στη σχάρα ή σε κλειστό εξωτερικό κουτί."},{"t":"warn","x":"Ποτέ γκαζάκι, κερί ή μαγκάλι μέσα στο κλειστό αυτοκίνητο."},{"t":"li","x":"Ντεπόζιτο πάντα πάνω από τη μέση. Στο κρύο το diesel θέλει αντιπηκτικό/χειμερινό πετρέλαιο."},{"t":"li","x":"Μην αδειάσεις τη μπαταρία εκκίνησης με φώτα και φορτίσεις. Ιδανικά δεύτερη μπαταρία (dual battery) ή power station."},{"t":"li","x":"Κλείδωσε τις πόρτες, κλειδιά σε σταθερό σημείο (π.χ. στην ίδια τσέπη πάντα), φακός κεφαλής δίπλα σου."},{"t":"h","x":"Μέσα στον υπνόσακο βάζω"},{"t":"li","x":"Τα ρούχα της επόμενης μέρας (ζεστά το πρωί)."},{"t":"li","x":"Το μπουκάλι νερό (να μην παγώσει) και το κινητό/powerbank (το κρύο αδειάζει τις μπαταρίες)."},{"t":"li","x":"Μπουκάλι για ούρηση τη νύχτα (σημαδεμένο!) – δεν βγαίνεις στο κρύο."},{"t":"h","x":"Το πρωί"},{"t":"step","x":"Καθάρισε χιόνι από ταράτσα, τζάμια, φώτα, εξάτμιση ΠΡΙΝ ανάψεις μηχανή."},{"t":"step","x":"Μάζεψε τα πάνελ, αέρισε την καμπίνα."},{"t":"step","x":"Ζέστανε λίγο τη μηχανή, οδήγα ήπια τα πρώτα χιλιόμετρα."},{"t":"h","x":"Αν πρέπει να κινηθείς με το αυτοκίνητο (εκκένωση, χιόνι)"},{"t":"li","x":"Φύγε με φως, πες τη διαδρομή σε κάποιον, ακολούθησε τις οδηγίες των αρχών και τους κεντρικούς δρόμους."},{"t":"li","x":"Αλυσίδες ΜΕΣΑ στο αυτοκίνητο και ξέρεις να τις βάζεις (δοκίμασέ το μια φορά στο σπίτι)."},{"t":"li","x":"Κιτ αυτοκινήτου (δες λίστα), νερό, φαγητό, υπνόσακος για κάθε επιβάτη – μπορεί να μείνεις ώρες ακινητοποιημένος."},{"t":"li","x":"Σε κακοκαιρία: αργά, μεγάλες αποστάσεις, χωρίς απότομα φρένα. Αν δεν βλέπεις, σταμάτα σε ασφαλές σημείο."},{"t":"li","x":"Μην οδηγήσεις ποτέ μέσα σε νερό που τρέχει ή μέσα σε καπνό πυρκαγιάς."}]},{"cat":"wild","id":"w_signal","emoji":"📣","title":"Σήματα για να σε βρουν","sub":"Γίνε ορατός","blocks":[{"t":"li","x":"ΤΡΙΑ από οτιδήποτε = SOS: 3 σφυρίγματα, 3 φωτιές σε τρίγωνο, 3 λάμψεις."},{"t":"li","x":"Σφυρίχτρα: ακούγεται πολύ πιο μακριά από φωνή και δεν κουράζει."},{"t":"li","x":"Καθρέφτης / CD / κινητό: λάμψεις προς αεροπλάνο ή πλοίο. Σημάδεψε με τα δάχτυλα σε σχήμα V."},{"t":"li","x":"Καπνός τη μέρα: πράσινα κλαδιά πάνω σε δυνατή φωτιά = λευκός καπνός."},{"t":"li","x":"Φως τη νύχτα: φακός σε SOS (… – – – …). Στην εφαρμογή: κουμπί 🔦 SOS."},{"t":"li","x":"Φωτεινά ρούχα/πανιά σε ανοιχτό σημείο."},{"t":"h","x":"Σήματα εδάφους προς αεροσκάφος (μεγάλα, 3 m+)"},{"t":"li","x":"V = Χρειάζομαι βοήθεια"},{"t":"li","x":"X = Χρειάζομαι ιατρική βοήθεια"},{"t":"li","x":"Y = Ναι"},{"t":"li","x":"N = Όχι"},{"t":"li","x":"→ (βέλος) = Πάω προς τα εκεί"},{"t":"h","x":"Σήμα με τα χέρια"},{"t":"li","x":"Και τα δύο χέρια ψηλά σε V = «Χρειάζομαι βοήθεια»."},{"t":"li","x":"Ένα χέρι ψηλά, ένα κάτω = «Δεν χρειάζομαι βοήθεια»."},{"t":"h","x":"Morse SOS"},{"t":"li","x":"··· ––– ··· (3 σύντομα, 3 μακριά, 3 σύντομα)."},{"t":"tip","x":"Όλο το αλφάβητο Morse (ελληνικό και λατινικό) και αποστολή λέξεων με φως και ήχο: 🔦 SOS → 📡 Morse."}]},{"cat":"wild","id":"w_navi","emoji":"🌞","title":"Προσανατολισμός χωρίς πυξίδα","sub":"Ήλιος, σκιά, αστέρια","blocks":[{"t":"h","x":"Ο ήλιος"},{"t":"li","x":"Ανατέλλει περίπου ΑΝΑΤΟΛΙΚΑ, δύει περίπου ΔΥΤΙΚΑ. Το μεσημέρι (στην Ελλάδα) είναι ΝΟΤΙΑ."},{"t":"h","x":"Ραβδί και σκιά (πολύ σίγουρο)"},{"t":"step","x":"Κάρφωσε ίσιο ραβδί στο έδαφος. Βάλε πετραδάκι στην άκρη της σκιάς."},{"t":"step","x":"Περίμενε 15–20 λεπτά. Βάλε δεύτερο πετραδάκι στη νέα άκρη."},{"t":"step","x":"Η γραμμή από το 1ο στο 2ο δείχνει ΔΥΣΗ → ΑΝΑΤΟΛΗ."},{"t":"step","x":"Στάσου με το 1ο αριστερά και το 2ο δεξιά: κοιτάς ΒΟΡΡΑ."},{"t":"h","x":"Ρολόι με δείκτες"},{"t":"li","x":"Στρέψε τον ωροδείκτη στον ήλιο. Η μέση ανάμεσα στον ωροδείκτη και στο 12 (στο 1 το καλοκαίρι, λόγω θερινής ώρας) δείχνει ΝΟΤΟ."},{"t":"h","x":"Πολικός Αστέρας (νύχτα)"},{"t":"li","x":"Βρες τη Μεγάλη Άρκτο («κατσαρόλα»). Τα δύο αστέρια της άκρης δείχνουν τον Πολικό, ~5 φορές την απόσταση τους. Ο Πολικός = ΒΟΡΡΑΣ."},{"t":"h","x":"Σημάδια που ΔΕΝ είναι σίγουρα"},{"t":"warn","x":"Τα βρύα «στη βόρεια πλευρά» και τα μυρμήγκια δεν είναι αξιόπιστα. Μην τα εμπιστεύεσαι."},{"t":"tip","x":"Στην Πυξίδα της εφαρμογής: κράτα το κινητό οριζόντια, μακριά από μέταλλα και ηχεία. Αν κάνει λάθος, κάνε «οκτάρια» στον αέρα για να βαθμονομηθεί."}]},{"cat":"wild","id":"w_food","emoji":"🍞","title":"Φαγητό στην ύπαιθρο","sub":"Το τελευταίο που σε απασχολεί","blocks":[{"t":"li","x":"Άνθρωπος υγιής ζει εβδομάδες χωρίς φαγητό. Χωρίς νερό, μην τρως (η πέψη χρειάζεται νερό)."},{"t":"li","x":"Πρώτα τρως ό,τι κουβαλάς, σε μερίδες. Μοίρασε τις θερμίδες – μισή μερίδα για πολλές μέρες."},{"t":"h","x":"Ασφαλέστερες πηγές"},{"t":"li","x":"Ψάρι (μαγειρεμένο καλά). Πετονιά και αγκίστρια χωράνε σε σακουλάκι."},{"t":"li","x":"Θαλασσινά από καθαρά νερά: πεταλίδες, κυδώνια – προσοχή σε κλειστούς κόλπους και μετά από βροχές."},{"t":"li","x":"Σαλιγκάρια: ΜΟΝΟ καλά καθαρισμένα (νηστεία μερών) και καλά βρασμένα."},{"t":"li","x":"Γνωστά φρούτα που ξέρεις 100%: βατόμουρα, σύκα, κούμαρα, κάστανα, καρύδια, αμύγδαλα (γλυκά), χαρούπια."},{"t":"warn","x":"ΠΟΤΕ άγνωστα φυτά, μούρα, μανιτάρια. Δες «Μανιτάρια & άγρια φυτά»."},{"t":"warn","x":"Πικρά αμύγδαλα και πολλά κουκούτσια φρούτων έχουν κυάνιο."}]},{"cat":"wild","id":"w_mush","emoji":"🍄","title":"Μανιτάρια & άγρια φυτά: γιατί ΟΧΙ","sub":"Η πιο συχνή θανατηφόρα παγίδα","blocks":[{"t":"warn","x":"Σε συνθήκες επιβίωσης ΔΕΝ τρώμε άγρια μανιτάρια. Ποτέ με βάση φωτογραφία, εφαρμογή ή «μοιάζει με»."},{"t":"h","x":"Γιατί"},{"t":"li","x":"Ο ΘΑΝΑΤΙΤΗΣ (Amanita phalloides) και οι συγγενείς του φυτρώνουν και στην Ελλάδα και μοιάζουν με φαγώσιμα."},{"t":"li","x":"Τα συμπτώματα αργούν 6–24 ώρες. Όταν φανούν, το συκώτι έχει ήδη πάθει ζημιά. Μπορεί να ακολουθήσει μια «ψεύτικη βελτίωση»."},{"t":"li","x":"Το μαγείρεμα, το ξίδι, το «ασημένιο κουτάλι», το «το έφαγαν τα ζώα» ΔΕΝ ισχύουν. Είναι μύθοι."},{"t":"li","x":"Τα μανιτάρια δίνουν ελάχιστες θερμίδες. Ο κίνδυνος είναι τεράστιος, το κέρδος μηδέν."},{"t":"h","x":"Αν κάποιος έφαγε άγριο μανιτάρι και νιώθει άσχημα (ή δεν είσαι σίγουρος)"},{"t":"step","x":"Κέντρο Δηλητηριάσεων 210 7793777 ή 166 ΑΜΕΣΩΣ – ακόμα κι αν νιώθει καλά."},{"t":"step","x":"Κράτα τα υπόλοιπα μανιτάρια (και αποφάγια) για αναγνώριση."},{"t":"step","x":"Πες ώρα που τα έφαγε και ποιοι έφαγαν. Όλοι στο νοσοκομείο."},{"t":"h","x":"Άγρια φυτά"},{"t":"li","x":"Πολλά δηλητηριώδη μοιάζουν με φαγώσιμα (π.χ. το κώνειο με τον άγριο καρότο/μάραθο, η πικροδάφνη, ο τάτουλας)."},{"t":"li","x":"Τρώμε μόνο χόρτα/φρούτα που ξέρουμε 100% από πριν, όπως τα μάζευε η γιαγιά, και μακριά από δρόμους και ψεκασμένα χωράφια."},{"t":"tip","x":"Για χόμπι: μάθε μανιτάρια με μυκητολογική εταιρεία και εξορμήσεις με ειδικούς. Όχι από εφαρμογές."}]},{"cat":"wild","id":"w_hyg","emoji":"🧼","title":"Υγιεινή και τουαλέτα","sub":"Οι αρρώστιες σκοτώνουν μετά την καταστροφή","blocks":[{"t":"li","x":"Πλύσιμο χεριών πριν φας και μετά την τουαλέτα. ΠΑΝΤΑ."},{"t":"li","x":"Τουαλέτα στη φύση: λάκκος 15–20 cm, 60+ m μακριά από νερό και καταφύγιο, σκέπασε."},{"t":"li","x":"Τουαλέτα στο σπίτι χωρίς νερό: κουβάς με διπλή σακούλα, λίγη χλωρίνη ή στάχτη/πριονίδι μετά από κάθε χρήση, καπάκι, έξω."},{"t":"li","x":"Σκουπίδια: σε κλειστές σακούλες, μακριά από το σπίτι (ποντίκια)."},{"t":"li","x":"Πόδια: στεγνές κάλτσες, έλεγχος για φουσκάλες κάθε βράδυ."},{"t":"li","x":"Δόντια: βούρτσισμα και με αλάτι/μαγειρική σόδα."}]},{"cat":"wild","id":"w_knots","emoji":"🪢","title":"Κόμποι που αξίζει να ξέρεις","sub":"4 κόμποι για όλα","blocks":[{"t":"li","x":"ΚΑΡΙΚΟΜΠΙ / ΘΗΛΙΑ ΣΤΑΘΕΡΗ (bowline): θηλιά που δεν σφίγγει. Διάσωση, δέσιμο σε δέντρο. «Το κουνέλι βγαίνει από την τρύπα, γυρίζει γύρω από το δέντρο και ξαναμπαίνει»."},{"t":"li","x":"ΣΤΑΥΡΟΚΟΜΠΟΣ (clove hitch): δένεις γρήγορα σε στύλο/κλαδί."},{"t":"li","x":"ΣΥΡΤΟΘΗΛΙΑ ΣΚΗΝΗΣ (taut-line hitch): ρυθμιζόμενο τέντωμα για tarp και σκηνή."},{"t":"li","x":"ΣΚΟΤΑΣΤΡΑΒΟΚΟΜΠΟΣ (sheet bend): ενώνεις δύο σχοινιά διαφορετικού πάχους."},{"t":"tip","x":"Μάθε τους στο σπίτι με ένα κορδόνι, μέχρι να τους κάνεις με κλειστά μάτια."}]},{"cat":"wild","id":"w_weather","emoji":"🌦️","title":"Ο καιρός σου μιλάει","sub":"Σημάδια χωρίς πρόγνωση","blocks":[{"t":"li","x":"Σύννεφα που χτίζονται ψηλά σαν πύργοι το απόγευμα = καταιγίδα, κεραυνοί."},{"t":"li","x":"Άλω (κύκλος) γύρω από ήλιο/φεγγάρι = έρχεται υγρασία, συχνά βροχή σε 12–24 ώρες."},{"t":"li","x":"Ξαφνική πτώση θερμοκρασίας και αλλαγή αέρα = μέτωπο."},{"t":"li","x":"Κόκκινος ουρανός το βράδυ: συνήθως καλός καιρός. Κόκκινος το πρωί: συχνά χαλάει."},{"t":"li","x":"Αστραπή: μέτρα δευτερόλεπτα μέχρι τη βροντή ÷ 3 = χιλιόμετρα. Κάτω από 30 δευτερόλεπτα = κάλυψη τώρα."}]},{"cat":"wild","id":"w_after","emoji":"🔄","title":"Μετά τις 72 ώρες","sub":"Οργάνωση για εβδομάδες","blocks":[{"t":"h","x":"Πρώτα"},{"t":"li","x":"Απογραφή: τι νερό, φαγητό, φάρμακα, καύσιμα έχουμε; Για πόσες μέρες;"},{"t":"li","x":"Μερίδες: σχέδιο κατανάλωσης. Πρώτα τα φρέσκα που χαλάνε."},{"t":"li","x":"Βάρδιες: ποιος φέρνει νερό, ποιος μαγειρεύει, ποιος φυλάει, ποιος προσέχει παιδιά/ηλικιωμένους."},{"t":"h","x":"Κοινότητα"},{"t":"li","x":"Οργανωθείτε με τους γείτονες: κοινή κουζίνα, λίστα ποιος χρειάζεται τι, ποιος ξέρει τι (γιατρός, ηλεκτρολόγος, μάστορας)."},{"t":"li","x":"Μάθε πού είναι τα σημεία διανομής βοήθειας και οι δομές φιλοξενίας του δήμου."},{"t":"h","x":"Ασφάλεια"},{"t":"li","x":"Μην επιδεικνύεις αποθέματα. Κλείδωνε."},{"t":"li","x":"Κινήσου σε ομάδες. Πες πού πας και πότε γυρίζεις."},{"t":"li","x":"Πρόσεχε απάτες (ψεύτικοι «υπάλληλοι», ψεύτικες εράνους)."},{"t":"h","x":"Υγεία"},{"t":"li","x":"Νερό καθαρό, πλύσιμο χεριών, τουαλέτα μακριά – σταματάς τις επιδημίες."},{"t":"li","x":"Μικρές πληγές: καθάρισμα καθημερινά (μολύνονται εύκολα)."},{"t":"li","x":"Χρόνιες ασθένειες: ψάξε φαρμακείο/γιατρό νωρίς, πριν τελειώσουν τα φάρμακα."},{"t":"h","x":"Επιστροφή στο σπίτι"},{"t":"li","x":"Μόνο όταν πουν οι αρχές. Έλεγχος για ρωγμές, γκάζι, ρεύμα, νερό. Φωτογράφισε ζημιές για αποζημίωση πριν καθαρίσεις."}]},{"cat":"tips","id":"t_top","emoji":"💡","title":"30 χρυσές συμβουλές","sub":"Από την πράξη","blocks":[{"t":"step","x":"Το καλύτερο κιτ είναι αυτό που έχεις ΜΑΖΙ σου τη στιγμή που χρειάζεται. Μικρό κιτ στην τσάντα, μεσαίο στο αυτοκίνητο, μεγάλο στο σπίτι."},{"t":"step","x":"Μη φυλάς «για όταν γίνει». Χρησιμοποίησε τον εξοπλισμό σου μια φορά σε camping για να ξέρεις ότι δουλεύει."},{"t":"step","x":"Ντεπόζιτο πάντα πάνω από τη μέση."},{"t":"step","x":"Κινητό πάντα φορτισμένο το βράδυ, powerbank πάντα γεμάτο."},{"t":"step","x":"Έχε μετρητά στο σπίτι. Χωρίς ρεύμα δεν δουλεύουν κάρτες και ATM."},{"t":"step","x":"Γράψε τα σημαντικά τηλέφωνα σε χαρτί."},{"t":"step","x":"Φύλαξε παπούτσια και φακό δίπλα στο κρεβάτι (σεισμός τη νύχτα = σπασμένα γυαλιά)."},{"t":"step","x":"Κλειδιά σε σταθερό σημείο δίπλα στην πόρτα."},{"t":"step","x":"Μάθε πού κλείνουν γκάζι, νερό, ρεύμα – και δείξ' το σε όλους."},{"t":"step","x":"Κάνε σεμινάριο πρώτων βοηθειών. Είναι η πιο χρήσιμη γνώση της ζωής σου."},{"t":"step","x":"Στερέωσε έπιπλα στον τοίχο."},{"t":"step","x":"Ανιχνευτής καπνού και CO. Δοκιμή κάθε μήνα."},{"t":"step","x":"Γέμισε μπουκάλια με νερό στα κενά του καταψύκτη."},{"t":"step","x":"Αγόρασε κάθε φορά που πας σούπερ μάρκετ 1–2 πράγματα για το απόθεμα. Σε λίγους μήνες έχεις 2 εβδομάδες."},{"t":"step","x":"Σφυρίχτρα σε κάθε σακίδιο και κλειδιά. Κοστίζει ελάχιστα, σώζει ζωές."},{"t":"step","x":"Κατέβασε offline χάρτες της περιοχής σου στο κινητό από τώρα."},{"t":"step","x":"Ενεργοποίησε το Medical ID (iPhone: Υγεία → Ιατρικό ID / Android: Πληροφορίες έκτακτης ανάγκης) να φαίνεται στην κλειδωμένη οθόνη."},{"t":"step","x":"Κράτα ένα συγγενή σε άλλη πόλη ως «κέντρο επικοινωνίας»."},{"t":"step","x":"SMS περνάει όταν δεν περνούν οι κλήσεις."},{"t":"step","x":"Φωτογράφισε σπίτι και πράγματα (για ασφάλεια/αποζημίωση)."},{"t":"step","x":"Αν φύγεις από το σπίτι, άφησε σημείωμα: πού πήγες, πότε."},{"t":"step","x":"Μάθε τον πλησιέστερο ανοιχτό χώρο συγκέντρωσης και καταφύγιο."},{"t":"step","x":"Ακολούθα τις επίσημες οδηγίες (112, Πολιτική Προστασία), όχι φήμες στα social."},{"t":"step","x":"Στην κρίση: πρώτα ΕΣΥ ασφαλής, μετά βοηθάς τους άλλους (όπως η μάσκα στο αεροπλάνο)."},{"t":"step","x":"Ο πανικός είναι ο μεγαλύτερος εχθρός. ΣΤΑΣΟΥ – ανάσα – σκέψου."},{"t":"step","x":"Μην αγγίζεις ποτέ άγνωστα πυρομαχικά, καλώδια που έπεσαν, νερά πλημμύρας με ρεύμα."},{"t":"step","x":"Κανένα μαγκάλι, γκαζάκι ή γεννήτρια μέσα στο σπίτι. Ποτέ."},{"t":"ste /* ===== 2. Δεδομένα με ήχο (17 τόνοι MFSK, αυτο-χρονιζόμενο) ===== */
const SND={f0:1800,df:200,n:17,mk:1400,ts:.1};
const sndF=i=>i===17?SND.mk:SND.f0+i*SND.df;
function crc8(b){let c=0;for(const x of b){c^=x;for(let i=0;i<8;i++)c=c&0x80?((c<<1)^7)&255:(c<<1)&255}return c}
function sndPack(o){const te=new TextEncoder();let fl=Math.max(0,MKC.indexOf(o.k));const hp=o.la!=null;if(hp)fl|=8;const out=[fl];
 if(hp){const dv=new DataView(new ArrayBuffer(8));dv.setInt32(0,Math.round(o.la*1e5));dv.setInt32(4,Math.round(o.lo*1e5));out.push(...new Uint8Array(dv.buffer))}
 let tx=te.encode(o.x||'');if(tx.length>60){let s=o.x;while(te.encode(s).length>60)s=s.slice(0,-1);tx=te.encode(s)}out.push(...tx);return out}
function sndUnpack(b){const fl=b[0],o={k:MKC[fl&7]||'txt',t:Date.now()};let i=1;if(fl&8){const dv=new DataView(new Uint8Array(b.slice(1,9)).buffer);o.la=dv.getInt32(0)/1e5;o.lo=dv.getInt32(4)/1e5;i=9}const x=new TextDecoder().decode(new Uint8Array(b.slice(i)));if(x)o.x=x;return o}
function sndSyms(p){const fr=[p.length,...p,crc8(p)],s=[];let prev=0;fr.forEach(by=>[by>>4,by&15].forEach(v=>{const t=(prev+1+v)%SND.n;s.push(t);prev=t}));return s}
function sndPCM(p,sr,ts){ts=ts||SND.ts;const seq=[[17,.45],...sndSyms(p).map(t=>[t,ts]),[17,.3]],tot=seq.reduce((a,x)=>a+x[1],0)+.1,N=Math.ceil(tot*sr),y=new Float32Array(N);let ph=0,k=0;
 seq.forEach(([t,d])=>{const n=Math.round(d*sr),w=2*Math.PI*sndF(t)/sr;for(let j=0;j<n&&k<N;j++,k++){ph+=w;y[k]=.85*Math.sin(ph)}});const r=Math.round(.006*sr),e=k;for(let j=0;j<r;j++){y[j]*=j/r;if(e-1-j>=0)y[e-1-j]*=j/r}return y}
let sndPl=null;
function sndSend(rep){cmBuild(o=>{const p=sndPack(o),c=ac(),sl=LS.g('sslow',0)?.16:SND.ts,y=sndPCM(p,c.sampleRate,sl);const n=rep?3:1,gap=Math.round(.5*c.sampleRate),buf=c.createBuffer(1,y.length*n+gap*(n-1),c.sampleRate),ch=buf.getChannelData(0);for(let i=0;i<n;i++)ch.set(y,i*(y.length+gap));
  if(sndPl)try{sndPl.stop()}catch(e){}const s=c.createBufferSource();s.buffer=buf;s.connect(c.destination);s.start();sndPl=s;wake(1);const sec=buf.duration;const st=$('#cms');if(st)st.innerHTML=`🔊 Παίζει… ${sec.toFixed(1)}″ – κράτα το ηχείο προς το άλλο κινητό`;
  s.onended=()=>{sndPl=null;const q=$('#cms');if(q)q.textContent='✅ Στάλθηκε. Αν ο άλλος δεν το έπιασε, ξαναπάτα (ή «3 φορές»).'};CS.push(()=>{try{s.stop()}catch(e){}})},true)}

/* αποκωδικοποιητής: δέχεται διαδοχικές «αποφάσεις τόνου» (−1 = τίποτα) */
function sndDecoder(onMsg,onSt){let cand=-1,cnt=0,acc=-1,state=0,prev=0,nib=[],need=0,lastT=0;
 const reset=()=>{state=0;nib=[];prev=0;need=0};
 return function(t,now){if(t===cand)cnt++;else{cand=t;cnt=1}if(cnt!==3||t<0||t===acc){if(state===2&&now-lastT>900){reset();onSt&&onSt('⏳ Χάθηκε – περιμένω ξανά')}return}
  acc=t;lastT=now;if(t===17){if(state===2&&nib.length)onSt&&onSt('⏳ Διακοπή');reset();state=1;onSt&&onSt('🎵 Ακούω μήνυμα…');return}
  if(state===0)return;state=2;const v=(t-prev-1+SND.n)%SND.n;prev=t;if(v>15){reset();onSt&&onSt('⚠️ Θόρυβος – περιμένω ξανά');return}nib.push(v);
  if(nib.length===2)need=2*((nib[0]<<4|nib[1])+2);if(need&&nib.length>=need){const by=[];for(let i=0;i<nib.length;i+=2)by.push(nib[i]<<4|nib[i+1]);const p=by.slice(1,-1);reset();
   if(crc8(p)===by[by.length-1]){acc=-1;onMsg(p)}else onSt&&onSt('⚠️ Λάθος στη λήψη – ζήτα να το ξαναπαίξει')}else onSt&&onSt(`🎵 Λαμβάνω… ${need?Math.round(100*nib.length/need)+'%':''}`)}}

 const c=ac(),src=c.createMediaStreamSource(st),an=c.createAnalyser();an.fftSize=2048;an.smoothingTimeConstant=0;src.connect(an);const F=new Float32Array(an.frequencyBinCount),bw=c.sampleRate/an.fftSize;
 const bins=[...Array(18)].map((_,i)=>Math.round(sndF(i)/bw)),lo=Math.round(1200/bw),hi=Math.round(5600/bw);
 let lastP='',lastPt=0;const dec=sndDecoder(p=>{const ks=p.join(','),nw=Date.now();if(ks===lastP&&nw-lastPt<20000){lastPt=nw;return}lastP=ks;lastPt=nw;const o=sndUnpack(p);inboxAdd(o,'🔊 Ήχος');const r=$('#sndr');if(r)r.insertAdjacentHTML('afterbegin',msgHtml(o,'🔊 Ελήφθη με ήχο'));const s=$('#snds');if(s)s.textContent='✅ Ελήφθη! Ακούω για επόμενο…'},m=>{const s=$('#snds');if(s)s.textContent=m});
 const cv=$('#sndc'),cx=cv&&cv.getContext('2d');wake(1);
 const iv=setInterval(()=>{an.getFloatFrequencyData(F);const lv=bins.map(b=>Math.max(F[b-1],F[b],F[b+1]));let bi=0;lv.forEach((v,i)=>{if(v>lv[bi])bi=i});const band=Array.from(F.slice(lo,hi)).sort((a,b)=>a-b),med=band[band.length>>1];
  dec(lv[bi]-med>20?bi:-1,performance.now());
  if(cx){cx.fillStyle='#0a1522';cx.fillRect(0,0,600,90);lv.forEach((v,i)=>{const h=Math.max(0,Math.min(86,(v-med)*2));cx.fillStyle=i===17?'#f77f00':(i===bi&&v-med>20?'#2a9d8f':'#3a86ff');cx.fillRect(i*33+4,88-h,26,h)})}},12);
 sndRx=()=>{clearInterval(iv);st.getTracks().forEach(t=>t.stop());try{src.disconnect()}catch(e){}sndRx=null;const b=$('#sndb');if(b)b.textContent='👂 Ξεκίνα να ακούς';const s=$('#snds');if(s)s.textContent=''};CS.push(()=>sndRx&&sndRx());
 $('#sndb').textContent='⏹ Σταμάτα';$('#snds').textContent='👂 Ακούω… (οι μπάρες δείχνουν τους τόνους)'}

async function sdpZip(s){const b=new TextEncoder().encode(s);if(window.CompressionStream){try{const z=new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());let bin='';z.forEach(x=>bin+=String.fromCharCode(x));return 'Z'+btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}catch(e){}}return 'P'+b64u.e(s)}
async function sdpUnzip(c){const t=c[0],d=c.slice(1);if(t==='P')return b64u.d(d);const bin=atob(d.replace(/-/g,'+').replace(/_/g,'/')),u=Uint8Array.from(bin,x=>x.charCodeAt(0));return new TextDecoder().decode(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}
function sdpMin(s){const keep=/^(v=|o=|s=|t=|a=group|m=|c=|a=ice-ufrag|a=ice-pwd|a=fingerprint|a=setup|a=mid|a=sctp-port|a=max-message-size|a=candidate)/;const seen=new Set();

function moDecodeRuns(runs){const on=runs.filter(r=>r[0]).map(r=>r[1]);if(!on.length)return{u:0,lat:'',gr:'',codes:[]};

 if(s.length>=3){let a=s[0],b=s[s.length-1];for(let it=0;it<8;it++){const A=s.filter(x=>Math.abs(x-a)<=Math.abs(x-b)),B=s.filter(x=>Math.abs(x-a)>Math.abs(x-b));if(A.length)a=A.reduce((p,x)=>p+x,0)/A.length;if(B.length)b=B.reduce((p,x)=>p+x,0)/B.length}u=(b/a>2)?(a+b/3)/2:a;
  if(b/a<=2){const offs=runs.filter(r=>!r[0]).map(r=>r[1]).sort((x,y)=>x-y);if(offs.length&&offs[0]<a*.6)u=offs[Math.floor(offs.length*.2)]||a}}
