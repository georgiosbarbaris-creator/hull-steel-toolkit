<!DOCTYPE html>
<html lang="el"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Επιβίωση 72+</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Επιβίωση 72+">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#0a1522">
<style>
:root{--fs:19px;--bg:#0d1b2a;--card:#16283d;--line:#2a4060;--tx:#f4f6f8;--mut:#a9b8c8;--red:#d62828;--org:#f77f00;--grn:#2a9d8f;--yel:#fcbf49;--blu:#3a86ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,"Segoe UI",Roboto,Arial,sans-serif;font-size:var(--fs);line-height:1.45}
header{position:sticky;top:0;z-index:5;background:#0a1522;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;border-bottom:1px solid var(--line)}
header h1{flex:1;font-size:1.05em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:12px;min-width:46px;height:46px;font-size:1em;font-weight:700;padding:0 10px}
main{padding:12px 12px calc(env(safe-area-inset-bottom) + 90px);max-width:760px;margin:0 auto}
.big{display:block;width:100%;border:0;border-radius:18px;padding:20px 14px;margin:0 0 12px;font-size:1.35em;font-weight:800;color:#fff;text-align:center}
.big small{display:block;font-size:.6em;font-weight:500;opacity:.9;margin-top:4px}
.red{background:var(--red)}.org{background:var(--org)}.grn{background:var(--grn)}.blu{background:var(--blu)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center;color:var(--tx);font-size:1em;font-weight:700;min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tile .e{font-size:2.1em;line-height:1}
.tile small{font-weight:400;color:var(--mut);font-size:.72em}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:9px;color:var(--tx);width:100%;text-align:left;font-size:1em}
.row .e{font-size:1.7em;width:1.4em;text-align:center}
.row b{display:block}.row small{color:var(--mut)}
h2{font-size:1.25em;margin:18px 0 8px;color:var(--yel)}
h3{font-size:1.05em;margin:18px 0 6px;color:var(--yel);border-bottom:1px solid var(--line);padding-bottom:4px}
.sub{color:var(--mut);margin:-4px 0 10px}
.step{display:flex;gap:10px;background:var(--card);border-radius:12px;padding:10px 12px;margin:7px 0}
.step .n{flex:none;width:1.8em;height:1.8em;border-radius:50%;background:var(--org);color:#000;font-weight:800;display:flex;align-items:center;justify-content:center}
.li{padding:5px 0 5px 1.1em;position:relative}.li:before{content:"•";position:absolute;left:.2em;color:var(--org)}
.warn{background:#4a1014;border-left:6px solid var(--red);padding:10px 12px;border-radius:10px;margin:8px 0;font-weight:600}
.tip{background:#123a36;border-left:6px solid var(--grn);padding:10px 12px;border-radius:10px;margin:8px 0}
.chk{display:flex;gap:12px;align-items:flex-start;padding:11px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.chk .bx{flex:none;width:1.5em;height:1.5em;border:2px solid var(--mut);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:900}
.chk.on .bx{background:var(--grn);border-color:var(--grn)}.chk.on span{color:var(--mut);text-decoration:line-through}
.bar{height:14px;background:var(--card);border-radius:8px;overflow:hidden;margin:6px 0 2px}.bar i{display:block;height:100%;background:var(--grn)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.btn{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:11px 14px;font-size:.95em;font-weight:700}
.btn.p{background:var(--blu);border-color:var(--blu);color:#fff}.btn.r{background:var(--red);border-color:var(--red);color:#fff}.btn.g{background:var(--grn);border-color:var(--grn);color:#fff}
input,select,textarea{width:100%;font-size:1em;padding:11px;border-radius:10px;border:1px solid var(--line);background:#0a1522;color:var(--tx);margin:4px 0 10px}
label{font-weight:700;color:var(--mut);font-size:.9em}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.phone{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:9px;color:var(--tx);text-decoration:none}
.phone .num{font-size:1.6em;font-weight:900;color:#fff;min-width:3.2em}
.phone.k .num{color:var(--red)}
.comp{position:relative;width:min(78vw,300px);height:min(78vw,300px);margin:8px auto}
.comp svg{width:100%;height:100%}
.hd{text-align:center;font-size:2.6em;font-weight:900;letter-spacing:1px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.coord{font-size:1.15em;text-align:center;font-weight:700}
.muted{color:var(--mut);font-size:.88em}
#ov{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:#fff;color:#000;font-weight:800;padding-bottom:calc(env(safe-area-inset-bottom) + 30px)}
.metro{width:150px;height:150px;border-radius:50%;margin:10px auto;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:2.6em;font-weight:900;transition:transform .08s}
.metro.b{transform:scale(1.15);background:#ff4d4d}
footer{text-align:center;color:var(--mut);font-size:.8em;margin-top:28px}
.wp{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}.wp b{flex:1}
.sel{outline:3px solid var(--yel)}
canvas{width:100%;background:#0a1522;border-radius:12px;border:1px solid var(--line)}
.card{background:#fff;color:#000;border-radius:14px;padding:14px;font-size:1.05em}.card b{color:#900}
.sunt{width:100%;border-collapse:collapse;font-size:.82em;margin:8px 0;font-variant-numeric:tabular-nums}
.sunt th{color:var(--mut);font-weight:600;font-size:.85em;padding:4px 2px;position:sticky;top:62px;background:var(--bg)}
.sunt td{text-align:center;padding:6px 2px;border-bottom:1px solid var(--line)}
.smh td{text-align:left;background:var(--card);color:var(--yel);font-weight:800;padding:10px 8px;cursor:pointer}.smh.cur td{background:#3a2a10}
#al{position:fixed;inset:0;z-index:90;background:#b00000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:6px}
#al .big{max-width:420px}
#gbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#1d3557;color:#fff;text-align:center;font-weight:700;padding:10px 10px calc(env(safe-area-inset-bottom) + 10px);border-top:2px solid var(--blu)}
html.night header,html.night main{filter:grayscale(1) sepia(1) saturate(12) hue-rotate(-50deg) brightness(.55)}html.night,html.night body{background:#000}
</style></head><body>

<script>
const D=[{"cat":"now","id":"quake","emoji":"🏚️","title":"Σεισμός","sub":"Σκύψε – Κάλυψε – Κρατήσου","blocks":[{"t":"h","x":"ΤΩΡΑ, όσο κουνιέται"},{"t":"step","x":"ΣΚΥΨΕ στα γόνατα, για να μη σε ρίξει ο σεισμός."},{"t":"step","x":"ΚΑΛΥΨΕ το κεφάλι και τον λαιμό. Μπες κάτω από γερό τραπέζι ή γραφείο."},{"t":"step","x":"ΚΡΑΤΗΣΟΥ από το πόδι του τραπεζιού μέχρι να σταματήσει το κούνημα."},{"t":"step","x":"Αν δεν έχει τραπέζι: κάτσε δίπλα σε εσωτερικό τοίχο, μακριά από τζάμια, και κάλυψε το κεφάλι με τα χέρια."},{"t":"warn","x":"ΜΗΝ τρέξεις έξω την ώρα του σεισμού. Οι περισσότεροι τραυματίζονται από πράγματα που πέφτουν."},{"t":"warn","x":"ΜΗΝ μπεις σε ασανσέρ. ΜΗΝ σταθείς σε σκάλες ή μπαλκόνι."},{"t":"h","x":"Αν είσαι στο κρεβάτι"},{"t":"li","x":"Μείνε εκεί. Γύρνα μπρούμυτα και κάλυψε το κεφάλι με το μαξιλάρι."},{"t":"h","x":"Αν είσαι έξω"},{"t":"li","x":"Πήγαινε σε ανοιχτό χώρο, μακριά από κτίρια, κολώνες, καλώδια και δέντρα."},{"t":"li","x":"Σκύψε και κάλυψε το κεφάλι."},{"t":"h","x":"Αν οδηγείς"},{"t":"li","x":"Σταμάτα σιγά-σιγά σε ασφαλές σημείο. Όχι κάτω από γέφυρες, κολώνες, καλώδια."},{"t":"li","x":"Μείνε μέσα στο αυτοκίνητο με τη ζώνη μέχρι να σταματήσει."},{"t":"h","x":"Μόλις σταματήσει"},{"t":"step","x":"Έλεγξε αν είσαι καλά εσύ και όσοι είναι μαζί σου."},{"t":"step","x":"Φόρεσε παπούτσια (σπασμένα γυαλιά!)."},{"t":"step","x":"Κλείσε γκάζι/υγραέριο και τον γενικό διακόπτη ρεύματος αν υπάρχει ζημιά ή μυρωδιά."},{"t":"step","x":"Πάρε το σακίδιο έκτακτης ανάγκης και βγες ΗΡΕΜΑ από τις σκάλες."},{"t":"step","x":"Πήγαινε στον χώρο συγκέντρωσης της περιοχής σου (ανοιχτός χώρος)."},{"t":"step","x":"Άκου ραδιόφωνο και τα μηνύματα 112."},{"t":"warn","x":"Μυρίζει γκάζι; ΜΗΝ ανάβεις φως, αναπτήρα ή διακόπτες. Άνοιξε παράθυρα και βγες έξω."},{"t":"warn","x":"Περίμενε μετασεισμούς. Μην ξαναμπείς σε κτίριο με ρωγμές μέχρι να το δει μηχανικός."},{"t":"h","x":"Αν εγκλωβιστείς στα συντρίμμια"},{"t":"step","x":"Μην ανάβεις φωτιά ή σπίρτο."},{"t":"step","x":"Κάλυψε στόμα και μύτη με ύφασμα για τη σκόνη."},{"t":"step","x":"Χτύπα σε σωλήνα ή τοίχο (3 χτυπήματα, παύση) ή φύσα σφυρίχτρα."},{"t":"step","x":"Φώναξε μόνο όταν ακούς διασώστες – κράτα δυνάμεις."},{"t":"step","x":"Μην κουνιέσαι άσκοπα, μη σηκώνεις σκόνη."},{"t":"h","x":"Κοντά στη θάλασσα;"},{"t":"warn","x":"Αν ο σεισμός ήταν δυνατός ή κράτησε πολύ και είσαι στην ακτή: φύγε ΑΜΕΣΩΣ για ψηλά. Δες «Τσουνάμι»."},{"t":"tip","x":"Προετοιμασία: στερέωσε ντουλάπες και βιβλιοθήκες στον τοίχο, βάρη χαμηλά, όχι κάδρα πάνω από το κρεβάτι."},{"t":"tip","x":"Μάθε στα παιδιά το «Σκύψε-Κάλυψε-Κρατήσου» και κάντε άσκηση 2 φορές τον χρόνο."}]},{"cat":"now","id":"quake_night","emoji":"🌙","title":"Σεισμός τη νύχτα","sub":"Στο σκοτάδι, από τον ύπνο","blocks":[{"t":"h","x":"Την ώρα που κουνάει"},{"t":"step","x":"Αν είσαι στο κρεβάτι: ΜΕΙΝΕ εκεί. Γύρνα μπρούμυτα και σκέπασε κεφάλι και σβέρκο με το μαξιλάρι."},{"t":"step","x":"Αν πάνω από το κρεβάτι υπάρχει βαρύ φωτιστικό, ράφι ή κάδρο: κατέβα στο πάτωμα δίπλα στο κρεβάτι, «ΣΚΥΨΕ – ΚΑΛΥΨΟΥ – ΚΡΑΤΗΣΟΥ»."},{"t":"step","x":"ΜΗΝ τρέχεις στο σκοτάδι: σπασμένα γυαλιά, πεσμένα έπιπλα, σκάλες."},{"t":"h","x":"Μόλις σταματήσει"},{"t":"step","x":"Παπούτσια ΠΡΩΤΑ (τα έχεις δίπλα στο κρεβάτι)."},{"t":"step","x":"Φακός – ΟΧΙ αναπτήρας, σπίρτο ή κερί (μπορεί να έχει διαρροή γκαζιού)."},{"t":"step","x":"Φώναξε τα ονόματα όλων. Πήγαινε πρώτα στα παιδιά."},{"t":"step","x":"Μυρίζει γκάζι; Μην ανάβεις διακόπτες, άνοιξε παράθυρα, κλείσε τη φιάλη ή τον γενικό, βγείτε έξω."},{"t":"step","x":"Βγες με ψυχραιμία από τις σκάλες – ΠΟΤΕ ασανσέρ. Πάρε σακίδιο, ζεστά ρούχα, κουβέρτα."},{"t":"step","x":"Πήγαινε στον χώρο συγκέντρωσης ή σε ανοιχτό χώρο, μακριά από κτίρια, κολόνες, καλώδια."},{"t":"warn","x":"Περίμενε μετασεισμούς. Μη γυρίσεις μέσα αν το κτίριο έχει ρωγμές, μέχρι να το δει μηχανικός."},{"t":"h","x":"Ετοίμασε το υπνοδωμάτιο από ΑΠΟΨΕ"},{"t":"chk","x":"Παπούτσια, φακός, γυαλιά, κινητό δίπλα στο κρεβάτι (σε σακουλάκι δεμένο στο πόδι του κρεβατιού)"},{"t":"chk","x":"Σφυρίχτρα φόρεσέ τη – η εξάτμιση δροσίζει."},{"t":"li","x":"Ελαφριά, φαρδιά, ανοιχτόχρωμα βαμβακερά ρούχα. Καπέλο έξω."},{"t":"li","x":"Ελαφρύ φαγητό, φρούτα, αλάτι αν ιδρώνεις πολύ. ΟΧΙ αλκοόλ, λιγότερος καφές."},{"t":"li","x":"Βγες έξω μόνο νωρίς το πρωί ή αργά το απόγευμα."},{"t":"li","x":"Αν το σπίτι δεν παλεύεται: κλιματιζόμενες αίθουσες του δήμου, εκκλησίες, εμπορικά κέντρα, βιβλιοθήκες."},{"t":"h","x":"Φάρμακα στη ζέστη"},{"t":"li","x":"Ινσουλίνη και ορισμένα φάρμακα χαλάνε στη ζέστη. Ειδικές θήκες δροσισμού που βρέχεις με νερό κρατάνε την ινσουλίνη δροσερή για μέρες χωρίς ψυγείο."},{"t":"li","x":"Κάποια φάρμακα (διουρητικά, για πίεση, ψυχιατρικά) αυξάνουν τον κίνδυνο θερμοπληξίας. Ρώτα τον γιατρό σου από πριν."},{"t":"warn","x":"ΠΟΤΕ παιδί ή ζώο μέσα σε σταματημένο αυτοκίνητο – ούτε για 2 λεπτά."},{"t":"h","x":"Θερμοπληξία = ΕΠΕΙΓΟΝ"},{"t":"li","x":"Σημάδια: πολύ ζεστό δέρμα (ξηρό ή ιδρωμένο), μπερδεμένος, παραληρεί, λιποθυμά, σπασμοί, έμετος, πονοκέφαλος."},{"t":"step","x":"Κάλεσε 166 / 112."},{"t":"step","x":"Σε σκιά ή δροσερό χώρο, βγάλε ρούχα."},{"t":"step","x":"Δρόσισέ τον ΑΜΕΣΩΣ και δυνατά: κρύο νερό σε όλο το σώμα + αέρας (βεντάλια, ανεμιστήρας), βρεγμένες πετσέτες που αλλάζεις συνέχεια, πάγος σε λαιμό, μασχάλες, βουβώνες. Αν υπάρχει, βύθιση σε κρύο νερό μέχρι τον λαιμό."},{"t":"step","x":"Νερό να πιει ΜΟΝΟ αν είναι εντελώς ξύπνιος και καταπίνει."}]},{"cat":"now","id":"cold","emoji":"❄️","title":"Κρύο – χιόνι – παγετός","sub":"Ζέστη χωρίς κινδύνους","blocks":[{"t":"h","x":"Στο σπίτι χωρίς θέρμανση"},{"t":"step","x":"Μάζεψε την οικογένεια σε ΕΝΑ δωμάτιο, το μικρότερο, με λίγα παράθυρα."},{"t":"step","x":"Κλείσε τα υπόλοιπα δωμάτια. Κουβέρτες στα παράθυρα, πετσέτες κάτω από τις πόρτες."},{"t":"step","x":"Ντύσου σε στρώσεις: εσωτερικό μάλλινο/θερμικό, fleece, εξωτερικό. Σκούφος (χάνεται πολλή ζέστη από το κεφάλι), κάλτσες μάλλινες."},{"t":"step","x":"Κοιμηθείτε μαζί, με υπόστρωμα κάτω από το στρώμα/sleeping bag – το κρύο έρχεται από κάτω. Ακόμα καλύτερα: στήσε σκηνή μέσα στο δωμάτιο (δες «Σπίτι χωρίς θέρμανση – μικροκλίμα»)."},{"t":"step","x":"Ζεστά ροφήματα και φαγητό. Το σώμα χρειάζεται «καύσιμα» για να ζεσταθεί."},{"t":"step","x":"Μπουκάλι με ζεστό νερό (όχι βραστό) μέσα στο sleeping bag."},{"t":"warn","x":"ΠΟΤΕ μαγκάλι, ψησταριά, γκαζάκι camping ή γεννήτρια μέσα στο σπίτι. Το μονοξείδιο του άνθρακα (CO) δεν μυρίζει και σκοτώνει στον ύπνο."},{"t":"warn","x":"Σόμπα υγραερίου/πετρελαίου: μόνο με αερισμό (χαραμάδα παραθύρου) και ποτέ στον ύπνο."},{"t":"h","x":"Υποθερμία"},{"t":"li","x":"Σημάδια: έντονο τρέμουλο, μετά σταματάει το τρέμουλο (κακό σημάδι!), μπερδεμένα λόγια, νύστα, αδεξιότητα."},{"t":"step","x":"Μέσα σε ζεστό χώρο ή προφυλαγμένο από αέρα."},{"t":"step","x":"Βγάλε τα βρεγμένα ρούχα, βάλε στεγνά."},{"t":"step","x":"Τύλιξε σε κουβέρτες, κεφάλι και λαιμό επίσης. Ζέστανε πρώτα τον κορμό (στήθος, λαιμός, βουβώνες)."},{"t":"step","x":"Ζεστό γλυκό ρόφημα μόνο αν είναι ξύπνιος και καταπίνει."},{"t":"step","x":"Κάλεσε 166 / 112 σε σοβαρή υποθερμία."},{"t":"warn","x":"Χειρίσου τον απαλά. ΜΗΝ τρίβεις χέρια-πόδια. ΜΗΝ δώσεις αλκοόλ."},{"t":"h","x":"Κρυοπαγήματα"},{"t":"li","x":"Λευκό, κηρώδες, αναίσθητο δέρμα σε δάχτυλα, μύτη, αυτιά."},{"t":"li","x":"Ζέστανε σε χλιαρό (όχι καυτό) νερό. Μην τρίβεις. Μην το ξαναζεστάνεις αν μπορεί να ξαναπαγώσει."},{"t":"h","x":"Εγκλωβισμός σε αυτοκίνητο στο χιόνι"},{"t":"step","x":"Μείνε στο αυτοκίνητο. Κάλεσε 112."},{"t":"step","x":"Μηχανή 10 λεπτά κάθε ώρα για ζέστη, με λίγο ανοιχτό παράθυρο."},{"t":"step","x":"ΚΑΘΑΡΙΣΕ την εξάτμιση από χιόνι πριν ανάψεις μηχανή (κίνδυνος CO)."},{"t":"step","x":"Κίνησε χέρια-πόδια, κουβέρτες, μη κοιμάστε όλοι μαζί – ένας ξύπνιος."},{"t":"step","x":"Δέσε κόκκινο ύφασμα στην κεραία."},{"t":"tip","x":"Αναλυτικά: «Σπίτι χωρίς θέρμανση – μικροκλίμα» και «Ύπνος στο αυτοκίνητο»."}]},{"cat":"now","id":"car_snow","emoji":"🚗","title":"Αυτοκίνητο σε χιονοθύελλα","sub":"Κόλλησα στο χιόνι – τι κάνω","blocks":[{"t":"h","x":"Πριν ξεκινήσεις"},{"t":"chk","x":"Δες την πρόγνωση και αν οι δρόμοι είναι ανοιχτοί. Αν λένε «μόνο με αλυσίδες» ή «αποφύγετε τις μετακινήσεις» – μην πας."},{"t":"chk","x":"Γεμάτο ντεπόζιτο, αλυσίδες που ξέρεις να βάζεις, κιτ αυτοκινήτου, sleeping bag ή κουβέρτες, νερό, φαγητό, φτυάρι, φακός"},{"t":"chk","x":"Πες σε κάποιον τη διαδρομή και τι ώρα θα φτάσεις"},{"t":"h","x":"Αν κολλήσεις"},{"t":"step","x":"ΜΕΙΝΕ ΣΤΟ ΑΥΤΟΚΙΝΗΤΟ. Είναι καταφύγιο και φαίνεται από μακριά. Σε χιονοθύελλα χάνεσαι μέσα σε λίγα μέτρα."},{"t":"step","x":"Κάλεσε 112: πες δρόμο, κατεύθυνση, χιλιομετρική πινακίδα ή κοντινό χωριό, πόσα άτομα είστε. Στείλε και τις συντεταγμένες από την πυξίδα/GPS της εφαρμογής."},{"t":"step","x":"Αλάρμ αναμμένα για λίγο κάθε τόσο. Δέσε κάτι χρωματιστό στην κεραία ή στο παράθυρο."},{"t":"step","x":"ΚΑΘΑΡΙΣΕ ΤΗΝ ΕΞΑΤΜΙΣΗ από χιόνι – και ξανά κάθε ώρα."},{"t":"step","x":"Μηχανή 10 λεπτά κάθε ώρα για θέρμανση, με το παράθυρο λίγο ανοιχτό από την πλευρά που δεν φυσάει."},{"t":"warn","x":"Θαμμένη εξάτμιση = το μονοξείδιο μπαίνει μέσα και σκοτώνει στον ύπνο. Αν πονάει το κεφάλι, ζαλίζεσαι ή νυστάζεις παράξενα: σβήσε τη μηχανή, άνοιξε παράθυρα."},{"t":"h","x":"Μείνε ζεστός"},{"t":"li","x":"Όλοι μαζί, κουβέρτες, sleeping bag, κουβέρτα αλουμινίου. Σκούφος, γάντια."},{"t":"li","x":"Κινήσου μέσα στο αυτοκίνητο: χέρια, πόδια, δάχτυλα – για κυκλοφορία."},{"t":"li","x":"Πίνε νερό και τρώγε λίγο λίγο. Χιόνι ΜΗΝ τρως – σε παγώνει. Λιώσε το σε μπουκάλι μέσα στο μπουφάν ή με τη θέρμανση."},{"t":"li","x":"Αν είστε πολλοί: κοιμάστε με βάρδιες – ένας πάντα ξύπνιος να ελέγχει εξάτμιση και θέρμανση."},{"t":"li","x":"Βγες έξω ΜΟΝΟ για να καθαρίσεις την εξάτμιση ή αν βλέπεις βοήθεια ή σπίτι πολύ κοντά. Δέσε σχοινί στο αυτοκίνητο αν δεν βλέπεις."}]},{"cat":"now","id":"micro","emoji":"🏠","title":"Σπίτι χωρίς θέρμανση – μικροκλίμα","sub":"Το σώμα σου είναι η σόμπα","blocks":[{"t":"tip","x":"Όταν πέφτει το ρεύμα για πολλές ώρες τον χειμώνα, το σπίτι γίνεται ένα μεγάλο ψυγείο. Δεν ζεσταίνεις όλο το σπίτι. Ζεσταίνεις έναν ΜΙΚΡΟ χώρο γύρω από το σώμα σου."},{"t":"h","x":"Τι είναι το μικροκλίμα (Σ10)"},{"t":"li","x":"Το σώμα σου βγάζει ζέστη συνέχεια, σαν μικρή σόμπα (περίπου όσο μια λάμπα 100 W)."},{"t":"li","x":"Σε μεγάλο δωμάτιο η ζέστη αυτή χάνεται. Σε μικρό κλειστό χώρο (sleeping bag, σκηνή) μένει γύρω σου και ζεσταίνει τον αέρα."},{"t":"li","x":"Όσο πιο μικρός και πιο καλά μονωμένος ο χώρος, τόσο πιο ζεστός. Γι' αυτό θέλουμε καλό sleeping bag: για να μην «δραπετεύει» η ζέστη μας."},{"t":"li","x":"Στις βόρειες χώρες (Σκανδιναβία, Καναδάς) το κάνουν όταν πέφτει το ρεύμα: στήνουν σκηνή ΜΕΣΑ στο σπίτι."},{"t":"h","x":"Πώς το στήνω – βήμα βήμα"},{"t":"step","x":"Διάλεξε το πιο μικρό δωμάτιο, με λίγα παράθυρα, κατά προτίμηση εσωτερικό ή προς τον ήλιο."},{"t":"step","x":"Κλείσε τα υπόλοιπα δωμάτια. Κουβέρτες στα παράθυρα, πετσέτες κάτω από τις πόρτες, κουρτίνες κλειστές."},{"t":"step","x":"ΣΤΗΣΕ ΣΚΗΝΗ μέσα στο δωμάτιο (δεν θέλει πασσάλους – βάλε βάρη στις γωνίες). Αν δεν έχεις σκηνή: «σπηλιά» από τραπέζι σκεπασμένο με κουβέρτες, ή κουβέρτες κρεμασμένες γύρω από το κρεβάτι."},{"t":"step","x":"ΜΟΝΩΣΗ ΑΠΟ ΚΑΤΩ: ποτέ κατευθείαν σε πλακάκι ή μάρμαρο. Χαλί → υπόστρωμα (foam) → φουσκωτό ή στρώμα → κουβέρτα. Δες «Μόνωση από κάτω»."},{"t":"step","x":"Μέσα στη σκηνή: sleeping bag για κάθε άτομο. Κοιμηθείτε κοντά ο ένας στον άλλο – κάθε άνθρωπος είναι μια ακόμα σόμπα."},{"t":"step","x":"Κουβέρτα αλουμινίου (ασημοκουβέρτα) πάνω από τη σκηνή ή κάτω από το υπόστρωμα, γυαλιστερή πλευρά προς τα μέσα: γυρίζει πίσω τη ζέστη."},{"t":"step","x":"Τη μέρα: μείνετε στο ίδιο δωμάτιο, ντυμένοι σε στρώσεις, με σκούφο. Μπείτε στα sleeping bag και ενώ κάθεστε."},{"t":"h","x":"Το κεφάλι ΕΞΩ από τον υπνόσακο"},{"t":"warn","x":"Μην χώνεις μύτη και στόμα μέσα στο sleeping bag. Η ανάσα βγάζει πολλή υγρασία που μένει στη γέμιση – ο υπνόσακος βρέχεται από μέσα και παγώνει."},{"t":"li","x":"Κράτα το πρόσωπο έξω. Σκούφος, σφίξε την κουκούλα γύρω από το πρόσωπο ώστε να μένει μόνο μια μικρή τρύπα για μύτη και στόμα."},{"t":"li","x":"Buff ή μαντήλι στον λαιμό αν κάνει πολύ κρύο στο πρόσωπο."},{"t":"h","x":"Μόνωση από κάτω"},{"t":"li","x":"Το έδαφος/πάτωμα «ρουφάει» τη ζέστη 10 φορές πιο γρήγορα από τον αέρα. Μόνωση από κάτω είναι πιο σημαντική από κουβέρτα από πάνω."},{"t":"li","x":"Καλύτερα: αφρώδες υπόστρωμα (foam) + φουσκωτό με R-value 4–5+ από πάνω. Τα R-value αθροίζονται."},{"t":"li","x":"Αυτοσχέδια: χαρτόνια (πολλές στρώσεις), χαλιά, στρώμα κρεβατιού στο πάτωμα, μαξιλάρια καναπέ, χοντρές κουβέρτες διπλωμένες, πολυστερίνη."},{"t":"li","x":"Ασημοκουβέρτα κάτω από το υπόστρωμα: επιστρέφει θερμότητα και κόβει την υγρασία του δαπέδου."},{"t":"h","x":"Κόλπα για ζεστό ύπνο"},{"t":"li","x":"Φάε κάτι λιπαρό/ζεστό πριν τον ύπνο (ξηροί καρποί, σοκολάτα, σούπα). Το σώμα χρειάζεται «καύσιμο»."},{"t":"li","x":"Κάνε 2 λεπτά κίνηση (καθίσματα) πριν μπεις στον υπνόσακο – μπαίνεις ζεστός, όχι κρύος."},{"t":"li","x":"Μπουκάλι με ζεστό (όχι βραστό) νερό, καλά κλεισμένο, ανάμεσα στους μηρούς ή στα πόδια."},{"t":"li","x":"Στεγνές μάλλινες κάλτσες ΜΟΝΟ για τον ύπνο. Όχι ρούχα που ίδρωσαν."},{"t":"li","x":"Βάλε τα ρούχα της επόμενης μέρας μέσα στον υπνόσακο – το πρωί είναι ζεστά."},{"t":"li","x":"Ούρησε πριν κοιμηθείς. Έχε δοχείο κοντά για τη νύχτα."},{"t":"warn","x":"ΠΟΤΕ μαγκάλι, ψησταριά, γκαζάκι ή γεννήτρια μέσα στο σπίτι ή μέσα στη σκηνή. Μονοξείδιο (CO) – δεν μυρίζει, σκοτώνει στον ύπνο. Η σκηνή μέσα στο σπίτι είναι μόνο για τη ζέστη του σώματος."},{"t":"tip","x":"Βάλε ανιχνευτή CO με μπαταρία στο δωμάτιο που κοιμάστε."}]},{"cat":"now","id":"bodystove","emoji":"🔥","title":"Το σώμα σου είναι η σόμπα","sub":"Πώς κρατάς τη ζέστη χωρίς θέρμανση","blocks":[{"t":"tip","x":"Το πιο σημαντικό μυστικό του κρύου: το sleeping bag και η κουβέρτα ΔΕΝ ζεσταίνουν. Απλά ΚΡΑΤΑΝΕ τη ζέστη που φτιάχνει το σώμα σου. Η σόμπα είσαι εσύ."},{"t":"h","x":"Πώς δουλεύει (απλά)"},{"t":"li","x":"Το σώμα σου, ξαπλωμένο, βγάζει ζέστη σαν μια λάμπα 80–100 W. Όλη τη νύχτα, χωρίς ρεύμα."},{"t":"li","x":"Το φαγητό είναι το καύσιμο. Χωρίς φαγητό η σόμπα σβήνει."},{"t":"li","x":"Το νερό κρατάει τη σόμπα σε λειτουργία. Αφυδατωμένος κρυώνεις πιο γρήγορα."},{"t":"li","x":"Η δουλειά σου: να ΜΗ χάνεις τη ζέστη – από κάτω (έδαφος), από τον αέρα, από τα βρεγμένα ρούχα."},{"t":"h","x":"Βάλε «καύσιμο» πριν τον ύπνο"},{"t":"step","x":"Φάε κάτι λιπαρό και γλυκό πριν ξαπλώσεις: ξηροί καρποί, χαλβάς, σοκολάτα, φυστικοβούτυρο, τυρί. Τα λιπαρά «καίγονται» αργά, όλη τη νύχτα."},{"t":"step","x":"Πιες κάτι ζεστό και γλυκό (τσάι με μέλι, κακάο)."},{"t":"step","x":"Κάνε 20–30 καθίσματα ή κάμψεις λίγο πριν μπεις στο sleeping bag – να ζεσταθείς, ΟΧΙ να ιδρώσεις."},{"t":"step","x":"Πήγαινε τουαλέτα πριν τον ύπνο. Το σώμα ξοδεύει ζέστη για να κρατάει ζεστή τη γεμάτη κύστη."},{"t":"h","x":"Το κόλπο με το θερμό / το μπουκάλι"},{"t":"step","x":"Βράσε νερό και γέμισε μεταλλικό μπουκάλι ή μπουκάλι που αντέχει βραστό νερό (π.χ. Nalgene). Βίδωσε ΠΟΛΥ καλά και γύρισέ το ανάποδα να δεις ότι δεν στάζει."},{"t":"step","x":"Τύλιξέ το σε κάλτσα ή πετσέτα – ΠΟΤΕ γυμνό πάνω στο δέρμα."},{"t":"step","x":"Βάλ' το μέσα στο sleeping bag 10 λεπτά πριν μπεις, να ζεσταθεί."},{"t":"step","x":"Μετά βάλ' το ανάμεσα στους μηρούς (εκεί περνούν μεγάλες φλέβες και ζεσταίνεται όλο το αίμα) ή στα πόδια."},{"t":"li","x":"Ένα λίτρο βραστό νερό μένει ζεστό 6–8 ώρες μέσα στο sleeping bag. Το πρωί το πίνεις – ζεστό νερό χωρίς να ανάψεις φωτιά."},{"t":"li","x":"Η κλασική θερμοφόρα (λαστιχένια) κάνει την ίδια δουλειά: ζεστό (όχι βραστό) νερό, βγάλε τον αέρα, κλείσε καλά."},{"t":"li","x":"Θερμός (θερμός-φλάσκα) με βραστό νερό δίπλα στο κρεβάτι: ζεστό ρόφημα μέσα στη νύχτα και το πρωί."},{"t":"warn","x":"Μωρά, μικρά παιδιά, ηλικιωμένοι, διαβητικοί: δεν καταλαβαίνουν καλά το κάψιμο. Μόνο χλιαρό μπουκάλι, καλά τυλιγμένο, και έλεγχος."},{"t":"h","x":"Μη χάνεις τη ζέστη"},{"t":"li","x":"ΑΠΟ ΚΑΤΩ χάνεις τα περισσότερα: το πάτωμα και το έδαφος «ρουφάνε» τη ζέστη. Υπόστρωμα, χαρτόνια, κουβέρτες ΚΑΤΩ από σένα – περισσότερα από όσα βάζεις από πάνω."},{"t":"li","x":"Σκούφος και στο κρεβάτι. Καλύπτει κεφάλι και αυτιά που χάνουν πολύ."},{"t":"li","x":"Στεγνές κάλτσες για τον ύπνο, όχι σφιχτές (το σφίξιμο κόβει το αίμα και κρυώνεις)."},{"t":"li","x":"Μην αναπνέεις μέσα στο sleeping bag: η υγρασία της ανάσας το βρέχει και χάνει τη ζέστη του."},{"t":"li","x":"Βρεγμένο ή ιδρωμένο ρούχο = ψυγείο. Άλλαξε αμέσως."},{"t":"li","x":"Κοιμηθείτε μαζί, σε ΕΝΑ δωμάτιο. Τα παιδιά στη μέση. Κάθε άνθρωπος είναι μια σόμπα 100 W – 4 άτομα = 400 W σε ένα μικρό δωμάτιο."},{"t":"li","x":"Μικρό δωμάτιο, κλειστές πόρτες, κουβέρτες ή χαρτόνια στα παράθυρα, πετσέτα στη χαραμάδα της πόρτας."},{"t":"warn","x":"ΟΧΙ αλκοόλ για ζέστη. Σου δίνει ψεύτικη ζέστη αλλά ανοίγει τα αγγεία και χάνεις θερμότητα πιο γρήγορα."},{"t":"warn","x":"ΟΧΙ γκαζάκι, μαγκάλι, κάρβουνα ή ψησταριά σε κλειστό χώρο – το μονοξείδιο σκοτώνει στον ύπνο χωρίς μυρωδιά."},{"t":"h","x":"Υποθερμία: πότε κινδυνεύει κάποιος"},{"t":"li","x":"Αρχή: τρέμει, κρύα χέρια, κόκκινη μύτη. Βάλε στεγνά, φαγητό, ζεστό γλυκό ρόφημα, κίνηση."},{"t":"li","x":"ΚΙΝΔΥΝΟΣ: σκοντάφτει, μπερδεύει τα λόγια, δεν μπορεί να κουμπωθεί, γκρινιάζει ή είναι αδιάφορος."},{"t":"warn","x":"Αν ΣΤΑΜΑΤΗΣΕΙ να τρέμει και είναι μπερδεμένος ή νυσταγμένος: ΣΟΒΑΡΗ ΥΠΟΘΕΡΜΙΑ. Κάλεσε 112/166. Τύλιξέ τον (και από κάτω), μάλλον οριζόντιος, απαλές κινήσεις, ζέστη στον κορμό (μασχάλες, στήθος) – ΟΧΙ τρίψιμο χεριών-ποδιών."}]},{"cat":"now","id":"power","emoji":"💡","title":"Διακοπή ρεύματος","sub":"Φως, ψυγείο, ασφάλεια","blocks":[{"t":"h","x":"Τι κάνω"},{"t":"step","x":"Φακοί – ΟΧΙ κεριά αν γίνεται (φωτιές)."},{"t":"step","x":"Βγάλε από την πρίζα ευαίσθητες συσκευές (όταν έρθει ξανά, κάνει υπέρταση)."},{"t":"step","x":"Άφησε ένα φως αναμμένο για να καταλάβεις πότε ήρθε το ρεύμα."},{"t":"step","x":"Ψυγείο και καταψύκτης ΚΛΕΙΣΤΑ. Το ψυγείο κρατάει ~4 ώρες, ο γεμάτος καταψύκτης ~48 ώρες (μισογεμάτος ~24)."},{"t":"step","x":"Φόρτισε κινητά στο αυτοκίνητο ή με powerbank. Βάλε το κινητό σε εξοικονόμηση ενέργειας."},{"t":"step","x":"Ραδιόφωνο μπαταρίας για ειδήσεις."},{"t":"warn","x":"Γεννήτρια ΜΟΝΟ έξω, μακριά από πόρτες και παράθυρα (τουλάχιστον 6 m). Ποτέ σε γκαράζ ή μπαλκόνι κλειστό."},{"t":"warn","x":"Αν κάποιος στο σπίτι χρειάζεται ιατρικό μηχάνημα με ρεύμα (οξυγόνο κ.λπ.): έχε σχέδιο από πριν και ειδοποίησε τον πάροχο ρεύματος."},{"t":"h","x":"Φαγητό που χάλασε;"},{"t":"li","x":"Αν ψυγείο πάνω από 4 °C για 2+ ώρες: πέτα κρέας, ψάρι, γάλα, αυγά, μαγειρεμένα. «Όταν έχεις αμφιβολία, πέτα το»."},{"t":"tip","x":"Γέμισε τα κενά του καταψύκτη με μπουκάλια νερό. Κρατάει πιο πολύ το κρύο και έχεις πόσιμο νερό."}]},{"cat":"now","id":"homewater","emoji":"🛁","title":"Νερό στο σπίτι: μπανιέρα και κρυφές αποθήκες","sub":"Γέμισε ΠΡΙΝ κοπεί το νερό","blocks":[{"t":"tip","x":"Μόλις ακούσεις για σεισμό, πόλεμο, καταιγίδα ή διακοπή νερού: ΓΕΜΙΣΕ ΤΗ ΜΠΑΝΙΕΡΑ ΑΜΕΣΩΣ. Το νερό στις σωλήνες μπορεί να κοπεί μέσα σε λίγες ώρες."},{"t":"h","x":"Πόσο νερό βγάζει μια μπανιέρα"},{"t":"li","x":"Μικρή μπανιέρα (150 × 70 cm): περίπου 120–150 λίτρα."},{"t":"li","x":"Κανονική μπανιέρα (170 × 70 cm): περίπου 150–200 λίτρα."},{"t":"li","x":"Μεγάλη ή γωνιακή μπανιέρα: 250–350 λίτρα."},{"t":"li","x":"Υπολογισμός για τη δική σου: μάκρος × φάρδος × ύψος νερού σε δεκάμετρα (10 cm = 1 dm) × 0,7 (γιατί τα τοιχώματα είναι λοξά). Παράδειγμα: 16 × 6 × 3,5 × 0,7 ≈ 235 λίτρα."},{"t":"h","x":"Πόσες μέρες σε κρατάει"},{"t":"li","x":"Για ΠΟΣΙΜΟ (4 λίτρα/άτομο/μέρα): 200 λίτρα = 4 άτομα για 12 μέρες."},{"t":"li","x":"Για ΟΛΑ μαζί (πόσιμο, μαγείρεμα, πλύσιμο, τουαλέτα ~10–15 λίτρα/άτομο/μέρα): 200 λίτρα = 4 άτομα για 3–5 μέρες. Γι' αυτό κάνε οικονομία από την πρώτη ώρα."},{"t":"h","x":"Σωστά βήματα"},{"t":"step","x":"Πλύνε γρήγορα τη μπανιέρα (χωρίς πολλά χημικά) και ξέβγαλε."},{"t":"step","x":"Βάλε την τάπα και σφράγισέ τη από πάνω με μεμβράνη ή ταινία – οι τάπες χάνουν σιγά σιγά νερό. Δοκίμασέ το από ΤΩΡΑ μια φορά."},{"t":"step","x":"Γέμισε μέχρι κάτω από την υπερχείλιση."},{"t":"step","x":"Σκέπασε με νάιλον ή σανίδα για σκόνη, ζώα και ΠΑΙΔΙΑ."},{"t":"step","x":"Πάρε νερό με καθαρή κανάτα – όχι με τα χέρια μέσα."},{"t":"warn","x":"Γεμάτη μπανιέρα = κίνδυνος πνιγμού για μικρό παιδί. Κλειστή πόρτα μπάνιου, σκέπασμα, επιτήρηση."},{"t":"warn","x":"Το νερό της μπανιέρας ΔΕΝ είναι καθαρό για πόσιμο. Βράσε 1 λεπτό ή απολύμανε (χλωρίνη: 2 σταγόνες/λίτρο, αναμονή 30 λεπτά) ή φίλτρο. Χωρίς επεξεργασία: μόνο για τουαλέτα και πλύσιμο."},{"t":"tip","x":"Υπάρχουν ειδικές σακούλες-δοχεία για μπανιέρα (100–400 L) με βρυσάκι: κρατούν το νερό καθαρό για πόσιμο. Φθηνές και χρήσιμες."},{"t":"h","x":"Γέμισε ΚΑΙ αυτά"},{"t":"chk","x":"Κατσαρόλες, μπουκάλια, μπιτόνια, κουβάδες – ό,τι κλείνει"},{"t":"chk","x":"Νεροχύτες με τάπα (για πλύσιμο)"},{"t":"chk","x":"Πλυντήριο: βάλε μια πλύση ΤΩΡΑ, μετά δεν θα μπορείς"},{"t":"h","x":"Κρυφές αποθήκες νερού στο σπίτι"},{"t":"li","x":"Θερμοσίφωνας ρεύματος: 60–120 λίτρα. ΚΛΕΙΣΕ πρώτα το ρεύμα του. Κλείσε την παροχή, άνοιξε μια βρύση ζεστού για αέρα, και πάρε νερό από τη βάνα κάτω. Βράσε πριν το πιεις."},{"t":"li","x":"Ηλιακός θερμοσίφωνας στην ταράτσα: 120–200 λίτρα. Μεγάλη αποθήκη που ξεχνάμε."},{"t":"li","x":"Σωλήνες: κλείσε τον γενικό, άνοιξε την πιο ψηλή βρύση για αέρα, μάζεψε από την πιο χαμηλή: 5–20 λίτρα."},{"t":"li","x":"Καζανάκι (ΟΧΙ η λεκάνη): 6–9 λίτρα καθαρό νερό – αν δεν έχει ταμπλέτες χρώματος/χημικά."},{"t":"li","x":"Πάγος από καταψύκτη και υγρό από κονσέρβες λαχανικών/φρούτων."},{"t":"li","x":"Βρόχινο νερό από υδρορροές: για πλύσιμο. Για πόσιμο μόνο με φίλτρο + βράσιμο."},{"t":"warn","x":"Αν οι αρχές πουν ότι το νερό του δικτύου είναι μολυσμένο, ΜΗΝ γεμίσεις από τη βρύση – και κλείσε τον γενικό για να μη μπει βρώμικο νερό στον θερμοσίφωνα."},{"t":"h","x":"Τουαλέτα με λίγο νερό"},{"t":"li","x":"Ένας κουβάς 4–6 λίτρα ρίχνεται γρήγορα και απότομα στη λεκάνη = καζανάκι. Μόνο για τα «μεγάλα»."},{"t":"li","x":"Για τα «μικρά»: σακούλα σκουπιδιών μέσα στη λεκάνη + άμμος γάτας, πριονίδι ή στάχτη. Δένεις και αλλάζεις."}]},{"cat":"now","id":"war","emoji":"🛡️","title":"Πόλεμος – αεροπορική επιδρομή","sub":"Προστασία αμάχων","blocks":[{"t":"h","x":"Σειρήνα / προειδοποίηση επιδρομής"},{"t":"step","x":"Πήγαινε αμέσως σε καταφύγιο, υπόγειο ή υπόγειο σταθμό."},{"t":"step","x":"Αν δεν προλαβαίνεις: εσωτερικό δωμάτιο ή διάδρομος, χαμηλός όροφος, μακριά από παράθυρα. Κανόνας των «2 τοίχων»: βάλε δύο τοίχους ανάμεσα σε σένα και τον δρόμο."},{"t":"step","x":"Μπάνιο ή διάδρομος χωρίς παράθυρα είναι συχνά το καλύτερο μέρος στο διαμέρισμα."},{"t":"step","x":"Αν είσαι έξω: ξάπλωσε μπρούμυτα σε χαντάκι ή πίσω από πεζούλι, χέρια στο κεφάλι, στόμα ελαφρά ανοιχτό."},{"t":"step","x":"Μείνε στο καταφύγιο μέχρι το σήμα λήξης."},{"t":"warn","x":"ΜΗΝ βγαίνεις να δεις ή να φωτογραφίσεις. ΜΗΝ ανεβάζεις στα social βίντεο με θέσεις ή στρατιωτικά οχήματα – μπορεί να βοηθήσει τον εχθρό και να σε βάλει σε κίνδυνο."},{"t":"h","x":"Προετοιμασία σπιτιού"},{"t":"li","x":"Ταινία σε σχήμα Χ στα τζάμια ή αντιθρυμματική μεμβράνη, κουρτίνες κλειστές."},{"t":"li","x":"Συσκότιση το βράδυ αν το ζητήσουν οι αρχές (κουβέρτες/μαύρο πλαστικό)."},{"t":"li","x":"Απόθεμα 2 εβδομάδων: νερό, τρόφιμα, φάρμακα, μπαταρίες, μετρητά."},{"t":"li","x":"Σακίδιο έτοιμο δίπλα στην πόρτα για κάθε μέλος."},{"t":"li","x":"Αντίγραφα εγγράφων (χαρτί + USB), φωτογραφίες των μελών της οικογένειας."},{"t":"h","x":"Αν χωριστεί η οικογένεια"},{"t":"li","x":"Συμφωνήστε από πριν 2 σημεία συνάντησης (ένα κοντά, ένα έξω από την πόλη) και έναν συγγενή μακριά που θα είναι «κέντρο επικοινωνίας»."},{"t":"li","x":"Στα παιδιά: καρτέλα στην τσέπη με όνομα, τηλέφωνα, ομάδα αίματος, αλλεργίες."},{"t":"h","x":"Μετακίνηση – σημεία ελέγχου"},{"t":"li","x":"Ήρεμα, χέρια ορατά, απαντάς σύντομα και αληθινά. Έγγραφα σε εύκολη τσέπη."},{"t":"li","x":"Κινήσου τη μέρα, σε γνωστούς δρόμους, ακολούθησε τους επίσημους διαδρόμους απομάκρυνσης."},{"t":"li","x":"Μην φοράς παραλλαγή ή ρούχα που μοιάζουν στρατιωτικά."},{"t":"h","x":"Ύποπτα αντικείμενα / πυρομαχικά"},{"t":"warn","x":"ΜΗΝ αγγίζεις, μη σηκώνεις, μην κλοτσάς άγνωστο μεταλλικό αντικείμενο, οβίδα, νάρκη, drone που έπεσε."},{"t":"step","x":"Σταμάτα. Γύρνα πίσω από τα ίδια σου τα βήματα."},{"t":"step","x":"Σημάδεψε το σημείο από απόσταση (πέτρες, ύφασμα)."},{"t":"step","x":"Ειδοποίησε 100 / 112."},{"t":"step","x":"Δίδαξε τα παιδιά: «Δεν αγγίζω, φεύγω, λέω σε μεγάλο»."},{"t":"h","x":"Drones"},{"t":"li","x":"Αν ακούς drone από κοντά: μπες σε κτίριο ή κάτω από δέντρα/κάλυψη, μην κοιτάς και μην τρέχεις σε ανοιχτό χώρο."},{"t":"tip","x":"Μάθε από τώρα πού είναι τα πλησιέστερα καταφύγια και υπόγειοι χώροι στη γειτονιά σου, στη δουλειά και στο σχολείο των παιδιών."}]},{"cat":"now","id":"nuclear","emoji":"☢️","title":"Πυρηνική έκρηξη – ραδιενέργεια","sub":"Μπες μέσα – Μείνε μέσα – Ενημερώσου","blocks":[{"t":"h","x":"Αν δεις λάμψη / έκρηξη"},{"t":"step","x":"ΜΗΝ κοιτάξεις τη λάμψη."},{"t":"step","x":"Πέσε μπρούμυτα πίσω από ό,τι προστατεύει, κάλυψε κεφάλι και χέρια κάτω από το σώμα."},{"t":"step","x":"Μείνε κάτω μέχρι να περάσει το ωστικό κύμα (μπορεί να έρθει δευτερόλεπτα έως και λεπτά μετά)."},{"t":"h","x":"Μετά: η ραδιενεργή σκόνη (fallout)"},{"t":"li","x":"Η επικίνδυνη σκόνη πέφτει μέσα σε 10–30 λεπτά. Έχεις λίγο χρόνο να μπεις σε καλό κτίριο."},{"t":"step","x":"ΜΠΕΣ ΜΕΣΑ στο πιο γερό κτίριο που βρίσκεις (μπετό, τούβλο)."},{"t":"step","x":"Πήγαινε στο υπόγειο ή στη ΜΕΣΗ του κτιρίου, μακριά από εξωτερικούς τοίχους και ταράτσα. Σε πολυκατοικία: μεσαίοι όροφοι στο κέντρο είναι καλοί."},{"t":"step","x":"Κλείσε πόρτες, παράθυρα, κλιματισμό, εξαερισμό."},{"t":"step","x":"ΜΕΙΝΕ ΜΕΣΑ τουλάχιστον 24 ώρες, εκτός αν οι αρχές πουν κάτι άλλο. Η ραδιενέργεια πέφτει γρήγορα: μετά από 7 ώρες ~10 φορές λιγότερη, μετά από 2 μέρες ~100 φορές λιγότερη."},{"t":"step","x":"ΕΝΗΜΕΡΩΣΟΥ από ραδιόφωνο μπαταρίας και 112."},{"t":"warn","x":"Μην μπεις σε αυτοκίνητο για να φύγεις αν δεν σου το πουν. Το αυτοκίνητο δεν προστατεύει από τη ραδιενέργεια."},{"t":"h","x":"Απορρύπανση (αν ήσουν έξω)"},{"t":"step","x":"Πριν μπεις στον καθαρό χώρο, βγάλε τα εξωτερικά ρούχα – φεύγει έτσι το μεγαλύτερο μέρος της σκόνης."},{"t ","sub":"Τι πρέπει να έχουμε συμφωνήσει","blocks":[{"t":"chk","x":"Ξέρουν όλοι το 112 και πότε το καλούν"},{"t":"chk","x":"Σημείο συνάντησης κοντά στο σπίτι"},{"t":"chk","x":"Σημείο συνάντησης έξω από τη γειτονιά/πόλη"},{"t":"chk","x":"Συγγενής «κέντρο επικοινωνίας» σε άλλη πόλη"},{"t":"chk","x":"Ξέρουμε πού κλείνει γκάζι, νερό, ρεύμα"},{"t":"chk","x":"Ξέρουμε 2 διαδρομές εξόδου από το σπίτι και από τη γειτονιά"},{"t":"chk","x":"Ξέρουμε το πλησιέστερο καταφύγιο / ανοιχτό χώρο συγκέντρωσης"},{"t":"chk","x":"Ξέρουμε το σχέδιο του σχολείου για τα παιδιά"},{"t":"chk","x":"Κάθε μέλος έχει σακίδιο"},{"t":"chk","x":"Άσκηση σεισμού και φωτιάς 2 φορές τον χρόνο"},{"t":"chk","x":"Έλεγχος αποθεμάτων και λήξεων κάθε 6 μήνες (π.χ. Μάρτιο και Σεπτέμβριο)"},{"t":"chk","x":"Μάθαμε ΚΑΡΠΑ και πρώτες βοήθειες"},{"t":"chk","x":"Ξέρουμε ποιος γείτονας χρειάζεται βοήθεια"},{"t":"chk","x":"Συμπληρώσαμε την «Κάρτα μου» σε αυτή την εφαρμογή"}]},{"cat":"gear","id":"g_sleep","emoji":"🛏️","title":"Κουβέρτα ή sleeping bag;","sub":"Τι ζεσταίνει καλύτερα","blocks":[{"t":"h","x":"Σύντομη απάντηση"},{"t":"li","x":"Για ΥΠΝΟ σε κρύο: sleeping bag + υπόστρωμα. Ζεσταίνει πολύ περισσότερο ανά κιλό."},{"t":"li","x":"Για ΣΠΙΤΙ, ΑΥΤΟΚΙΝΗΤΟ, ΦΩΤΙΑ: μάλλινη κουβέρτα. Ανθεκτική, δεν παίρνει εύκολα φωτιά, ζεσταίνει και βρεγμένη."},{"t":"li","x":"Για ΣΑΚΙΔΙΟ: κουβέρτα αλουμινίου (έκτακτη) + sleeping bag αν χωράει."},{"t":"h","x":"Σύγκριση"},{"t":"li","x":"Μάλλινη κουβέρτα: + ζεσταίνει βρεγμένη, δύσκολα καίγεται, αντέχει χρόνια, πολλές χρήσεις (αναρτήρας, φορείο). − βαριά (2–3 kg), ογκώδης."},{"t":"li","x":"Fleece κουβέρτα: + ελαφριά, φθηνή, στεγνώνει γρήγορα. − λιώνει στη φωτιά, λιγότερη ζέστη."},{"t":"li","x":"Βαμβακερή κουβέρτα: − βρεγμένη δεν ζεσταίνει καθόλου. Όχι για επιβίωση."},{"t":"li","x":"Κουβέρτα αλουμινίου (mylar): + 60 γραμμάρια, κόβει αέρα, κρατάει ζέστη σώματος, σήμα. − σκίζεται, κάνει υγρασία μέσα. Μόνο για έκτακτη ανάγκη."},{"t":"li","x":"Bivy / σάκος επιβίωσης (σαν mylar σακούλα): καλύτερο από κουβέρτα αλουμινίου, ~100–300 g."},{"t":"h","x":"Sleeping bag: τι κοιτάω"},{"t":"li","x":"Θερμοκρασία COMFORT (ISO 23537 / EN 13537): εκεί κοιμάσαι άνετα. Το LIMIT είναι για «επιβίωση με κρύο». Το EXTREME αγνόησέ το."},{"t":"li","x":"Νότια Ελλάδα / νησιά, χειμώνας: comfort περίπου 0 °C έως −5 °C. Καλοκαίρι: +10 °C."},{"t":"li","x":"ΒΟΡΕΙΑ Ελλάδα, ορεινά, χειμερινοί μήνες (και σπίτι χωρίς ρεύμα): comfort −15 °C έως −20 °C. Ένα σπίτι χωρίς θέρμανση στη Φλώρινα ή στο Μέτσοβο πέφτει κάτω από το μηδέν μέσα σε λίγες μέρες."},{"t":"li","x":"Καλύτερα πιο ζεστό παρά πιο κρύο: αν ζεσταίνεσαι, ανοίγεις το φερμουάρ. Αν κρυώνεις, δεν μπορείς να κάνεις τίποτα."},{"t":"li","x":"Πούπουλο (down): ελαφρύ, μικρό όγκο, ζεστό – αλλά βρεγμένο δεν ζεσταίνει. Fill power 600+."},{"t":"li","x":"Συνθετικό: βαρύτερο και ογκωδέστερο, αλλά ζεσταίνει και υγρό. Καλύτερο για σπίτι/αυτοκίνητο/υγρασία."},{"t":"li","x":"Σχήμα «μούμια» κρατάει πιο πολλή ζέστη. Θέλει κουκούλα με κορδόνι."},{"t":"li","x":"Πρόσθετο: liner (εσωτερικός σάκος) +2 έως +5 °C."},{"t":"h","x":"Το κεφάλι έξω"},{"t":"li","x":"Κράτα μύτη και στόμα ΕΞΩ από τον υπνόσακο. Η ανάσα μέσα = υγρασία = βρεγμένη γέμιση = κρύο. Σφίξε την κουκούλα γύρω από το πρόσωπο και φόρα σκούφο."},{"t":"h","x":"Ασημοκουβέρτα (κουβέρτα αλουμινίου): όλοι μία μαζί"},{"t":"li","x":"60 γραμμάρια, μικρότερη από πορτοφόλι, γυρίζει πίσω τη ζέστη του σώματος. Κάθε μέλος της οικογένειας μία στο σακίδιο, μία στο αυτοκίνητο, μία στο μπουφάν."},{"t":"li","x":"Χρήση: κάτω από το υπόστρωμα, ή τυλιγμένη ΕΞΩ από τον υπνόσακο/κουβέρτα. Μέσα στον υπνόσακο μόνο για 1 νύχτα έκτακτης ανάγκης (κρατάει την υγρασία)."},{"t":"li","x":"Σε ναυάγιο/τραυματία: τυλίγεις όλο το σώμα και το κεφάλι, αφήνεις ελεύθερο το πρόσωπο."},{"t":"h","x":"ΥΠΟΣΤΡΩΜΑ: το πιο ξεχασμένο"},{"t":"li","x":"Το έδαφος σου «ρουφάει» τη ζέστη. Χωρίς μόνωση κρυώνεις και με το καλύτερο sleeping bag."},{"t":"li","x":"Δείκτης R-value: καλοκαίρι 2, χειμώνας 4+, χιόνι 5+. Δύο υποστρώματα μαζί = αθροίζονται."},{"t":"li","x":"Αφρώδες (foam): δεν τρυπιέται, φθηνό. Φουσκωτό: άνετο, μικρό, αλλά θέλει κιτ επισκευής."},{"t":"tip","x":"Κοιμήσου με ΣΤΕΓΝΑ ρούχα και σκούφο. Φάε κάτι λιπαρό πριν τον ύπνο. Ούρησε πριν κοιμηθείς – το σώμα δεν ζεσταίνει άσκοπα υγρά."}]},{"cat":"gear","id":"g_swag","emoji":"🛌","title":"Swag, bivy και μονές σκηνές","sub":"Κρεβάτι-καταφύγιο για ένα άτομο","blocks":[{"t":"li","x":"SWAG (Αυστραλία): καραβόπανο αδιάβροχο με ενσωματωμένο στρώμα αφρού και μικρή «σκηνή» από πάνω. Ανοίγει σε 1 λεπτό, μέσα βάζεις τον υπνόσακο. Ιδανικό για overlanding, ταράτσα αυτοκινήτου, αλλά και ΜΕΣΑ στο σπίτι όταν δεν έχει θέρμανση."},{"t":"li","x":"BIVY (bivvy bag): αδιάβροχος σάκος που μπαίνει πάνω από τον υπνόσακο. Κόβει τον αέρα, προσθέτει 3–5 °C, ελαφρύς (300–700 g). Κάποια έχουν τόξο πάνω από το κεφάλι σαν μίνι σκηνή."},{"t":"li","x":"Σάκος επιβίωσης (emergency bivy, ασημένιος): 100–300 g, για το σακίδιο και το αυτοκίνητο. Καλύτερος από απλή ασημοκουβέρτα γιατί κλείνει γύρω σου."},{"t":"h","x":"Ο συνδυασμός που δουλεύει στο κρύο"},{"t":"step","x":"Μόνωση από κάτω (foam + φουσκωτό ή το στρώμα του swag)."},{"t":"step","x":"Υπνόσακος comfort −15 έως −20 °C για βόρεια Ελλάδα/βουνό τον χειμώνα."},{"t":"step","x":"Liner μέσα (+2 έως +5 °C)."},{"t":"step","x":"Bivy ή swag από έξω (αέρας, υγρασία, +3–5 °C)."},{"t":"step","x":"Ασημοκουβέρτα κάτω από όλα ή από πάνω σε πολύ κρύο."},{"t":"step","x":"Σκούφος, κάλτσες μάλλινες, πρόσωπο έξω."},{"t":"tip","x":"Όλα αυτά δουλεύουν και μέσα σε κρύο σπίτι: ένα swag ή μια μικρή σκηνή στο σαλόνι κάνει τεράστια διαφορά."}]},{"cat":"gear","id":"g_tent","emoji":"⛺","title":"Σκηνή – καταφύγιο","sub":"Χρειάζομαι σκηνή;","blocks":[{"t":"li","x":"Για καταστροφή στην πόλη: συνήθως ΟΧΙ. Δομές φιλοξενίας, συγγενείς, αυτοκίνητο. Μια σκηνή βοηθάει όμως αν δεν μπορείς να μείνεις σε σπίτι μετά από σεισμό."},{"t":"li","x":"Για έξω από την πόλη/βουνό: ναι, ή tarp (μουσαμάς) + σχοινί που είναι ελαφρύτερο."},{"t":"h","x":"Τι κοιτάω σε σκηνή"},{"t":"li","x":"3 εποχών για Ελλάδα. 4 εποχών μόνο για χιόνι/βουνό."},{"t":"li","x":"Στήσιμο σε 5 λεπτά από 1 άτομο. Δοκίμασέ το στο σπίτι πρώτα."},{"t":"li","x":"Υδροστατική στήλη: πανί 2000+ mm, πάτος 3000+ mm."},{"t":"li","x":"Χωρητικότητα: πάρε 1 άτομο μεγαλύτερη (2 άτομα → σκηνή 3 ατόμων) για πράγματα."},{"t":"li","x":"Οικογενειακή σκηνή: μπορεί να γίνει «δωμάτιο» μετά από σεισμό στον κήπο."},{"t":"h","x":"Tarp (μουσαμάς)"},{"t":"li","x":"3×3 m με κρίκους, 300–600 g. Χίλιοι τρόποι στησίματος. Μαζί με σχοινί και πασσαλάκια."},{"t":"li","x":"Φθηνή λύση: χοντρό νάιλον οικοδομής + σχοινί."},{"t":"tip","x":"Πάντα στήνεις σε ψηλότερο σημείο από νερό, ΠΟΤΕ σε ξερό ρέμα (πλημμύρα) και ΠΟΤΕ κάτω από ξερό κλαδί."}]},{"cat":"gear","id":"g_light","emoji":"🔦","title":"Φακοί και φωτισμός","sub":"Τι να πάρω","blocks":[{"t":"li","x":"Φακός ΚΕΦΑΛΗΣ (headlamp) για κάθε μέλος: ελεύθερα χέρια. Ο πιο χρήσιμος φακός."},{"t":"li","x":"Φανάρι LED για το δωμάτιο/τραπέζι."},{"t":"li","x":"Φακός χειρός γερός, αδιάβροχος IPX4 ή καλύτερα IPX7."},{"t":"h","x":"Τι κοιτάω"},{"t":"li","x":"Μπαταρίες: προτίμησε ΑΑ ή ΑΑΑ – βρίσκονται παντού. Ή επαναφορτιζόμενο με USB-C + εφεδρικές."},{"t":"li","x":"Lumens: 200–400 φτάνουν για τα πάντα. Τα 3000 lumens τελειώνουν την μπαταρία σε λίγο."},{"t":"li","x":"Χαμηλή στάθμη (5–20 lm) που κρατάει 50+ ώρες – αυτή χρησιμοποιείς τις περισσότερες ώρες."},{"t":"li","x":"Κόκκινο φως: δεν χαλάει τη νυχτερινή όραση, δεν ξυπνάει τους άλλους."},{"t":"li","x":"Λειτουργία SOS/strobe."},{"t":"li","x":"Μπαταρίες λιθίου ΑΑ: αντέχουν κρύο και 10–20 χρόνια αποθήκευση. Οι αλκαλικές μπορεί να «τρέξουν» – βγάλ' τες από φακούς που φυλάς."},{"t":"h","x":"Κεριά;"},{"t":"li","x":"Μόνο σε σταθερή βάση, μακριά από κουρτίνες, ποτέ στον ύπνο, ποτέ με παιδιά μόνα. Προτίμησε LED."},{"t":"tip","x":"Δέσε ένα headlamp πάνω σε μπουκάλι νερό με το φως προς το μπουκάλι = φανάρι για όλο το δωμάτιο."}]},{"cat":"gear","id":"g_power","emoji":"🔋","title":"Ενέργεια – φόρτιση","sub":"Powerbank, ηλιακό, γεννήτρια","blocks":[{"t":"li","x":"Powerbank 10.000 mAh ≈ 2 φορτίσεις κινητού. 20.000 mAh ≈ 4. Φόρτιζέ τα κάθε 3 μήνες."},{"t":"li","x":"Ηλιακό πάνελ πτυσσόμενο 20–30 W: φορτίζει κινητό τη μέρα (μόνο σε ήλιο)."},{"t":"li","x":"Power station (μπαταρία μεγάλη 300–1000 Wh): φως, ρούτερ, ιατρικά μηχανήματα, φόρτιση. Ασφαλής μέσα στο σπίτι. Με ηλιακό πάνελ = ανεξαρτησία."},{"t":"li","x":"Γεννήτρια βενζίνης: πολλή ενέργεια αλλά θόρυβος, καύσιμο, και ΜΟΝΟ έξω (μονοξείδιο)."},{"t":"li","x":"Φορτιστής αυτοκινήτου USB."},{"t":"tip","x":"Κινητό: λειτουργία χαμηλής ενέργειας, χωρίς δεδομένα/Bluetooth, σκοτεινή οθόνη, όχι βίντεο. Λειτουργία πτήσης όταν δεν χρειάζεσαι σήμα. Το GPS δουλεύει και σε λειτουργία πτήσης στα περισσότερα κινητά."}]},{"cat":"gear","id":"g_solar","emoji":"☀️","title":"Ηλιακά πάνελ: σωστή χρήση","sub":"Ρεύμα από τον ήλιο όταν όλα έχουν πέσει","blocks":[{"t":"tip","x":"Ένα ηλιακό πάνελ με μια μπαταρία (power station ή powerbank) είναι η μόνη πηγή ρεύματος που δεν τελειώνει. Σε κρίση πολλών ημερών είναι ζωτικής σημασίας."},{"t":"h","x":"Τα δύο νούμερα που πρέπει να ξέρεις"},{"t":"li","x":"W (Watt) = πόσο «δυνατό» είναι κάτι ΤΩΡΑ. Πάνελ 100 W, λάμπα 5 W."},{"t":"li","x":"Wh (βατώρες) = πόση ενέργεια χωράει ή ξοδεύεται. Μπαταρία 500 Wh. Λάμπα 5 W για 10 ώρες = 50 Wh."},{"t":"li","x":"Σαν βρύση και ντεπόζιτο: τα W είναι πόσο ανοιχτή είναι η βρύση, τα Wh πόσο νερό έχει το ντεπόζιτο."},{"t":"h","x":"Πόσο βγάζει στην πράξη"},{"t":"li","x":"Ένα πάνελ δίνει στην πράξη περίπου 50–70% των W που γράφει. Πάνελ 100 W ≈ 60–70 W σε καλό ήλιο."},{"t":"li","x":"Ελλάδα: ~3 ώρες «δυνατού ήλιου» τον χειμώνα, ~6–7 το καλοκαίρι."},{"t":"li","x":"Παράδειγμα: πάνελ 100 W τον χειμώνα ≈ 100 × 3 × 0,7 ≈ 200 Wh τη μέρα. Το καλοκαίρι ≈ 450 Wh."},{"t":"li","x":"Συννεφιά: πέφτει στο 10–25%. Σκιά: σχεδόν μηδέν."},{"t":"h","x":"Τι μπορώ να τροφοδοτήσω με 200 Wh τη μέρα"},{"t":"li","x":"Κινητό: ~15 Wh η πλήρης φόρτιση → 10+ κινητά."},{"t":"li","x":"Λάμπα LED 5 W: 40 ώρες φως."},{"t":"li","x":"Ραδιόφωνο: πρακτικά όλη μέρα."},{"t":"li","x":"Ρούτερ internet 10 W: ~20 ώρες (αν υπάρχει γραμμή)."},{"t":"li","x":"Laptop: 3–4 φορτίσεις."},{"t":"warn","x":"Ψυγείο, ηλεκτρική σόμπα, κλιματιστικό, βραστήρας, πιστολάκι: ΟΧΙ με μικρό σύστημα. Ένας βραστήρας 2000 W αδειάζει μια μπαταρία 500 Wh σε 15 λεπτά."},{"t":"h","x":"Σωστή χρήση – βήμα βήμα"},{"t":"step","x":"Βάλε το πάνελ ΕΞΩ. Πίσω από τζάμι χάνει 30–60% (τα σύγχρονα θερμομονωτικά τζάμια ακόμα περισσότερο)."},{"t":"step","x":"Στρέψ' το προς τον ΝΟΤΟ (με την πυξίδα της εφαρμογής)."},{"t":"step","x":"Κλίση: τον ΧΕΙΜΩΝΑ σχεδόν όρθιο (~55° από το έδαφος). Το ΚΑΛΟΚΑΙΡΙ πιο ξαπλωτό (~25°). Απλό τεστ: η σκιά του πάνελ πίσω του να είναι η μικρότερη δυνατή."},{"t":"step","x":"Γύρνα το προς τον ήλιο κάθε 2–3 ώρες: πρωί ανατολικά, μεσημέρι νότια, απόγευμα δυτικά. Κερδίζεις 20–40%."},{"t":"step","x":"ΚΑΜΙΑ σκιά – ούτε κλαδί, ούτε κάγκελο. Λίγη σκιά σε ένα κομμάτι ρίχνει ΟΛΟ το πάνελ."},{"t":"step","x":"Καθάρισε σκόνη, χιόνι, φύλλα με ένα πανί."},{"t":"step","x":"Άφησε αέρα από πίσω: η πολλή ζέστη ρίχνει την απόδοση."},{"t":"h","x":"Το μεγάλο μυστικό: φόρτιζε ΜΠΑΤΑΡΙΑ, όχι κινητό"},{"t":"li","x":"Τη μέρα: πάνελ → powerbank ή power station. Το βράδυ: μπαταρία → κινητό, φως, ραδιόφωνο."},{"t":"li","x":"Όταν περνάει σύννεφο, το κινητό σταματάει και ξαναρχίζει τη φόρτιση και κουράζεται. Η μπαταρία στη μέση το προστατεύει."},{"t":"li","x":"Ξεκίνα να φορτίζεις από το ΠΡΩΙ. Ο ήλιος της μέρας δεν ξαναγυρίζει."},{"t":"h","x":"Τι να αγοράσω"},{"t":"chk","x":"Πτυσσόμενο πάνελ 60–100 W με έξοδο USB-C (PD) και DC – για σακίδιο και αυτοκίνητο"},{"t":"chk","x":"Power station 300–1000 Wh (μπαταρία LiFePO4: πιο ασφαλής, χιλιάδες κύκλοι) με είσοδο ηλιακού (MPPT)"},{"t":"chk","x":"Ταίριαξε ΦΙΣΕΣ πριν την κρίση (MC4, Anderson, DC8020, USB-C). Δοκίμασε όλο το σύστημα μια φορά"},{"t":"chk","x":"Μικρό πάνελ 10–20 W + powerbank 20.000 mAh για κάθε σακίδιο"},{"t":"chk","x":"Κοντά καλώδια (μακρύ καλώδιο = χαμένη ενέργεια)"},{"t":"h","x":"Ασφάλεια"},{"t":"warn","x":"Μπαταρίες λιθίου: όχι σε καυτό αυτοκίνητο το καλοκαίρι, όχι σκεπασμένες ενώ φορτίζουν, όχι δίπλα σε κρεβάτι παιδιού. Αν φουσκώσουν, μυρίσουν ή καπνίσουν: βγάλ' τες έξω και απομακρύνσου."},{"t":"li","x":"Τα πτυσσόμενα πάνελ αντέχουν ψιχάλα, αλλά οι υποδοχές και το κουτάκι στο πίσω μέρος ΟΧΙ. Μάζεψέ τα στη βροχή."},{"t":"li","x":"Ιατρικά μηχανήματα (CPAP, συμπυκνωτής οξυγόνου): μέτρησε από ΤΩΡΑ πόσα W τραβάνε και πόσες ώρες χρειάζεσαι. Αυτά έχουν την πρώτη προτεραιότητα στο ρεύμα."},{"t":"li","x":"Το αυτοκίνητο είναι κι αυτό γεννήτρια: φορτίζει USB με τη μηχανή αναμμένη – ΜΟΝΟ έξω, ποτέ σε κλειστό γκαράζ."}]},{"cat":"gear","id":"g_radio","emoji":"📻","title":"Ραδιόφωνο","sub":"Η μόνη ενημέρωση όταν πέσουν όλα","blocks":[{"t":"li","x":"FM + AM (μεσαία) τουλάχιστον. Μανιβέλα + ηλιακό + μπαταρίες ΑΑ = 3 τρόποι φόρτισης."},{"t":"li","x":"Χρήσιμο: φακός και έξοδος USB για κινητό (λίγη φόρτιση)."},{"t":"li","x":"Βραχέα κύματα (SW): ακούς ειδήσεις από το εξωτερικό αν πέσουν οι τοπικοί σταθμοί."},{"t":"li","x":"Γράψε σε χαρτί τις συχνότητες των σταθμών της περιοχής σου (ΕΡΤ)."}]},{"cat":"gear","id":"g_cook","emoji":"🍳","title":"Μαγειρικά – γκαζάκια","sub":"Ζεστό φαγητό χωρίς ρεύμα","blocks":[{"t":"li","x":"Γκαζάκι camping με φιαλίδια βουτανίου: φθηνό, εύκολο. Στο κρύο (κάτω από ~0 °C) το βουτάνιο δεν δουλεύει καλά – πάρε μείγμα ισοβουτανίου/προπανίου."},{"t":"li","x":"Εστία οινοπνεύματος: απλή, αθόρυβη, χωρίς κομμάτια που χαλάνε. Αργή."},{"t":"li","x":"Εστία ξύλων (μικρή, πτυσσόμενη): καύσιμο από τη φύση, για έξω."},{"t":"li","x":"Ψησταριά κάρβουνου: ΜΟΝΟ έξω."},{"t":"warn","x":"Καμία εστία με φλόγα μέσα σε κλειστό χώρο ή σκηνή. Μονοξείδιο και φωτιά."},{"t":"h","x":"Σκεύη"},{"t":"li","x":"Κατσαρολάκι ανοξείδωτο ή τιτάνιο με καπάκι (το καπάκι κάνει το βράσιμο 2 φορές πιο γρήγορο)."},{"t":"li","x":"Ανοξείδωτη κούπα που μπαίνει στη φωτιά (για βράσιμο νερού)."},{"t":"li","x":"Spork (κουτάλι-πιρούνι), μαχαίρι, σφουγγαράκι, αναπτήρας."},{"t":"li","x":"Οικογένεια: κατσαρόλα 2–3 L, τηγάνι, ξύλινη κουτάλα."},{"t":"li","x":"Θερμός: κρατάει νερό ζεστό – λιγότερο καύσιμο."},{"t":"tip","x":"Μαγείρεμα «θερμοκουτί»: βράσε ρύζι/όσπρια 5 λεπτά, τύλιξε την κατσαρόλα σε κουβέρτες για 1–2 ώρες. Μαγειρεύεται με λίγο καύσιμο."}]},{"cat":"gear","id":"g_water","emoji":"💧","title":"Νερό: φίλτρα και καθαρισμός","sub":"Τι πραγματικά καθαρίζει","blocks":[{"t":"li","x":"Φίλτρο κοίλων ινών (0,1–0,2 μm): σταματάει βακτήρια και παράσιτα. ΔΕΝ σταματάει ιούς και χημικά."},{"t":"li","x":"Purifier (καθαριστής 0,02 μm ή με χημικό): και ιούς. Για πόλεις μετά από καταστροφή, προτίμησε αυτό ή φίλτρο + χλώριο."},{"t":"li","x":"Ταμπλέτες διοξειδίου του χλωρίου: σκοτώνουν σχεδόν τα πάντα, περίμενε 30 λεπτά έως 4 ώρες (δες οδηγίες)."},{"t":"li","x":"Βράσιμο: το πιο σίγουρο για μικρόβια. Δεν καθαρίζει χημικά."},{"t":"li","x":"Φίλτρο ενεργού άνθρακα: βελτιώνει γεύση, κόβει κάποια χημικά, όχι μικρόβια."},{"t":"li","x":"Φίλτρο βαρύτητας (κουβάς/σακούλα που κρέμεται): ιδανικό για οικογένεια."},{"t":"tip","x":"Καλύτερος συνδυασμός: προφιλτράρισμα με πανί → φίλτρο → χλώριο ή βράσιμο."}]},{"cat":"gear","id":"g_tools","emoji":"🔪","title":"Μαχαίρι – εργαλεία","sub":"Τα απαραίτητα","blocks":[{"t":"li","x":"Μαχαίρι σταθερής λάμας 10–12 cm, ανοξείδωτο ή carbon. Για ξύλα, φωτιά, φαγητό."},{"t":"li","x":"Πολυεργαλείο με πένσα: για επισκευές."},{"t":"li","x":"Πριόνι πτυσσόμενο: καθαρό κόψιμο ξύλων, καλύτερο και πιο ασφαλές από τσεκούρι."},{"t":"li","x":"Paracord 550: 250 kg αντοχή, 7 εσωτερικές κλωστές."},{"t":"li","x":"Duct tape: επισκευές, επιδέσεις, φουσκάλες."},{"t":"li","x":"Φτυάρι πτυσσόμενο: τουαλέτα, φωτιά, χιόνι."},{"t":"li","x":"Λοστός (crowbar): πόρτες μετά από σεισμό."},{"t":"warn","x":"Έλεγξε τη νομοθεσία για μεταφορά μαχαιριών σε πόλη. Στο σακίδιο σπιτιού δεν υπάρχει θέμα."}]},{"cat":"gear","id":"g_fire","emoji":"🔥","title":"Φωτιά: αναπτήρες και προσάναμμα","sub":"3 τρόποι, πάντα","blocks":[{"t":"li","x":"Αναπτήρας BIC ή αντίστοιχος: ο πιο αξιόπιστος. Πάρε 3."},{"t":"li","x":"Αδιάβροχα / αντιανεμικά σπίρτα (storm matches): καίνε και στον αέρα."},{"t":"li","x":"Ράβδος σιδηροκερίου (ferro rod): χιλιάδες σπίθες, δουλεύει και βρεγμένη."},{"t":"li","x":"Προσάναμμα έτοιμο: βαμβάκι με βαζελίνη σε κουτάκι φιλμ/zip, κύβοι προσανάμματος, κομμάτια κουκουναριάς με ρετσίνι."}]},{"cat":"gear","id":"g_clothes","emoji":"🧥","title":"Ρούχα – παπούτσια","sub":"Σύστημα στρώσεων","blocks":[{"t":"step","x":"Βάση (στο δέρμα): merino μαλλί ή συνθετικό που βγάζει ιδρώτα. ΟΧΙ βαμβάκι."},{"t":"step","x":"Μόνωση: fleece ή μπουφάν πούπουλο/συνθετικό."},{"t":"step","x":"Εξωτερικό: αδιάβροχο αντιανεμικό με κουκούλα (Gore-Tex ή παρόμοιο)."},{"t":"li","x":"Βγάζεις στρώση ΠΡΙΝ ιδρώσεις. Ο ιδρώτας στο κρύο = υποθερμία."},{"t":"warn","x":"«Το βαμβάκι σκοτώνει» στο κρύο: βρεγμένο, χάνει τη ζέστη και δεν στεγνώνει."},{"t":"h","x":"Παπούτσια"},{"t":"li","x":"Πεζοπορίας, φορεμένα, με καλή σόλα. Στη φωτιά: δερμάτινα, όχι συνθετικά διχτυωτά."},{"t":"li","x":"Μάλλινες κάλτσες + ένα εφεδρικό ζευγάρι πάντα στεγνό σε σακουλάκι."},{"t":"li","x":"Σκούφος: ο φθηνότερος τρόπος να ζεσταθείς."}]},{"cat":"gear","id":"g_masks","emoji":"😷","title":"Μάσκες – προστασία","sub":"Τι προστατεύει από τι","blocks":[{"t":"li","x":"FFP2: σκόνη, καπνός (σωματίδια), ιοί. Για σεισμό, φωτιά."},{"t":"li","x":"FFP3: περισσότερη προστασία σε σωματίδια, ραδιενεργή σκόνη."},{"t":"li","x":"Μάσκα με φίλτρα (ημίσεια/ολόκληρη) A2B2E2K2-P3: αέρια και ατμοί – θέλει εκπαίδευση, εφαρμογή χωρίς γένια."},{"t":"warn","x":"Καμία μάσκα σωματιδίων δεν προστατεύει από αέρια ή μονοξείδιο του άνθρακα."},{"t":"li","x":"Γυαλιά προστασίας κλειστού τύπου για στάχτη και καπνό."}]},{"cat":"gear","id":"g_nav","emoji":"🗺️","title":"Χάρτης – πυξίδα – GPS","sub":"Μην στηρίζεσαι μόνο στο κινητό","blocks":[{"t":"li","x":"Χάρτινος χάρτης της περιοχής σου και των διαδρομών διαφυγής."},{"t":"li","x":"Πυξίδα με πλάκα (baseplate) – φθηνή και δεν θέλει μπαταρία."},{"t":"li","x":"Στο κινητό: κατέβασε από πριν offline χάρτες (Google Maps offline, Organic Maps, Maps.me). Το GPS δουλεύει χωρίς internet."},{"t":"li","x":"Στην εφαρμογή: η 🧭 Πυξίδα δείχνει συντεταγμένες και σε οδηγεί πίσω στα σημεία σου χωρίς internet."}]},{"cat":"gear","id":"g_store","emoji":"📦","title":"Αποθήκευση – ανανέωση","sub":"Να μη χαλάσουν","blocks":[{"t":"li","x":"Νερό εμφιαλωμένο: σε σκοτεινό δροσερό μέρος, όχι δίπλα σε χημικά. Άλλαζέ το όπως λέει η ημερομηνία."},{"t":"li","x":"Τρόφιμα: «πρώτα μπαίνει, πρώτα φεύγει». Τρως από το απόθεμα και αναπληρώνεις."},{"t":"li","x":"Μπαταρίες εκτός συσκευών. Powerbank φόρτιση κάθε 3 μήνες."},{"t":"li","x":"Φάρμακα: έλεγχος λήξεων κάθε 6 μήνες."},{"t":"li","x":"Σακίδιο: αλλαγή ρούχων ανά εποχή (Μάρτιο & Σεπτέμβριο)."},{"t":"tip","x":"Βάλε υπενθύμιση στο ημερολόγιο του κινητού για 1η Μαρτίου και 1η Σεπτεμβρίου: «Έλεγχος κιτ επιβίωσης»."}]},{"cat":"wild","id":"w_rule3","emoji":"3️⃣","title":"Ο κανόνας των 3","sub":"Τι είναι πιο επείγον","blocks":[{"t":"li","x":"3 ΛΕΠΤΑ χωρίς αέρα (ή με μεγάλη αιμορραγία)."},{"t":"li","x":"3 ΩΡΕΣ χωρίς προστασία σε σκληρό καιρό (κρύο, βροχή, καύσωνας)."},{"t":"li","x":"3 ΜΕΡΕΣ χωρίς νερό."},{"t":"li","x":"3 ΕΒΔΟΜΑΔΕΣ χωρίς φαγητό."},{"t":"h","x":"Άρα η σειρά είναι:"},{"t":"step","x":"Ασφάλεια και πρώτες βοήθειες."},{"t":"step","x":"Καταφύγιο – ζέστη/δροσιά."},{"t":"step","x":"Νερό."},{"t":"step","x":"Σήματα για να σε βρουν."},{"t":"step","x":"Φαγητό (το τελευταίο!)."},{"t":"tip","x":"Και πάνω από όλα: ΨΥΧΡΑΙΜΙΑ και θέληση. Όσοι επιβιώνουν συνήθως δεν είναι οι πιο δυνατοί, αλλά όσοι δεν τα παρατάνε."}]},{"cat":"wild","id":"w_mind","emoji":"🧠","title":"Μυαλό – ψυχραιμία","sub":"Το πιο σημαντικό εργαλείο","blocks":[{"t":"li","x":"Ανάσα 4-4-4-4: εισπνοή 4, κράτα 4, εκπνοή 4, κράτα 4. Τρεις φορές. Ηρεμεί τον πανικό."},{"t":"li","x":"Κάνε ΜΙΚΡΑ βήματα: «τώρα φτιάχνω το καταφύγιο», όχι «πώς θα σωθώ»."},{"t":"li","x":"Ρουτίνα: ώρες για νερό, φαγητό, ύπνο, έλεγχο. Η ρουτίνα κρατάει το μυαλό."},{"t":"li","x":"Δώσε σε όλους δουλειά, και στα παιδιά. Η δουλειά διώχνει τον φόβο."},{"t":"
