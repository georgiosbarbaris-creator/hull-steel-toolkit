<html lang="el"><head><meta charset="utf-8">

<style>
:root{--fs:19px;--bg:#0d1b2a;--card:#16283d;--line:#2a4060;--tx:#f4f6f8;--mut:#a9b8c8;--red:#d62828;--org:#f77f00;--grn:#2a9d8f;--yel:#fcbf49;--blu:#3a86ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,"Segoe UI",Roboto,Arial,sans-serif;font-size:var(--fs);line-height:1.45}
header{position:sticky;top:0;z-index:5;background:#0a1522;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;border-bottom:1px solid var(--line)}
header h1{flex:1;font-size:1.05em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:12px;min-width:46px;height:46px;font-size:1em;font-weight:700;padding:0 10px}
main{padding:12px 12px calc(env(safe-area-inset-bottom) + 90px);max-width:760px;margin:0 auto}
.big{display:block;width:100%;border:0;border-radius:18px;padding:20px 14px;margin:0 0 12px;font-size:1.35em;font-weight:800;color:#fff;text-align:center}
.big small{display:block;font-size:.6em;font-weight:500;opacity:.9;margin-top:4px}
.red{background:var(--red)}.org{background:var(--org)}.grn{background:var(--grn)}.blu{background:var(--blu)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center;color:var(--tx);font-size:1em;font-weight:700;min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tile .e{font-size:2.1em;line-height:1}
.tile small{font-weight:400;color:var(--mut);font-size:.72em}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:9px;color:var(--tx);width:100%;text-align:left;font-size:1em}
.row .e{font-size:1.7em;width:1.4em;text-align:center}
.row b{display:block}.row small{color:var(--mut)}
h2{font-size:1.25em;margin:18px 0 8px;color:var(--yel)}
h3{font-size:1.05em;margin:18px 0 6px;color:var(--yel);border-bottom:1px solid var(--line);padding-bottom:4px}
.sub{color:var(--mut);margin:-4px 0 10px}
.step{display:flex;gap:10px;background:var(--card);border-radius:12px;padding:10px 12px;margin:7px 0}
.step .n{flex:none;width:1.8em;height:1.8em;border-radius:50%;background:var(--org);color:#000;font-weight:800;display:flex;align-items:center;justify-content:center}
.li{padding:5px 0 5px 1.1em;position:relative}.li:before{content:"•";position:absolute;left:.2em;color:var(--org)}
.warn{background:#4a1014;border-left:6px solid var(--red);padding:10px 12px;border-radius:10px;margin:8px 0;font-weight:600}
.tip{background:#123a36;border-left:6px solid var(--grn);padding:10px 12px;border-radius:10px;margin:8px 0}
.chk{display:flex;gap:12px;align-items:flex-start;padding:11px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.chk .bx{flex:none;width:1.5em;height:1.5em;border:2px solid var(--mut);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:900}
.chk.on .bx{background:var(--grn);border-color:var(--grn)}.chk.on span{color:var(--mut);text-decoration:line-through}
.bar{height:14px;background:var(--card);border-radius:8px;overflow:hidden;margin:6px 0 2px}.bar i{display:block;height:100%;background:var(--grn)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.btn{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:11px 14px;font-size:.95em;font-weight:700}
.btn.p{background:var(--blu);border-color:var(--blu);color:#fff}.btn.r{background:var(--red);border-color:var(--red);color:#fff}.btn.g{background:var(--grn);border-color:var(--grn);color:#fff}
input,select,textarea{width:100%;font-size:1em;padding:11px;border-radius:10px;border:1px solid var(--line);background:#0a1522;color:var(--tx);margin:4px 0 10px}
label{font-weight:700;color:var(--mut);font-size:.9em}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.phone{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:9px;color:var(--tx);text-decoration:none}
.phone .num{font-size:1.6em;font-weight:900;color:#fff;min-width:3.2em}
.phone.k .num{color:var(--red)}
.comp{position:relative;width:min(78vw,300px);height:min(78vw,300px);margin:8px auto}
.comp svg{width:100%;height:100%}
.hd{text-align:center;font-size:2.6em;font-weight:900;letter-spacing:1px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.coord{font-size:1.15em;text-align:center;font-weight:700}
.muted{color:var(--mut);font-size:.88em}
#ov{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:#fff;color:#000;font-weight:800;padding-bottom:calc(env(safe-area-inset-bottom) + 30px)}
.metro{width:150px;height:150px;border-radius:50%;margin:10px auto;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:2.6em;font-weight:900;transition:transform .08s}
.metro.b{transform:scale(1.15);background:#ff4d4d}
footer{text-align:center;color:var(--mut);font-size:.8em;margin-top:28px}
.wp{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}.wp b{flex:1}
.sel{outline:3px solid var(--yel)}
canvas{width:100%;background:#0a1522;border-radius:12px;border:1px solid var(--line)}
.card{background:#fff;color:#000;border-radius:14px;padding:14px;font-size:1.05em}.card b{color:#900}
</style></head><body>

<script>
const D=[{"cat":"now","id":"quake","emoji":"🏚️","title":"Σεισμός","sub":"Σκύψε – Κάλυψε – Κρατήσου","blocks":[{"t":"h","x":"ΤΩΡΑ, όσο κουνιέται"},{"t":"step","x":"ΣΚΥΨΕ στα γόνατα, για να μη σε ρίξει ο σεισμός."},{"t":"step","x":"ΚΑΛΥΨΕ το κεφάλι και τον λαιμό. Μπες κάτω από γερό τραπέζι ή γραφείο."},{"t":"step","x":"ΚΡΑΤΗΣΟΥ από το πόδι του τραπεζιού μέχρι να σταματήσει το κούνημα."},{"t":"step","x":"Αν δεν έχει τραπέζι: κάτσε δίπλα σε εσωτερικό τοίχο, μακριά από τζάμια, και κάλυψε το κεφάλι με τα χέρια."},{"t":"warn","x":"ΜΗΝ τρέξεις έξω την ώρα του σεισμού. Οι περισσότεροι τραυματίζονται από πράγματα που πέφτουν."},{"t":"warn","x":"ΜΗΝ μπεις σε ασανσέρ. ΜΗΝ σταθείς σε σκάλες ή μπαλκόνι."},{"t":"h","x":"Αν είσαι στο κρεβάτι"},{"t":"li","x":"Μείνε εκεί. Γύρνα μπρούμυτα και κάλυψε το κεφάλι με το μαξιλάρι."},{"t":"h","x":"Αν είσαι έξω"},{"t":"li","x":"Πήγαινε σε ανοιχτό χώρο, μακριά από κτίρια, κολώνες, καλώδια και δέντρα."},{"t":"li","x":"Σκύψε και κάλυψε το κεφάλι."},{"t":"h","x":"Αν οδηγείς"},{"t":"li","x":"Σταμάτα σιγά-σιγά σε ασφαλές σημείο. Όχι κάτω από γέφυρες, κολώνες, καλώδια."},{"t":"li","x":"Μείνε μέσα στο αυτοκίνητο με τη ζώνη μέχρι να σταματήσει."},{"t":"h","x":"Μόλις σταματήσει"},{"t":"step","x":"Έλεγξε αν είσαι καλά εσύ και όσοι είναι μαζί σου."},{"t":"step","x":"Φόρεσε παπούτσια (σπασμένα γυαλιά!)."},{"t":"step","x":"Κλείσε γκάζι/υγραέριο και τον γενικό διακόπτη ρεύματος αν υπάρχει ζημιά ή μυρωδιά."},{"t":"step","x":"Πάρε το σακίδιο έκτακτης ανάγκης και βγες ΗΡΕΜΑ από τις σκάλες."},{"t":"step","x":"Πήγαινε στον χώρο συγκέντρωσης της περιοχής σου (ανοιχτός χώρος)."},{"t":"step","x":"Άκου ραδιόφωνο και τα μηνύματα 112."},{"t":"warn","x":"Μυρίζει γκάζι; ΜΗΝ ανάβεις φως, αναπτήρα ή διακόπτες. Άνοιξε παράθυρα και βγες έξω."},{"t":"warn","x":"Περίμενε μετασεισμούς. Μην ξαναμπείς σε κτίριο με ρωγμές μέχρι να το δει μηχανικός."},{"t":"h","x":"Αν εγκλωβιστείς στα συντρίμμια"},{"t":"step","x":"Μην ανάβεις φωτιά ή σπίρτο."},{"t":"step","x":"Κάλυψε στόμα και μύτη με ύφασμα για τη σκόνη."},{"t":"step","x":"Χτύπα σε σωλήνα ή τοίχο (3 χτυπήματα, παύση) ή φύσα σφυρίχτρα."},{"t":"step","x":"Φώναξε μόνο όταν ακούς διασώστες – κράτα δυνάμεις."},{"t":"step","x":"Μην κουνιέσαι άσκοπα, μη σηκώνεις σκόνη."},{"t":"h","x":"Κοντά στη θάλασσα;"},{"t":"warn","x":"Αν ο σεισμός ήταν δυνατός ή κράτησε πολύ και είσαι στην ακτή: φύγε ΑΜΕΣΩΣ για ψηλά. Δες «Τσουνάμι»."},{"t":"tip","x":"Προετοιμασία: στερέωσε ντουλάπες και βιβλιοθήκες στον τοίχο, βάρη χαμηλά, όχι κάδρα πάνω από το κρεβάτι."},{"t":"tip","x":"Μάθε στα παιδιά το «Σκύψε-Κάλυψε-Κρατήσου» και κάντε άσκηση 2 φορές τον χρόνο."}]},{"cat":"now","id":"tsunami","emoji":"🌊","title":"Τσουνάμι","sub":"Φεύγω ψηλά, αμέσως","blocks":[{"t":"h","x":"Σημάδια ότι έρχεται"},{"t":"li","x":"Δυνατός ή μακρύς σεισμός ενώ είσαι κοντά στη θάλασσα."},{"t":"li","x":"Η θάλασσα τραβιέται ξαφνικά πίσω και φαίνεται ο βυθός."},{"t":"li","x":"Δυνατός βρυχηθμός από τη θάλασσα."},{"t":"li","x":"Μήνυμα 112."},{"t":"h","x":"Τι κάνω"},{"t":"step","x":"ΜΗΝ περιμένεις οδηγίες. Φύγε αμέσως."},{"t":"step","x":"Πήγαινε σε ψηλό σημείο (λόφο) ή όσο πιο μακριά από την ακτή μπορείς."},{"t":"step","x":"Αν δεν προλαβαίνεις: ανέβα σε ψηλό γερό κτίριο από μπετό (3ος όροφος και πάνω)."},{"t":"step","x":"Πήγαινε με τα πόδια αν οι δρόμοι είναι μπλοκαρισμένοι."},{"t":"step","x":"Μείνε ψηλά για ώρες. Έρχονται πολλά κύματα και το πρώτο συχνά ΔΕΝ είναι το μεγαλύτερο."},{"t":"warn","x":"ΠΟΤΕ μην πας να δεις τη θάλασσα που τραβήχτηκε."},{"t":"h","x":"Αν είσαι σε σκάφος"},{"t":"li","x":"Σε βαθιά νερά (πάνω από ~50 m) το τσουνάμι σχεδόν δεν φαίνεται. Αν προλαβαίνεις, βγες ανοιχτά."},{"t":"li","x":"Μέσα στο λιμάνι: άφησε το σκάφος και ανέβα ψηλά στη στεριά."},{"t":"tip","x":"Αν ζεις ή κάνεις διακοπές σε ακτή: βρες από πριν τον πιο κοντινό λόφο και τον δρόμο προς τα εκεί."}]},{"cat":"now","id":"housefire","emoji":"🔥","title":"Φωτιά στο σπίτι","sub":"Βγες, μείνε έξω, κάλεσε 199","blocks":[{"t":"h","x":"Τι κάνω"},{"t":"step","x":"Φώναξε «ΦΩΤΙΑ!» γι ίο πάνω από 4 °C για 2+ ώρες: πέτα κρέας, ψάρι, γάλα, αυγά, μαγειρεμένα. «Όταν έχεις αμφιβολία, πέτα το»."},{"t":"tip","x":"Γέμισε τα κενά του καταψύκτη με μπουκάλια νερό. Κρατάει πιο πολύ το κρύο και έχεις πόσιμο νερό."}]},{"cat":"now","id":"war","emoji":"🛡️","title":"Πόλεμος – αεροπορική επιδρομή","sub":"Προστασία αμάχων","blocks":[{"t":"h","x":"Σειρήνα / προειδοποίηση επιδρομής"},{"t":"step","x":"Πήγαινε αμέσως σε καταφύγιο, υπόγειο ή υπόγειο σταθμό."},{"t":"step","x":"Αν δεν προλαβαίνεις: εσωτερικό δωμάτιο ή διάδρομος, χαμηλός όροφος, μακριά από παράθυρα. Κανόνας των «2 τοίχων»: βάλε δύο τοίχους ανάμεσα σε σένα και τον δρόμο."},{"t":"step","x":"Μπάνιο ή διάδρομος χωρίς παράθυρα είναι συχνά το καλύτερο μέρος στο διαμέρισμα."},{"t":"step","x":"Αν είσαι έξω: ξάπλωσε μπρούμυτα σε χαντάκι ή πίσω από πεζούλι, χέρια στο κεφάλι, στόμα ελαφρά ανοιχτό."},{"t":"step","x":"Μείνε στο καταφύγιο μέχρι το σήμα λήξης."},{"t":"warn","x":"ΜΗΝ βγαίνεις να δεις ή να φωτογραφίσεις. ΜΗΝ ανεβάζεις στα social βίντεο με θέσεις ή στρατιωτικά οχήματα – μπορεί να βοηθήσει τον εχθρό και να σε βάλει σε κίνδυνο."},{"t":"h","x":"Προετοιμασία σπιτιού"},{"t":"li","x":"Ταινία σε σχήμα Χ στα τζάμια ή αντιθρυμματική μεμβράνη, κουρτίνες κλειστές."},{"t":"li","x":"Συσκότιση το βράδυ αν το ζητήσουν οι αρχές (κουβέρτες/μαύρο πλαστικό)."},{"t":"li","x":"Απόθεμα 2 εβδομάδων: νερό, τρόφιμα, φάρμακα, μπαταρίες, μετρητά."},{"t":"li","x":"Σακίδιο έτοιμο δίπλα στην πόρτα για κάθε μέλος."},{"t":"li","x":"Αντίγραφα εγγράφων (χαρτί + USB), φωτογραφίες των μελών της οικογένειας."},{"t":"h","x":"Αν χωριστεί η οικογένεια"},{"t":"li","x":"Συμφωνήστε από πριν 2 σημεία συνάντησης (ένα κοντά, ένα έξω από την πόλη) και έναν συγγενή μακριά που θα είναι «κέντρο επικοινωνίας»."},{"t":"li","x":"Στα παιδιά: καρτέλα στην τσέπη με όνομα, τηλέφωνα, ομάδα αίματος, αλλεργίες."},{"t":"h","x":"Μετακίνηση – σημεία ελέγχου"},{"t":"li","x":"Ήρεμα, χέρια ορατά, απαντάς σύντομα και αληθινά. Έγγραφα σε εύκολη τσέπη."},{"t":"li","x":"Κινήσου τη μέρα, σε γνωστούς δρόμους, ακολούθησε τους επίσημους διαδρόμους απομάκρυνσης."},{"t":"li","x":"Μην φοράς παραλλαγή ή ρούχα που μοιάζουν στρατιωτικά."},{"t":"h","x":"Ύποπτα αντικείμενα / πυρομαχικά"},{"t":"warn","x":"ΜΗΝ αγγίζεις, μη σηκώνεις, μην κλοτσάς άγνωστο μεταλλικό αντικείμενο, οβίδα, νάρκη, drone που έπεσε."},{"t":"step","x":"Σταμάτα. Γύρνα πίσω από τα ίδια σου τα βήματα."},{"t":"step","x":"Σημάδεψε το σημείο από απόσταση (πέτρες, ύφασμα)."},{"t":"step","x":"Ειδοποίησε 100 / 112."},{"t":"step","x":"Δίδαξε τα παιδιά: «Δεν αγγίζω, φεύγω, λέω σε μεγάλο»."},{"t":"h","x":"Drones"},{"t":"li","x":"Αν ακούς drone από κοντά: μπες σε κτίριο ή κάτω από δέντρα/κάλυψη, μην κοιτάς και μην τρέχεις σε ανοιχτό χώρο."},{"t":"tip","x":"Μάθε από τώρα πού είναι τα πλησιέστερα καταφύγια και υπόγειοι χώροι στη γειτονιά σου, στη δουλειά και στο σχολείο των παιδιών."}]},{"cat":"now","id":"nuclear","emoji":"☢️","title":"Πυρηνική έκρηξη – ραδιενέργεια","sub":"Μπες μέσα – Μείνε μέσα – Ενημερώσου","blocks":[{"t":"h","x":"Αν δεις λάμψη / έκρηξη"},{"t":"step","x":"ΜΗΝ κοιτάξεις τη λάμψη."},{"t":"step","x":"Πέσε μπρούμυτα πίσω από ό,τι προστατεύει, κάλυψε κεφάλι και χέρια κάτω από το σώμα."},{"t":"step","x":"Μείνε κάτω μέχρι να περάσει το ωστικό κύμα (μπορεί να έρθει δευτερόλεπτα έως και λεπτά μετά)."},{"t":"h","x":"Μετά: η ραδιενεργή σκόνη (fallout)"},{"t":"li","x":"Η επικίνδυνη σκόνη πέφτει μέσα σε 10–30 λεπτά. Έχεις λίγο χρόνο να μπεις σε καλό κτίριο."},{"t":"step","x":"ΜΠΕΣ ΜΕΣΑ στο πιο γερό κτίριο που βρίσκεις (μπετό, τούβλο)."},{"t":"step","x":"Πήγαινε στο υπόγειο ή στη ΜΕΣΗ του κτιρίου, μακριά από εξωτερικούς τοίχους και ταράτσα. Σε πολυκατοικία: μεσαίοι όροφοι στο κέντρο είναι καλοί."},{"t":"step","x":"Κλείσε πόρτες, παράθυρα, κλιματισμό, εξαερισμό."},{"t":"step","x":"ΜΕΙΝΕ ΜΕΣΑ τουλάχιστον 24 ώρες, εκτός αν οι αρχές πουν κάτι άλλο. Η ραδιενέργεια πέφτει γρήγορα: μετά από 7 ώρες ~10 φορές λιγότερη, μετά από 2 μέρες ~100 φορές λιγότερη."},{"t":"step","x":"ΕΝΗΜΕΡΩΣΟΥ από ραδιόφωνο μπαταρίας και 112."},{"t":"warn","x":"Μην μπεις σε αυτοκίνητο για να φύγεις αν δεν σου το πουν. Το αυτοκίνητο δεν προστατεύει από τη ραδιενέργεια."},{"t":"h","x":"Απορρύπανση (αν ήσουν έξω)"},{"t":"step","x":"Πριν μπεις στον καθαρό χώρο, βγάλε τα εξωτερικά ρούχα – φεύγει έτσι το μεγαλύτερο μέρος της σκόνης."},{"t":"step","x":"Βάλ' τα σε πλαστική σακούλα, δεμένη, μακριά από ανθρώπους."},{"t":"step","x":"Ντους με σαπούνι και σαμπουάν. ΟΧΙ conditioner (κολλάει τη σκόνη στα μαλλιά). Μην τρίβεις δυνατά."},{"t":"step","x":"Αν δεν υπάρχει ντους: σκούπισε με βρεγμένο πανί πρόσωπο, χέρια, μαλλιά. Φύσα τη μύτη, καθάρισε αυτιά, βλεφαρίδες."},{"t":"step","x":"Καθαρά ρούχα από κλειστή ντουλάπα."},{"t":"h","x":"Φαγητό και νερό"},{"t":"li","x":"Τρόφιμα σε κλειστές συσκευασίες και νερό σε κλειστά μπουκάλια είναι ασφαλή. Σκούπισε το εξωτερικό πριν τα ανοίξεις."},{"t":"li","x":"Μην τρως φρούτα/λαχανικά από τον κήπο ή γάλα από ζώα της περιοχής χωρίς οδηγία των αρχών."},{"t":"h","x":"Ιωδιούχο κάλιο (KI)"},{"t":"warn","x":"ΜΟΝΟ όταν το πουν οι αρχές. Προστατεύει ΜΟΝΟ τον θυρεοειδή από το ραδιενεργό ιώδιο. Δεν προστατεύει από τίποτα άλλο. Μην παίρνεις «προληπτικά». Ποτέ ιώδιο αντισηπτικό (Betadine) από το στόμα."},{"t":"h","x":"Ατύχημα σε πυρηνικό εργοστάσιο (π.χ. σε γειτονική χώρα)"},{"t":"li","x":"Συνήθως υπάρχει χρόνος. Ακολούθησε τις οδηγίες: παραμονή μέσα, κλειστά παράθυρα, ενημέρωση. Μην πανικοβάλλεσαι."},{"t":"tip","x":"Ραδιόφωνο μπαταρίας ή μανιβέλας είναι το πιο σημαντικό εργαλείο εδώ. Έχε και νερό/φαγητό για 3–14 μέρες μέσα."}]},{"cat":"now","id":"chem","emoji":"☣️","title":"Χημικό – τοξικό νέφος","sub":"Μέσα, σφραγισμένα, ψηλά","blocks":[{"t":"h","x":"Τι κάνω"},{"t":"step","x":"Μπες αμέσως μέσα σε κτίριο. Κλείσε πόρτες, παράθυρα, τζάκι."},{"t":"step","x":"Σβήσε κλιματισμό, εξαερισμό, απορροφητήρα."},{"t":"step","x":"Πήγαινε σε δωμάτιο ΨΗΛΑ (τα περισσότερα χημικά αέρια είναι βαριά και μαζεύονται χαμηλά – το ΑΝΤΙΘΕΤΟ από τη ραδιενέργεια)."},{"t":"step","x":"Σφράγισε χαραμάδε ουμε το σχέδιο του σχολείου για τα παιδιά"},{"t":"chk","x":"Κάθε μέλος έχει σακίδιο"},{"t":"chk","x":"Άσκηση σεισμού και φωτιάς 2 φορές τον χρόνο"},{"t":"chk","x":"Έλεγχος αποθεμάτων και λήξεων κάθε 6 μήνες (π.χ. Μάρτιο και Σεπτέμβριο)"},{"t":"chk","x":"Μάθαμε ΚΑΡΠΑ και πρώτες βοήθειες"},{"t":"chk","x":"Ξέρουμε ποιος γείτονας χρειάζεται βοήθεια"},{"t":"chk","x":"Συμπληρώσαμε την «Κάρτα μου» σε αυτή την εφαρμογή"}]},{"cat":"gear","id":"g_sleep","emoji":"🛏️","title":"Κουβέρτα ή sleeping bag;","sub":"Τι ζεσταίνει καλύτερα","blocks":[{"t":"h","x":"Σύντομη απάντηση"},{"t":"li","x":"Για ΥΠΝΟ σε κρύο: sleeping bag + υπόστρωμα. Ζεσταίνει πολύ περισσότερο ανά κιλό."},{"t":"li","x":"Για ΣΠΙΤΙ, ΑΥΤΟΚΙΝΗΤΟ, ΦΩΤΙΑ: μάλλινη κουβέρτα. Ανθεκτική, δεν παίρνει εύκολα φωτιά, ζεσταίνει και βρεγμένη."},{"t":"li","x":"Για ΣΑΚΙΔΙΟ: κουβέρτα αλουμινίου (έκτακτη) + sleeping bag αν χωράει."},{"t":"h","x":"Σύγκριση"},{"t":"li","x":"Μάλλινη κουβέρτα: + ζεσταίνει βρεγμένη, δύσκολα καίγεται, αντέχει χρόνια, πολλές χρήσεις (αναρτήρας, φορείο). − βαριά (2–3 kg), ογκώδης."},{"t":"li","x":"Fleece κουβέρτα: + ελαφριά, φθηνή, στεγνώνει γρήγορα. − λιώνει στη φωτιά, λιγότερη ζέστη."},{"t":"li","x":"Βαμβακερή κουβέρτα: − βρεγμένη δεν ζεσταίνει καθόλου. Όχι για επιβίωση."},{"t":"li","x":"Κουβέρτα αλουμινίου (mylar): + 60 γραμμάρια, κόβει αέρα, κρατάει ζέστη σώματος, σήμα. − σκίζεται, κάνει υγρασία μέσα. Μόνο για έκτακτη ανάγκη."},{"t":"li","x":"Bivy / σάκος επιβίωσης (σαν mylar σακούλα): καλύτερο από κουβέρτα αλουμινίου, ~100–300 g."},{"t":"h","x":"Sleeping bag: τι κοιτάω"},{"t":"li","x":"Θερμοκρασία COMFORT (ISO 23537 / EN 13537): εκεί κοιμάσαι άνετα. Το LIMIT είναι για «επιβίωση με κρύο». Το EXTREME αγνόησέ το."},{"t":"li","x":"Για Ελλάδα όλο τον χρόνο: comfort περίπου 0 °C έως −5 °C. Για καλοκαίρι: +10 °C."},{"t":"li","x":"Πούπουλο (down): ελαφρύ, μικρό όγκο, ζεστό – αλλά βρεγμένο δεν ζεσταίνει. Fill power 600+."},{"t":"li","x":"Συνθετικό: βαρύτερο και ογκωδέστερο, αλλά ζεσταίνει και υγρό. Καλύτερο για σπίτι/αυτοκίνητο/υγρασία."},{"t":"li","x":"Σχήμα «μούμια» κρατάει πιο πολλή ζέστη. Θέλει κουκούλα με κορδόνι."},{"t":"li","x":"Πρόσθετο: liner (εσωτερικός σάκος) +2 έως +5 °C."},{"t":"h","x":"ΥΠΟΣΤΡΩΜΑ: το πιο ξεχασμένο"},{"t":"li","x":"Το έδαφος σου «ρουφάει» τη ζέστη. Χωρίς μόνωση κρυώνεις και με το καλύτερο sleeping bag."},{"t":"li","x":"Δείκτης R-value: καλοκαίρι 2, χειμώνας 4+, χιόνι 5+. Δύο υποστρώματα μαζί = αθροίζονται."},{"t":"li","x":"Αφρώδες (foam): δεν τρυπιέται, φθηνό. Φουσκωτό: άνετο, μικρό, αλλά θέλει κιτ επισκευής."},{"t":"tip","x":"Κοιμήσου με ΣΤΕΓΝΑ ρούχα και σκούφο. Φάε κάτι λιπαρό πριν τον ύπνο. Ούρησε πριν κοιμηθείς – το σώμα δεν ζεσταίνει άσκοπα υγρά."}]},{"cat":"gear","id":"g_tent","emoji":"⛺","title":"Σκηνή – καταφύγιο","sub":"Χρειάζομαι σκηνή;","blocks":[{"t":"li","x":"Για καταστροφή στην πόλη: συνήθως ΟΧΙ. Δομές φιλοξενίας, συγγενείς, αυτοκίνητο. Μια σκηνή βοηθάει όμως αν δεν μπορείς να μείνεις σε σπίτι μετά από σεισμό."},{"t":"li","x":"Για έξω από την πόλη/βουνό: ναι, ή tarp (μουσαμάς) + σχοινί που είναι ελαφρύτερο."},{"t":"h","x":"Τι κοιτάω σε σκηνή"},{"t":"li","x":"3 εποχών για Ελλάδα. 4 εποχών μόνο για χιόνι/βουνό."},{"t":"li","x":"Στήσιμο σε 5 λεπτά από 1 άτομο. Δοκίμασέ το στο σπίτι πρώτα."},{"t":"li","x":"Υδροστατική στήλη: πανί 2000+ mm, πάτος 3000+ mm."},{"t":"li","x":"Χωρητικότητα: πάρε 1 άτομο μεγαλύτερη (2 άτομα → σκηνή 3 ατόμων) για πράγματα."},{"t":"li","x":"Οικογενειακή σκηνή: μπορεί να γίνει «δωμάτιο» μετά από σεισμό στον κήπο."},{"t":"h","x":"Tarp (μουσαμάς)"},{"t":"li","x":"3×3 m με κρίκους, 300–600 g. Χίλιοι τρόποι στησίματος. Μαζί με σχοινί και πασσαλάκια."},{"t":"li","x":"Φθηνή λύση: χοντρό νάιλον οικοδομής + σχοινί."},{"t":"tip","x":"Πάντα στήνεις σε ψηλότερο σημείο από νερό, ΠΟΤΕ σε ξερό ρέμα (πλημμύρα) και ΠΟΤΕ κάτω από ξερό κλαδί."}]},{"cat":"gear","id":"g_light","emoji":"🔦","title":"Φακοί και φωτισμός","sub":"Τι να πάρω","blocks":[{"t":"li","x":"Φακός ΚΕΦΑΛΗΣ (headlamp) για κάθε μέλος: ελεύθερα χέρια. Ο πιο χρήσιμος φακός."},{"t":"li","x":"Φανάρι LED για το δωμάτιο/τραπέζι."},{"t":"li","x":"Φακός χειρός γερός, αδιάβροχος IPX4 ή καλύτερα IPX7."},{"t":"h","x":"Τι κοιτάω"},{"t":"li","x":"Μπαταρίες: προτίμησε ΑΑ ή ΑΑΑ – βρίσκονται παντού. Ή επαναφορτιζόμενο με USB-C + εφεδρικές."},{"t":"li","x":"Lumens: 200–400 φτάνουν για τα πάντα. Τα 3000 lumens τελειώνουν την μπαταρία σε λίγο."},{"t":"li","x":"Χαμηλή στάθμη (5–20 lm) που κρατάει 50+ ώρες – αυτή χρησιμοποιείς τις περισσότερες ώρες."},{"t":"li","x":"Κόκκινο φως: δεν χαλάει τη νυχτερινή όραση, δεν ξυπνάει τους άλλους."},{"t":"li","x":"Λειτουργία SOS/strobe."},{"t":"li","x":"Μπαταρίες λιθίου ΑΑ: αντέχουν κρύο και 10–20 χρόνια αποθήκευση. Οι αλκαλικές μπορεί να «τρέξουν» – βγάλ' τες από φακούς που φυλάς."},{"t":"h","x":"Κεριά;"},{"t":"li","x":"Μόνο σε σταθερή βάση, μακριά από κουρτίνες, ποτέ στον ύπνο, ποτέ με παιδιά μόνα. Προτίμησε LED."},{"t":"tip","x":"Δέσε ένα headlamp πάνω σε μπουκάλι νερό με το φως προς το μπουκάλι = φανάρι για όλο το δωμάτιο."}]},{"cat":"gear","id":"g_power","emoji":"🔋","title":"Ενέργεια – φόρτιση","sub":"Powerbank, ηλιακό, γεννήτρια","blocks":[{"t":"li","x":"Powerbank 10.000 mAh ≈ 2 φορτίσεις κινητού. 20.000 mAh ≈ 4. Φόρτιζέ τα κάθε 3 μήνες."},{"t":"li","x":"Ηλιακό πάνελ πτυσσόμενο 20–30 W: φορτίζει κινητό τη μέρα (μόνο σε ήλιο)."},{"t":"li","x":"Power station (μπαταρία μεγάλη 300–1000 Wh): φως, ρούτερ, ιατρικά μηχανήματα, φόρτιση. Ασφαλής μέσα στο σπίτι. Με ηλιακό πάνελ = ανεξαρτησία."},{"t":"li","x":"Γεννήτρια βενζίνης: πολλή ενέργεια αλλά θόρυβος, καύσιμο, και ΜΟΝΟ έξω (μονοξείδιο)."},{"t":"li","x":"Φορτιστής αυτοκινήτου USB."},{"t":"tip","x":"Κινητό: λειτουργία χαμηλής ενέργειας, χωρίς δεδομένα/Bluetooth, σκοτεινή οθόνη, όχι βίντεο. Λειτουργία πτήσης όταν δεν χρειάζεσαι σήμα. Το GPS δουλεύει και σε λειτουργία πτήσης στα περισσότερα κινητά."}]},{"cat":"gear","id":"g_radio","emoji":"📻","title":"Ραδιόφωνο","sub":"Η μόνη ενημέρωση όταν πέσουν όλα","blocks":[{"t":"li","x":"FM + AM (μεσαία) τουλάχιστον. Μανιβέλα + ηλιακό + μπαταρίες ΑΑ = 3 τρόποι φόρτισης."},{"t":"li","x":"Χρήσιμο: φακός και έξοδος USB για κινητό (λίγη φόρτιση)."},{"t":"li","x":"Βραχέα κύματα (SW): ακούς ειδήσεις από το εξωτερικό αν πέσουν οι τοπικοί σταθμοί."},{"t":"li","x":"Γράψε σε χαρτί τις συχνότητες των σταθμών της περιοχής σου (ΕΡΤ)."}]},{"cat":"gear","id":"g_cook","emoji":"🍳","title":"Μαγειρικά – γκαζάκια","sub":"Ζεστό φαγητό χωρίς ρεύμα","blocks":[{"t":"li","x":"Γκαζάκι camping με φιαλίδια βουτανίου: φθηνό, εύκολο. Στο κρύο (κάτω από ~0 °C) το βουτάνιο δεν δουλεύει καλά – πάρε μείγμα ισοβουτανίου/προπανίου."},{"t":"li","x":"Εστία οινοπνεύματος: απλή, αθόρυβη, χωρίς κομμάτια που χαλάνε. Αργή."},{"t":"li","x":"Εστία ξύλων (μικρή, πτυσσόμενη): καύσιμο από τη φύση, για έξω."},{"t":"li","x":"Ψησταριά κάρβουνου: ΜΟΝΟ έξω."},{"t":"warn","x":"Καμία εστία με φλόγα μέσα σε κλειστό χώρο ή σκηνή. Μονοξείδιο και φωτιά."},{"t":"h","x":"Σκεύη"},{"t":"li","x":"Κατσαρολάκι ανοξείδωτο ή τιτάνιο με καπάκι (το καπάκι κάνει το βράσιμο 2 φορές πιο γρήγορο)."},{"t":"li","x":"Ανοξείδωτη κούπα που μπαίνει στη φωτιά (για βράσιμο νερού)."},{"t":"li","x":"Spork (κουτάλι-πιρούνι), μαχαίρι, σφουγγαράκι, αναπτήρας."},{"t":"li","x":"Οικογένεια: κατσαρόλα 2–3 L, τηγάνι, ξύλινη κουτάλα."},{"t":"li","x":"Θερμός: κρατάει νερό ζεστό – λιγότερο καύσιμο."},{"t":"tip","x":"Μαγείρεμα «θερμοκουτί»: βράσε ρύζι/όσπρια 5 λεπτά, τύλιξε την κατσαρόλα σε κουβέρτες για 1–2 ώρες. Μαγειρεύεται με λίγο καύσιμο."}]},{"cat":"gear","id":"g_water","emoji":"💧","title":"Νερό: φίλτρα και καθαρισμός","sub":"Τι πραγματικά καθαρίζει","blocks":[{"t":"li","x":"Φίλτρο κοίλων ινών (0,1–0,2 μm): σταματάει βακτήρια και παράσιτα. ΔΕΝ σταματάει ιούς και χημικά."},{"t":"li","x":"Purifier (καθαριστής 0,02 μm ή με χημικό): και ιούς. Για πόλεις μετά από καταστροφή, προτίμησε αυτό ή φίλτρο + χλώριο."},{"t":"li","x":"Ταμπλέτες διοξειδίου του χλωρίου: σκοτώνουν σχεδόν τα πάντα, περίμενε 30 λεπτά έως 4 ώρες (δες οδηγίες)."},{"t":"li","x":"Βράσιμο: το πιο σίγουρο για μικρόβια. Δεν καθαρίζει χημικά."},{"t":"li","x":"Φίλτρο ενεργού άνθρακα: βελτιώνει γεύση, κόβει κάποια χημικά, όχι μικρόβια."},{"t":"li","x":"Φίλτρο βαρύτητας (κουβάς/σακούλα που κρέμεται): ιδανικό για οικογένεια."},{"t":"tip","x":"Καλύτερος συνδυασμός: προφιλτράρισμα με πανί → φίλτρο → χλώριο ή βράσιμο."}]},{"cat":"gear","id":"g_tools","emoji":"🔪","title":"Μαχαίρι – εργαλεία","sub":"Τα απαραίτητα","blocks":[{"t":"li","x":"Μαχαίρι σταθερής λάμας 10–12 cm, ανοξείδωτο ή carbon. Για ξύλα, φωτιά, φαγητό."},{"t":"li","x":"Πολυεργαλείο με πένσα: για επισκευές."},{"t":"li","x":"Πριόνι πτυσσόμενο: καθαρό κόψιμο ξύλων, καλύτερο και πιο ασφαλές από τσεκούρι."},{"t":"li","x":"Paracord 550: 250 kg αντοχή, 7 εσωτερικές κλωστές."},{"t":"li","x":"Duct tape: επισκευές, επιδέσεις, φουσκάλες."},{"t":"li","x":"Φτυάρι πτυσσόμενο: τουαλέτα, φωτιά, χιόνι."},{"t":"li","x":"Λοστός (crowbar): πόρτες μετά από σεισμό."},{"t":"warn","x":"Έλεγξε τη νομοθεσία για μεταφορά μαχαιριών σε πόλη. Στο σακίδιο σπιτιού δεν υπάρχει θέμα."}]},{"cat":"gear","id":"g_fire","emoji":"🔥","title":"Φωτιά: αναπτήρες και προσάναμμα","sub":"3 τρόποι, πάντα","blocks":[{"t":"li","x":"Αναπτήρας BIC ή αντίστοιχος: ο πιο αξιόπιστος. Πάρε 3."},{"t":"li","x":"Αδιάβροχα / αντιανεμικά σπίρτα (storm matches): καίνε και στον αέρα."},{"t":"li","x":"Ράβδος σιδηροκερίου (ferro rod): χιλιάδες σπίθες, δουλεύει και βρεγμένη."},{"t":"li","x":"Προσάναμμα έτοιμο: βαμβάκι με βαζελίνη σε κουτάκι φιλμ/zip, κύβοι προσανάμματος, κομμάτια κουκουναριάς με ρετσίνι."}]},{"cat":"gear","id":"g_clothes","emoji":"🧥","title":"Ρούχα – παπούτσια","sub":"Σύστημα στρώσεων","blocks":[{"t":"step","x":"Βάση (στο δέρμα): merino μαλλί ή συνθετικό που βγάζει ιδρώτα. ΟΧΙ βαμβάκι."},{"t":"step","x":"Μόνωση: fleece ή μπουφάν πούπουλο/συνθετικό."},{"t":"step","x":"Εξωτερικό: αδιάβροχο αντιανεμικό με κουκούλα (Gore-Tex ή παρόμοιο)."},{"t":"li","x":"Βγάζεις στρώση ΠΡΙΝ ιδρώσεις. Ο ιδρώτας στο κρύο = υποθερμία."},{"t":"warn","x":"«Το βαμβάκι σκοτώνει» στο κρύο: βρεγμένο ζεται"},{"t":"li","x":"ΠΡΟΣΑΝΑΜΜΑ (πιάνει με σπίθα): ξερό χορτάρι, φλούδα, βαμβάκι, χνούδι από ξερά φυτά."},{"t":"li","x":"ΜΙΚΡΑ ΚΛΑΔΙΑ (πάχος σπίρτου έως μολυβιού): ΠΟΛΛΑ – 2 χούφτες."},{"t":"li","x":"ΞΥΛΑ (πάχος δαχτύλου έως καρπού χεριού)."},{"t":"h","x":"Πώς"},{"t":"step","x":"Καθάρισε κύκλο 3 m από ξερά. Μακριά από δέντρα. Σε αέρα – μην ανάβεις."},{"t":"step","x":"Βάση από ξερά ξυλάκια (όχι πάνω σε βρεγμένο χώμα)."},{"t":"step","x":"Προσάναμμα στη μέση, γύρω τα μικρά κλαδιά σε σχήμα σκηνής (tipi)."},{"t":"step","x":"Άναψε από την πλευρά του αέρα. Φύσα απαλά στη βάση."},{"t":"step","x":"Πρόσθετε σιγά-σιγά μεγαλύτερα ξύλα."},{"t":"li","x":"Νεκρά κλαδιά που ΣΠΑΝΕ με «κρακ» είναι στεγνά. Αν λυγίζουν, είναι υγρά."},{"t":"warn","x":"Στην Ελλάδα, το καλοκαίρι (αντιπυρική περίοδος) η φωτιά στην ύπαιθρο απαγορεύεται και είναι πολύ επικίνδυνη. Μόνο σε πραγματική ανάγκη επιβίωσης, με απόλυτη προσοχή."},{"t":"warn","x":"Σβήσιμο: νερό, ανακάτεμα, ξανά νερό, μέχρι να είναι κρύο στο χέρι."}]},{"cat":"wild","id":"w_signal","emoji":"📣","title":"Σήματα για να σε βρουν","sub":"Γίνε ορατός","blocks":[{"t":"li","x":"ΤΡΙΑ από οτιδήποτε = SOS: 3 σφυρίγματα, 3 φωτιές σε τρίγωνο, 3 λάμψεις."},{"t":"li","x":"Σφυρίχτρα: ακούγεται πολύ πιο μακριά από φωνή και δεν κουράζει."},{"t":"li","x":"Καθρέφτης / CD / κινητό: λάμψεις προς αεροπλάνο ή πλοίο. Σημάδεψε με τα δάχτυλα σε σχήμα V."},{"t":"li","x":"Καπνός τη μέρα: πράσινα κλαδιά πάνω σε δυνατή φωτιά = λευκός καπνός."},{"t":"li","x":"Φως τη νύχτα: φακός σε SOS (… – – – …). Στην εφαρμογή: κουμπί 🔦 SOS."},{"t":"li","x":"Φωτεινά ρούχα/πανιά σε ανοιχτό σημείο."},{"t":"h","x":"Σήματα εδάφους προς αεροσκάφος (μεγάλα, 3 m+)"},{"t":"li","x":"V = Χρειάζομαι βοήθεια"},{"t":"li","x":"X = Χρειάζομαι ιατρική βοήθεια"},{"t":"li","x":"Y = Ναι"},{"t":"li","x":"N = Όχι"},{"t":"li","x":"→ (βέλος) = Πάω προς τα εκεί"},{"t":"h","x":"Σήμα με τα χέρια"},{"t":"li","x":"Και τα δύο χέρια ψηλά σε V = «Χρειάζομαι βοήθεια»."},{"t":"li","x":"Ένα χέρι ψηλά, ένα κάτω = «Δ  startGeo();if(orientOn)$('#cbtns').style.display='none';draw();upd()}
function wpsHtml(w){if(!w.length)return '<div class="muted">Κανένα σημείο ακόμα. Πάτα «Αποθήκευσε αυτό το σημείο» όταν είσαι σπίτι, στο αυτοκίνητο κ.λπ.</div>';
 return w.map((p,i)=>`<div class="wp ${tgt===i?'sel':''}"><b>${esc(p.n)}<br><small class="muted mono">${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}</small></b><button class="btn ${tgt===i?'p':''}" onclick="setTgt(${i})">${tgt===i?'✓ Πάω':'➡️ Πάμε'}</button><button class="btn" onclick="delWp(${i})">🗑</button></div>`).join('')}
function refWps(){const e=$('#wps');if(e)e.innerHTML=wpsHtml(LS.g('wps',[]))}
function setTgt(i){tgt=tgt===i?null:i;LS.s('tgt',tgt);refWps();upd();draw()}
function delWp(i){const w=LS.g('wps',[]);if(!confirm('Διαγραφή «'+w[i].n+'»;'))return;w.splice(i,1);LS.s('wps',w);if(tgt===i)tgt=null;else if(tgt>i)tgt--;LS.s('tgt',tgt);refWps();upd();draw()}
function saveWp(){if(!pos){alert('Περίμενε να βρεθεί η θέση σου (GPS).');return}const n=prompt('Όνομα σημείου (π.χ. Σπίτι, Αυτοκίνητο, Συνάντηση):','Σημείο '+(LS.g('wps',[]).length+1));if(!n)return;const w=LS.g('wps',[]);w.push({n,lat:pos.lat,lon:pos.lon,t:Date.now()});LS.s('wps',w);refWps();draw()}
function addWpMan(){const n=prompt('Όνομα σημείου:');if(!n)return;const s=prompt('Συντεταγμένες σε δεκαδικό (π.χ. 37.97510, 23.73480):');if(!s)return;const m=s.replace(/,/g,' ').split(/\s+/).filter(Boolean).map(Number);if(m.length<2||m.some(isNaN)||Math.abs(m[0])>90||Math.abs(m[1])>180){alert('Λάθος μορφή. Γράψε: 37.97510, 23.73480');return}const w=LS.g('wps',[]);w.push({n,lat:m[0],lon:m[1],t:Date.now()});LS.s('wps',w);refWps();draw()}
function posTxt(){return `Η θέση μου: ${pos.lat.toFixed(5)}, ${pos.lon.toFixed(5)} (${ddm(pos.lat,'N','S')} ${ddm(pos.lon,'E','W')}) ±${Math.round(pos.acc)} m. https://maps.google.com/?q=${pos.lat.toFixed(5)},${pos.lon.toFixed(5)}`}
function sendPos(){if(!pos){alert('Περίμενε να βρεθεί η θέση σου (GPS).');return}const me=LS.g('me',{});location.href='sms:?&body='+encodeURIComponent('ΧΡΕΙΑΖΟΜΑΙ ΒΟΗΘΕΙΑ. '+(me.name?me.name+'. ':'')+posTxt())}
function copyPos(){if(!pos)return alert('Περίμενε το GPS.');const t=posTxt();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert('Αντιγράφηκε.'),()=>prompt('Αντέγραψε:',t))}
function startGeo(){if(geoW!==null)return;if(!navigator.geolocation){$('#gps').textContent='Το κινητό δεν έχει GPS διαθέσιμο.';return}
 geoW=navigator.geolocation.watchPosition(p=>{const c=p.coords;pos={lat:c.latitude,lon:c.longitude,acc:c.accuracy,alt:c.altitude,spd:c.speed,hd:c.heading,t:p.timestamp};
  if(rec&&c.accuracy<60){const l=trk[trk.length-1];if(!l||dist(l,pos)>15){trk.push({lat:+pos.lat.toFixed(6),lon:+pos.lon.toFixed(6)});if(trk.length>3000)trk.shift();LS.s('trk',trk)}}
  upd();draw()},e=>{const g=$('#gps');if(g)g.innerHTML=e.code===1?'❌ Δεν δόθηκε άδεια τοποθεσίας.<br><small class="muted">iPhone: Ρυθμίσεις → Απόρρητο → Υπηρεσίες τοποθεσίας → Safari → «Κατά τη χρήση».</small>':'Δεν βρέθηκε ακόμα θέση. Βγες σε ανοιχτό χώρο με θέα στον ουρανό.'},{enableHighAccuracy:true,maximumAge:2000,timeout:60000})}
function stopGeo(){if(geoW!==null){navigator.geolocation.clearWatch(geoW);geoW=null}}
function startOrient(){const go2=()=>{orientOn=true;const b=$('#cbtns');if(b)b.style.display='none';wake(1)};
 if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){DeviceOrientationEvent.requestPermission().then(r=>{if(r==='granted'){window.addEventListener('deviceorientation',onOr,true);go2()}else alert('Δεν δόθηκε άδεια για την πυξίδα.')}).catch(()=>alert('Η πυξίδα δεν ενεργοποιήθηκε.'))}
 else{if('ondeviceorientationabsolute' in window)window.addEventListener('deviceorientationabsolute',onOr,true);else window.addEventListener('deviceorientation',onOr,true);go2();setTimeout(()=>{if(hdg===null){const n=$('#hdn');if(n)n.textContent='Η συσκευή δεν δίνει πυξίδα (π.χ. υπολογιστής). Το GPS δουλεύει κανονικά.'}},2500)}}
function onOr(e){let h=null;if(typeof e.webkitCompassHeading==='number')h=e.webkitCompassHeading;else if(e.absolute!==false&&e.alpha!=null)h=(360-e.alpha)%360;if(h==null)return;
 const so=(screen.orientation&&screen.orientation.angle)||window.orientation||0;h=(h+so+DEC()+360)%360;hdg=hdg==null?h:hdg+((((h-hdg)%360)+540)%360-180)*.25;hdg=(hdg+360)%360;upd(1)}
let lastU=0;
function upd(fast){const r=$('#rose');if(!r)return;const now=Date.now();
 if(hdg!=null){r.setAttribute('transform',`rotate(${-hdg})`);$('#hd').textContent=`${Math.round(hdg).toString().padStart(3,'0')}° ${card(hdg)}`;const n=$('#hdn');if(n)n.textContent='Η κόκκινη μύτη δείχνει πάντα Βορρά. Η λευκή γραμμή πάνω = προς τα πού κοιτάς.'}
 const w=LS.g('wps',[]),t=tgt!=null?w[tgt]:null,ta=$('#tarr'),nv=$('#nav');
 if(t&&pos){const b=brg(pos,t),d=dist(pos,t);ta.style.display='';ta.setAttribute('transform',`rotate(${hdg!=null?b-hdg:b})`);
  if(!fast||now-lastU>500){nv.style.display='';nv.innerHTML=`<div style="text-align:center"><b>➡️ ${esc(t.n)}</b><div class="hd" style="font-size:2em">${fmD(d)}</div>Πορεία <b>${Math.round(b).toString().padStart(3,'0')}° ${card(b)}</b>${hdg!=null?`<br>${turnTxt(b-hdg)}`:''}<div class="muted">Ακολούθα το κίτρινο βέλος. Απόσταση σε ευθεία γραμμή.</div></div>`}}
 else{ta.style.display='none';nv.style.display='none'}
 if(fast&&now-lastU<500)return;lastU=now;
 const g=$('#gps');if(g&&pos)g.innerHTML=`<div class="mono">${ddm(pos.lat,'N','S')}<br>${ddm(pos.lon,'E','W')}</div><div class="mono muted" style="font-size:.85em">${pos.lat.toFixed(5)}, ${pos.lon.toFixed(5)} · ${dms(pos.lat,'N','S')} ${dms(pos.lon,'E','W')}</div><div class="muted">Ακρίβεια ±${Math.round(pos.acc)} m${pos.alt!=null?` · Υψόμετρο ${Math.round(pos.alt)} m`:''}${pos.spd!=null&&pos.spd>0.3?` · Ταχύτητα ${(pos.spd*3.6).toFixed(1)} km/h`:''}</div>`}
function turnTxt(d){d=((d%360)+540)%360-180;const a=Math.abs(Math.round(d));return a<10?'✅ Ευθεία μπροστά':(d>0?`↪️ Στρίψε ΔΕΞΙΑ ${a}°`:`↩️ Στρίψε ΑΡΙΣΤΕΡΑ ${a}°`)}
function togRec(){rec=!rec;LS.s('rec',rec);const b=$('#recb');b.className='btn '+(rec?'r':'');b.textContent=rec?'⏹ Σταμάτα καταγραφή':'⏺ Κατέγραφε τη διαδρομή μου';if(rec)wake(1)}
function clrTrk(){if(!confirm('Σβήσιμο της καταγεγραμμένης διαδρομής;'))return;trk=[];LS.s('trk',trk);draw()}
function draw(){const cv=$('#cv');if(!cv)return;const x=cv.getContext('2d'),W=cv.width,H=cv.height;x.clearRect(0,0,W,H);
 const w=LS.g('wps',[]),pts=[...trk,...w];if(pos)pts.push(pos);
 if(!pts.length){x.fillStyle='#a9b8c8';x.font='28px sans-serif';x.textAlign='center';x.fillText('Δεν υπάρχουν ακόμα σημεία',W/2,H/2);return}
 const c=pos||pts[pts.length-1],k=Math.cos(rad(c.lat));let mx=50;pts.forEach(p=>{mx=Math.max(mx,Math.abs((p.lon-c.lon)*k*111320),Math.abs((p.lat-c.lat)*110540))});
 const sc=(W/2-50)/mx,P=p=>[W/2+(p.lon-c.lon)*k*111320*sc,H/2-(p.lat-c.lat)*110540*sc];
 // grid rings
 x.strokeStyle='#2a4060';x.lineWidth=2;x.fillStyle='#a9b8c8';x.font='22px sans-serif';x.textAlign='left';
 const ring=[10,25,50,100,250,500,1000,2500,5000,10000,25000,50000,100000,250000,500000,1e6,2.5e6,5e6].find(r=>r*sc>W/6)||mx;
 for(let i=1;i<=3;i++){x.beginPath();x.arc(W/2,H/2,ring*i*sc,0,7);x.stroke();x.fillText(fmD(ring*i),W/2+ring*i*sc*.71+4,H/2-ring*i*sc*.71)}
 x.fillStyle='#ff4d4d';x.font='bold 30px sans-serif';x.textAlign='center';x.fillText('Β ▲',W/2,34);
 if(trk.length>1){x.strokeStyle='#fcbf49';x.lineWidth=4;x.beginPath();trk.forEach((p,i)=>{const [a,b]=P(p);i?x.lineTo(a,b):x.moveTo(a,b)});x.stroke()}
 w.forEach((p,i)=>{const [a,b]=P(p);x.font='34px sans-serif';x.fillText('⭐',a,b+12);x.fillStyle=tgt===i?'#fcbf49':'#fff';x.font='bold 22px sans-serif';x.fillText(p.n,a,b-22);x.fillStyle='#ff4d4d'});
 if(pos){const [a,b]=P(pos);x.fillStyle='rgba(58,134,255,.25)';x.beginPath();x.arc(a,b,Math.max(10,pos.acc*sc),0,7);x.fill();x.fillStyle='#3a86ff';x.strokeStyle='#fff';x.lineWidth=4;x.beginPath();x.arc(a,b,13,0,7);x.fill();x.stroke()}}

function stopAll(){if(cprT){clearInterval(cprT);cprT=null}if(whT){clearTimeout(whT);whT=null}if(window.speechSynthesis)speechSynthesis.cancel();speaking=false;
 if(!rec)stopGeo();if(!rec)wake(0);if(orientOn){window.removeEventListener('deviceorientation',onOr,true);window.removeEventListener('deviceorientationabsolute',onOr,true);orientOn=false;hdg=null}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&WL){WL=null;wake(1)}});
if(rec)startGeo();
render(location.hash.slice(1)||'home');
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
