<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#141c2b;--muted:#5b6578;--line:#d5dbe6;--pri:#1f3864;--acc:#2f6fd6;--ok:#1d7a46;--okb:#e1f3e8;--bad:#c0392b;--badb:#fde4e1;--wrn:#9a6700;--wrnb:#fff3d1;--yel:#fff7c2}
@media (prefers-color-scheme:dark){:root{--bg:#0d121b;--card:#161e2c;--ink:#e4e9f2;--muted:#95a1b6;--line:#2a3549;--pri:#9cc0ff;--acc:#5b93f0;--ok:#5cc98a;--okb:#16301f;--bad:#ff8a80;--badb:#3d1a18;--wrn:#e3b341;--wrnb:#3a2f10;--yel:#3a3510}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:9;background:#1f3864;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px 8px}
.hd{display:flex;gap:10px;align-items:center}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:7px 11px;font:700 15px system-ui}
header .t{flex:1;min-width:0}header h1{margin:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}header .s{font-size:12px;opacity:.8}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;background:rgba(255,255,255,.12);font-size:13px;padding:6px 10px;border-radius:16px}
.tabs button.on{background:#fff;color:#1f3864}
main{max-width:820px;margin:0 auto;padding:8px 10px calc(40px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0}
h2{font-size:15px;color:var(--pri);margin:2px 0 10px}h3{font-size:14px;margin:12px 0 6px;color:var(--pri)}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px;width:100%;min-width:0}
textarea{min-height:120px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:420px){.g3{grid-template-columns:1fr 1fr}}
.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 13px;font-weight:600;cursor:pointer}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn.d{color:var(--bad)}.btn.sm{padding:5px 9px;font-size:13px}.btn.big{width:100%;padding:14px;font-size:16px}
.ai{border-color:#6d4aff;background:#efeaff;color:#4b2fd1}@media (prefers-color-scheme:dark){.ai{background:#241a4a;color:#c9bbff}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.note{font-size:12.5px;color:var(--muted)}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px;border:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
.c-R{background:var(--okb);color:var(--ok);border-color:var(--ok)}.c-I{background:var(--wrnb);color:var(--wrn);border-color:var(--wrn)}.c-O{background:var(--bg);color:var(--muted)}
.cls{font-size:10px;font-weight:800;color:#fff;background:#6b4fd8;border-radius:5px;padding:1px 4px;margin-left:4px}
.sec{border-top:1px solid var(--line);padding:8px 0}
.sech{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700}
.sech .amt{margin-left:auto;font-variant-numeric:tabular-nums}
.ln{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:7px 0;border-bottom:1px dashed var(--line)}
.ln .d{font-size:13.5px}.ln .m{font-size:12px;color:var(--muted)}.ln .a{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.ln.off{opacity:.45}.ln.edited .d:after{content:" ✎";color:var(--acc)}
.big-n{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--bg);border-radius:12px;padding:10px;text-align:center}.kpi .v{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}.kpi .l{font-size:11px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:800;background:var(--yel)}
.bar{height:8px;background:var(--acc);border-radius:4px}
.pc{display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer}
.pill{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--bg);color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:var(--card);width:100%;max-width:640px;border-radius:16px 16px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;z-index:30;font-size:14px}
.warn{background:var(--wrnb);color:var(--wrn);border-radius:10px;padding:8px 10px;font-size:13px;margin:6px 0}
.okb{background:var(--okb);color:var(--ok);border-radius:10px;padding:8px 10px;font-size:13px;margin:6px 0}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{flex:1;border:0;background:var(--card);color:var(--ink);padding:9px 4px;font:600 13px system-ui}.seg button.on{background:var(--acc);color:#fff}
.foot{text-align:center;font-size:11px;color:var(--muted);margin:20px 0}
.typecard{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.typecard button{padding:14px 6px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:700 14px system-ui}.typecard button.on{border-color:var(--acc);background:var(--bg)}
.typecard span{display:block;font-size:26px}
</style>

<script>
"use strict";
/* ===================== DATA / CONSTANTS ===================== */
const VER="1.2";
const $=s=>document.querySelector(s);
const fmt=n=>(Math.round(n||0)).toLocaleString("en-US");
const fmt1=n=>(Math.round((n||0)*10)/10).toLocaleString("en-US");
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const TYPES={B:{n:"Bulk carrier",i:"🚢",gr:"Φορτηγό"},C:{n:"Container",i:"📦",gr:"Κοντέινερ"},G:{n:"Gas carrier",i:"🔥",gr:"Γκαζάδικο"}};
// size classes with typical particulars (editable after)
const SIZES={
B:[{k:"HANDY",n:"Handysize 28–40k",L:180,Lbp:172,B:28.8,D:14.6,T:10.2,dwt:35000,gt:22400,holds:5,cranes:4,grain:46000,kw:6500,gens:3,tce:12000,cons:22},
   {k:"SUPRA",n:"Supramax/Ultramax 50–64k",L:199,Lbp:194,B:32.26,D:18.5,T:13.0,dwt:61000,gt:35000,holds:5,cranes:4,grain:78000,kw:8500,gens:3,tce:14000,cons:26},
   {k:"PMX",n:"Panamax/Kamsarmax 75–85k",L:229,Lbp:222,B:32.26,D:20.0,T:14.4,dwt:82000,gt:43000,holds:7,cranes:0,grain:97000,kw:9800,gens:3,tce:15000,cons:30},
   {k:"CAPE",n:"Capesize 170–210k",L:292,Lbp:282,B:45,D:24.8,T:18.2,dwt:180000,gt:92000,holds:9,cranes:0,grain:198000,kw:16000,gens:3,tce:22000,cons:45}],
C:[{k:"FEED",n:"Feeder 700–1,200 TEU",L:150,Lbp:140,B:23.5,D:11.5,T:8.5,dwt:13000,gt:10000,teu:1000,reef:150,cranes:2,kw:8000,gens:3,tce:11000,cons:24,bt:1},
   {k:"FMAX",n:"Feedermax 1,700–2,800 TEU",L:182,Lbp:172,B:28,D:14.5,T:10.5,dwt:28000,gt:22000,teu:2200,reef:400,cranes:0,kw:16000,gens:4,tce:16000,cons:40,bt:1},
   {k:"PMXC",n:"Panamax 3,500–5,000 TEU",L:260,Lbp:248,B:32.25,D:19.3,T:12.5,dwt:52000,gt:42000,teu:4300,reef:600,cranes:0,kw:36000,gens:4,tce:25000,cons:75,bt:1},
   {k:"PPMX",n:"Post-Panamax 6,000–10,000 TEU",L:300,Lbp:286,B:42.8,D:24.6,T:14.5,dwt:100000,gt:90000,teu:8500,reef:800,cranes:0,kw:57000,gens:4,tce:40000,cons:110,bt:1},
   {k:"NPMX",n:"Neo-Panamax 12,000–15,000 TEU",L:366,Lbp:350,B:48.2,D:29.9,T:15.5,dwt:150000,gt:140000,teu:13500,reef:1000,cranes:0,kw:62000,gens:5,tce:55000,cons:130,bt:1}],
G:[{k:"LPGS",n:"Small LPG pressurised 3–7k cbm",L:105,Lbp:98,B:17.6,D:8.6,T:6.6,dwt:5500,gt:4500,cbm:5000,tanks:2,kw:3500,gens:3,tce:9000,cons:12,lng:0},
   {k:"LPGR",n:"Semi-ref / ethylene 10–22k cbm",L:160,Lbp:150,B:25.6,D:16,T:9.5,dwt:17000,gt:15000,cbm:20000,tanks:3,kw:7000,gens:3,tce:18000,cons:22,lng:0},
   {k:"MGC",n:"MGC LPG 35–40k cbm",L:180,Lbp:174,B:32.2,D:18.4,T:10.9,dwt:44000,gt:27000,cbm:38000,tanks:4,kw:9000,gens:3,tce:28000,cons:28,lng:0},
   {k:"VLGC",n:"VLGC 80–86k cbm",L:226,Lbp:219,B:36.6,D:22.2,T:11.6,dwt:55000,gt:48000,cbm:84000,tanks:4,kw:13000,gens:3,tce:40000,cons:38,lng:0},
   {k:"LNGM",n:"LNG membrane 150–180k cbm",L:295,Lbp:284,B:46.4,D:26.5,T:11.5,dwt:90000,gt:115000,cbm:174000,tanks:4,kw:28000,gens:4,tce:60000,cons:110,lng:1},
   {k:"LNGS",n:"LNG Moss / spherical 135–147k cbm",L:290,Lbp:277,B:48,D:28,T:11.4,dwt:75000,gt:110000,cbm:145000,tanks:4,kw:26000,gens:3,tce:45000,cons:150,lng:1}]};
const REGIONS=[
 {k:"CNN",n:"China North (Shandong/Dalian/Qingdao)",f:1.00,st:2.8},
 {k:"CNZ",n:"China Zhoushan/Shanghai",f:1.00,st:2.8},
 {k:"CNS",n:"China South (Guangzhou/Yiu Lian)",f:1.08,st:3.0},
 {k:"VN",n:"Vietnam",f:1.05,st:3.0},
 {k:"SG",n:"Singapore/Malaysia",f:1.35,st:3.8},
 {k:"ME",n:"Middle East (Dubai/Oman/Bahrain)",f:1.40,st:4.0},
 {k:"TR",n:"Turkey (Tuzla)",f:1.45,st:4.2},
 {k:"GR",n:"Greece (Perama/Elefsis)",f:1.60,st:4.8},
 {k:"EU",n:"Europe (Poland/Portugal/Spain)",f:1.70,st:5.0}];
const SECTIONS=[["03","General services"],["04","Dry-docking works"],["05","Surface treatment & painting"],["06","Steel renewal"],["07","Pipes"],["08","Valves"],["09","Engine room machinery"],["10","Deck fittings & gear"],["16","Cargo systems"],["11","Electrical & automation"],["12","Safety / LSA / FFE (yard)"],["13","Accommodation"],["14","Bridge & navigation"],["15","Miscellaneous"],["20","Modifications & upgrades"]];
const COND={R:"RQRD",I:"IF RQRD",O:"OPT"};

/* ===================== STORAGE ===================== */
const KEY="ddb:projects";
let DB={projects:[]};
try{DB=JSON.parse(localStorage.getItem(KEY))||DB}catch(e){}
DB.projects.forEach(p=>{const o=p.o;if(o.nextM==null)o.nextM=30;if(!o.pay)o.pay=[50,30,20];if(!o.payD)o.payD=[0,60,90]});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast("⚠ Αποθήκευση απέτυχε: "+e.message)}};
let cur=null, tab="ship";
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2300)}

/* ===================== PROJECT FACTORY ===================== */
function newProject(type,sizeK){
 const s=SIZES[type].find(x=>x.k===sizeK)||SIZES[type][0];
 const yr=new Date().getFullYear();
 const v={name:"",imo:"",type,size:s.k,L:s.L,Lbp:s.Lbp,B:s.B,D:s.D,T:s.T,dwt:s.dwt,gt:s.gt,built:yr-15,holds:s.holds||0,cranes:s.cranes||0,grain:s.grain||0,teu:s.teu||0,reef:s.reef||0,cbm:s.cbm||0,tanks:s.tanks||0,
  kw:s.kw,gens:s.gens,boiler:1,bwts:1,iccp:0,ffl:1,bt:s.bt||0,scrub:0,lng:s.lng||0,cls:"",flag:"",me:"",cb:{B:.83,C:.65,G:.74}[type]};
 const p={id:uid(),created:Date.now(),v,
  o:{survey:"SS",region:"CNN",yard:"",date:"",cond:"A",hull:"",holds:"",deck:"",steelT:null,tsw:0,prop:0,rudder:0,chain:0,crane5:1,hcOver:1,dock:null,afloat:null,dev:2,cont:3,tce:s.tce,cons:s.cons,vlsfo:600,mgo:800,
     prob:.5,disc:.10,grow:.12,cont2:.05,supts:2,nextM:30,pay:[50,30,20],payD:[0,60,90]},
  ov:{},cust:[],steel:[],sov:{},cust2:[],act:{},notes:""};
 return p;
}
/* ===================== CONTEXT ===================== */
function ctx(p){
 const v=p.v,o=p.o,c={v,o,type:v.type};
 c.age=Math.max(0,(o.date?new Date(o.date).getFullYear():new Date().getFullYear())-(+v.built||2010));
 c.ssNo=Math.min(5,Math.max(1,Math.round(c.age/5)));
 c.SS=o.survey==="SS";
 c.reg=REGIONS.find(r=>r.k===o.region)||REGIONS[0];c.rf=c.reg.f;
 c.gt=+v.gt||20000;c.dwt=+v.dwt||30000;c.L=+v.L||180;c.B=+v.B||28;c.D=+v.D||15;c.T=+v.T||10;c.Lbp=+v.Lbp||c.L*.96;
 c.sf=clamp(Math.sqrt(c.gt/22400),.55,2.8);
 // areas (Mumford wetted surface, calibrated on handysize work-done areas)
 const Lwl=c.Lbp*1.02, Cb=+v.cb||.8, tbR={B:.45,C:.55,G:.55}[c.type], Tb=c.T*tbR;
 const S=t=>1.7*Lwl*t+Cb*Lwl*c.B;
 const fb=Cb*Lwl*c.B*.9, vb=1.45*Math.max(0,S(Tb)-fb), bt=1.45*1.7*Lwl*(c.T-Tb), ts=2*Math.max(1,c.D-c.T)*c.L*1.5;
 const ho=c.type==="B"?.37*c.L*c.B:c.type==="C"?.62*c.L*c.B:0;
 const deck=Math.max(0,c.L*c.B*.9-ho);
 const holdsA=c.type==="B"?(5.5+1.3*(+v.holds||5))*Math.pow((+v.grain||c.dwt*1.25),2/3):0;
 c.A={fb,vb,bt,ts,hull:fb+vb+bt+ts,deck,hc:ho*1.26,cm:c.type==="B"?.18*c.L*c.B:c.type==="C"?.10*c.L*c.B:0,holds:holdsA,ho};
 if(p.v.areas){for(const k in p.v.areas){if(p.v.areas[k]>0)c.A[k]=+p.v.areas[k]}c.A.hull=c.A.fb+c.A.vb+c.A.bt+c.A.ts}
 // default scope levels
 c.hull=o.hull||(c.age<=5?"L":c.age<=10?"M":"H");
 c.holdsL=c.type!=="B"?"N":(o.holds||(c.SS&&c.age>=10?"P":"T"));
 c.deckL=o.deck||(c.SS?"T":"N");
 // steel estimate (t)
 const fac=c.age<10?.15:c.age<15?.5:c.age<20?1.1:2.0, cm={G:.7,A:1,P:1.6}[o.cond]||1, base=(c.type==="C"?c.gt:c.dwt)/1000;
 c.steelAuto=Math.round(base*fac*cm*(c.SS?1:.3)*(c.type==="G"?.7:1));
 c.steelT=o.steelT!=null&&o.steelT!==""?+o.steelT:c.steelAuto;
 // days
 const dockD=(c.SS?(c.ssNo>=3?7:6):5)+(o.tsw?1:0)+(c.gt>60000?1:0);
 const afl=(c.SS?{B:10,C:10,G:13}[c.type]:6)+Math.round(c.steelT/10)+(v.lng&&c.SS?3:0);
 c.dock=o.dock!=null&&o.dock!==""?+o.dock:dockD;
 c.afloat=o.afloat!=null&&o.afloat!==""?+o.afloat:afl;
 c.yard=c.dock+c.afloat;
 c.gasDays=c.type==="G"?(v.lng?6:3):1; // gas-freeing/warm-up + gassing-up/cool-down; others: tank prep
 c.offhire=(+o.dev||0)+c.gasDays+c.yard+(+o.cont||0);
 c.tugs=c.gt<30000?2:c.gt<80000?3:4;
 return c;
}
/* ===================== JOB LIBRARY =====================
 it(sec,id,desc,unit,qty(c),price,cond,flags) cond: "R"|"I"|"O"|fn ; flags: cls(class item),t(types),sc(price×size factor),nr(no region factor),gr(note)  */
const LIB=[];
const it=(sec,id,d,u,q,pr,cd="R",f={})=>LIB.push({sec,id,d,u,q,pr,cd,...f});
const HB={L:[.10,.05,.10,.05,.15,.10,.15,.10],M:[.20,.10,.20,.10,.25,.15,.30,.15],H:[.30,.15,.30,.15,.40,.20,.50,.20],F:[1,0,1,0,1,0,.6,.2]};
// ---- 03 GENERAL SERVICES
it("03","gs1","Connect/disconnect ballast, fire line, FW, SW cooling, air, sewage (all services)","MOVE",c=>12,45);
it("03","gs2","Remove/refit ballast tank vent heads & manholes for inspection, new gaskets","EACH",c=>Math.round((c.SS?26:10)*c.sf),45,"R",{cls:1});
it("03","gs3","Ballast water supply for undocking/trim","TON",c=>Math.round(c.dwt*.08),.5);
it("03","gs4","Fire line under pressure – per day","DAY",c=>c.yard,50);
it("03","gs5","SW cooling under pressure in dock – per day","DAY",c=>c.dock,50);
it("03","gs6","Compressed air supply – per day","DAY",c=>c.yard,40);
it("03","gs7","Fire / safety watch 24 h","DAY",c=>c.yard,290);
it("03","gs8","Security watch (ISPS) 24 h","DAY",c=>c.yard,150);
it("03","gs9","Fresh water supply","TON",c=>Math.round(15*c.yard*c.sf),3.5);
it("03","gs10","Gangways – per set per shifting (2 sets × 3 shiftings)","SET-TIME",c=>6,650,"R",{gr:"Γράψε 'per set per shifting' – όχι per day."});
it("03","gs11","Garbage removal – daily + MARPOL receipt","DAY",c=>c.yard+5,60);
it("03","gs12","Gas free certificates – daily visit + per hot work space","EACH",c=>c.yard+Math.round(20+c.steelT),55,"R",{gr:"1 επίσκεψη/ημέρα + ανά hot work (όχι 4/ημέρα)."});
it("03","gs13","Shore power – connection + kWh (dock period)","KWH",c=>Math.round(24*c.dock*(120+c.gt/300)),.42);
it("03","gs14","Shore crane / forklift (hours)","HOUR",c=>Math.round(40*c.sf),70);
it("03","gs15","Cherry pickers – general use (hours, daily log)","HOUR",c=>Math.round(60*c.sf),90);
it("03","gs16","General staging (deck, E/R, dock) – actual volume between supports","M3",c=>Math.round(2000*c.sf),2.8,"R",{gr:"Μέτρηση μόνο μεταξύ στηριγμάτων – χωρίς min."});
it("03","gs17","Staging in holds/tanks for Class close-up & UTM (if not cherry picker)","M3",c=>c.SS?Math.round(400*c.sf*(c.ssNo>=3?1:.5)):0,3.4,"I",{cls:1});
it("03","gs18","Wharfage at repair berth – per day afloat","DAY",c=>c.afloat,1,"R",{prf:c=>400+.025*c.gt});

/* ===================== ENGINE ===================== */
function lines(p,c){
 c=c||ctx(p);const out=[];
 for(const L of LIB){
  if(L.t&&!L.t.includes(c.type))continue;
  let q=+L.q(c)||0,pr=L.prf?L.prf(c):L.pr,cd=typeof L.cd==="function"?L.cd(c):L.cd;
  if(L.sc)pr*=c.sf;
  if(!L.nr)pr*=c.rf;
  if(L.steel){pr=steelCost(p,c).plate}if(L.steelA){pr=steelCost(p,c).assoc}
  const ov=p.ov[L.id]||{};
  const edited=ov.q!=null||ov.p!=null||ov.c!=null;
  if(ov.q!=null&&ov.q!=="")q=+ov.q;if(ov.p!=null&&ov.p!=="")pr=+ov.p;if(ov.c)cd=ov.c;
  if(q===0&&!edited&&!L.steel&&!L.steelA)continue;
  out.push({id:L.id,sec:L.sec,d:L.d,u:L.u,q,pr,cd,cls:L.cls,gr:L.gr,pt:L.pt,edited,note:ov.n||""});
 }
 for(const x of p.cust)out.push({id:x.id,sec:x.sec,d:x.d,u:x.u,q:+x.q||0,pr:+x.pr||0,cd:x.cd||"R",cust:1,note:x.n||""});
 return out;
}
function steelCost(p,c){
 const base=c.reg.st;
 let plate=0,kg=0,lowP=0,highP=0;
 if(p.steel.length){for(const s of p.steel){const v=(+s.kg||0)*base*(1+(+s.sur||0)/100);kg+=+s.kg||0;highP+=v;if(s.cd==="R")lowP+=v;plate+=s.cd==="R"?v:s.cd==="I"?v*p.o.prob:0}}
 else{kg=c.steelT*1000;plate=kg*base*1.35;lowP=plate*.75;highP=plate*1.25}
 const assoc=kg*0.25+(c.SS?2500:800)*c.sf;
 return {kg,plate,assoc,lowP,highP};
}
function wsum(ls,prob,mode){let s=0;for(const l of ls){const a=l.q*l.pr;if(l.cd==="R")s+=a;else if(l.cd==="I")s+=mode==="L"?0:mode==="H"?a:a*prob}return s}
function services(p,c){
 const out=[];
 for(const S of SV){if(S.t&&!S.t.includes(c.type))continue;let a=+S.amt(c)||0,cd=typeof S.cd==="function"?S.cd(c):S.cd;const ov=p.sov[S.id]||{};
  if(ov.a!=null&&ov.a!=="")a=+ov.a;if(ov.c)cd=ov.c;if(a===0&&ov.a==null)continue;out.push({id:S.id,cat:S.cat,d:S.d,amt:a,cd,edited:ov.a!=null||!!ov.c})}
 for(const x of p.cust2)out.push({id:x.id,cat:x.cat||"SERVICE",d:x.d,amt:+x.amt||0,cd:x.cd||"R",cust:1});
 return out;
}
function paints(p,c,ls){
 const agg={};for(const l of ls){if(!l.pt||l.cd==="O")continue;const w=l.cd==="I"?p.o.prob:1;agg[l.pt]=(agg[l.pt]||0)+l.q*w}
 // AF/AC lines are m2 per coat
 const rows=[];let tot=0;
 for(const k in PAINTS){if(!agg[k])continue;const P=PAINTS[k],ov=(p.pov||{})[k]||{};const pr=ov.pr!=null&&ov.pr!==""?+ov.pr:P.pr;
  const lit=agg[k]*P.dft/(P.vs*1000)*(1+P.l);const amt=lit*pr;tot+=amt;rows.push({k,n:P.n,m2:agg[k],dft:P.dft,vs:P.vs,lit,pr,amt})}
 const thin=tot*.04;
 return {rows,tot:tot+thin,thin};
}
function logistics(p,c){
 const o=p.o,L=[];const add=(id,d,a,cd="R")=>{const ov=(p.lov||{})[id];L.push({id,d,amt:ov!=null&&ov!==""?+ov:a,cd,edited:ov!=null&&ov!==""})};
 add("bk1",`Deviation bunkers VLSFO (${o.cons} t/d × ${o.dev} d × ${o.vlsfo} $/t)`,(+o.cons||0)*(+o.dev||0)*(+o.vlsfo||0));
 add("bk2",`MGO in yard (${fmt1(1+c.sf)} t/d × ${c.yard} d)`,(1+c.sf)*c.yard*(+o.mgo||0));
 if(c.type==="G")add("gf",c.v.lng?"LNG warm-up, gas-freeing, inerting & gassing-up/cool-down (N2, LNG heel/cool-down cargo)":"LPG gas-freeing / aeration & gassing-up / purging (N2, vapour)",c.v.lng?220000:35000*Math.min(c.sf,1.6));
 else add("gf","Tank cleaning / gas-freeing preparation (crew, chemicals)",2000);
 add("ag","Agency fees & expenses, CIQ, crew passes",8000*Math.min(c.sf,1.5)*(c.rf>1.3?1.4:1));
 add("pd","Port dues / pilots & tugs outside yard limits",6000*c.sf);
 add("su",`Superintendents (${o.supts} × ${c.yard+4} d × 180 $) + flights`,(+o.supts||0)*((c.yard+4)*180+1800));
 add("cb","Crew DD bonus / overtime",6000);
 add("cx","Class / certificate extension, documentation",1500,"I");
 add("rt","Riding team / extra fitters",12000,"O");
 return L;
}
function compute(p){
 const c=ctx(p),ls=lines(p,c),pr=p.o.prob,R={c,ls};
 R.sec=SECTIONS.map(([k,n])=>{const s=ls.filter(l=>l.sec===k);return{k,n,E:wsum(s,pr,"E"),L:wsum(s,pr,"L"),H:wsum(s,pr,"H"),n_:s.length}});
 const st=steelCost(p,c);
 // steel section uses its own low/high
 const s6=R.sec.find(x=>x.k==="06");if(s6&&p.steel.length){s6.L=st.lowP+st.assoc;s6.H=st.highP+st.assoc}
 else if(s6){s6.L=st.lowP+st.assoc;s6.H=st.highP+st.assoc}
 const Y=k=>R.sec.reduce((a,s)=>a+s[k],0);
 R.yard={};for(const k of["E","L","H"]){const b=Y(k),d=-b*p.o.disc,g=(b+d)*p.o.grow;R.yard[k]={b,d,g,t:b+d+g}}
 R.sv=services(p,c);const cats=["CLASS","UTM","SERVICE","LSA","FFE","NAV","SPARES","STORES","FORWARDING"];
 const swsum=(m)=>R.sv.reduce((a,x)=>a+(x.cd==="R"?x.amt:x.cd==="I"?(m==="L"?0:m==="H"?x.amt:x.amt*pr):0),0);
 R.pt=paints(p,c,ls);
 R.s2={E:swsum("E")+R.pt.tot,L:swsum("L")+R.pt.tot*.92,H:swsum("H")+R.pt.tot*1.08};
 R.lg=logistics(p,c);
 const lsum=m=>R.lg.reduce((a,x)=>a+(x.cd==="R"?x.amt:x.cd==="I"?(m==="L"?0:m==="H"?x.amt:x.amt*pr):0),0);
 R.s3={E:lsum("E"),L:lsum("L"),H:lsum("H")};
 R.tot={};for(const k of["E","L","H"]){const cn=(R.s2[k]+R.s3[k])*p.o.cont2;R.tot[k]={cont:cn,t:R.yard[k].t+R.s2[k]+R.s3[k]+cn}}
 R.loss=c.offhire*(+p.o.tce||0);
 const catE=cs=>R.sv.filter(x=>cs.includes(x.cat)).reduce((a,x)=>a+(x.cd==="R"?x.amt:x.cd==="I"?x.amt*pr:0),0);
 R.own={yard:R.yard.E.t,cls:catE(["CLASS","UTM"]),srv:catE(["SERVICE","LSA","FFE","NAV"]),spr:catE(["SPARES","STORES"]),pnt:R.pt.tot,log:R.s3.E+catE(["FORWARDING"]),cont:R.tot.E.cont,cash:R.tot.E.t,off:R.loss};
 R.own.all=R.own.cash+R.own.off;
 const o=p.o;R.extraDay=c.rf*(400+.1*c.gt)+695*c.rf+(+o.supts||0)*180+(+o.tce||0);
 R.perDay=R.own.cash/Math.max(1,(+o.nextM||30)*30.4);
 return R;
}

function tenderRows(p,R,inc){
 const c=R.c,out=[];let sn={};
 for(const [k,n] of SECTIONS){
  let ls=R.ls.filter(l=>l.sec===k&&(l.cd==="R"||(inc.I&&l.cd==="I")||(inc.O&&l.cd==="O")));

   const groups=[["fb"],["vb"],["bt"],["ts"]];

    out.push({type:"H",id:`${k}.${hn}`,d:`HULL – ${HULLT[a]} (area ≈ ${fmt(c.A[a])} m²)`});let i=0;
    for(const l of gl){i++;out.push({type:"I",id:`${k}.${hn}.${i}`,d:l.d.replace(/^[^:]+: /,""),u:l.u,q:l.q,cd:l.cd,cls:l.cls})}}

     [`CARGO HOLDS (area ≈ ${fmt(c.A.holds)} m²)`,x=>x.id.startsWith("c_")],["OTHER",x=>x.id==="x_lb"||x.cust]];
   for(const [t,f] of rest){const gl=ls.filter(f);if(!gl.length)continue;hn++;out.push({type:"H",id:`${k}.${hn}`,d:t});let i=0;
    for(const l of gl){const td=TD[l.id];if(td){for(const s of td.i){const q=s[2]?s[2](c,l):l.q;if(!q&&q!==0)continue;i++;out.push({type:"I",id:`${k}.${hn}.${i}`,d:s[0],u:s[1],q,cd:l.cd,cls:l.cls})}}
     else{i++;out.push({type:"I",id:`${k}.${hn}.${i}`,d:l.d,u:l.u,q:l.q,cd:l.cd,cls:l.cls,note:l.note})}}}
   continue;
  }

   if(l.steel||l.steelA){
    if(l.steelA)continue;hn++;
    out.push({type:"H",id:`${k}.${hn}`,d:"STEEL RENEWAL – as per STEEL TARIFF sheet (provisional quantities)"});

    hn++;out.push({type:"H",id:`${k}.${hn}`,d:"STEEL ASSOCIATED WORKS"});

     .forEach((x,i)=>out.push({type:"I",id:`${k}.${hn}.${i+1}`,d:x[0],u:x[1],q:x[2],cd:"R"}));
    continue}
   hn++;const td=TD[l.id];
   if(td){out.push({type:"H",id:`${k}.${hn}`,d:td.t,cls:l.cls});let i=0;

  }

function cashflow(p,R){

 const sp=o.pay.reduce((a,b)=>a+(+b||0),0);

function checks(p,R){

 if(rng&&p.o.survey==="SS"){if(per<rng[0]*.8)w.push(`⚠ Expected ${per.toFixed(2)}M κάτω από το συνηθισμένο εύρος (${rng[0]}–${rng[1]}M) – μήπως λείπει scope;`);else if(per>rng[1]*1.2)w.push(`⚠ Expected ${per.toFixed(2)}M πάνω από το εύρος (${rng[0]}–${rng[1]}M) – έλεγξε steel/blasting/τιμές.`);else w.push(`✓ Expected ${per.toFixed(2)}M μέσα στο ενδεικτικό εύρος (${rng[0]}–${rng[1]}M).`)}
 if(c.SS&&c.ssNo>=3&&c.steelT<10)w.push("⚠ Special Survey ≥3 με κάτω από 10 t steel – πολύ αισιόδοξο χωρίς UTM.");
 if(c.SS&&!p.o.tsw)w.push("💡 Tailshaft: έλεγξε μέθοδο survey στην Class – η withdrawal είναι IF RQRD.");
 if(c.age>=10&&c.hull==="L")w.push("⚠ Πλοίο ≥10 ετών με Light blasting – πιθανή υποεκτίμηση.");
 if(c.type==="B"&&c.holdsL==="N"&&c.SS)w.push("💡 Special Survey χωρίς εργασίες holds – σίγουρα;");
 if(c.type==="G")w.push("💡 Gas: προσθέτεις ημέρες gas-freeing/warm-up & gassing-up/cool-down στο off-hire ("+c.gasDays+" ημ.).");
 if((+p.v.cranes||0)>0&&!p.o.crane5)w.push("💡 Cranes: έλεγξε πότε είναι το 5-yearly proof load test.");
 const cls=R.ls.filter(l=>l.cls&&l.cd==="O");if(cls.length)w.push(`⚠ ${cls.length} γραμμές CLASS είναι OPT – θα τις ζητήσει ο surveyor.`);
 w.push("💡 Όροι που γλιτώνουν χρήματα: staging μεταξύ στηριγμάτων, όχι min 15 kg/piece, gangway per shifting, touch-ups ×1.2, joint steel marking.");
 return w.map(x=>`<div class="${x.startsWith("✓")?"okb":"warn"}">${esc(x)}</div>`).join("");
}
