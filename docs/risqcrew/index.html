arms in ECR; alarm printer working; UMS start/stop times in E/R log; no correction fluid","Walang permanenteng alarm sa ECR; gumagana ang alarm printer; UMS start/stop times sa E/R log; walang correction fluid"],["13.33","Gauges readable, boiler panel clear, FWG working, safety valve handles fitted","Nababasa ang gauges, malinis ang boiler panel, gumagana ang FWG, may handle ang safety valves"],["13.20","Lagging/insulation closed on exhausts and boiler; no oil-soaked insulation","Sarado ang lagging/insulation sa exhaust at boiler; walang insulation na basa ng langis"],["13.29","E/R floor & steering gear: no loose spares, plates secured, drip trays dry","E/R floor at steering gear: walang maluwag na spares, naka-secure ang plates, tuyo ang drip trays"],["13.39","Earth insulation readings on switchboards OK; insulation mats in place","OK ang earth insulation readings sa switchboards; nakalagay ang insulation mats"],["5.25","Ballast remote valves & level indicators working; valve timing records","Gumagana ang ballast remote valves at level indicators; may valve timing records"]]],["Bosun & ABs",[["10.4","Mooring lines and tails in good order; no damaged eyes; discard per line plan","Maayos ang mooring lines at tails; walang sirang eye; discard ayon sa line plan"],["10.9","Only one layer on the tension section of split drums","Isang layer lang sa tension section ng split drums"],["10.5","Winch brake marking visible after rendering test","Kita ang winch brake marking pagkatapos ng rendering test"],["14.13","Forecastle & bosun store: everything lashed, no loose plates or ladders","Forecastle at bosun store: lahat naka-lashing, walang maluwag na plates o ladders"],["14.4","Deck pipes: clamps fitted, no heavy corrosion","Deck pipes: may clamps, walang matinding kalawang"],["14.12","Gas lockers: cylinders secured, FULL/EMPTY marked, vents fitted","Gas lockers: cylinders naka-secure, may markang FULL/EMPTY, may vents"],["5.8","Save-alls dry and plugged; trays under hydraulic rams","Tuyo at may plug ang save-alls; may trays sa ilalim ng hydraulic rams"],["*","Gangway watch: every visitor signs the log and gets the safety familiarization before going around the ship","Gangway watch: bawat bisita pipirma sa log at bibigyan ng safety familiarization bago maglibot sa barko"],["4.5","Standby man at enclosed space entrance: check the permit time ≤ now before anyone enters; take and WRITE readings every 15 min (time + O2/LEL/H2S/CO); nobody enters after a break without a new reading","Standby man sa pasukan ng enclosed space: tingnan na ang oras sa permit ay hindi lalampas sa ngayon bago may pumasok; kumuha at ISULAT ang readings bawat 15 minuto (oras + O2/LEL/H2S/CO); walang papasok pagkatapos ng break nang walang bagong reading"]]],["Cook & Steward",[["14.16","Meat room ≤ -18 °C, fish/veg rooms in range; thermometers readable and logged","Meat room ≤ -18 °C, nasa tamang range ang fish/veg rooms; nababasa at naka-log ang thermometers"],["14.18","Hospital clean, used only for medical; weekly flushing of taps & showers logged","Malinis ang hospital, para lang sa medical; weekly flushing ng gripo at shower naka-log"],["15.2","Galley clean, food stored properly, hygiene records","Malinis ang galley, tama ang pag-imbak ng pagkain, may hygiene records"],["*","Know the fire/abandon ship alarm and your muster station duty","Alamin ang fire/abandon ship alarm at ang tungkulin mo sa muster station"]]]],"drill":[["Safety officer","What are the safe readings before entering an enclosed space?","O₂ 20.9%, CO₂ less than 0.5% (5,000 ppm), less than 1% LFL, toxic gases less than 50% of OEL. Steady readings, after ventilation and risk assessment.","4.5","Ano ang ligtas na readings bago pumasok sa enclosed space?","O₂ 20.9%, CO₂ mas mababa sa 0.5% (5,000 ppm), mas mababa sa 1% LFL, toxic gases mas mababa sa 50% ng OEL. Steady na readings, pagkatapos ng ventilation at risk assessment."],["Safety officer","How often do you check the atmosphere while people are inside?","Continuously with personal detectors, and repeat readings every 30 minutes and after every break, as per company procedure.","4.5","Gaano kadalas mo chine-check ang hangin habang may tao sa loob?","Tuloy-tuloy gamit ang personal detectors, at ulitin ang readings bawat 30 minuto at pagkatapos ng bawat break, ayon sa company procedure."],["Safety officer","Show me how you start the rescue boat engine manually.","(Demonstrate) – fuel on, choke, hand start as per maker instructions. Deputy must also be able to do it.","4.18","Ipakita mo kung paano i-start nang manual ang makina ng rescue boat.","(Ipakita) – fuel on, choke, hand start ayon sa instructions ng maker. Dapat kaya rin ito ng deputy."],["Safety officer","Which spaces on board are enclosed spaces?","As per the enclosed space register: cargo holds, ballast/fuel tanks, void spaces, duct keel, chain lockers, CO₂ room, forecastle store, etc.","4.5","Aling mga space sa barko ang enclosed space?","Ayon sa enclosed space register: cargo holds, ballast/fuel tanks, void spaces, duct keel, chain lockers, CO₂ room, forecastle store, atbp."],["OOW","What do you do if one ECDIS fails? And if both fail?","Follow the ECDIS failure procedure: switch to back-up ECDIS / paper or approved back-up, inform Master, position fixing by other means; drill records.","3.1","Ano ang gagawin mo kung masira ang isang ECDIS? At kung parehong masira?","Sundin ang ECDIS failure procedure: lumipat sa back-up ECDIS / paper o approved back-up, sabihan ang Master, kunin ang position sa ibang paraan; may drill records."],["OOW","What is the cross-track limit you use in open sea and why?","As per company SMS (e.g. 2 nm each side in open sea), smaller in coastal waters; no danger inside the XTL.","3.21","Ano ang cross-track limit na gamit mo sa open sea at bakit?","Ayon sa company SMS (hal. 2 nm bawat gilid sa open sea), mas maliit sa coastal waters; walang panganib sa loob ng XTL."],["OOW","How is the power limiter overridden and who decides?","Master decides; override procedure/time on the pilot card; logged and reported.","3.3","Paano ina-override ang power limiter at sino ang nagdedesisyon?","Ang Master ang nagdedesisyon; nasa pilot card ang override procedure/oras; naka-log at ini-report."],["OOW","What GNSS alarms do you know?","RAIM integrity, jamming/spoofing, multipath, datum mismatch, loss of fix.","3.26","Anong mga GNSS alarm ang alam mo?","RAIM integrity, jamming/spoofing, multipath, datum mismatch, loss of fix."],["OOW","When do you call the Master?","As per Master's standing/night orders: restricted visibility, traffic, equipment failure, doubt, etc.","3.9","Kailan mo tatawagin ang Master?","Ayon sa standing/night orders ng Master: restricted visibility, traffic, sira ng equipment, kapag may duda, atbp."],["EOOW","Show me the OWS 15 ppm alarm test.","Recirculate / simulate >15 ppm: audible and visual alarm, three-way valve recirculates (auto-stop).","5.15","Ipakita mo ang test ng OWS 15 ppm alarm.","I-recirculate / i-simulate ang >15 ppm: may tunog at ilaw na alarm, nagre-recirculate ang three-way valve (auto-stop)."],["EOOW","How do you start the emergency generator and put it on the board?","Local start (primary and secondary method), check voltage/frequency, emergency switchboard automatic transfer; tested under load every quarter.","13.36","Paano mo i-start ang emergency generator at ilagay sa board?","Local start (primary at secondary na paraan), i-check ang voltage/frequency, automatic transfer sa emergency switchboard; sinusubukan na may load bawat quarter."],["EOOW","Who decides the engine room manning in an unplanned situation (blackout, fire, flooding)?","As per the engineering manning matrix: Chief Engineer changes the manning level; it is logged.","13.2","Sino ang nagdedesisyon ng engine room manning sa biglaang sitwasyon (blackout, sunog, pagbaha)?","Ayon sa engineering manning matrix: ang Chief Engineer ang nagpapalit ng manning level; naka-log ito."],["EOOW","When was the last OPL override training?","Within the last 3 months, recorded (and after change of key crew).","13.1","Kailan ang huling OPL override training?","Sa loob ng huling 3 buwan, naka-record (at pagkatapos ng palit ng key crew)."],["Bosun","What is the minimum breaking load of your mooring lines and when do you discard them?","As per line management plan / certificates: LDBF ≥100% ship design MBL; discard criteria per plan.","10.4","Ano ang minimum breaking load ng mooring lines ninyo at kailan ito dini-discard?","Ayon sa line management plan / certificates: LDBF ≥100% ng ship design MBL; discard criteria ayon sa plan."],["Bosun","Why only one layer on the tension drum?","The brake holding capacity is set for the first layer; more layers reduce brake capacity.","10.9","Bakit isang layer lang sa tension drum?","Ang lakas ng brake ay naka-set para sa unang layer; kapag dumami ang layer, humihina ang brake."],["AB","What PPE do you wear to rig the pilot ladder?","As per PPE matrix: lifejacket, safety harness attached to strong point, helmet, gloves, safety shoes.","4.11","Anong PPE ang suot mo sa pag-rig ng pilot ladder?","Ayon sa PPE matrix: lifejacket, safety harness na nakakabit sa strong point, helmet, gloves, safety shoes."],["AB","Where is the pilot ladder secured?","To the approved strong points on deck, never to handrails.","4.37","Saan naka-secure ang pilot ladder?","Sa approved strong points sa deck, hindi kailanman sa handrails."],["Any crew","What do you do if you see unsafe work?","Stop work authority: stop the job, inform the officer; no blame.","4.8","Ano ang gagawin mo kung may nakita kang hindi ligtas na trabaho?","Stop work authority: itigil ang trabaho, sabihan ang officer; walang sisihan."],["Any crew","How do you report harassment or bullying?","Complaint procedure / locked confidential box / company contacts and ISWAN.","15.9","Paano mag-report ng harassment o bullying?","Complaint procedure / nakakandadong confidential box / contacts ng company at ISWAN."],["Any crew","Where is your muster station and your duty?","As per muster list (know it by heart).","4.24","Nasaan ang muster station mo at ano ang tungkulin mo?","Ayon sa muster list (dapat kabisado)."],["Fitter / 2/E","Show me the flashback arrestors on the gas lines.","At regulator outlet and at blowpipe; renewal date ≤5 years / per maker.","4.17","Ipakita mo ang flashback arrestors sa gas lines.","Sa labasan ng regulator at sa blowpipe; renewal date ≤5 taon / ayon sa maker."],["C/O","How often do you measure hatch cover clearances?","Every 6 months as per maker / company procedure; records signed; within tolerances.","9A.2","Gaano kadalas sinusukat ang hatch cover clearances?","Bawat 6 buwan ayon sa maker / company procedure; may pirma ang records; pasok sa tolerances."],["C/O","When was the last crane rocking test?","Within 6 months; result in Register of Lifting Appliances vs maker limits.","9A.19","Kailan ang huling crane rocking test?","Sa loob ng 6 buwan; nasa Register of Lifting Appliances ang resulta kumpara sa limits ng maker."],["Master","When was the last VDR playback and who reviewed it?","Date + office assessment report on file.","3.15","Kailan ang huling VDR playback at sino ang nag-review?","Petsa + assessment report ng opisina na naka-file."],["Master","Where is the hot work plan approval for work outside the workshop?","Email/approval from office before starting, attached to the permit.","4.7","Nasaan ang approval ng hot work plan para sa trabaho sa labas ng workshop?","Email/approval mula sa opisina bago magsimula, nakakabit sa permit."],["Master","Which safety-critical defects are open now, and who has been informed?","Show the defect register and the messages to office/Flag/Class. Tell the truth — never hide a defect from the PSCO.","4.1","Anong safety-critical na sira ang bukas ngayon, at sino ang na-inform?","Ipakita ang defect register at mga mensahe sa office/Flag/Class. Sabihin ang totoo — huwag itago ang sira sa PSCO."],["Master","What makes this port/voyage higher risk than the last call?","Local rules (ECA, ballast, biosecurity, arrival reports), the current CIC, charts/pubs for the area, the ballast and cargo plan.","3.23","Ano ang nagpapataas ng risk sa port/biyaheng ito kumpara sa huli?","Local rules (ECA, ballast, biosecurity, arrival report), ang kasalukuyang CIC, chart/pubs ng lugar, ballast at cargo plan."],["C/O","Show the max tank-top / hatch-cover / deck load for today's cargo.","From the approved loading manual / CSM: the limit per hold, hatch cover and deck, compared with the actual cargo plan.","8A.4","Ipakita ang max load ng tank-top / hatch cover / deck para sa cargo ngayon.","Mula sa approved loading manual / CSM: limit bawat hold, hatch cover at deck, ikumpara sa cargo plan."],["C/O","Show me the evidence for this pilot ladder.","Certificate/ID of that ladder, inspection and use records, rigged on the approved strong points.","4.37","Ipakita ang ebidensya para sa pilot ladder na ito.","Certificate/ID ng ladder, record ng inspection at gamit, nakatali sa approved strong point."],["C/E","What happens when the OCM sample flow is lost? Show me without discharge.","Fail-safe: alarm and the 3-way valve goes back to bilge — no overboard. Demonstrate in recirculation only.","5.15","Ano ang mangyayari kapag nawala ang sample flow ng OCM? Ipakita nang walang discharge.","Fail-safe: mag-alarm at babalik sa bilge ang 3-way valve — walang overboard. Ipakita sa recirculation lang."],["C/E","Your BWMS fails before a US port — what do you do?","No discharge. Report to the COTP as required and follow the approved contingency. Ballast exchange alone is not accepted where the US standard applies.","5.10","Nasira ang BWMS bago ang US port — ano ang gagawin mo?","Walang discharge. I-report sa COTP at sundin ang approved contingency. Hindi tanggap ang ballast exchange lang kung saan may US standard."],["3/E","Where is the emergency fire pump suction and how do you pressurise the fire main?","Walk the route: sea suction valve, priming, isolating valve closed, start, pressure at the two highest hydrants.","4.28","Nasaan ang suction ng emergency fire pump at paano mo bibigyan ng pressure ang fire main?","Ipakita ang daan: sea suction valve, priming, sarado ang isolating valve, start, pressure sa 2 pinakamataas na hydrant."],["Cook","How do you record potable water, food temperatures and expired stock?","Water analysis/treatment log, fridge/freezer temperature log, first-in-first-out, expired stock removed and recorded.","15.5","Paano mo nire-record ang inuming tubig, temperatura ng pagkain at expired na stock?","Water analysis/treatment log, temperature log ng ref/freezer, first-in-first-out, inaalis at nire-record ang expired."],["SSO","A visitor is not on the list — what do you do, without showing the SSP?","Deny access until verified with agent/terminal, escort, log it, inform the Master. The SSP stays confidential.","12.1","Wala sa listahan ang bisita — ano ang gagawin mo nang hindi ipinapakita ang SSP?","Huwag papasukin hanggang ma-verify sa agent/terminal, may escort, i-log, sabihan ang Master. Kumpidensyal ang SSP."],["Chief Officer","The risk assessment for tank entry shows a score of 12 (yellow). What do you do before entry?","Add additional control measures (continuous ventilation, personal 4-gas meter for each entrant, rescue set and standby man at the entrance, comms with bridge), re-score the residual risk until it is acceptable (green) and have it approved. No entry with a yellow/red score without measures.","4.5","Ang risk assessment para sa pagpasok sa tank ay may score na 12 (dilaw). Ano ang gagawin mo bago pumasok?","Magdagdag ng additional control measures (tuloy-tuloy na ventilation, personal 4-gas meter sa bawat papasok, rescue set at standby man sa pasukan, comms sa bridge), i-score ulit ang residual risk hanggang acceptable (berde) at ipa-approve. Bawal pumasok kung dilaw/pula ang score at walang measures."],["Standby man","People have been in the tank since 08:00. What must the atmosphere log show?","A reading with the time every 15 minutes (O2, LEL, H2S, CO) for the whole time anyone is inside, and a new reading before re-entry after any break. The first gas test time must be BEFORE the entry time on the permit.","4.5","May tao sa tank mula 08:00. Ano ang dapat makita sa atmosphere log?","Reading na may oras bawat 15 minuto (O2, LEL, H2S, CO) sa buong oras na may tao sa loob, at bagong reading bago pumasok ulit pagkatapos ng break. Ang oras ng unang gas test ay dapat BAGO ang oras ng pagpasok sa permit."],["Chief Officer","Show me the Enclosed Space Register.","Ship-specific list (MSC.581(110)) of every enclosed space – holds, WBT, DB/FO/DO tanks, cofferdams, duct keel, chain lockers, forepeak, CO2 room, paint store, void spaces – with connected/adjacent spaces, hazards, control measures and how the atmosphere is tested. Entrances marked 'DANGER – ENCLOSED SPACE'.","4.5","Ipakita mo ang Enclosed Space Register.","Listahan para sa barkong ito (MSC.581(110)) ng bawat enclosed space – holds, WBT, DB/FO/DO tanks, cofferdams, duct keel, chain lockers, forepeak, CO2 room, paint store, void spaces – kasama ang connected/adjacent spaces, hazards, control measures at paano sinusukat ang hangin. May markang 'DANGER – ENCLOSED SPACE' ang mga pasukan."]],"docs":[["1. General",["Class Survey Status Report (≤7 days)","Certificate of Registry","Classification certificate","Cargo Ship Safety Construction","International Load Line (+ exemptions)","Document of Compliance (DOC)","Continuous Synopsis Record","Bunker CLC","P&I certificate of entry","Dispensations","ISM declaration of owner","Last TWO superintendent visit reports"]],["2. Certification & Personnel",["Minimum Safe Manning","MLC certificate + DMLC I/II + financial security","Drug & alcohol test – shore-based","Alcohol meter calibration","Officer matrix (cross-checked with CoCs)"]],["3. Navigation",["Chart / ENC management service","Gyro annual service","Magnetic compass adjustment","VDR / S-VDR annual test"]],["4. ISM / LSA-FFE",["Cargo Ship Safety Equipment","Oxy-acetylene annual check by competent person","CO₂ system inspection","ELSA / EEBD inspection","Foam analysis (latest)","Lifeboat & davit annual inspection","Rescue boat & on-load release annual","Liferafts annual service","Immersion suits test","Inflatable lifejackets service","Portable extinguishers annual","SCBA bottles + air quality test","PPE matrix","Pilot ladder certificates (+ authenticity check)","Helicopter area Class strength letter","Last Master review + office reply","Last safety meeting + office reply","Last ship/shore checklist","Latest internal & external audits","Visitor / inspector safety familiarization form (signed at gangway)","Enclosed Space Register (ship-specific, MSC.581(110)) with hazards & control measures","Last enclosed space permits with risk assessment + 15-min atmosphere log (with times)"]],["5. Pollution",["IOPP + Supplement Form A/B","IAPP + Supplement","ISPP (sewage)","Ballast Water Management Certificate","BWTS discharge analysis","15 ppm monitor calibration","EGCS sensors calibration (if fitted)","IEEC + SEEMP compliance","SOPEP / SMPEP approval","Garbage statement of compliance","Approved rate of discharge (sewage)"]],["7. Fuel",["Bunker line pressure test","Last TWO bunker plans/checklists (HFO & LSMGO)","Fuel oil analysis reports","Maker/Class statement – burning lighter fuel"]],["8–9. Cargo, hatch covers, cranes",["Loadicator approval & survey","Cargo gear register / attestation","Hatch cover hydraulic oil analysis","Hatch cover clearance records","Crane rocking test records","GAFTA/FOSFA hold inspection certificate"]],["10. Mooring",["Line management plan","Mooring line & tail certificates","Winch brake test report","Company policy for mooring inspection & wear zones"]],["11–12. Radio & Security",["Safety Radio certificate","Radio periodic survey report","GMDSS shore maintenance agreement","EPIRB annual test","SART & AIS annual test","ISSC"]],["13–15. Machinery & welfare",["EIAPP + NOx technical files","IHM statement of compliance","Asbestos free declaration","Temperature/pressure calibrator certificate","Medical chest certificate","ITF certificate (if applicable)","Last accommodation inspection record"]]],"docsi":{"Class Survey Status Report (≤7 days)":["Class printout of all certificates, surveys, CoC/recommendations and memoranda. Download it from the Class website not more than 7 days before. Check: no overdue survey or CoC; every dispensation or postponement has a letter.","Printout ng Class ng lahat ng certificates, surveys, CoC/recommendations at memoranda. I-download sa Class website hindi hihigit sa 7 araw bago. I-check: walang overdue na survey o CoC; may sulat ang bawat dispensation o postponement."],"Certificate of Registry":["Flag registration certificate (permanent or provisional). Show the valid original; ship name, IMO, owner and port of registry must match all other certificates.","Certificate ng rehistro sa Flag (permanent o provisional). Ipakita ang valid na original; dapat tugma ang pangalan ng barko, IMO, owner at port of registry sa lahat ng ibang certificates."],"Classification certificate":["Class certificate for hull and machinery (full term, with annual endorsements). Show it valid and endorsed for the last annual survey.","Class certificate ng hull at machinery (full term, may annual endorsements). Ipakitang valid at may endorsement ng huling annual survey."],"Cargo Ship Safety Construction":["SOLAS Safety Construction certificate (hull, structure, machinery). Check the annual/intermediate endorsements are signed and inside the window.","SOLAS Safety Construction certificate (hull, istruktura, makina). I-check na may pirma ang annual/intermediate endorsements at pasok sa window."],"International Load Line (+ exemptions)":["Load Line certificate: freeboard and marks. Upload with any Load Line exemption certificate. Draught marks and Plimsoll on the hull must match.","Load Line certificate: freeboard at marks. I-upload kasama ang anumang Load Line exemption certificate. Dapat tugma ang draught marks at Plimsoll sa hull."],"Document of Compliance (DOC)":["Copy of the Company's ISM DOC (issued to the office). It must be valid, annually endorsed, and cover this ship type (e.g. bulk carrier).","Kopya ng ISM DOC ng Company (para sa opisina). Dapat valid, may annual endorsement, at kasama ang uri ng barko (hal. bulk carrier)."],"Continuous Synopsis Record":["CSR (SOLAS XI-1/5): full history of name, flag, owner, manager and Class. All CSR documents on board, in order, with no gaps; the latest one must match the current certificates.","CSR (SOLAS XI-1/5): buong kasaysayan ng pangalan, flag, owner, manager at Class. Lahat ng CSR documents nasa barko, sunod-sunod, walang kulang; ang huli ay dapat tugma sa kasalukuyang certificates."],"Bunker CLC":["Bunker Convention certificate (liability insurance for bunker oil pollution), issued by a State on the P&I blue card. Check expiry (normally 20 February).","Bunker Convention certificate (insurance para sa polusyon ng bunker oil), galing sa isang State batay sa P&I blue card. I-check ang expiry (karaniwan 20 February)."],"P&I certificate of entry":["P&I Club certificate of entry (third-party insurance). Must be for the current policy year (from 20 February) and with the correct ship name and owner.","Certificate of entry ng P&I Club (third-party insurance). Dapat para sa kasalukuyang policy year (mula 20 February) at tama ang pangalan ng barko at owner."],"Dispensations":["Any Flag/Class dispensation, exemption or extension (e.g. postponed survey, equipment exemption). Upload all valid ones; each must be valid and explained. If none, upload a note \"No dispensations\".","Anumang dispensation, exemption o extension ng Flag/Class (hal. na-postpone na survey, exemption sa equipment). I-upload lahat ng valid; bawat isa ay dapat valid at may paliwanag. Kung wala, mag-upload ng note na \"No dispensations\"."],"ISM declaration of owner":["Owner's letter appointing the ISM Company (manager) and handing it ISM responsibility. Names must match the DOC and the CSR.","Sulat ng owner na nagtatalaga sa ISM Company (manager) at nagbibigay ng ISM responsibility. Dapat tugma ang mga pangalan sa DOC at CSR."],"Last TWO superintendent visit reports":["The last 2 office superintendent inspection reports, with findings and close-out. The inspector checks that findings were closed and the office really visits the ship.","Ang huling 2 inspection report ng superintendent ng opisina, may findings at close-out. Chine-check ng inspector na sarado ang findings at talagang bumibisita ang opisina."],"Minimum Safe Manning":["Flag Minimum Safe Manning Document. The crew on board (ranks, number, CoCs) must be equal to or more than this document.","Minimum Safe Manning Document ng Flag. Ang crew sa barko (ranks, bilang, CoCs) ay dapat pareho o higit pa sa nakasulat dito."],"MLC certificate + DMLC I/II + financial security":["Maritime Labour Certificate, DMLC Part I (Flag) and Part II (Company), plus the two financial security certificates (repatriation and liability). All valid and posted on board.","Maritime Labour Certificate, DMLC Part I (Flag) at Part II (Company), kasama ang dalawang financial security certificates (repatriation at liability). Lahat valid at nakapaskil sa barko."],"Drug & alcohol test – shore-based":["Report of the last unannounced drug & alcohol test by an outside lab/company (normally yearly per company policy and OCIMF). Show the date and the list of crew tested.","Report ng huling biglaang drug & alcohol test ng labas na lab/company (karaniwan taon-taon ayon sa company policy at OCIMF). Ipakita ang petsa at listahan ng crew na na-test."],"Alcohol meter calibration":["Calibration certificate of the ship's breathalyser (alcohol tester). Must be valid per maker (often 6–12 months), serial no. same as the unit; tests recorded in the alcohol log.","Calibration certificate ng breathalyser (alcohol tester) ng barko. Dapat valid ayon sa maker (madalas 6–12 buwan), pareho ang serial no. sa unit; naka-record ang tests sa alcohol log."],"Officer matrix (cross-checked with CoCs)":["RightShip/OCIMF officer matrix: rank, CoC, time in rank, time with company, time on this type. Every line must match the real CoCs, endorsements and contracts.","Officer matrix ng RightShip/OCIMF: rank, CoC, time in rank, time sa company, time sa ganitong barko. Bawat linya ay dapat tugma sa totoong CoCs, endorsements at contracts."],"Chart / ENC management service":["Contract/licence for chart and ENC supply and updates (e.g. AVCS, ChartWorld). Show licence valid for the voyage, latest weekly update applied, and permits for the planned route.","Contract/licence para sa supply at update ng charts at ENC (hal. AVCS, ChartWorld). Ipakita na valid ang licence sa voyage, applied ang huling weekly update, at may permits sa planned route."],"Gyro annual service":["Service report of the gyro compass by an authorised maker technician, normally yearly. Show the report and any defects closed.","Service report ng gyro compass ng authorised technician ng maker, karaniwan taon-taon. Ipakita ang report at sarado ang anumang depekto."],"Magnetic compass adjustment":["Deviation card from the last compass adjustment by a licensed adjuster (every 2 years or after big repairs). Deviations recorded in the compass log every watch/daily.","Deviation card mula sa huling compass adjustment ng lisensyadong adjuster (bawat 2 taon o pagkatapos ng malaking repair). Naka-record ang deviations sa compass log bawat watch/araw-araw."],"VDR / S-VDR annual test":["Annual Performance Test (APT) certificate of the VDR by an approved service company (SOLAS V/18.8). Plus the latest data download/playback record.","Annual Performance Test (APT) certificate ng VDR mula sa approved service company (SOLAS V/18.8). Kasama ang huling record ng data download/playback."],"Cargo Ship Safety Equipment":["SOLAS Safety Equipment certificate + Form E (Record of Equipment). Form E numbers (liferafts, lifejackets, immersion suits, pilot ladder type) must match what is on board.","SOLAS Safety Equipment certificate + Form E (Record of Equipment). Dapat tugma ang bilang sa Form E (liferafts, lifejackets, immersion suits, uri ng pilot ladder) sa nasa barko."],"Oxy-acetylene annual check by competent person":["Annual inspection report of the gas welding system: hoses, regulators, flashback arrestors, pipes, cylinders. By a competent person/service company; arrestors renewed per maker (≤5 years).","Annual inspection report ng gas welding system: hoses, regulators, flashback arrestors, tubo, cylinders. Ng competent person/service company; pinapalitan ang arrestors ayon sa maker (≤5 taon)."],"CO₂ system inspection":["Service report of the fixed CO₂ system (annual + bottle weight/level check, 2-yearly/5-yearly per MSC.1/Circ.1318). Shows bottle contents, release lines blown through, alarms tested.","Service report ng fixed CO₂ system (annual + check ng timbang/level ng bote, 2-yearly/5-yearly ayon sa MSC.1/Circ.1318). Ipinapakita ang laman ng bote, nalinis ang release lines, nasubukan ang alarms."],"ELSA / EEBD inspection":["Annual service report of the EEBDs (Emergency Escape Breathing Devices) by a service company. Count and positions must match the fire plan; weekly/monthly ship checks recorded.","Annual service report ng EEBDs (Emergency Escape Breathing Devices) ng service company. Ang bilang at lugar ay dapat tugma sa fire plan; naka-record ang weekly/monthly checks ng barko."],"Foam analysis (latest)":["Lab report of the fixed/portable foam concentrate (first after 3 years, then yearly – MSC.1/Circ.1312). Result must be \"satisfactory\".","Lab report ng foam concentrate ng fixed/portable system (una pagkatapos ng 3 taon, pagkatapos taon-taon – MSC.1/Circ.1312). Ang resulta ay dapat \"satisfactory\"."],"Lifeboat & davit annual inspection":["Annual thorough examination of lifeboats, davits, winches and on-load release gear by a maker-authorised company (MSC.402(96)). 5-yearly load test when due.","Annual thorough examination ng lifeboats, davits, winches at on-load release gear ng company na authorised ng maker (MSC.402(96)). 5-yearly load test kapag due."],"Rescue boat & on-load release annual":["Same annual examination for the rescue boat, its davit and release hook by an authorised company. Engine starts by hand; davit tested on emergency power.","Parehong annual examination para sa rescue boat, davit at release hook nito ng authorised company. Nag-i-start sa kamay ang makina; nasubukan ang davit sa emergency power."],"Liferafts annual service":["Annual service certificate for each liferaft and its HRU (hydrostatic release), by an approved station. Serial numbers on the certificate = serial numbers on the rafts.","Annual service certificate ng bawat liferaft at HRU (hydrostatic release) nito, mula sa approved station. Serial numbers sa certificate = serial numbers sa rafts."],"Immersion suits test":["Air-pressure test of immersion suits (every 3 years; yearly if older than 10 years – MSC/Circ.1047/1114). Records per suit.","Air-pressure test ng immersion suits (bawat 3 taon; taon-taon kung lampas 10 taon – MSC/Circ.1047/1114). May record bawat suit."],"Inflatable lifejackets service":["Annual service certificate for inflatable lifejackets (if carried). If none on board, say so.","Annual service certificate ng inflatable lifejackets (kung mayroon). Kung wala sa barko, sabihin ito."],"Portable extinguishers annual":["Annual service report of all portable and wheeled extinguishers (MSC.1/Circ.1432), with list of numbers/locations and hydrostatic test dates.","Annual service report ng lahat ng portable at wheeled extinguishers (MSC.1/Circ.1432), may listahan ng numbers/locations at petsa ng hydrostatic test."],"SCBA bottles + air quality test":["Hydrostatic test of SCBA cylinders (per maker/Flag, usually 5 years) + air quality test of the breathing air compressor (yearly, EN 12021).","Hydrostatic test ng SCBA cylinders (ayon sa maker/Flag, karaniwan 5 taon) + air quality test ng breathing air compressor (taon-taon, EN 12021)."],"PPE matrix":["Company table: which PPE for which job (pilot ladder, enclosed space, hot work, chemicals…). Posted on board; crew must follow it.","Table ng company: aling PPE para sa aling trabaho (pilot ladder, enclosed space, hot work, chemicals…). Nakapaskil sa barko; dapat sundin ng crew."],"Pilot ladder certificates (+ authenticity check)":["Maker certificate of each pilot ladder (ISO 799-1), with serial no. on the ladder tag. Proof the certificate is genuine (maker verification/QR), date in service, and inspection records.","Maker certificate ng bawat pilot ladder (ISO 799-1), may serial no. sa tag ng ladder. Patunay na totoo ang certificate (verification/QR ng maker), petsa ng paggamit, at inspection records."],"Helicopter area Class strength letter":["Class/maker letter that the helicopter winching area on deck is strong enough. Only if the ship has a marked helicopter area.","Sulat ng Class/maker na sapat ang tibay ng helicopter winching area sa deck. Kung may markadong helicopter area lang ang barko."],"Last Master review + office reply":["The last Master's Review of the SMS (ISM 5.2) and the office's written answer. Must have real comments, not only \"all OK\".","Ang huling Master's Review ng SMS (ISM 5.2) at ang nakasulat na sagot ng opisina. Dapat may totoong comments, hindi lang \"all OK\"."],"Last safety meeting + office reply":["Minutes of the last monthly safety committee meeting, and the office's reply to the points raised.","Minutes ng huling buwanang safety committee meeting, at ang sagot ng opisina sa mga punto."],"Last ship/shore checklist":["The last ship/shore safety checklist from the last cargo port (e.g. BLU Code checklist). Fully filled and signed by both ship and terminal.","Ang huling ship/shore safety checklist mula sa huling cargo port (hal. BLU Code checklist). Kumpleto at may pirma ng barko at terminal."],"Latest internal & external audits":["Reports of the last internal ISM/ISPS/MLC audit (company) and external audit (Flag/Class), with all non-conformities closed.","Reports ng huling internal ISM/ISPS/MLC audit (company) at external audit (Flag/Class), sarado lahat ng non-conformities."],"IOPP + Supplement Form A/B":["MARPOL Annex I certificate and its Supplement (Form A for non-tankers). Equipment in the Form (OWS, 15 ppm monitor, sludge tanks) must match the ship.","MARPOL Annex I certificate at ang Supplement nito (Form A para sa hindi tanker). Ang equipment sa Form (OWS, 15 ppm monitor, sludge tanks) ay dapat tugma sa barko."],"IAPP + Supplement":["MARPOL Annex VI air pollution certificate + Supplement (engines, incinerator, fuel sulphur method, ODS). Endorsements in date.","MARPOL Annex VI air pollution certificate + Supplement (makina, incinerator, paraan sa sulphur ng fuel, ODS). Nasa oras ang endorsements."],"ISPP (sewage)":["MARPOL Annex IV sewage certificate. Sewage plant type and approval as written on the certificate.","MARPOL Annex IV sewage certificate. Uri ng sewage plant at approval ayon sa nakasulat sa certificate."],"Ballast Water Management Certificate":["International BWM certificate (D-2 with an approved BWTS). Upload together with the approved BWM Plan page.","International BWM certificate (D-2 gamit ang approved BWTS). I-upload kasama ang pahina ng approved BWM Plan."],"BWTS discharge analysis":["Lab result of a ballast water sample after treatment (commissioning test or latest sampling) showing D-2 compliance.","Resulta ng lab ng ballast water sample pagkatapos ng treatment (commissioning test o huling sampling) na nagpapakitang pasok sa D-2."],"15 ppm monitor calibration":["Calibration certificate of the OWS 15 ppm bilge alarm (MEPC.107(49) – every 5 years, or cell change). Serial no. = unit on board.","Calibration certificate ng 15 ppm bilge alarm ng OWS (MEPC.107(49) – bawat 5 taon, o palit ng cell). Serial no. = unit sa barko."],"EGCS sensors calibration (if fitted)":["Only if a scrubber is fitted: calibration records of the SO₂/CO₂ emission analyser and washwater sensors (pH, PAH, turbidity).","Kung may scrubber lang: calibration records ng SO₂/CO₂ emission analyser at washwater sensors (pH, PAH, turbidity)."],"IEEC + SEEMP compliance":["Energy efficiency certificate (IEEC) + SEEMP Part II/III Statement of Compliance + EEXI/CII documents (current CII rating and plan if rated D/E).","Energy efficiency certificate (IEEC) + SEEMP Part II/III Statement of Compliance + EEXI/CII documents (kasalukuyang CII rating at plan kung D/E)."],"SOPEP / SMPEP approval":["Flag/Class approval page of the Shipboard Oil Pollution Emergency Plan. Contact list (Annex) up to date.","Pahina ng approval ng Flag/Class ng Shipboard Oil Pollution Emergency Plan. Updated ang contact list (Annex)."],"Garbage statement of compliance":["Statement/approval for the Garbage Management Plan (and comminuter/incinerator if fitted). Placards posted, Garbage Record Book correct.","Statement/approval ng Garbage Management Plan (at comminuter/incinerator kung mayroon). Nakapaskil ang placards, tama ang Garbage Record Book."],"Approved rate of discharge (sewage)":["Flag/Class approval of the rate for discharging untreated sewage from the holding tank (MEPC.157(55)), based on ship speed and draft.","Approval ng Flag/Class sa rate ng pag-discharge ng untreated sewage mula sa holding tank (MEPC.157(55)), batay sa bilis at draft ng barko."],"Bunker line pressure test":["Record of the hydrostatic test of bunker lines: yearly at MAWP, and twice in 5 years at 1.5×MAWP. Date, pressure, signed.","Record ng hydrostatic test ng bunker lines: taon-taon sa MAWP, at dalawang beses sa 5 taon sa 1.5×MAWP. May petsa, pressure, pirma."],"Last TWO bunker plans/checklists (HFO & LSMGO)":["The last 2 bunkering plans and pre-bunker checklists, one for each fuel type. Fully filled, incl. tank % plan, H₂S/benzene readings and signatures.","Ang huling 2 bunkering plan at pre-bunker checklist, isa bawat uri ng fuel. Kumpleto, kasama ang tank % plan, H₂S/benzene readings at pirma."],"Fuel oil analysis reports":["Lab reports (e.g. VPS, Veritas) of the fuel stems on board. Fuel must be analysed before use; any off-spec has actions recorded.","Lab reports (hal. VPS, Veritas) ng fuel na nasa barko. Dapat na-analyse bago gamitin; may naka-record na aksyon sa anumang off-spec."],"Maker/Class statement – burning lighter fuel":["Letter from engine/boiler maker or Class that the plant can safely burn low-sulphur/low-viscosity fuel (VLSFO/MGO), incl. changeover procedure.","Sulat mula sa maker ng makina/boiler o Class na ligtas gamitin ang low-sulphur/low-viscosity fuel (VLSFO/MGO), kasama ang changeover procedure."],"Loadicator approval & survey":["Class approval of the loading computer software + last annual test with the Class test conditions (signed result).","Approval ng Class sa software ng loading computer + huling annual test gamit ang test conditions ng Class (may pirmang resulta)."],"Cargo gear register / attestation":["Register of Lifting Appliances (cranes, grabs, wires): annual thorough examination, 5-yearly load test, wire certificates.","Register of Lifting Appliances (cranes, grabs, wires): annual thorough examination, 5-yearly load test, certificates ng wires."],"Hatch cover hydraulic oil analysis":["Lab report of the hatch cover hydraulic oil (usually yearly). Result normal or actions taken.","Lab report ng hydraulic oil ng hatch cover (karaniwan taon-taon). Normal ang resulta o may aksyon."],"Hatch cover clearance records":["Measurements of hatch cover clearances/bearing pads every 6 months (or per maker), signed and within maker tolerance.","Sukat ng hatch cover clearances/bearing pads bawat 6 buwan (o ayon sa maker), may pirma at pasok sa tolerance ng maker."],"Crane rocking test records":["Crane slewing-bearing rocking test every 6 months, recorded in the Lifting Appliances Register and compared with maker limits.","Rocking test ng slewing bearing ng crane bawat 6 buwan, naka-record sa Lifting Appliances Register at ikinumpara sa limits ng maker."],"GAFTA/FOSFA hold inspection certificate":["Hold cleanliness certificate from the last grain/food cargo survey (if any). Shows the holds were accepted.","Certificate ng kalinisan ng holds mula sa huling survey para sa grain/food cargo (kung mayroon). Nagpapakitang tinanggap ang holds."],"Line management plan":["MEG4 Mooring Line Management Plan: ship design MBL, line inventory, inspection intervals, retirement criteria, rotation.","MEG4 Mooring Line Management Plan: ship design MBL, listahan ng lines, pagitan ng inspection, retirement criteria, rotation."],"Mooring line & tail certificates":["Maker certificate for each mooring line and tail in use. LDBF must fit the ship design MBL; line tag/no. matches.","Maker certificate ng bawat mooring line at tail na ginagamit. Dapat pasok ang LDBF sa ship design MBL; tugma ang tag/no. ng line."],"Winch brake test report":["Last winch brake rendering test (yearly, or per MEG4/maker), result vs design brake holding load. Brake marks visible on the winch.","Huling winch brake rendering test (taon-taon, o ayon sa MEG4/maker), resulta kumpara sa design brake holding load. Kita ang brake marks sa winch."],"Company policy for mooring inspection & wear zones":["SMS procedure for inspecting mooring lines and for wear zones/snap-back danger areas (MEG4). Crew know it.","SMS procedure sa pag-inspect ng mooring lines at sa wear zones/snap-back danger areas (MEG4). Alam ito ng crew."],"Safety Radio certificate":["SOLAS Cargo Ship Safety Radio certificate + Form R. GMDSS equipment listed must match the ship.","SOLAS Cargo Ship Safety Radio certificate + Form R. Ang GMDSS equipment sa listahan ay dapat tugma sa barko."],"Radio periodic survey report":["Report of the last annual radio survey by an approved radio surveyor. Defects closed.","Report ng huling annual radio survey ng approved radio surveyor. Sarado ang mga depekto."],"GMDSS shore maintenance agreement":["Contract with a shore company for GMDSS maintenance (needed when shore-based maintenance is one of the chosen methods). Valid date.","Contract sa shore company para sa GMDSS maintenance (kailangan kapag shore-based maintenance ang isa sa napiling paraan). Valid ang petsa."],"EPIRB annual test":["Annual EPIRB test (SOLAS IV/15.9) + 5-yearly shore maintenance; battery and HRU expiry dates on the unit; registration with the right MMSI.","Annual EPIRB test (SOLAS IV/15.9) + 5-yearly shore maintenance; petsa ng expiry ng battery at HRU sa unit; naka-register sa tamang MMSI."],"SART & AIS annual test":["Annual test records of SART(s) and AIS (AIS annual test – MSC.1/Circ.1252). Battery dates checked.","Annual test records ng SART(s) at AIS (AIS annual test – MSC.1/Circ.1252). Na-check ang petsa ng battery."],"ISSC":["International Ship Security Certificate (ISPS Code). Valid and endorsed. Do NOT upload the SSP itself (confidential).","International Ship Security Certificate (ISPS Code). Valid at may endorsement. HUWAG i-upload ang SSP mismo (confidential)."],"EIAPP + NOx technical files":["EIAPP certificate and approved NOx Technical File for every diesel engine >130 kW. Record Book of Engine Parameters up to date.","EIAPP certificate at approved NOx Technical File ng bawat diesel engine >130 kW. Updated ang Record Book of Engine Parameters."],"IHM statement of compliance":["Inventory of Hazardous Materials certificate/Statement of Compliance (EU SRR/HKC), with IHM Part I updated after repairs.","Certificate/Statement of Compliance ng Inventory of Hazardous Materials (EU SRR/HKC), updated ang IHM Part I pagkatapos ng repairs."],"Asbestos free declaration":["Declaration (or IHM) that there is no asbestos on board, incl. spares supplied after build.","Deklarasyon (o IHM) na walang asbestos sa barko, kasama ang spares na dumating pagkatapos itayo."],"Temperature/pressure calibrator certificate":["Calibration certificate of the ship's REFERENCE instruments: master test pressure gauge / hand-pump tester and reference thermometer / temperature calibrator. These are used to check the engine room gauges and thermometers. Show: certificate valid (usually yearly, accredited lab ISO 17025), serial no. = instrument on board, and PMS records of gauges checked against it. Finding: expired, no instrument, or never used.","Calibration certificate ng REFERENCE instruments ng barko: master test pressure gauge / hand-pump tester at reference thermometer / temperature calibrator. Ginagamit ito para i-check ang gauges at thermometers sa engine room. Ipakita: valid ang certificate (karaniwan taon-taon, accredited lab ISO 17025), serial no. = instrument sa barko, at PMS records ng gauges na na-check gamit ito. Finding: expired, walang instrument, o hindi ginagamit."],"Medical chest certificate":["Medical chest inspection certificate by a pharmacist/authorised supplier (per Flag, usually yearly). No expired medicines; controlled drugs log.","Medical chest inspection certificate mula sa pharmacist/authorised supplier (ayon sa Flag, karaniwan taon-taon). Walang expired na gamot; may log ng controlled drugs."],"ITF certificate (if applicable)":["ITF Blue Certificate (approved crew agreement), only if the ship has an ITF agreement.","ITF Blue Certificate (approved crew agreement), kung may ITF agreement lang ang barko."],"Last accommodation inspection record":["Master's accommodation inspection record (MLC – weekly/monthly per SMS), with defects found and fixed.","Record ng accommodation inspection ng Master (MLC – weekly/monthly ayon sa SMS), may mga nakitang depekto at naayos."],"Visitor / inspector safety familiarization form (signed at gangway)":["Short safety briefing for every visitor and inspector before the walk-round: general alarm (7 short + 1 long) and muster station, CO2 alarm = leave the space, lifejacket for visitors, escape routes, always escorted, no enclosed space entry, PPE, smoking areas, how to raise the alarm. The visitor and the briefing officer sign. Inspectors may ask to sign their own copy.","Maikling safety briefing para sa bawat bisita at inspector bago ang walk-round: general alarm (7 maikli + 1 mahaba) at muster station, CO2 alarm = umalis agad sa lugar, lifejacket para sa bisita, escape routes, laging may escort, bawal pumasok sa enclosed space, PPE, smoking areas, paano magbigay ng alarma. Pipirma ang bisita at ang officer na nag-brief. Maaaring hingin ng inspector na pumirma sa sariling kopya."],"Enclosed Space Register (ship-specific, MSC.581(110)) with hazards & control measures":["Ship-specific list of all enclosed spaces with connected/adjacent spaces, hazards, control measures and how the atmosphere is tested (IMO MSC.581(110), 2025). A generic SMS list is not enough.","Listahan para sa barkong ito ng lahat ng enclosed space kasama ang connected/adjacent spaces, hazards, control measures at paano sinusukat ang hangin (IMO MSC.581(110), 2025). Hindi sapat ang generic na listahan sa SMS."],"Last enclosed space permits with risk assessment + 15-min atmosphere log (with times)":["Check before upload: gas test time is BEFORE the entry time; every yellow/red RA score has additional measures and a residual score; readings with time every 15 min for the whole work period; all signatures.","I-check bago i-upload: ang oras ng gas test ay BAGO ang oras ng pagpasok; bawat dilaw/pulang score sa RA ay may additional measures at residual score; readings na may oras bawat 15 minuto sa buong trabaho; kumpleto ang pirma."]}};const H24={"u":"2026-11-08","s":[{"t":["⏱ T-24h · Σύσκεψη Master, C/O, C/E, 2/E","⏱ T-24h · Meeting Master, C/O, C/E, 2/E","⏱ T-24h · Pulong ng Master, C/O, C/E, 2/E"],"i":[["*","Ορίστε escorts: Master/C/O για γέφυρα & deck, C/E ή 2/E για ER. Ο καθένας με VHF/UHF, φακό και σημειωματάριο.","Assign escorts: Master/C/O for bridge & deck, C/E or 2/E for ER. Each one with radio, torch and notebook.","Magtalaga ng escort: Master/C/O sa bridge at deck, C/E o 2/E sa ER. May radio, flashlight at notebook bawat isa."],["*","Κλειδιά έτοιμα & χώροι ανοιχτοί: CO2 room, em'cy generator room, em'cy fire pump, steering gear, paint store, battery room, foam room, foc'sle store.","Keys ready & spaces open: CO2 room, emergency generator room, emergency fire pump, steering gear, paint store, battery room, foam room, forecastle store.","Handa ang mga susi at bukas ang: CO2 room, emergency generator room, emergency fire pump, steering gear, paint store, battery room, foam room, forecastle store."],["*","Λίστα με τα tests που θα ζητήσει και υπεύθυνος για το καθένα: OWS 15 ppm, em'cy fire pump, em'cy generator, engineers' alarm, dead man, lifeboat engine, BNWAS, nav lights, emergency steering, bilge alarms, WIDS.","List the tests he will ask for, with one responsible person each: OWS 15 ppm, emergency fire pump, emergency generator, engineers' alarm, dead man alarm, lifeboat engine, BNWAS, nav lights, emergency steering, bilge alarms, WIDS.","Ilista ang mga test na hihingin niya, may isang responsable bawat isa: OWS 15 ppm, emergency fire pump, emergency generator, engineers' alarm, dead man alarm, lifeboat engine, BNWAS, nav lights, emergency steering, bilge alarms, WIDS."],["2.4","Crew list = Safe Manning Certificate (αριθμός και βαθμοί).","Crew list matches the Safe Manning Certificate (number and ranks).","Tugma ang crew list sa Safe Manning Certificate (bilang at ranggo)."],["2.13","Officer matrix με τους ΤΩΡΙΝΟΥΣ αξιωματικούς (μετά από αλλαγή πληρώματος ενημερώστε το).","Officer matrix shows the CURRENT officers (update after every crew change).","Ang officer matrix ay may KASALUKUYANG mga officer (i-update pagkatapos ng crew change)."],["4.43","Όποιος ήρθε τελευταίος: familiarisation πλήρης και υπογεγραμμένη. Ο inspector ρωτάει συχνά τον πιο καινούριο.","Newest crew member: familiarisation complete and signed. The inspector often asks the newest person.","Pinakabagong crew: kumpleto at pirmado ang familiarisation. Madalas tanungin ng inspector ang pinakabago."],["*","Σήμερα μόνο τελειώματα: καμία νέα μεγάλη δουλειά, κανένα hot work αύριο, κανένα μηχάνημα ανοιχτό την ώρα της επιθεώρησης.","Today only finishing work: no new big jobs, no hot work tomorrow, no machinery opened up during the inspection.","Ngayon, tapusin lang ang mga trabaho: walang bagong malaking trabaho, walang hot work bukas, walang makinang bukas habang may inspection."]]},{"t":["📁 Έγγραφα & records","📁 Documents & records","📁 Mga dokumento at record"],"i":[["2.1","Class Survey Status Report ≤7 ημερών. Αν είναι παλιότερο, ζήτα νέο ΣΗΜΕΡΑ. Όλα τα certificates σε ισχύ, κανένα overdue CoC/survey, dispensations με εξήγηση.","Class Survey Status Report not older than 7 days – if older, request a new one TODAY. All certificates valid, no overdue CoC/survey, dispensations explained.","Class Survey Status Report na hindi lalampas ng 7 araw – kung luma, humingi ng bago NGAYON. Valid lahat ng certificate, walang overdue na CoC/survey, may paliwanag ang dispensations."],["2.2","Τα 2 MLC financial security certificates σε ισχύ και αναρτημένα.","Both MLC financial security certificates valid and posted.","Valid at nakapaskil ang 2 MLC financial security certificate."],["2.5","Rest hours όλων, τελευταίες 4 εβδομάδες: σε ILO format, υπογεγραμμένα, κάθε παραβίαση με σχόλιο/corrective action.","Rest hours of all crew, last 4 weeks: ILO format, signed, every non-conformity with comment/corrective action.","Rest hours ng lahat, huling 4 na linggo: ILO format, pirmado, bawat paglabag may komento/corrective action."],["4.9","Drills σύμφωνα με το πρόγραμμα (abandon ship & fire μηνιαία) με debrief και lessons learnt. ΜΗΝ γράψεις drill που δεν έγινε.","Drills as per schedule (abandon ship & fire monthly) with debrief and lessons learnt. NEVER record a drill that was not done.","Drills ayon sa schedule (abandon ship at fire buwan-buwan) may debrief at lessons learnt. HUWAG isulat ang drill na hindi ginawa."],["4.6","Enclosed space rescue drill ≤2 μηνών, σε διαφορετικούς χώρους του register.","Enclosed space rescue drill within the last 2 months, in different spaces of the register.","Enclosed space rescue drill sa loob ng huling 2 buwan, sa iba't ibang space sa register."],["4.5","Τελευταίο enclosed space permit: πλήρες, gas readings γραμμένα (O₂ 20.9%, HC <1% LFL, toxic <50% OEL), υπογραφές, κλεισμένο. Ο inspector παίρνει το ΤΕΛΕΥΤΑΙΟ.","Last enclosed space permit: complete, gas readings written (O₂ 20.9%, HC <1% LFL, toxic <50% OEL), signed, closed. The inspector takes the LAST one.","Huling enclosed space permit: kumpleto, nakasulat ang gas readings (O₂ 20.9%, HC <1% LFL, toxic <50% OEL), pirmado, sarado. Ang HULI ang kukunin ng inspector."],["4.7","Τελευταίο hot work permit: gas test, fire watch, risk assessment, έγκριση γραφείου αν έγινε εκτός workshop.","Last hot work permit: gas test, fire watch, risk assessment, office approval if outside the workshop.","Huling hot work permit: gas test, fire watch, risk assessment, approval ng office kung labas ng workshop."],["5.1","ORB Part I: εγγραφές μέχρι σήμερα, σωστά codes, υπογραφές κάθε εγγραφής και Master σε κάθε σελίδα, ποσότητες = soundings.","ORB Part I: entries up to today, correct codes, each entry signed and Master signs each page, quantities match soundings.","ORB Part I: entries hanggang ngayon, tamang codes, pirmado bawat entry at pirma ng Master bawat pahina, tugma ang dami sa soundings."],["5.10","Ballast Water Record Book & BWMP: τελευταίες εργασίες γραμμένες, BWTS records/alarms εξηγημένα.","Ballast Water Record Book & BWMP: last operations recorded, BWTS records/alarms explained.","Ballast Water Record Book at BWMP: nakasulat ang huling operations, may paliwanag ang BWTS records/alarms."],["5.19","Garbage Record Book & receipts, Garbage Management Plan, placards αναρτημένα.","Garbage Record Book & receipts, Garbage Management Plan r log, ID check, ISPS level posted.","Laging nasa lugar ang gangway watch: visitor log, ID check, nakapaskil ang ISPS level."],["4.37","Pilot ladder: certificate, ID tag, record χρήσης, ≤30 μήνες. Αν έρθει με launch, το rigging της σκάλας είναι ο πρώτος έλεγχος: κατά SOLAS V/23, lifebuoy με light, φως, αξιωματικός με VHF.","Pilot ladder: certificate, ID tag, record of use, not more than 30 months. If he comes by launch, ladder rigging is the first check: SOLAS V/23, lifebuoy with light, lighting, officer with radio.","Pilot ladder: certificate, ID tag, record of use, hindi lalampas ng 30 buwan. Kung darating siya sakay ng launch, ang rigging ng ladder ang unang check: SOLAS V/23, lifebuoy may ilaw, ilaw, officer may radio."],["10.8","Mooring lines σωστά τυλιγμένες στα τύμπανα, brakes ON, out of gear. Split drums (10.9) σωστά.","Mooring lines correctly reeled on drums, brakes ON, out of gear. Split drums (10.9) correct.","Tama ang pagkakarolyo ng mooring lines sa drum, ON ang brakes, out of gear. Tama ang split drums (10.9)."],["10.13","Snap-back zones σημασμένα, signage, mooring stations καθαρές.","Snap-back zones marked, signage, mooring stations clean.","May marka ang snap-back zones, may signage, malinis ang mooring stations."],["10.12","Heaving lines: monkey's fist ή soft pouch, ΧΩΡΙΣ βάρος μέσα.","Heaving lines: monkey's fist or soft pouch, NO weight inside.","Heaving lines: monkey's fist o soft pouch, WALANG pabigat sa loob."],["10.20","Chain locker πόρτες κλειστές, bitter end release προσβάσιμο. Anchors (10.19) σφιχτά και δεμένα.","Chain locker doors closed, bitter end release accessible. Anchors (10.19) tight and secured.","Sarado ang pinto ng chain locker, abot ang bitter end release. Mahigpit at nakatali ang anchors (10.19)."],["5.8","Save-alls (deck machinery, bunker manifold 7A.1, vents 7A.4): καθαρά, στεγνά, τάπες στη θέση. ΚΑΝΕΝΑ λάδι στο deck.","Save-alls (deck machinery, bunker manifold 7A.1, vents 7A.4): clean, dry, plugs in place. NO oil on deck.",
