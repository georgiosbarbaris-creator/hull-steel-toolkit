12","sn":"Security","a":"DOC","h":0,"c":["SSO certificate; security awareness/designated duties certs for crew","Security drills every 3 months, annual exercise"],"o":"Has a Ship Security Officer (SSO) been appointed and trained adequately to perform the duties of SSO and have all crew received security-related training and instructions? (V)","eg":"SSO trained, security training/drills for all crew.","ex":"WHAT IS ASKED:\nSSO trained and security training for everyone.\n\nFINDING WHEN:\n• No training\n\nWHAT THE INSPECTOR DOES:\n• Checks it","fg":"Trained ang SSO, security training/drills para sa lahat ng crew.","fc":["SSO certificate; security awareness/designated duties certs ng crew","Security drills bawat 3 buwan, annual exercise"],"fx":"ANO ANG HINIHINGI:\nTrained ang SSO at may security training para sa lahat.\n\nKAILAN MAY FINDING:\n• Walang training\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"12.3","s":"12","sn":"Security","a":"BRG","h":0,"c":["SSAS test records; officers know function (not location)"],"o":"Are deck officers familiar with the function and use of the Ship Security Alert System and is the Ship Security Alert System being tested regularly? (V)","eg":"SSAS tested; officers know how it works (not where it is).","ex":"WHAT IS ASKED:\nOfficers know the SSAS and it is tested.\n\nFINDING WHEN:\n• No test\n\nWHAT THE INSPECTOR DOES:\n• Does not ask where the SSAS is","fg":"Nasubukan ang SSAS; alam ng officers kung paano gumagana (hindi kung nasaan).","fc":["SSAS test records; alam ng officers ang function (hindi ang lokasyon)"],"fx":"ANO ANG HINIHINGI:\nAlam ng officers ang SSAS at sinusubukan ito.\n\nKAILAN MAY FINDING:\n• Walang test\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Hindi itinatanong kung nasaan ang SSAS"},{"id":"12.5","s":"12","sn":"Security","a":"DOC","h":0,"c":["Latest BMP / anti-piracy charts (Q6099 etc.); VRA for last transit"],"o":"If the vessel has transited or is expected to transit a high-risk piracy area, have updated security charts and relevant publications been provided, and has a voyage risk assessment been completed? (V)","eg":"High-risk area: BMP5/MSIO charts, voyage risk assessment.","ex":"WHAT IS ASKED:\nFor high-risk areas: updated charts, publications and voyage risk assessment.\n\nFINDING WHEN:\n• Missing\n\nWHAT THE INSPECTOR DOES:\n• Checks them\n\nREMEMBER:\n• BMP","fg":"High-risk area: BMP5/MSIO charts, voyage risk assessment.","fc":["Pinakabagong BMP / anti-piracy charts (Q6099 atbp.); VRA ng huling transit"],"fx":"ANO ANG HINIHINGI:\nPara sa high-risk areas: updated na charts, publications at voyage risk assessment.\n\nKAILAN MAY FINDING:\n• Wala\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check\n\nTANDAAN:\n• BMP"},{"id":"12.6","s":"12","sn":"Security","a":"DECK","h":0,"c":["Stowaway search checklist with areas & signatures"],"o":"Have preventive measures been taken by the Master and crew during the stay in port and prior to departure to prevent stowaways? (V)","eg":"Stowaway search before departure – checklist.","ex":"WHAT IS ASKED:\nMeasures against stowaways in port and before departure.\n\nFINDING WHEN:\n• No search done\n\nWHAT THE INSPECTOR DOES:\n• Checks the checklist","fg":"Stowaway search bago umalis – checklist.","fc":["Stowaway search checklist na may areas at pirma"],"fx":"ANO ANG HINIHINGI:\nMay hakbang laban sa stowaways sa pantalan at bago umalis.\n\nKAILAN MAY FINDING:\n• Walang search\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang checklist"},{"id":"12.7","s":"12","sn":"Security","a":"DOC","h":1,"c":["Cyber risk management in SMS (MSC.428(98)); class notation/certification if any","Crew cyber training records"],"o":"Are cyber security policies and procedures integrated into the safety management system, and has the cyber security management system been evaluated and certified? (V)","eg":"Cyber security in the SMS (ISM) and assessment/certification.","ex":"WHAT IS ASKED:\nCyber security in the SMS, assessed or certified.\n\nFINDING WHEN:\n• Not in the SMS by the first annual DOC audit\n\nWHAT THE INSPECTOR DOES:\n• Checks it\n\nREMEMBER:\n• MSC.428(98)","fg":"Cyber security sa SMS (ISM) at assessment/certification.","fc":["Cyber risk management sa SMS (MSC.428(98)); class notation/certification kung meron","Crew cyber training records"],"fx":"ANO ANG HINIHINGI:\nCyber security sa SMS, may assessment o certification.\n\nKAILAN MAY FINDING:\n• Wala sa SMS hanggang sa unang annual DOC audit\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check\n\nTANDAAN:\n• MSC.428(98)"},{"id":"12.8","s":"12","sn":"Security","a":"BRG","h":0,"c":["USB policy posted; dedicated scanning PC; ECDIS USB use controlled"],"o":"Are measures in place for controlling the use of removable media such as USB memory sticks, CDs, DVDs, and diskettes on shipboard computers? (V)","eg":"Control of USB/removable media (antivirus scan, policy).","ex":"WHAT IS ASKED:\nControl of USB and other removable media.\n\nFINDING WHEN:\n• No policy\n\nWHAT THE INSPECTOR DOES:\n• Checks it","fg":"Kontrol sa USB/removable media (antivirus scan, policy).","fc":["Nakapaskil ang USB policy; may dedicated scanning PC; kontrolado ang USB sa ECDIS"],"fx":"ANO ANG HINIHINGI:\nKontrol sa USB at iba pang removable media.\n\nKAILAN MAY FINDING:\n• Walang policy\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"13.1","s":"13","sn":"Machinery Space","a":"ER","h":0,"c":["Engineering manual latest rev.; EPL/ShaPoLi OMM on board & override records"],"o":"Are adequate engineering procedures, instructions and guidelines included in the SMS? (V)","eg":"Engineering procedures in the SMS, EPL/ShaPoLi OMM if fitted.","ex":"WHAT IS ASKED:\nEngineering procedures in the SMS.\n\nFINDING WHEN:\n• Missing\n\nWHAT THE INSPECTOR DOES:\n• Checks them (and EPL/ShaPoLi OMM if fitted)\n\nREMEMBER:\n• Every use of the power reserve is recorded and reported","fg":"Engineering procedures sa SMS, EPL/ShaPoLi OMM kung meron.","fc":["Engineering manual pinakabagong rev.; EPL/ShaPoLi OMM nasa barko at override records"],"fx":"ANO ANG HINIHINGI:\nMay engineering procedures sa SMS.\n\nKAILAN MAY FINDING:\n• Wala\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check (pati EPL/ShaPoLi OMM kung meron)\n\nTANDAAN:\n• Bawat paggamit ng power reserve ay naka-record at ini-report"},{"id":"13.2","s":"13","sn":"Machinery Space","a":"ER","h":0,"c":["Watch duties posted in ECR; ER manning matrix"],"o":"Are the responsibilities of watch standing engineers and engine ratings well-defined and clearly posted in the Engine Control Room? Is there a manning matrix for engineers that takes into account both planned and unplanned changes? (V)","eg":"Engineers' responsibilities posted in the ECR, engineers' manning matrix.","ex":"WHAT IS ASKED:\nEngineers' duties posted in the ECR and a manning matrix.\n\nFINDING WHEN:\n• Missing\n\nWHAT THE INSPECTOR DOES:\n• Checks them","fg":"Nakapaskil sa ECR ang responsibilities ng engineers, engineers' manning matrix.","fc":["Nakapaskil sa ECR ang watch duties; ER manning matrix"],"fx":"ANO ANG HINIHINGI:\nNakapaskil sa ECR ang tungkulin ng engineers at may manning matrix.\n\nKAILAN MAY FINDING:\n• Wala\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"13.3","s":"13","sn":"Machinery Space","a":"ER","h":1,"c":["C/E standing orders signed by all engineers/ETO/ratings","Night order book daily & countersigned"],"o":"Has the Chief Engineer prepared specific standing orders, night and day orders, and have these orders been read, understood, and signed by the watch standing engineers, engine crew, and electrical engineer, where applicable? (V & M)","eg":"C/E standing orders & night orders signed.","ex":"WHAT IS ASKED:\nC/E standing and night orders signed by all.\n\nFINDING WHEN:\n• Not signed\n\nWHAT THE INSPECTOR DOES:\n• Checks them","fg":"May pirma ang C/E standing orders at night orders.","fc":["C/E standing orders may pirma ng lahat ng engineers/ETO/ratings","Night order book araw-araw at may countersign"],"fx":"ANO ANG HINIHINGI:\nMay pirma ng lahat ang standing at night orders ng C/E.\n\nKAILAN MAY FINDING:\n• Walang pirma\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"13.4","s":"13","sn":"Machinery Space","a":"ER","h":0,"c":["UMS in use; if not, operational reason (not defects!)"],"o":"If the vessel has been certified for periodically unattended machinery spaces operation (UMS), is the machinery space being operated in that mode? (V)","eg":"UMS mode working (if certified) – otherwise a reason.","ex":"WHAT IS ASKED:\nIf the ship has UMS, it runs in UMS.\n\nFINDING WHEN:\n• Not in UMS because of defects or shortages\n\nWHAT THE INSPECTOR DOES:\n• No finding if there is an operational reason (e.g. narrows)","fg":"Gumagana ang UMS mode (kung certified) – kung hindi, may dahilan.","fc":["Ginagamit ang UMS; kung hindi, operational na dahilan (hindi defects!)"],"fx":"ANO ANG HINIHINGI:\nKung may UMS ang barko, naka-UMS ito.\n\nKAILAN MAY FINDING:\n• Hindi naka-UMS dahil sa sira o kakulangan\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Walang finding kung may operational na dahilan (hal. makitid na daanan)"},{"id":"13.5","s":"13","sn":"Machinery Space","a":"ER","h":0,"c":["Watch schedule vs rest hours"],"o":"If the engine room is not being operated in UMS mode, are there sufficient engineers and crew on board for safe operation of the machinery space? (V)","eg":"If not UMS – enough ER crew.","ex":"WHAT IS ASKED:\nIf not UMS, enough staff in the ER.\n\nFINDING WHEN:\n• Too few\n\nWHAT THE INSPECTOR DOES:\n• Checks it","fg":"Kung hindi UMS – sapat ang ER crew.","fc":["Watch schedule kumpara sa rest hours"],"fx":"ANO ANG HINIHINGI:\nKung hindi UMS, sapat ang tao sa ER.\n\nKAILAN MAY FINDING:\n• Kulang\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"13.6","s":"13","sn":"Machinery Space","a":"ER","h":0,"c":["Notice at ER entrance; dead-man/bridge call"],"o":"Have the entry requirements to the engine room when operating in UMS mode been documented, posted at the entrance to the engine room and understood by all crew? (V)","eg":"UMS entry requirements posted at the ER entrance.","ex":"WHAT IS ASKED:\nUMS entry rules posted at the ER entrance.\n\nFINDING WHEN:\n• Missing\n\nWHAT THE INSPECTOR DOES:\n• Visual check","fg":"Nakapaskil sa pasukan ng ER ang UMS entry requirements.","fc":["Notice sa pasukan ng ER; dead-man/bridge call"],"fx":"ANO ANG HINIHINGI:\nNakapaskil sa pasukan ng ER ang patakaran sa pagpasok kapag UMS.\n\nKAILAN MAY FINDING:\n• Wala\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check"},{"id":"13.7","s":"13","sn":"Machinery Space","a":"ER","h":0,"c":["Test dead man alarm"],"o":"If an engine room dead man alarm (personnel alarm) is provided, is it correctly set and in good order? (V)","eg":"Dead man alarm set & working.","ex":"WHAT IS ASKED:\nDead man alarm correctly set.\n\nFINDING WHEN:\n• Not working\n\nWHAT THE INSPECTOR DOES:\n• Checks it","fg":"Naka-set at gumagana ang dead man alarm.","fc":["Subukan ang dead man alarm"],"fx":"ANO ANG HINIHINGI:\nTama ang set ng dead man alarm.\n\nKAILAN MAY FINDING:\n• Hindi gumagana\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"13.8","s":"13","sn":"Machinery Space","a":"ER","h":1,"c":["Test from bridge & ECR; records"],"o":"Is an engineer’s calling alarm system fitted and is it tested regularly, in good order and the results recorded? (V)","f":["Engineers' call alarm not working in all cabins/public spaces"],"eg":"Engineers' call alarm tested (the inspector will test it).","ex":"WHAT IS ASKED:\nEngineers' call alarm tested.\n\nFINDING WHEN:\n• Not working\n\nWHAT THE INSPECTOR DOES:\n• Will test it with the Master's agreement","fg":"Nasubukan ang engineers' call alarm (susubukan ito ng inspector).","fc":["Subukan mula sa bridge at ECR; records"],"fx":"ANO ANG HINIHINGI:\nNasubukan ang engineers' call alarm.\n\nKAILAN MAY FINDING:\n• Hindi gumagana\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Susubukan niya kung payag ang Master","ff":["Hindi gumagana ang engineers' call alarm sa lahat ng cabin/public spaces"]},{"id":"13.9","s":"13","sn":"Machinery Space","a":"ER","h":1,"c":["ER logbook complete; alarm printer/automation time correct","Manual alarm log if printer defective"],"o":"Is the engine room logbook, as well as other required records being properly maintained? (V)","eg":"Engine logbook & alarm records correct, alarm printer at the correct time.","ex":"WHAT IS ASKED:\nCorrect engine logbook and records.\n\nFINDING WHEN:\n• No handwritten alarm log when there is no printer\n\nWHAT THE INSPECTOR DOES:\n• Checks time and date on the alarm printer","fg":"Tama ang engine logbook at alarm records, tama ang oras ng alarm printer.","fc":["Kumpleto ang ER logbook; tama ang oras ng alarm printer/automation","Manual alarm log kung sira ang printer"],"fx":"ANO ANG HINIHINGI:\nTamang engine logbook at records.\n\nKAILAN MAY FINDING:\n• Walang sulat-kamay na alarm log kapag walang printer\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang oras at petsa sa alarm printer"},{"id":"13.10","s":"13","sn":"Machinery Space","a":"ER","h":0,"c":["Blackout recovery posted at ECR & em'cy gen; engineers explain preferential trips"],"o":"Are procedures to recover essential equipment documented and posted in the engine room? (V)","eg":"Blackout recovery procedure posted, preferential trips known.","ex":"WHAT IS ASKED:\nBlackout recovery procedures posted in the ER.\n\nFINDING WHEN:\n• Missing\n\nWHAT THE INSPECTOR DOES:\n• Asks about the preferential trips","fg":"Nakapaskil ang blackout recovery procedure, alam ang preferential trips.","fc":["Nakapaskil ang blackout recovery sa ECR at em'cy gen; kayang ipaliwanag ng engineers ang preferential trips"],"fx":"ANO ANG HINIHINGI:\nNakapaskil sa ER ang blackout recovery procedures.\n\nKAILAN MAY FINDING:\n• Wala\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Nagtatanong tungkol sa preferential trips"},{"id":"13.11","s":"13","sn":"Machinery Space","a":"ER","h":1,"c":["No overdue jobs (or postponed with office approval)","Running hours updated; data sync with office","Engineers know the software"],"o":"Is an effective and up to date planned maintenance system available and being followed on board the vessel? (V & M)","f":["Overdue PMS jobs / PMS not synchronised with office"],"eg":"Computer PMS updated, no overdue jobs, synced with office.","ex":"WHAT IS ASKED:\nPMS updated and followed.\n\nFINDING WHEN:\n• Not computer-based\n• Engineers do not know it\n• Not synchronised with the office\n\nWHAT THE INSPECTOR DOES:\n• Checks overdue jobs","fg":"Updated ang computer PMS, walang overdue, naka-sync sa opisina.","fc":["Walang overdue jobs (o postponed na may approval ng opisina)","Updated ang running hours; naka-sync ang data sa opisina","Alam ng engineers ang software"],"fx":"ANO ANG HINIHINGI:\nUpdated at sinusunod ang PMS.\n\nKAILAN MAY FINDING:\n• Hindi computer-based\n• Hindi ito alam ng engineers\n• Hindi naka-sync sa opisina\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang overdue jobs","ff":["Overdue PMS jobs / hindi naka-sync ang PMS sa opisina"]},{"id":"13.13","s":"13","sn":"Machinery Space","a":"ER","h":1,"c":["Random check: fuel valves, fuel pumps, exhaust valves, cylinder covers vs maker hours","Scavenge inspection records; ME performance"],"o":"Is the main engine maintained as per manufacturer’s recommendations and records of periodic maintenance kept? (V)","eg":"Main engine maintenance per maker (fuel valves, pumps, exhaust valves, units).","ex":"WHAT IS ASKED:\nMain engine maintained per maker.\n\nFINDING WHEN:\n• Overdue\n\nWHAT THE INSPECTOR DOES:\n• Random check of fuel valves, pumps, exhaust valves","fg":"Main engine maintenance ayon sa maker (fuel valves, pumps, exhaust valves, units).","fc":["Random check: fuel valves, fuel pumps, exhaust valves, cylinder covers kumpara sa oras ng maker","Scavenge inspection records; ME performance"],"fx":"ANO ANG HINIHINGI:\nNaaalagaan ang main engine ayon sa maker.\n\nKAILAN MAY FINDING:\n• Overdue\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Random na check ng fuel valves, pumps, exhaust valves"},{"id":"13.14","s":"13","sn":"Machinery Space","a":"ER","h":1,"c":["Random check of overhauls vs hours","Idle generators run recently (logbook)"],"o":"Are the auxiliary engines maintained as per manufacturer’s recommendations and records of periodic maintenance kept?(V)","eg":"Auxiliary engine maintenance per maker & idle generators run regularly.","ex":"WHAT IS ASKED:\nAuxiliary engines maintained per maker.\n\nFINDING WHEN:\n• Overdue\n\nWHAT THE INSPECTOR DOES:\n• Checks idle generators ran recently","fg":"Auxiliary engine maintenance ayon sa maker at regular na pinapaandar ang idle gens.","fc":["Random check ng overhauls kumpara sa oras","Pinaandar kamakailan ang idle generators (logbook)"],"fx":"ANO ANG HINIHINGI:\nNaaalagaan ang auxiliary engines ayon sa maker.\n\nKAILAN MAY FINDING:\n• Overdue\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check kung pinaandar kamakailan ang idle generators"},{"id":"13.15","s":"13","sn":"Machinery Space","a":"ER","h":1,"c":["All lights working (incl. emergency); escape routes marked (LLL) & unobstructed","Escape trunk doors operable","📋 Inspector: Escape ladder steel shields (rule date 01.01.2016) – photo of E/R in 4 directions"],"o":"Are all areas of the machinery space well illuminated, emergency escape routes clearly marked, unobstructed and are ship’s crew familiar with the escape routes? (V)","f":["ER lights not working, escape routes obstructed or not marked"],"eg":"Good ER lighting, escape routes marked & clear.","ex":"WHAT IS ASKED:\nGood lighting and marked, clear escape routes in the ER.\n\nFINDING WHEN:\n• Blocked exits\n\nWHAT THE INSPECTOR DOES:\n• Visual check","fg":"Maliwanag ang ER, may marka at malinis ang escape routes.","fc":["Gumagana lahat ng ilaw (kasama emergency); may marka (LLL) at walang harang ang escape routes","Gumagana ang pinto ng escape trunk","📋 Inspector: Escape ladder steel shields (rule date 01.01.2016) – photo of E/R in 4 directions"],"fx":"ANO ANG HINIHINGI:\nMaliwanag at may marka at malinis na escape routes sa ER.\n\nKAILAN MAY FINDING:\n• May harang ang labasan\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check","ff":["Hindi gumagana ang ilaw sa ER, may harang o walang marka ang escape routes"]},{"id":"13.17","s":"13","sn":"Machinery Space","a":"ER","h":0,"c":["Test records; auto sequential testing explained"],"o":"Is the emergency equipment tested, in good condition and the result recorded? (V)","eg":"Emergency equipment tested & recorded (em'cy lights, alarms, batteries).","ex":"WHAT IS ASKED:\nEmergency equipment tested.\n\nFINDING WHEN:\n• No records\n\nWHAT THE INSPECTOR DOES:\n• Asks for an explanation of automatic sequential testing","fg":"Nasubukan at naka-record ang emergency equipment (em'cy lights, alarms, batteries).","fc":["Test records; kayang ipaliwanag ang auto sequential testing"],"fx":"ANO ANG HINIHINGI:\nNasubukan ang emergency equipment.\n\nKAILAN MAY FINDING:\n• Walang records\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Humihingi ng paliwanag sa automatic sequential testing"},{"id":"13.18","s":"13","sn":"Machinery Space","a":"ER","h":1,"c":["Remote stops marked & tested; fire flaps close & marked"],"o":"Are engine room emergency stops for ventilation fans and the closing mechanism of ventilation supply and exhaust ducts clearly marked, in working condition, and do records indicate that they have been regularly tested? (V)","eg":"Emergency stops of ventilation & fire flaps marked and tested.","ex":"WHAT IS ASKED:\nEmergency stops of fans and fire flaps marked and tested.\n\nFINDING WHEN:\n• No marking or test\n\nWHAT THE INSPECTOR DOES:\n• Checks them","fg":"May marka at nasubukan ang emergency stops ng ventilation at fire flaps.","fc":["May marka at nasubukan ang remote stops; sumasara at may marka ang fire flaps"],"fx":"ANO ANG HINIHINGI:\nMay marka at nasubukan ang emergency stops ng fans at fire flaps.\n\nKAILAN MAY FINDING:\n• Walang marka o test\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"13.19","s":"13","sn":"Machinery Space","a":"ER","h":1,"c":["No exposed hot surfaces >220°C (check exhaust, turbocharger, indicator cocks)","Spray tape/shields on FO/LO flanges near hot surfaces"],"o":"Are engine exhausts and other hot surfaces effectively shielded against oil spray and are flanges and connections of flammable liquid pipelines adequately protected with guards and spray tape? (V)","f":["Hot surfaces uninsulated / spray shields missing on fuel & LO flanges"],"eg":"Hot surfaces insulated, flanges with spray shields/tape.","ex":"WHAT IS ASKED:\nHot surfaces covered and fuel flanges with spray tape or shields.\n\nFINDING WHEN:\n• Uncovered\n\nWHAT THE INSPECTOR DOES:\n• Visual check\n\nREMEMBER:\n• SOLAS II-2/4: surfaces above 220°C","fg":"May insulation ang mainit na surface, may spray shields/tape ang flanges.","fc":["Walang nakalantad na mainit na surface >220°C (i-check ang exhaust, turbocharger, indicator cocks)","Spray tape/shields sa FO/LO flanges malapit sa mainit na surface"],"fx":"ANO ANG HINIHINGI:\nNatatakpan ang mainit na surface at may spray tape o shields ang fuel flanges.\n\nKAILAN MAY FINDING:\n• Nakalantad\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check\n\nTANDAAN:\n• SOLAS II-2/4: surface na lampas 220°C","ff":["Walang insulation ang mainit na surface / walang spray shields sa fuel at LO flanges"]},{"id":"13.20","s":"13","sn":"Machinery Space","a":"ER","h":1,"c":["Replace oil-soaked lagging"],"o":"Is the lagging and insulation in good condition and free of oil impregnation? (V)","f":["Oil-soaked lagging"],"eg":"Lagging & insulation not oil-soaked.","ex":"WHAT IS ASKED:\nInsulation in good condition and free of oil.\n\nFINDING WHEN:\n• Oil-soaked\n\nWHAT THE INSPECTOR DOES:\n• Visual check","fg":"Lagging at insulation na hindi basa ng langis.","fc":["Palitan ang lagging na basa ng langis"],"fx":"ANO ANG HINIHINGI:\nMaayos at walang langis ang insulation.\n\nKAILAN MAY FINDING:\n• Basa ng langis\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check","ff":["Lagging na basa ng langis"]},{"id":"13.21","s":"13","sn":"Machinery Space","a":"ER","h":1,"c":["OMD test records; no alarms/faults","Engineers explain response to OMD alarm"],"o":"Are the main engine bearing temperature monitors or crankcase oil mist detector(s) in good condition and tested on a regular basis as specified by the manufacturer, and are engineers familiar with the procedure to follow in the event of oil mist in the crankcase? (V)","f":["Oil mist detector not tested per maker / engineers unfamiliar"],"eg":"OMD / bearing temperature monitoring tested per maker; engineers know the procedure.","ex":"WHAT IS ASKED:\nOil mist detector or bearing temperature monitoring tested per maker.\n\nFINDING WHEN:\n• No test\n\nWHAT THE INSPECTOR DOES:\n• Asks what they do at the alarm","fg":"OMD / bearing temp monitoring nasubukan ayon sa maker; alam ng engineers ang procedure.","fc":["OMD test records; walang alarm/fault","Kayang ipaliwanag ng engineers ang gagawin sa OMD alarm"],"fx":"ANO ANG HINIHINGI:\nNasubukan ayon sa maker ang oil mist detector o bearing temperature monitoring.\n\nKAILAN MAY FINDING:\n• Walang test\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Itinatanong kung ano ang ginagawa nila sa alarm","ff":["Hindi nasubukan ang oil mist detector ayon sa maker / hindi alam ng engineers"]},{"id":"13.22","s":"13","sn":"Machinery Space","a":"ER","h":0,"c":["Rubber mats complete, not damaged"],"o":"Were the electrical switchboards surrounded by suitable deck insulation, and was the insulation in good order? (V)","eg":"Insulating mats in front of/behind switchboards.","ex":"WHAT IS ASKED:\nInsulating mats at the switchboards.\n\nFINDING WHEN:\n• Missing\n\nWHAT THE INSPECTOR DOES:\n• Visual check","fg":"Insulating mats sa harap/likod ng switchboards.","fc":["Kumpleto at walang sira ang rubber mats"],"fx":"ANO ANG HINIHINGI:\nMay insulating mats sa switchboards.\n\nKAILAN MAY FINDING:\n• Wala\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Vi om, no leaks, clean bilges.\n\nFINDING WHEN:\n• Oil or dirt\n\nWHAT THE INSPECTOR DOES:\n• Visual check","fg":"Housekeeping ng ER at steering room: malinis, walang leak, walang langis ang bilges.","fc":["Walang langis sa floor plates/bilges; malinis ang drip trays","Walang basahan/madaling masunog na gamit; malinis ang tank tops","Malinis ang steering gear room"],"fx":"ANO ANG HINIHINGI:\nMalinis ang ER at steering room, walang leak, malinis ang bilges.\n\nKAILAN MAY FINDING:\n• May langis o dumi\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check","ff":["Langis sa bilges at drip trays, leaks, malangis na purifier room"]},{"id":"13.31","s":"13","sn":"Machinery Space","a":"ER","h":0,"c":["Test float alarms; records"],"o":"Is the bilge high level alarm system in good order, regularly tested and are records of test maintained? (V)","eg":"Bilge high-level alarms tested & recorded.","ex":"WHAT IS ASKED:\nBilge high-level alarms tested.\n\nFINDING WHEN:\n• No records\n\nWHAT THE INSPECTOR DOES:\n• Checks them","fg":"Nasubukan at naka-record ang bilge high-level alarms.","fc":["Subukan ang float alarms; records"],"fx":"ANO ANG HINIHINGI:\nNasubukan ang bilge high-level alarms.\n\nKAILAN MAY FINDING:\n• Walang records\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"13.32","s":"13","sn":"Machinery Space","a":"ER","h":1,"c":["No cement boxes, clamps, rubber patches on SW lines","Overboard valves operable"],"o":"Are the sea chests, seawater pumps, and associated seawater lines and valves in good working order, with no leaks, hard rust, or temporary repairs?","f":["Cement boxes / clamps on sea-water lines – temporary repairs not reported to class/office"],"eg":"Sea chests, SW pumps, pipes & valves without leaks/cement boxes/clamps.","ex":"WHAT IS ASKED:\nSea chests, pumps and SW lines without leaks or temporary repairs.\n\nFINDING WHEN:\n• Clamps or cement boxes\n\nWHAT THE INSPECTOR DOES:\n• Visual check","fg":"Sea chests, SW pumps, pipes at valves na walang leak/cement box/clamp.","fc":["Walang cement boxes, clamps, rubber patches sa SW lines","Gumagana ang overboard valves"],"fx":"ANO ANG HINIHINGI:\nSea chests, pumps at SW lines na walang leak o temporary repair.\n\nKAILAN MAY FINDING:\n• May clamps o cement box\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check","ff":["Cement boxes / clamps sa sea-water lines – temporary repairs na hindi ini-report sa class/opisina"]},{"id":"13.33","s":"13","sn":"Machinery Space","a":"ER","h":1,"c":["Boiler feed/cooling water test records & treatment","Economiser water-level monitoring procedure","Safety valves & alarms of boilers; air receivers","No improper by-pass arrangements","📋 Inspector: Bow thruster motor insulation readings (inspector: 440 V / 5 / 0.5 MΩ, 220 V / 2 / 0.2 MΩ)"],"o":"Is the following machinery/equipment, where applicable, in good order and well maintained? (V) > Shaft generator and emergency generator > Boilers, including waste heat and domestic boilers (Boilers should be operated in automatic mode where the automated boilers are installed) > Boiler safety system and instrumentation > Boiler water safety system > Main and emergency air compressors > Purifiers and fuel oil handling equipment > Stern tube sealing arrangements > Incinerator > Sewage system > Air condition and heating system > Refrigeration plant > Accommodation service systems (i.e., Calorifiers, Portable water equipment, heating etc) > Any other items of machinery, including stand-by machinery. > Burners, tubes, uptakes, exhaust manifolds and spark arrestors. > Engine control console including the control and monitoring system > Steering gear system > Battery maintenance and renewal.","f":["Boiler water tests not per maker","Air receiver / compressor safety valve tests overdue","Purifier room oily, fuel leaks"],"eg":"Em'cy generator, boilers (auto, water tests), compressors, purifiers etc. in good condition.","ex":"WHAT IS ASKED:\nEmergency generator, boilers, compressors etc. in good condition.\n\n ":"13","sn":"Machinery Space","a":"ER","h":0,"c":["Procedure posted at local station; demonstrate"],"o":"Are engineers familiar with operation of the main engine from the local manoeuvring control position? (V)","eg":"Engineers know ME local manoeuvring.","ex":"WHAT IS ASKED:\nEngineers know local manoeuvring.\n\nFINDING WHEN:\n• Engineers do not know\n\nWHAT THE INSPECTOR DOES:\n• Asks","fg":"Alam ng engineers ang local manoeuvring ng ME.","fc":["Nakapaskil ang procedure sa local station; ipakita"],"fx":"ANO ANG HINIHINGI:\nAlam ng engineers ang local manoeuvring.\n\nKAILAN MAY FINDING:\n• Hindi alam\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Nagtatanong"},{"id":"13.36","s":"13","sn":"Machinery Space","a":"ER","h":1,"c":["Inspector will witness start (not on-load) – make sure it starts first time","Starting instructions posted; both start methods","Weekly test & monthly on-load test records"],"o":"Are crew familiar with the starting procedure for the emergency generator and how to put power on the emergency switch board? (V)","f":["Emergency generator fails auto start / not tested on load every quarter","Starting instructions not posted, fuel tank low, louvers seized"],"eg":"Emergency generator: start (auto & manual), ESB; crew know it.","ex":"WHAT IS ASKED:\nCrew know how to start the emergency generator and supply the ESB.\n\nFINDING WHEN:\n• Crew do not know\n\nWHAT THE INSPECTOR DOES:\n• Will see a start test without load\n• Asks for the procedure to be explained","fg":"Emergency generator: pag-start (auto at manual), ESB; alam ng crew.","fc":["Titingnan ng inspector ang pag-start (hindi on-load) – siguraduhing nag-i-start sa unang subok","Nakapaskil ang starting instructions; parehong paraan ng pag-start","Weekly test at monthly on-load test records"],"fx":"ANO ANG HINIHINGI:\nAlam ng crew kung paano i-start ang emergency generator at mag-supply sa ESB.\n\nKAILAN MAY FINDING:\n• Hindi alam\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Titingnan ang start test nang walang load\n• Pinapaliwanag ang procedure","ff":["Hindi nag-a-auto start ang emergency generator / hindi nasusubukan on load bawat quarter","Hindi nakapaskil ang starting instructions, mababa ang fuel tank, naninigas ang louvers"]},{"id":"13.37","s":"13","sn":"Machinery Space","a":"ER","h":0,"c":["Spare starter on board"],"o":"If the starting source of the emergency generator relies on a single starter motor, has a spare starter motor been provided? (V)","eg":"Spare starter motor if single starter.","ex":"WHAT IS ASKED:\nSpare starter motor, if there is only one.\n\nFINDING WHEN:\n• Missing\n\nWHAT THE INSPECTOR DOES:\n• Checks it","fg":"Spare starter motor kung iisa lang ang starter.","fc":["May spare starter sa barko"],"fx":"ANO ANG HINIHINGI:\nSpare starter motor, kung iisa lang.\n\nKAILAN MAY FINDING:\n• Wala\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"13.38","s":"13","sn":"Machinery Space","a":"ER","h":0,"c":["N/A if em'cy gen fitted"],"o":"If an emergency generator is not fitted, are engine room emergency batteries in good order, fully charged and capable of supplying the designed power load up to a minimum 18 hours? (V)","eg":"If no em'cy generator – batteries for 18 h.","ex":"WHAT IS ASKED:\nIf there is no emergency generator: batteries for 18 hours.\n\nFINDING WHEN:\n• Insufficient\n\nWHAT THE INSPECTOR DOES:\n• Checks them","fg":"Kung walang em'cy generator – batteries para sa 18 oras.","fc":["N/A kung may em'cy gen"],"fx":"ANO ANG HINIHINGI:\nKung walang emergency generator: batteries para sa 18 oras.\n\nKAILAN MAY FINDING:\n• Kulang\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"13.39","s":"13","sn":"Machinery Space","a":"ER","h":1,"c":["Insulation monitors on 440V & 220V within limits (≥0.5/0.2 MΩ)","No earth fault lamps lit"],"o":"Is the main and emergency switchboard earth fault monitoring equipment operational with no earthing faults indicated? (V)","f":["Earth fault on MSB/ESB not rectified"],"eg":"Earth fault monitors on MSB/ESB without earth faults.","ex":"WHAT IS ASKED:\nEarth fault monitors on MSB and ESB without earth fault indication.\n\nFINDING WHEN:\n• Earth fault\n\nWHAT THE INSPECTOR DOES:\n• Visual check\n\nREMEMBER:\n• ≥0.2 MΩ at 220V, ≥0.5 MΩ at 440V","fg":"Earth fault monitors sa MSB/ESB na walang earth fault.","fc":["Insulation monitors sa 440V at 220V pasok sa limit (≥0.5/0.2 MΩ)","Walang nakasinding earth fault lamp"],"fx":"ANO ANG HINIHINGI:\nEarth fault monitors sa MSB at ESB na walang earth fault.\n\nKAILAN MAY FINDING:\n• May earth fault\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check\n\nTANDAAN:\n• ≥0.2 MΩ sa 220V, ≥0.5 MΩ sa 440V","ff":["Earth fault sa MSB/ESB na hindi naayos"]},{"id":"13.40","s":"13","sn":"Machinery Space","a":"ER","h":1,"c":["Records with communication & heading check"],"o":"Is an emergency steering gear drill being carried out every three months? (V)","f":["Emergency steering drill >3 months / instructions and comms not posted"],"eg":"Emergency steering drill every 3 months – records.","ex":"WHAT IS ASKED:\nEmergency steering drill every 3 months.\n\nFINDING WHEN:\n• Not done\n\nWHAT THE INSPECTOR DOES:\n• Checks records\n\nREMEMBER:\n• SOLAS V/26","fg":"Emergency steering drill bawat 3 buwan – records.","fc":["Records na may komunikasyon at heading check"],"fx":"ANO ANG HINIHINGI:\nEmergency steering drill bawat 3 buwan.\n\nKAILAN MAY FINDING:\n• Hindi nagawa\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang records\n\nTANDAAN:\n• SOLAS V/26","ff":["Emergency steering drill >3 buwan / hindi nakapaskil ang instructions at comms"]},{"id":"13.41","s":"13","sn":"Machinery Space","a":"ER","h":0,"c":["Level OK; pump operable"],"o":"Is the emergency reserve tank of the steering gear system fully charged and is the manual transfer pump operational?? (V)","eg":"Steering gear reserve tank full, manual transfer pump working.","ex":"WHAT IS ASKED:\nSteering reserve tank full and the hand pump working.\n\nFINDING WHEN:\n• Empty or defective\n\nWHAT THE INSPECTOR DOES:\n• Checks it","fg":"Puno ang steering gear reserve tank, gumagana ang manual transfer pump.","fc":["OK ang level; gumagana ang pump"],"fx":"ANO ANG HINIHINGI:\nPuno ang reserve tank ng steering at gumagana ang hand pump.\n\nKAILAN MAY FINDING:\n• Walang laman o sira\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"13.42","s":"13","sn":"Machinery Space","a":"ER","h":0,"c":["Gyro repeater readable; phone/talk-back works"],"o":"Is a heading indicator and communication system provided in the steering gear room and are they in good order? (V)","eg":"Heading indicator & communication in the steering room.","ex":"WHAT IS ASKED:\nHeading indicator and communication in the steering room.\n\nFINDING WHEN:\n• Not working\n\nWHAT THE INSPECTOR DOES:\n• Checks them","fg":"Heading indicator at komunikasyon sa steering room.","fc":["Nababasa ang gyro repeater; gumagana ang phone/talk-back"],"fx":"ANO ANG HINIHINGI:\nHeading indicator at komunikasyon sa steering room.\n\nKAILAN MAY FINDING:\n• Hindi gumagana\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"13.43","s":"13","sn":"Machinery Space","a":"ER","h":0,"c":["Readable & accurate"],"o":"Is the rudder angle indicator at the emergency steering position in good order, and is the display clearly legible? (V)","eg":"Rudder angle indicator at the emergency steering position.","ex":"WHAT IS ASKED:\nRudder angle indicator at the emergency steering position.\n\nFINDING WHEN:\n• Not readable\n\nWHAT THE INSPECTOR DOES:\n• Checks it","fg":"Rudder angle indicator sa emergency steering position.","fc":["Nababasa at tama"],"fx":"ANO ANG HINIHINGI:\nRudder angle indicator sa emergency steering position.\n\nKAILAN MAY FINDING:\n• Hindi mabasa\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"13.45","s":"13","sn":"Machinery Space","a":"ER","h":0,"c":["Non-slip, guardrails around rams"],"o":"Are suitable handrails, gratings or other non-slip surfaces provided for the steering gear compartment? (V)","eg":"Handrails & gratings in the steering room.","ex":"WHAT IS ASKED:\nHandrails and non-slip surfaces in the steering room.\n\nFINDING WHEN:\n• Missing\n\nWHAT THE INSPECTOR DOES:\n• Visual check","fg":"Handrails at gratings sa steering room.","fc":["Hindi madulas, may guardrails sa paligid ng rams"],"fx":"ANO ANG HINIHINGI:\nHandrails at hindi madulas na sahig sa steering room.\n\nKAILAN MAY FINDING:\n• Wala\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check"},{"id":"14.1","s":"14","sn":"General Appearance - Hull and Superstructure","a":"DECK","h":0,"c":["Photos from quay/boat; touch up where possible"],"o":"Is the ship’s hull clean, free of significant corrosion, extensive coating breakdown and marine growth? (V)","eg":"Hull clean, without serious corrosion/coating breakdown.","ex":"WHAT IS ASKED:\nHull clean, without serious corrosion or coating breakdown.\n\nFINDING WHEN:\n• Serious corrosion\n\nWHAT THE INSPECTOR DOES:\n• Visual check","fg":"Malinis ang hull, walang matinding kalawang/sirang coating.","fc":["Mga picture mula sa pantalan/bangka; mag-touch up kung kaya"],"fx":"ANO ANG HINIHINGI:\nMalinis ang hull, walang matinding kalawang o sirang pintura.\n\nKAILAN MAY FINDING:\n• Matinding kalawang\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check"},{"id":"14.2","s":"14","sn":"General Appearance - Hull and Superstructure","a":"DECK","h":0,"c":["All markings visible & contrasting"],"o":"Are the following permanent markings on the ship’s hull, where applicable, plainly visible and painted in a contrasting colour? (V) > The vessel’s name > Port of registry > Load lines > Draft marks > Thruster warnings > Tug push points > IMO number > Bulbous bow mark","eg":"Hull markings: name, port, load lines, draft marks, thruster, tug push.","ex":"WHAT IS ASKED:\nHull markings visible.\n\nFINDING WHEN:\n• Not visible\n\nWHAT THE INSPECTOR DOES:\n• Visual check","fg":"Hull markings: pangalan, port, load lines, draft marks, thruster, tug push.","fc":["Kita at malinaw ang lahat ng markings"],"fx":"ANO ANG HINIHINGI:\nKita ang markings sa hull.\n\nKAILAN MAY FINDING:\n• Hindi makita\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check"},{"id":"14.3","s":"14","sn":"General Appearance - Hull and Superstructure","a":"DECK","h":1,"c":["Chip & paint heavy scale areas; clean cargo residues"],"o":"Are the weather decks free of loose rust scale and maintained in a satisfactory condition? (V)","f":["Loose rust scale on main deck"],"eg":"Main deck without loose rust scale.","ex":"WHAT IS ASKED:\nDeck without loose rust.\n\nFINDING WHEN:\n• Loose rust present\n\nWHAT THE INSPECTOR DOES:\n• Visual check","fg":"Main deck na walang maluwag na kalawang.","fc":["Tuktukin at pinturahan ang may makapal na kalawang; linisin ang cargo residues"],"fx":"ANO ANG HINIHINGI:\nDeck na walang maluwag na kalawang.\n\nKAILAN MAY FINDING:\n• Meron\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check","ff":["Maluwag na kalawang sa main deck"]},{"id":"14.4","s":"14","sn":"General Appearance - Hull and Superstructure","a":"DECK","h":1,"c":["Fire, ballast, air, hydraulic & steam lines on deck – no temporary repairs"],"o":"Are the pipes on deck free of significant corrosion, pitting, soft patches, leakage or temporary repair and maintained in good condition? (V)","f":["Deck pipes with clamps / doublers / leaking"],"eg":"Deck pipes without pitting, soft patches, clamps, leaks.","ex":"WHAT IS ASKED:\nDeck pipes without corrosion, holes or temporary repairs.\n\nFINDING WHEN:\n• Clamps or leaks\n\nWHAT THE INSPECTOR DOES:\n• Visual check","fg":"Deck pipes na walang pitting, soft patches, clamps, leaks.","fc":["Fire, ballast, air, hydraulic at steam lines sa deck – walang temporary repair"],"fx":"ANO ANG HINIHINGI:\nDeck pipes na walang kalawang, butas o temporary repair.\n\nKAILAN MAY FINDING:\n• May clamps o leak\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check","ff":["Deck pipes na may clamps / doublers / leak"]},{"id":"14.5","s":"14","sn":"General Appearance - Hull and Superstructure","a":"DECK","h":1,"c":["Door dogs & rubbers good; fire doors self-close, not wedged open","Deadlights present; windows not cracked"],"o":"Are all watertight doors (where fitted), fire doors, weathertight doors, portholes and wheelhouse windows maintained in good order? (V)","f":["Weathertight door seals damaged, dogs seized"],"eg":"Weathertight doors, fire doors, portholes, wheelhouse windows in good condition.","ex":"WHAT IS ASKED:\nDoors (watertight, fire, weathertight), portholes and bridge windows in good condition.\n\nFINDING WHEN:\n• Defective\n\nWHAT THE INSPECTOR DOES:\n• Visual check","fg":"Maayos ang weathertight doors, fire doors, portholes, wheelhouse windows.","fc":["Maayos ang door dogs at goma; sumasara nang kusa ang fire doors, hindi naka-wedge nang bukas","Kumpleto ang deadlights; walang bitak ang bintana"],"fx":"ANO ANG HINIHINGI:\nMaayos ang mga pinto (watertight, fire, weathertight), portholes at bintana ng bridge.\n\nKAILAN MAY FINDING:\n• Sira\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check","ff":["Sira ang seals ng weathertight door, naninigas ang dogs"]},{"id":"14.6","s":"14","sn":"General Appearance - Hull and Superstructure","a":"DECK","h":1,"c":["Every air pipe head marked with tank served; floats/balls OK (Class checks)","No wastage at deck connection"],"o":"Are the vents and air pipes on weather decks maintained in good order and are they clearly marked to indicate the compartment they serve? (V)","f":["Air pipes and vents not marked with space served / closing devices seized or missing"],"eg":"Air pipes & vents: condition, closing devices, MARKING of space served.","ex":"WHAT IS ASKED:\nVents and air pipes in good condition, marked with the space they serve.\n\nFINDING WHEN:\n• No marking\n\nWHAT THE INSPECTOR DOES:\n• Visual check","fg":"Air pipes at vents: kondisyon, closing devices, MARKA ng space na sineserbisyuhan.","fc":["Bawat air pipe head may marka ng tank na sineserbisyuhan; OK ang floats/balls (chine-check ng Class)","Walang pagkabulok sa dugtong sa deck"],"fx":"ANO ANG HINIHINGI:\nMaayos ang vents at air pipes, may marka ng space na sineserbisyuhan.\n\nKAILAN MAY FINDING:\n• Walang marka\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check","ff":["Air pipes at vents na walang marka ng space / naninigas o wala ang closing devices"]},{"id":"14.8","s":"14","sn":"General Appearance - Hull and Superstructure","a":"DECK","h":0,"c":["Numbers visible both sides"],"o":"Are the hatch numbers clearly indicated and correctly placed? (V)","eg":"Hatch numbers correctly marked.","ex":"WHAT IS ASKED:\nHatch numbers visible.\n\nFINDING WHEN:\n• Not visible\n\nWHAT THE INSPECTOR DOES:\n• Visual check","fg":"Tama ang marka ng hatch numbers.","fc":["Kita ang numero sa magkabilang gilid"],"fx":"ANO ANG HINIHINGI:\nKita ang hatch numbers.\n\nKAILAN MAY FINDING:\n• Hindi makita\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check"},{"id":"14.9","s":"14","sn":"General Appearance - Hull and Superstructure","a":"DECK","h":1,"c":["Test all deck lights & hold lights before inspection","Mast fittings not corroded"],"o":"Are the mast heads and their fittings, including but not limited to wire stays, as well as the flood lights, deck lights, emergency lights, and hold lights (if installed), in good working order? (V)","f":["Deck / flood lights not working (inspector switches them on)"],"eg":"Masts, stays, flood/deck/emergency/hold lights working (inspector will switch them on).","ex":"WHAT IS ASKED:\nMasts, stays and lights (deck, flood, emergency, hold) working.\n\nFINDING WHEN:\n• Lights do not come on\n\nWHAT THE INSPECTOR DOES:\n• Tests the hold lights","fg":"Gumagana ang masts, stays, flood/deck/emergency/hold lights (bubuksan ito ng inspector).","fc":["Subukan lahat ng deck lights at hold lights bago ang inspection","Hindi kalawangin ang mast fittings"],"fx":"ANO ANG HINIHINGI:\nGumagana ang masts, stays at ilaw (deck, flood, emergency, hold).\n\nKAILAN MAY FINDING:\n• Hindi umiilaw\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Sinusubukan ang ilaw ng holds","ff":["Hindi gumagana ang deck / flood lights (binubuksan ito ng inspector)"]},{"id":"14.10","s":"14","sn":"General Appearance - Hull and Superstructure","a":"HOLD","h":1,"c":["Lamp holder, drip shield & shade non-conductive","Cables/plugs intact; inspection records"],"o":"Are portable and fixed cargo lights used for illumination of cargo holds inspected regularly and maintained in good condition? (V)","f":["Portable cargo lights with metal shade / no isolation / damaged cables"],"eg":"Portable cargo lights: non-conductive holder/shade, isolation, inspections.","ex":"WHAT IS ASKED:\nPortable and fixed hold lights inspected and in good condition.\n\nFINDING WHEN:\n• Lamp holder, drip shield and shade not made of non-conductive material\n\nWHAT THE INSPECTOR DOES:\n• Checks them","fg":"Portable cargo lights: non-conductive ang holder/shade, isolation, inspections.","fc":["Non-conductive ang lamp holder, drip shield at shade","Buo ang cables/plugs; inspection records"],"fx":"ANO ANG HINIHINGI:\nNa-inspect at maayos ang portable at fixed hold lights.\n\nKAILAN MAY FINDING:\n• Hindi non-conductive ang lamp holder, drip shield at shade\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check","ff":["Portable cargo lights na may metal shade / walang isolation / sira ang cables"]},{"id":"14.11","s":"14","sn":"General Appearance - Hull and Superstructure","a":"DECK","h":1,"c":["No broken covers, exposed wires, missing glands","Weathertight sockets with caps"],"o":"Is the condition of electrical equipment including lights,switches,sockets, junction boxes, plugs,conduits, cabling and wiring on weather decks and around the accommodation satisfactory?(V)","eg":"Electrical on deck/accommodation: sockets, junction boxes, cables in good condition.","ex":"WHAT IS ASKED:\nElectrical installations on deck and in accommodation in good condition.\n\nFINDING WHEN:\n• Exposed or broken cables\n\nWHAT THE INSPECTOR DOES:\n• Visual check","fg":"Electrical sa deck/accommodation: maayos ang sockets, junction boxes, cables.","fc":["Walang sirang takip, nakalantad na wire, kulang na glands","Weathertight sockets na may takip"],"fx":"ANO ANG HINIHINGI:\nMaayos ang electrical sa deck at accommodation.\n\nKAILAN MAY FINDING:\n• Nakalantad o sirang cables\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check"},{"id":"14.12","s":"14","sn":"General Appearance - Hull and Superstructure","a":"DECK","h":1,"c":["Ex-proof lights & fans; extinguishing system","Chemicals segregated & secured","Warning signs; battery room vent & eyewash"],"o":"Are the chemicals and gases stored correctly, and are the paint locker, battery room, oxygen and acetylene rooms, and other flammable lockers and storage spaces equipped with ventilation systems, explosion-proof lights, and other fittings in good working order? (V)","f":["Paint store sprinkler or ventilation defective / non Ex-proof lights / battery room not ventilated"],"eg":"Paint store, battery room, O2/acetylene rooms: ventilation, Ex-proof lights, fire extinguishing, signs.","ex":"WHAT IS ASKED:\nChemicals and gases correctly stored, and stores with ventilation, Ex-proof lights and fire extinguishing.\n\nFINDING WHEN:\n• Wrong storage\n\nWHAT THE INSPECTOR DOES:\n• Visual check\n\nREMEMBER:\n• Segregate incompatible materials","fg":"Paint store, battery room, O2/acetylene rooms: ventilation, Ex-proof lights, fire extinguishing, signs.","fc":["Ex-proof lights at fans; extinguishing system","Hiwalay at naka-secure ang chemicals","Warning signs; vent at eyewash sa battery room"],"fx":"ANO ANG HINIHINGI:\nTama ang imbakan ng chemicals at gas, at may ventilation, Ex-proof lights at fire extinguishing ang stores.\n\nKAILAN MAY FINDING:\n• Maling imbakan\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check\n\nTANDAAN:\n• Paghiwalayin ang hindi magkatugmang materyales","ff":["Sira ang sprinkler o ventilation ng paint store / hindi Ex-proof ang ilaw / walang ventilation ang battery room"]},{"id":"14.13","s":"14","sn":"General Appearance - Hull and Superstructure","a":"ACC","h":0,"c":["Bosun store, provision stores tidy & secured"],"o":"Are the stores located inside the accommodation and on the weather decks clean and tidy? (V)","eg":"Stores (accommodation & deck) clean, tidy, secured.","ex":"WHAT IS ASKED:\nStores clean and tidy.\n\nFINDING WHEN:\n• Untidy\n\nWHAT THE INSPECTOR DOES:\n• Visual check","fg":"Malinis, maayos at naka-secure ang stores (accommodation at deck).","fc":["Maayos at naka-secure ang bosun store, provision stores"],"fx":"ANO ANG HINIHINGI:\nMalinis at maayos ang stores.\n\nKAILAN MAY FINDING:\n• Magulo\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check"},{"id":"14.15","s":"14","sn":"General Appearance - Hull and Superstructure","a":"ACC","h":0,"c":["No damaged cables/plugs; galley range guards, fire blanket"],"o":"Are galley appliances, audio-visual equipment, and other electrical equipment inside the accommodation in good order? (V)","eg":"Galley & accommodation electrical appliances in good condition.","ex":"WHAT IS ASKED:\nGalley appliances and electrical items in accommodation in good condition.\n\nFINDING WHEN:\n• Defective\n\nWHAT THE INSPECTOR DOES:\n• Visual check","fg":"Maayos ang galley at electrical appliances sa accommodation.","fc":["Walang sirang cables/plugs; galley range guards, fire blanket"],"fx":"ANO ANG HINIHINGI:\nMaayos ang gamit sa galley at electrical sa accommodation.\n\nKAILAN MAY FINDING:\n• Sira\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check"},{"id":"14.16","s":"14","sn":"General Appearance - Hull and Superstructure","a":"ACC","h":0,"c":["Test man-trapped alarm & inside release"],"o":"Are the door seals, catches and alarm system of the refrigerated space in good order? (V)","eg":"Refrigerated rooms: door seals, catches, alarm (man-trapped).","ex":"WHAT IS ASKED:\nCold rooms with seals, catches and alarm in good condition.\n\nFINDING WHEN:\n• Alarm not working\n\nWHAT THE INSPECTOR DOES:\n• Tests it","fg":"Refrigerated rooms: door seals, catches, alarm (man-trapped).","fc":["Subukan ang man-trapped alarm at inside release"],"fx":"ANO ANG HINIHINGI:\nMaayos ang seals, catches at alarm ng cold rooms.\n\nKAILAN MAY FINDING:\n• Hindi gumagana ang alarm\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Sinusubukan"},{"id":"14.17","s":"14","sn":"General Appearance - Hull and Superstructure","a":"ACC","h":0,"c":["Inspection certificate; emergency stop/phone"],"o":"Is the elevator, where fitted, inspected, tested and in good order? (V)","eg":"Elevator inspected & certified.","ex":"WHAT IS ASKED:\nElevator inspected and in good condition.\n\nFINDING WHEN:\n• Not inspected\n\nWHAT THE INSPECTOR DOES:\n• Checks it","fg":"Na-inspect at may certificate ang elevator.","fc":["Inspection certificate; emergency stop/phone"],"fx":"ANO ANG HINIHINGI:\nNa-inspect at maayos ang elevator.\n\nKAILAN MAY FINDING:\n• Walang inspection\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"14.18","s":"14","sn":"General Appearance - Hull and Superstructure","a":"ACC","h":0,"c":["Not used as store; medicine chest inventory in date","📋 Inspector: Medical oxygen cylinder: annual check, 5-yearly hydrostatic test"],"o":"If provided, is the ship’s hospital properly equipped, clean, hygienic and for medical use only? (V & M)","eg":"Hospital equipped, clean, for medical use only.","ex":"WHAT IS ASKED:\nHospital equipped, clean, for medical use only.\n\nFINDING WHEN:\n• Used as a store\n\nWHAT THE INSPECTOR DOES:\n• Visual check","fg":"Kumpleto ang gamit, malinis, at para lang sa medical ang hospital.","fc":["Hindi ginagamit na bodega; hindi expired ang medicine chest inventory","📋 Inspector: Medical oxygen cylinder: annual check, 5-yearly hydrostatic test"],"fx":"ANO ANG HINIHINGI:\nKumpleto ang gamit, malinis, at para lang sa medical ang hospital.\n\nKAILAN MAY FINDING:\n• Ginagamit na bodega\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check"},{"id":"14.19","s":"14","sn":"General Appearance - Hull and Superstructure","a":"DECK","h":1,"c":["No wasted/broken rails; chains between stanchions taut","Ladders & steps not wasted"],"o":"Are the ship’s guard rails, walkways, and access ladders, as well as the steps and railings, maintained and in good working order, and are the securing arrangements for deck cargoes on the deck also maintained and in satisfactory condition?(V)","f":["Handrails wasted or broken / chains instead of rails"],"eg":"Guard rails, walkways, ladders, steps in good condition – no hanging chains.","ex":"WHAT IS ASKED:\nRailings, walkways, ladders in good condition.\n\nFINDING WHEN:\n• Slack chains between stanchions\n\nWHAT THE INSPECTOR DOES:\n• Visual check","fg":"Maayos ang guard rails, walkways, ladders, steps – walang nakalaylay na kadena.","fc":["Walang bulok/sirang rails; mahigpit ang kadena sa pagitan ng stanchions","Hindi bulok ang ladders at steps"],"fx":"ANO ANG HINIHINGI:\nMaayos ang railings, walkways at hagdan.\n\nKAILAN MAY FINDING:\n• Nakalaylay na kadena sa pagitan ng stanchions\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check","ff":["Bulok o sira ang handrails / kadena imbes na rails"]},{"id":"15.1","s":"15","sn":"Health and Welfare of Seafarers","a":"DOC","h":0,"c":["SEAs signed copies; CBA/ITF if any","Monthly wage accounts given to crew","No deductions for travel/recruitment"],"o":"Do the Seafarer Employment Agreements (SEA) comply with the requirements of MLC 2006,do crew salaries meet or exceed the current ILO Minimum Wage Scale, and are individual monthly statements provided to all seafarers on board, detailing their wages and any authorised deductions, such as allotments? (V & M)","eg":"SEA per MLC, wages ≥ ILO minimum, monthly wage statements, no illegal deductions.","ex":"WHAT IS ASKED:\nSEA per MLC, wages at least the ILO minimum, monthly account.\n\nFINDING WHEN:\n• Illegal deductions (e.g. tickets)\n\nWHAT THE INSPECTOR DOES:\n• If there is an ITF/CBA, he does not check wages\n• Otherwise does a random check","fg":"SEA ayon sa MLC, sahod ≥ ILO minimum, monthly wage statements, walang ilegal na kaltas.","fc":["May pirmadong kopya ng SEA; CBA/ITF kung meron","Binibigyan ang crew ng monthly wage accounts","Walang kaltas para sa pamasahe/recruitment"],"fx":"ANO ANG HINIHINGI:\nSEA ayon sa MLC, sahod hindi bababa sa ILO minimum, buwanang account.\n\nKAILAN MAY FINDING:\n• Ilegal na kaltas (hal. tiket)\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Kung may ITF/CBA, hindi niya chine-check ang sahod\n• Kung wala, random na check"},{"id":"15.2","s":"15","sn":"Health and Welfare of Seafarers","a":"ACC","h":1,"c":["Weekly Master's inspection records (Finding if missing)","Cabins, toilets, laundry clean; ventilation/lights work"],"o":"Are the accommodation spaces safe, provided to a respectable level of health and hygiene and regularly inspected, including checks of ventilation, noise, heating, lighting, and sanitation? (V)","eg":"Accommodation: cleanliness, Master's weekly inspection records.","ex":"WHAT IS ASKED:\nAccommodation safe, clean, with regular inspections.\n\nFINDING WHEN:\n• Master's weekly inspection records missing\n\nWHAT THE INSPECTOR DOES:\n• Checks them\n\nREMEMBER:\n• MLC 3.1","fg":"Accommodation: kalinisan, weekly inspection records ng Master.","fc":["Weekly inspection records ng Master (finding kung wala)","Malinis ang cabins, toilets, laundry; gumagana ang ventilation/ilaw"],"fx":"ANO ANG HINIHINGI:\nLigtas at malinis ang accommodation, may regular na inspection.\n\nKAILAN MAY FINDING:\n• Walang weekly inspection records ng Master\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check\n\nTANDAAN:\n• MLC 3.1"},{"id":"15.3","s":"15","sn":"Health and Welfare of Seafarers","a":"ACC","h":0,"c":["Gym, TV, internet access; welfare budget evidence"],"o":"Are the ship’s staff provided with adequate recreational facilities on board, and has the Master been allocated a monthly welfare budget? (V)","eg":"Recreation facilities & welfare budget.","ex":"WHAT IS ASKED:\nRecreation spaces and welfare budget.\n\nFINDING WHEN:\n• Missing\n\nWHAT THE INSPECTOR DOES:\n• Checks them","fg":"Recreation facilities at welfare budget.","fc":["Gym, TV, internet; patunay ng welfare budget"],"fx":"ANO ANG HINIHINGI:\nRecreation spaces at welfare budget.\n\nKAILAN MAY FINDING:\n• Wala\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"15.5","s":"15","sn":"Health and Welfare of Seafarers","a":"ACC","h":1,"c":["Free drinking water (not only bottled for sale)","Potable water analysis ≥ twice a year","Cook certificate; galley hygiene; food budget known"],"o":"Are seafarers being provided with sufficient food and water free of charge and does the cook hold appropriate qualifications? (V)","eg":"Food & water free of charge, qualified cook, potable water tests.","ex":"WHAT IS ASKED:\nEnough food and water free of charge, and a qualified cook.\n\nFINDING WHEN:\n• Water only for payment\n• Water analysis less than 2 times a year\n\nWHAT THE INSPECTOR DOES:\n• Writes the food budget per person per day","fg":"Libre ang pagkain at tubig, qualified ang cook, potable water tests.","fc":["Libreng inuming tubig (hindi lang bottled na binebenta)","Potable water analysis ≥ dalawang beses kada taon","Cook certificate; kalinisan ng galley; alam ang food budget"],"fx":"ANO ANG HINIHINGI:\nSapat at libreng pagkain at tubig, at qualified na cook.\n\nKAILAN MAY FINDING:\n• Tubig na may bayad lang\n• Water analysis na mas mababa sa 2 beses kada taon\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Isinusulat ang food budget bawat tao bawat araw"},{"id":"15.6","s":"15","sn":"Health and Welfare of Seafarers","a":"ACC","h":0,"c":["Medical log; medicine chest; doctor visit records"],"o":"Are ship’s staff provided with appropriate medical care and access to health promotion programs, and Is there evidence that visits to a qualified medical doctor or dentist are arranged without delay in ports of call, when required? (V)","eg":"Medical care & doctor visits without delay.","ex":"WHAT IS ASKED:\nMedical care and doctor/dentist in port without delay.\n\nFINDING WHEN:\n• Delay\n\nWHAT THE INSPECTOR DOES:\n• Checks it","fg":"Medical care at pagpapatingin sa doktor nang walang delay.","fc":["Medical log; medicine chest; records ng doctor visit"],"fx":"ANO ANG HINIHINGI:\nMedical care at doktor/dentista sa pantalan nang walang delay.\n\nKAILAN MAY FINDING:\n• May delay\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"15.9","s":"15","sn":"Health and Welfare of Seafarers","a":"DOC","h":0,"c":["Policy posted in common language; crew briefed"],"o":"Has the vessel’s manager developed a policy and procedure addressing violence and harassment, including sexual harassment, bullying, and sexual assault, are the requirements of this policy being disseminated to the crew in their native language, and, are the crew familiar with the complaint procedure and how to report a complaint? (V)","f":["Policy not communicated in crew's language / crew unaware of complaint process"],"eg":"Violence/harassment policy communicated to the crew.","ex":"WHAT IS ASKED:\nA policy against violence and harassment, known by the crew.\n\nFINDING WHEN:\n• Missing\n\nWHAT THE INSPECTOR DOES:\n• Checks it","fg":"Naipaalam sa crew ang policy laban sa violence/harassment.","fc":["Nakapaskil ang policy sa common language; na-brief ang crew"],"fx":"ANO ANG HINIHINGI:\nMay policy laban sa karahasan at harassment, alam ng crew.\n\nKAILAN MAY FINDING:\n• Wala\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check","ff":["Hindi naipaalam ang policy sa wika ng crew / hindi alam ng crew ang complaint process"]},{"id":"15.10","s":"15","sn":"Health and Welfare of Seafarers","a":"DOC","h":0,"c":["Policy posted; training records of key personnel"],"o":"Has the vessel been provided with adequate policies addressing mental health and mental disorders, and have key on-board personnel received training to help them recognise signs of mental health issues? (V)","eg":"Mental health policy and training.","ex":"WHAT IS ASKED:\nA mental health policy and training.\n\nFINDING WHEN:\n• Missing\n\nWHAT THE INSPECTOR DOES:\n• Checks it","fg":"Mental health policy at training.","fc":["Nakapaskil ang policy; training records ng key personnel"],"fx":"ANO ANG HINIHINGI:\nMay mental health policy at training.\n\nKAILAN MAY FINDING:\n• Wala\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"15.11","s":"15","sn":"Health and Welfare of Seafarers","a":"ACC","h":0,"c":["Helpline posters (e.g. SeafarerHelp) posted"],"o":"Are seafarers provided with free access to external sources of support, whom they can contact in confidence while on board? (V)","eg":"Confidential access to external support (helplines).","ex":"WHAT IS ASKED:\nFree and confidential access to external support.\n\nFINDING WHEN:\n• Missing\n\nWHAT THE INSPECTOR DOES:\n• Checks it","fg":"Confidential na access sa external support (helplines).","fc":["Nakapaskil ang helpline posters (hal. SeafarerHelp)"],"fx":"ANO ANG HINIHINGI:\nLibre at confidential na access sa external support.\n\nKAILAN MAY FINDING:\n• Wala\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"15.12","s":"15","sn":"Health and Welfare of Seafarers","a":"DOC","h":0,"c":["Certificates of mental health awareness training"],"o":"Has company provided training for on-board key personnel in recognising signs of mental health problems? (V)","eg":"Mental health training for key personnel.","ex":"WHAT IS ASKED:\nTraining of key personnel to recognise signs of mental health problems.\n\nFINDING WHEN:\n• Missing\n\nWHAT THE INSPECTOR DOES:\n• Checks it","fg":"Mental health training para sa key personnel.","fc":["Certificates ng mental health awareness training"],"fx":"ANO ANG HINIHINGI:\nTraining ng key personnel para makilala ang palatandaan ng mental health problems.\n\nKAILAN MAY FINDING:\n• Wala\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"15.14","s":"15","sn":"Health and Welfare of Seafarers","a":"ACC","h":0,"c":["AHU filters cleaned; maintenance records"],"o":"Does the Air Handling Unit (AHU) maintain a comfortable temperature and is there recorded evidence of regular maintenance and cleaning of AHU available?","eg":"AHU: temperature, maintenance & cleaning.","ex":"WHAT IS ASKED:\nAHU with comfortable temperature and maintenance and cleaning records.\n\nFINDING WHEN:\n• No records\n\nWHAT THE INSPECTOR DOES:\n• Checks it","fg":"AHU: temperatura, maintenance at paglilinis.","fc":["Nalinis ang AHU filters; maintenance records"],"fx":"ANO ANG HINIHINGI:\nAHU na komportable ang temperatura at may records ng maintenance at paglilinis.\n\nKAILAN MAY FINDING:\n• Walang records\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"}],"s1":[{"id":"1.1","q":"Vessel’s name as it appears on the Certificate of xxx"},{"id":"1.2","q":"Vessel’s IMO Number"},{"id":"1.3","q":"Flag"},{"id":"1.4","q":"Date the vessel was delivered"},{"id":"1.6","q":"Maximum assigned deadweight (metric tonnes)"},{"id":"1.7","q":"Vessel type"},{"id":"1.8","q":"Hull type"},{"id":"1.9","q":"Vessel’s operation at the time of inspection"},{"id":"1.10","q":"Name of cargo being handled"},{"id":"1.11","q":"Details of Port State Control inspection history for the last 12 months"},{"id":"1.12","q":"Name of Classification Society"},{"id":"1.13","q":"Expiry date of Class Certificate"},{"id":"1.14","q":"Date the last Special Survey was completed"},{"id":"1.15","q":"Date of last routine dry dock"},{"id":"1.16","q":"Date of unscheduled repair / and or last dry dock"},{"id":"1.17.1","q":"Attained EEDI"},{"id":"1.17.2","q":"Carbon Intensity Indicator (CII)"},{"id":"1.19","q":"Name of the DoC Manager"},{"id":"1.20","q":"Date the current DoC Manager took over the vessel"},{"id":"1.21","q":"Dates of last two visits of the vessel’s manager"},{"id":"1.22","q":"Standard/Hybrid Inspection Name of the Rightship inspector"},{"id":"1.23","q":"Port of inspection"},{"id":"1.24.1","q":"Standard Date and time inspector arrived at the vessel"},{"id":"1.24.2","q":"Date and time of starting and completion of opening meeting"},{"id":"1.24.3","q":"Date and time of start and completion of closing meeting"},{"id":"1.25","q":"Date and time Rightship inspector left the vessel"},{"id":"1.26","q":"Total time taken for inspection"},{"id":"1.27","q":"Date the inspection was completed"},{"id":"1.28","q":"Name of the ship’s P&I club"},{"id":"1.29.1","q":"Is the vessel manager a subscriber to the Dry Bulk Centre of Excellence (DBCE)?"},{"id":"1.29.2","q":"Has a DryBMS self-assessment been completed?"}]};
const X={"hi":["4.5","4.18","9A.13","13.33","4.37","10.4","4.11"],"mind":[["He wants objective evidence, not words","Every “yes, we do it” without paper/record/photo becomes a finding. Whatever is done is written down, and the officer knows where it is.","Objective evidence ang hanap niya, hindi salita","Bawat “opo, ginagawa namin” na walang papel/record/picture ay magiging finding. Lahat ng ginagawa ay isinusulat, at alam ng officer kung nasaan ito."],["He takes the LAST form","Last enclosed space permit, hot work permit, bunker checklist, passage plan, drill. Check the last 3 of each yourself first.","Kinukuha niya ang HULING form","Huling enclosed space permit, hot work permit, bunker checklist, passage plan, drill. Ikaw muna ang mag-check ng huling 3 sa bawat isa."],["He compares the SMS with what you really do","If the SMS says “every 30 minutes” or “office approval”, that is exactly what he checks. The SMS must say only what the ship does, and the ship must do what the SMS says.","Ikinukumpara niya ang SMS sa totoong ginagawa","Kung sabi ng SMS ay “every 30 minutes” o “office approval”, iyon mismo ang iche-check niya. Ang nakasulat sa SMS ay dapat ginagawa ng barko, at ang ginagawa ng barko ay dapat nakasulat sa SMS."],["He tests, he does not only ask","OWS 15 ppm alarm (sound and light), emergency generator, davit on emergency power, rescue boat start, BNWAS, echo sounder alarm, nav light failure alarm, boiler flame failure. Test them all the day before.","Sinusubukan niya, hindi lang nagtatanong","OWS 15 ppm alarm (tunog at ilaw), emergency generator, davit sa emergency power, pag-start ng rescue boat, BNWAS, echo sounder alarm, nav light failure alarm, boiler flame failure. Subukan lahat isang araw bago."],["He asks the crew, not the Master","Safety officer, deputy, OOW, EOOW, bosun. An officer who hesitates = finding. Practise with the 🎤 Interview drill.","Ang crew ang tinatanong niya, hindi ang Master","Safety officer, deputy, OOW, EOOW, bosun. Officer na nag-aalangan sumagot = finding. Mag-practice gamit ang 🎤 Interview drill."],["He goes where nobody goes","Forecastle store, bosun store, steering gear, duct keel, emergency fire pump room, crane houses, mast top, under the hatch rams. Walk those places first.","Pumupunta siya kung saan walang pumupunta","Forecastle store, bosun store, steering gear, duct keel, emergency fire pump room, crane house, mast top, ilalim ng hatch rams. Doon muna mag-ikot."],["“Rectified during inspection” still counts","The finding is written even if you fix it in front of him. Fixing it during the inspection only helps the close-out.","Bilang pa rin ang “rectified during inspection”","Isusulat pa rin ang finding kahit ayusin mo sa harap niya. Ang pag-aayos habang may inspection ay nakakatulong lang sa close-out."],["Sections 3 and 13 multiply","About 4 low/medium in Navigation or Machinery count as 1 High. These two sections must be perfectly clean.","Dumarami ang bigat sa Sections 3 at 13","Mga 4 na low/medium sa Navigation o Machinery ay bilang na 1 High. Dapat malinis na malinis ang dalawang section na ito."],["The limit is 23 L/M — and the Highs","12-month validity: ≤23 low/medium with max 1 High and a good close-out. RightShip average in 2025 was 20.1 (H 1.5 · M 10.5 · L 8.1). The goal is fewer Highs, not only fewer findings.","Ang limit ay 23 L/M — at ang mga High","12 buwang validity: ≤23 low/medium, hindi hihigit sa 1 High, at maayos na close-out. Ang average ng RightShip noong 2025 ay 20.1 (H 1.5 · M 10.5 · L 8.1). Ang target ay mas kaunting High, hindi lang mas kaunting findings."],["The close-out is half the game","With a poor close-out you never get 12 months. You need one PDF, each finding in report order, root cause (not “human error”), responsible rank, date and before/after photos.","Kalahati ng laban ang close-out","Kapag mahina ang close-out, hindi ka makakakuha ng 12 buwan. Kailangan ng isang PDF, bawat finding ayon sa pagkakasunod sa report, root cause (hindi “human error”), responsableng rank, petsa at picture before/after."],["Many findings are office matters","9A.2 (hatch clearances), 4.37 (pilot ladder verification), 13.11 (PMS) and 3.15 (VDR playback) are common findings on many ships: often the procedure is missing in the SMS. Tell the office early so it is solved before the inspection.","Maraming finding ay galing sa opisina","Ang 9A.2 (hatch clearances), 4.37 (pilot ladder verification), 13.11 (PMS) at 3.15 (VDR playback) ay madalas na finding sa maraming barko: kadalasan wala ang procedure sa SMS. Sabihan agad ang opisina para maayos bago ang inspection."],["Hybrid: documents 72 hours before","Correct names, one file per request, valid. What is uploaded correctly is not asked again on board, and you save hours.","Hybrid: dokumento 72 oras bago","Tamang pangalan, isang file bawat request, valid. Ang na-upload nang tama ay hindi na itatanong ulit sa barko, kaya makakatipid ka ng oras."],["He checks the times against the clock","He compares the gas test time with the entry time on the permit, and the 15-min reading times with the working hours. One “wrong” time = finding, even if the work was done right. In the RA: a yellow/red score without additional measures = finding.","Tinitingnan niya ang mga oras","Kinukumpara niya ang oras ng gas test sa oras ng pagpasok sa permit, at ang oras ng readings bawat 15 minuto sa oras ng trabaho. Isang “maling” oras = finding, kahit tama ang trabaho. Sa RA: dilaw/pulang score na walang additional measures = finding."]],"crew":[["Master",[["2.1","Class status report dated ≤7 days, no overdue CoC, dispensations explained","Class status report ≤7 araw ang petsa, walang overdue CoC, naipaliwanag ang dispensations"],["4.4","Master's review: real feedback (good and bad points) + office reply on file","Master's review: totoong feedback (maganda at hindi maganda) + sagot ng opisina na naka-file"],["3.21","Check last passage plan: XTL ≥2 nm each side in open sea, no danger inside XTL, parallel indexing on coastal legs","I-check ang huling passage plan: XTL ≥2 nm bawat gilid sa open sea, walang panganib sa loob ng XTL, may parallel indexing sa coastal legs"],["3.3","Wheelhouse poster, pilot card & manoeuvring booklet show power limiter (limited & full power)","Wheelhouse poster, pilot card at manoeuvring booklet ay nagpapakita ng power limiter (limited at full power)"],["4.7","Hot work outside workshop: written plan approved by office BEFORE start","Hot work sa labas ng workshop: nakasulat na plan na aprubado ng opisina BAGO magsimula"],["3.15","VDR playback/assessment record from office available","May record ng VDR playback/assessment mula sa opisina"],["15.9","Harassment & bullying policy posted in crew native language, locked complaint box","Harassment & bullying policy na nakapaskil sa sariling wika ng crew, may nakakandadong complaint box"],["*","Run the 🎤 interview drill with all officers the day before","Gawin ang 🎤 interview drill sa lahat ng officer isang araw bago"]]],["Chief Officer / Safety Officer",[["4.5","Last 3 enclosed space permits: readings every 30 min and after breaks; O₂ 20.9%, CO₂ <0.5%, LFL <1%, toxic <50% OEL","Huling 3 enclosed space permit: readings bawat 30 min at pagkatapos ng break; O₂ 20.9%, CO₂ <0.5%, LFL <1%, toxic <50% OEL"],["4.5","Enclosed space register complete (forecastle store, duct keel, holds, CO₂ room); danger signs at every entrance","Kumpleto ang enclosed space register (forecastle store, duct keel, holds, CO₂ room); may danger sign sa bawat pasukan"],["4.16","Multi-gas detector with pump + personal detector for each entrant + CO₂ sensor; bump test records","Multi-gas detector na may pump + personal detector sa bawat papasok + CO₂ sensor; may bump test records"],["4.6","Enclosed space rescue drill incl. cargo hold scenario, with photos","Enclosed space rescue drill kasama ang cargo hold scenario, may mga picture"],["4.2","Safety inspections of all spaces with checklist; know your safety officer training","Safety inspection ng lahat ng space gamit ang checklist; alamin ang training ng safety officer"],["4.13","Ship/shore checklist: stevedores briefed on emergency, hold entry checked every watch","Ship/shore checklist: na-brief ang stevedores sa emergency, chine-check ang pagpasok sa hold bawat watch"],["9A.2","Hatch cover clearance measurements (6-monthly) signed and within maker tolerance","Hatch cover clearance measurements (bawat 6 buwan) may pirma at pasok sa tolerance ng maker"],["9A.13","No hydraulic leaks at hatch rams/stands; hose renewal dates ≤5 years","Walang hydraulic leak sa hatch rams/stands; petsa ng palit ng hose ≤5 taon"],["9A.19","Crane rocking test every 6 months recorded in Lifting Appliances Register","Crane rocking test bawat 6 buwan, naka-record sa Lifting Appliances Register"],["4.39","Helicopter area: Class strength letter on board, ladder with handrails, area clear","Helicopter area: may Class strength letter, ladder na may handrails, malinis ang area"],["4","Visitor/inspector familiarization form ready at the gangway; brief the inspector (alarms, muster, lifejacket, escort) BEFORE the walk-round — inspector signs it","Handa sa gangway ang visitor/inspector familiarization form; i-brief ang inspector (alarms, muster, lifejacket, escort) BAGO ang walk-round — pipirma ang inspector"],["4.5","Enclosed space – the 4 rules: (1) ventilate, (2) gas test and write the TIME – it must be BEFORE the entry time, (3) RA: every yellow/red score (9, 12…) gets additional measures + new residual score, else NO entry, (4) readings + time in the list every 15 min while anyone is inside","Enclosed space – 4 patakaran: (1) ventilate, (2) gas test at isulat ang ORAS – dapat BAGO ang oras ng pagpasok, (3) RA: bawat dilaw/pulang score (9, 12…) ay may additional measures + bagong residual score, kung wala – BAWAL pumasok, (4) readings + oras sa listahan bawat 15 minuto habang may tao sa loob"],["4.5","Responsible officer: stays OUTSIDE at the entrance for the whole entry — checks readings, permit time, rescue set, comms and standby man, keeps control of the entry. He does NOT go inside himself; if he must enter, the entry is handed over to another competent officer outside","Responsible officer: nasa LABAS sa pasukan sa buong pagpasok — chine-check ang readings, oras ng permit, rescue set, comms at standby man, hawak niya ang kontrol. HINDI siya pumapasok; kung kailangan niyang pumasok, ipapasa ang kontrol sa ibang competent officer na nasa labas"]]],["2nd Officer (Navigation)",[["3.21","Passage plan berth-to-berth, XTL correct, dangers clear, PI lines, no-go areas","Passage plan berth-to-berth, tama ang XTL, malinaw ang panganib, PI lines, no-go areas"],["3.1","Know the ECDIS failure procedure (single and both ECDIS)","Alamin ang ECDIS failure procedure (isang ECDIS at parehong ECDIS)"],["3.10","Radar magnetron hours vs maker limit; spare magnetron on board or performance check each watch","Radar magnetron hours kumpara sa limit ng maker; may spare magnetron o performance check bawat watch"],["3.9","Bridge manning level recorded at each stage of the voyage (log book)","Naka-record ang bridge manning level sa bawat stage ng voyage (log book)"],["3.3","Watch handover checklist ticked, incl. ECDIS configuration","Watch handover checklist naka-tick, kasama ang ECDIS configuration"],["3.20","NAVTEX/T&P warnings plotted on ECDIS","NAVTEX/T&P warnings naka-plot sa ECDIS"],["*","Test BNWAS, echo sounder alarm, nav light failure alarm the day before","Subukan ang BNWAS, echo sounder alarm, nav light failure alarm isang araw bago"]]],["3rd Officer (LSA/FFE)",[["4.18","Lifeboat equipment complete (SART, extinguisher, rations); no plastic/tape on wire pendants","Kumpleto ang lifeboat equipment (SART, extinguisher, rations); walang plastic/tape sa wire pendants"],["4.18","Rescue boat engine starts by hand; davit tested on emergency power","Rescue boat engine nag-i-start sa kamay; davit nasubukan sa emergency power"],["4.19","Liferaft & HRU service dates, correct installation","Petsa ng service ng liferaft at HRU, tamang pagkakabit"],["4.37","Pilot ladder tag, pre/post-use and 3-monthly checklists, Record of Equipment updated","Pilot ladder tag, pre/post-use at 3-monthly checklists, updated ang Record of Equipment"],["4.29","Extinguishers service dates; fire stations complete","Petsa ng service ng extinguishers; kumpleto ang fire stations"],["4.32","EEBD drill: donning + escape from lower ER platform to open deck, recorded","EEBD drill: pagsuot + pagtakas mula lower ER platform hanggang open deck, naka-record"]]],["Chief Engineer",[["13.11","PMS working and synced (or paper backup up to date); zero overdue jobs","Gumagana at naka-sync ang PMS (o updated ang paper backup); zero overdue jobs"],["13.36","Emergency generator: tested under load every quarter; crew know start & power-on procedure","Emergency generator: sinusubukan na may load bawat quarter; alam ng crew ang start at power-on procedure"],["5.15","OWS: 15 ppm alarm audible AND visual, auto-stop works; OCM log time = ship time","OWS: 15 ppm alarm may tunog AT ilaw, gumagana ang auto-stop; oras sa OCM log = oras ng barko"],["13.1","OPL/EPL override training every 3 months and after key crew change","OPL/EPL override training bawat 3 buwan at pagkatapos ng palit ng key crew"],["13.2","Engine manning matrix posted + records of manning applied (UMS/manned)","Engine manning matrix nakapaskil + records ng manning na ginamit (UMS/manned)"],["4.17","Oxy-acetylene: flashback arrestors, crimped hoses, annual check report, cylinders secured separately","Oxy-acetylene: flashback arrestors, crimped hoses, annual check report, cylinders naka-secure nang hiwalay"],["7A.7","Bunker checklist fully completed incl. H₂S/benzene readings","Bunker checklist kumpleto kasama ang H₂S/benzene readings"],["7A.5","Fuel samples analysed before use; report filed","Fuel samples na-analyse bago gamitin; naka-file ang report"]]],["2nd / 3rd Engineer & ETO",[["13.9","No permanent al
