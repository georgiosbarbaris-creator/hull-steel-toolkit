iation","Crew explain escalation and shore contacts"],["B","Medical supplies, log, equipment, officer competence","Inventory and demonstration"],["B","Drinking water testing and food storage temperatures","Analysis, fridge/freezer logs, galley"],["B","Accommodation ventilation, sanitation, laundry","Walkthrough with crew representative"],["B","Seafarer certificates and medicals valid","Crew document matrix"],["B","Rest records reflect drills and overtime","Cross-check with logs, AIS/port activity"],["B","Common language sufficient for emergencies","Random oral/practical questions"],["B","Shore leave facilitated","Crew information, MLC process"],["C","Recreation and complaint contacts displayed","Noticeboards and crew answers"]],"how":["Cross-check two random rest-hour logs with cargo ops and mooring stations.","Ask crew privately how they report an unsafe order and whether they can reach the DPA.","Never brief crew to give rote false answers or change time sheets."]},{"k":"21","t":"Drills, ISPS & emergency response","tf":"Drills, ISPS at emergency response","q":["4.9","4.5","4.6","4.30","12.1","12.2","4.43","12.7"],"stop":"Crew cannot execute mandatory emergency functions; no gas monitor for enclosed space; cannot recover from blackout.","i":[["A","Crew knows individual fire/abandon duties on current muster list","Interview and muster"],["A","Emergency communications bridge–ER–teams work","Safe test and demonstration"],["A","Emergency steering and blackout recovery familiar","Tabletop / safe live test"],["B","Fire and abandon-ship drills recorded and meaningful","Drills, photos, debrief"],["B","Enclosed-space rescue plan, gas detection, rescue gear","Permit, equipment, demonstration"],["B","Entry permits include measured atmospheres and monitoring","Gas meter calibration, entries"],["B","SCBA donning and casualty transport exercised","Timed demonstration"],["B","SSP, security levels and restricted areas managed","SSO records, access controls"],["B","Security drills and duties up to date","Training/drill records"],["B","Emergency shore contacts, spill response, reporting","Phone tree and drill trace"],["B","Cyber/bridge system change control and backups","Risk assessment, versions, restore"],["B","New joiners' familiarisation practical and signed","Competence records"],["C","Emergency stations stocked and labelled","Station rounds"]],"how":["One unscripted tabletop scenario; ask junior crew to locate equipment.","Never use live CO2, hot work, energised panels or unsafe entry as a 'test'.","Enclosed space re-check frequency follows the ship-specific risk assessment — no universal 30-minute rule."]},{"k":"22","t":"Ship-type overlays (bulk first)","tf":"Para sa uri ng barko (bulk muna)","q":["8A.2","8A.3","4.14"],"stop":"Operation beyond statutory endorsement; critical cargo protection unavailable; stability/stress breach.","i":[["A","BULK: IMSBC hazards, TML/moisture, certificates","Declarations, tests, Master acceptance"],["A","BULK: hold water-ingress detection / structure after heavy weather","Alarm logs, hold inspection, hatch test"],["A","TANKER: inert gas and O2 control","IGS logs, alarm test"],["A","TANKER: cargo pump stops, high-level, cargo alarms","Test protocol, terminal agreement"],["A","TANKER: ODME and cargo record equipment","Approval, test, ORB Part II"],["A","CHEMICAL: compatibility, P&A, SMPEP","IBC/CoF, line checks"],["A","GAS: ESD, gas detection, cargo protection","IGC safety demonstration"],["A","PASSENGER: muster, crowd management, fire zones","SOLAS/STCW procedures"],["B","CONTAINER: lashing computer, VGM, CSAP, stow limits","Stow and CSM"],["B","RO-RO: vehicle deck FFA, ramps/doors, securing","Closure tests, CSM, drills"],["B","LIVESTOCK: ventilation, water, welfare systems","National and trade rules"],["B","ALTERNATIVE FUEL: IGF systems and endorsements","Approval, cause/effect tests"]],"how":["Build a ship-specific applicability matrix before boarding.","Request cargo/terminal documents early.","Dangerous/pressurised equipment: maker procedures and authorised witnesses only."]}],"tree":[["Is there actual danger to life, safety, seaworthiness, environment or welfare?","YES → STOP the operation, protect people, tell the Master. NO → next gate."],["Is law/approval breached, a mandatory system inoperative or a certificate invalid?","YES → Company + Flag/RO/port; corrective plan before sailing."],["Can the defect be safely repaired and retested before arrival?","YES → competent repair, witnessed test, proof. NO → contingency and authority decision."],["Are crew using a prohibited bypass, altered settings or fabricated records?","YES → stop, preserve evidence, escalate; do not conceal."],["Is closure independently verified, records reconciled, crew capable?","NO → stays OPEN. YES → document closure and readiness."],["Has a regulatory control or detention been imposed?","YES → comply with the written direction; do not sail until released."]],"cases":[["Fire doors","Three doors wedged open; two fail to latch; crew: 'we close them for inspection'.","[A] Remove wedges, restore closers/latches, test all zones, find why it was tolerated, log, prevent recurrence. Fire/ISM and culture."],["OWS sample line","OCM receives little water while overboard position remains available.","[A] Prohibit discharge, inspect line and fail-safe, repair, retest in recirculation, notify as required. MARPOL I / ISM; AMSA focus."],["BWMS in US port","UV sensor fails during cargo ops; crew plans exchange and later discharge in port.","[A] Stop prohibited discharge, verify legal method, notify COTP, get port instruction. 33 CFR 151 — exchange alone is no substitute."],["Certificate extension","3-month extension, but the ship keeps trading between unrelated load ports.","[A] Question validity, contact Flag/RO at once, verify voyage-to-survey conditions. AMSA MN 2026/01."],["ECDIS XTD","OOW sets 0.5 NM XTD in a narrow passage next to a submerged danger, no UKC rationale.","[A] Reassess leg limits and route before transit; Master approval; OOW competence retest. SOLAS V."]],"itin":[["0–30 min","Master briefing","Crew and voyage particulars; defect register; Class/Flag/port open items; recent PSC reports; stop-work orders."],["30–90 min","Bridge and upper decks","ECDIS XTD/ENC, pilot ladder, nav lights, VDR, fire stations, hatch covers, mooring brakes/marking."],["90–150 min","Safety & accommodation","Fire doors and escapes, alarm points, LSA, muster, emergency stations, MLC water/food/rest."],["150–240 min","Machinery & pollution","Emergency generator + steering tests, fire pump, hot surfaces, OWS sample/15 ppm, BWMS and valves."],["240–300 min","Cargo and records","Hatch/hold condition, CSM, VGM/lashing, loading computer, ORB/BWRB, PMS, permits."],["300–360 min","Unscripted crew test","Independent interviews, firefighting tabletop, look-back at defects."],["Last 45 min","Close-out meeting","Grade every failure, owner, deadline, authority contact, no-go restrictions, spares/service actions."]],"nogo":["All statutory certificates and extensions legitimately valid for this voyage?","Flag, RO and authorities informed of defects that must be reported?","Fire main, fixed FFA, detection and essential fire boundaries function?","Required lifeboat/rescue arrangements can be used safely?","Emergency power, steering and critical machinery protection function?","Next route safe on corrected charts and suitably set ECDIS?","No unlawful or manipulative OWS/OCM/bypass arrangement?","Ballast can be handled and discharged lawfully at every intended location?","Hull, weathertight integrity and hatch closures safe for the voyage?","Cargo stow/segregation/securing complies with approved plans?","Crew can execute duties at fire, flooding, blackout and abandonment?","Manning, rest and basic living/medical conditions actually compliant?","Pilot ladder and mooring systems safe for intended operations?","All critical defects physically closed or under authorised restrictions?","Master can truthfully explain every open item and the departure decision?"],"ethic":"Find the defect before the State does. Stop the unsafe operation. Tell the truth. Repair it. Prove it. Learn from it.","src":[["R01","IMO Res. A.1206(34) — Procedures for PSC 2025","https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/AssemblyDocuments/A.1206%2834%29.pdf"],["R02","Paris MoU Annual Report 2025","https://parismou.org/year-report/year-report-2025/"],["R03","Paris MoU — ship selection and inspection scheme","https://parismou.org/inspection-regime/"],["R06","Joint CIC cargo securing 2026 — questionnaire","https://parismou.org/download/press-release-cic-cargo-securing-2026-including-questionnaire/"],["R07","Tokyo MOU Annual Report 2025","https://www.tokyo-mou.org/wp/wp-content/uploads/ANN25.pdf"],["R08","Tokyo MOU — New Inspection Regime","https://www.tokyo-mou.org/inspections-detentions/nir/"],["R10","Tokyo MOU Safety Bulletin 02/2025 — pilot transfer","https://www.tokyo-mou.org/safety-bulletin/2025/08/25/safety-bulletin-02-25-proper-maintenance-and-rigging-of-pilot-transfer-arrangements/"],["R11","AMSA Inspections Report 2025","https://www.amsa.gov.au/vessels-operators/port-state-control/port-state-control-annual-reports/inspections-report-2025"],["R13","AMSA — during a PSC inspection","https://www.amsa.gov.au/vessels-operators/port-state-control/during-port-state-control-inspection"],["R14","AMSA — after a PSC inspection","https://www.amsa.gov.au/vessels-operators/port-state-control/after-port-state-control-inspection"],["R15","AMSA MN 2025/06 — oil filtering equipment tests","https://www.amsa.gov.au/about/regulation-standards/202506-testing-and-inspection-oil-filtering-equipment-mepc10749"],["R16","AMSA MN 2026/01 — invalid certificate extensions","https://www.amsa.gov.au/about/regulations-and-standards/marine-notices/202601-invalid-extensions-statutory-certification-0"],["R17","AMSA MLC Annual Report 2025","https://www.amsa.gov.au/vessels-operators/seafarer-welfare/maritime-labour-convention-annual-reports/mlc-2025"],["R19","USCG PSC Annual Report 2025","https://www.dco.uscg.mil/Portals/9/DCO%20Documents/5p/CG-5PC/CG-CVC/CVC2/psc/AnnualReports/Annualrpt2025.pdf"],["R23","USCG — NOAD, 33 CFR 160","https://www.dco.uscg.mil/Our-Organization/Assistant-Commandant-for-Prevention-Policy-CG-5P/Inspections-Compliance-CG-5PC-/Commercial-Vessel-Compliance/Foreign-Offshore-Compliance-Division/Port-State-Control/NOAD/"],["R24","USCG — ballast water FAQs (rev. 18 Nov 2025)","https://www.dco.uscg.mil/Our-Organization/Assistant-Commandant-for-Prevention-Policy-CG-5P/Commercial-Regulations-Standards-CG-5PS/Office-of-Operating-and-Environmental-Standards-CG-OES/Environmental-Standards/FAQ/"],["R26","DAFF — Australian ballast water requirements","https://www.agriculture.gov.au/biosecurity/avm/vessels/marine-pest-biosecurity/ballast"],["R27","EPA — VIDA implementation","https://www.epa.gov/vessels-marinas-and-ports/vessel-incidental-discharge-act-vida"],["R29","IMO — pilotage / SOLAS V/23 2028","https://www.imo.org/en/ourwork/safety/pages/pilotage.aspx"],["R30","IMO — current and upcoming amendments","https://www.imo.org/en/about/conventions/pages/amendments-to-imo-instruments.aspx"]]},"ca":{"t":"Zero Deficiency Canada — PSC Walk-Round Guide","v":"Rev.0 · 03 Nov 2026 · by Capt. George Barbaris · Vancouver · Quebec · St. Lawrence","rule":["Tick it — fix it — prove it. Anything you cannot fix on board: report to the office before arrival with a photo. A defect already reported with a repair plan is treated far better than one the PSCO finds hidden.","Tsek — ayusin — patunayan. Kung hindi maaayos sa barko: i-report sa office bago dumating, may litrato. Mas maganda ang trato sa sirang naka-report na may repair plan kaysa sa itinago na makikita ng PSCO."],"rounds":[["1 · Full walk-round","14 days before Canada","Master gives sections to HoDs","Every line checked; defect list + photos to office"],["2 · Re-check","5 days before arrival","Master + C/E","Open items + all ★ lines; drills done"],["3 · Golden hour","Arrival day, before PSC","C/O + 2/E + Bosun","Gangway, pilot ladder, fire doors, ER bilges, escapes, accommodation, certificate file"]],"see":"Canada rules, whale zones, ballast, winter navigation and the real 2025 Canadian detentions are in 🛂 PSC → 🇨🇦 Canada.","flags":"★ detention risk — must be 100% · CA Canada hotspot (Canadian rule or real 2025 Canadian deficiency) · ◆ ship-specific open item (from your private ship pack)","pre":[["Office","Download and review the ship's last PSC reports (especially any detention) — confirm every item closed; the PSCO sees the history."],["Office","Close out the last RightShip report with before/after photos; send evidence before arrival."],["Office","Close any class/flag dispensations in writing (e.g. rescue boat engine, VDR repairs)."],["Office","Crew contracts correct (right shipowner name, current class)."],["Office","Exemption certificates valid for the voyage; cargo on the annex list."],["Office","Crew reliefs: nobody over 11 months on board at arrival in Canada."],["Office/Agent","Canadian charts & publications list, ballast water report, pre-arrival notifications, garbage contractor, grain 'Readiness to Load' request to Transport Canada."],["Office/Agent","Quebec/St. Lawrence Dec–Mar: confirm winter sea-water cooling compliance with Transport Canada (winternav@tc.gc.ca) and winter pilotage requirements."],["Ship","Walk-round 14 days before arrival → defect list + photos to office; repeat 5 days before; golden-hour round on arrival day."],["Ship","Drills from the drill list done and recorded before arrival."]],"sec":[{"k":"A","t":["First impression — gangway, hull, overside","Unang tingin — gangway, hull, overside"],"lead":"C/O · Bosun · Duty AB","why":["The PSCO decides in the first 5 minutes whether this is a 'quick' or an 'expanded' inspection. Rust streaks, a sloppy gangway and no watchman = clear grounds to dig deeper.","Sa unang 5 minuto nagpapasya ang PSCO kung mabilis o expanded ang inspection. Kalawang, magulong gangway at walang bantay = dahilan para maghukay pa."],"i":[["A1","★","Gangway / accommodation ladder","Safety net rigged full length, stanchions & handrails tight, steps not bent, lit at night, lifebuoy with line at the head.","C/O","4.35","Gangway / accommodation ladder","Safety net buong haba, mahigpit ang stanchion at handrail, hindi baluktot ang baitang, may ilaw sa gabi, lifebuoy na may lubid sa itaas."],["A2","","Gangway watch & ISPS","AB on watch with visitor log, ID check, ISPS level sign, ship particulars & 'No smoking' signs at the gangway.","C/O","12.1","Gangway watch at ISPS","May AB na bantay, visitor log, ID check, ISPS level sign, ship particulars at 'No smoking' sa gangway."],["A3","","Draft marks, load line, IMO no.","Freshly painted and readable both sides; IMO number marking visible (SOLAS XI-1/3). Plimsoll mark clear.","Bosun","14.2","Draft marks, load line, IMO no.","Bagong pintura at nababasa sa magkabilang side; kita ang IMO number (SOLAS XI-1/3). Malinaw ang Plimsoll mark."],["A4","CA","Hull & anti-fouling","No oil sheen, no garbage overside, no peeling anti-fouling. In Quebec 2025 a ship was detained after aerial photos showed AF paint peeling into the St. Lawrence.","C/O","14.1","Hull at anti-fouling","Walang oil sheen, walang basura sa tabi, walang natutuklap na anti-fouling. Sa Quebec 2025, na-detain ang barko dahil sa litrato mula sa ere ng natutuklap na AF paint."],["A5","","Overboard discharges","No leaking overboard valves; scuppers plugged during bunkering; save-alls/drip trays empty.","C/E","7A.1","Overboard discharges","Walang tagas sa overboard valve; nakasaksak ang scupper habang bunkering; walang laman ang save-all/drip tray."]]},{"k":"B","t":["Pilot transfer arrangements","Pilot transfer arrangements"],"lead":"C/O · Duty Officer · Bosun","why":["Canadian pilots (Pacific and Laurentian Pilotage Authorities) report defective pilot ladders straight to Transport Canada. A bad ladder = PSC on board before the pilot reaches the bridge.","Ang mga pilot sa Canada ay nagre-report agad sa Transport Canada ng sirang pilot ladder. Masamang ladder = PSC sa barko bago pa makarating ang pilot sa bridge."],"i":[["B1","★ CA","Pilot ladder certificate & condition","Ladder certificate/ID on board, side ropes not worn, steps not cracked/loose, spreaders correct, no knots, shackles or splices, replacement record in log.","C/O","4.37","Certificate at kondisyon ng pilot ladder","May certificate/ID, hindi gasgas ang side rope, walang basag/maluwag na baitang, tama ang spreader, walang buhol, shackle o splice, may record ng palit."],["B2","★ CA","Securing","Secured to strong points / securing points — never to handrails or stanchions. Steps rest firmly against the hull.","Bosun","4.37","Securing","Nakatali sa strong point — hindi sa handrail o stanchion. Nakadikit nang mahigpit ang baitang sa hull."],["B3","★ CA","Height & combination rig","Rigged at the height the pilot asks for. If combination: accommodation ladder max 45°, pilot ladder 1.5 m above the platform and secured to ship's side.","C/O","4.37","Taas at combination rig","Sa taas na hinihingi ng pilot. Kung combination: accommodation ladder max 45°, pilot ladder 1.5 m sa itaas ng platform at nakatali sa gilid ng barko."],["B4","CA","Deck entry & equipment","Handhold stanchions/bulwark ladder OK, lighting, lifebuoy with self-igniting light, heaving line, officer with radio attending, man-ropes if requested.","Duty Off.","4.37","Deck entry at gamit","OK ang handhold stanchion/bulwark ladder, may ilaw, lifebuoy na may self-igniting light, heaving line, officer na may radyo, man-rope kung hihingin."],["B5","","Minimum PPE for pilot-ladder crew","Helmet, lifejacket/work vest, gloves, safety shoes — company list posted at pilot station.","C/O","4.11","PPE ng crew sa pilot ladder","Helmet, lifejacket/work vest, guwantes, safety shoes — nakapaskil ang listahan sa pilot station."]]},{"k":"C","t":["Bridge & navigation","Bridge at navigation"],"lead":"Master · 2/O · 3/O","why":["Vancouver, July 2025: a ship was detained because the OOW did not know the ECDIS, echo sounder, gyro and Inmarsat. Familiarity is inspected, not only the equipment.","Vancouver, Hulyo 2025: na-detain ang barko dahil hindi alam ng OOW ang ECDIS, echo sounder, gyro at Inmarsat. Sinusuri ang kaalaman, hindi lang ang gamit."],"i":[["C1","★ CA","ECDIS — people","Type-specific ECDIS training for Master and all OOWs. Each OOW can show: safety contour/depth, alarms, route check, ENC update status, chart permits.","Master","2.14","ECDIS — tao","Type-specific ECDIS training ng Master at lahat ng OOW. Kayang ipakita ng OOW: safety contour/depth, alarm, route check, ENC update, chart permit."],["C2","★ CA","Charts & publications","ENCs/charts updated for Canadian waters; Canadian Notices to Mariners (Annual + monthly), Sailing Directions, Radio Aids to Marine Navigation, Canadian Tide & Current Tables, List of Lights. Ask agent for the Canadian charts/pubs list.","2/O","3.16","Charts at publications","Updated ang ENC/chart para sa Canada; Canadian Notices to Mariners (Annual + monthly), Sailing Directions, Radio Aids, Canadian Tide & Current Tables, List of Lights. Humingi ng listahan sa agent."],["C3","CA","Passage plan berth-to-berth","Includes pilot boarding, MCTS reporting points, ECA boundary/fuel changeover point, UKC, whale zones (NARW Gulf of St. Lawrence / ECHO Haro Strait), NAVWARNs.","2/O","3.23","Passage plan berth-to-berth","Kasama ang pilot boarding, MCTS reporting points, ECA boundary/changeover point, UKC, whale zones (NARW / ECHO Haro Strait), NAVWARN."],["C4","★","Radars, gyro, compass, echo sounder","Both radars + ARPA working; gyro & magnetic compass errors recorded each watch; deviation card current; echo sounder recording.","2/O","3.10","Radar, gyro, compass, echo sounder","Gumagana ang 2 radar + ARPA; naka-record ang gyro at compass error bawat watch; updated ang deviation card; nagre-record ang echo sounder."],["C5","CA","AIS data correct","Draught, destination, nav status updated. Transport Canada checks speed limits from AIS and asks the Master for an explanation.","OOW","11.8","Tamang AIS data","Updated ang draught, destination, nav status. Sinusuri ng Transport Canada ang bilis mula sa AIS at magtatanong sa Master."],["C6","","VDR","Annual Performance Test certificate valid; any earlier repair/dispensation formally closed with class/flag.","2/O","3.15","VDR","Valid ang Annual Performance Test certificate; sarado nang pormal sa class/flag ang dating repair/dispensation."],["C7","","BNWAS","Switched on at sea, not by-passed, tested.","OOW","3.12","BNWAS","Naka-on sa dagat, walang bypass, na-test."],["C8","","Navigation lights & signals","All lights burn with correct coloured globes (no white globes painted red/green), spare bulbs, shapes, daylight signal lamp, whistle.","3/O","3.11","Navigation lights at signals","Gumagana lahat ng ilaw na may tamang kulay (bawal ang puting bombilya na pininturahan), may spare, shapes, daylight signal lamp, whistle."],["C9","★","GMDSS","Daily/weekly/monthly tests logged; battery load test; NAVTEX; EPIRB annual test + shore-based maintenance certificate; SARTs; portable VHF primary batteries in date; GOC endorsements for all.","2/O","11.2","GMDSS","Naka-log ang daily/weekly/monthly test; battery load test; NAVTEX; EPIRB annual test + shore-based maintenance; SART; valid ang primary battery ng portable VHF; GOC endorsement ng lahat."],["C10","","LRIT & SSAS","LRIT conformance test report on board; SSAS tested and recorded.","Master","12.3","LRIT at SSAS","May LRIT conformance test report; na-test at naka-record ang SSAS."],["C11","","Steering gear tests","Pre-departure tests logged (12 h before sailing); emergency steering drill every 3 months logged.","2/O","13.40","Steering gear tests","Naka-log ang pre-departure test (12 h bago umalis); emergency steering drill kada 3 buwan."],["C12","CA","Winter visibility (Quebec Dec–Mar)","Clear-view screens/wipers/window heating working; bridge heating; searchlights ready.","Master","3.10","Winter visibility (Quebec Dis–Mar)","Gumagana ang clear-view screen/wiper/window heating; bridge heating; handa ang searchlight."]]},{"k":"D","t":["Certificates & documents","Certificates at dokumento"],"lead":"Master","why":["Wrong or old certificates are the quickest way to a deficiency. After a class change, the old certificates must leave the file.","Mali o lumang certificate ang pinakamabilis na deficiency. Pagkatapos magpalit ng class, alisin ang lumang certificate sa file."],"i":[["D1","★","Current certificate set filed","Originals of the current class/statutory set in the certificate file; old (superseded) certificates removed and archived so nobody shows the wrong one.","Master","2.1","Kasalukuyang certificate set","Orihinal ng kasalukuyang set sa file; alisin at i-archive ang luma para walang magpakita ng mali."],["D2","","Exemption certificates + annex","Any SOLAS exemption (e.g. II-2/10.7.1.3 no fixed gas in holds) with its cargo-list annex on board; cargo must be on the list; validity checked.","Master","2.1","Exemption certificate + annex","May SOLAS exemption (hal. II-2/10.7.1.3) kasama ang cargo-list annex; dapat nasa listahan ang cargo; valid."],["D3","★","Continuous Synopsis Record","CSR updated for any class/DOC/owner change. PSCOs compare it with the certificates.","Master","2.1","Continuous Synopsis Record","Updated ang CSR sa anumang palit ng class/DOC/owner. Ikukumpara ito ng PSCO sa certificates."],["D4","★","ISM / ISPS / MLC","DOC copy + SMC, ISSC + SSP, MLC certificate + DMLC Part I & II. Dates and names match.","Master","4.1","ISM / ISPS / MLC","DOC copy + SMC, ISSC + SSP, MLC certificate + DMLC I at II. Tugma ang petsa at pangalan."],["D5","★","Minimum Safe Manning","Crew list matches the Safe Manning Document in number and rank.","Master","2.4","Minimum Safe Manning","Tugma ang crew list sa Safe Manning Document sa bilang at rank."],["D6","★","Crew certificates","CoCs + flag endorsements, medicals, STCW basic/advanced courses, ratings' watchkeeping certificates — check every expiry before arrival.","Master","2.13","Crew certificates","CoC + flag endorsement, medical, STCW courses, watchkeeping certificate ng ratings — suriin ang expiry bago dumating."],["D7","CA","Grain papers","Document of Authorization for grain + grain loading booklet; loading manual; loading instrument annual test record.","C/O","8B.4","Grain papers","Document of Authorization + grain loading booklet; loading manual; annual test ng loading instrument."],["D8","","Cargo Securing Manual","Approved CSM on board. CIC on Cargo Securing runs until 30/11/2026 — the questionnaire may be asked.","C/O","8A.10","Cargo Securing Manual","Approved CSM sa barko. CIC Cargo Securing hanggang 30/11/2026 — maaaring itanong."],["D9","★","Record books","Oil Record Book Part I, Garbage Record Book, Ballast Water Record Book, ODS record book, fuel changeover log — entries complete and signed.","C/E · C/O","5.1","Record books","ORB Part I, GRB, BWRB, ODS record book, fuel changeover log — kumpleto at pirmado."],["D10","","MARPOL Annex VI file","IAPP + Record of Construction, EIAPP & NOx Technical Files for all engines, IEE, SEEMP Part III, DCS Statement of Compliance and CII rating.","C/E","5.21","MARPOL Annex VI file","IAPP + Record of Construction, EIAPP at NOx Technical File ng lahat ng makina, IEE, SEEMP III, DCS SoC at CII rating."],["D11","CA","BWM documents","Ballast Water Management Certificate (D-2), approved BWM Plan, BWMS type approval certificate.","C/E","5.10","BWM documents","BWM Certificate (D-2), approved BWM Plan, type approval certificate ng BWMS."],["D12","","SOPEP & garbage plan","Approved SOPEP with updated contact list (Canadian authorities via agent); Garbage Management Plan; placards posted.","C/O","5.2","SOPEP at garbage plan","Approved SOPEP na updated ang contact (Canadian authorities sa agent); Garbage Management Plan; may placard."],["D13","","Insurance certificates","P&I, Bunker Convention and Wreck Removal certificates on board and valid.","Master","2.2","Insurance certificates","Valid na P&I, Bunker Convention at Wreck Removal certificate sa barko."],["D14","","Lifting appliances","Certificate of Test & Thorough Examination (provision, ER and bunker cranes) + Register of Lifting Appliances.","C/O","9A.17","Lifting appliances","Certificate of Test & Thorough Examination (provision, ER, bunker crane) + Register of Lifting Appliances."],["D15","★","Previous PSC reports","Last PSC reports on board — every item closed with evidence and flag/class close-out.","Master","4.3","Mga dating PSC report","Nasa barko ang huling PSC report — sarado lahat na may ebidensya at close-out ng flag/class."],["D16","★","Service certificates","Liferafts & HRUs, fire extinguishers, CO2 system, BA compressor air quality (3-monthly), EEBDs, lifeboat & rescue boat on-load release gear (annual / 5-yearly).","Master","4.18","Service certificates","Liferaft at HRU, extinguisher, CO2, BA compressor air quality (3 buwan), EEBD, on-load release gear (taunan / 5 taon)."],["D17","","Ship Sanitation Certificate & medical chest","SSCEC valid (6 months); medicine chest inspected and certificate valid.","Master","15.6","Ship Sanitation Certificate at medical chest","Valid ang SSCEC (6 buwan); na-inspect ang medicine chest at valid ang certificate."],["D18","★","Muster list & drill records","Muster list shows the present crew; drills, training and new-joiner familiarisation recorded.","Master","4.9","Muster list at drill records","Kasalukuyang crew ang nasa muster list; naka-record ang drill, training at familiarisation."]]},{"k":"E","t":["Crew, MLC & living conditions","Crew, MLC at kondisyon ng tirahan"],"lead":"Master · C/O · C/E · Cook","why":["Canadian PSCOs ask who has been on board more than 11 months. Crew complaints go straight to Transport Canada.","Tinatanong ng Canadian PSCO kung sino ang lampas 11 buwan sa barko. Diretso sa Transport Canada ang reklamo ng crew."],"i":[["E1","★","Seafarer Employment Agreements","Signed, valid, correct shipowner name on every SEA (also on extensions); no old class/company details.","Master","15.1","Seafarer Employment Agreements","Pirmado, valid, tamang pangalan ng shipowner sa bawat SEA (pati extension); walang lumang detalye."],["E2","★ CA","Time on board","Nobody over 11 months on board on arrival in Canada (MLC). Arrange reliefs in time with the office.","Master","15.1","Tagal sa barko","Walang lampas 11 buwan sa barko pagdating sa Canada (MLC). Ayusin ang relief kasama ang office."],["E3","","Wages & complaints","Wage accounts/pay slips available; on-board complaint procedure posted with contacts; CBA copy on board.","Master","15.1","Sahod at reklamo","May wage account/pay slip; nakapaskil ang complaint procedure at contact; may kopya ng CBA."],["E4","★","Hours of rest","Records complete and true; match the log book, drills and cargo times.","Master","2.5","Hours of rest","Kumpleto at totoo; tugma sa log book, drill at oras ng cargo."],["E5","","Potable water","UV sterilizer working; water analysis and tank cleaning recorded.","C/E","15.5","Inuming tubig","Gumagana ang UV sterilizer; naka-record ang water analysis at tank cleaning."],["E6","","Galley & provisions","Clean, cold rooms with temperature log, food enough for the voyage, Master's weekly inspection records.","Cook · Master","15.5","Galley at provisions","Malinis, may temperature log ang cold room, sapat ang pagkain, may weekly inspection ng Master."],["E7","CA","Washrooms & hospital","All faucets, showers, toilets and drains working (Quebec 2025 detention included broken faucets and hospital shower). Hospital clean, not used as store.","C/O","14.18","Banyo at hospital","Gumagana lahat ng gripo, shower, toilet at drain (Quebec 2025: sirang gripo at hospital shower). Malinis ang hospital, hindi bodega."],["E8","","Accommodation","Cabins clean, AC/heating working, no extension cords or private heaters, laundry working.","C/O","15.2","Accommodation","Malinis ang cabin, gumagana ang AC/heater, walang extension cord o sariling heater, gumagana ang laundry."],["E9","","PPE & D&A","PPE issued and recorded; Drug & Alcohol policy and test records.","Master","2.9","PPE at D&A","Naka-record ang PPE; may Drug & Alcohol policy at test record."]]},{"k":"F","t":["Fire safety","Fire safety"],"lead":"C/O (deck) · C/E (ER) · 3/O","why":["Fire safety is the No.1 detainable area worldwide (ClassNK 2025: 426). Fire doors, dampers, emergency fire pump and crew knowledge are always tested.","Fire safety ang #1 detainable sa mundo (ClassNK 2025: 426). Laging sinusuri ang fire door, damper, emergency fire pump at kaalaman ng crew."],"i":[["F1","★ CA","Fire doors","Every fire door closes and latches by itself. No hooks, wedges or ropes holding them open (Quebec 2025 detention).","C/O","14.5","Fire doors","Kusang sumasara at nagla-latch ang bawat fire door. Walang hook, kalang o lubid (Quebec 2025 detention)."],["F2","★","Fire dampers & vent closures","All operate freely, open/close marked, no holes from corrosion, gaskets OK, not blocked by stores.","C/O · C/E","4.33","Fire dampers at vent closures","Malayang gumagalaw, may marka open/close, walang butas, OK ang gasket, hindi harang ng gamit."],["F3","★","Emergency fire pump","Starts and gives good pressure at two hydrants on deck quickly; suction/priming OK; start instructions posted.","C/E","4.28","Emergency fire pump","Umaandar at may magandang pressure sa 2 hydrant agad; OK ang suction/priming; may instructions."],["F4","★","Main fire pumps & fire main","Pressure gauges working, isolation valve operates, no leaking pipes or hydrants.","C/E","4.24","Main fire pump at fire main","Gumagana ang gauge, ang isolation valve, walang tagas sa tubo o hydrant."],["F5","","Hydrants, hoses, nozzles","Boxes complete: hose, dual-purpose nozzle, spanner; couplings fit; no leaks.","3/O","4.24","Hydrant, hose, nozzle","Kumpleto: hose, dual-purpose nozzle, spanner; tugma ang coupling; walang tagas."],["F6","★","Fire detection panel","No faults/disabled loops; detector test log up to date.","3/O · Electr.","4.26","Fire detection panel","Walang fault/disabled loop; updated ang test log ng detector."],["F7","★ CA","Fixed CO2 (ER)","Cylinder weights recorded, release alarm works, operating instructions posted — and officers can explain the release sequence (Vancouver 2025: 3/O did not know CO2 operation).","C/E","4.27","Fixed CO2 (ER)","Naka-record ang timbang, gumagana ang release alarm, may instructions — at kayang ipaliwanag ng officers ang release (Vancouver 2025: hindi alam ng 3/O)."],["F8","★ CA","Paint store","Fixed system complete and piping not wasted (Quebec 2025 detention: perforated sprinkler line).","C/O","14.12","Paint store","Kumpleto ang fixed system at walang butas ang tubo (Quebec 2025: butas na sprinkler line)."],["F9","★","Firemen's outfits","Complete sets to the current standard (EN 469:2020 Level 2, SOLAS/MED).","3/O","4.30","Firemen's outfit","Kumpletong set ayon sa kasalukuyang standard (EN 469:2020 Level 2, SOLAS/MED)."],["F10","★ CA","SCBA & EEBD","Cylinders full, spares charged; crew can don SCBA and check pressure & low-pressure whistle (Vancouver 2025). EEBD number as per fire plan.","3/O","4.32","SCBA at EEBD","Puno ang cylinder at spare; kayang isuot ng crew ang SCBA at suriin ang pressure at whistle (Vancouver 2025). EEBD ayon sa fire plan."],["F11","","Portable extinguishers","In place as per fire plan, charged, service labels in date, brackets OK.","3/O","4.29","Portable extinguishers","Nasa lugar ayon sa fire plan, may karga, valid ang label, OK ang bracket."],["F12","★","Quick-closing valves & remote stops","QCVs close from remote, air reservoir charged. Emergency generator tank QCV directly on the tank (no spool piece). Fan/pump remote stops tested.","C/E","7A.10","QCV at remote stops","Sumasara ang QCV mula remote, may hangin ang reservoir. QCV ng em'cy gen tank direkta sa tangke (walang spool piece). Na-test ang remote stop."],["F13","","Local water mist (DGs)","Section valves correct and system tested.","C/E","4.27","Local water mist (DG)","Tama ang section valves at na-test ang system."],["F14","","Galley fire safety","Hood and duct clean (no grease), fire blanket, extinguisher, damper working.","Cook","14.15","Fire safety sa galley","Malinis ang hood at duct (walang grasa), may fire blanket, extinguisher, gumagana ang damper."],["F15","","Fire control plan","Matches equipment on board; copy in weathertight box outside accommodation; International Shore Connection available.","3/O","4.25","Fire control plan","Tugma sa gamit; may kopya sa weathertight box sa labas; may International Shore Connection."],["F16","★ CA","Escape routes","Free, unlocked from inside, signs and emergency lighting working (Vancouver 2025 detention: ER escape locked).","C/O · C/E","13.15","Escape routes","Malaya, bukas mula sa loob, gumagana ang signs at emergency light (Vancouver 2025: naka-lock ang ER escape)."]]},{"k":"G","t":["Life-saving appliances","Life-saving appliances"],"lead":"3/O · 2/E · Bosun","why":["LSA is the No.2 detainable area. In Canada lifeboat engines and davits are run in front of the PSCO (Quebec 2025: both boat engines failed + davit cradle stuck).","LSA ang #2 detainable. Sa Canada, pinapaandar ang lifeboat engine at davit sa harap ng PSCO (Quebec 2025: parehong makina bigo + stuck ang cradle)."],"i":[["G1","★ CA","Lifeboat engine(s)","Start cold, ahead/astern, fuel full, batteries charged. Run weekly and log.","2/E","4.18","Lifeboat engine","Umaandar nang malamig, ahead/astern, puno ang fuel, may karga ang battery. Patakbuhin lingguhan at i-log."],["G2","★ CA","Davits & winches","Brakes, limit switches, no hydraulic leaks, swing-out under reserve power, cradles not stuck.","3/O · 2/E","4.18","Davit at winch","Brake, limit switch, walang hydraulic leak, nakaka-swing-out sa reserve power, hindi stuck ang cradle."],["G3","★","On-load release gear","Hooks fully reset, indicators in 'closed' position, annual / 5-yearly service certificates on board.","3/O","4.18","On-load release gear","Buo ang reset ng hook, 'closed' ang indicator, may annual / 5-taon na service certificate."],["G4","★","Lifeboat equipment","Inventory complete and in date (water, rations, pyros, first aid), windows intact, bilge pump, lights.","3/O","4.18","Gamit sa lifeboat","Kumpleto at valid (tubig, rasyon, pyro, first aid), buo ang bintana, bilge pump, ilaw."],["G5","★","Rescue boat","Engine starts, equipment complete, davit controls tested; any dispensation closed.","3/O · 2/E","4.18","Rescue boat","Umaandar ang makina, kumpleto ang gamit, na-test ang davit control; sarado ang dispensation."],["G6","★","Liferafts & HRUs","Service and HRU dates valid, painter with weak link correctly fixed, embarkation ladders OK.","3/O","4.19","Liferaft at HRU","Valid ang service at HRU, tama ang painter at weak link, OK ang embarkation ladder."],["G7","","Lifebuoys","Number as per plan, self-igniting lights & smoke signals in date, retro tape, ship's name.","3/O","4.42","Lifebuoys","Bilang ayon sa plan, valid ang light at smoke signal, may retro tape at pangalan ng barko."],["G8","","Lifejackets & immersion suits","Correct number, lights/whistles OK, suits air-tested; stowage marked.","3/O","4.20","Lifejacket at immersion suit","Tamang bilang, OK ang ilaw/whistle, na-air-test ang suit; may marka ang lalagyan."],["G9","","Line-throwing & pyrotechnics","In date, stowed correctly.","3/O","4.42","Line-throwing at pyrotechnics","Valid at tama ang lalagyan."],["G10","CA","Embarkation ladders & muster stations","Ladders maintained (Quebec 2025 deficiency); muster/embarkation stations lit, IMO signs, instructions posted.","Bosun","4.18","Embarkation ladder at muster station","Maayos ang ladder (Quebec 2025); may ilaw ang muster/embarkation station, IMO signs, instructions."],["G11","","Training manual & LSA instructions","Training manual in mess rooms and recreation room; maintenance instructions available.","3/O","4.38","Training manual at LSA instructions","Training manual sa mess at recreation room; may maintenance instructions."]]},{"k":"H","t":["Main deck, hatch covers, holds & load line","Main deck, hatch cover, holds at load line"],"lead":"C/O · Bosun · Fitter","why":["Weathertightness is a 'structure' item: holed air pipes, missing manhole bolts or wasted hatch coamings lead straight to detention (Quebec area 2025: No.4 hatch coaming perforated).","Ang weathertightness ay 'structure': butas na air pipe, kulang na bolt ng manhole o kinakalawang na coaming = detention (Quebec 2025: butas ang No.4 coaming)."],"i":[["H1","★","Hatch cover tightness","Rubber packing, compression bars, cleats, drain channels & non-return valves OK; chalk/ultrasonic test record.","C/O","9A.3","Higpit ng hatch cover","OK ang rubber packing, compression bar, cleat, drain channel at non-return valve; may chalk/ultrasonic test record."],["H2","★ CA","Hatch cover hydraulics","No hydraulic oil leaks on cylinders, hoses, valves (Vancouver 2025 detention). Clean any old oil on deck.","Fitter","9A.13","Hydraulics ng hatch cover","Walang tagas ng hydraulic oil sa cylinder, hose, valve (Vancouver 2025). Linisin ang lumang langis sa deck."],["H3","★ CA","Hatch coamings & stays","No wastage, holes or cracks; coaming brackets complete.","C/O","9A.7","Hatch coaming at stay","Walang kalawang, butas o bitak; kumpleto ang bracket."],["H4","★","Air pipe heads","Floats/flaps free, gaskets OK, heads not holed, marked with tank name.","Bosun","14.6","Air pipe heads","Malaya ang float/flap, OK ang gasket, walang butas, may pangalan ng tangke."],["H5","","Sounding pipes","Caps in place, chained, threads OK.","Bosun","13.24","Sounding pipes","Nasa lugar ang takip, may kadena, OK ang thread."],["H6","★","Ventilators & weathertight doors","Closing devices work, dogs and gaskets OK, marked open/closed.","Bosun","14.5","Ventilator at weathertight door","Gumagana ang closing device, OK ang dogs at gasket, may marka open/closed."],["H7","★","Manholes","All bolts fitted on fuel/ballast manholes (check after any yard work).","Fitter","5.26","Manholes","Kumpleto ang bolt sa fuel/ballast manhole (suriin pagkatapos ng yard)."],["H8","★ CA","Water ingress alarms","Each hold alarm and pre-alarm tested and recorded; no active alarms; sensors clean (after blasting/cleaning).","C/O · Electr.","4.14","Water ingress alarms","Na-test at naka-record ang alarm at pre-alarm ng bawat hold; walang aktibong alarm; malinis ang sensor."],["H9","CA","Holds — grain clean","Grit/abrasive swept out, no loose scale or flaking paint, bilge wells clean, burlap ready. Grain loading needs Transport Canada 'Readiness to Load' and CFIA hold inspection.","C/O","8B.10","Holds — grain clean","Walang grit/abrasive, walang maluwag na kalawang o natutuklap na pintura, malinis ang bilge well, handa ang burlap. Kailangan ng TC 'Readiness to Load' at CFIA inspection."],["H10","","Hold access","Ladders, platforms, manhole covers intact and secured.","Bosun","6.4","Daanan sa hold","Buo at secured ang ladder, platform at manhole cover."],["H11","","Deck fittings & electrics","Junction boxes closed, cables and pipes on brackets, deck lights watertight (earth faults often come from deck lights after washing).","Electr.","14.11","Deck fittings at electrics","Sarado ang junction box, nasa bracket ang kable at tubo, watertight ang deck light (madalas ang earth fault mula sa ilaw pagkatapos maghugas)."],["H12","","Railings, walkways, mast","Rails and guard chains complete (monkey island), mast stays and wire terminations secured.","Bosun","14.19","Railings, walkways, mast","Kumpleto ang rail at guard chain (monkey island), secured ang mast stay at wire termination."],["H13","CA","Emergency towing","Emergency towing procedure on board and equipment location known (Vancouver 2025: equipment not found).","C/O","10.22","Emergency towing","May emergency towing procedure at alam kung nasaan ang gamit (Vancouver 2025: hindi nakita)."],["H14","","SOPEP locker & bunker station","Spill kit complete, scupper plugs, drip trays clean and dry.","C/O","7A.1","SOPEP locker at bunker station","Kumpleto ang spill kit, scupper plug, malinis at tuyo ang drip tray."]]},{"k":"I","t":["Forecastle & mooring","Forecastle at mooring"],"lead":"Bosun · C/O","why":["Since 2024 SOLAS II-1/3-8 requires a Mooring System Management Plan and documented inspection of lines and equipment.","Mula 2024, kailangan ng SOLAS II-1/3-8 ang Mooring System Management Plan at naka-dokumentong inspection ng lines at gamit."],"i":[["I1","","Windlass & winches","Brakes in order, brake test records (company form), no oil leaks, guards in place.","Bosun","10.5","Windlass at winch","Maayos ang brake, may brake test record, walang tagas, may guard."],["I2","","Mooring lines","Condition, certificates, line records per mooring plan / MSMP.","C/O","10.1","Mooring lines","Kondisyon, certificate, record ayon sa mooring plan / MSMP."],["I3","","Anchors & chain","Bitter end secured, chain locker cover and spurling pipe covers closed.","Bosun","10.20","Anchor at kadena","Secured ang bitter end, sarado ang chain locker at spurling pipe cover."],["I4","","Forecastle store","Lighting, ventilation, extinguisher, tidy.","Bosun","14.13","Forecastle store","May ilaw, bentilasyon, extinguisher, maayos."]]},{"k":"J","t":["Engine room & machinery spaces","Engine room at makina"],"lead":"C/E · 2/E · 3/E · Electrician","why":["Oil in the bilges, hot surfaces, a by-passed OWS or a crew that cannot run their own equipment are classic detentions in Canada.","Langis sa bilge, mainit na surface, bypass na OWS o crew na hindi kaya ang sariling gamit = klasikong detention sa Canada."],"i":[["J1","★","Cleanliness","No oil on tank tops, bilges, drip trays; no oily rags; save-alls empty.","2/E","13.29","Kalinisan","Walang langis sa tank top, bilge, drip tray; walang basahang may langis; walang laman ang save-all."],["J2","★ CA","Main & auxiliary engine leaks","No fuel/lube leaks (Quebec 2025: leaking fuel pump); HP fuel pipe jackets and spray screens fitted.","C/E","7A.11","Tagas ng main at aux engine","Walang tagas ng fuel/lube (Quebec 2025: tumutulong fuel pump); may jacket ang HP fuel pipe at spray screen."],["J3","★","Hot surfaces & lagging","All surfaces >220 °C insulated; no oil-soaked lagging; lagging removed for repairs put back.","2/E","13.19","Mainit na surface at lagging","Naka-insulate lahat ng >220 °C; walang lagging na may langis; ibinalik ang tinanggal na lagging."],["J4","CA","Engine records & NOx IDs","Parameter records complete for all engines (Quebec 2025: missing DG entries); NOx component IDs match Technical File.","C/E","13.9","Engine records at NOx IDs","Kumpleto ang parameter record ng lahat ng makina (Quebec 2025: kulang ang DG); tugma ang NOx ID sa Technical File."],["J5","★ CA","OWS & 15 ppm alarm","Engineers can demonstrate the OWS and 15 ppm alarm/stop; calibration certificate; no flexible hoses, no by-pass, piping as per IOPP drawing (Vancouver 2025 detention).","C/E · 2/E","5.15","OWS at 15 ppm alarm","Kayang ipakita ng engineers ang OWS at 15 ppm alarm/stop; may calibration certificate; walang flexible hose, walang bypass, tubo ayon sa IOPP drawing (Vancouver 2025)."],["J6","★","Oil Record Book & sludge","ORB matches soundings and IOPP Form A tanks; sludge pump and standard discharge connection; incinerator records.","C/E","5.1","ORB at sludge","Tugma ang ORB sa sounding at IOPP Form A; sludge pump at standard discharge connection; incinerator record."],["J7","★","Emergency generator","Starts automatically on blackout and takes load; fuel tank QCV directly on tank; room clean; batteries/charger OK.","C/E","13.36","Emergency generator","Kusang umaandar sa blackout at may load; QCV direkta sa tangke; malinis ang kuwarto; OK ang battery/charger."],["J8","★","Emergency lighting & batteries","Emergency lights work; battery room ventilated, charger OK.","Electr.","13.17","Emergency lighting at battery","Gumagana ang emergency light; may bentilasyon ang battery room, OK ang charger."],["J9","★ CA","Steering gear room","Emergency steering instructions & block diagram posted, gyro repeater, communications to bridge; crew practised (Vancouver 2025 detention).","2/E","13.42","Steering gear room","May emergency steering instructions at block diagram, gyro repeater, komunikasyon sa bridge; nag-practice ang crew (Vancouver 2025)."],["J10","","Bilge system","Bilge pumps and high-level alarms tested.","3/E","13.31","Bilge system","Na-test ang bilge pump at high-level alarm."],["J11","★ CA","Sewage plant","Running correctly; UV/chlorination working, sight glasses not blanked (Quebec 2025); type matches ISPP certificate.","2/E","5.27","Sewage plant","Tama ang andar; gumagana ang UV/chlorination, walang takip ang sight glass (Quebec 2025); tugma sa ISPP."],["J12","★ CA","BWMS","Operational, no alarms, filters/UV/TRO OK, records kept, engineers can operate it in front of PSCO.","C/E","5.10","BWMS","Gumagana, walang alarm, OK ang filter/UV/TRO, may record, kaya ng engineers sa harap ng PSCO."],["J13","★","Switchboards & electrics","Insulation readings, no earth faults, panels closed, rubber mats in place.","Electr.","13.39","Switchboard at electrics","May insulation reading, walang earth fault, sarado ang panel, may rubber mat."],["J14","","Workshop & gas welding","Grinder guards/eye shields; O2/acetylene with flashback arrestors, gauges OK, cylinders secured.","2/E","4.17","Workshop at gas welding","May guard/eye shield ang grinder; O2/acetylene na may flashback arrestor, OK ang gauge, secured ang cylinder."],["J15","★","ER escape & fire flaps","Escape trunk unlocked and lit, self-closing door works; skylight/funnel flaps close.","2/E","13.15","ER escape at fire flaps","Bukas at may ilaw ang escape trunk, gumagana ang self-closing door; sumasara ang skylight/funnel flap."],["J16","","Alarms & UMS","No over-ridden alarms; UMS alarm tests logged; hydraulic power packs clean.","C/E","13.4","Alarms at UMS","Walang naka-override na alarm; naka-log ang UMS alarm test; malinis ang hydraulic power pack."],["J17","CA","Winter sea-water cooling (Quebec)","System to prevent sea-chest icing/choking available (St. Lawrence winter rules). Check ship is on Transport Canada's compliant list (winternav@tc.gc.ca).","C/E","13.32","Winter sea-water cooling (Quebec)","May system laban sa yelo sa sea chest (winter rules ng St. Lawrence). Suriin kung nasa compliant list ng Transport Canada (winternav@tc.gc.ca)."]]},{"k":"K","t":["Pollution prevention & Canadian environmental rules","Pollution prevention at Canadian environmental rules"],"lead":"C/E · C/O · Master","why":["Canada enforces the North American ECA, its own Ballast Water Regulations (SOR/2021-120) and whale-protection speed measures.","Ipinapatupad ng Canada ang North American ECA, sariling Ballast Water Regulations (SOR/2021-120) at speed limits para sa balyena."],"i":[["K1","★ CA","ECA fuel changeover","0.10% S fuel before entering the North American ECA (200 nm); changeover time, position and tank volumes logged; BDNs kept 3 years with MARPOL samples.","C/E","7A.9","ECA fuel changeover","0.10% S bago pumasok sa North American ECA (200 nm); naka-log ang oras, posisyon at dami; BDN 3 taon kasama ang MARPOL sample."],["K2","★ CA","Ballast water","BWMS used for every discharge; BWRB complete; ballast water report sent before arrival through the agent; sediment management recorded.","C/O · C/E","5.10","Ballast water","Gamitin ang BWMS sa bawat discharge; kumpleto ang BWRB; ipinadala ang ballast report bago dumating; naka-record ang sediment."],["K3","CA","Fresh-water discharge (St. Lawrence)","If ballast will be discharged in Canadian fresh waters, check the extra measures of SOR/2021-120 with the agent before arrival.","C/O","5.10","Discharge sa fresh water (St. Lawrence)","Kung magdi-discharge sa fresh water ng Canada, suriin ang dagdag na measures ng SOR/2021-120 sa agent bago dumating."],["K4","CA","Garbage","Segregated bins & placards; GRB up to date; no plastics overboard; foreign food waste landed only through the agent's approved contractor.","C/O","5.19","Basura","Hiwalay na bins at placard; updated ang GRB; bawal plastic sa dagat; foreign food waste sa approved contractor lang."],["K5","CA","Sewage & grey water","No discharge of untreated sewage; any discharge must leave no visible solids, film or sheen (Canadian regulations).","C/E","5.27","Sewage at grey water","Bawal ang untreated sewage; walang makikitang solids, film o sheen (Canadian regulations)."],["K6","CA","Whale protection","Gulf of St. Lawrence NARW speed zones (10 kn when triggered) and ECHO voluntary slowdown Haro Strait/Boundary Pass (11 kn for bulkers, until 30/11/2026). Log compliance.","Master","3.21","Proteksyon sa balyena","NARW speed zones sa Gulf of St. Lawrence (10 kn kapag may alerto) at ECHO slowdown sa Haro Strait/Boundary Pass (11 kn, hanggang 30/11/2026). I-log."],["K7","CA","Anti-fouling","AFS certificate/declaration on board; hull paint not peeling.","C/O","14.1","Anti-fouling","May AFS certificate/declaration; hindi natutuklap ang pintura."]]},{"k":"L","t":["Security (ISPS)","Security (ISPS)"],"lead":"SSO (C/O)","why":["",""],"i":[["L1","","Access control","Restricted areas locked/marked; visitors escorted; search records.","SSO","12.1","Access control","Naka-lock/may marka ang restricted area; may escort ang bisita; may search record."],["L2","","Records","Last 10 port calls, Declarations of Security, security drills & training, SSAS test.","SSO","12.2","Records","Huling 10 port call, DoS, security drill at training, SSAS test."]]}],"drills":[["Fire drill — ER fire","Realistic scenario with smoke location; boundary cooling; ventilation & fuel shut-off; SCBA team checks pressure; communications Master → team leader → bridge. Talk through CO2 release step by step.","Vancouver 2025: Master & crew unfamiliar with firefighting systems; poor communication.","Fire drill — sunog sa ER","Makatotohanang scenario; boundary cooling; patayin ang ventilation at fuel; sinusuri ng SCBA team ang pressure; komunikasyon Master → team leader → bridge. Ipaliwanag ang CO2 release hakbang-hakbang."],["Abandon ship","Crew at muster in 2 min with lifejackets & immersion suits; boat lowered (if allowed), engine started, run ahead/astern.","Quebec 2025: both boat engines failed; davit stuck.","Abandon ship","Crew sa muster sa loob ng 2 min na may lifejacket at immersion suit; ibaba ang boat (kung pwede), paandarin, ahead/astern."],["Emergency steering","Change-over to local control, communication with bridge, gyro repeater read-back.","Vancouver 2025: crew unfamiliar with emergency steering.","Emergency steering","Lipat sa local control, komunikasyon sa bridge, basahin ang gyro repeater."],["Enclosed space rescue","Permit, gas test, rescue equipment, tripod/stretcher. (CIC 2027 = Enclosed Space Entry.)","Common ISM/drill finding.","Enclosed space rescue","Permit, gas test, rescue equipment, tripod/stretcher. (CIC 2027 = Enclosed Space Entry.)"],["Blackout & emergency generator","Simulate blackout; emergency generator on load; emergency fire pump start.","Emergency systems = No.3 detainable area.","Blackout at emergency generator","Simulate ang blackout; em'cy gen may load; paandarin ang emergency fire pump."],["OWS demonstration","2/E runs the OWS, shows 15 ppm alarm and automatic stop.","Vancouver 2025: officer could not operate OWS.","OWS demonstration","Pinapaandar ng 2/E ang OWS, ipinapakita ang 15 ppm alarm at automatic stop."],["ECDIS / bridge equipment","Each OOW shows the PSCO the ECDIS settings, radar, echo sounder, gyro, GMDSS.","Vancouver 2025: OOW not familiar with equipment.","ECDIS / bridge equipment","Bawat OOW ipinapakita sa PSCO ang ECDIS settings, radar, echo sounder, gyro, GMDSS."],["Oil spill (SOPEP)","Spill on deck during bunkering: plugs, absorbents, reporting to Canadian Coast Guard via the contact list.","Canadian pollution focus.","Oil spill (SOPEP)","Tapon sa deck habang bunkering: plug, absorbent, report sa Canadian Coast Guard ayon sa contact list."]],"golden":[["Master or C/O meets the PSCO at the gangway; ship's particulars, crew list and certificates ready in one file.","Sasalubungin ng Master o C/O ang PSCO sa gangway; handa sa isang file ang particulars, crew list at certificates."],["Escort the PSCO all the time with an officer who takes notes and photos of anything mentioned.","Laging may kasamang officer ang PSCO na nagsusulat at kumukuha ng litrato."],["Answer honestly and briefly. Never argue in front of the crew. If you don't know, say you will check — then check.","Sumagot nang tapat at maikli. Huwag makipagtalo sa harap ng crew. Kung hindi alam, sabihing susuriin — at suriin."],["A defect already reported to office/class with a repair plan is treated better than a hidden one.","Mas maganda ang trato sa sirang naka-report na may repair plan kaysa sa itinago."],["Let the crew do their own job in drills — the PSCO is testing them, not the Master.","Hayaan ang crew sa sariling trabaho sa drill — sila ang sinusubok ng PSCO."],["Read the PSC report (Form A/B) carefully before signing; check codes and texts. Ask the action code of each item (e.g. 17 = before departure, 30 = detention).","Basahin nang mabuti ang PSC report (Form A/B) bago pumirma; suriin ang code at text. Itanong ang action code (17 = bago umalis, 30 = detention)."],["Send the report to the office immediately — same hour.","Ipadala agad sa office ang report — sa loob ng isang oras."]],"src":[["Transport Canada — TP 15611 grain loading guidance","https://tc.canada.ca/en/marine-transportation/publications/tp-15611-guidance-masters-vessels-loading-grain-bulk"],["Transport Canada — SSB 02/2026 NARW speed restriction","https://tc.canada.ca/en/marine-transportation/marine-safety/ship-safety-bulletins/prote const IDB={db:null,open(){return this.db?Promise.resolve(this.db):new Promise((res,rej)=>{const r=indexedDB.open("risqc",1);r.onupgradeneeded=()=>r.result.createObjectStore("b");r.onsuccess=()=>{this.db=r.result;res(this.db);};r.onerror=()=>rej(r.error);});},
 async tx(m,fn){const d=await this.open();return new Promise((res,rej)=>{const x=d.transaction("b",m),q=fn(x.objectStore("b"));x.oncomplete=()=>res(q&&q.result);x.onerror=()=>rej(x.error);});},
 put(k,v){return this.tx("readwrite",s=>s.put(v,k));},get(k){return this.tx("readonly",s=>s.get(k));},del(k){return this.tx("readwrite",s=>s.delete(k));}};
function fileToJpeg(file,max=1280,q=.72){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");
  c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",q));};im.onerror=rej;im.src=u;});}
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});
function b64(u8){let s="";for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);}
function d2blob(d){const[h,b]=d.split(","),m=h.match(/:(.*?);/)[1],bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:m});}
async function shareFiles(files,title){if(window.AndroidBridge&&AndroidBridge.shareFiles){AndroidBridge.shareFiles(JSON.stringify(files),title);return;}
  const fl=files.map(f=>new File([d2blob(f.dataUrl)],f.name,{type:f.mime}));
  if(navigator.canShare&&navigator.canShare({files:fl})){try{await navigator.share({files:fl,title});}catch(e){}return;}
  fl.forEach(f=>{const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();});toast(t("dl"));}
async function shareText(title,text){if(navigator.share){try{await navigator.share({title,text});return;}catch(e){return;}}
  try{await navigator.clipboard.writeText(text);toast(t("copied"));}catch(e){toast(t("noCopy"));}}

function dictate(btn,ta){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(REC){REC.stop();return;}

  const r=new SR();r.lang="en-US";r.interimResults=true;r.continuous=true;const base=ta.value?ta.value.replace(/\s*$/," "):"";let fin="";
  r.onresult=ev=>{let it="";for(let i=ev.resultIndex;i<ev.results.length;i++){const s=ev.results[i][0].transcript;if(ev.results[i].isFinal)fin+=s+" ";else it+=s;}ta.value=base+fin+it;ta.dispatchEvent(new Event("input"));};
  r.onerror=ev=>{toast(ev.error==="not-allowed"?t("mic"):t("kbd"));if(ev.error!=="no-speech")ta.focus();};
  r.onend=()=>{REC=null;btn.classList.remove("rec");btn.textContent=t("speak");};
  try{r.start();REC=r;btn.classList.add("rec");btn.textContent=t("stop");}catch(x){ta.focus();toast(t("kbd"));}}

  if(lo)return h===0?9:h===1?6:h===2?3:0;return h===0?6:h===1?3:0;}

function rValid(ins,fl){const c={L:0,M:0,H:0},sec={};fl.forEach(q=>{const v=sevOf(ins,q);c[v]++;if(v!=="H"&&(q.s==="3"||q.s==="13"))sec[q.s]=(sec[q.s]||0)+1;});
  const cl=Math.floor((sec["3"]||0)/4)+Math.floor((sec["13"]||0)/4),lm=c.L+c.M,h=c.H+cl,g=vMonths(lm,h,"g");
  const tips=[];if(h>1)tips.push(t("vTipH"));if(lm>23)tips.push(t("vTipLM",{n:lm,k:lm-23}));
  ["3","13"].forEach(k=>{const n=sec[k]||0;if(n>=3)tips.push(t("vTipS",{s:k,n}));});
  $("#valid").innerHTML=`<h2>${t("vT")}</h2>
   <div class="tiles" style="grid-template-columns:repeat(4,1fr)"><div class="tile"><b style="color:#5b8f6f">${c.L}</b><span class="note">Low</span></div><div class="tile"><b style="color:#c88a12">${c.M}</b><span class="note">Medium</span></div><div class="tile"><b style="color:var(--f)">${c.H}</b><span class="note">High</span></div><div class="tile"><b style="color:var(--f)">+${cl}</b><span class="note">clustering 3/13</span></div></div>
   <p style="margin:10px 0 4px">${t("vLM")}: <b>${lm}</b> ${lm<=23?"✅ ≤23":"⚠ >23"} · ${t("vH")}: <b>${h}</b></p>
   <table class="vt"><tr><th>${t("vCo")}</th><th>${t("vGood")}</th><th>${t("vAvg")}</th><th>${t("vPoor")}</th></tr><tr><td>${t("vVal")}</td>${vCell(g)}${vCell(vMonths(lm,h,"a"))}${vCell(vMonths(lm,h,"p"))}</tr></table>
   ${tips.length?`<ul class="note" style="margin:8px 0 0;padding-left:18px">${tips.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<p class="note" style="margin:8px 0 0">${t("vOk")}</p>`}
   <p class="note" style="margin:6px 0 0">${t("vNote")}</p>`;}

/* ---------- pages ---------- */
function openPage(k,from){page=k;pageFrom=from||(view==="list"?"list":"home");go("page");}
$$("[data-pg]").forEach(b=>b.onclick=()=>{cur=null;openPage(b.dataset.pg,"list");});
$("#h24Ins").onclick=()=>openPage("h24","home");$("#docsIns").onclick=()=>openPage("docs","home");$("#drillIns").onclick=()=>openPage("drill","home");$("#pscIns").onclick=()=>openPage("psc","home");$("#manIns").onclick=()=>openPage("man","home");$("#trnIns").onclick=()=>openPage("trn","home");$("#ilIns").onclick=()=>openPage("il","home");
const crewL=r=>F(L)&&r[2]?r[2]:r[1];
function h24St(ins){if(ins)return ins.h24=ins.h24||{};try{return JSON.parse(localStorage.getItem("risqc_h24"))||{};}catch(e){return {};}}
function h24Save(ins,hc){if(ins){ins.h24=hc;save();}else try{localStorage.setItem("risqc_h24",JSON.stringify(hc));}catch(e){}}
const crewTxt=rs=>(F(L)?"RIGHTSHIP INSPECTION – CREW BRIEFING\n(“Kung hindi naka-record, hindi ginawa.” Ang huling permit/record ang tinitingnan ng inspector, at sinusubukan niya ang equipment.)\n\n":"RIGHTSHIP INSPECTION – CREW BRIEFING\n(“If it is not recorded, it is not done.” Inspector checks the LAST permit/record and tests equipment.)\n\n")+rs.map(([r,it])=>r.toUpperCase()+"\n"+it.map(x=>`☐ ${x[0]!=="*"?"["+x[0]+"] ":""}${crewL(x)}`).join("\n")).join("\n\n");
const drQ=d=>F(L)&&d[4]?d[4]:d[1],drA=d=>F(L)&&d[5]?d[5]:d[2];
function rPage(){const ins=pageFrom!=="list"?I():null,box=$("#pg");let h="";
  if(page==="h24"){const hc=h24St(ins),li=F(L)?3:2;
    h=`<div class="card note" style="margin-top:0">${t("h24X")} ${ins?t("h24K"):t("h24P")}</div>
     <div class="row" style="margin-bottom:6px"><button class="btn p" id="h24Sh">${t("h24Sh")}</button><button class="btn" id="h24Op">${t("h24Op")}</button><button class="btn d" id="h24Clr">${t("h24Clr")}</button><span class="note" id="h24N"></span></div>`+
     H24.s.map((S,si)=>{const dn=S.i.filter((_,ii)=>hc[si+"_"+ii]).length;return `<div class="card"><h2 style="margin-top:0">${esc(S.t[li-1])} <span class="note" style="font-weight:400">${dn}/${S.i.length}</span></h2>${S.i.map((it,ii)=>{const k=si+"_"+ii;return `<label class="chk pchk"><input type="checkbox" data-h24="${k}" ${hc[k]?"checked":""}><span style="flex:1">${it[0]!=="*"?`<b>${esc(it[0])}</b> `:""}${esc(it[li])}</span>${ins&&it[0]!=="*"&&QM[it[0]]?`<button class="pgo" data-goq="${it[0]}">→</button>`:""}</label>`;}).join("")}</div>`;}).join("")+
     `<div class="card note">${esc(t("h24U",{d:H24.u}))}<div class="row" style="margin-top:8px"><button class="btn" data-open="drill">🎤 Drill</button><button class="btn" data-open="crew">👷 Briefing</button><button class="btn" data-open="docs">📁 72h</button></div></div>`;}
  else if(page==="mind"){h=X.mind.map((m,i)=>`<div class="card"><h2 style="margin:0 0 6px">${i+1}. ${esc(F(L)?m[2]:m[0])}</h2><div>${esc(F(L)?m[3]:m[1])}</div></div>`).join("");}
  else if(page==="crew"){h=`<div class="card note" style="margin-top:0">${t("crewX")}</div><div class="row" style="margin-bottom:6px"><button class="btn p" id="crewAll">${t("crewAll")}</button></div>`+
    X.crew.map((r,i)=>`<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(r[0])}</h2><button class="btn" data-crew="${i}">📤</button></div><ul>${r[1].map(x=>`<li>${x[0]!=="*"?`<b>${esc(x[0])}</b> `:""}${esc(crewL(x))}</li>`).join("")}</ul></div>`).join("");}
  else if(page==="drill"){h=`<div class="card note" style="margin-top:0">${t("drillX")}</div><div class="row" style="margin-bottom:6px"><button class="btn" id="drillSh">${t("drillSh")}</button></div><div class="card">`+
    X.drill.map((d,i)=>`<div class="qa" data-i="${i}"><div class="who">${esc(d[0])} · RISQ ${esc(d[3])}</div><div style="font-weight:600">${esc(drQ(d))}</div><div class="ans2">${esc(drA(d))}${F(L)&&d[5]?`<div class="note" style="margin-top:6px">🇬🇧 ${esc(d[2])}</div>`:""}</div></div>`).join("")+`</div>`;}
  else if(page==="docs"){const dc=ins?(ins.dc=ins.dc||{}):null;
    h=`<div class="card note" style="margin-top:0">${t("docsX")} ${ins?t("docsKeep"):t("docsOpen")}</div><div class="row" style="margin-bottom:6px"><button class="btn" id="docsSh">${t("docsSh")}</button><span class="note" id="docsN"></span></div>`+
    X.docs.map(([sn,l],i)=>`<div class="card"><h2 style="margin-top:0">${esc(sn)}</h2>${l.map((d,j)=>`<div class="dci"><label class="chk"><input type="checkbox" data-dc="${i}_${j}" ${dc&&dc[i+"_"+j]?"checked":""} ${dc?"":"disabled"}><span>${esc(d)}</span></label>${(X.docsi||{})[d]?`<button class="ib" data-di="${i}_${j}" aria-label="info">ℹ️</button><div class="dinfo" id="di${i}_${j}" hidden>${esc(X.docsi[d][F(L)?1:0])}</div>`:""}</div>`).join("")}</div>`).join("");}
  else if(page==="psc"){const pc=ins?(ins.pc=ins.pc||{}):null,li=F(L)?1:0;let rid=(ins&&ins.pr)||(()=>{try{return localStorage.getItem("risqc_psc_r")}catch(e){return null}})()||"all";const R=PSC.r.find(x=>x.id===rid)||PSC.r[0];
    h=`<div class="pscr">${PSC.r.map(x=>`<button class="pchip${x.id===R.id?" on":""}" data-pr="${x.id}">${x.f} ${esc(x.n)}</button>`).join("")}</div>
     <div class="card" style="margin-top:0"><h2 style="margin-top:0">${R.f} ${esc(R.id==="all"?t("pscAll"):R.n)}</h2><p style="margin:0 0 6px">${esc(R.a[li])}</p>${R.c[li]?`<div class="flt">📌 <b>${t("pscCamp")}:</b> ${esc(R.c[li])}</div>`:""}${R.p[li]?`<p class="note" style="margin:4px 0 0">⚓ ${esc(R.p[li])}</p>`:""}${R.id!=="all"?`<p class="note" style="margin:6px 0 0">${t("pscFirst")}</p>`:""}${R.id==="canada"?`<div class="row" style="margin-top:8px"><button class="btn p" data-open="ca">📘 Zero Deficiency Canada walk-round</button></div>`:""}</div>
     <div class="row" style="margin-bottom:6px"><button class="btn" id="pscSh">${t("pscSh")}</button><span class="note" id="pscN"></span></div>`+
     R.s.map((S,si)=>`<div class="card"><h2 style="margin-top:0">${esc(S.t[li])}</h2>${S.i.map((it,ii)=>{const k=R.id+"_"+si+"_"+ii;return `<label class="chk pchk"><input type="checkbox" data-pc="${k}" ${pc&&pc[k]?"checked":""} ${pc?"":"disabled"}><span style="flex:1">${it[0]!=="*"?`<b>${esc(it[0])}</b> `:""}${esc(it[1+li])}</span>${ins&&it[0]!=="*"&&QM[it[0]]?`<button class="pgo" data-goq="${it[0]}">→</button>`:""}</label>`;}).join("")}</div>`).join("")+
     `<div class="card note psrc">${t("pscUpd")} ${esc(PSC.u)} · ${t("pscSrc")}: ${R.src.map(x=>`<a href="${x[1]}" target="_blank" rel="noopener">${esc(x[0])}</a>`).join(" · ")}${ins?"":"<br>"+t("docsOpen")}</div>`;
    page_psc=R;}
  if(["man","fm","ca","trn","il"].includes(page))h=MANR(page,ins);
  box.innerHTML=h;hdr();
  if(["man","fm","ca","trn","il"].includes(page))MANB(page,ins,box);
  box.querySelectorAll("[data-open]").forEach(b=>{if(!b.onclick)b.onclick=()=>{openPage(b.dataset.open,pageFrom);window.scrollTo(0,0);};});
  if(page==="psc"){const R=page_psc,pc=ins?ins.pc:null,li=F(L)?1:0;
    box.querySelectorAll("[data-pr]").forEach(b=>b.onclick=()=>{if(ins){ins.pr=b.dataset.pr;save();}try{localStorage.setItem("risqc_psc_r",b.dataset.pr);}catch(e){}rPage();window.scrollTo(0,0);});
    const pn=()=>{const e=$("#pscN");if(e&&pc){const n0=R.s.reduce((a,b)=>a+b.i.length,0),n=Object.keys(pc).filter(k=>pc[k]&&k.startsWith(R.id+"_")).length;e.textContent=`${n}/${n0} ✔`;}};pn();
    box.querySelectorAll("[data-pc]").forEach(c=>c.onchange=()=>{pc[c.dataset.pc]=c.checked;save();pn();});
    box.querySelectorAll("[data-goq]").forEach(b=>b.onclick=e=>{e.preventDefault();const q=QM[b.dataset.goq];area=q.a;aflt="all";go("area");setTimeout(()=>{const x=$(`#qs [data-id="${q.id}"]`);if(x)x.scrollIntoView({block:"center"});},60);});
    $("#pscSh").onclick=()=>shareText("PSC checklist – "+R.n,`PSC CHECKLIST – ${R.id==="all"?"ALL REGIMES":R.n.toUpperCase()}\n${R.a[li]}\n${R.c[li]?t("pscCamp").toUpperCase()+": "+R.c[li]+"\n":""}\n`+R.s.map(S=>S.t[li].toUpperCase()+"\n"+S.i.map(i=>`☐ ${i[0]!=="*"?"["+i[0]+"] ":""}${i[1+li]}`).join("\n")).join("\n\n")+`\n\nSources (${PSC.u}): `+R.src.map(x=>x[0]).join("; "));}
  if(page==="h24"){const hc=h24St(ins),tot=H24.s.reduce((a,b)=>a+b.i.length,0);
    const hn=()=>{const e=$("#h24N");if(e)e.textContent=`${Object.values(hc).filter(Boolean).length}/${tot} ✔`;};hn();
    box.querySelectorAll("[data-h24]").forEach(c=>c.onchange=()=>{hc[c.dataset.h24]=c.checked;h24Save(ins,hc);hn();const h2=c.closest(".card").querySelector("h2 .note"),si=c.dataset.h24.split("_")[0];if(h2)h2.textContent=`${H24.s[si].i.filter((_,ii)=>hc[si+"_"+ii]).length}/${H24.s[si].i.length}`;});
    box.querySelectorAll("[data-goq]").forEach(b=>b.onclick=e=>{e.preventDefault();const q=QM[b.dataset.goq];area=q.a;aflt="all";go("area");setTimeout(()=>{const x=$(`#qs [data-id="${q.id}"]`);if(x)x.scrollIntoView({block:"center"});},60);});
    const tx=open=>`RIGHTSHIP INSPECTION – 24 HOURS BEFORE${ins?"\n"+ins.vessel+(ins.port?" · "+ins.port:""):""}\n(RISQ 3.2 question in [ ])\n\n`+H24.s.map((S,si)=>{const l=S.i.map((it,ii)=>[it,ii]).filter(([,ii])=>!open||!hc[si+"_"+ii]);return l.length?S.t[1].toUpperCase()+"\n"+l.map(([it,ii])=>`${hc[si+"_"+ii]?"☑":"☐"} ${it[0]!=="*"?"["+it[0]+"] ":""}${it[2]}`).join("\n"):"";}).filter(Boolean).join("\n\n");
    $("#h24Sh").onclick=()=>shareText("RightShip – 24 hours before",tx(false));$("#h24Op").onclick=()=>shareText("RightShip – 24h open items",tx(true));
    $("#h24Clr").onclick=e=>{const b=e.currentTarget;if(!b.dataset.s){b.dataset.s=1;b.textContent=t("h24Sure");return;}Object.keys(hc).forEach(k=>delete hc[k]);h24Save(ins,hc);rPage();};}
  box.querySelectorAll(".qa").forEach(e=>e.onclick=()=>e.classList.toggle("open"));
  box.querySelectorAll("[data-crew]").forEach(b=>b.onclick=()=>shareText("RISQ briefing – "+X.crew[b.dataset.crew][0],crewTxt([X.crew[b.dataset.crew]])));
  const ca=$("#crewAll");if(ca)ca.onclick=()=>shareText("RISQ crew briefing",crewTxt(X.crew));
  const ds=$("#drillSh");if(ds)ds.onclick=()=>shareText("RightShip interview drill",X.drill.map((d,i)=>`${i+1}. [${d[0]} · RISQ ${d[3]}] ${drQ(d)}\n   → ${drA(d)}`).join("\n\n"));
  $$("[data-di]").forEach(b=>b.onclick=()=>{const e=document.getElementById("di"+b.dataset.di);e.hidden=!e.hidden;});const dsh=$("#docsSh");if(dsh)dsh.onclick=()=>shareText("RightShip hybrid documents (72h)",X.docs.map(([sn,l])=>sn.toUpperCase()+"\n"+l.map(d=>"☐ "+d).join("\n")).join("\n\n"));
  const dn=()=>{const e=$("#docsN");if(e&&ins){const n0=X.docs.reduce((a,b)=>a+b[1].length,0),n=Object.values(ins.dc||{}).filter(Boolean).length;e.textContent=`${n}/${n0} ✔`;}};dn();
  box.querySelectorAll("[data-dc]").forEach(c=>c.onchange=()=>{ins.dc[c.dataset.dc]=c.checked;save();dn();});}

applyLang();go("list");
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
