let.","Loading computer: test condition sa huling 3 buwan, tugma sa booklet."]]},{"t":["⚙️ Μηχανοστάσιο & steering","⚙️ Engine room & steering","⚙️ Engine room at steering"],"i":[["13.29","Housekeeping: bilges στεγνά και χωρίς λάδι, plates χωρίς λάδια, καμία διαρροή. Steering room καθαρό.","Housekeeping: bilges dry and oil-free, plates oil-free, no leaks. Steering room clean.","Housekeeping: tuyo at walang langis ang bilges, walang langis ang plates, walang tagas. Malinis ang steering room."],["5.15","OWS + 15 ppm alarm: δοκιμή σήμερα (θα το ζητήσει μπροστά του), 3-way valve επιστρέφει στο bilge, record στο ORB.","OWS + 15 ppm alarm: test today (he will ask to see it), 3-way valve returns to bilge, record in ORB.","OWS + 15 ppm alarm: i-test ngayon (hihingin niyang makita), bumabalik sa bilge ang 3-way valve, i-record sa ORB."],["4.28","Em'cy fire pump: εκκίνηση σήμερα, πίεση στο ψηλότερο hydrant, οδηγίες εκκίνησης αναρτημένες.","Emergency fire pump: start today, pressure at the highest hydrant, starting instructions posted.","Emergency fire pump: paandarin ngayon, pressure sa pinakamataas na hydrant, nakapaskil ang starting instructions."],["13.36","Em'cy generator: εκκίνηση auto & manual, οδηγίες αναρτημένες. Tank γεμάτο για ≥18 ώρες (7A.13) – γεμίστε σήμερα.","Emergency generator: start auto & manual, instructions posted. Tank full for at least 18 hours (7A.13) – top up today.","Emergency generator: paandarin auto at manual, nakapaskil ang instructions. Puno ang tank para sa 18 oras o higit (7A.13) – punuin ngayon."],["13.8","Engineers' call alarm και dead man alarm (13.7): test σήμερα.","Engineers' call alarm and dead man alarm (13.7): test today.","Engineers' call alarm at dead man alarm (13.7): i-test ngayon."],["13.31","Bilge high-level alarms: test και record.","Bilge high-level alarms: test and record.","Bilge high-level alarms: i-test at i-record."],["13.23","Self-closing valves (gauge glasses, drains): ΚΑΝΕΝΑ δεμένο ανοιχτό.","Self-closing valves (gauge glasses, drains): NONE tied open.","Self-closing valves (gauge glasses, drains): WALANG nakataling bukas."],["13.24","Sounding pipes: self-closing κλειστά, caps στη θέση.","Sounding pipes: self-closing closed, caps in place.","Sounding pipes: sarado ang self-closing, nakalagay ang caps."],["13.19","Spray shields στα flanges FO/LO κοντά σε hot surfaces, μόνωση στη θέση. Lagging χωρίς λάδια (13.20).","Spray shields on FO/LO flanges near hot surfaces, insulation in place. Lagging not oil-soaked (13.20).","Spray shields sa FO/LO flanges malapit sa mainit na surface, nasa lugar ang insulation. Walang langis ang lagging (13.20)."],["13.22","Insulating mats μπροστά/πίσω MSB & ESB. Earth fault monitors (13.39) χωρίς ένδειξη.","Insulating mats in front/behind MSB & ESB. Earth fault monitors (13.39) show no fault.","Insulating mats sa harap/likod ng MSB at ESB. Walang fault sa earth fault monitors (13.39)."],["13.25","Guards σε όλα τα κινούμενα. Workshop (13.26): eye shields, guards, emergency stops, οδηγίες.","Guards on all moving parts. Workshop (13.26): eye shields, guards, emergency stops, instructions.","May guard lahat ng gumagalaw. Workshop (13.26): eye shields, guards, emergency stops, instructions."],["13.28","Spare parts δεμένα και ασφαλισμένα (ER, stores, steering).","Spare parts lashed and secured (ER, stores, steering).","Nakatali at secure ang spare parts (ER, stores, steering)."],["13.34","Κανένα temporary repair, clamp ή τσιμέντο σε σωλήνες (και sea water lines 13.32).","No temporary repairs, clamps or cement boxes on pipes (also sea water lines 13.32).","Walang temporary repair, clamp o semento sa tubo (pati sea water lines 13.32)."],["13.18","Em'cy stops ventilation & fire flaps σημασμένα και δοκιμασμένα.","Ventilation emergency stops & fire flaps marked and tested.","May marka at na-test ang ventilation emergency stops at fire flaps."],["13.40","Emergency steering drill ≤3 μηνών σε record. Reserve tank γεμάτο (13.41), heading indicator & communication (13.42), rudder angle indicator (13.43), οδηγίες αναρτημένες.","Emergency steering drill within 3 months recorded. Reserve tank full (13.41), heading indicator & communication (13.42), rudder angle indicator (13.43), instructions posted.","Emergency steering drill sa loob ng 3 buwan naka-record. Puno ang reserve tank (13.41), heading indicator at communication (13.42), rudder angle indicator (13.43), nakapaskil ang instructions."],["13.15","Escape routes ελεύθερα, σημασμένα, φωτισμός OK.","Escape routes clear, marked, lighting OK.","Malinis at may marka ang escape routes, OK ang ilaw."],["13.9","Alarm list ECR: καθαρή ή κάθε alarm εξηγημένο. Alarm printer σε σωστή ώρα.","ECR alarm list: clear, or each alarm explained. Alarm printer at correct time.","ECR alarm list: malinis, o may paliwanag ang bawat alarm. Tamang oras ang alarm printer."],["7A.10","Quick closing valves: τελευταίο test σε record.","Quick closing valves: last test recorded.","Quick closing valves: naka-record ang huling test."],["13.10","Blackout recovery procedure αναρτημένη, οι engineers την ξέρουν.","Blackout recovery procedure posted, engineers know it.","Nakapaskil ang blackout recovery procedure, alam ng engineers."]]},{"t":["🛏 Accommodation & galley","🛏 Accommodation & galley","🛏 Accommodation at galley"],"i":[["14.16","Ψυγεία/κατάψυξη: man-trapped alarm δοκιμή, η πόρτα ανοίγει από μέσα.","Fridge/freezer rooms: test man-trapped alarm, door opens from inside.","Fridge/freezer rooms: i-test ang man-trapped alarm, nabubuksan ang pinto mula sa loob."],["14.18","Hospital: καθαρό, ΜΟΝΟ για ιατρική χρήση, φάρμακα σε ισχύ.","Hospital: clean, ONLY for medical use, medicines in date.","Hospital: malinis, PARA LANG sa medical, hindi expired ang gamot."],["14.15","Galley: φίλτρα απορροφητήρα χωρίς λίπη, fire blanket, ηλεκτρικές συσκευές OK.","Galley: hood filters free of grease, fire blanket, electrical appliances OK.","Galley: walang grasa ang hood filters, may fire blanket, OK ang electrical appliances."],["14.11","Καμία αλυσίδα πολύπριζων, κρεμασμένα καλώδια ή ανοιχτά junction boxes.","No chained multi-plugs, hanging cables or open junction boxes.","Walang magkakabit na multi-plug, nakabitin na kable o bukas na junction box."],["15.2","Cabins & mess καθαρά, Master's weekly inspection record.","Cabins & mess clean, Master's weekly inspection record.","Malinis ang cabins at mess, may record ng weekly inspection ng Master."],["15.5","Potable water: test results, UV sterilizer/treatment λειτουργεί.","Potable water: test results, UV sterilizer/treatment working.","Potable water: may test results, gumagana ang UV sterilizer/treatment."],["4.34","MSDS κοντά σε chemicals, paints, bunkers.","MSDS near chemicals, paints, bunkers.","MSDS malapit sa chemicals, paints, bunkers."],["4.15","Κάπνισμα ΜΟΝΟ στα designated areas, σήμανση.","Smoking ONLY in designated areas, signs posted.","Paninigarilyo SA designated areas LANG, may signs."]]},{"t":["🌙 Βράδυ πριν (T-12h)","🌙 The evening before (T-12h)","🌙 Gabi bago ang inspection (T-12h)"],"i":[["2.5","Σταματήστε τις δουλειές στην ώρα τους: ΚΑΜΙΑ παραβίαση rest hours για την προετοιμασία. Ο inspector θα δει και αυτές τις μέρες.","Stop work on time: NO rest hour violation for the preparation. The inspector will check these days too.","Itigil ang trabaho sa oras: WALANG paglabag sa rest hours dahil sa paghahanda. Titingnan din ng inspector ang mga araw na ito."],["*","Όχι μπογιά τελευταίας στιγμής πάνω σε σκουριά, rubber seals, cleat washers ή markings. Φρέσκια μπογιά = κρυμμένο defect για τον inspector.","No last-minute paint over rust, rubber seals, cleat washers or markings. Fresh paint = hidden defect to the inspector.","Walang huling-minutong pintura sa kalawang, rubber seals, cleat washers o markings. Bagong pintura = nakatagong depekto para sa inspector."],["*","Καμία δουλειά μισή: όχι ανοιχτά μηχανήματα, ανοιχτά manholes, πεταμένα εργαλεία ή κρεμασμένα καλώδια.","No half-finished jobs: no opened machinery, open manholes, loose tools or hanging cables.","Walang kalahating trabaho: walang bukas na makina, bukas na manhole, nakakalat na tools o nakabitin na kable."],["*","Όλα τα logs μέχρι σήμερα: deck & engine logbook, GMDSS, ORB, GRB, BWRB, bell book.","All logs up to today: deck & engine logbook, GMDSS, ORB, GRB, BWRB, bell book.","Lahat ng logs hanggang ngayon: deck at engine logbook, GMDSS, ORB, GRB, BWRB, bell book."],["*","Briefing πληρώματος: «Δείξε, μη λες». Απαντάμε απλά και αληθινά· «θα σας δείξω πού είναι» είναι καλύτερο από ψέμα. Κάντε το 🎤 Drill συνέντευξης.","Crew briefing: “Show, don't tell.” Answer simply and truthfully; “I will show you where it is” is better than guessing. Do the 🎤 interview drill.","Crew briefing: “Ipakita, huwag sabihin.” Sumagot nang simple at totoo; “Ipapakita ko po kung nasaan” ay mas mabuti kaysa manghula. Gawin ang 🎤 interview drill."]]},{"t":["☀️ Πρωί επιθεώρησης (T-2h)","☀️ Inspection morning (T-2h)","☀️ Umaga ng inspection (T-2h)"],"i":[["*","Γρήγορο walk-round: φώτα, save-alls, πόρτες, extinguisher seals, fire boxes, housekeeping.","Quick walk-round: lights, save-alls, doors, extinguisher seals, fire boxes, housekeeping.","Mabilis na walk-round: ilaw, save-alls, pinto, seal ng extinguisher, fire boxes, housekeeping."],["4.11","Όλοι στο deck με σωστό PPE (helmet, boots, gloves, coverall, goggles όπου χρειάζεται). Spare PPE για τον inspector.","Everyone on deck in correct PPE (helmet, boots, gloves, coverall, goggles where needed). Spare PPE for the inspector.","Lahat sa deck naka-tamang PPE (helmet, boots, gloves, coverall, goggles kung kailangan). May spare PPE para sa inspector."],["12.1","Gangway watch στη θέση με visitor log και ID check (ελέγχει και τον inspector).","Gangway watch in place with visitor log and ID check (checks the inspector too).","Nasa lugar ang gangway watch na may visitor log at ID check (pati ang inspector)."],["4.16","Ο escort έχει φορητό gas detector (bump-tested) για κάθε χώρο που θα μπουν.","The escort carries a bump-tested portable gas detector for any space they enter.","May dalang bump-tested na portable gas detector ang escort para sa bawat space na papasukan."],["4.8","Καμία hot work ή enclosed space entry κατά την επιθεώρηση χωρίς πλήρες permit.","No hot work or enclosed space entry during the inspection without a complete permit.","Walang hot work o pagpasok sa enclosed space habang may inspection nang walang kumpletong permit."],["*","Engine room σε κανονική λειτουργία, ECR με αξιωματικό, γέφυρα με OOW (σε αγκυροβόλιο: anchor watch, BNWAS ON).","Engine room in normal operation, ECR manned, bridge with OOW (at anchor: anchor watch, BNWAS ON).","Normal ang operation ng engine room, may tao sa ECR, may OOW sa bridge (naka-angkla: anchor watch, BNWAS ON)."]]},{"t":["🎯 Κατά την επιθεώρηση","🎯 During the inspection","🎯 Habang may inspection"],"i":[["*","Ο escort δεν αφήνει τον inspector και σημειώνει κάθε παρατήρηση με τη θέση της.","The escort stays with the inspector and writes down every remark with its location.","Hindi iiwan ng escort ang inspector at isusulat ang bawat puna kasama ang lokasyon."],["*","Ό,τι βρει και διορθώνεται: διόρθωσέ το αμέσως, φωτογραφία πριν/μετά. Βοηθάει στο close-out.","Anything he finds that can be fixed: fix it at once, photo before/after. It helps the close-out.","Anumang makita niya na kayang ayusin: ayusin agad, may photo bago/pagkatapos. Makakatulong sa close-out."],["*","Δεν διαφωνούμε έντονα. Αν υπάρχει απόδειξη (record/certificate), τη δείχνουμε ήρεμα επί τόπου.","Do not argue. If there is evidence (record/certificate), show it calmly on the spot.","Huwag makipagtalo. Kung may ebidensya (record/certificate), ipakita nang mahinahon doon mismo."],["*","Closing meeting: διάβασε κάθε finding, ζήτα σωστή διατύπωση και σωστή RISQ ερώτηση, κράτα αντίγραφο. Ενημέρωσε γραφείο την ίδια μέρα.","Closing meeting: read every finding, ask for correct wording and the correct RISQ question, keep a copy. Inform the office the same day.","Closing meeting: basahin ang bawat finding, humingi ng tamang wording at tamang RISQ question, magtabi ng kopya. Ipaalam sa office sa parehong araw."]]}]};const PSC={"u":"2026-11-05","r":[{"id":"all","f":"🌐","n":"All","a":["The most frequent detainable items in ALL PSC regimes (Tokyo, Paris, AMSA, USCG 2025). Do these first, then the regional ones. Many small deficiencies together = ISM detention.","Ang pinakamadalas na detainable sa LAHAT ng PSC (Tokyo, Paris, AMSA, USCG 2025). Unahin ito, saka ang para sa rehiyon. Maraming maliit na deficiency = ISM detention."],"c":["",""],"p":["",""],"src":[["Tokyo MOU Annual Report 2025","https://www.tokyo-mou.org/wp/wp-content/uploads/ANN25.pdf"],["Paris MoU Annual Report 2025","https://parismou.org/2026/07/2025-paris-mou-annual-report-port-state-control-progress-and-performance-highlights-paris"],["USCG PSC Annual Report 2025 (summary)","https://safety4sea.com/uscg-annual-psc-report-2025-77-vessels-detained-during-the-year/"],["AMSA Inspections Report 2025","https://www.amsa.gov.au/vessels-operators/port-state-control/port-state-control-annual-reports/inspections-report-2025"]],"s":[{"t":["Top detainable – everywhere","Top detainable – kahit saan"],"i":[["4.27","Fixed CO2: annual service, bottle weight/level records, release alarm & fan trip tested, CO2 room clean, instructions posted. #1 detainable Tokyo 2025.","Fixed CO2: annual service, record ng timbang/level ng bote, release alarm at fan trip na-test, malinis ang CO2 room, may instructions. #1 detainable Tokyo 2025."],["4.18","Lifeboats: engine starts (also on 2nd means), on-load release, limit switches, falls, hull, equipment. PSCO asks to lower/run the boat.","Lifeboat: umaandar ang makina (pati 2nd starting), on-load release, limit switch, falls, hull, gamit. Ipapababa/papaandarin ng PSCO."],["14.6","Air pipes & ventilators: floats/seals OK, closing devices work, no holes or wastage, marked.","Air pipe at ventilator: OK ang float/seal, gumagana ang closing device, walang butas o kalawang, may marka."],["4.28","Fire pumps: main & emergency give pressure at the 2 highest hydrants, isolating valve OK, no clamps/patches on fire main.","Fire pump: main at emergency may pressure sa 2 pinakamataas na hydrant, OK ang isolating valve, walang clamp/tapal sa fire main."],["4.26","Fire detection: panel without faults or isolated zones, detectors tested per PMS.","Fire detection: walang fault o naka-isolate na zone sa panel, na-test ang detector ayon sa PMS."],["7A.10","ER remote controls: quick-closing valves, emergency stops of fans/pumps — tested in front of PSCO.","ER remote control: quick-closing valve, emergency stop ng fan/pump — ite-test sa harap ng PSCO."],["4.33","Fire dampers: close fully, marked (open/close, space served), not seized.","Fire damper: sumasara nang buo, may marka (open/close, lugar), hindi stuck."],["14.5","Fire doors: self-closing, no wedges/hooks, seals OK. #1 single deficiency Paris 2025 (3.1%).","Fire door: kusang sumasara, walang kalang/hook, OK ang seal. #1 na deficiency sa Paris 2025 (3.1%)."],["13.11","PMS/maintenance with no overdue jobs, defects reported to office. 'Maintenance of ship' is a top ISM detainable.","PMS/maintenance walang overdue, naka-report sa office ang sira. 'Maintenance of ship' ay top ISM detainable."],["5.15","OWS / 15 ppm alarm: demonstrated to PSCO, ORB matches soundings and sludge/bilge records, no bypass or temporary connections.","OWS / 15 ppm alarm: ipapakita sa PSCO, tugma ang ORB sa sounding at sludge/bilge record, walang bypass o pansamantalang koneksyon."],["4.9","Drills: fire & abandon ship in front of PSCO — everyone knows station/duty, SCBA donned correctly, communication works.","Drill: fire at abandon ship sa harap ng PSCO — alam ng lahat ang station/duty, tamang pagsuot ng SCBA, maayos ang komunikasyon."],["13.36","Emergency generator & emergency lighting: auto start, ESB, batteries — real test.","Emergency generator at emergency light: auto start, ESB, battery — totoong test."],["4.37","Pilot ladder: certificate & ID, inspection/use records, correct rigging & securing, lighting, lifebuoy. New SOLAS V/23 requirements from 1 Jan 2028.","Pilot ladder: certificate at ID, record ng inspection/gamit, tamang rigging at securing, ilaw, lifebuoy. Bagong SOLAS V/23 mula 1 Ene 2028."]]}]},{"id":"paris","f":"🇪🇺","n":"Paris MoU","a":["Europe + Canada (27 states). 2025: 16,474 inspections, 688 detentions (4.18%), 19 bans. Top areas: fire safety 16.8%, SOLAS II-1 (structure/electrical) 11.6%, MLC Title 4 10%. Single items: fire doors 3.1%, SEA 1.3%, ISM 4.5%. Targeting by Ship Risk Profile (THETIS).","Europe + Canada (27 bansa). 2025: 16,474 inspection, 688 detention (4.18%), 19 ban. Pinakamadami: fire safety 16.8%, SOLAS II-1 (structure/electrical) 11.6%, MLC Title 4 10%. Fire door 3.1%, SEA 1.3%, ISM 4.5%. Target ayon sa Ship Risk Profile (THETIS)."],"c":["CIC Cargo Securing: 1 Sep – 30 Nov 2026 (joint with Tokyo). 10 questions — detainable if 'NO': 2a, 2b, 3, 4, 5, 7, 8, 9. Next CIC 2027: Enclosed Space Entry.","CIC Cargo Securing: 1 Set – 30 Nob 2026 (kasama ang Tokyo). 10 tanong — detainable kung 'HINDI': 2a, 2b, 3, 4, 5, 7, 8, 9. Susunod na CIC 2027: Enclosed Space Entry."],"p":["Rotterdam, Amsterdam, Antwerp, Hamburg, Gdansk, Italy/Spain/Greece ports, Canada","Rotterdam, Amsterdam, Antwerp, Hamburg, Gdansk, Italy/Spain/Greece, Canada"],"src":[["Paris MoU Annual Report 2025","https://parismou.org/2026/07/2025-paris-mou-annual-report-port-state-control-progress-and-performance-highlights-paris"],["CIC Cargo Securing 2026 – questionnaire","https://parismou.org/system/files/2026-08/Press%20Release%20%26%20Questionnaire%20-%20CIC%20Cargo%20Securing%202026.pdf"],["Med SOx ECA from 1 May 2025 (IMO)","https://www.marinelink.com/news/imo-new-air-pollution-limits-begin-may-525276"],["FuelEU DoC on board by 30 June (LR)","https://www.lr.org/en/fit-for-55/fueleu-regulation/timetable-for-compliance"],["Paris MoU – ship selection (risk intervals)","https://parismou.org/inspection-regime/"],["Paris MoU 59th Committee (fraudulent certificates)","https://www.maritimeprofessional.com/amp/news/paris-tackles-fraudulent-certificates-419831"]],"s":[{"t":["CIC Cargo Securing (until 30 Nov 2026)","CIC Cargo Securing (hanggang 30 Nob 2026)"],"i":[["*","Approved Cargo Securing Manual on board, with clear lashing instructions for every stowage the ship does (Q2a/2b – detainable).","Approved Cargo Securing Manual sa barko, may malinaw na lashing instructions para sa bawat stowage (Q2a/2b – detainable)."],["8A.10","Officers know the CSM and the load limits of tank top, hatch covers and deck (Q3 – detainable).","Alam ng officers ang CSM at ang load limit ng tank top, hatch cover at deck (Q3 – detainable)."],["*","Lashing/securing devices: enough, approved type, good condition, inspected & maintained per CSM, inventory kept (Q7/Q8 – detainable).","Lashing/securing device: sapat, approved na type, maayos, na-inspect at na-maintain ayon sa CSM, may inventory (Q7/Q8 – detainable)."],["*","Deck/project cargo or containers: stowage follows the CSM, VGM in cargo plan, bridge visibility OK (Q4/Q5/Q9 – detainable).","Deck/project cargo o container: sumusunod sa CSM, may VGM sa cargo plan, OK ang bridge visibility (Q4/Q5/Q9 – detainable)."],["*","SMS procedure for heavy weather and preventing cargo loss, and it is followed (Q10).","May SMS procedure para sa heavy weather at para hindi mawala ang cargo, at sinusunod (Q10)."]]},{"t":["Europe specifics","Para sa Europe"],"i":[["7A.9","Med ECA since 1 May 2025: 0.10% S in the whole Mediterranean (also North Sea/Baltic ECA). Changeover before entry, log time/position/quantities, BDN.","Med ECA mula 1 Mayo 2025: 0.10% S sa buong Mediterranean (pati North Sea/Baltic). Changeover bago pumasok, log ng oras/posisyon/dami, BDN."],["7A.9","In EU ports (at berth or port anchorage): 0.10% S (EU Sulphur Directive) — changeover right after berthing, recorded.","Sa EU port (berth o anchorage ng port): 0.10% S (EU Sulphur Directive) — changeover agad pagkadaong, naka-record."],["5.21","Valid FuelEU Document of Compliance on board (from 30 Jun 2026) + EU MRV monitoring plan & DoC. PSCO asks for them.","Valid na FuelEU Document of Compliance sa barko (mula 30 Hun 2026) + EU MRV monitoring plan at DoC. Hihingin ng PSCO."],["*","IHM (Inventory of Hazardous Materials) with Statement of Compliance — EU Ship Recycling Regulation for non-EU flag ships.","IHM (Inventory of Hazardous Materials) na may Statement of Compliance — EU Ship Recycling Regulation para sa non-EU flag."],["5.19","Waste: advance waste notification before arrival, garbage delivered, waste delivery receipt kept with GRB.","Waste: advance waste notification bago dumating, i-deliver ang basura, itago ang receipt kasama ng GRB."],["15.1","MLC: correct SEAs (#2 single deficiency), wage accounts, real rest hours, food/water, accommodation (MLC Title 4 = 10%).","MLC: tamang SEA (#2 na deficiency), wage account, totoong rest hours, pagkain/tubig, accommodation (MLC Title 4 = 10%)."],["13.29","ER cleanliness & electrical installations: among the most frequent in 2025 (1.3% each) — no oil, no bare wires/broken boxes.","Kalinisan ng ER at electrical: madalas noong 2025 (1.3% bawat isa) — walang langis, walang hubad na wire/sirang box."],["2.13","Certificates/CoCs genuine and correctly endorsed — Paris MoU (May 2026) is targeting fraudulent certificates.","Totoo at tamang endorsed ang certificate/CoC — target ng Paris MoU (Mayo 2026) ang pekeng certificate."],["4.5","Prepare for CIC 2027 Enclosed Space Entry: register, permits, calibrated gas detectors, rescue drills.","Maghanda para sa CIC 2027 Enclosed Space Entry: register, permit, calibrated gas detector, rescue drill."],["*","Ship Risk Profile: high-risk ship normally every 5–6 months, standard 10–12, low 24–36. Overriding/unexpected factors can trigger inspection even after a recent one — check SRP & company performance before the voyage.","Ship Risk Profile: high-risk kada 5–6 buwan, standard 10–12, low 24–36. Pwedeng ma-inspect kahit bago lang dahil sa overriding/unexpected factors — suriin ang SRP at company performance bago bumiyahe."]]}]},{"id":"tokyo","f":"🌏","n":"Tokyo MoU","a":["Asia-Pacific: China, Japan, Korea, Singapore, Indonesia, Vietnam, Philippines, Australia, New Zealand, Canada, Russia, Chile etc. 2025: 35,546 inspections (record), 1,255 detentions (3.53%). Top areas: fire safety, LSA, living/working, navigation.","Asia-Pacific: China, Japan, Korea, Singapore, Indonesia, Vietnam, Philippines, Australia, NZ, Canada, Russia, Chile atbp. 2025: 35,546 inspection (record), 1,255 detention (3.53%). Pinakamadami: fire safety, LSA, living/working, navigation."],"c":["CIC Cargo Securing: 1 Sep – 30 Nov 2026 (joint with Paris — same questions, see Paris MoU). China MSA applies it; C/O accompanies the PSCO. 2027: Enclosed Space Entry.","CIC Cargo Securing: 1 Set – 30 Nob 2026 (kasama ang Paris — parehong tanong, tingnan ang Paris MoU). Sa China, MSA; sasamahan ng C/O ang PSCO. 2027: Enclosed Space Entry."],"p":["Qingdao, Caofeidian, Rizhao, Japan, Korea, Singapore, Indonesia, Vietnam","Qingdao, Caofeidian, Rizhao, Japan, Korea, Singapore, Indonesia, Vietnam"],"src":[["Tokyo MOU Annual Report 2025","https://www.tokyo-mou.org/wp/wp-content/uploads/ANN25.pdf"],["Tokyo MOU 36th Committee (FICs, company lists)","https://www.tokyo-mou.org/press-releases/2025/10/29/tokyo-mou-port-state-control-committee-36th-meeting-in-hong-kong-china"],["Tokyo MOU pilot transfer FIC Feb 2025","https://www.iims.org.uk/?p=56507"],["IACS CIC emergency power tests (2026)","https://marinelink.com/news/iacs-publishes-results-emergency-power-538828"],["Huatai (China MSA) CIC circular","https://www.londonpandi.com/media/ryobbhiv/huatai-circular-2026-06.pdf"],["Tokyo MOU – New Inspection Regime","https://www.tokyo-mou.org/inspections-detentions/nir/"]],"s":[{"t":["Top 10 detainable Tokyo 2025 (count)","Top 10 detainable Tokyo 2025 (bilang)"],"i":[["4.27","Fixed fire-extinguishing (CO2) — 215","Fixed fire-extinguishing (CO2) — 215"],["4.1","ISM — 200","ISM — 200"],["4.18","Lifeboats — 152","Lifeboats — 152"],["14.6","Ventilators, air pipes, casings — 138","Ventilators, air pipes, casings — 138"],["4.28","Fire pumps & pipes — 118","Fire pumps at pipes — 118"],["4.26","Fire detection & alarm — 114","Fire detection at alarm — 114"],["7A.10","Remote means of control (machinery spaces) — 109","Remote means of control (machinery spaces) — 109"],["4.33","Fire dampers — 106","Fire dampers — 106"],["13.11","Maintenance of ship & equipment (ISM) — 104","Maintenance of ship at equipment (ISM) — 104"],["5.15","Oil filtering equipment (OWS) — 92","Oil filtering equipment (OWS) — 92"]]},{"t":["Tokyo MoU specifics","Para sa Tokyo MoU"],"i":[["5.10","Ballast: CIC 2025 — 184 detentions on ships with CIC, 30 due to BWM; most common: BWMS not operated properly. BWMS in use, alarms, BWRB, contingency in BWMP.","Ballast: CIC 2025 — 184 detention, 30 dahil sa BWM; pinakamadalas: hindi tama ang operasyon ng BWMS. Gamitin ang BWMS, alarm, BWRB, contingency sa BWMP."],["4.37","Pilot transfer: deficiencies 197 (2020) → 523 (2024), detentions 1 → 12; FIC Feb 2025. Rigging, side ropes, securing, combination ladder, ISO 799.","Pilot transfer: deficiency 197 (2020) → 523 (2024), detention 1 → 12; FIC Peb 2025. Rigging, side rope, securing, combination ladder, ISO 799."],["13.36","Emergency power: Tokyo MoU questioned 'simulated blackout' tests (IACS CIC 2025). Do a real em'cy gen → ESB test.","Emergency power: kinuwestiyon ng Tokyo MoU ang 'simulated blackout' test (IACS CIC 2025). Gumawa ng totoong em'cy gen → ESB test."],["2.2","Valid insurance certificates (Bunker Convention, Wreck Removal; CLC for tankers) — FIC on insurance certificates with Paris MoU.","Valid na insurance certificate (Bunker, Wreck Removal; CLC para sa tanker) — may FIC sa insurance certificate kasama ang Paris MoU."],["4.1","Company performance: Tokyo MoU publishes company lists quarterly from 1 Jan 2026 — every detention counts against the company.","Company performance: naglalabas ang Tokyo MoU ng listahan ng kumpanya kada quarter mula 1 Ene 2026 — bawat detention ay laban sa kumpanya."],["*","China (CIC): C/O checks all cargo securing before port, keeps a record, and accompanies the PSCO for the whole inspection.","China (CIC): sinusuri ng C/O ang lahat ng cargo securing bago dumating, may record, at sasamahan ang PSCO sa buong inspection."],["*","Tokyo NIR differs from Paris (type, age, flag/RO/company, history) — never assume the same risk. The Committee raised improper certificate extensions as a concern.","Iba ang NIR ng Tokyo sa Paris (type, edad, flag/RO/company, history) — huwag ipagpalagay na pareho. Pinuna ng Committee ang maling extension ng certificate."]]}]},{"id":"amsa","f":"🇦🇺","n":"AMSA","a":["Australia (member of Tokyo & Indian Ocean MoU). Bulk carriers = 51.8% of arrivals and 58% of inspections (1,604 in 2025). 2025 PSC detainable: ISM 26.7%, water/weathertight 17.1%, LSA 14.1%. MLC 2025: 12 detentions, 58.6% of complaints from bulk carriers, #1 issue hours of work/rest.","Australia (miyembro ng Tokyo at Indian Ocean MoU). Bulk carrier = 51.8% ng dating at 58% ng inspection (1,604 noong 2025). Detainable 2025: ISM 26.7%, water/weathertight 17.1%, LSA 14.1%. MLC 2025: 12 detention, 58.6% ng reklamo galing bulk, #1 hours of work/rest."],"c":["Takes part in CIC Cargo Securing 1 Sep – 30 Nov 2026. Ran FIC Marine Order 32 (cargo securing) 30 Mar–25 Apr 2026. Target ≥2,400 PSC per year.","Kasali sa CIC Cargo Securing 1 Set – 30 Nob 2026. Nagkaroon ng FIC Marine Order 32 (cargo securing) 30 Mar–25 Abr 2026. Target ≥2,400 PSC kada taon."],"p":["Port Hedland, Dampier, Newcastle, Gladstone, Hay Point, Kwinana, Port Kembla","Port Hedland, Dampier, Newcastle, Gladstone, Hay Point, Kwinana, Port Kembla"],"src":[["AMSA Inspections Report 2025","https://www.amsa.gov.au/sites/default/files/2026-03/2025-Inspections-Report.pdf"],["AMSA MLC Annual Report 2025","https://www.amsa.gov.au/vessels-operators/seafarer-welfare/maritime-labour-convention-annual-reports/mlc-2025"],["AMSA Bulletin #23 – Pilot transfer (Mar 2026)","https://www.amsa.gov.au/news-community/newsletters/maritime-safety-awareness-bulletins/issue-23-pilot-transfer"],["Marine Order 32 – Cargo handling equipment","https://www.amsa.gov.au/about/regulations-and-standards/marine-order-32-cargo-handling-equipment"],["DAFF – vessel pre-arrival reporting (MARS)","https://agriculture.gov.au/biosecurity/avm/vessels"],["BIMCO – FSMC (gypsy moth) season 2026","https://www.bimco.org/news-insights/bimco-news/2026/04/09-fsmc/"],["AMSA – during a PSC inspection","https://www.amsa.gov.au/vessels-operators/port-state-control/during-port-state-control-inspection"],["AMSA MN 2025/06 – oil filtering equipment","https://www.amsa.gov.au/about/regulation-standards/202506-testing-and-inspection-oil-filtering-equipment-mepc10749"],["AMSA MN 2026/01 – invalid extensions","https://www.amsa.gov.au/about/regulations-and-standards/marine-notices/202601-invalid-extensions-statutory-certification-0"]],"s":[{"t":["What AMSA detains bulkers for","Dahilan ng AMSA detention sa bulk"],"i":[["14.6","Ballast tank air pipes: floats & seals (inside), cover plates, closing devices — water/weathertight = 17.1% of detainables.","Ballast tank air pipe: float at seal (sa loob), cover plate, closing device — water/weathertight = 17.1% ng detainable."],["9A.5","Hatch covers: drain valves (double drainage) clear and working, closure preventers in use, cleats, rubbers.","Hatch cover: malinis at gumagana ang drain valve (double drainage), ginagamit ang closure preventer, cleat, rubber."],["6.4","Hold access ladders (vertical & 'Australian ladders'): checked full length — rungs, supports, platforms. Stevedores use them.","Hold access ladder (vertical at 'Australian ladder'): suriin buong haba — rungs, suporta, platform. Ginagamit ng stevedores."],["9A.17","Marine Order 32: cranes, grabs, loose gear — register, certificates, thorough examination, SWL, limit switches; safe access for stevedores.","Marine Order 32: crane, grab, loose gear — register, certificate, thorough examination, SWL, limit switch; ligtas na daanan ng stevedores."],["5.15","OWS/OCM operational, no leaks, correct pressure, alarms not off-scan.","Gumagana ang OWS/OCM, walang tagas, tamang pressure, hindi off-scan ang alarm."],["4.37","Pilot transfer (AMSA Bulletin #23, Mar 2026): detention and prosecution for unsafe transfer — rigging, side ropes, securing, combination ladder, risk assessment.","Pilot transfer (AMSA Bulletin #23, Mar 2026): detention at kaso para sa delikadong transfer — rigging, side rope, securing, combination ladder, risk assessment."],["2.5","MLC: REAL rest hours (no copy-paste), wages & wage accounts, SEA, food — AMSA bans ships for underpayment.","MLC: TOTOONG rest hours (walang copy-paste), sahod at wage account, SEA, pagkain — nagba-ban ang AMSA dahil sa kulang na sahod."],["4.1","ISM = #1 detainable (26.7%): PMS up to date, defects reported, procedures actually followed.","ISM = #1 detainable (26.7%): updated ang PMS, naka-report ang sira, sinusunod talaga ang procedure."]]},{"t":["Before arriving in Australia","Bago dumating sa Australia"],"i":[["*","DAFF biosecurity: Pre-Arrival Report in MARS 96 to 12 hours before arrival, including biofouling questions.","DAFF biosecurity: Pre-Arrival Report sa MARS 96 hanggang 12 oras bago dumating, may biofouling na tanong."],["5.10","Ballast Water Report in MARS + BWMS/D-2, correct BWRB, contingency measure if any.","Ballast Water Report sa MARS + BWMS/D-2, tamang BWRB, contingency measure kung meron."],["*","FSMC (gypsy moth): if the ship called a regulated area in the risk period in the last 24 months, it will be checked — do a self-inspection.","FSMC (gypsy moth): kung pumunta sa regulated area sa risk period sa huling 24 buwan, susuriin — mag-self-inspection."]]},{"t":["During the AMSA inspection","Sa AMSA inspection"],"i":[["*","At the start the Master is asked about known defects affecting seaworthiness and signs a declaration — tell the truth; early reporting changes how a problem is treated.","Sa simula, tatanungin ang Master tungkol sa alam na sira at pipirma ng declaration — sabihin ang totoo; iba ang trato kapag maaga ni-report."],["5.15","OWS (MEPC.107(49)): clean-water flushing must trigger alarm & stop; monitor ≤5 s, total auto-stop ≤20 s; test only in recirculation (AMSA MN 2025/06).","OWS (MEPC.107(49)): ang clean-water flushing ay dapat mag-alarm at huminto; monitor ≤5 s, auto-stop ≤20 s; test sa recirculation lang (AMSA MN 2025/06)."],["2.1","A certificate extension does NOT legitimise commercial trading — only per the Convention and voyage to the survey port; otherwise detention (AMSA MN 2026/01).","HINDI pinapayagan ng extension ang commercial trading — ayon lang sa Convention at biyahe papunta sa survey port; kung hindi, detention (AMSA MN 2026/01)."],["4.18","Lifeboat entry: additional restraints if the release cannot be shown correctly set. A detention closes only when an AMSA/Tokyo PSCO sights the fix — notify psc@amsa.gov.au.","Lifeboat entry: dagdag na restraint kung hindi maipakitang tama ang release. Sarado lang ang detention kapag nakita ng AMSA/Tokyo PSCO — i-notify ang psc@amsa.gov.au."]]}]},{"id":"uscg","f":"🇺🇸","n":"USCG","a":["USA — not an MoU; own targeting (owner/operator, flag, class, history). 2025: 8,999 PSC exams, 77 detentions. Detention reasons: SMS/ISM (62 deficiencies), fire safety (53 — #1 oil accumulation in ER, then fire detection, CO2, fire doors, fire drills/crew performance, remote controls), certificates (14).","USA — hindi MoU; sariling targeting (owner/operator, flag, class, history). 2025: 8,999 PSC exam, 77 detention. Dahilan: SMS/ISM (62), fire safety (53 — #1 langis sa ER, sunod fire detection, CO2, fire door, fire drill/crew performance, remote control), certificate (14)."],"c":["Does not run the Paris/Tokyo CICs. Runs its own enhanced exams (e.g. ballast water, drills).","Hindi kasali sa CIC ng Paris/Tokyo. May sariling enhanced exam (hal. ballast water, drill)."],"p":["Mississippi River / New Orleans (grain), Houston, Corpus Christi, Baltimore, Norfolk, Columbia River, Long Beach","Mississippi River / New Orleans (grain), Houston, Corpus Christi, Baltimore, Norfolk, Columbia River, Long Beach"],"src":[["USCG 2025 PSC Annual Report","https://www.news.uscg.mil/maritime-commons/Article/4495805/2025-port-state-control-annual-report-posted/"],["2025 detention breakdown (SAFETY4SEA)","https://safety4sea.com/uscg-annual-psc-report-2025-77-vessels-detained-during-the-year/"],["USCG – ballast water FAQs (Nov 2025)","https://www.dco.uscg.mil/Our-Organization/Assistant-Commandant-for-Prevention-Policy-CG-5P/Commercial-Regulations-Standards-CG-5PS/Office-of-Operating-and-Environmental-Standards-CG-OES/Environmental-Standards/FAQ/"],["33 CFR 164.25 – tests before entering","https://www.ecfr.gov/current/title-33/chapter-I/subchapter-P/part-164/section-164.25"],["USCG Sector NY – arrival guidance (NOA, VRP, COFR)","https://www.nymaritime.org/uscg-sector-ny-resources/vessel-arrival-guidance"],["EPA – 2013 VGP stays until VIDA rules","https://www.epa.gov/system/files/documents/2023-01/vgpcwaenfalert11023.pdf"],["BIMCO – FSMC (gypsy moth) season 2026","https://www.bimco.org/news-insights/bimco-news/2026/04/09-fsmc/"]],"s":[{"t":["Before entering US waters","Bago pumasok sa US waters"],"i":[["*","eNOAD ≥96 hours before arrival (voyage <96 h: before departure and ≥24 h before arrival). Update if ETA/ETD changes ≥6 h.","eNOAD ≥96 oras bago dumating (biyahe <96 h: bago umalis at ≥24 h bago dumating). I-update kung magbago ang ETA/ETD ≥6 h."],["*","Inoperative equipment (nav, OWS, BWMS etc.) reported BEFORE arrival to COTP/in NOA, with repair plan. Not reported = serious problem.","Sirang equipment (nav, OWS, BWMS atbp.) i-report BAGO dumating sa COTP/NOA, may plano ng repair. Hindi ni-report = malaking problema."],["13.40","33 CFR 164.25: ≤12 h before entry, test steering gear (main & aux), bridge–steering comms etc. + emergency steering drill ≤48 h before (or every 3 months) — all logged.","33 CFR 164.25: ≤12 h bago pumasok, i-test ang steering gear (main at aux), komunikasyon bridge–steering atbp. + emergency steering drill ≤48 h bago (o kada 3 buwan) — lahat naka-log."],["*","Approved Nontank Vessel Response Plan (≥400 GT) with appendix for the port + valid COFR — otherwise denied entry.","Approved Nontank Vessel Response Plan (≥400 GT) na may appendix para sa port + valid na COFR — kung wala, hindi papapasukin."],["5.10","Ballast: USCG type-approved BWMS (or approved alternative/extension), BWMP, ballast report before arrival. BWMS failure → report to COTP.","Ballast: USCG type-approved na BWMS (o approved alternative/extension), BWMP, ballast report bago dumating. Sira ang BWMS → i-report sa COTP."],["*","2013 VGP still applies (until VIDA rules are in force): VGP inspections & records, annual report, EAL lubricants at oil-to-sea interfaces.","May bisa pa ang 2013 VGP (hanggang VIDA rules): VGP inspection at record, annual report, EAL lubricant sa oil-to-sea interface."],["*","FSMC (gypsy moth): if the ship called Russian Far East/Japan/Korea/N. China in the risk period in the last 24 months → pre-departure certificate.","FSMC (gypsy moth): kung pumunta sa Russian Far East/Japan/Korea/N. China sa risk period sa huling 24 buwan → pre-departure certificate."],["7A.9","North American & US Caribbean ECA: 0.10% S — changeover before entry, log, BDN & samples.","North American at US Caribbean ECA: 0.10% S — changeover bago pumasok, log, BDN at sample."],["3.16","Charts & publications for US waters: US Coast Pilot, Light List, Tide & Current tables (or equivalent), ENCs updated.","Chart at publication para sa US waters: US Coast Pilot, Light List, Tide at Current tables (o katumbas), updated ang ENC."]]},{"t":["What the USCG checks in the exam","Tinitingnan ng USCG sa exam"],"i":[["13.29","Oil accumulation in ER = #1 fire-safety detention 2025: clean tank tops & bilges, no leaks, no oil-soaked lagging.","Langis sa ER = #1 fire-safety detention 2025: malinis ang tank top at bilge, walang tagas, walang langis sa insulation."],["5.1","MARPOL Annex I: ORB = soundings = OWS/incinerator records; never a bypass ('magic pipe') — USCG prosecutes criminally.","MARPOL Annex I: ORB = sounding = OWS/incinerator record; bawal ang bypass ('magic pipe') — kinakasuhan ng USCG."],["4.9","Fire & abandon ship drill in front of PSCO — 'fire drills/crew performance' among 2025 detention reasons.","Fire at abandon ship drill sa harap ng PSCO — 'fire drill/crew performance' ay dahilan ng detention 2025."],["4.26","CO2, fire detection, fire doors, remote means of control — all on the 2025 detention list. Test them before.","CO2, fire detection, fire door, remote control — lahat nasa detention list 2025. I-test bago dumating."],["5.19","Garbage: 'regulated garbage' (food from foreign ports) in closed containers, no discharge in US waters, receipts (USDA/APHIS).","Basura: 'regulated garbage' (pagkain galing ibang bansa) sa saradong lalagyan, bawal itapon sa US waters, may resibo (USDA/APHIS)."],["12.1","ISPS: access control, visitor log, DoS when requested — USCG also does a security exam.","ISPS: access control, visitor log, DoS kung hihingin — may security exam din ang USCG."],["5.10","An NBIC report is NOT a discharge authorisation, and ballast exchange alone is NOT an accepted alternative where the US discharge standard applies (USCG BWM FAQ, Nov 2025).","HINDI pahintulot sa discharge ang NBIC report, at HINDI tanggap ang ballast exchange lang kung saan may US discharge standard (USCG BWM FAQ, Nob 2025)."]]}]},{"id":"canada","f":"🇨🇦","n":"Canada","a":["Canada is a member of BOTH the Paris MoU (east: Quebec, St. Lawrence, Sorel) and the Tokyo MoU (west: Vancouver). Transport Canada inspectors are strict, especially on bulk carriers. A recent detention raises the risk profile → expanded inspection. Full walk-round: 📘 Manuals → Zero Deficiency Canada.","Miyembro ang Canada ng Paris MoU (silangan: Quebec, St. Lawrence, Sorel) at Tokyo MoU (kanluran: Vancouver). Mahigpit ang Transport Canada, lalo sa bulk carrier. Ang bagong detention ay nagpapataas ng risk → expanded inspection. Buong walk-round: 📘 Manuals → Zero Deficiency Canada."],"c":["CIC Cargo Securing until 30 Nov 2026 (Paris & Tokyo). Whales: NARW Gulf of St. Lawrence season to 15 Nov 2026, ECHO Haro Strait to 30 Nov 2026.","CIC Cargo Securing hanggang 30 Nob 2026 (Paris at Tokyo). Balyena: NARW Gulf of St. Lawrence hanggang 15 Nob 2026, ECHO Haro Strait hanggang 30 Nob 2026."],"p":["Vancouver (BC), Quebec, St. Lawrence, Sorel, Port-Cartier, Sept-Îles","Vancouver (BC), Quebec, St. Lawrence, Sorel, Port-Cartier, Sept-Îles"],"src":[["Transport Canada – TP 15611 grain loading","https://tc.canada.ca/en/marine-transportation/publications/tp-15611-guidance-masters-vessels-loading-grain-bulk"],["Transport Canada – SSB 02/2026 NARW speed restriction","https://tc.canada.ca/en/marine-transportation/marine-safety/ship-safety-bulletins/protecting-north-atlantic-right-whale-speed-restriction-measures-gulf-st-lawrence-ssb-no-02-2026"],["Ballast Water Regulations SOR/2021-120","https://laws-lois.justice.gc.ca/eng/regulations/SOR-2021-120/FullText.html"],["NOTMAR A7D – winter navigation St. Lawrence","https://www.notmar.gc.ca/publications/annual/section-a/a7d-en"],["Port of Vancouver – ECHO 2026 slowdowns","https://www.portvancouver.com/article/2026_voluntary_slowdowns_and_route_alteration"],["Hong Kong MD – detention list 2025","https://www.mardep.gov.hk/filemanager/en/share/faq/pdf/detentlist2025.pdf"]],"s":[{"t":["Canadian rules (Vancouver / Quebec)","Mga patakaran sa Canada (Vancouver / Quebec)"],"i":[["7A.9","North American ECA: 0.10% S inside 200 nm (also covers the Gulf and River St. Lawrence) — log the changeover.","North American ECA: 0.10% S sa loob ng 200 nm (kasama ang Gulf at River St. Lawrence) — i-log ang changeover."],["5.10","Ballast Water Regulations SOR/2021-120: D-2 BWMS, BWRB, ballast report before arrival; extra measures if discharging in fresh water (St. Lawrence) — check with agent.","Ballast Water Regulations SOR/2021-120: D-2 BWMS, BWRB, ballast report bago dumating; dagdag na measures kung sa fresh water (St. Lawrence) — tanungin ang agent."],["3.23","Whales: NARW zones Gulf of St. Lawrence (10 kn when a whale is detected); ECHO Haro Strait/Boundary Pass 11 kn for bulkers. TC checks AIS and asks the Master.","Balyena: NARW zones Gulf of St. Lawrence (10 kn kapag may balyena); ECHO Haro Strait/Boundary Pass 11 kn para sa bulker. Sinusuri ng TC ang AIS at magtatanong."],["8B.10","Grain: Transport Canada Certificate of Readiness to Load (TP 15611) + CFIA hold inspection — holds free of grit, loose scale, flaking paint, old cargo.","Grain: Transport Canada Certificate of Readiness to Load (TP 15611) + CFIA hold inspection — walang grit, maluwag na kalawang, natutuklap na pintura, lumang cargo."],["4.37","Pilots: Pacific & Laurentian Pilotage report bad pilot ladders straight to TC. Laurentian winter: 3 cm stabilised radar, bridge heating, visibility.","Pilot: nire-report agad ng Pacific at Laurentian Pilotage sa TC ang masamang ladder. Taglamig sa Laurentian: 3 cm stabilised radar, bridge heating, visibility."],["13.32","Quebec winter (Dec–Mar): sea-water cooling protected against ice/frazil ice; non-compliant ships can be stopped west of Les Escoumins (winternav@tc.gc.ca).","Taglamig sa Quebec (Dis–Mar): protektado sa yelo/frazil ice ang sea-water cooling; pwedeng pigilan west ng Les Escoumins (winternav@tc.gc.ca)."],["5.27","Sewage / grey water: no visible solids, film or sheen from any discharge.","Sewage / grey water: walang makikitang solids, film o sheen sa anumang discharge."],["15.1","MLC: Canadian PSCOs ask who has been on board >11 months — nobody over 11 months on arrival. Crew complaints go straight to TC.","MLC: tinatanong ng Canadian PSCO kung sino ang >11 buwan — walang lampas 11 buwan pagdating. Diretso sa TC ang reklamo."]]},{"t":["Real Canadian detentions 2025","Totoong detention sa Canada 2025"],"i":[["4.18","Quebec 22 Jan 2025: lifeboat & rescue boat engines did not start · davit would not swing on reserve power · M/E fuel pump leaking · sewage UV dead · anti-fouling peeling into the St. Lawrence · broken faucets · ISM audit before departure.","Quebec 22 Ene 2025: hindi umandar ang lifeboat at rescue boat · hindi gumalaw ang davit sa reserve power · tumutulo ang fuel pump ng M/E · patay ang sewage UV · natutuklap ang anti-fouling · sirang gripo · ISM audit bago umalis."],["9A.7","Quebec area 24 Apr 2025: No.4 hatch coaming holed · water-ingress alarms active in 3 holds · fire doors not closing · paint locker sprinkler perforated · poor embarkation ladders · missing DG records & NOx IDs · ISM.","Quebec 24 Abr 2025: butas ang No.4 hatch coaming · aktibo ang water-ingress alarm sa 3 hold · hindi sumasara ang fire door · butas ang sprinkler ng paint locker · masamang embarkation ladder · kulang ang DG record at NOx ID · ISM."],["13.42","Vancouver 22 Jul 2025: crew unfamiliar with emergency steering · poor fire drill, Master unfamiliar with fire systems · OOW not familiar with ECDIS, echo sounder, gyro, Inmarsat · hatch cover hydraulic leaks · ISM.","Vancouver 22 Hul 2025: hindi alam ng crew ang emergency steering · mahinang fire drill, hindi alam ng Master ang fire system · hindi alam ng OOW ang ECDIS, echo sounder, gyro, Inmarsat · tagas ng hatch cover hydraulics · ISM."],["5.15","Vancouver 8 Aug 2025: officer could not run the OWS · emergency towing equipment not found · crew could not don SCBA · 3/O did not know CO2 · ER escape locked · OWS piping replaced by plastic hose (burst) · ISM.","Vancouver 8 Ago 2025: hindi napaandar ng officer ang OWS · hindi nakita ang emergency towing equipment · hindi naisuot ng crew ang SCBA · hindi alam ng 3/O ang CO2 · naka-lock ang ER escape · plastic hose sa OWS piping (pumutok) · ISM."]]}]}]};

professionally","Single escort, valid documents, tested systems, accurate answers, log every observation."]],"rule":"A clean binder cannot rescue an unsafe ship. A functioning ship without honest, traceable evidence can still attract serious findings. Both are required.","ladder":[["C / MINOR","Limited, contained shortfall","Record / rectify in approved time / verify closure"],["B / MAJOR","Clear grounds / operational or statutory deficiency","Notify Master + Company; authority guidance; corrective plan before use"],["A / CRITICAL","Immediate danger, serious pollution, cannot sail safely","Stop the operation; Master + DPA/Technical + Flag/RO/port; no departure until authorized"]],"camp":[["T-30 to T-21 days","Intelligence & standards: voyage profile, last 36-month PSC records and CAPs, RO items, survey status, drydock findings, near-misses, national notices, local entry/ballast/emission rules. Assign owner and focal points."],["T-20 to T-8 days","Real technical assurance: compartment-by-compartment inspection, safe alarm/actuator tests, spares and service agents, independent cross-check of safety-critical gear, find 'works only after reset' faults."],["T-7 days","Verifiable completion: close findings with test, photo, PMS job card, signed notes, updated defect log; bridge/engine walkthroughs; crew practical questions; Class/Flag approvals actually issued."],["T-72 hours","High-risk re-check: re-test failed equipment, emergency gear, machinery alarms, escapes, firefighting; cargo plans, pilot transfer, passage plan, ballast plan, US/Australian reporting deadlines; readiness meeting."],["T-24 h / arrival","Final walk-round: gangway, freeboard, hatch covers, deck oil, fire doors, emergency gear; known defects and declarations; evidence binder and officer assignments."],["On inspection","Welcome, single escort, safety boundaries; no unsupervised high-energy tests; documents promptly; demonstrate safely; record every question; seek written record."],["After inspection","Classify findings, root cause, sustainable CAPA, close with evidence and authority acceptance, share fleet lessons."]],"m2s":"Never let the shore office discover a critical failed system from the PSCO. Early notification and truthful engagement are signs of control, not weakness.","ev":["01 Certificates / surveys / RO status / exemptions / conditions of class; applicability matrix","02 ISM, DPA contacts, defect log, risk assessments, permits, drills, incident lessons","03 Navigation, ECDIS/chart status, passage plans, GMDSS and radio tests","04 Fire safety / LSA / emergency power / safety-critical maintenance and tests","05 MARPOL / BWMS / ORB / BWRB / GRB / emissions / sewage / port discharge rules","06 Cargo, stability, hatch covers, hull, mooring, pilot ladder, lifting gear","07 MLC / seafarer certificates / medical / SEA / hours of rest / welfare and complaints"],"ext":"AMSA Marine Notice 2026/01: a certificate extension does not by itself legitimise continued commercial trading. It must follow the Convention provision and the voyage-to-survey limits — otherwise detention and possible RO attribution. [R16]","ch":[{"k":"08","t":"Statutory documents & class","tf":"Statutory documents at class","q":["2.1","2.4","2.13","3.16"],"stop":"Expired critical certificate; unapproved exemption; open class condition affecting seaworthiness; invalid extension.","i":[["A","SOLAS/Load Line/IOPP/ISPP/IAPP/ISSC/SMC and relevant documents valid for ship and service","Endorsed dates, annexes, surveys, applicability matrix"],["A","RO conditions/recommendations and Flag dispensations reconciled with physical status","Current RO portal + written status; no undocumented overdue issue"],["A","Extensions checked under actual legal basis and voyage route","Flag/RO letter plus voyage and survey port matching conditions"],["B","Minimum Safe Manning vs actual crew by rank, licence, medical and STCW","Manning doc, endorsements, certificates, crew roster"],["B","DOC/SMC, MLC/DMLC, financial security, insurer evidence verified","Originals/approved copies, endorsements, expiry register"],["B","Approved stability data and loading instrument certificates/access","Loading booklet, test evidence, software version"],["B","Cargo certificates: grain/DG/IMSBC/IGC/IBC where applicable","Ship-type applicability and approvals"],["B","BWM certificate, approved BWMP, record book, BWMS documents","Approval, commissioning, manuals, logs"],["B","Ship radio certificate/licence, GMDSS documents, equipment inventory","Record of Equipment, logs, shore-based maintenance"],["B","CSR, registry and name/IMO/class particulars consistent","Full CSR trail and valid registration"],["C","IHM/AFS/EEDI/EEXI/CII/SEEMP and energy documents","Applicability review and evidence"],["C","Mandatory publications, correction services and charts updated","Latest editions / subscriptions / logs"],["C","Documents organised with controlled originals and true translations","Index with holder and last verification date"],["B","Survey due dates and statutory windows checked 6 months forward","Written voyage-aware survey plan"]],"how":["Pick three documents at random: issue → endorsement → annex → actual installation.","Ask the Master which conditions are outstanding; compare with the RO portal.","Reconcile certificate names, numbers and equipment inventory with fitted appliances."]},{"k":"09","t":"ISM, PMS & defect governance","tf":"ISM, PMS at pamamahala ng sira","q":["4.1","4.3","4.10","13.11"],"stop":"Concealed critical defect; recurrent defect with no root-cause action; unapproved bypass of safety equipment.","i":[["A","All safety-critical defects known to Master/C/E and reported through SMS","Open defect register and reporting trail"],["A","No overdue safety-critical PMS tasks without risk assessment and approved mitigation","PMS dashboard, work orders, comments"],["A","Defects needing Flag/RO/PSC notification have been notified","Timestamped messages and acknowledgements"],["B","Corrective actions policy","Calculation sheet; settings and alarm validation"],["B","ENC permits and corrections current for route and backups","Update record, permit expiry, backup plan"],["B","GNSS, radars, echo sounder and heading cross-checked","Bridge test log, differences within limits"],["B","Radars, ARPA, AIS and target acquisition working","Test record, radar status"],["B","GMDSS tests and distress equipment serviceable","GMDSS log and self-tests"],["B","BNWAS, VDR/S-VDR, nav lights and whistle","Real test / annual VDR performance test"],["B","Magnetic/gyro errors recorded; repeaters aligned","Error logs, comparisons, defects"],["B","Standing orders, Master call criteria, restricted visibility explained","Team interview, signed orders"],["B","Position fixing and parallel indexing practical","Officer demonstration"],["B","Pilot exchange and briefing contain local hazards","Pilot card, manoeuvring booklet, MPX"],["C","Portable means / lookout arrangements","Binoculars, lights, clear view, wipers"]],"how":["Ask the OOW to show the next port approach and explain XTD near a critical obstruction.","Compare route-alarm handling with the SMS and past near-misses.","Observe live chart-correction status and backup ECDIS readiness."]},{"k":"11","t":"Fire detection & fire boundaries","tf":"Fire detection at fire boundary","q":["4.27","4.24","4.28","14.5","4.26","4.33","7A.10","4.29","4.30"],"stop":"Inoperable fixed firefighting; impaired fire main; fire detection disabled in a vital zone; compromised ER boundary.","i":[["A","Fixed CO2/foam/water-mist ready with correct controls and seals","Service report, control cabinet, maker confirmation"],["A","Fire main pressure and emergency fire pump demonstrable","Safe test and pressure logs"],["A","Fire doors self-close, latch, no illegal hold-open devices","Fire-door survey by zone"],["A","Fire detection panel free of faults; detectors functional","Cause/effect and defect screen"],["A","Fire dampers, vent stops and fuel QCVs accessible","Safe demonstration per test plan"],["A","ER escape routes free; doors, steps, lighting usable","Walkthrough and visual proof"],["B","Portable extinguishers: location, type, service","Inventory, tags, weights"],["B","Hydrants, hoses, nozzles, spanners complete","Locations vs fire control plan"],["B","Fireman's outfits, SCBA pressure and spare cylinders","SCBA inventory/service and fit training"],["B","Fire control plan current, displayed, duplicates available","Layout vs actual modifications"],["B","Paint/chemical locker boundaries, ventilation, extinguishing","Inspections and test evidence"],["B","Galley extinguishing and cooking-oil arrangements","Service report and access"],["B","Remote stops for pumps/fans labelled and functional","Safe controlled demonstration"],["B","Detection zones and alarm audibility verified","Selected zone test and acknowledgement"],["C","Fire stations, routes and instructions legible","Walkdown photos"]],"how":["Test representative fire doors on each deck, including those used most.","Ask the 3/E to trace emergency fire pump suction and operation.","Never discharge fixed agent to 'show it works' — use approved test methods."]},{"k":"12","t":"Life-saving appliances & rescue","tf":"Life-saving appliances at rescue","q":["4.18","4.19","4.20","4.21","11.3","11.6","4.42"],"stop":"Unsafe hook/release; required lifeboat unusable; muster alarm unserviceable; unsafe launching brake.","i":[["A","Lifeboat/rescue boat release gear free of unapproved modifications","Maker manual, survey record, inspection"],["A","Falls, hooks, winches, brakes, limit switches serviceable","Authorised inspection and safe test"],["A","Embarkation arrangements, gripes, blocks and access correct","Visual evidence from competent crew"],["A","Boat engine, steering, communications, starting battery usable","Safe start per maker and local rules"],["B","Mandatory LSA inspections/service by authorised people in date","Reports and certificates"],["B","Liferafts secured, painter attached, HRU dates valid","Walkdown and serial register"],["B","EPIRB/SART/AIS-SART carriage and tests current","Battery expiry / registration / test"],["B","Lifejackets, immersion suits as applicable","Number, condition, location"],["B","Muster list matches crew and duties; understood","Muster roll, drill answers"],["B","General alarm and PA working","Routine test per SMS"],["B","Rescue boat deployment risk-assessed, people competent","Training and approved lowering method"],["B","Emergency lighting on escape and embarkation routes","Physical checks"],["C","Posters, retro-reflectors, labels legible","Readability and stowage check"],["B","LSA spares and hydraulic fluids, no leaks","Condition and defect reports"]],"how":["Open boats only in a maker-compliant safe configuration; never enter if release/securing is not safe.","Controlled engine start and alarm drill — no hazardous launch when conditions do not permit.","Cross-check annual/5-yearly service against SOLAS/MSC resolutions and equipment age."]},{"k":"13","t":"Emergency power, steering & machinery","tf":"Emergency power, steering at makina","q":["13.36","13.40","13.41","13.19","13.31","13.21"],"stop":"Failed emergency generator; failed steering redundancy; machinery shutdown integrity impaired; unprotected hot oil leak.","i":[["A","Emergency generator starts and takes essential loads","V/Hz, transfer and load test record"],["A","Steering gear main/aux modes with bridge communication","Pre-departure and local steering demo"],["A","ME/AE shutdowns, protective alarms, critical sensors","Alarm test sheet and known deficiencies"],["A","Emergency batteries and distribution boards","Voltage, capacity test, condition"],["B","Bilge high-level and flooding alarms operate","Controlled sensor test"],["B","Emergency bilge suction valves identified","Valve map and crew walk-through"],["B","Boilers, compressors, pressure safety devices serviced","Certification and run tests"],["B","Leaks, hot surfaces and insulation corrected","Walkdown, turbo/ME insulation"],["B","High-temp, oil-mist and crankcase protection maintained","PMS and maker test records"],["B","Cable penetrations, emergency circuits, earthing sound","Area inspection"],["B","Cooling, fuel/LO changeovers tested where safe","Operational test and SOP familiarity"],["B","Remote emergency stops and QCVs known","Crew demonstration without plant disruption"],["C","ER housekeeping and escape equipment","Rags, oil, ladders, lighting"]],"how":["Witness emergency generator auto-start/transfer by an authorised method with contingency ready.","Observe the local steering test with bridge and engine crew.","Check repaired ME exhaust/turbo insulation for hot exposure and oil splash."]},{"k":"14","t":"MARPOL I: OWS / 15 ppm monitor","tf":"MARPOL I: OWS / 15 ppm","q":["5.15","5.1","5.14"],"stop":"OWS bypass or manipulation; non-representative sample; failed alarm/stopping valve; records inconsistent with discharge.","i":[["A","OWS approved and piping matches approved drawings","IOPP and schematic / tracer walk"],["A","Representative effluent flows to the oil content monitor","Genuine sample flow in recirculation test"],["A","Alarm and stopping device activate on high oil content","Approved alarm test + valve transition"],["A","Clean-water flushing does not bypass alarm/auto-stop","Opening flush valve → alarm and stop (AMSA)"],["A","No unsealed bypass or isolated sample line while overboard enabled","Valve configuration and seal review"],["A","Fail-safe on loss of sample flow / monitor failure","Approved fault simulation"],["B","OCM calibration/service current","Certificate, serial, trend logs"],["B","Test done in safe recirculation, not overboard","Test method, valves, risk assessment"],["B","ORB reconciles with soundings, transfers, receipts","ORB, tank logs, sludge receipts"],["B","Sludge/bilge tank valves, soundings, level alarms","Piping and level verification"],["B","Officer demonstrates start, alarm response, shutdown","Live controlled demonstration"],["B","Discharge limits and local restrictions checked","MARPOL and port instructions"],["B","No undocumented changes to 3-way valve or OCM sample pipes","System vs approved drawings"],["C","Daily rounds include leaks, seals, alarms, sample line","PMS checklist"]],"how":["MEPC.107(49) equipment: AMSA expects monitor indication ≤5 s and total auto-stop ≤20 s — apply to the correct standard.","Demonstrate the clean-water flushing interlock in recirculation, never real overboard discharge.","Never coach crew to conceal a bypass — preserve evidence and escalate."]},{"k":"15","t":"MARPOL IV, V, VI & pollution control","tf":"MARPOL IV, V, VI at polusyon","q":["5.27","5.19","7A.9","5.21","5.2","5.23"],"stop":"Illegal overboard discharge; disabled pollution control; missing mandated response capability.","i":[["A","Sewage system and discharge mode compliant with location","ISPP, sewage log, mode"],["A","Oil/chemical leaks to sea prevented; scupper controls work","Deck containment, SOPEP gear"],["B","Garbage plan, segregation and GRB accurate","Bins, postings, GRB, receipts"],["B","Annex VI sulphur compliance with ECA route and BDN/sample","BDNs, changeover log"],["B","Fuel flashpoint supplier declaration where required","Supplier document, bunker checklist"],["B","Incinerator approval, practice and records","Certificate, manual, sludge record"],["B","ODS log and refrigerant control","Log and service reports"],["B","EGCS records / washwater use per local rules","Port status, logs"],["B","Bunkering SOPEP drills, drip trays, scupper plugs","Equipment and drill familiarity"],["B","SEEMP / DCS / CII data and verifier requirements","Approved plan, statements"],["B","Pollution response contacts and SOPEP/SMPEP current","Port-state contact procedures"],["C","Garbage signage, placards and bins","Walkthrough and crew questions"],["B","Ballast/pollution alarms and line isolation, no bypass","Inspection and controller status"]],"how":["Trace five random ORB/GRB entries against operational records.","Ask crew where food waste, plastics and bilge water may legally go on this route.","Check national/local EGCS, sewage and garbage rules before arrival."]},{"k":"16","t":"Ballast water & biosecurity","tf":"Ballast water at biosecurity","q":["5.10"],"stop":"Unauthorised BWMS bypass; prohibited discharge; unreported US BWMS malfunction; no approved contingency.","i":[["A","BWMS in service, approved for the discharge, inside limits","Type approval, certificate/plan, alarms"],["A","Treatment bypass inhibited or under authorised procedure","Alarms, valve states, bypass log"],["A","No ballast release until local rules and approvals resolved","BWMP + port rules + voyage plan"],["A","US: approved method and failure reporting to COTP","USCG acceptance, contact, contingency"],["B","BWMP current; BWRB complete and consistent","Signed entries, event report, soundings"],["B","Consumables, TRO/UV/filters in maker range","Alarm log and maintenance"],["B","Neutralisation / hold times / sampling per manual","System prints, sampling plan"],["B","D-2 biological compliance test requirement assessed","Procedure, records, results"],["B","Australia DAFF and inter-port ballast checked","Australian reporting, BWMP, exemption"],["B","US NBIC report accurate / corrected","Receipts vs voyage data"],["B","Contingency measures agreed with authorities","Written Flag/port/COTP communication"],["B","Sediment management and sample points","Access and inspection"],["C","Crew explain BWMS alarm response and bypass prohibition","Officer Q&A"]],"how":["US: never assume ballast exchange alone is accepted instead of a required approved method. [R24]","Australia: verify Biosecurity Act/DAFF rules even with valid IMO certificate and BWMS. [R26]","No universal '300% overflow' rule — use the approved plan and local law."]},{"k":"17","t":"Hull, load line, hatch covers & bulk","tf":"Hull, load line, hatch cover at bulk","q":["6.7","9A.4","9A.6","9A.13","14.6","14.2","5.6","4.14","8A.6"],
