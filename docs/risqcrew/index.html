<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RISQ Crew</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="RISQ Crew">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#0e5a5a">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14212e;--muted:#5a6876;--line:#d3dae1;--navy:#1d3a5c;--acc:#c8551c;
--ok:#22744a;--okb:#dff1e7;--f:#b3261e;--fb:#fbe2df;--na:#6b7480;--nab:#e7eaee;--hr:#9a6700;--hrb:#fff3d1}
@media (prefers-color-scheme:dark){:root{--bg:#0f1720;--card:#17222e;--ink:#e3e9ef;--muted:#97a5b3;--line:#2a3846;--navy:#8fb4dc;--acc:#ef8a55;
--ok:#5cc58b;--okb:#173326;--f:#f08077;--fb:#3b1d1b;--na:#9aa4ae;--nab:#26303a;--hr:#e3b341;--hrb:#3a2f10}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:#1d3a5c;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
header .r{display:flex;align-items:center;gap:10px}
header h1{margin:0;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sub{font-size:12px;opacity:.8}
header button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:8px;padding:7px 11px;font:600 15px system-ui}
.bar{height:6px;background:rgba(255,255,255,.2);border-radius:4px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:#7fd1a3}
main{max-width:760px;margin:0 auto;padding:10px 12px calc(90px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
h2{font-size:15px;color:var(--navy);margin:4px 0 10px}
.note{font-size:13px;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px;font-weight:600}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.d{color:var(--f)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;color:var(--ink)}
.tile b{display:block;font-size:17px;margin-bottom:4px}
.tile .mini{height:5px;background:var(--nab);border-radius:3px;margin-top:8px;overflow:hidden}.tile .mini i{display:block;height:100%;background:var(--ok)}
.tile .fc{color:var(--f);font-weight:700}
.ins{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sw{position:relative;width:50px;height:30px;flex:0 0 50px}.sw input{display:none}.sw span{position:absolute;inset:0;background:var(--nab);border-radius:20px;transition:.2s}
.sw span:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+span{background:var(--hr)}.sw input:checked+span:before{transform:translateX(20px)}
.seg{display:flex;background:var(--nab);border-radius:10px;padding:3px;gap:3px}.seg button{flex:1;border:0;background:none;padding:7px;border-radius:8px;font-weight:600;color:var(--muted);font-size:14px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.q{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.q.ok{border-left-color:var(--ok)}.q.f{border-left-color:var(--f)}.q.na{border-left-color:var(--na);opacity:.75}
.qh{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.qh .id{font:700 13px ui-monospace,Menlo,monospace;color:var(--navy)}
.hrt{background:var(--hrb);color:var(--hr);font-weight:700;padding:1px 7px;border-radius:10px}
.q .t{font-weight:650;margin:6px 0}
.q ul{margin:4px 0 8px;padding-left:20px;font-size:14px}.q li{margin:3px 0}
.ans{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.ans button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 4px;font-weight:700;font-size:15px}
.ans button.on[data-v=ok]{background:var(--ok);border-color:var(--ok);color:#fff}
.ans button.on[data-v=f]{background:var(--f);border-color:var(--f);color:#fff}
.ans button.on[data-v=na]{background:var(--na);border-color:var(--na);color:#fff}
.more{margin-top:8px}.more summary{font-size:13px;color:var(--acc);font-weight:600;cursor:pointer;list-style:none}
.more pre{white-space:pre-wrap;font:14px/1.45 system-ui,sans-serif;background:var(--bg);border-radius:10px;padding:10px;margin:8px 0 0}
.fbox{margin-top:10px;display:none}.q.f .fbox{display:block}
.ph{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.ph div{position:relative}.ph img{width:76px;height:76px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.ph button{position:absolute;top:2px;right:2px;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;font-size:12px;padding:1px 6px}
.cam{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px;color:var(--ink);cursor:pointer}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:6}
.nav button{flex:1;border:0;background:none;color:var(--muted);font:600 12px system-ui;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button b{font-size:20px;line-height:1}.nav button.on{color:var(--acc)}
.fl{border-left:4px solid var(--f);padding:8px 10px;margin:8px 0;background:var(--card);border-radius:10px;border:1px solid var(--line);border-left-width:4px;border-left-color:var(--f)}
.hide{display:none!important}
.ff{background:var(--fb);border-radius:10px;padding:8px 10px;margin:4px 0 10px;font-size:14px}.ff b{color:var(--f);font-size:13px}.ff ul{margin:4px 0 0;padding-left:18px}.ff li{margin:2px 0}
.lk{font-size:12px;font-weight:700;color:var(--navy);margin-top:4px}.hot{background:var(--fb);color:var(--f);font-weight:700;padding:1px 7px;border-radius:10px}
.mic{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px}
.mic.rec{background:var(--f);border-color:var(--f);color:#fff;animation:pl 1s infinite}@keyframes pl{50%{opacity:.6}}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);background:#1d3a5c;color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:20}
#toast.show{opacity:1}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tools button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:left;color:var(--ink);font:600 14px system-ui}
.tools button.h24b{grid-column:1/-1;border:2px solid var(--acc);background:linear-gradient(0deg,rgba(239,138,85,.10),rgba(239,138,85,.10)),var(--card)}
.tools button small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.sev{display:flex;gap:4px;margin:8px 0 4px;align-items:center;font-size:13px;color:var(--muted)}
.sev button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 10px;font-weight:700;font-size:13px}
.sev button.on[data-s=L]{background:#5b8f6f;border-color:#5b8f6f;color:#fff}.sev button.on[data-s=M]{background:#c88a12;border-color:#c88a12;color:#fff}.sev button.on[data-s=H]{background:var(--f);border-color:var(--f);color:#fff}
.co{margin-top:8px;border:1px dashed var(--line);border-radius:10px;padding:8px}.co summary{font-weight:700;color:var(--ok);cursor:pointer;font-size:14px}
.co label{margin-top:6px}.co textarea{font-size:14px}
.big{font-size:28px;font-weight:800}.vt{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}.vt td,.vt th{border:1px solid var(--line);padding:6px;text-align:center}
.v12{background:var(--okb);color:var(--ok);font-weight:700}.v9{background:#eef6d9;color:#5b7a12;font-weight:700}.v6{background:var(--hrb);color:var(--hr);font-weight:700}.v3{background:#fde3cf;color:#a5490f;font-weight:700}.vU{background:var(--fb);color:var(--f);font-weight:700}
.pg h3{margin:14px 0 6px;font-size:15px}.pg ul{padding-left:20px;margin:6px 0}.pg li{margin:4px 0}
.dci{position:relative}.dci .chk{padding-right:40px;flex-direction:row;align-items:center;color:inherit;font-size:15px}.ib{position:absolute;right:0;top:4px;background:none;border:0;font-size:20px;padding:2px 4px;cursor:pointer}.dinfo{font-size:13.5px;line-height:1.45;background:var(--line);border-radius:8px;padding:8px 10px;margin:2px 0 8px 32px}.mg{display:inline-block;min-width:20px;text-align:center;color:#fff;border-radius:5px;font:700 12px system-ui;padding:2px 4px;margin-top:2px}.mi{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}.pfn{display:flex;gap:3px;flex:0 0 auto}.pfn button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;padding:5px 7px;font:600 12px system-ui}.pfn button.on.p{background:#5b8f6f;color:#fff;border-color:#5b8f6f}.pfn button.on.f{background:#c0392b;color:#fff;border-color:#c0392b}.pfn button.on.n,.pfn button.on.u{background:#7a8794;color:#fff;border-color:#7a8794}.stopb{background:#fdecea;color:#8a1f14;border-radius:8px;padding:8px 10px;font-size:13.5px;margin-bottom:6px}@media (prefers-color-scheme:dark){.stopb{background:#3a1d1a;color:#f4b3aa}}.mdet summary{font-weight:700;cursor:pointer;color:var(--navy)}.mfl{font-size:11px;font-weight:700;color:var(--acc)}.pk{display:block;margin-top:4px;font-size:13px;color:var(--acc);font-weight:600}
.pscr{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}.pchip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:7px 12px;font:600 14px system-ui}.pchip.on{background:var(--navy,#0e5a5a);color:#fff;border-color:var(--navy,#0e5a5a)}.pgo{flex:0 0 auto;margin-left:auto;border:1px solid var(--line);background:none;color:var(--acc);border-radius:8px;padding:2px 8px;font:600 13px system-ui}.psrc a{color:var(--acc);word-break:break-word}.chk.pchk{flex-direction:row;align-items:flex-start;color:inherit;font-size:15px;font-weight:400}.pchk .pgo{margin-top:0}
.chk{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}.chk input{width:22px;height:22px;flex:0 0 22px;margin-top:1px}
.qa{border-bottom:1px solid var(--line);padding:10px 0}.qa .who{font-size:12px;color:var(--acc);font-weight:700}.qa .ans2{display:none;background:var(--okb);border-radius:8px;padding:8px;margin-top:6px;font-size:14px}.qa.open .ans2{display:block}
header{background:#0e5a5a}#toast{background:#0e5a5a}
.lng{background:rgba(255,255,255,.18)!important;font:700 13px system-ui!important;padding:7px 10px!important;letter-spacing:.5px}
.cred{text-align:center;font-size:12px;color:var(--muted);margin:22px 0 6px}
</style>
</head>
<body>
<header>
  <div class="r"><button id="back" class="hide">‹</button><div style="flex:1;min-width:0"><h1 id="ttl">RISQ Crew</h1><div class="sub" id="sub"></div></div><button class="lng" id="lng">EN</button></div>
  <div class="bar hide" id="pbar"><i id="pfill"></i></div>
</header>
<main>
  <!-- LIST -->
  <section id="v-list">
    <div class="card"><h2 data-t="howT"></h2><p class="note" style="margin:0" data-th="howX"></p></div>
    <div class="card"><h2 data-t="toolsT"></h2>
      <div class="tools">
        <button data-pg="h24" class="h24b"><span data-t="pg_h24"></span><small data-t="pg_h24_s"></small></button>
        <button data-pg="mind"><span data-t="pg_mind"></span><small data-t="pg_mind_s"></small></button>
        <button data-pg="crew"><span data-t="pg_crew"></span><small data-t="pg_crew_s"></small></button>
        <button data-pg="drill"><span data-t="pg_drill"></span><small data-t="pg_drill_s"></small></button>
        <button data-pg="docs"><span data-t="pg_docs"></span><small data-t="pg_docs_s"></small></button>
        <button data-pg="psc"><span data-t="pg_psc"></span><small data-t="pg_psc_s"></small></button>
        <button data-pg="man"><span data-t="pg_man"></span><small data-t="pg_man_s"></small></button>
        <button data-pg="trn"><span data-t="pg_trn"></span><small data-t="pg_trn_s"></small></button>
        <button data-pg="il"><span data-t="pg_il"></span><small data-t="pg_il_s"></small></button>
      </div>
      <p class="note" style="margin:10px 0 0" data-th="target"></p></div>
    <button class="btn p" id="newIns" style="width:100%;padding:14px" data-t="newIns"></button>
    <div id="insList"></div>
    <p class="cred">Created by George Barbaris</p>
  </section>

  <!-- NEW / EDIT -->
  <section id="v-edit" class="hide">
    <div class="card">
      <h2 data-t="detT"></h2>
      <div class="g2"><label><span data-t="vessel"></span><input id="e_vessel"></label><label>IMO<input id="e_imo" inputmode="numeric"></label>
      <label><span data-t="port"></span><input id="e_port"></label><label><span data-t="date"></span><input id="e_date" type="date"></label></div>
      <label style="margin-top:8px"><span data-t="by"></span><input id="e_by"></label>
      <details class="more"><summary data-t="s1"></summary><div id="e_s1" style="margin-top:8px"></div></details>
      <div class="row" style="margin-top:12px"><button class="btn p" id="e_save" data-t="save"></button><button class="btn d hide" id="e_del" data-t="del"></button></div>
    </div>
  </section>

  <!-- HOME (areas) -->
  <section id="v-home" class="hide">
    <div class="card tog"><div><b data-t="hrOnly"></b><div class="note" data-t="hrOnlyX"></div></div><label class="sw"><input type="checkbox" id="hrOnly"><span></span></label></div>
    <div class="tiles" id="tiles"></div>
    <div class="row" style="margin-top:12px"><button class="btn" id="editIns" data-t="details"></button><button class="btn p" id="h24Ins" data-t="h24b"></button><button class="btn" id="docsIns" data-t="docs72"></button><button class="btn" id="drillIns" data-t="pg_drill"></button><button class="btn" id="pscIns">🛂 PSC</button><button class="btn" id="manIns">📘 Manuals</button><button class="btn" id="trnIns">🎓 Training</button><button class="btn p" id="ilIns">📋 Inspector list</button></div>
  </section>

  <!-- PAGES -->
  <section id="v-page" class="hide"><div id="pg" class="pg"></div></section>

  <!-- AREA -->
  <section id="v-area" class="hide">
    <div class="seg" id="aflt"><button data-f="open" class="on" data-t="f_open"></button><button data-f="hot" data-t="f_hot"></button><button data-f="all" data-t="f_all"></button><button data-f="f">✗</button></div>
    <div id="qs"></div>
    <div class="row" style="justify-content:space-between;margin-top:6px"><button class="btn" id="prevA" data-t="prevA"></button><button class="btn p" id="nextA"></button></div>
  </section>

  <!-- FINDINGS -->
  <section id="v-find" class="hide">
    <div class="card"><h2 style="margin:0" data-t="sumT"></h2><div id="sum" style="margin-top:8px"></div>
      <div class="row" style="margin-top:12px"><button class="btn p" id="xPdf">📄 PDF report</button><button class="btn" id="xTxt" data-t="xTxt"></button><button class="btn" id="xCsv">📊 Excel</button></div></div>
    <div class="card" id="valid"></div>
    <div class="card"><h2>✅ Close-out (RightShip format)</h2><p class="note" style="margin-top:0" data-t="coX"></p>
      <div class="row"><button class="btn p" id="xCo">📑 Close-out PDF</button></div></div>
    <div id="flist"></div>
  </section>
</main>
<nav class="nav hide" id="nav"><button data-go="home" class="on"><b>⌂</b><span data-t="n_home"></span></button><button data-go="find"><b>⚑</b>Findings</button><button data-go="h24"><b>⏰</b><span data-t="n_h24"></span></button><button data-go="list"><b>☰</b><span data-t="n_list"></span></button></nav>
<div id="toast"></div>
<script>
const DATA={"q":[{"id":"2.1","s":"2","sn":"Certification and Personnel Management","a":"DOC","h":1,"c":["Download fresh Class Survey Status (dated ≤7 days before inspection) – print & file","No overdue Conditions of Class / no short-term certificate due to defect","List any CoC, Memoranda, Significant Recommendations – have close-out plan ready","Flag dispensation letters: expiry, nature, corrective action","e-Certificates: Master knows how to verify (tracking no., QR / issuer portal)","📋 Inspector: Class status report not older than 7 days at the inspection date"],"o":"Is the latest Class Survey Status available, are all Statutory Certificates listed within it valid, is the vessel free of any overdue Conditions of Class, and are all classification and statutory surveys up to date?","f":["Class status older than 7 days on the day of inspection","Overdue CoC / short-term certificate issued due to defect","Flag dispensation on board but expiry, nature & corrective action not known"],"eg":"Class Survey Status ≤7 days old, all certificates valid, no overdue CoC.","ex":"WHAT IS ASKED:\nA recent Class Survey Status on board, all statutory certificates valid, no overdue Condition of Class.\n\nFINDING WHEN:\n• Class Survey Status older than 7 days or missing\n• Short-term certificate because of damage/defect\n• Overdue CoC\n• Master cannot prove the e-certificates are valid\n\nWHAT THE INSPECTOR DOES:\n• Attaches the Class Status PDF to the report\n• Writes in comments every CoC, Memorandum, Significant Recommendation\n• For Flag dispensation: expiry date, reason, corrective action\n\nREMEMBER:\n• e-certificate: unique tracking number, protected from changes, issuer symbol (IMO FAL.5/Circ.39)\n• IMSBC fitness certificate for Group A/B cargoes where applicable","fg":"Class Survey Status na ≤7 araw, lahat ng certificate valid, walang overdue CoC.","fc":["Mag-download ng bagong Class Survey Status (≤7 araw bago ang inspection) – i-print at i-file","Walang overdue Conditions of Class / walang short-term certificate dahil sa defect","Ilista ang CoC, Memoranda, Significant Recommendations – may handang close-out plan","Flag dispensation letters: expiry, dahilan, corrective action","e-Certificates: alam ng Master kung paano i-verify (tracking no., QR / portal ng issuer)","📋 Inspector: Class status report not older than 7 days at the inspection date"],"fx":"ANO ANG HINIHINGI:\nMay bagong Class Survey Status sa barko, valid lahat ng statutory certificates, walang overdue Condition of Class.\n\nKAILAN MAY FINDING:\n• Mas luma sa 7 araw o wala ang Class Survey Status\n• May short-term certificate dahil sa sira/defect\n• May overdue CoC\n• Hindi mapatunayan ng Master na valid ang e-certificates\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Inilalakip ang PDF ng Class Status sa report\n• Isinusulat sa comments ang bawat CoC, Memorandum, Significant Recommendation\n• Sa Flag dispensation: expiry date, dahilan, corrective action\n\nTANDAAN:\n• e-certificate: unique tracking number, protektado sa pagbabago, symbol ng issuer (IMO FAL.5/Circ.39)\n• IMSBC fitness certificate para sa Group A/B cargoes kung kailangan","ff":["Class status na mas luma sa 7 araw sa araw ng inspection","Overdue CoC / short-term certificate dahil sa defect","May Flag dispensation pero hindi alam ang expiry, dahilan at corrective action"]},{"id":"2.2","s":"2","sn":"Certification and Personnel Management","a":"DOC","h":0,"c":["MLC Reg 2.5 (abandonment) & Reg 4.2 (death/long-term disability) certificates on board","Valid dates, posted in conspicuous place (crew mess / notice board)","Copies also in English"],"o":"Has the vessel been provided with certificates of financial security for seafarers? (M)","eg":"The 2 MLC financial security certificates (repatriation + death/disability) posted.","ex":"WHAT IS ASKED:\nThe 2 MLC financial security certificates must be on board.\n\nFINDING WHEN:\n• One of the two is missing or expired\n\nWHAT THE INSPECTOR DOES:\n• Checks they are posted in a conspicuous place\n\nREMEMBER:\n• Reg 2.5: abandonment – repatriation, food, medical care, up to 4 months' wages\n• Reg 4.2: death / long-term disability from work accident","fg":"Nakapaskil ang 2 MLC financial security certificate (repatriation + death/disability).","fc":["May MLC Reg 2.5 (abandonment) at Reg 4.2 (death/long-term disability) certificates sa barko","Valid ang petsa, nakapaskil sa kitang lugar (crew mess / notice board)","May kopya rin sa English"],"fx":"ANO ANG HINIHINGI:\nDapat nasa barko ang 2 MLC financial security certificate.\n\nKAILAN MAY FINDING:\n• Wala o expired ang isa sa dalawa\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Tinitingnan kung nakapaskil sa kitang lugar\n\nTANDAAN:\n• Reg 2.5: abandonment – repatriation, pagkain, medical, hanggang 4 na buwang sahod\n• Reg 4.2: kamatayan / permanenteng kapansanan dahil sa aksidente sa trabaho"},{"id":"2.3","s":"2","sn":"Certification and Personnel Management","a":"DOC","h":0,"c":["Working language recorded in Official/Deck logbook","Posted plans/lists translated into working language if not flag language","Brief crew: inspector may question ratings in English – they must answer basic safety questions"],"o":"Can all crew communicate effectively in the working language of the ship? (V)","eg":"Working language written in the logbook; everyone speaks and understands it.","ex":"WHAT IS ASKED:\nAll crew communicate in the ship's working language.\n\nFINDING WHEN:\n• Crew do not understand / cannot report in the working language\n• Working language not written in the logbook\n\nWHAT THE INSPECTOR DOES:\n• Records the common language and the level of English\n• Asks ratings questions\n\nREMEMBER:\n• SOLAS V/14: English on the bridge for bridge-to-bridge, bridge-to-shore and with the pilot\n• Signs/lists translated into the working language","fg":"Nakasulat sa logbook ang working language; lahat ay nakakapagsalita at nakakaintindi nito.","fc":["Naka-record ang working language sa Official/Deck logbook","Ang mga nakapaskil na plan/list ay naka-translate sa working language kung iba sa flag language","I-brief ang crew: maaaring magtanong ang inspector sa ratings sa English – dapat masagot nila ang basic safety questions"],"fx":"ANO ANG HINIHINGI:\nLahat ng crew ay nakakapag-usap sa working language ng barko.\n\nKAILAN MAY FINDING:\n• Hindi naiintindihan ng crew / hindi makapag-report sa working language\n• Hindi nakasulat sa logbook ang working language\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Itinatala ang common language at antas ng English\n• Nagtatanong sa ratings\n\nTANDAAN:\n• SOLAS V/14: English sa bridge para sa bridge-to-bridge, bridge-to-shore at sa pilot\n• Mga sign/list na naka-translate sa working language"},{"id":"2.4","s":"2","sn":"Certification and Personnel Management","a":"DOC","h":0,"c":["Crew list vs Minimum Safe Manning Doc – ranks & numbers","Master / C/E not on regular watches (3-watch system)","Enough crew for mooring + cargo watch + drills in port"],"o":"Is the vessel’s manning in compliance with the Safe Manning Certificate? (V)","eg":"Actual crew ≥ Safe Manning Certificate.","ex":"WHAT IS ASKED:\nCrew must be at least as per the Safe Manning Certificate and enough for the work.\n\nFINDING WHEN:\n• Fewer crew, or without the right certificates, than the Safe Manning\n\nWHAT THE INSPECTOR DOES:\n• Writes actual vs required manning\n• Judges if crew are enough for watches, mooring, cargo, drills and maintenance without fatigue\n\nREMEMBER:\n• IMO Res. A.1047(27): Master and C/E should not keep regular watches (3-watch system)","fg":"Ang aktuwal na crew ≥ Safe Manning Certificate.","fc":["Crew list kumpara sa Minimum Safe Manning Doc – ranks at bilang","Master / C/E wala sa regular watch (3-watch system)","Sapat ang crew para sa mooring + cargo watch + drills sa pantalan"],"fx":"ANO ANG HINIHINGI:\nAng crew ay dapat hindi bababa sa Safe Manning Certificate at sapat para sa trabaho.\n\nKAILAN MAY FINDING:\n• Kulang, o walang tamang certificates, kumpara sa Safe Manning\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Isinusulat ang actual vs required manning\n• Tinitingnan kung sapat para sa watch, mooring, cargo, drills at maintenance nang walang pagod\n\nTANDAAN:\n• IMO Res. A.1047(27): ang Master at C/E ay hindi dapat may regular na watch (3-watch system)"},{"id":"2.5","s":"2","sn":"Certification and Personnel Management","a":"DOC","h":1,"c":["Records in IMO/ILO format, signed by seafarer & Master","Check last 30 days: no 2+ consecutive violations by anyone (esp. C/O, 2/E, AB during cargo)","Cross-check rest records vs deck/ER logbook, cargo ops & drills times (inspectors do this!)","Evidence monthly compliance report sent to office","Non-conformities raised for any violation"],"o":"Do all personnel maintain rest period/work hours and are the rest hours in compliance with STCW or MLC requirements? (V)","f":["Rest-hour non-conformities not identified/acknowledged, no corrective action","Hours don't match deck/engine log (cargo ops, drills, arrival/departure)","Identical 'perfect' records every day – inspector cross-checks"],"eg":"Rest hours in ILO format, no 2 consecutive violations in 30 days, monthly report to office.","ex":"WHAT IS ASKED:\nRest hours kept per STCW/MLC and recorded on the correct form.\n\nFINDING WHEN:\n• 2 or more consecutive violations by the same person in 30 days\n• Office not informed at least monthly\n• Records not in IMO/ILO format\n\nWHAT THE INSPECTOR DOES:\n• Compares rest hours with logbook, cargo ops and drills\n\nREMEMBER:\n• At least 10 hours in any 24 hours and 77 hours in any 7 days\n• Max 2 periods, one ≥6 hours, interval between them ≤14 hours\n• Exception: ≥70 hours/7 days, not more than 2 consecutive weeks","fg":"Rest hours sa ILO format, walang 2 sunod na violation sa 30 araw, monthly report sa opisina.","fc":["Records sa IMO/ILO format, may pirma ng seafarer at Master","I-check ang huling 30 araw: walang 2+ sunod na violation ng kahit sino (lalo na C/O, 2/E, AB habang may cargo)","Ikumpara ang rest records sa deck/ER logbook, oras ng cargo ops at drills (ginagawa ito ng inspector!)","Patunay na naipadala sa opisina ang monthly compliance report","May non-conformity para sa bawat violation"],"fx":"ANO ANG HINIHINGI:\nSinusunod ang rest hours ayon sa STCW/MLC at isinusulat sa tamang form.\n\nKAILAN MAY FINDING:\n• 2 o higit pang sunod na violation ng parehong tao sa 30 araw\n• Hindi naiinform ang opisina kahit buwan-buwan\n• Hindi IMO/ILO format ang records\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Ikinukumpara ang rest hours sa logbook, cargo ops at drills\n\nTANDAAN:\n• Hindi bababa sa 10 oras sa bawat 24 oras at 77 oras sa bawat 7 araw\n• Hanggang 2 period, ang isa ≥6 oras, pagitan ≤14 oras\n• Exception: ≥70 oras/7 araw, hindi hihigit sa 2 sunod na linggo","ff":["Hindi natukoy/kinilala ang rest-hour non-conformities, walang corrective action","Hindi tugma ang oras sa deck/engine log (cargo ops, drills, arrival/departure)","Pare-parehong 'perpektong' records araw-araw – chine-check ito ng inspector"]},{"id":"2.6","s":"2","sn":"Certification and Personnel Management","a":"DOC","h":0,"c":["Master ship-handling / BRM simulator certificate on board","If <36 months in rank on similar size – training evidence is a must","Copy in Master's file"],"o":"Has the Master been provided with relevant ship handling training? (V)","eg":"Master's ship-handling training (simulator) with certificate.","ex":"WHAT IS ASKED:\nThe Master has ship-handling training (e.g. simulator), especially on large ships.\n\nFINDING WHEN:\n• No evidence of training where required\n\nWHAT THE INSPECTOR DOES:\n• Asks for the ship-handling course certificate\n\nREMEMBER:\n• Mainly for large ships (length/DWT)\n• If the Master has ≥36 months on a similar ship, experience counts","fg":"Ship-handling training ng Master (simulator) na may certificate.","fc":["Master ship-handling / BRM simulator certificate nasa barko","Kung <36 buwan sa rank sa kaparehong laki ng barko – kailangan ang patunay ng training","Kopya sa file ng Master"],"fx":"ANO ANG HINIHINGI:\nMay ship-handling training ang Master (hal. simulator), lalo na sa malalaking barko.\n\nKAILAN MAY FINDING:\n• Walang patunay ng training kung kailangan\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Hinihingi ang certificate ng ship-handling course\n\nTANDAAN:\n• Para sa malalaking barko (haba/DWT)\n• Kung ang Master ay may ≥36 buwan sa kaparehong barko, bilang ang experience"},{"id":"2.7","s":"2","sn":"Certification and Personnel Management","a":"DOC","h":0,"c":["STCW / company IMSBC training certificates for Master, C/O, officers","Training records in crew files / training matrix"],"o":"Have officers and ratings responsible for cargo handling on ships carrying dangerous and hazardous substances in solid form in bulk, undergone formal training? (V)","eg":"IMSBC/DG bulk cargo training for those who handle cargo.","ex":"WHAT IS ASKED:\nThose who handle dangerous bulk cargoes (IMSBC) have formal training.\n\nFINDING WHEN:\n• No evidence of training\n\nWHAT THE INSPECTOR DOES:\n• Checks officers' certificates/training records\n\nREMEMBER:\n• Applies to Master, C/O and cargo officers","fg":"IMSBC/DG training para sa mga humahawak ng bulk cargo.","fc":["STCW / company IMSBC training certificates ng Master, C/O, officers","Training records sa crew files / training matrix"],"fx":"ANO ANG HINIHINGI:\nAng humahawak ng mapanganib na bulk cargo (IMSBC) ay may pormal na training.\n\nKAILAN MAY FINDING:\n• Walang patunay ng training\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang certificates/training records ng officers\n\nTANDAAN:\n• Para sa Master, C/O at cargo officers"},{"id":"2.8","s":"2","sn":"Certification and Personnel Management","a":"DOC","h":0,"c":["IMDG training certificates (if applicable)","Otherwise be ready to state N/A with reason"],"o":"Have officers and ratings responsible for cargo handling on ships carrying dangerous and hazardous substances in packaged form, undergone formal training (V)?","eg":"IMDG (packaged DG) training if the ship ever carries such cargo – otherwise N/A.","ex":"WHAT IS ASKED:\nThose who handle packaged dangerous goods (IMDG) have training.\n\nFINDING WHEN:\n• No training while the ship carries such cargo\n\nWHAT THE INSPECTOR DOES:\n• Checks IMDG training\n\nREMEMBER:\n• If the ship never carries packaged DG, answer N/A","fg":"IMDG (packaged DG) training kung nagkakarga ang barko nito – kung hindi, N/A.","fc":["IMDG training certificates (kung kailangan)","Kung hindi, handang sabihin ang N/A at ang dahilan"],"fx":"ANO ANG HINIHINGI:\nAng humahawak ng packaged dangerous goods (IMDG) ay may training.\n\nKAILAN MAY FINDING:\n• Walang training pero nagkakarga ang barko nito\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang IMDG training\n\nTANDAAN:\n• Kung hindi kailanman nagkakarga ng packaged DG, sagot ay N/A"},{"id":"2.9","s":"2","sn":"Certification and Personnel Management","a":"DOC","h":0,"c":["D&A policy signed & posted; BAC limit 0.05% (or stricter)","Unannounced testing records (incl. random) – last test date","Alcohol issue/bond records if alcohol allowed","Policy covers contractors/riding crew"],"o":"Has an SMS policy and procedure been established to enforce the STCW Convention and Code requirements for the purpose of preventing drug and alcohol abuse? (V & M)","f":["Unannounced alcohol test not carried out within company interval","Alcohol issue/bond records missing or bonded store not secured"],"eg":"Drug & Alcohol policy (OCIMF-aligned), unannounced tests, alcohol records.","ex":"WHAT IS ASKED:\nA Drug & Alcohol policy in the SMS in line with STCW and OCIMF.\n\nFINDING WHEN:\n• No policy, or not applied (no tests)\n\nWHAT THE INSPECTOR DOES:\n• Checks policy, unannounced tests, alcohol limit\n• Checks it also covers contractors\n\nREMEMBER:\n• STCW: limit 0.05% BAC or 0.25 mg/l in breath\n• Tests must also be unannounced","fg":"Drug & Alcohol policy (ayon sa OCIMF), unannounced tests, alcohol records.","fc":["D&A policy may pirma at nakapaskil; BAC limit 0.05% (o mas mahigpit)","Records ng unannounced testing (kasama random) – petsa ng huling test","Alcohol issue/bond records kung pinapayagan ang alak","Sakop ng policy ang contractors/riding crew"],"fx":"ANO ANG HINIHINGI:\nMay Drug & Alcohol policy sa SMS ayon sa STCW at OCIMF.\n\nKAILAN MAY FINDING:\n• Walang policy o hindi ipinapatupad (walang test)\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang policy, unannounced tests, alcohol limit\n• Tinitingnan kung sakop din ang contractors\n\nTANDAAN:\n• STCW: limit 0.05% BAC o 0.25 mg/l sa hininga\n• Dapat may test din na walang pasabi","ff":["Hindi nagawa ang unannounced alcohol test sa loob ng interval ng company","Walang alcohol issue/bond records o hindi naka-secure ang bonded store"]},{"id":"2.13","s":"2","sn":"Certification and Personnel Management","a":"DOC","h":1,"c":["Officer matrix updated today – names, ranks, time in rank/company/type, sign-on dates","Matches crew list & CoC/endorsements exactly","Endorsement applications (CRA) <3 months – have proof","Print a copy for the inspector"],"o":"Is the officer matrix accurately completed and does it reflect the information on officers and engineers on board the vessel at the time of inspection? (V)","eg":"Officer matrix updated with the CURRENT officers.","ex":"WHAT IS ASKED:\nThe officer matrix is updated with the officers and engineers now on board.\n\nFINDING WHEN:\n• Not updated for the current officers\n• Wrong data (time in rank, in company, on ship type)\n\nWHAT THE INSPECTOR DOES:\n• Has his own copy and compares it with crew list and CoCs\n• Checks endorsements (CRA up to 3 months)\n\nREMEMBER:\n• If there is a procedure and senior officers changed from a sister ship, no finding for lack of overlap","fg":"Officer matrix na updated sa KASALUKUYANG officers.","fc":["Officer matrix updated ngayon – pangalan, rank, tagal sa rank/company/type, sign-on dates","Tugmang-tugma sa crew list at CoC/endorsements","Endorsement applications (CRA) <3 buwan – may patunay","Mag-print ng kopya para sa inspector"],"fx":"ANO ANG HINIHINGI:\nUpdated ang officer matrix sa officers at engineers na nasa barko ngayon.\n\nKAILAN MAY FINDING:\n• Hindi updated para sa kasalukuyang officers\n• Maling data (tagal sa rank, sa company, sa uri ng barko)\n\nANO ANG GINAGAWA NG INSPECTOR:\n• May sariling kopya at ikinukumpara sa crew list at CoC\n• Chine-check ang endorsements (CRA hanggang 3 buwan)\n\nTANDAAN:\n• Kung may procedure at ang senior officers ay galing sa sister ship, walang finding sa kawalan ng overlap"},{"id":"2.14","s":"2","sn":"Certification and Personnel Management","a":"DOC","h":1,"c":["ECDIS generic certificate + type-specific (maker/model) certificate for Master & all OOWs","Shipboard familiarisation checklist signed on joining","Model on certificate = model installed"],"o":"If ECDIS is fitted on board, has the Master and Navigation Officers been familiarised with the ECDIS equipment installed on board, and were objective evidences of this familiarisation available? (V)","f":["Officer without type-specific ECDIS certificate for the maker/model on board (incl. back-up)","Shipboard ECDIS familiarisation not per SMS (method, duration, trainer, evaluation not recorded)"],"eg":"ECDIS type-specific familiarisation with evidence for all deck officers.","ex":"WHAT IS ASKED:\nMaster and officers have type-specific familiarisation on the ship's ECDIS, with evidence.\n\nFINDING WHEN:\n• No evidence of familiarisation for this specific model\n\nWHAT THE INSPECTOR DOES:\n• Writes how the training was done (course, CBT, on board)\n\nREMEMBER:\n• Applies to every deck officer who joins","fg":"ECDIS type-specific familiarisation na may patunay para sa lahat ng deck officers.","fc":["ECDIS generic certificate + type-specific (maker/model) certificate ng Master at lahat ng OOW","Shipboard familiarisation checklist may pirma pagsakay","Ang model sa certificate = model na naka-install"],"fx":"ANO ANG HINIHINGI:\nMay type-specific familiarisation ang Master at officers sa ECDIS ng barko, may patunay.\n\nKAILAN MAY FINDING:\n• Walang patunay ng familiarisation para sa model na ito\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Isinusulat kung paano ginawa ang training (course, CBT, sa barko)\n\nTANDAAN:\n• Para sa bawat deck officer na sumasakay","ff":["Officer na walang type-specific ECDIS certificate para sa maker/model sa barko (kasama ang back-up)","Shipboard ECDIS familiarisation hindi ayon sa SMS (paraan, tagal, trainer, evaluation hindi naka-record)"]},{"id":"3.1","s":"3","sn":"Navigation","a":"BRG","h":0,"c":["Navigation manual latest revision on bridge","Bridge familiarisation checklists signed by all OOWs","Quiz OOWs: CPA/TCPA limits, when to call Master, UKC policy, ECDIS layers"],"o":"Is practical guidance on navigational safety incorporated in the vessel manager’s navigation instruction / procedures and are officer’s familiar with the company’s navigation procedures? (V)","f":["OOW not familiar with ECDIS single/dual failure actions – no checklist or drill","OOW unfamiliar with company navigation procedures when questioned"],"eg":"Officers know the company navigation procedures.","ex":"WHAT IS ASKED:\nCompany navigation procedures are practical and the officers know them.\n\nFINDING WHEN:\n• Bridge team does not know the procedures\n\nWHAT THE INSPECTOR DOES:\n• Asks the OOWs\n• Checks familiarisation checklists or drills\n\nREMEMBER:\n• ICS Bridge Procedures Guide is the basis","fg":"Alam ng officers ang navigation procedures ng company.","fc":["Navigation manual pinakabagong revision sa bridge","Bridge familiarisation checklists may pirma ng lahat ng OOW","Tanungin ang OOW: CPA/TCPA limits, kailan tatawagin ang Master, UKC policy, ECDIS layers"],"fx":"ANO ANG HINIHINGI:\nPraktikal ang navigation procedures ng company at alam ito ng officers.\n\nKAILAN MAY FINDING:\n• Hindi alam ng bridge team ang procedures\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Tinatanong ang OOW\n• Chine-check ang familiarisation checklists o drills\n\nTANDAAN:\n• Ang ICS Bridge Procedures Guide ang batayan","ff":["Hindi alam ng OOW ang gagawin sa single/dual ECDIS failure – walang checklist o drill","Hindi alam ng OOW ang navigation procedures ng company kapag tinanong"]},{"id":"3.2","s":"3","sn":"Navigation","a":"BRG","h":1,"c":["Master's Standing Orders signed by all deck officers (incl. new joiners)","Include: visibility criteria, when to call Master, min CPA, ECDIS display layers per stage","Night Order Book completed every night at sea/anchor & countersigned by each OOW"],"o":"Are the requirements of the Master’s standing orders explained to the deck officers, and are bridge order books (Night Order) being completed by the Master and countersigned by the officers? (V & M)","eg":"Standing orders signed; night orders every night and countersigned.","ex":"WHAT IS ASKED:\nStanding orders explained and signed; Master writes the Night Order Book every night and the OOWs sign.\n\nFINDING WHEN:\n• Standing orders without visibility limits, when to call Master, minimum CPA, ECDIS layers per stage\n• Night orders not signed\n\nWHAT THE INSPECTOR DOES:\n• Reads the standing orders and night order book\n\nREMEMBER:\n• New officers must also sign","fg":"May pirma ang standing orders; night orders gabi-gabi at may countersign.","fc":["Master's Standing Orders may pirma ng lahat ng deck officers (kasama ang bagong sakay)","Kasama: visibility criteria, kailan tatawagin ang Master, min CPA, ECDIS display layers bawat stage","Night Order Book kumpleto gabi-gabi sa dagat/angkla at may countersign ng bawat OOW"],"fx":"ANO ANG HINIHINGI:\nNaipaliwanag at may pirma ang standing orders; ang Master ay nagsusulat ng Night Order Book gabi-gabi at pumipirma ang OOW.\n\nKAILAN MAY FINDING:\n• Walang visibility limits, kailan tatawagin ang Master, minimum CPA, ECDIS layers bawat stage sa standing orders\n• Walang pirma ang night orders\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Binabasa ang standing orders at night order book\n\nTANDAAN:\n• Dapat pumirma rin ang bagong officers"},{"id":"3.3","s":"3","sn":"Navigation","a":"BRG","h":0,"c":["Manoeuvring booklet & wheelhouse poster posted (incl. engine power limitation / EPL)","Deck log, bell book (or VDR/ECR printout), radar performance records complete","Change of watch checklist at sea completed each watch"],"o":"Is the manoeuvring information for the vessel displayed on the bridge and are bridge logbooks, bell book, radar performance book, and Change of Watch at Sea check list being correctly maintained? (V)","f":["Pilot card / wheelhouse poster without limited-power (EPL/ShaPoLi) manoeuvring data","Change-of-watch checklist not completed every watch","Bell book / radar performance records incomplete"],"eg":"Wheelhouse poster, logbooks, bell book, radar performance book, change-of-watch checklist.","ex":"WHAT IS ASKED:\nManoeuvring information posted on the bridge, and correct logbooks, bell book, radar performance and change-of-watch checklist.\n\nFINDING WHEN:\n• Wheelhouse poster missing or records incomplete\n\nWHAT THE INSPECTOR DOES:\n• Checks the poster (and engine power limitation/EPL)\n• Checks logs\n\nREMEMBER:\n• IMO A.601(15) for manoeuvring information","fg":"Wheelhouse poster, logbooks, bell book, radar performance book, change-of-watch checklist.","fc":["Nakapaskil ang manoeuvring booklet at wheelhouse poster (kasama ang engine power limitation / EPL)","Kumpleto ang deck log, bell book (o VDR/ECR printout), radar performance records","Change of watch checklist sa dagat kumpleto bawat watch"],"fx":"ANO ANG HINIHINGI:\nNakapaskil sa bridge ang manoeuvring information, at tama ang logbooks, bell book, radar performance at change-of-watch checklist.\n\nKAILAN MAY FINDING:\n• Wala ang wheelhouse poster o kulang ang records\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang poster (at engine power limitation/EPL)\n• Chine-check ang logs\n\nTANDAAN:\n• IMO A.601(15) para sa manoeuvring information","ff":["Pilot card / wheelhouse poster walang limited-power (EPL/ShaPoLi) manoeuvring data","Hindi kumpleto ang change-of-watch checklist bawat watch","Kulang ang bell book / radar performance records"]},{"id":"3.4","s":"3","sn":"Navigation","a":"BRG","h":0,"c":["Sailing / arrival checklists for last ports completed with times, signed","Steering gear test before departure recorded (≤12 h)","Entries consistent with deck log"],"o":"Have operational checks on navigational equipment been done and are checklists being effectively completed when preparing for sea and prior to port entry? (V)","eg":"Pre-departure & pre-arrival checklists completed correctly.","ex":"WHAT IS ASKED:\nChecks before departure and before arrival are done and filled in correctly.\n\nFINDING WHEN:\n• Checklists not filled in, or filled in just for show\n\nWHAT THE INSPECTOR DOES:\n• Checks the checklists of the last ports\n\nREMEMBER:\n• Steering gear test within 12 hours before departure (SOLAS V/26)","fg":"Pre-departure at pre-arrival checklists kumpleto nang tama.","fc":["Sailing / arrival checklists ng huling ports kumpleto, may oras at pirma","Steering gear test bago umalis naka-record (≤12 h)","Tugma ang entries sa deck log"],"fx":"ANO ANG HINIHINGI:\nGinagawa at tamang pinupunan ang checks bago umalis at bago dumating.\n\nKAILAN MAY FINDING:\n• Hindi pinupunan ang checklists o pinupunan lang para masabing may laman\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang checklists ng huling ports\n\nTANDAAN:\n• Steering gear test sa loob ng 12 oras bago umalis (SOLAS V/26)"},{"id":"3.5","s":"3","sn":"Navigation","a":"BRG","h":0,"c":["Daily/weekly/monthly bridge equipment checklist up to date","Gyro/magnetic compass error each watch & after course alteration","Emergency steering, BNWAS, alarms tests logged"],"o":"Are there records indicating that routine tests and checks of bridge equipment are being undertaken regularly? (V)","eg":"Routine bridge equipment tests (daily/weekly/monthly) recorded.","ex":"WHAT IS ASKED:\nRecords of routine tests of bridge equipment.\n\nFINDING WHEN:\n• No records\n\nWHAT THE INSPECTOR DOES:\n• Checks daily/weekly/monthly checks\n\nREMEMBER:\n• Compass error every watch","fg":"Routine tests ng bridge equipment (daily/weekly/monthly) naka-record.","fc":["Updated ang daily/weekly/monthly bridge equipment checklist","Gyro/magnetic compass error bawat watch at pagkatapos magpalit ng course","Emergency steering, BNWAS, alarms tests naka-log"],"fx":"ANO ANG HINIHINGI:\nMay records ng routine tests ng bridge equipment.\n\nKAILAN MAY FINDING:\n• Walang records\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang daily/weekly/monthly checks\n\nTANDAAN:\n• Compass error bawat watch"},{"id":"3.6","s":"3","sn":"Navigation","a":"BRG","h":0,"c":["Pilot card completed for every pilotage (last voyage)","MPX record / checklist, pilot boarding times in log","Passage plan shared with pilot; handover of ECDIS/radar con documented"],"o":"Has the Master/Pilot information exchange been taking place effectively and is the standard pilot card being completed as required? (V)","f":["Master-Pilot exchange / pilot card not completed for every pilotage","UKC, pilot boarding arrangement and passage plan not discussed with pilot"],"eg":"MPX and pilot card completed for every pilotage.","ex":"WHAT IS ASKED:\nMaster–Pilot information exchange (MPX) and pilot card for every pilotage.\n\nFINDING WHEN:\n• Pilot card not completed\n\nWHAT THE INSPECTOR DOES:\n• Checks pilot cards of the last voyage\n\nREMEMBER:\n• The pilot does not replace the Master's responsibility","fg":"MPX at pilot card kumpleto sa bawat pilotage.","fc":["Pilot card kumpleto sa bawat pilotage (huling voyage)","MPX record / checklist, oras ng pagsakay ng pilot sa log","Ibinahagi ang passage plan sa pilot; dokumentado ang handover ng ECDIS/radar con"],"fx":"ANO ANG HINIHINGI:\nMaster–Pilot information exchange (MPX) at pilot card sa bawat pilotage.\n\nKAILAN MAY FINDING:\n• Hindi kumpleto ang pilot card\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang pilot cards ng huling voyage\n\nTANDAAN:\n• Hindi pinapalitan ng pilot ang responsibilidad ng Master","ff":["Hindi kumpleto ang Master-Pilot exchange / pilot card sa bawat pilotage","Hindi napag-usapan sa pilot ang UKC, pilot boarding arrangement at passage plan"]},{"id":"3.7","s":"3","sn":"Navigation","a":"BRG","h":1,"c":["Company UKC & air draft policy on bridge","UKC calculation for last port – squat, tide, safety margin included & CORRECT (inspector re-checks)","Air draft calc where bridges/cranes involved"],"o":"Has the vessel’s manager produced a guideline for under keel clearance and air draft clearance? (M)","eg":"Company UKC & air draft instruction and correct calculations.","ex":"WHAT IS ASKED:\nA company instruction for UKC and air draft, and correct calculations.\n\nFINDING WHEN:\n• No instruction or wrong UKC calculation\n\nWHAT THE INSPECTOR DOES:\n• Re-checks the UKC calculation\n\nREMEMBER:\n• The calculation must include squat, tide, safety margin","fg":"UKC at air draft instruction ng company at tamang computation.","fc":["Company UKC at air draft policy nasa bridge","UKC calculation ng huling port – may squat, tide, safety margin at TAMA (inuulit ito ng inspector)","Air draft calc kung may tulay/crane"],"fx":"ANO ANG HINIHINGI:\nMay instruction ang company para sa UKC at air draft, at tama ang computation.\n\nKAILAN MAY FINDING:\n• Walang instruction o mali ang UKC calculation\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Inuulit ang UKC calculation\n\nTANDAAN:\n• Dapat kasama sa computation ang squat, tide, safety margin"},{"id":"3.8","s":"3","sn":"Navigation","a":"BRG","h":0,"c":["Fire/safety round records each watch (log or checklist)","Rounds cover accommodation, ER (UMS), deck at night in port"],"o":"Are the fire and safety rounds being conducted at the end of each watch? (V)","eg":"Fire & safety rounds at the end of each watch.","ex":"WHAT IS ASKED:\nFire & safety rounds at the end of each watch.\n\nFINDING WHEN:\n• Not done or not recorded\n\nWHAT THE INSPECTOR DOES:\n• Checks records\n\nREMEMBER:\n• Includes accommodation, and ER when UMS","fg":"Fire & safety rounds sa dulo ng bawat watch.","fc":["Fire/safety round records bawat watch (log o checklist)","Sakop ng rounds ang accommodation, ER (UMS), deck sa gabi sa pantalan"],"fx":"ANO ANG HINIHINGI:\nFire & safety rounds sa dulo ng bawat watch.\n\nKAILAN MAY FINDING:\n• Hindi ginagawa o hindi naka-record\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang records\n\nTANDAAN:\n• Kasama ang accommodation, at ER kapag UMS"},{"id":"3.9","s":"3","sn":"Navigation","a":"BRG","h":0,"c":["Bridge manning matrix posted (open sea / coastal / restricted vis / pilotage / anchor)","Deck log shows lookout posted at night & in restricted visibility","Master on bridge per matrix at port approach"],"o":"Does the manning level in the bridge at all stages of the voyage and anchor meet or exceed that required by the Bridge Manning Matrix and are lookout arrangements adequate? (V)","f":["Bridge manning not as per matrix (e.g. no lookout at night, Master not on bridge in pilotage/TSS)"],"eg":"Bridge manning matrix and lookout followed at every stage.","ex":"WHAT IS ASKED:\nBridge manning as per the Bridge Manning Matrix at every stage, with a proper lookout.\n\nFINDING WHEN:\n• Fewer than the matrix or no lookout\n\nWHAT THE INSPECTOR DOES:\n• Compares the matrix with the deck log\n\nREMEMBER:\n• COLREG Rule 5: lookout at all times\n• Night and restricted visibility: separate lookout","fg":"Sinusunod ang bridge manning matrix at lookout sa bawat stage.","fc":["Nakapaskil ang bridge manning matrix (open sea / coastal / restricted vis / pilotage / anchor)","Makikita sa deck log na may lookout sa gabi at sa restricted visibility","Nasa bridge ang Master ayon sa matrix sa port approach"],"fx":"ANO ANG HINIHINGI:\nAng tao sa bridge ay ayon sa Bridge Manning Matrix sa bawat stage, may tamang lookout.\n\nKAILAN MAY FINDING:\n• Kulang sa matrix o walang lookout\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Ikinukumpara ang matrix sa deck log\n\nTANDAAN:\n• COLREG Rule 5: laging may lookout\n• Gabi at restricted visibility: hiwalay na lookout","ff":["Bridge manning hindi ayon sa matrix (hal. walang lookout sa gabi, wala ang Master sa bridge sa pilotage/TSS)"]},{"id":"3.10","s":"3","sn":"Navigation","a":"BRG","h":1,"c":["Both radars, ARPA, ECDIS (main+backup), GPS, AIS, echo sounder, speed log, NAVTEX, VDR – no alarms","No outstanding defects without office notification","Radar magnetron hours / last change known","Rudder angle / RPM / pitch indicators working"],"o":"Is navigation equipment in good order? (V)","f":["Defective nav equipment without office notification / alternative arrangement","Radar magnetron beyond hours with no per-watch performance check & no spare"],"eg":"All navigation equipment works – radar, ECDIS, echo sounder, speed log, NAVTEX.","ex":"WHAT IS ASKED:\nAll navigation equipment must work.\n\nFINDING WHEN:\n• Defective equipment without informing office/authorities\n\nWHAT THE INSPECTOR DOES:\n• Checks radars, ECDIS, GPS, AIS, echo sounder, speed log etc.\n• For radar: writes when the magnetron was last changed (not a finding)\n\nREMEMBER:\n• SOLAS V/19 for required equipment","fg":"Gumagana ang lahat ng navigation equipment – radar, ECDIS, echo sounder, speed log, NAVTEX.","fc":["Dalawang radar, ARPA, ECDIS (main+backup), GPS, AIS, echo sounder, speed log, NAVTEX, VDR – walang alarm","Walang outstanding defect na hindi alam ng opisina","Alam ang radar magnetron hours / huling palit","Gumagana ang rudder angle / RPM / pitch indicators"],"fx":"ANO ANG HINIHINGI:\nDapat gumagana ang lahat ng navigation equipment.\n\nKAILAN MAY FINDING:\n• Sirang equipment na hindi ini-report sa opisina/awtoridad\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang radar, ECDIS, GPS, AIS, echo sounder, speed log atbp.\n• Sa radar: isinusulat kung kailan huling pinalitan ang magnetron (hindi finding)\n\nTANDAAN:\n• SOLAS V/19 para sa kailangang equipment","ff":["Sirang nav equipment na hindi ini-report sa opisina / walang alternatibong arrangement","Lampas sa oras ang radar magnetron, walang performance check bawat watch at walang spare"]},{"id":"3.11","s":"3","sn":"Navigation","a":"BRG","h":1,"c":["Test nav light panel: main & emergency supply, all lights burn, failure alarm works","Shapes (balls, cone, diamond) on board, good condition","Daylight signalling lamp with charged battery; whistle & bell work","Spare lamps available"],"o":"Are navigation lights, emergency navigation lights, shapes and signalling equipment in working order? (V)","eg":"Navigation lights, emergency nav lights, shapes, whistle, Aldis/daylight signal lamp.","ex":"WHAT IS ASKED:\nNavigation lights (main and emergency), shapes and sound/light signals must work.\n\nFINDING WHEN:\n• A light does not burn or shapes are missing\n\nWHAT THE INSPECTOR DOES:\n• Switches on the lights from the panel\n• Checks the failure alarm and emergency supply\n\nREMEMBER:\n• COLREG Annex I\n• Daylight signalling lamp with battery","fg":"Navigation lights, emergency nav lights, shapes, whistle, Aldis/daylight signal lamp.","fc":["Subukan ang nav light panel: main at emergency supply, umiilaw lahat, gumagana ang failure alarm","Shapes (bola, cone, diamond) nasa barko, maayos","Daylight signalling lamp na may charged na battery; gumagana ang whistle at bell","May spare na bumbilya"],"fx":"ANO ANG HINIHINGI:\nDapat gumagana ang navigation lights (main at emergency), shapes at sound/light signals.\n\nKAILAN MAY FINDING:\n• May ilaw na hindi umiilaw o kulang ang shapes\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Binubuksan ang ilaw mula sa panel\n• Chine-check ang failure alarm at emergency supply\n\nTANDAAN:\n• COLREG Annex I\n• Daylight signalling lamp na may battery"},{"id":"3.12","s":"3","sn":"Navigation","a":"BRG","h":1,"c":["BNWAS in AUTO at sea AND at anchor – records/logbook entries show it","Key/password controlled by Master only","Dormant period set correctly (3–12 min); tests logged","OOWs explain procedure"],"o":"Are navigation officers familiar with the company procedure for the use of the Bridge Navigational Watch Alarm System (BNWAS), were records available to demonstrate that it had been operated when the ship was underway and at anchor, and tested in accordance with the procedure? (V)","f":["BNWAS OFF at anchor or in port","Dormant period not set / key or password not controlled by Master"],"eg":"BNWAS ON at sea and at anchor, with records; officers know the procedure.","ex":"WHAT IS ASKED:\nBNWAS working at sea and at anchor, with records, and officers know the procedure.\n\nFINDING WHEN:\n• BNWAS off at sea/at anchor or no records\n\nWHAT THE INSPECTOR DOES:\n• Asks the OOWs\n• Checks records\n\nREMEMBER:\n• SOLAS V/19\n• Dormant period 3–12 minutes\n• Key only with the Master","fg":"BNWAS naka-ON sa dagat at sa angkla, may records; alam ng officers ang procedure.","fc":["BNWAS naka-AUTO sa dagat AT sa angkla – makikita sa records/logbook","Ang key/password ay hawak lang ng Master","Tama ang dormant period (3–12 min); naka-log ang tests","Kayang ipaliwanag ng OOW ang procedure"],"fx":"ANO ANG HINIHINGI:\nGumagana ang BNWAS sa dagat at sa angkla, may records, at alam ng officers ang procedure.\n\nKAILAN MAY FINDING:\n• Naka-off ang BNWAS sa dagat/angkla o walang records\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Tinatanong ang OOW\n• Chine-check ang records\n\nTANDAAN:\n• SOLAS V/19\n• Dormant period 3–12 minuto\n• Ang key ay sa Master lang","ff":["Naka-OFF ang BNWAS sa angkla o sa pantalan","Hindi naka-set ang dormant period / hindi kontrolado ng Master ang key o password"]},{"id":"3.13","s":"3","sn":"Navigation","a":"BRG","h":0,"c":["Deviation card valid (adjusted within 2 years / after major changes)","Magnetic compass bubble-free, light working, binnacle in order","Gyro service per manufacturer – service report available (Finding if not)","Compass error book up to date"],"o":"Where fitted are the standard magnetic compass, gyro compass and Global Navigation Satellite System compass, operational, adjusted and properly maintained? (V & M)","eg":"Magnetic compass (deviation card <2 years), gyro service per maker, compass errors.","ex":"WHAT IS ASKED:\nMagnetic compass, gyro and GNSS compass working, adjusted and maintained.\n\nFINDING WHEN:\n• Gyro not serviced as per maker\n• Deviation card is old\n\nWHAT THE INSPECTOR DOES:\n• Checks deviation card, service reports, compass error book\n\nREMEMBER:\n• Compass adjusted every 2 years or after a major change\n• No bubble in the compass","fg":"Magnetic compass (deviation card <2 taon), gyro service ayon sa maker, compass errors.","fc":["Valid ang deviation card (na-adjust sa loob ng 2 taon / pagkatapos ng malaking pagbabago)","Walang bula ang magnetic compass, gumagana ang ilaw, maayos ang binnacle","Gyro service ayon sa manufacturer – may service report (finding kung wala)","Updated ang compass error book"],"fx":"ANO ANG HINIHINGI:\nGumagana, naka-adjust at naaalagaan ang magnetic compass, gyro at GNSS compass.\n\nKAILAN MAY FINDING:\n• Walang service ang gyro ayon sa maker\n• Luma na ang deviation card\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang deviation card, service reports, compass error book\n\nTANDAAN:\n• Ina-adjust ang compass bawat 2 taon o pagkatapos ng malaking pagbabago\n• Walang bula sa compass"},{"id":"3.14","s":"3","sn":"Navigation","a":"BRG","h":0,"c":["Changeover auto↔manual recorded in deck log with time","Manual steering used in traffic/pilotage per SMS"],"o":"Where manual steering is engaged, is the change over from auto steering, and vice versa, recorded? (V)","eg":"Auto/manual steering changeovers recorded.","ex":"WHAT IS ASKED:\nEvery changeover from auto to manual steering and back is recorded.\n\nFINDING WHEN:\n• Not recorded\n\nWHAT THE INSPECTOR DOES:\n• Checks the deck log\n\nREMEMBER:\n• SOLAS V/24-25","fg":"Naka-record ang palit ng auto/manual steering.","fc":["Palit auto↔manual naka-record sa deck log na may oras","Gumagamit ng manual steering sa traffic/pilotage ayon sa SMS"],"fx":"ANO ANG HINIHINGI:\nNaka-record ang bawat palit mula auto papuntang manual steering at pabalik.\n\nKAILAN MAY FINDING:\n• Hindi naka-record\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang deck log\n\nTANDAAN:\n• SOLAS V/24-25"},{"id":"3.15","s":"3","sn":"Navigation","a":"BRG","h":0,"c":["VDR data save procedure posted by VDR control unit","OOWs demonstrate 'save' button / procedure","Company policy on VDR playback in SMS; VDR APT valid"],"o":"Are deck officers familiar with the procedure to preserve the VDR data in the event of an incident and is there a company policy within the SMS relating to the playback of VDR data? (V)","eg":"Officers know how to save VDR data after an incident.","ex":"WHAT IS ASKED:\nOfficers know how to save VDR data after an accident, and there is a company policy for playback.\n\nFINDING WHEN:\n• Officers do not know the procedure\n\nWHAT THE INSPECTOR DOES:\n• Asks the OOW to show it\n\nREMEMBER:\n• VDR Annual Performance Test (APT)","fg":"Alam ng officers kung paano i-save ang VDR data pagkatapos ng incident.","fc":["Nakapaskil ang VDR data save procedure sa VDR control unit","Kayang ipakita ng OOW ang 'save' button / procedure","Company policy sa VDR playback nasa SMS; valid ang VDR APT"],"fx":"ANO ANG HINIHINGI:\nAlam ng officers kung paano i-save ang VDR data pagkatapos ng aksidente, at may company policy para sa playback.\n\nKAILAN MAY FINDING:\n• Hindi alam ng officers ang procedure\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Pinapakita sa OOW\n\nTANDAAN:\n• VDR Annual Performance Test (APT)"},{"id":"3.16","s":"3","sn":"Navigation","a":"BRG","h":1,"c":["ENC permits valid, latest updates applied (check ECDIS update status & week no.)","Paper charts (if any) corrected; chart correction log","Publications list: latest editions (List of Lights, ALRS, Sailing Directions, Tide Tables)","e-Publications licences valid"],"o":"Is a chart and publication management system being implemented to ensure that all charts, nautical publications, and other publications on board are current, maintained and up to date? (V & M)","eg":"Charts & publications updated (ENC permits, weekly NtM, publications list).","ex":"WHAT IS ASKED:\nA chart and publication management system so that everything is up to date.\n\nFINDING WHEN:\n• Old editions, ENCs without updates, expired licences\n\nWHAT THE INSPECTOR DOES:\n• Checks ECDIS update status and the publications list\n\nREMEMBER:\n• SOLAS V/27","fg":"Updated ang charts at publications (ENC permits, weekly NtM, publications list).","fc":["Valid ang ENC permits, naka-apply ang pinakabagong updates (i-check ang ECDIS update status at week no.)","Na-correct ang paper charts (kung meron); chart correction log","Publications list: pinakabagong edition (List of Lights, ALRS, Sailing Directions, Tide Tables)","Valid ang e-Publications licences"],"fx":"ANO ANG HINIHINGI:\nMay sistema sa pag-manage ng charts at publications para laging updated.\n\nKAILAN MAY FINDING:\n• Lumang edition, ENC na walang update, expired na licence\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang ECDIS update status at publications list\n\nTANDAAN:\n• SOLAS V/27"},{"id":"3.17","s":"3","sn":"Navigation","a":"BRG","h":0,"c":["Largest-scale ENCs/charts for previous voyage were installed & up to date","No 'not available' cells along previous route"],"o":"Were appropriate charts and publication used for the previous voyage? (V)","eg":"Suitable charts & publications for the previous voyage.","ex":"WHAT IS ASKED:\nCorrect, updated charts and publications were used on the previous voyage.\n\nFINDING WHEN:\n• Cells missing or not updated\n\nWHAT THE INSPECTOR DOES:\n• Checks the route of the previous voyage\n\nREMEMBER:\n• Largest scale for the area","fg":"Angkop na charts at publications para sa nakaraang voyage.","fc":["Largest-scale ENC/charts ng nakaraang voyage ay naka-install at updated","Walang 'not available' cells sa nakaraang ruta"],"fx":"ANO ANG HINIHINGI:\nTama at updated ang charts at publications na ginamit sa nakaraang voyage.\n\nKAILAN MAY FINDING:\n• Kulang o hindi updated ang cells\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang ruta ng nakaraang voyage\n\nTANDAAN:\n• Largest scale para sa area"},{"id":"3.18","s":"3","sn":"Navigation","a":"BRG","h":1,"c":["ECDIS software meets current IHO standards (check 'presentation library'/S-52 version)","Officers demonstrate: safety contour/depth, alarms, route check, look-ahead, layers, MOB, overlay","ECDIS type-specific familiarisation evidence"],"o":"Is the ECDIS of an approved type, compliant with SOLAS requirements, and can the Master and watch keeping officers demonstrate familiarity with its use? (V)","eg":"ECDIS type approved, latest IHO S-52/S-63 standards; OOWs can operate it.","ex":"WHAT IS ASKED:\nECDIS is type approved with current IHO standards, and officers can operate it.\n\nFINDING WHEN:\n• Old IHO standards\n• OOW cannot show basic functions\n\nWHAT THE INSPECTOR DOES:\n• Checks the IHO S-52/S-63 version\n• Asks to see: safety contour, alarms, route check, layers\n\nREMEMBER:\n• SOLAS V/19 and V/27","fg":"ECDIS type approved, pinakabagong IHO S-52/S-63 standards; marunong gumamit ang OOW.","fc":["Ang ECDIS software ay pasok sa kasalukuyang IHO standards (i-check ang 'presentation library'/S-52 version)","Kayang ipakita ng officers: safety contour/depth, alarms, route check, look-ahead, layers, MOB, overlay","May patunay ng ECDIS type-specific familiarisation"],"fx":"ANO ANG HINIHINGI:\nType approved ang ECDIS na may kasalukuyang IHO standards, at marunong gumamit ang officers.\n\nKAILAN MAY FINDING:\n• Lumang IHO standards\n• Hindi maipakita ng OOW ang basic functions\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang IHO S-52/S-63 version\n• Gustong makita: safety contour, alarms, route check, layers\n\nTANDAAN:\n• SOLAS V/19 at V/27"},{"id":"3.20","s":"3","sn":"Navigation","a":"BRG","h":0,"c":["T&P NMs applied as manual updates / AIO displayed","NAVTEX/EGC warnings relevant to current area plotted","Officer can show currently displayed warnings"],"o":"Are T&P NMs and navigation warnings being used correctly in voyage planning and monitoring? (V)","eg":"T&P notices & NAVAREA warnings applied on ECDIS/charts.","ex":"WHAT IS ASKED:\nT&P notices and navigation warnings are applied in planning and monitoring.\n\nFINDING WHEN:\n• Not displayed or not applied\n\nWHAT THE INSPECTOR DOES:\n• Asks to see the warnings now on screen\n• Checks if there is a management system\n\nREMEMBER:\n• NAVTEX and EGC for the area","fg":"T&P notices at NAVAREA warnings naka-apply sa ECDIS/charts.","fc":["T&P NMs naka-apply bilang manual updates / naka-display ang AIO","NAVTEX/EGC warnings para sa kasalukuyang area naka-plot","Kayang ipakita ng officer ang mga warning na naka-display ngayon"],"fx":"ANO ANG HINIHINGI:\nAng T&P notices at navigation warnings ay naka-apply sa planning at monitoring.\n\nKAILAN MAY FINDING:\n• Hindi naka-display o hindi naka-apply\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Gustong makita ang warnings na nasa screen ngayon\n• Chine-check kung may management system\n\nTANDAAN:\n• NAVTEX at EGC para sa area"},{"id":"3.21","s":"3","sn":"Navigation","a":"BRG","h":1,"c":["Review last voyage on ECDIS: track vs plan, safe distance off, no-go areas respected","Position fixing intervals per SMS; barometer & weather logged","ECDIS safety settings correct; no alarms ignored","ECA/environmental zones & reporting systems complied","Compass errors & radar performance checked"],"o":"Has the vessel been safely navigated in compliance with international and inland regulations? (V)","eg":"The previous voyage was safe: distance off, positions, ECDIS alarms, weather.","ex":"WHAT IS ASKED:\nThe ship sailed safely and as per the regulations.\n\nFINDING WHEN:\n• Unsafe navigation on the previous voyage\n\nWHAT THE INSPECTOR DOES:\n• Checks charts/ENC: largest scale, weather records, ECDIS alarms, distance off coasts and wrecks, fix frequency, barometer, NAVAREA, reporting systems, compass errors, layers\n\nREMEMBER:\n• Environmental zones (ECA etc.)","fg":"Ligtas ang nakaraang voyage: layo sa baybayin, positions, ECDIS alarms, panahon.","fc":["I-review ang huling voyage sa ECDIS: track kumpara sa plan, ligtas na layo, iginalang ang no-go areas","Position fixing intervals ayon sa SMS; naka-log ang barometer at panahon","Tama ang ECDIS safety settings; walang alarm na binalewala","Sinunod ang ECA/environmental zones at reporting systems","Na-check ang compass errors at radar performance"],"fx":"ANO ANG HINIHINGI:\nLigtas na naglayag ang barko at ayon sa regulasyon.\n\nKAILAN MAY FINDING:\n• Hindi ligtas na navigation sa nakaraang voyage\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang charts/ENC: largest scale, weather records, ECDIS alarms, layo sa baybayin at wreck, dalas ng fix, barometer, NAVAREA, reporting systems, compass errors, layers\n\nTANDAAN:\n• Environmental zones (ECA atbp.)"},{"id":"3.22","s":"3","sn":"Navigation","a":"BRG","h":0,"c":["Echo sounder ON from port approach to berth & departure – logbook / printout","Recorder time & paper/data correct"],"o":"Are records available to show that the echo-sounder recorder is being switched on prior to each approach to shallow water, port entry and departure and has the echo sounder remained in operation while the vessel has been transiting in shallow waters? (V)","eg":"Echo sounder ON in shallow water and port entry/departure, with records.","ex":"WHAT IS ASKED:\nEcho sounder on in shallow water and when entering and leaving port, with records.\n\nFINDING WHEN:\n• No records\n\nWHAT THE INSPECTOR DOES:\n• Checks the log or printout","fg":"Echo sounder naka-ON sa mababaw na tubig at sa pagpasok/paglabas ng pantalan, may records.","fc":["Echo sounder naka-ON mula port approach hanggang berth at sa departure – logbook / printout","Tama ang oras at papel/data ng recorder"],"fx":"ANO ANG HINIHINGI:\nNaka-on ang echo sounder sa mababaw na tubig at sa pagpasok at paglabas ng pantalan, may records.\n\nKAILAN MAY FINDING:\n• Walang records\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang log o printout"},{"id":"3.23","s":"3","sn":"Navigation","a":"BRG","h":1,"c":["Passage plan berth-to-berth incl. pilotage waters, approved & signed by Master","All officers signed briefing","ECDIS route check (validation) documented & saved","Abort points, contingency anchorages, UKC, tidal windows, reporting points, no-go areas"],"o":"Was the berth-to-berth passage plan of the previous voyage comprehensive and approved by the Master? (V)","eg":"Berth-to-berth passage plan, approved by Master, route check documented.","ex":"WHAT IS ASKED:\nBerth-to-berth passage plan, complete and approved by the Master.\n\nFINDING WHEN:\n• Plan incomplete or not approved\n• No route validation check\n\nWHAT THE INSPECTOR DOES:\n• Checks the plan of the previous voyage and the briefing\n\nREMEMBER:\n• IMO A.893(21): appraisal, planning, execution, monitoring\n• Abort points, contingencies, UKC, no-go areas","fg":"Berth-to-berth passage plan, aprubado ng Master, dokumentado ang route check.","fc":["Passage plan berth-to-berth kasama ang pilotage waters, aprubado at may pirma ng Master","Lahat ng officer pumirma sa briefing","ECDIS route check (validation) dokumentado at naka-save","Abort points, contingency anchorages, UKC, tidal windows, reporting points, no-go areas"],"fx":"ANO ANG HINIHINGI:\nBerth-to-berth passage plan, kumpleto at aprubado ng Master.\n\nKAILAN MAY FINDING:\n• Kulang ang plan o walang approval\n• Walang route validation check\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang plan ng nakaraang voyage at ang briefing\n\nTANDAAN:\n• IMO A.893(21): appraisal, planning, execution, monitoring\n• Abort points, contingencies, UKC, no-go areas"},{"id":"3.24","s":"3","sn":"Navigation","a":"BRG","h":0,"c":["Parallel index lines pre-planned on radar / in plan for coastal & pilotage","Position checks by independent means (radar ranges/visual)"],"o":"Was the ship’s track monitored at sea and during pilotage, and were parallel indexing techniques used to monitor the passage in coastal and pilotage waters ,particularly during restricted visibility or nighttime conditions? (V)","eg":"Track monitoring and parallel indexing in coastal/pilotage waters.","ex":"WHAT IS ASKED:\nMonitoring the track and parallel indexing near coasts and in pilotage, especially at night or in poor visibility.\n\nFINDING WHEN:\n• No PI lines or fixes\n\nWHAT THE INSPECTOR DOES:\n• Checks the plan and radar","fg":"Pagbabantay ng track at parallel indexing sa coastal/pilotage.","fc":["May naka-plan na parallel index lines sa radar / sa plan para sa coastal at pilotage","Position checks gamit ang ibang paraan (radar ranges/visual)"],"fx":"ANO ANG HINIHINGI:\nPagbabantay ng track at parallel indexing malapit sa baybayin at sa pilotage, lalo na sa gabi o masamang visibility.\n\nKAILAN MAY FINDING:\n• Walang PI lines o fixes\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang plan at radar"},{"id":"3.26","s":"3","sn":"Navigation","a":"BRG","h":0,"c":["GPS datum = WGS84 on all receivers","Officers explain HDOP, loss of fix, spoofing/jamming signs & actions"],"o":"Is the Global Navigation Satellite System (GNSS) set to the correct Geodetic Datum, and are officers aware of the errors and alarms associated with GNSS?","eg":"GNSS on WGS84; officers know the errors/alarms (spoofing/jamming).","ex":"WHAT IS ASKED:\nGNSS on the correct datum (WGS84) and the officers know the errors and alarms.\n\nFINDING WHEN:\n• Wrong datum or officers do not know\n\nWHAT THE INSPECTOR DOES:\n• Asks about HDOP, jamming, spoofing","fg":"GNSS naka-WGS84; alam ng officers ang errors/alarms (spoofing/jamming).","fc":["GPS datum = WGS84 sa lahat ng receiver","Kayang ipaliwanag ng officers ang HDOP, loss of fix, palatandaan ng spoofing/jamming at ang gagawin"],"fx":"ANO ANG HINIHINGI:\nNasa tamang datum (WGS84) ang GNSS at alam ng officers ang errors at alarms.\n\nKAILAN MAY FINDING:\n• Maling datum o hindi alam ng officers\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Nagtatanong tungkol sa HDOP, jamming, spoofing"},{"id":"3.27","s":"3","sn":"Navigation","a":"BRG","h":0,"c":["Weather routeing contract / reports for last ocean passage","Weather info records & how used in planning"],"o":"Does the vessel utilise a weather routeing service? (V)","eg":"Weather routing service and records.","ex":"WHAT IS ASKED:\nIf the ship uses a weather routing service.\n\nWHAT THE INSPECTOR DOES:\n• Records and checks how it is used","fg":"Weather routing service at records.","fc":["Weather routeing contract / reports ng huling ocean passage","Records ng weather info at kung paano ginamit sa planning"],"fx":"ANO ANG HINIHINGI:\nKung gumagamit ang barko ng weather routing service.\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Itinatala at chine-check kung paano ito ginagamit"},{"id":"3.28","s":"3","sn":"Navigation","a":"BRG","h":0,"c":["SMS procedure limiting mobile phones/PEDs on bridge – posted","Officers aware"],"o":"Are there procedures in place to limit the use of cell phones, personal electronic devices, the internet, and email on the bridge?","eg":"Policy for mobile phones/internet on the bridge.","ex":"WHAT IS ASKED:\nA procedure limiting mobile phones, internet and email on the bridge.\n\nFINDING WHEN:\n• No procedure\n\nWHAT THE INSPECTOR DOES:\n• Checks the SMS","fg":"Policy sa cellphone/internet sa bridge.","fc":["SMS procedure na naglilimita sa cellphone/PED sa bridge – nakapaskil","Alam ng officers"],"fx":"ANO ANG HINIHINGI:\nMay procedure na naglilimita sa cellphone, internet at email sa bridge.\n\nKAILAN MAY FINDING:\n• Walang procedure\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang SMS"},{"id":"4.1","s":"4","sn":"ISM System","a":"DOC","h":0,"c":["Latest SMS revision on board; revision record updated, obsolete removed","List of mandatory publications per SMS – all present & latest editions","Crew can find key procedures"],"o":"Has the vessel’s manager established a documented system for personnel to effectively implement the ISM Code? (V)","eg":"ISM manuals latest revision; SMS publications list available.","ex":"WHAT IS ASKED:\nThe SMS is the latest edition and is applied.\n\nFINDING WHEN:\n• No list of the publications required by the SMS\n\nWHAT THE INSPECTOR DOES:\n• Checks the revision of the manuals\n\nREMEMBER:\n• No finding for optional publications, unless the SMS requires them","fg":"ISM manuals pinakabagong revision; may listahan ng SMS publications.","fc":["Pinakabagong SMS revision sa barko; updated ang revision record, tinanggal ang luma","Listahan ng mandatory publications ayon sa SMS – kumpleto at pinakabagong edition","Kayang hanapin ng crew ang mahahalagang procedure"],"fx":"ANO ANG HINIHINGI:\nPinakabagong edition ang SMS at ipinapatupad.\n\nKAILAN MAY FINDING:\n• Walang listahan ng publications na kailangan ng SMS\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang revision ng manuals\n\nTANDAAN:\n• Walang finding sa optional publications, maliban kung kailangan ng SMS"},{"id":"4.2","s":"4","sn":"ISM System","a":"DOC","h":1,"c":["Safety officer appointment letter & training","Monthly safety committee minutes – office feedback/acknowledgement attached","Monthly safety inspections of deck, ER, accommodation recorded"],"o":"Has a safety officer been appointed and adequately trained, onboard safety meetings held regularly and acknowledged by the vessel’s manager, with feedback provided where necessary, and are safety inspections of the main deck, machinery space, accommodation and forecastle store conducted at regular intervals in accordance with the company’s procedures, and are health, safety, and environmental hazards effectively identified? (V)","f":["Safety meeting minutes repetitive, no office feedback","Safety officer inspections tick-box, not all accessible areas"],"eg":"Safety officer appointed/trained, monthly safety meetings with office feedback, safety inspections.","ex":"WHAT IS ASKED:\nSafety officer appointed and trained, safety meetings with office reply, safety inspections of deck, ER, accommodation.\n\nFINDING WHEN:\n• Meetings not held or office feedback missing\n\nWHAT THE INSPECTOR DOES:\n• Checks minutes and inspections","fg":"Safety officer na appointed/trained, monthly safety meetings na may feedback ng opisina, safety inspections.","fc":["Appointment letter at training ng safety officer","Monthly safety committee minutes – may feedback/acknowledgement ng opisina","Monthly safety inspections ng deck, ER, accommodation naka-record"],"fx":"ANO ANG HINIHINGI:\nAppointed at trained ang safety officer, may safety meetings na sinasagot ng opisina, safety inspections sa deck, ER, accommodation.\n\nKAILAN MAY FINDING:\n• Hindi ginagawa ang meetings o walang feedback ng opisina\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang minutes at inspections","ff":["Paulit-ulit ang safety meeting minutes, walang feedback ng opisina","Tick-box lang ang safety officer inspections, hindi lahat ng area"]},{"id":"4.3","s":"4","sn":"ISM System","a":"DOC","h":0,"c":["Last internal & external ISM audit reports on board","Last 2 superintendent inspection reports","All NCs/observations closed or with valid due dates & evidence"],"o":"Are the latest shipboard internal and external audits, as well as the superintendent inspection reports, available? Are corrective actions being taken in response to recorded non-conformances?","f":["Superintendent inspection overdue (>6 months ±1)","Audit NCs/observations not closed by due date"],"eg":"Internal/external audit reports & superintendent reports; NCs closed.","ex":"WHAT IS ASKED:\nLatest internal/external audits and superintendent reports on board, with corrective action for the NCs.\n\nFINDING WHEN:\n• Reports missing or open NCs without action\n\nWHAT THE INSPECTOR DOES:\n• Checks t
