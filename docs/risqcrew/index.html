here is a company inspection programme\n\nREMEMBER:\n• ISM Code 12","fg":"Internal/external audit reports at superintendent reports; sarado ang NCs.","fc":["Huling internal at external ISM audit reports nasa barko","Huling 2 superintendent inspection reports","Lahat ng NC/observation sarado o may valid na due date at patunay"],"fx":"ANO ANG HINIHINGI:\nNasa barko ang huling internal/external audits at superintendent reports, may corrective action sa NCs.\n\nKAILAN MAY FINDING:\n• Kulang ang reports o bukas na NC na walang aksyon\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check kung may inspection programme ang company\n\nTANDAAN:\n• ISM Code 12","ff":["Overdue ang superintendent inspection (>6 buwan ±1)","Hindi naisara sa due date ang audit NCs/observations"]},{"id":"4.4","s":"4","sn":"ISM System","a":"DOC","h":0,"c":["Last Master's Review signed & sent","Office reply/feedback on file"],"o":"Does the Master periodically review the effectiveness of the onboard Safety Management System, report the findings to shore based management and receive feedback from them? (M)","f":["Master's Review generic / no evidence-based feedback / no office response"],"eg":"Master's review of the SMS sent and office reply on file.","ex":"WHAT IS ASKED:\nThe Master reviews the SMS, sends it to the office and gets a reply.\n\nFINDING WHEN:\n• No review or no reply\n\nWHAT THE INSPECTOR DOES:\n• Checks the last Master's Review\n\nREMEMBER:\n• ISM Code 5","fg":"Naipadala ang Master's review ng SMS at may sagot ang opisina.","fc":["Huling Master's Review may pirma at naipadala","Naka-file ang sagot/feedback ng opisina"],"fx":"ANO ANG HINIHINGI:\nNire-review ng Master ang SMS, ipinapadala sa opisina at may sagot.\n\nKAILAN MAY FINDING:\n• Walang review o walang sagot\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang huling Master's Review\n\nTANDAAN:\n• ISM Code 5","ff":["Generic ang Master's Review / walang feedback na may batayan / walang sagot ang opisina"]},{"id":"4.5","s":"4","sn":"ISM System","a":"LSA","h":1,"c":["Enclosed Space Register (all spaces, risk-assessed) & entrances marked 'Danger – Enclosed Space'","Last entry permits: O2/HC/H2S/CO readings, times, rescue team, comms – complete & signed","Every entrant had calibrated personal gas monitor (Finding if not)","No single-person entry; shore personnel covered","Training records for persons assigned entry duties","Times: gas test BEFORE the entry time; readings with time every 15 min while inside; RA yellow/red scores have additional measures + residual score","📋 Inspector: Enclosed space limits in the SMS procedure: flammable gas ≤1% LEL, CO ≤20 ppm, H2S ≤5 ppm, CO2 ≤5000 ppm"],"o":"Is the vessel provided with an enclosed space entry procedure, and is there documented evidence that it was followed, and is there evidence that the crew assigned to responsibilities requiring entry into enclosed spaces has attended a dedicated enclosed space entry course?","f":["Enclosed space register missing, not ship-specific or incomplete (chain locker, duct keel, CO2 room, forepeak, void spaces)","Entrances not marked 'DANGER ENCLOSED SPACE' / access not secured","Entry permit without readings at different levels or re-test times","Crew entering without dedicated enclosed space entry course","Shore staff/stevedores in holds without risk assessment & gas check (MSC.581(110))","Gas test time on the permit AFTER the entry time (e.g. tested 09:05, entry 09:00) — atmosphere not verified before entry","Risk assessment: hazards scored medium/high (e.g. 9, 12 – yellow) with NO additional control measures and no residual risk","Only the initial reading recorded — no atmosphere readings with times every 15 min while personnel inside (e.g. 08:00 → afternoon)","Responsible officer (C/O) went INSIDE the space himself — the officer in charge must stay outside at the entrance and supervise, not take part in the entry"],"eg":"Enclosed space: register, permits, gas readings, NEVER single entry, personal gas meter.","ex":"WHAT IS ASKED:\nAn enclosed space entry procedure, evidence it is applied, and training of those who enter.\n\nFINDING WHEN:\n• Someone entered without a calibrated personal gas monitor\n• Single-person entry\n• Gas test time on the permit AFTER the entry time\n• RA yellow/red score (e.g. 9, 12) without additional measures & residual risk\n• No readings with time every 15 min while working inside\n• Responsible officer (C/O) went inside himself — must stay outside and supervise\n\nWHAT THE INSPECTOR DOES:\n• Checks the Enclosed Space Register, permits, readings\n\nREMEMBER:\n• Risk assessment for all enclosed spaces\n• Covers shore personnel too\n• SOLAS XI-1/7: portable measuring instrument","fg":"Enclosed space: register, permits, gas readings, HINDI kailanman mag-isa, personal gas meter.","fc":["Enclosed Space Register (lahat ng space, may risk assessment) at may markang 'Danger – Enclosed Space' ang pasukan","Huling entry permits: O2/HC/H2S/CO readings, oras, rescue team, comms – kumpleto at may pirma","Bawat pumasok ay may calibrated personal gas monitor (finding kung wala)","Walang pumapasok nang mag-isa; sakop ang shore personnel","Training records ng mga naka-assign sa entry","Oras: gas test BAGO ang oras ng pagpasok; readings na may oras bawat 15 minuto habang nasa loob; ang dilaw/pulang score sa RA ay may additional measures + residual score","📋 Inspector: Enclosed space limits in the SMS procedure: flammable gas ≤1% LEL, CO ≤20 ppm, H2S ≤5 ppm, CO2 ≤5000 ppm"],"fx":"ANO ANG HINIHINGI:\nMay procedure sa pagpasok sa enclosed space, may patunay na ginagawa, at may training ang pumapasok.\n\nKAILAN MAY FINDING:\n• May pumasok na walang calibrated personal gas monitor\n• Pumasok nang mag-isa\n• Oras ng gas test sa permit PAGKATAPOS ng oras ng pagpasok\n• RA na dilaw/pula ang score (hal. 9, 12) na walang additional measures at residual risk\n• Walang readings na may oras bawat 15 minuto habang nagtatrabaho sa loob\n• Ang responsible officer (C/O) mismo ay pumasok — dapat nasa labas at nagsu-supervise\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang Enclosed Space Register, permits, readings\n\nTANDAAN:\n• Risk assessment para sa lahat ng enclosed space\n• Sakop din ang tauhan mula sa shore\n• SOLAS XI-1/7: portable na instrumento sa pagsukat","ff":["Wala, hindi ship-specific o kulang ang enclosed space register (chain locker, duct keel, CO2 room, forepeak, void spaces)","Walang markang 'DANGER ENCLOSED SPACE' ang pasukan / hindi naka-secure","Entry permit na walang readings sa iba't ibang level o oras ng re-test","Crew na pumapasok nang walang enclosed space entry course","Shore staff/stevedores sa holds nang walang risk assessment at gas check (MSC.581(110))","Ang oras ng gas test sa permit ay PAGKATAPOS ng oras ng pagpasok (hal. test 09:05, pasok 09:00) — hindi na-verify ang hangin bago pumasok","Risk assessment: mga hazard na medium/high ang score (hal. 9, 12 – dilaw) na WALANG additional control measures at walang residual risk","Unang reading lang ang nakasulat — walang readings na may oras bawat 15 minuto habang may tao sa loob (hal. 08:00 → hapon)","Ang responsible officer (C/O) mismo ay PUMASOK sa loob — ang officer in charge ay dapat nasa labas sa pasukan at nagsu-supervise, hindi kasama sa pumapasok"]},{"id":"4.6","s":"4","sn":"ISM System","a":"LSA","h":1,"c":["Rescue drill at least every 2 months (SOLAS III/19) – records with scenario & space","Different spaces from register rotated","Rescue equipment (tripod, stretcher, SCBA) ready"],"o":"Is entry into and rescue from enclosed space training undertaken and are regular drills conducted? (V)","f":["Rescue drill not every 2 months or always in the same space","No debrief / lessons learned in drill record","Rescue equipment (tripod, stretcher, harness, comms) not ready"],"eg":"Enclosed space rescue drill every 2 months, in different spaces from the register.","ex":"WHAT IS ASKED:\nTraining and drills for rescue from an enclosed space.\n\nFINDING WHEN:\n• Drills not done\n\nWHAT THE INSPECTOR DOES:\n• Checks records and the spaces chosen\n\nREMEMBER:\n• SOLAS III/19: at least every 2 months\n• Rotate spaces from the register","fg":"Enclosed space rescue drill bawat 2 buwan, sa iba't ibang space mula sa register.","fc":["Rescue drill hindi bababa sa bawat 2 buwan (SOLAS III/19) – records na may scenario at space","Paikot ang iba't ibang space mula sa register","Handa ang rescue equipment (tripod, stretcher, SCBA)"],"fx":"ANO ANG HINIHINGI:\nTraining at drills para sa pagliligtas mula sa enclosed space.\n\nKAILAN MAY FINDING:\n• Hindi ginagawa ang drills\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang records at mga space na pinili\n\nTANDAAN:\n• SOLAS III/19: hindi bababa sa bawat 2 buwan\n• Paikutin ang mga space mula sa register","ff":["Rescue drill hindi bawat 2 buwan o laging sa parehong space","Walang debrief / lessons learned sa drill record","Hindi handa ang rescue equipment (tripod, stretcher, harness, comms)"]},{"id":"4.7","s":"4","sn":"ISM System","a":"DOC","h":0,"c":["Hot work procedure in SMS; permits for last jobs complete","Gas-free test, fire watch, extinguishers, isolation documented","Hot work outside workshop approved by office where SMS requires"],"o":"Are procedures in place for the control of hot work, are they incorporated in the safety management system and is there documented evidence of compliance? (M)","f":["Hot work outside workshop without approved office plan","Permit without gas readings / fire watch not recorded"],"eg":"Hot work permits complete with gas test, fire watch, risk assessment.","ex":"WHAT IS ASKED:\nA hot work procedure in the SMS and evidence it is applied.\n\nFINDING WHEN:\n• No permits or incomplete\n\nWHAT THE INSPECTOR DOES:\n• Checks hot work permits\n\nREMEMBER:\n• Gas test, fire watch, isolation","fg":"Hot work permits kumpleto na may gas test, fire watch, risk assessment.","fc":["May hot work procedure sa SMS; kumpleto ang permits ng huling trabaho","Dokumentado ang gas-free test, fire watch, extinguishers, isolation","Hot work sa labas ng workshop ay aprubado ng opisina kung kailangan ng SMS"],"fx":"ANO ANG HINIHINGI:\nMay hot work procedure sa SMS at patunay na ginagawa.\n\nKAILAN MAY FINDING:\n• Walang permit o kulang\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang hot work permits\n\nTANDAAN:\n• Gas test, fire watch, isolation","ff":["Hot work sa labas ng workshop na walang aprubadong plan ng opisina","Permit na walang gas readings / hindi naka-record ang fire watch"]},{"id":"4.8","s":"4","sn":"ISM System","a":"DOC","h":1,"c":["Permit-to-work records (work aloft/overside, electrical, cold work)","LOTO kit, tags & register – check one live isolation if any","Stop Work Authority policy posted; crew aware","Toolbox talks / TBRA records"],"o":"Has a specific permit to work, Lock-Out/Tag-Out (LOTO) system, and Stop Work Authority policy and procedure been introduced and are they being used effectively? (V)","f":["No permit for work aloft/overside/electrical seen during inspection","LOTO not applied / no LOTO register or tags","Crew unaware of Stop Work Authority"],"eg":"PTW, LOTO and Stop Work Authority – used in practice.","ex":"WHAT IS ASKED:\nPermit to work, LOTO and Stop Work Authority exist and are applied.\n\nFINDING WHEN:\n• Not applied in practice\n\nWHAT THE INSPECTOR DOES:\n• Checks permits, LOTO, toolbox talks\n• Checks that the TBRA is discussed with the crew","fg":"PTW, LOTO at Stop Work Authority – ginagamit talaga.","fc":["Permit-to-work records (work aloft/overside, electrical, cold work)","LOTO kit, tags at register – i-check ang isang aktibong isolation kung meron","Nakapaskil ang Stop Work Authority policy; alam ng crew","Toolbox talks / TBRA records"],"fx":"ANO ANG HINIHINGI:\nMay permit to work, LOTO at Stop Work Authority at ipinapatupad.\n\nKAILAN MAY FINDING:\n• Hindi ginagawa sa totoo\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang permits, LOTO, toolbox talks\n• Tinitingnan kung pinag-uusapan ang TBRA kasama ang crew","ff":["Walang permit para sa work aloft/overside/electrical na nakita habang may inspection","Hindi ginamit ang LOTO / walang LOTO register o tags","Hindi alam ng crew ang Stop Work Authority"]},{"id":"4.9","s":"4","sn":"ISM System","a":"LSA","h":1,"c":["Annual/monthly drill plan vs actual records","Fire & abandon ship monthly; each crew member participates","Drill reports with scenario, debrief, lessons learned","Drill times not clashing with rest hours (cross-check)","📋 Inspector: Drill intervals: fire & abandon ship 1M (24h if >25% crew change), davit lifeboat 3M, free-fall 6M, rescue boat 1M/3M, davit liferaft 4M, emergency steering 3M, enclosed space 2M, ISPS 3M, SOPEP 3M, helicopter 1Y, emergency hatch cover 1Y, ECDIS failure 3M"],"o":"Is there a schedule of drills and exercises to address potential emergency shipboard situations and is it being conducted effectively? (V)","f":["Drills on paper only – same scenario/time, no realistic records","No debrief / lessons learned"],"eg":"Drill schedule followed, realistic records (with debrief & lessons learned).","ex":"WHAT IS ASKED:\nA drill programme for all emergencies, and drills done properly.\n\nFINDING WHEN:\n• Drills not done, or fake on paper\n\nWHAT THE INSPECTOR DOES:\n• Checks schedule and reports\n\nREMEMBER:\n• SOLAS III/19: fire and abandon ship every month","fg":"Sinusunod ang drill schedule, makatotohanang records (may debrief at lessons learned).","fc":["Annual/monthly drill plan kumpara sa aktuwal na records","Fire at abandon ship buwan-buwan; kasali ang bawat crew","Drill reports na may scenario, debrief, lessons learned","Ang oras ng drill ay hindi sumasalungat sa rest hours (i-cross-check)","📋 Inspector: Drill intervals: fire & abandon ship 1M (24h if >25% crew change), davit lifeboat 3M, free-fall 6M, rescue boat 1M/3M, davit liferaft 4M, emergency steering 3M, enclosed space 2M, ISPS 3M, SOPEP 3M, helicopter 1Y, emergency hatch cover 1Y, ECDIS failure 3M"],"fx":"ANO ANG HINIHINGI:\nMay drill programme para sa lahat ng emergency at tama ang pagkakagawa.\n\nKAILAN MAY FINDING:\n• Hindi ginagawa ang drills o peke sa papel\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang schedule at reports\n\nTANDAAN:\n• SOLAS III/19: fire at abandon ship buwan-buwan","ff":["Drills sa papel lang – parehong scenario/oras, hindi makatotohanan ang records","Walang debrief / lessons learned"]},{"id":"4.10","s":"4","sn":"ISM System","a":"DOC","h":1,"c":["Get RightShip 24-month incident history – every incident must be on board with report","Near-miss reports flowing (healthy number)","Investigation reports or lessons-learned bulletins of last 12 months on board & discussed"],"o":"Are procedures for reporting, investigating, and closing out non-conformities, incidents, and hazardous situations available and being followed and, is an incident investigation report or a summarised lessons learned bulletin available for each reported incident? (V)","f":["Incident from RightShip 24-month history not found on board / no investigation report","No lessons-learned bulletin per incident","Near-miss reporting unrealistically low or trivial"],"eg":"Incident/near-miss reporting – ALL incidents of 24 months as per the RightShip record.","ex":"WHAT IS ASKED:\nReporting, investigation and close-out of incidents, near misses and NCs, with lessons learned.\n\nFINDING WHEN:\n• An incident in the RightShip record but not on the ship\n\nWHAT THE INSPECTOR DOES:\n• Compares with the RightShip 24-month incident history\n• Checks the incidents of 12 months","fg":"Incident/near-miss reporting – LAHAT ng incident sa 24 buwan ayon sa RightShip record.","fc":["Kunin ang RightShip 24-month incident history – bawat incident ay dapat nasa barko na may report","Tuloy-tuloy ang near-miss reports (sapat na bilang)","Investigation reports o lessons-learned bulletins ng huling 12 buwan nasa barko at napag-usapan"],"fx":"ANO ANG HINIHINGI:\nPag-report, imbestigasyon at pagsara ng incidents, near misses at NCs, may lessons learned.\n\nKAILAN MAY FINDING:\n• Incident na nasa record ng RightShip pero wala sa barko\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Ikinukumpara sa RightShip 24-month incident history\n• Chine-check ang incidents ng 12 buwan","ff":["Incident mula sa RightShip 24-month history na wala sa barko / walang investigation report","Walang lessons-learned bulletin sa bawat incident","Sobrang kaunti o walang kwenta ang near-miss reports"]},{"id":"4.11","s":"4","sn":"ISM System","a":"LSA","h":1,"c":["PPE matrix posted; crew wearing correct PPE during inspection (helmets, gloves, goggles, ear protection)","Safety harnesses + fall protection device on board & inspected (records)","PPE in date (helmets expiry)"],"o":"Has a PPE Matrix for use of personal protective equipment been provided and is it being worn as required? (V)","f":["PPE matrix not posted / crew not wearing required PPE (ear protection in ER, goggles at grinder, helmets on deck)","Harness / fall arrestor without inspection record or expired"],"eg":"PPE matrix posted and followed; safety harness & fall arrestor inspected.","ex":"WHAT IS ASKED:\nPPE matrix and correct use of PPE.\n\nFINDING WHEN:\n• No harness/fall protection, or not worn where required\n\nWHAT THE INSPECTOR DOES:\n• Watches the crew\n• Checks inspection records of harnesses","fg":"Nakapaskil at sinusunod ang PPE matrix; inspected ang safety harness at fall arrestor.","fc":["Nakapaskil ang PPE matrix; tamang PPE ang suot ng crew habang may inspection (helmet, gloves, goggles, ear protection)","May safety harness + fall protection device at inspected (records)","Hindi expired ang PPE (expiry ng helmet)"],"fx":"ANO ANG HINIHINGI:\nPPE matrix at tamang paggamit ng PPE.\n\nKAILAN MAY FINDING:\n• Walang harness/fall protection o hindi suot kung saan kailangan\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Inoobserbahan ang crew\n• Chine-check ang inspection records ng harness","ff":["Hindi nakapaskil ang PPE matrix / hindi suot ng crew ang kailangang PPE (ear protection sa ER, goggles sa grinder, helmet sa deck)","Harness / fall arrestor na walang inspection record o expired"]},{"id":"4.13","s":"4","sn":"ISM System","a":"DOC","h":1,"c":["SSSCL for last/current port completed & signed by both parties","Repetitive checks recorded every watch incl. cargo hold entry","All items actually complied with (inspector checks on deck)"],"o":"Is a completed IMSBC/BLU Code ship/shore safety checklist for loading and unloading dry bulk carriers available and are the requirements of the checklist complied with? (M)","f":["Ship/shore safety checklist not completed or not signed by terminal","Repetitive checks not recorded every watch","Hold access not controlled during stevedoring"],"eg":"Ship/Shore Safety Checklist BLU/IMSBC complete; hold entry checks every watch.","ex":"WHAT IS ASKED:\nShip/Shore Safety Checklist (BLU/IMSBC) filled in and followed.\n\nFINDING WHEN:\n• Checklist incomplete or not followed\n\nWHAT THE INSPECTOR DOES:\n• Checks the checklist and confirms on deck\n\nREMEMBER:\n• Hold entry check at least once per watch","fg":"Ship/Shore Safety Checklist BLU/IMSBC kumpleto; hold entry checks bawat watch.","fc":["SSSCL ng huling/kasalukuyang port kumpleto at may pirma ng dalawang panig","Repetitive checks naka-record bawat watch kasama ang cargo hold entry","Lahat ng item ay talagang sinusunod (chine-check ng inspector sa deck)"],"fx":"ANO ANG HINIHINGI:\nKumpleto at sinusunod ang Ship/Shore Safety Checklist (BLU/IMSBC).\n\nKAILAN MAY FINDING:\n• Kulang ang checklist o hindi sinusunod\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang checklist at kinukumpirma sa deck\n\nTANDAAN:\n• Check ng hold entry hindi bababa sa isang beses bawat watch","ff":["Hindi kumpleto ang ship/shore safety checklist o walang pirma ng terminal","Hindi naka-record ang repetitive checks bawat watch","Hindi kontrolado ang pagpasok sa hold habang may stevedoring"]},{"id":"4.14","s":"4","sn":"ISM System","a":"HOLD","h":0,"c":["WIDS panel on bridge – no faults, alarms test","Test records per PMS (sensors in holds, ballast/dry spaces fwd)","Sensors physically intact (check in holds)"],"o":"Are Water Ingress Detector System(WIDS) and alarms maintained in good condition and are the records of tests being maintained? (V & M)","f":["Water ingress alarm test not recorded / sensor damaged or filled with cargo"],"eg":"WIDS (water ingress alarms) working, tests recorded.","ex":"WHAT IS ASKED:\nWater Ingress Detection System and alarms working, with test records.\n\nFINDING WHEN:\n• Not working or no records\n\nWHAT THE INSPECTOR DOES:\n• Checks the panel and records\n\nREMEMBER:\n• SOLAS XII/12 for bulk carriers","fg":"Gumagana ang WIDS (water ingress alarms), naka-record ang tests.","fc":["WIDS panel sa bridge – walang fault, test ng alarms","Test records ayon sa PMS (sensors sa holds, ballast/dry spaces sa unahan)","Buo ang sensors (i-check sa holds)"],"fx":"ANO ANG HINIHINGI:\nGumagana ang Water Ingress Detection System at alarms, may test records.\n\nKAILAN MAY FINDING:\n• Hindi gumagana o walang records\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang panel at records\n\nTANDAAN:\n• SOLAS XII/12 para sa bulk carriers","ff":["Hindi naka-record ang water ingress alarm test / sirang sensor o puno ng cargo"]},{"id":"4.15","s":"4","sn":"ISM System","a":"ACC","h":0,"c":["Smoking policy posted; designated areas marked with signs & ashtrays","'No smoking' signs on deck/gangway/ER; no cigarette butts elsewhere"],"o":"Has a smoking policy been implemented; is it being followed and are designated smoking areas adequately identified? (V)","eg":"Smoking policy, designated smoking areas marked, followed.","ex":"WHAT IS ASKED:\nSmoking policy followed, with marked smoking areas.\n\nFINDING WHEN:\n• Smoking outside the areas\n\nWHAT THE INSPECTOR DOES:\n• Observes","fg":"Smoking policy, may markang smoking areas, sinusunod.","fc":["Nakapaskil ang smoking policy; may sign at ashtray ang designated areas","'No smoking' signs sa deck/gangway/ER; walang upos ng sigarilyo sa ibang lugar"],"fx":"ANO ANG HINIHINGI:\nSinusunod ang smoking policy, may markang lugar para manigarilyo.\n\nKAILAN MAY FINDING:\n• Naninigarilyo sa labas ng designated area\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Nag-oobserba"},{"id":"4.16","s":"4","sn":"ISM System","a":"LSA","h":1,"c":["Multigas detectors (O2/LEL/H2S/CO) – calibration certificates in date","Span/calibration gas on board & not expired; bump test records","Sufficient personal monitors for entry team","Officer demonstrates use & alarm settings"],"o":"Are portable gas detectors suitable for atmosphere testing of enclosed spaces provided; in good condition; calibrated in accordance with the manufacturer’s instructions, and are officers trained and competent with their operation? (V & M)","f":["Gas detector calibration or span gas expired","Only one multigas meter with pump on board","Officers cannot bump-test the meter"],"eg":"Portable gas detectors calibrated (certificate), span gas valid; officers know how to use them.","ex":"WHAT IS ASKED:\nSuitable portable gas detectors, calibrated per maker, and the officers know them.\n\nFINDING WHEN:\n• Not calibrated or officers cannot use them\n\nWHAT THE INSPECTOR DOES:\n• Checks calibration certificates and span gas\n\nREMEMBER:\n• SOLAS XI-1/7","fg":"Calibrated ang portable gas detectors (certificate), valid ang span gas; marunong gumamit ang officers.","fc":["Multigas detectors (O2/LEL/H2S/CO) – valid ang calibration certificates","May span/calibration gas at hindi expired; bump test records","Sapat ang personal monitors para sa entry team","Kayang ipakita ng officer ang paggamit at alarm settings"],"fx":"ANO ANG HINIHINGI:\nAngkop ang portable gas detectors, calibrated ayon sa maker, at alam ng officers.\n\nKAILAN MAY FINDING:\n• Hindi calibrated o hindi marunong gumamit\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang calibration certificates at span gas\n\nTANDAAN:\n• SOLAS XI-1/7","ff":["Expired ang calibration ng gas detector o ang span gas","Isa lang ang multigas meter na may pump sa barko","Hindi marunong mag-bump test ng meter ang officers"]},{"id":"4.17","s":"4","sn":"ISM System","a":"ER","h":1,"c":["Flashback arrestors at both regulator & torch end; hoses good, colour coded","Annual check of gas welding installation by competent person – record (Finding if not)","Cylinders secured, caps on, segregated O2/C2H2, signs posted","Arc welding: DC/voltage limiter, insulated holder, earth cable, PPE (shield EN169, gloves)"],"o":"Is the welding and gas-burning equipment,as well as the electric arc welding equipment, properly stored and maintained in good working order? (V & M)","f":["Flashback arrestors missing at torch or regulator end","Annual check of gas welding installation not done","Cylinders not secured / hoses damaged, not colour coded"],"eg":"Oxy-acetylene: flashback arrestors, annual check, cylinders secured, arc welding correct.","ex":"WHAT IS ASKED:\nOxy-acetylene and electric welding equipment properly stored and maintained.\n\nFINDING WHEN:\n• No annual check by a competent person\n\nWHAT THE INSPECTOR DOES:\n• Checks flashback arrestors, hoses, cylinders, arc welding equipment\n\nREMEMBER:\n• Arc welding: DC ≤70 V or AC with voltage limiter\n• Welding shield with EN 169 filter","fg":"Oxy-acetylene: flashback arrestors, annual check, naka-secure ang cylinders, tama ang arc welding.","fc":["Flashback arrestors sa regulator at sa torch; maayos ang hoses, may color code","Annual check ng gas welding installation ng competent person – may record (finding kung wala)","Naka-secure ang cylinders, may takip, hiwalay ang O2/C2H2, may signs","Arc welding: DC/voltage limiter, insulated holder, earth cable, PPE (shield EN169, gloves)"],"fx":"ANO ANG HINIHINGI:\nTamang naka-imbak at naaalagaan ang oxy-acetylene at electric welding equipment.\n\nKAILAN MAY FINDING:\n• Walang annual check ng competent person\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang flashback arrestors, hoses, cylinders, arc welding equipment\n\nTANDAAN:\n• Arc welding: DC ≤70 V o AC na may voltage limiter\n• Welding shield na may EN 169 filter","ff":["Walang flashback arrestor sa torch o regulator","Hindi nagawa ang annual check ng gas welding installation","Hindi naka-secure ang cylinders / sira ang hoses, walang color code"]},{"id":"4.18","s":"4","sn":"ISM System","a":"LSA","h":1,"c":["Annual/5-yearly service certificates (LSA Code/MSC.402) for boats, davits, release gear, winch brake","Falls renewed ≤5 yrs, turned end-for-end ≤30 months","Lifeboat engine runs; equipment complete & in date (rations, water, pyros, first aid)","Crew demonstrate launching & emergency davit operation; FPDs (if any) correct","Lifeboat launch records (every 3 months), rescue boat monthly","📋 Inspector: Free-fall lifeboat: seat width check for keel-laid from 01.07.2010; annual + 5-year service reports"],"o":"Are the lifeboats, rescue boat and davit-launched life raft their equipment and launching arrangements serviced periodically in good condition, and are the crew familiar with the launching procedure and operation? (V & M)","f":["Lifeboat / rescue boat engine fails to start or ahead/astern not working","Annual / 5-yearly service by authorised provider overdue","Falls not turned end-for-end at 30 months / not renewed at 5 years","Release gear not fully reset / hydrostatic interlock defective","Crew unfamiliar with davit operation under emergency power / limit switch defective","Equipment expired (pyros, rations, water) or painter incorrectly rigged"],"eg":"Lifeboat/rescue boat: annual & 5-yearly service, falls, release gear; crew know launching.","ex":"WHAT IS ASKED:\nLifeboats, rescue boat and davit-launched raft serviced, in good condition, and the crew know how to launch them.\n\nFINDING WHEN:\n• Service missing or crew do not know\n\nWHAT THE INSPECTOR DOES:\n• Checks familiarity with the davit-launched raft and emergency davit operation\n\nREMEMBER:\n• MSC.402(96): annual/5-yearly service\n• Falls renewed every 5 years, end-for-end every 30 months","fg":"Lifeboat/rescue boat: annual at 5-yearly service, falls, release gear; marunong mag-launch ang crew.","fc":["Annual/5-yearly service certificates (LSA Code/MSC.402) ng boats, davits, release gear, winch brake","Falls pinalitan ≤5 taon, end-for-end ≤30 buwan","Umaandar ang lifeboat engine; kumpleto at hindi expired ang equipment (rations, tubig, pyros, first aid)","Kayang ipakita ng crew ang launching at emergency davit operation; tama ang FPDs (kung meron)","Lifeboat launch records (bawat 3 buwan), rescue boat buwan-buwan","📋 Inspector: Free-fall lifeboat: seat width check for keel-laid from 01.07.2010; annual + 5-year service reports"],"fx":"ANO ANG HINIHINGI:\nMay service at maayos ang lifeboats, rescue boat at davit-launched raft, at marunong mag-launch ang crew.\n\nKAILAN MAY FINDING:\n• Walang service o hindi alam ng crew\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check kung pamilyar sa davit-launched raft at emergency operation ng davit\n\nTANDAAN:\n• MSC.402(96): annual/5-yearly service\n• Falls pinapalitan bawat 5 taon, end-for-end bawat 30 buwan","ff":["Hindi umaandar ang makina ng lifeboat / rescue boat o hindi gumagana ang ahead/astern","Overdue ang annual / 5-yearly service ng authorised provider","Hindi na-end-for-end ang falls sa 30 buwan / hindi napalitan sa 5 taon","Hindi fully reset ang release gear / sira ang hydrostatic interlock","Hindi alam ng crew ang davit operation sa emergency power / sira ang limit switch","Expired ang equipment (pyros, rations, tubig) o mali ang pagkaka-rig ng painter"]},{"id":"4.19","s":"4","sn":"ISM System","a":"LSA","h":1,"c":["Liferaft service certificates valid; date labels","HRU expiry dates; painter correctly attached to weak link, HRU to cradle","Lashing/slip hooks free; launching instructions posted","Forward raft (if req.) & embarkation ladder"],"o":"Are life rafts in good order and are hydrostatic release units maintained and installed correctly? (V & M)","f":["HRU expired or weak link wrongly connected (painter tied to deck)","Two liferafts on one HRU","Embarkation ladder not secured / forward raft not accessible"],"eg":"Liferafts serviced, HRU valid and CORRECTLY connected (weak link).","ex":"WHAT IS ASKED:\nLiferafts in good condition, with HRUs properly maintained and fitted.\n\nFINDING WHEN:\n• HRU expired or wrongly connected\n\nWHAT THE INSPECTOR DOES:\n• Checks painter, weak link, dates\n\nREMEMBER:\n• Annual liferaft service","fg":"May service ang liferafts, valid ang HRU at TAMA ang pagkakabit (weak link).","fc":["Valid ang liferaft service certificates; may date labels","Expiry ng HRU; ang painter ay nakakabit nang tama sa weak link, HRU sa cradle","Malaya ang lashing/slip hooks; nakapaskil ang launching instructions","Forward raft (kung kailangan) at embarkation ladder"],"fx":"ANO ANG HINIHINGI:\nMaayos ang liferafts, at tama ang maintenance at pagkakabit ng HRU.\n\nKAILAN MAY FINDING:\n• Expired ang HRU o mali ang pagkakabit\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang painter, weak link, petsa\n\nTANDAAN:\n• Annual service ng liferaft","ff":["Expired ang HRU o mali ang pagkakabit ng weak link (painter nakatali sa deck)","Dalawang liferaft sa isang HRU","Hindi naka-secure ang embarkation ladder / hindi maabot ang forward raft"]},{"id":"4.20","s":"4","sn":"ISM System","a":"LSA","h":0,"c":["Lifejackets: lights (battery expiry), whistles, retro-reflective tape, name of ship","Number per cabin + at muster/bridge/ER/lifeboat as per plan","Donning instructions posted; child/large sizes if required","📋 Inspector: Lifejackets: quick-closure type (ships keel-laid from 01.07.2010)"],"o":"Are life jackets in good condition, allocated as per the plan and donning instructions clearly displayed? (V & M)","f":["Lifejacket light batteries expired / lights or whistles missing"],"eg":"Lifejackets in good condition, lights in date, distribution & donning instructions.","ex":"WHAT IS ASKED:\nLifejackets in good condition, distributed as per plan, with donning instructions.\n\nFINDING WHEN:\n• Missing items or poor condition\n\nWHAT THE INSPECTOR DOES:\n• Spot-checks\n\nREMEMBER:\n• Lights in date\n• Whistle, retro-reflective tape","fg":"Maayos ang lifejackets, hindi expired ang ilaw, distribution at donning instructions.","fc":["Lifejackets: ilaw (expiry ng battery), whistle, retro-reflective tape, pangalan ng barko","Bilang bawat cabin + sa muster/bridge/ER/lifeboat ayon sa plan","Nakapaskil ang donning instructions; may child/large size kung kailangan","📋 Inspector: Lifejackets: quick-closure type (ships keel-laid from 01.07.2010)"],"fx":"ANO ANG HINIHINGI:\nMaayos ang lifejackets, nakalagay ayon sa plan, may donning instructions.\n\nKAILAN MAY FINDING:\n• May kulang o hindi maayos\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Spot-check\n\nTANDAAN:\n• Hindi expired ang ilaw\n• Whistle, retro-reflective tape","ff":["Expired ang battery ng lifejacket light / walang ilaw o whistle"]},{"id":"4.21","s":"4","sn":"ISM System","a":"LSA","h":0,"c":["Suits per plan, correct sizes, zippers lubricated, lights in date","Air-pressure test records (>10 yrs old: every 3 yrs)","Monthly inspection records; donning instructions posted"],"o":"Are immersion suits in good condition, allocated as per the fire and safety plan and donning instructions clearly displayed? (V & M)","f":["Immersion suits not pressure-tested at 3-year interval / zips not maintained"],"eg":"Immersion suits checked (pressure test every 3 years), distribution, donning instructions.","ex":"WHAT IS ASKED:\nImmersion suits in good condition, distributed as per plan, with donning instructions.\n\nFINDING WHEN:\n• Missing items or poor condition\n\nWHAT THE INSPECTOR DOES:\n• Spot-checks\n\nREMEMBER:\n• Air pressure test every 3 years when older than 10 years","fg":"Na-check ang immersion suits (pressure test bawat 3 taon), distribution, donning instructions.","fc":["Suits ayon sa plan, tamang size, may lubrication ang zipper, hindi expired ang ilaw","Air-pressure test records (>10 taon: bawat 3 taon)","Monthly inspection records; nakapaskil ang donning instructions"],"fx":"ANO ANG HINIHINGI:\nMaayos ang immersion suits, nakalagay ayon sa plan, may donning instructions.\n\nKAILAN MAY FINDING:\n• May kulang o hindi maayos\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Spot-check\n\nTANDAAN:\n• Air pressure test bawat 3 taon kapag lampas 10 taon","ff":["Hindi na-pressure-test ang immersion suits sa 3-year interval / hindi naaalagaan ang zipper"]},{"id":"4.23","s":"4","sn":"ISM System","a":"LSA","h":0,"c":["Foam compound analysis certificate (annual / per maker) – 'satisfactory'","Covers fixed system & portable foam applicators","📋 Inspector: Foam: annual analysis of high-expansion / fixed foam; Non-PFOS certificate (from 01.01.2026)"],"o":"Has a sample of foam compound, applicable to both fixed and portable systems, been sent for regular testing and is evidence of satisfactory results available? (M)","eg":"Foam sample analysis (fixed & portable) – result satisfactory.","ex":"WHAT IS ASKED:\nAnalysis of a foam sample (fixed and portable) with satisfactory result.\n\nFINDING WHEN:\n• No recent analysis\n\nWHAT THE INSPECTOR DOES:\n• Checks the certificate\n\nREMEMBER:\n• MSC.1/Circ.1312","fg":"Foam sample analysis (fixed at portable) – satisfactory ang resulta.","fc":["Foam compound analysis certificate (taon-taon / ayon sa maker) – 'satisfactory'","Sakop ang fixed system at portable foam applicators","📋 Inspector: Foam: annual analysis of high-expansion / fixed foam; Non-PFOS certificate (from 01.01.2026)"],"fx":"ANO ANG HINIHINGI:\nAnalysis ng foam sample (fixed at portable) na satisfactory ang resulta.\n\nKAILAN MAY FINDING:\n• Walang bagong analysis\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang certificate\n\nTANDAAN:\n• MSC.1/Circ.1312"},{"id":"4.24","s":"4","sn":"ISM System","a":"LSA","h":1,"c":["Walk the deck: every fire box with hose, dual-purpose nozzle, spanner; couplings fit","Hydrant valves operable, no leaks, fire main free of clamps/temporary repairs","Isolation valves marked & operable","Hose pressure test records; fire pump pressure adequate"],"o":"Are fire mains and associated isolation valves, fire boxes, hoses, nozzles, applicators, and spanners regularly inspected and maintained and found to be in a satisfactory operating condition? (V & M)","f":["Fire box missing nozzle or spanner / hose deteriorated","Hydrants or fire main leaking, clamped","Isolating valve not marked or seized"],"eg":"Fire main, hydrants, hoses, nozzles, spanners in every fire box, no leaks.","ex":"WHAT IS ASKED:\nFire main, valves, fire boxes, hoses, nozzles and spanners checked and working.\n\nFINDING WHEN:\n• Missing hoses/nozzles, leaks, defective valves\n\nWHAT THE INSPECTOR DOES:\n• Walks the deck and checks them","fg":"Fire main, hydrants, hoses, nozzles, spanners sa bawat fire box, walang leak.","fc":["Ikutin ang deck: bawat fire box may hose, dual-purpose nozzle, spanner; kasya ang couplings","Gumagana ang hydrant valves, walang leak, walang clamp/temporary repair ang fire main","May marka at gumagana ang isolation valves","Hose pressure test records; sapat ang pressure ng fire pump"],"fx":"ANO ANG HINIHINGI:\nChine-check at gumagana ang fire main, valves, fire boxes, hoses, nozzles at spanners.\n\nKAILAN MAY FINDING:\n• Kulang ang hose/nozzle, may leak, sira ang valve\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Naglalakad sa deck at chine-check ang mga ito","ff":["Fire box na walang nozzle o spanner / sira ang hose","May leak o clamp ang hydrant o fire main","Walang marka o naninigas ang isolating valve"]},{"id":"4.25","s":"4","sn":"ISM System","a":"LSA","h":0,"c":["ISC with flange, gasket, 4 bolts & nuts, marked 'International Shore Connection'","Location shown on fire plan; crew know where it is"],"o":"Are the International Shore Connection fitting arrangements clearly marked and well maintained and are the crew aware of their location? (V)","f":["International shore connection without bolts/nuts/gasket or not marked"],"eg":"International Shore Connection marked, with bolts & gasket; crew know it.","ex":"WHAT IS ASKED:\nInternational Shore Connection marked, maintained and crew know where it is.\n\nFINDING WHEN:\n• Missing or incomplete\n\nWHAT THE INSPECTOR DOES:\n• Checks flange, bolts, gasket","fg":"May marka ang International Shore Connection, may bolts at gasket; alam ng crew.","fc":["ISC na may flange, gasket, 4 na bolts at nuts, may markang 'International Shore Connection'","Nakalagay sa fire plan ang lokasyon; alam ng crew kung nasaan"],"fx":"ANO ANG HINIHINGI:\nMay marka at naaalagaan ang International Shore Connection at alam ng crew kung nasaan.\n\nKAILAN MAY FINDING:\n• Wala o kulang\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang flange, bolts, gasket","ff":["International shore connection na walang bolts/nuts/gasket o walang marka"]},{"id":"4.26","s":"4","sn":"ISM System","a":"LSA","h":0,"c":["Panel: no faults, no isolated zones","Test records showing ALL detectors tested over cycle","Annual service report by service company"],"o":"Are records available to show that fixed fire detection and fire alarm systems have been tested at regular intervals and maintained in good condition? (V)","f":["Not all detectors tested per PMS / panel with isolated loops or faults"],"eg":"Fire detection: all detectors tested per PMS, panel without faults/isolated loops.","ex":"WHAT IS ASKED:\nFire detection and alarm system tested regularly.\n\nFINDING WHEN:\n• No records or isolated zones\n\nWHAT THE INSPECTOR DOES:\n• Checks the panel and records","fg":"Fire detection: lahat ng detector nasubukan ayon sa PMS, walang fault/isolated loop ang panel.","fc":["Panel: walang fault, walang isolated zone","Test records na nagpapakitang nasubukan ang LAHAT ng detector sa cycle","Annual service report ng service company"],"fx":"ANO ANG HINIHINGI:\nRegular na sinusubukan ang fire detection at alarm system.\n\nKAILAN MAY FINDING:\n• Walang records o may isolated zones\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang panel at records","ff":["Hindi lahat ng detector nasubukan ayon sa PMS / may isolated loops o faults ang panel"]},{"id":"4.27","s":"4","sn":"ISM System","a":"LSA","h":1,"c":["Annual service certificate of CO2 system; 2-yearly blow-through; 10-yearly hydrotest/flexible hoses","CO2 room clean, ventilated, instructions posted, no leaks, pilot cylinders","Release alarm tests recorded","Foam/water mist system per maker; foam pump runs freely","📋 Inspector: Fixed CO2: 2-yearly service, cylinders hydrostatic test every 10 years"],"o":"Are the fixed fire extinguishing systems (where fitted) inspected, tested and in good order? (V & M)","f":["CO2 annual service / bottle weighing overdue","CO2 room used as store, fan not working","Crew unaware of release procedure"],"eg":"Fixed CO2 / foam / water mist: annual service, bottle weights, alarms, foam pump.","ex":"WHAT IS ASKED:\nFixed fire-extinguishing systems (CO2, foam, water mist) checked and working.\n\nFINDING WHEN:\n• Service missing or obvious problems\n\nWHAT THE INSPECTOR DOES:\n• Does not ask for a water mist test unless he sees a problem\n• Wants to see the foam pump turns freely\n\nREMEMBER:\n• MSC.1/Circ.1318 for CO2","fg":"Fixed CO2 / foam / water mist: annual service, timbang ng bote, alarms, foam pump.","fc":["Annual service certificate ng CO2 system; 2-yearly blow-through; 10-yearly hydrotest/flexible hoses","Malinis at may hangin ang CO2 room, nakapaskil ang instructions, walang leak, pilot cylinders","Naka-record ang release alarm tests","Foam/water mist system ayon sa maker; malayang umiikot ang foam pump","📋 Inspector: Fixed CO2: 2-yearly service, cylinders hydrostatic test every 10 years"],"fx":"ANO ANG HINIHINGI:\nChine-check at gumagana ang fixed fire-extinguishing systems (CO2, foam, water mist).\n\nKAILAN MAY FINDING:\n• Walang service o may halatang problema\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Hindi humihingi ng water mist test maliban kung may nakitang problema\n• Gustong makita na malayang umiikot ang foam pump\n\nTANDAAN:\n• MSC.1/Circ.1318 para sa CO2","ff":["Overdue ang CO2 annual service / pagtimbang ng bote","Ginagamit na bodega ang CO2 room, hindi gumagana ang fan","Hindi alam ng crew ang release procedure"]},{"id":"4.28","s":"4","sn":"ISM System","a":"ER","h":1,"c":["Run em'cy fire pump: starts, primes, delivers pressure at highest/most remote hydrant (2 jets)","Starting instructions posted at pump in English","Weekly test records; fuel tank full; suction valve open"],"o":"Is the emergency fire pump being regularly tested, in good operational condition and are starting instructions clearly posted? (V)","f":["Emergency fire pump fails to deliver pressure at light draught / slow to prime","Starting instructions not posted, room door kept open"],"eg":"Emergency fire pump starts at once, gives pressure, starting instructions posted.","ex":"WHAT IS ASKED:\nEmergency fire pump tested, in good condition, with starting instructions.\n\nFINDING WHEN:\n• Does not start or gives no pressure\n\nWHAT THE INSPECTOR DOES:\n• With C/E agreement he will see the start and running\n• If the Master agrees, he will also see a pressure/flow test\n\nREMEMBER:\n• SOLAS II-2/10","fg":"Agad nag-i-start ang emergency fire pump, may pressure, nakapaskil ang starting instructions.","fc":["Paandarin ang em'cy fire pump: nag-i-start, nagpi-prime, may pressure sa pinakamataas/pinakamalayong hydrant (2 jets)","Nakapaskil sa pump ang starting instructions sa English","Weekly test records; puno ang fuel tank; bukas ang suction valve"],"fx":"ANO ANG HINIHINGI:\nNasubukan at maayos ang emergency fire pump, may starting instructions.\n\nKAILAN MAY FINDING:\n• Hindi nag-i-start o walang pressure\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Kung payag ang C/E, titingnan ang pag-start at pag-andar\n• Kung payag ang Master, titingnan din ang pressure/flow test\n\nTANDAAN:\n• SOLAS II-2/10","ff":["Walang pressure ang emergency fire pump sa light draught / mabagal mag-prime","Hindi nakapaskil ang starting instructions, laging bukas ang pinto ng room"]},{"id":"4.29","s":"4","sn":"ISM System","a":"LSA","h":0,"c":["Annual service labels/certificate; 10-yearly hydrotest","Pins & seals intact, gauges in green, hoses not cracked","In place per fire plan; spare charges available","📋 Inspector: Portable foam applicators / extinguishers: Non-PFOS certificate (from 01.01.2026)"],"o":"Are portable fire extinguishers being maintained in good order, and ready for immediate use in an emergency? (V)","f":["Extinguisher service overdue / seals missing / spare charges missing"],"eg":"Portable extinguishers: annual service, seals, pressure, correct location.","ex":"WHAT IS ASKED:\nPortable extinguishers maintained and ready.\n\nFINDING WHEN:\n• No service or defective\n\nWHAT THE INSPECTOR DOES:\n• Spot-checks\n\nREMEMBER:\n• Annual service","fg":"Portable extinguishers: annual service, seals, pressure, tamang lugar.","fc":["Annual service labels/certificate; 10-yearly hydrotest","Buo ang pins at seals, nasa green ang gauges, walang bitak ang hoses","Nasa lugar ayon sa fire plan; may spare charges","📋 Inspector: Portable foam applicators / extinguishers: Non-PFOS certificate (from 01.01.2026)"],"fx":"ANO ANG HINIHINGI:\nNaaalagaan at handa ang portable extinguishers.\n\nKAILAN MAY FINDING:\n• Walang service o sira\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Spot-check\n\nTANDAAN:\n• Annual service","ff":["Overdue ang service ng extinguisher / walang seal / walang spare charges"]},{"id":"4.30","s":"4","sn":"ISM System","a":"LSA","h":1,"c":["Fireman's outfits complete: suit, boots, gloves, helmet, ATEX lamp, axe, lifeline","SCBA: cylinders full, hydrotest dates, face masks, monthly check, annual service","Intrinsically safe two-way radios ≥2 per fire party (Finding if not enough)","Communication works with helmet on","📋 Inspector: SCBA cylinders: 5-yearly hydrostatic test; BA compressor annual air-quality analysis"],"o":"Are firemen’s outfits including their equipment, two-way portable radiotelephone apparatus for fire-fighter’s communication and breathing apparatus in good condition, fit for purpose and available for instant use? (V & M)","f":["Fireman's outfit incomplete (torch, axe, lifeline, ATEX radio)","SCBA cylinders not full / no spare cylinders","BA air quality test >12 months"],"eg":"Fireman's outfits complete, SCBA with spare cylinders, ATEX radios for each fire team.","ex":"WHAT IS ASKED:\nFireman's outfits, ATEX radios and SCBA in good condition and ready to use.\n\nFINDING WHEN:\n• Not enough intrinsically safe radios for the fire teams\n\nWHAT THE INSPECTOR DOES:\n• Tests communication with the radios\n\nREMEMBER:\n• SOLAS II-2/10: 2 radios per fire party","fg":"Kumpleto ang fireman's outfits, SCBA na may spare cylinders, ATEX radios para sa bawat fire team.","fc":["Kumpleto ang fireman's outfit: suit, boots, gloves, helmet, ATEX lamp, palakol, lifeline","SCBA: puno ang cylinders, hydrotest dates, face masks, monthly check, annual service","Intrinsically safe two-way radios ≥2 bawat fire party (finding kung kulang)","Gumagana ang komunikasyon kahit naka-helmet","📋 Inspector: SCBA cylinders: 5-yearly hydrostatic test; BA compressor annual air-quality analysis"],"fx":"ANO ANG HINIHINGI:\nMaayos at agad magagamit ang fireman's outfits, ATEX radios at SCBA.\n\nKAILAN MAY FINDING:\n• Kulang ang intrinsically safe radios para sa fire teams\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Sinusubukan ang komunikasyon gamit ang radios\n\nTANDAAN:\n• SOLAS II-2/10: 2 radio bawat fire party","ff":["Kulang ang fireman's outfit (torch, palakol, lifeline, ATEX radio)","Hindi puno ang SCBA cylinders / walang spare cylinders","BA air quality test >12 buwan"]},{"id":"4.31","s":"4","sn":"ISM System","a":"LSA","h":0,"c":["Air quality test certificate (annual) of BA compressor","Compressor maintenance in PMS; filters changed"],"o":"Is the operation and maintenance of the breathing apparatus air recharging system (where fitted) incorporated in the ship’s safety management manual, and has the annual air quality check for breathing apparatus air recharging systems been carried out? (V & M)","eg":"BA compressor: SMS procedure and annual air quality test.","ex":"WHAT IS ASKED:\nBA compressor in the SMS and annual air quality check.\n\nFINDING WHEN:\n• No air quality test\n\nWHAT THE INSPECTOR DOES:\n• Checks the certificate","fg":"BA compressor: SMS procedure at annual air quality test.","fc":["Air quality test certificate (taon-taon) ng BA compressor","Maintenance ng compressor nasa PMS; napalitan ang filters"],"fx":"ANO ANG HINIHINGI:\nNasa SMS ang BA compressor at may annual check ng kalidad ng hangin.\n\nKAILAN MAY FINDING:\n• Walang air quality test\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang certificate"},{"id":"4.32","s":"4","sn":"ISM System","a":"LSA","h":0,"c":["EEBDs per fire plan in accommodation & ER (+ spares)","Expiry/service dates, pressure gauges, seals","Monthly inspection records"],"o":"Are records available to show that Emergency Escape Breathing Devices (EEBDs) in the accommodation and engine room are being inspected, in good condition and are available for instant use? (V & M)","f":["EEBD out of date or not at location shown on fire plan"],"eg":"EEBDs in place, in date, checked.","ex":"WHAT IS ASKED:\nEEBDs checked, in good condition and ready to use.\n\nFINDING WHEN:\n• No records or defective\n\nWHAT THE INSPECTOR DOES:\n• Spot-checks","fg":"EEBDs nasa lugar, hindi expired, na-check.","fc":["EEBDs ayon sa fire plan sa accommodation at ER (+ spares)","Expiry/service dates, pressure gauges, seals","Monthly inspection records"],"fx":"ANO ANG HINIHINGI:\nNa-check, maayos at agad magagamit ang EEBDs.\n\nKAILAN MAY FINDING:\n• Walang records o sira\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Spot-check","ff":["Expired ang EEBD o wala sa lugar na nasa fire plan"]},{"id":"4.33","s":"4","sn":"ISM System","a":"LSA","h":0,"c":["Each damper marked OPEN/CLOSED & space served","Operates freely (try a few); test records","Funnel/ER/galley dampers included"],"o":"Are ventilation fire dampers clearly marked with open/close positions and space served and is there evidence of regular testing and maintenance? (V)","f":["Fire dampers not marked open/close and space served","Dampers seized / not closing fully, not in PMS"],"eg":"Fire dampers marked (open/close + space served) and tested.","ex":"WHAT IS ASKED:\nFire dampers marked (open/close and space) and tested.\n\nFINDING WHEN:\n• Not marked or seized\n\nWHAT THE INSPECTOR DOES:\n• Tries a few","fg":"May marka ang fire dampers (open/close + space na sineserbisyuhan) at nasubukan.","fc":["Bawat damper may markang OPEN/CLOSED at space na sineserbisyuhan","Malayang gumagalaw (subukan ang ilan); test records","Kasama ang funnel/ER/galley dampers"],"fx":"ANO ANG HINIHINGI:\nMay marka (open/close at space) at nasubukan ang fire dampers.\n\nKAILAN MAY FINDING:\n• Walang marka o naninigas\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Sinusubukan ang ilan","ff":["Walang markang open/close at space ang fire dampers","Naninigas ang dampers / hindi sumasara nang buo, wala sa PMS"]},{"id":"4.34","s":"4","sn":"ISM System","a":"ACC","h":0,"c":["MSDS for all bunkers (HFO/VLSFO/MGO), lub oils, chemicals, paints","Copies in ECR, paint store, chemical store, bridge/CCR","Crew know where & key hazards"],"o":"Are Material Safety Data Sheets (MSDS) for all bunkers, chemicals, paint, corrosive, and toxic materials available, and are all crew familiar with their contents? (V)","eg":"MSDS for all chemicals, bunkers, paints available near the spaces.","ex":"WHAT IS ASKED:\nMSDS for bunkers, chemicals, paints, and the crew know them.\n\nFINDING WHEN:\n• MSDS missing\n\nWHAT THE INSPECTOR DOES:\n• Asks the crew","fg":"May MSDS ng lahat ng chemicals, bunkers, paints malapit sa mga space.","fc":["MSDS ng lahat ng bunkers (HFO/VLSFO/MGO), lub oils, chemicals, paints","Kopya sa ECR, paint store, chemical store, bridge/CCR","Alam ng crew kung nasaan at ang pangunahing panganib"],"fx":"ANO ANG HINIHINGI:\nMay MSDS para sa bunkers, chemicals, paints, at alam ito ng crew.\n\nKAILAN MAY FINDING:\n• Kulang ang MSDS\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Tinatanong ang crew"},{"id":"4.35","s":"4","sn":"ISM System","a":"DECK","h":1,"c":["Gangway/accom. ladder rigged properly, safety net, stanchions & handropes taut","Lifebuoy with line at gangway, adequate lighting","Angle within limits; tended for draft/tide changes","Clear access free from obstructions"],"o":"Is a safe means of access to the vessel being provided? (V)","f":["Gangway safety net missing, slack or not full length","No lifebuoy with line at gangway / poor lighting at night","Gangway not tended, angle over limit, bottom platform not horizontal"],"eg":"Safe access: gangway with safety net, lifebuoy, lighting, correct angle.","ex":"WHAT IS ASKED:\nSafe access to the ship.\n\nFINDING WHEN:\n• Gangway without net, lifebuoy, light, or at a wrong angle\n\nWHAT THE INSPECTOR DOES:\n• No finding if the ladder meets requirements and is rigged correctly\n\nREMEMBER:\n• SOLAS II-1/3-9, MSC.1/Circ.1331","fg":"Ligtas na daanan: gangway na may safety net, lifebuoy, ilaw, tamang anggulo.","fc":["Tama ang rig ng gangway/accom. ladder, may safety net, mahigpit ang stanchions at handropes","Lifebuoy na may lubid sa gangway, sapat na ilaw","Pasok sa limit ang anggulo; inaayos sa pagbabago ng draft/tide","Malinis at walang harang ang daanan"],"fx":"ANO ANG HINIHINGI:\nLigtas na daanan papasok sa barko.\n\nKAILAN MAY FINDING:\n• Gangway na walang net, lifebuoy, ilaw o mali ang anggulo\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Walang finding kung pasok sa requirements ang ladder at tama ang rig\n\nTANDAAN:\n• SOLAS II-1/3-9, MSC.1/Circ.1331","ff":["Walang safety net ang gangway, maluwag o hindi buong haba","Walang lifebuoy na may lubid sa gangway / madilim sa gabi","Hindi binabantayan ang gangway, lampas sa limit ang anggulo, hindi pantay ang bottom platform"]},{"id":"4.36","s":"4","sn":"ISM System","a":"DECK","h":1,"c":["Ladder marked: maker, model, max angle, max load","Turntable & pin inspection in PMS (Finding if not)","Wires renewed per SMS; winch & limit switches","5-yearly load test & annual thorough exam records"],"o":"Are accommodation ladders and gangways maintained in good condition, marked clearly, and inspected regularly (V)","f":["Accommodation ladder wire renewal / inspection dates not recorded","Turntable & pivot pin not in PMS, stanchions damaged"],"eg":"Accommodation ladders/gangways: markings, inspection, PMS for turntable & pin, wires.","ex":"WHAT IS ASKED:\nAccommodation ladders and gangways maintained, marked and inspected.\n\nFINDING WHEN:\n• Turntable and pin not in the PMS\n\nWHAT THE INSPECTOR DOES:\n• Checks markings and records\n\nREMEMBER:\n• Annual thorough examination, load test every 5 years","fg":"Accommodation ladders/gangways: markings, inspection, PMS para sa turntable at pin, wires.","fc":["May marka ang ladder: maker, model, max angle, max load","Inspection ng turntable at pin nasa PMS (finding kung wala)","Wires pinalitan ayon sa SMS; winch at limit switches","5-yearly load test at annual thorough exam records"],"fx":"ANO ANG HINIHINGI:\nNaaalagaan, may marka at na-inspect ang accommodation ladders at gangways.\n\nKAILAN MAY FINDING:\n• Wala sa PMS ang turntable at pin\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang markings at records\n\nTANDAAN:\n• Annual thorough examination, load test bawat 5 taon","ff":["Hindi naka-record ang palit/inspection ng wire ng accommodation ladder","Wala sa PMS ang turntable at pivot pin, sira ang stanchions"]},{"id":"4.37","s":"4","sn":"ISM System","a":"DECK","h":1,"c":["Pilot ladder certificate & unique ID marking (ISO 799-1)","Usage log; replaced ≤30 months from manufacture/in service","Steps, spreaders, side ropes good; securing strongpoints, not shackles to ropes","Crew demonstrate correct rigging (combination arrangement)"],"o":"Are pilot ladders used for pilot transfer in good condition, and inspected regularly, clearly identified with tags or with permanent marking and are maintenance records available and, are crew members capable of demonstrating proper rigging of the pilot-ladder arrangement?(V)","f":["Certificate does not match ladder ID tag / no unique marking","Pilot ladder in service >30 months without strength test","Side ropes frayed, rot under clamps, steps loose or not horizontal","Secured with shackles to steps or to railing instead of strong points","No lifebuoy with self-igniting light / heaving line / lighting at boarding station"],"eg":"Pilot ladders: certificate, ID tag, usage records, ≤30 months, correct rigging.","ex":"WHAT IS ASKED:\nPilot ladders in good condition, inspected, with ID and records, and crew know how to rig them.\n\nFINDING WHEN:\n• No ID/certificate or poor condition\n\nWHAT THE INSPECTOR DOES:\n• Asks the crew to show correct rigging\n\nREMEMBER:\n• SOLAS V/23\n• ISO 799-1\n• Replace at the latest at 30 months","fg":"Pilot ladders: certificate, ID tag, records ng gamit, ≤30 buwan, tamang rigging.","fc":["Pilot ladder certificate at unique ID marking (ISO 799-1)","Usage log; pinalitan ≤30 buwan mula paggawa/paggamit","Maayos ang steps, spreaders, side ropes; nakakabit sa strongpoints, hindi shackle sa lubid","Kayang ipakita ng crew ang tamang rigging (combination arrangement)"],"fx":"ANO ANG HINIHINGI:\nMaayos, na-inspect, may ID at records ang pilot ladders, at marunong mag-rig ang crew.\n\nKAILAN MAY FINDING:\n• Walang ID/certificate o hindi maayos\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Pinapakita sa crew ang tamang rigging\n\nTANDAAN:\n• SOLAS V/23\n• ISO 799-1\n• Palitan hindi lalampas sa 30 buwan","ff":["Hindi tugma ang certificate sa ID tag ng ladder / walang unique marking","Pilot ladder na >30 buwan nang ginagamit nang walang strength test","Gasgas ang side ropes, bulok sa ilalim ng clamps, maluwag o hindi pantay ang steps","Naka-shackle sa steps o sa railing imbes na sa strong points","Walang lifebuoy na may self-igniting light / heaving line / ilaw sa boarding station"]},{"id":"4.38","s":"4","sn":"ISM System","a":"DOC","h":0,"c":["Ship-specific Fire Safety Operational Booklet & Training Manual","SOLAS Training Manual in each mess room & recreation room","Fire control plan copy outside accommodation (in box)"],"o":"Has the vessel been provided with ship-specific fire safety and SOLAS training manuals and operational booklets? (V)","eg":"Ship-specific Fire Safety & SOLAS Training Manuals in mess rooms & cabins.","ex":"WHAT IS ASKED:\nShip-specific Fire Safety and SOLAS Training Manuals.\n\nFINDING WHEN:\n• Missing or generic\n\nWHAT THE INSPECTOR DOES:\n• Checks mess rooms and cabins\n\nREMEMBER:\n• SOLAS II-2/15, III/35","fg":"Ship-specific Fire Safety at SOLAS Training Manuals sa mess at cabins.","fc":["Ship-specific Fire Safety Operational Booklet at Training Manual","SOLAS Training Manual sa bawat mess room at recreation room","Kopya ng fire control plan sa labas ng accommodation (sa box)"],"fx":"ANO ANG HINIHINGI:\nShip-specific na Fire Safety at SOLAS Training Manuals.\n\nKAILAN MAY FINDING:\n• Wala o generic\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang mess rooms at cabins\n\nTANDAAN:\n• SOLAS II-2/15, III/35"},{"id":"4.39","s":"4","sn":"ISM System","a":"DECK","h":0,"c":["Class strength confirmation letter on board (Finding if not)","Markings per ICS Guide; obstacles; safe access from hatch cover to deck","If not designated – be ready to explain"],"o":"If the vessel is provided with a helicopter operating area, does the area comply with the requirements of ICS guidelines, and is there a safe access from the hatch cover to deck? (V)","eg":"Helicopter area (if any): markings, Class strength letter, safe access.","ex":"WHAT IS ASKED:\nIf there is a helicopter area: as per the ICS Guide and with safe access.\n\nFINDING WHEN:\n• Class strength confirmation letter missing\n\nWHAT THE INSPECTOR DOES:\n• Takes 360° photos","fg":"Helicopter area (kung meron): markings, Class strength letter, ligtas na daanan.","fc":["May Class strength confirmation letter sa barko (finding kung wala)","Markings ayon sa ICS Guide; mga harang; ligtas na daanan mula hatch cover papuntang deck","Kung hindi designated – handang ipaliwanag"],"fx":"ANO ANG HINIHINGI:\nKung may helicopter area: ayon sa ICS Guide at may ligtas na daanan.\n\nKAILAN MAY FINDING:\n• Walang strength confirmation letter ng Class\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Kumukuha ng 360° na picture"},{"id":"4.41","s":"4","sn":"ISM System","a":"DOC","h":0,"c":["ICS Helicopter/Ship checklist & risk assessment from last operation","Crew familiar with helicopter procedures; firefighting party allocation"],"o":"Are the crew familiar with the helicopter operation at sea, and are records available to show that the proper communication, shipboard helicopter safety checklist and specific risk assessment conducted prior to helicopter operation? (V)","eg":"Helicopter ops: ICS checklist, risk assessment, communication records.","ex":"WHAT IS ASKED:\nCrew know the helicopter procedures, with checklist and risk assessment.\n\nFINDING WHEN:\n• No checklist or risk assessment\n\nWHAT THE INSPECTOR DOES:\n• Checks records of the last operation\n\nREMEMBER:\n• ICS Guide to Helicopter/Ship Operations, Appendix B","fg":"Helicopter ops: ICS checklist, risk assessment, communication records.","fc":["ICS Helicopter/Ship checklist at risk assessment ng huling operation","Pamilyar ang crew sa helicopter procedures; may firefighting party allocation"],"fx":"ANO ANG HINIHINGI:\nAlam ng crew ang helicopter procedures, may checklist at risk assessment.\n\nKAILAN MAY FINDING:\n• Walang checklist o risk assessment\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang records ng huling operation\n\nTANDAAN:\n• ICS Guide to Helicopter/Ship Operations, Appendix B"},{"id":"4.42","s":"4","sn":"ISM System","a":"LSA","h":1,"c":["Lifebuoys: ship name & port, retro-tape, self-igniting lights/smoke in date, lines length correct","Bridge-wing MOB with quick release","Rockets/line-throwing apparatus/hand flares in date & in place"],"o":"Are the lifebuoys, related equipment, and pyrotechnics in good working order?","f":["Lifebuoy light or smoke signal expired / not working","Bridge-wing MOB release jammed, line rotten"],"eg":"Lifebuoys (light/smoke/line), MOB, pyrotechnics in date and correctly placed.","ex":"WHAT IS ASKED:\nLifebuoys, attachments and pyrotechnics in good condition.\n\nFINDING WHEN:\n• Expired or missing\n\nWHAT THE INSPECTOR DOES:\n• Checks rockets are in place and re-fitted","fg":"Lifebuoys (ilaw/smoke/lubid), MOB, pyrotechnics hindi expired at nasa tamang lugar.","fc":["Lifebuoys: pangalan at port ng barko, retro-tape, hindi expired ang self-igniting lights/smoke, tamang haba ng lubid","Bridge-wing MOB na may quick release","Rockets/line-throwing apparatus/hand flares hindi expired at nasa lugar"],"fx":"ANO ANG HINIHINGI:\nMaayos ang lifebuoys, attachments at pyrotechnics.\n\nKAILAN MAY FINDING:\n• Expired o kulang\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check kung nasa lugar at naibalik ang rockets","ff":["Expired / hindi gumagana ang lifebuoy light o smoke signal","Naiipit ang release ng bridge-wing MOB, bulok ang lubid"]},{"id":"4.43","s":"4","sn":"ISM System","a":"DOC","h":0,"c":["Familiarisation checklists for latest joiners – completed before duties","Includes safety, emergency duties, job-specific"],"o":"Are adequate familiarization procedures in place that cover the personal safety and professional obligations of new personnel and personnel transferred to a new assignment, and are documents available to confirm effective familiarization?(V)","f":["Familiarisation of new joiners not completed/signed within required time"],"eg":"Familiarisation of new crew complete and signed.","ex":"WHAT IS ASKED:\nFamiliarisation for new joiners and for those changing position.\n\nFINDING WHEN:\n• No evidence\n\nWHAT THE INSPECTOR DOES:\n• Checks checklists\n\nREMEMBER:\n• STCW I/14, ISM 6","fg":"Kumpleto at may pirma ang familiarisation ng bagong crew.","fc":["Familiarisation checklists ng pinakabagong sakay – kumpleto bago magtrabaho","Kasama ang safety, emergency duties, job-specific"],"fx":"ANO ANG HINIHINGI:\nFamiliarisation para sa bagong sakay at sa mga nagpalit ng posisyon.\n\nKAILAN MAY FINDING:\n• Walang patunay\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang checklists\n\nTANDAAN:\n• STCW I/14, ISM 6","ff":["Hindi natapos/napirmahan ang familiarisation ng bagong sakay sa takdang oras"]},{"id":"4.44","s":"4","sn":"ISM System","a":"DOC","h":0,"c":["SMS procedure for stevedore control & hazard briefing","Stevedore safety briefing records / signage","Stevedores follow enclosed space/hold entry rules"],"o":"Does the vessel manager have documented procedures in place to control stevedore activities onboard by identifying potential hazards and implementing appropriate mitigation measures?(V)","eg":"Procedure for controlling stevedores (hazards, hold entry).","ex":"WHAT IS ASKED:\nA procedure to control stevedores (hazards and measures).\n\nFINDING WHEN:\n• None\n\nWHAT THE INSPECTOR DOES:\n• Checks the SMS\n\nREMEMBER:\n• The Master has the final word, also for enclosed space entry","fg":"Procedure sa pagkontrol ng stevedores (panganib, pagpasok sa hold).","fc":["SMS procedure para sa stevedore control at hazard briefing","Stevedore safety briefing records / signage","Sinusunod ng stevedores ang enclosed space/hold entry rules"],"fx":"ANO ANG HINIHINGI:\nMay procedure sa pagkontrol ng stevedores (panganib at mga hakbang).\n\nKAILAN MAY FINDING:\n• Wala\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang SMS\n\nTANDAAN:\n• Ang Master ang may huling salita, pati sa enclosed space entry"},{"id":"5.1","s":"5","sn":"Pollution Prevention and Control","a":"ER","h":1,"c":["Entries use correct codes (C, D, I, H…) & format per MEPC.1/Circ.736","Sludge/bilge quantities consistent with tank soundings & IOPP Form A","Every entry signed by officer, each page by Master","Bunkering, sludge disposal (receipts), incinerator entries","e-ORB has Flag approval"],"o":"Is the Oil Record Book (Part 1) completed correctly? (V)","eg":"ORB Part I correctly completed (codes, quantities, signatures), matches soundings.","ex":"WHAT IS ASKED:\nOil Record Book Part I correctly completed.\n\nFINDING WHEN:\n• Wrong codes or quantities, or signatures missing\n\nWHAT THE INSPECTOR DOES:\n• If e-ORB, checks Flag approval\n\nREMEMBER:\n• MEPC.1/Circ.736","fg":"ORB Part I tamang napunan (codes, dami, pirma), tugma sa soundings.","fc":["Tamang codes (C, D, I, H…) at format ayon sa MEPC.1/Circ.736","Ang dami ng sludge/bilge ay tugma sa tank soundings at IOPP Form A","Bawat entry may pirma ng officer, bawat pahina ng Master","Entries ng bunkering, sludge disposal (resibo), incinerator","May Flag approval ang e-ORB"],"fx":"ANO ANG HINIHINGI:\nTamang napunan ang Oil Record Book Part I.\n\nKAILAN MAY FINDING:\n• Mali ang codes o dami, o kulang ang pirma\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Kung e-ORB, chine-check ang Flag approval\n\nTANDAAN:\n• MEPC.1/Circ.736"},{"id":"5.2","s":"5","sn":"Pollution Prevention and Control","a":"DOC","h":0,"c":["Approved SOPEP; national contact list (Appendix) up to date","SOPEP locker inventory complete & sealed; drills recorded","Crew know duties"],"o":"Is an approved MARPOL Shipboard Oil Pollution Emergency Plan (SOPEP) available, and up to date and are ship’s personnel familiar with their duties? (V)","eg":"SOPEP approved, contact list updated, SOPEP locker complete.","ex":"WHAT IS ASKED:\nApproved and updated SOPEP, and crew know their duties.\n\nFINDING WHEN:\n• Old contact list or crew do not know\n\nWHAT THE INSPECTOR DOES:\n• Checks SOPEP and locker\n\nREMEMBER:\n• MARPOL Annex I Reg 37","fg":"Aprubado ang SOPEP, updated ang contact list, kumpleto ang SOPEP locker.","fc":["Aprubadong SOPEP; updated ang national contact list (Appendix)","Kumpleto at naka-seal ang SOPEP locker inventory; naka-record ang drills","Alam ng crew ang tungkulin nila"],"fx":"ANO ANG HINIHINGI:\nAprubado at updated ang SOPEP, at alam ng crew ang tungkulin nila.\n\nKAILAN MAY FINDING:\n• Lumang contact list o hindi alam ng crew\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang SOPEP at locker\n\nTANDAAN:\n• MARPOL Annex I Reg 37"},{"id":"5.3","s":"5","sn":"Pollution Prevention and Control","a":"DECK","h":0,"c":["Crew know rules for cargo residues/hold wash water discharge","Garbage placard posted; segregation bins correctly labelled","Hold washing entries in GRB"],"o":"Are the ship’s personnel aware of the requirements of MARPOL Annex V with respect to the disposal of operational waste and cargo residues from ships? (V)","eg":"Annex V knowledge: cargo residues, HME, garbage disposal, special areas.","ex":"WHAT IS ASKED:\nCrew know MARPOL Annex V (garbage, cargo residues).\n\nFINDING WHEN:\n• Crew do not know\n\nWHAT THE INSPECTOR DOES:\n• Asks questions\n\nREMEMBER:\n• HME residues are never discharged","fg":"Kaalaman sa Annex V: cargo residues, HME, pagtapon ng basura, special areas.","fc":["Alam ng crew ang rules sa cargo residues/hold wash water discharge","Nakapaskil ang garbage placard; tamang label ng segregation bins","Hold washing entries sa GRB"],"fx":"ANO ANG HINIHINGI:\nAlam ng crew ang MARPOL Annex V (basura, cargo residues).\n\nKAILAN MAY FINDING:\n• Hindi alam\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Nagtatanong\n\nTANDAAN:\n• Hindi itinatapon ang HME residues"},{"id":"5.5","s":"5","sn":"Pollution Prevention and Control","a":"HOLD","h":0,"c":["Look for leaks/staining at bulkheads in holds, ER, pipe duct","Check transverse bulkheads lower stool region"],"o":"Is the vessel free from any visible bulkhead leakage? (V)","eg":"No leaks at bulkheads (holds, ER, ballast).","ex":"WHAT IS ASKED:\nNo visible leaks at the bulkheads.\n\nFINDING WHEN:\n• A leak\n\nWHAT THE INSPECTOR DOES:\n• Visual check","fg":"Walang leak sa bulkheads (holds, ER, ballast).","fc":["Hanapin ang leak/mantsa sa bulkheads sa holds, ER, pipe duct","I-check ang lower stool ng transverse bulkheads"],"fx":"ANO ANG HINIHINGI:\nWalang nakikitang leak sa bulkheads.\n\nKAILAN MAY FINDING:\n• May leak\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check"},{"id":"5.6","s":"5","sn":"Pollution Prevention and Control","a":"HOLD","h":1,"c":["Hold bilge wells clean, strainers/covers in place","Non-return valves tested; bilge suction test records","Bilge alarms (WIDS) working"],"o":"Are the cargo hold bilge pumping systems and bilge arrangements appropriately set, in good order and tested? (V)","eg":"Hold bilge system: wells clean, strum boxes, non-return valves, tests.","ex":"WHAT IS ASKED:\nHold bilge system correctly arranged, in good condition, tested.\n\nFINDING WHEN:\n• Defective or not tested\n\nWHAT THE INSPECTOR DOES:\n• Checks wells, strainers, non-return valves","fg":"Hold bilge system: malinis ang wells, strum boxes, non-return valves, tests.","fc":["Malinis ang hold bilge wells, nasa lugar ang strainers/covers","Nasubukan ang non-return valves; bilge suction test records","Gumagana ang bilge alarms (WIDS)"],"fx":"ANO ANG HINIHINGI:\nTama ang ayos, maayos at nasubukan ang hold bilge system.\n\nKAILAN MAY FINDING:\n• Sira o hindi nasubukan\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang wells, strainers, non-return valves"},{"id":"5.7","s":"5","sn":"Pollution Prevention and Control","a":"DECK","h":0,"c":["Daily sounding book: hold bilges, ballast, voids, chain lockers, pipe duct","Sounding pipe caps/ID marked; sounding tape available"],"o":"Is the sounding of cargo hold bilge, ballast tanks, chain lockers, pipe ducts and other void spaces regularly performed for accumulations of water, or alternative evidence of regular monitoring? (V)","eg":"Soundings of bilges/ballast/voids/chain lockers recorded daily.","ex":"WHAT IS ASKED:\nRegular soundings of bilges, ballast, chain lockers, pipe duct, voids.\n\nFINDING WHEN:\n• No records\n\nWHAT THE INSPECTOR DOES:\n• Checks the sounding book","fg":"Soundings ng bilges/ballast/voids/chain lockers naka-record araw-araw.","fc":["Daily sounding book: hold bilges, ballast, voids, chain lockers, pipe duct","May takip/ID marking ang sounding pipes; may sounding tape"],"fx":"ANO ANG HINIHINGI:\nRegular na soundings sa bilges, ballast, chain lockers, pipe duct, voids.\n\nKAILAN MAY FINDING:\n• Walang records\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang sounding book"},{"id":"5.8","s":"5","sn":"Pollution Prevention and Control","a":"DECK","h":1,"c":["Drip trays/coamings under winches, windlass, crane & hatch hydraulics","Clean, no oil; drain plugs fitted","No hydraulic leaks on deck"],"o":"Are suitable containment arrangements in place around the hydraulic components of deck machinery? (V)","eg":"Save-alls / containment around hydraulic deck machinery, clean.","ex":"WHAT IS ASKED:\nContainment around the hydraulics of deck machinery.\n\nFINDING WHEN:\n• Missing or oily\n\nWHAT THE INSPECTOR DOES:\n• Visual check","fg":"Save-alls / containment sa paligid ng hydraulic deck machinery, malinis.","fc":["Drip trays/coamings sa ilalim ng winches, windlass, crane at hatch hydraulics","Malinis, walang langis; may drain plugs","Walang hydraulic leak sa deck"],"fx":"ANO ANG HINIHINGI:\nMay containment sa paligid ng hydraulics ng deck machinery.\n\nKAILAN MAY FINDING:\n• Wala o may langis\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check"},{"id":"5.9","s":"5","sn":"Pollution Prevention and Control","a":"DECK","h":0,"c":["Bosun store / fwd spaces bilge pumping (eductor/portable) operational","Clearly marked; test records"],"o":"Are the emergency arrangements to pump out the spaces forward of the collision bulkhead in the event of flooding in good order, and are these arrangements prominently marked? (V)","eg":"Pump/means for fore peak & spaces forward of the collision bulkhead – marked.","ex":"WHAT IS ASKED:\nMeans of pumping the spaces forward of the collision bulkhead, marked.\n\nFINDING WHEN:\n• Not working or not marked\n\nWHAT THE INSPECTOR DOES:\n• Checks them","fg":"Pump/paraan para sa fore peak at spaces sa unahan ng collision bulkhead – may marka.","fc":["Gumagana ang bilge pumping ng bosun store / fwd spaces (eductor/portable)","Malinaw ang marka; may test records"],"fx":"ANO ANG HINIHINGI:\nMay paraan ng pag-pump sa spaces sa unahan ng collision bulkhead, may marka.\n\nKAILAN MAY FINDING:\n• Hindi gumagana o walang marka\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"5.10","s":"5","sn":"Pollution Prevention and Control","a":"ER","h":1,"c":["BWMP approved; officers know it","BWTS operating, no alarms; maintenance per maker (UV lamps, filters)","BWRB entries consistent with deck log & BWTS logs","Exceptions/bypass events recorded & reported","📋 Inspector: BWM certificate + BWMS type / annual report; BWMS & EGCS on-board training records"],"o":"Are the master and officers familiar with the approved Ballast Water Management Plan, was the ballast water treatment system maintained as per the manufacturer’s recommendations, and is the record-keeping of ballast water operations in the ballast water record book completed correctly? (V)","f":["BWTS not operational / TRO sensor not calibrated","BWRB entries don't match deck log","Officer unfamiliar with BWTS alarms and bypass reporting"],"eg":"BWMP, BWTS working & maintained, Ballast Water Record Book correct.","ex":"WHAT IS ASKED:\nBWMP, BWTS maintained per maker, correct Ballast Water Record Book.\n\nFINDING WHEN:\n• BWTS not working or records have errors\n\nWHAT THE INSPECTOR DOES:\n• Asks the officers\n• Checks records\n\nREMEMBER:\n• BWM Convention D-2","fg":"BWMP, gumagana at naaalagaan ang BWTS, tama ang Ballast Water Record Book.","fc":["Aprubado ang BWMP; alam ng officers","Umaandar ang BWTS, walang alarm; maintenance ayon sa maker (UV lamps, filters)","Ang BWRB entries ay tugma sa deck log at BWTS logs","Naka-record at na-report ang exceptions/bypass","📋 Inspector: BWM certificate + BWMS type / annual report; BWMS & EGCS on-board training records"],"fx":"ANO ANG HINIHINGI:\nBWMP, BWTS na naaalagaan ayon sa maker, tamang Ballast Water Record Book.\n\nKAILAN MAY FINDING:\n• Hindi gumagana ang BWTS o may mali ang records\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Tinatanong ang officers\n• Chine-check ang records\n\nTANDAAN:\n• BWM Convention D-2","ff":["Hindi gumagana ang BWTS / hindi calibrated ang TRO sensor","Hindi tugma ang BWRB entries sa deck log","Hindi alam ng officer ang BWTS alarms at bypass reporting"]},{"id":"5.12","s":"5","sn":"Pollution Prevention and Control","a":"DECK","h":0,"c":["Procedure to check ballast for oil before discharge (visual/sample)","Records of check before deballasting"],"o":"If ballast tanks are located adjacent to fuel oil tanks, or there is a possibility of contamination by hydraulic oil, are ballast tank contents being checked to ensure there has been no contamination of the water by oil prior to discharge? (V)","eg":"Ballast checked for oil before deballasting (if next to FO tanks).","ex":"WHAT IS ASKED:\nBallast checked for oil before deballasting, if next to fuel tanks.\n\nFINDING WHEN:\n• Not done\n\nWHAT THE INSPECTOR DOES:\n• Checks records","fg":"Chine-check ang ballast kung may langis bago mag-deballast (kung katabi ng FO tanks).","fc":["Procedure sa pag-check ng langis sa ballast bago i-discharge (visual/sample)","Records ng check bago mag-deballast"],"fx":"ANO ANG HINIHINGI:\nChine-check ang ballast kung may langis bago mag-deballast, kung katabi ng fuel tanks.\n\nKAILAN MAY FINDING:\n• Hindi ginagawa\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang records"},{"id":"5.13","s":"5","sn":"Pollution Prevention and Control","a":"ER","h":1,"c":["Emergency bilge suction valve marked 'Emergency use only' + warning notice; area clean","Overboard discharge valve sealed/locked & marked","Test procedure in PMS"],"o":"Are the emergency bilge suction and emergency overboard discharge valves in the engine room in good order and clearly identified with a notice warning against accidental opening and, is the area around the bilge injection suction bellmouth clear of debris and clean? (V)","eg":"Emergency bilge suction & overboard valves marked with warning; clean area.","ex":"WHAT IS ASKED:\nEmergency bilge suction and overboard valves marked with a warning, and the area clean.\n\nFINDING WHEN:\n• No marking or dirty area\n\nWHAT THE INSPECTOR DOES:\n• Checks the test procedure","fg":"Emergency bilge suction at overboard valves may marka at babala; malinis ang area.","fc":["Emergency bilge suction valve may markang 'Emergency use only' + warning notice; malinis ang area","Overboard discharge valve naka-seal/naka-lock at may marka","Test procedure nasa PMS"],"fx":"ANO ANG HINIHINGI:\nMay marka at babala ang emergency bilge suction at overboard valves, at malinis ang area.\n\nKAILAN MAY FINDING:\n• Walang marka o marumi ang area\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang test procedure"},{"id":"5.14","s":"5","sn":"Pollution Prevention and Control","a":"ER","h":0,"c":["Trace sludge pump discharge: only to shore connection/incinerator","No blank-able cross-connection to overboard"],"o":"Are arrangements for sludge collecting pumps free from any connection to a direct overboard discharge? (V)","eg":"Sludge pump with no connection to overboard.","ex":"WHAT IS ASKED:\nThe sludge pump must have no connection to overboard.\n\nFINDING WHEN:\n• There is a connection\n\nWHAT THE INSPECTOR DOES:\n• Checks the piping\n\nREMEMBER:\n• MARPOL I Reg 12","fg":"Sludge pump na walang koneksyon papuntang overboard.","fc":["Sundan ang discharge ng sludge pump: sa shore connection/incinerator lang","Walang cross-connection papuntang overboard (kahit naka-blank)"],"fx":"ANO ANG HINIHINGI:\nAng sludge pump ay dapat walang koneksyon papuntang overboard
