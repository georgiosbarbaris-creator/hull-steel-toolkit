.\n\nKAILAN MAY FINDING:\n• May koneksyon\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang piping\n\nTANDAAN:\n• MARPOL I Reg 12"},{"id":"5.15","s":"5","sn":"Pollution Prevention and Control","a":"ER","h":1,"c":["OWS runs; 15ppm monitor calibration certificate (≤5 yrs)","Alarm & 3-way valve recirculate when >15 ppm (demonstrate)","Sample flow genuine – no fresh water flushing tricks","Overboard valve sealed; seal numbers logged","Engineers know procedure"],"o":"Are the engineering officers familiar with the company procedures for operating the oil filtering equipment, and was the equipment in satisfactory condition and used in compliance with company procedures, the manufacturer’s instructions, and MARPOL Annex I? (V)","f":["15 ppm monitor calibration certificate >5 years","Officer cannot demonstrate test / 3-way valve not recirculating","Sample line can be flushed with fresh water, not sealed"],"eg":"OWS + 15 ppm alarm: test in front of the inspector, genuine sample flow, seals.","ex":"WHAT IS ASKED:\nEngineers know the OWS and the equipment works correctly.\n\nFINDING WHEN:\n• Alarm not activated or valve does not turn above 15 ppm\n• Fake sample flow\n• Sampling valve not sealed by Class\n\nWHAT THE INSPECTOR DOES:\n• With C/E agreement he will see the OWS running and an alarm test with a sample above 15 ppm\n• Closes the sampling valve to see the reaction\n\nREMEMBER:\n• MEPC.107(49)\n• Calibration of the 15 ppm meter every 5 years","fg":"OWS + 15 ppm alarm: test sa harap ng inspector, totoong sample flow, seals.","fc":["Umaandar ang OWS; 15ppm monitor calibration certificate (≤5 taon)","Alarm at 3-way valve nagre-recirculate kapag >15 ppm (ipakita)","Totoo ang sample flow – walang daya na fresh water flushing","Naka-seal ang overboard valve; naka-log ang seal numbers","Alam ng engineers ang procedure"],"fx":"ANO ANG HINIHINGI:\nAlam ng engineers ang OWS at tama ang andar ng equipment.\n\nKAILAN MAY FINDING:\n• Hindi nag-a-alarm o hindi lumilipat ang valve sa itaas ng 15 ppm\n• Pekeng sample flow\n• Hindi naka-seal ng Class ang sampling valve\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Kung payag ang C/E, titingnan ang andar ng OWS at alarm test gamit ang sample na >15 ppm\n• Isinasara ang sampling valve para makita ang reaksyon\n\nTANDAAN:\n• MEPC.107(49)\n• Calibration ng 15 ppm meter bawat 5 taon","ff":["15 ppm monitor calibration certificate >5 taon","Hindi maipakita ng officer ang test / hindi nagre-recirculate ang 3-way valve","Puwedeng i-flush ng fresh water ang sample line, hindi naka-seal"]},{"id":"5.18","s":"5","sn":"Pollution Prevention and Control","a":"DOC","h":0,"c":["Shipper's HME / non-HME declaration for current & last cargoes"],"o":"Has a declaration been provided by the shipper as to whether the cargo is harmful to the marine environment (HME)? (V)","eg":"HME declaration from the shipper for every cargo.","ex":"WHAT IS ASKED:\nHME declaration from the shipper.\n\nFINDING WHEN:\n• Missing\n\nWHAT THE INSPECTOR DOES:\n• Checks it\n\nREMEMBER:\n• MARPOL V","fg":"HME declaration mula sa shipper para sa bawat cargo.","fc":["HME / non-HME declaration ng shipper para sa kasalukuyan at huling cargo"],"fx":"ANO ANG HINIHINGI:\nHME declaration mula sa shipper.\n\nKAILAN MAY FINDING:\n• Wala\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check\n\nTANDAAN:\n• MARPOL V"},{"id":"5.19","s":"5","sn":"Pollution Prevention and Control","a":"ACC","h":1,"c":["GMP ship-specific; garbage officer designated","GRB Part I (and II for cargo residues) entries with categories, m³, positions","Port reception receipts kept 2 years","Bins colour-coded/labelled; placards posted"],"o":"Has a Garbage Management Plan been provided and is the Garbage Record Book (GRB) being correctly maintained? (V)","eg":"Garbage Management Plan & GRB correct, segregation, receipts.","ex":"WHAT IS ASKED:\nGarbage Management Plan and a correct Garbage Record Book.\n\nFINDING WHEN:\n• Wrong categories or quantities\n\nWHAT THE INSPECTOR DOES:\n• Checks GRB and receipts\n\nREMEMBER:\n• Categories A–K, quantity in m³","fg":"Tama ang Garbage Management Plan at GRB, segregation, resibo.","fc":["Ship-specific ang GMP; may designated garbage officer","GRB Part I (at II para sa cargo residues) entries na may category, m³, positions","Port reception receipts itinatago nang 2 taon","Color-coded/may label ang bins; nakapaskil ang placards"],"fx":"ANO ANG HINIHINGI:\nGarbage Management Plan at tamang Garbage Record Book.\n\nKAILAN MAY FINDING:\n• Mali ang category o dami\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang GRB at resibo\n\nTANDAAN:\n• Categories A–K, dami sa m³"},{"id":"5.21","s":"5","sn":"Pollution Prevention and Control","a":"DOC","h":0,"c":["SEEMP Part III approved (CII implementation plan); DCS data","Know current CII rating & corrective plan if D/E"],"o":"Has a ship-specific Energy Efficiency Management Plan been provided to the vessel?","eg":"SEEMP Part I/II/III (CII plan) approved.","ex":"WHAT IS ASKED:\nShip-specific SEEMP.\n\nFINDING WHEN:\n• Missing\n\nWHAT THE INSPECTOR DOES:\n• Checks it\n\nREMEMBER:\n• SEEMP Part III for CII","fg":"Aprubado ang SEEMP Part I/II/III (CII plan).","fc":["Aprubado ang SEEMP Part III (CII implementation plan); DCS data","Alamin ang kasalukuyang CII rating at corrective plan kung D/E"],"fx":"ANO ANG HINIHINGI:\nShip-specific na SEEMP.\n\nKAILAN MAY FINDING:\n• Wala\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check\n\nTANDAAN:\n• SEEMP Part III para sa CII"},{"id":"5.23","s":"5","sn":"Pollution Prevention and Control","a":"ER","h":0,"c":["EGCS operating, monitoring records (pH, PAH, turbidity)","Engineers familiar; procedures in SMS","No soot on water from washwater discharge"],"o":"If the vessel has an Exhaust Gas Cleaning System (scrubber system), is it in good working order, are the engineers familiar with its safe operation, and have procedures been incorporated into the Safety Management System?","eg":"Scrubber (if fitted): operation, wash water monitoring, procedures.","ex":"WHAT IS ASKED:\nScrubber working well, engineers know it, procedures in the SMS.\n\nFINDING WHEN:\n• Soot on the water from the wash water\n\nWHAT THE INSPECTOR DOES:\n• Checks it","fg":"Scrubber (kung meron): andar, wash water monitoring, procedures.","fc":["Umaandar ang EGCS, monitoring records (pH, PAH, turbidity)","Pamilyar ang engineers; nasa SMS ang procedures","Walang uling sa tubig mula sa washwater discharge"],"fx":"ANO ANG HINIHINGI:\nMaayos ang andar ng scrubber, alam ito ng engineers, nasa SMS ang procedures.\n\nKAILAN MAY FINDING:\n• May uling sa tubig mula sa wash water\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"5.25","s":"5","sn":"Pollution Prevention and Control","a":"ER","h":0,"c":["Ballast control panel – valve indications correct, no faulty valves","Pressure gauges & remote sounding/draft gauges working","No leaks/temporary repairs on ballast pipework"],"o":"Are the ballast pumping systems, including their associated instruments, controls, valves, pipework, and the control panel (including pressure gauges, draft gauges, and the remote control system), in good working order and is there recorded evidence of regular inspection?(V)","eg":"Ballast pumps, valves, remote control panel, gauges, draft gauges working.","ex":"WHAT IS ASKED:\nBallast pumps, instruments, valves, piping and control panel working.\n\nFINDING WHEN:\n• Defective instruments or valves\n\nWHAT THE INSPECTOR DOES:\n• Checks them","fg":"Gumagana ang ballast pumps, valves, remote control panel, gauges, draft gauges.","fc":["Ballast control panel – tama ang valve indications, walang sirang valve","Gumagana ang pressure gauges at remote sounding/draft gauges","Walang leak/temporary repair sa ballast piping"],"fx":"ANO ANG HINIHINGI:\nGumagana ang ballast pumps, instruments, valves, piping at control panel.\n\nKAILAN MAY FINDING:\n• Sira ang instruments o valves\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"5.26","s":"5","sn":"Pollution Prevention and Control","a":"DECK","h":0,"c":["All bolts in place, gaskets good, no leaks/corrosion"],"o":"Are bunker and ballast tank manholes maintained in good condition?","eg":"Bunker & ballast tank manholes in good condition (bolts, gaskets).","ex":"WHAT IS ASKED:\nManholes of bunker and ballast tanks in good condition.\n\nFINDING WHEN:\n• Missing bolts or leaks\n\nWHAT THE INSPECTOR DOES:\n• Visual check","fg":"Maayos ang manholes ng bunker at ballast tanks (bolts, gaskets).","fc":["Kumpleto ang bolts, maayos ang gaskets, walang leak/kalawang"],"fx":"ANO ANG HINIHINGI:\nMaayos ang manholes ng bunker at ballast tanks.\n\nKAILAN MAY FINDING:\n• Kulang ang bolts o may leak\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check"},{"id":"5.27","s":"5","sn":"Pollution Prevention and Control","a":"ER","h":0,"c":["STP running, no smells/leaks; blowers & discharge pumps work","Chlorine/disinfectant, sludge records; certificate of type approval"],"o":"Are the crew members familiar with the operation and maintenance of the sewage treatment plant, and is the sewage treatment plant, including its associated piping, discharge pumps, and air blowers, in good condition?","eg":"Sewage plant working, blowers, pumps, piping; crew know it.","ex":"WHAT IS ASKED:\nSewage plant in good condition and the crew know it.\n\nFINDING WHEN:\n• Not working\n\nWHAT THE INSPECTOR DOES:\n• Checks it\n\nREMEMBER:\n• MARPOL IV","fg":"Gumagana ang sewage plant, blowers, pumps, piping; alam ng crew.","fc":["Umaandar ang STP, walang amoy/leak; gumagana ang blowers at discharge pumps","Chlorine/disinfectant, sludge records; certificate of type approval"],"fx":"ANO ANG HINIHINGI:\nMaayos ang sewage plant at alam ito ng crew.\n\nKAILAN MAY FINDING:\n• Hindi gumagana\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check\n\nTANDAAN:\n• MARPOL IV"},{"id":"6.1","s":"6","sn":"Ship’s Structure","a":"DOC","h":1,"c":["All doublers/inserts/repairs reported to Class & recorded","Walk deck/holds for unexplained doublers or welding"],"o":"Is the vessel free of any hull repairs unreported to class? (V)","eg":"No hull repair without informing Class.","ex":"WHAT IS ASKED:\nNo repair to the hull without Class knowing.\n\nFINDING WHEN:\n• Documents or visible signs of repair without approval\n\nWHAT THE INSPECTOR DOES:\n• Looks for doublers and welding","fg":"Walang hull repair nang hindi alam ng Class.","fc":["Lahat ng doublers/inserts/repairs ay ini-report sa Class at naka-record","Ikutin ang deck/holds para sa doublers o welding na walang paliwanag"],"fx":"ANO ANG HINIHINGI:\nWalang repair sa hull nang hindi alam ng Class.\n\nKAILAN MAY FINDING:\n• May dokumento o nakikitang repair na walang approval\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Naghahanap ng doublers at welding"},{"id":"6.2","s":"6","sn":"Ship’s Structure","a":"HOLD","h":1,"c":["SMS schedule for crew inspections of holds, ballast tanks, voids, duct keel","Inspection reports for each space with PHOTOS/VIDEO (Finding if missing)","Coating condition rated, defects followed up"],"o":"Does the SMS include procedures and instructions for regular inspection of cargo holds, ballast tanks, void spaces, trunks, duct keel and cofferdams by the ship’s personnel and are records maintained? (V)","eg":"Crew inspections of holds/ballast tanks/voids WITH photos/video.","ex":"WHAT IS ASKED:\nAn SMS procedure for regular crew inspections of holds, ballast tanks, voids, duct keel, with records.\n\nFINDING WHEN:\n• No inspection report\n• Report without photos or video\n\nWHAT THE INSPECTOR DOES:\n• Checks reports","fg":"Inspection ng crew sa holds/ballast tanks/voids NA MAY picture/video.","fc":["SMS schedule para sa crew inspections ng holds, ballast tanks, voids, duct keel","Inspection report ng bawat space na may PICTURE/VIDEO (finding kung wala)","May rating ang coating condition, sinusundan ang defects"],"fx":"ANO ANG HINIHINGI:\nMay SMS procedure para sa regular na inspection ng crew sa holds, ballast tanks, voids, duct keel, may records.\n\nKAILAN MAY FINDING:\n• Walang inspection report\n• Report na walang picture o video\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang reports"},{"id":"6.3","s":"6","sn":"Ship’s Structure","a":"DOC","h":0,"c":["ESP survey report file: thickness measurements, close-up surveys, condition evaluation report","Executive hull summary confirms fitness for 5 yrs"],"o":"Is the Enhanced Survey report file adequately maintained and does the condition evaluation report confirm the fitness of the ship for its intended service for the next five years? (M)","eg":"ESP file (Enhanced Survey Programme) complete, condition evaluation report.","ex":"WHAT IS ASKED:\nESP file complete, and the condition evaluation report shows the ship is fit for the next 5 years.\n\nFINDING WHEN:\n• Incomplete file\n\nWHAT THE INSPECTOR DOES:\n• Checks it\n\nREMEMBER:\n• SOLAS XI-1/2, ESP Code","fg":"Kumpleto ang ESP file (Enhanced Survey Programme), condition evaluation report.","fc":["ESP survey report file: thickness measurements, close-up surveys, condition evaluation report","Kinukumpirma ng executive hull summary na fit sa 5 taon"],"fx":"ANO ANG HINIHINGI:\nKumpleto ang ESP file, at ipinapakita ng condition evaluation report na fit ang barko sa susunod na 5 taon.\n\nKAILAN MAY FINDING:\n• Kulang ang file\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check\n\nTANDAAN:\n• SOLAS XI-1/2, ESP Code"},{"id":"6.4","s":"6","sn":"Ship’s Structure","a":"HOLD","h":1,"c":["Check hold ladders: rungs not wasted/bent, cages & platforms secure, no missing parts","Australian ladder/access hatches operable","Any defect repaired before inspection"],"o":"Are the access points to cargo holds, ballast tanks, and void spaces including vertical ladders, spiral ladders, rungs, stations, and platforms being maintained and in good order? (V)","eg":"Hold/tank ladders (vertical, spiral, rungs, platforms) not wasted/bent.","ex":"WHAT IS ASKED:\nLadders, rungs and platforms in holds, tanks and voids in good condition.\n\nFINDING WHEN:\n• Rusty, bent or wasted ladders or rungs\n\nWHAT THE INSPECTOR DOES:\n• Checks in the holds","fg":"Hagdan ng holds/tanks (vertical, spiral, rungs, platforms) hindi bulok/baluktot.","fc":["I-check ang hold ladders: hindi bulok/baluktot ang rungs, matibay ang cages at platforms, walang kulang","Gumagana ang Australian ladder/access hatches","Ayusin ang anumang defect bago ang inspection"],"fx":"ANO ANG HINIHINGI:\nMaayos ang hagdan, rungs at platforms sa holds, tanks at voids.\n\nKAILAN MAY FINDING:\n• Kalawangin, baluktot o bulok na hagdan o rungs\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check sa holds"},{"id":"6.5","s":"6","sn":"Ship’s Structure","a":"HOLD","h":0,"c":["Pipes in holds not dented/wasted; protective guards intact","Caps/covers in place"],"o":"Are the air pipes and sounding pipes in the cargo holds and void spaces in good condition? (V)","eg":"Air & sounding pipes inside the holds in good condition (guards).","ex":"WHAT IS ASKED:\nAir and sounding pipes in holds and voids in good condition.\n\nFINDING WHEN:\n• Dented or wasted\n\nWHAT THE INSPECTOR DOES:\n• Visual check","fg":"Maayos ang air at sounding pipes sa loob ng holds (guards).","fc":["Hindi yupi/bulok ang pipes sa holds; buo ang protective guards","Nasa lugar ang caps/covers"],"fx":"ANO ANG HINIHINGI:\nMaayos ang air at sounding pipes sa holds at voids.\n\nKAILAN MAY FINDING:\n• Yupi o bulok\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check"},{"id":"6.6","s":"6","sn":"Ship’s Structure","a":"ER","h":0,"c":["Duct keel dry, lit, fan working; entry procedure posted","No leaks from pipes inside"],"o":"If the vessel has a duct keel, is the access, mechanical ventilator, and lighting adequate and is it free of water? (V)","eg":"Duct keel: access, ventilation, lighting, dry.","ex":"WHAT IS ASKED:\nIf there is a duct keel: access, ventilation, lighting, no water.\n\nFINDING WHEN:\n• Water or poor ventilation\n\nWHAT THE INSPECTOR DOES:\n• Enters and checks","fg":"Duct keel: daanan, ventilation, ilaw, tuyo.","fc":["Tuyo, may ilaw at gumagana ang fan sa duct keel; nakapaskil ang entry procedure","Walang leak mula sa pipes sa loob"],"fx":"ANO ANG HINIHINGI:\nKung may duct keel: daanan, ventilation, ilaw, walang tubig.\n\nKAILAN MAY FINDING:\n• May tubig o mahina ang ventilation\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Pumapasok at chine-check"},{"id":"6.7","s":"6","sn":"Ship’s Structure","a":"HOLD","h":1,"c":["Holds: frames/brackets not detached/buckled; hopper & topside tank plating","Hatch coamings & stays, deck plating no cracks/buckling","Note grab damage – repair or report to Class"],"o":"Is the vessel free of any apparent structural defects? (V)","eg":"No visible structural damage (frames, brackets, hopper, coamings).","ex":"WHAT IS ASKED:\nNo obvious structural damage.\n\nFINDING WHEN:\n• Damage (e.g. cracked or buckled frames)\n\nWHAT THE INSPECTOR DOES:\n• Writes which areas he checked","fg":"Walang nakikitang structural damage (frames, brackets, hopper, coamings).","fc":["Holds: hindi natanggal/baluktot ang frames/brackets; hopper at topside tank plating","Hatch coamings at stays, walang bitak/baluktot ang deck plating","Tandaan ang grab damage – ayusin o i-report sa Class"],"fx":"ANO ANG HINIHINGI:\nWalang halatang structural damage.\n\nKAILAN MAY FINDING:\n• May damage (hal. may bitak o baluktot na frames)\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Isinusulat kung aling area ang chine-check niya"},{"id":"6.8","s":"6","sn":"Ship’s Structure","a":"HOLD","h":0,"c":["Hold vents open/close freely; flame screens; markings open/close","Fans (if fitted) run"],"o":"Are cargo hold ventilation systems being maintained in good condition? (V)","eg":"Hold ventilation (fans, mushrooms, flaps) works and closes.","ex":"WHAT IS ASKED:\nHold ventilation maintained.\n\nFINDING WHEN:\n• Defective flaps or fans\n\nWHAT THE INSPECTOR DOES:\n• Checks them","fg":"Gumagana at sumasara ang hold ventilation (fans, mushrooms, flaps).","fc":["Malayang bumubukas/sumasara ang hold vents; flame screens; markang open/close","Umaandar ang fans (kung meron)"],"fx":"ANO ANG HINIHINGI:\nNaaalagaan ang hold ventilation.\n\nKAILAN MAY FINDING:\n• Sira ang flaps o fans\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"7A.1","s":"7A","sn":"Fuel Management (Oil)","a":"DECK","h":1,"c":["Manifold drip tray clean & empty, drain plug fitted","Sorbents/SOPEP kit nearby"],"o":"Is adequate manifold spill containment provided under the bunker manifolds, and are they clean and empty? (V)","eg":"Save-all under the bunker manifolds clean and empty with plug.","ex":"WHAT IS ASKED:\nSave-all under the bunker manifolds, clean and empty.\n\nFINDING WHEN:\n• Dirty or full\n\nWHAT THE INSPECTOR DOES:\n• Visual check","fg":"Malinis at walang laman ang save-all sa ilalim ng bunker manifolds, may plug.","fc":["Malinis at walang laman ang manifold drip tray, may drain plug","May sorbents/SOPEP kit sa malapit"],"fx":"ANO ANG HINIHINGI:\nMalinis at walang laman ang save-all sa ilalim ng bunker manifolds.\n\nKAILAN MAY FINDING:\n• Marumi o puno\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check"},{"id":"7A.2","s":"7A","sn":"Fuel Management (Oil)","a":"ER","h":0,"c":["Pressure test records & marking of test date/pressure on line","Test certificates in PMS"],"o":"Are bunker transfer systems hydrostatically tested to their Maximum Allowable Working Pressure (MAWP) on an annual basis and to 1.5 times their MAWP at least twice within any five years period?","eg":"Bunker lines hydrostatic test: annually at MAWP, 1.5×MAWP twice in 5 years.","ex":"WHAT IS ASKED:\nHydrostatic test of bunker lines: annually at MAWP and at 1.5×MAWP twice in every 5 years.\n\nFINDING WHEN:\n• No test\n\nWHAT THE INSPECTOR DOES:\n• Checks records","fg":"Hydrostatic test ng bunker lines: taon-taon sa MAWP, 1.5×MAWP dalawang beses sa 5 taon.","fc":["Pressure test records at marka ng test date/pressure sa line","Test certificates nasa PMS"],"fx":"ANO ANG HINIHINGI:\nHydrostatic test ng bunker lines: taon-taon sa MAWP at sa 1.5×MAWP dalawang beses bawat 5 taon.\n\nKAILAN MAY FINDING:\n• Walang test\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang records"},{"id":"7A.3","s":"7A","sn":"Fuel Management (Oil)","a":"DECK","h":0,"c":["Blank flanges fitted with full set of bolts when not in use","Pressure gauges working & calibrated; drain cocks closed"],"o":"Are the drains, vents, pressure gauges, and thermometers on the bunker manifolds in good working order, and are blanks fitted when they are not in use? (V)","eg":"Bunker manifold: drains, vents, gauges, thermometers OK, blanks with all bolts.","ex":"WHAT IS ASKED:\nDrains, vents and instruments at the manifolds in good condition, and blanks fitted when not in use.\n\nFINDING WHEN:\n• Blanks or bolts missing\n\nWHAT THE INSPECTOR DOES:\n• Visual check","fg":"Bunker manifold: OK ang drains, vents, gauges, thermometers, blanks na kumpleto ang bolts.","fc":["Blank flanges na kumpleto ang bolts kapag hindi ginagamit","Gumagana at calibrated ang pressure gauges; sarado ang drain cocks"],"fx":"ANO ANG HINIHINGI:\nMaayos ang drains, vents at instruments sa manifolds, at may blanks kapag hindi ginagamit.\n\nKAILAN MAY FINDING:\n• Walang blanks o kulang ang bolts\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check"},{"id":"7A.4","s":"7A","sn":"Fuel Management (Oil)","a":"DECK","h":1,"c":["Save-alls around all fuel/lube tank vents, clean & empty","Drain plug secured with chain"],"o":"Are save-alls fitted around all fuel, diesel, and lubricating oil tank vents; are they clean and empty, and is the drain plug secured with a strap chain to a save-all? (V)","eg":"Save-alls at FO/DO/LO tank vents clean, plug fixed with a chain.","ex":"WHAT IS ASKED:\nSave-alls around fuel/diesel/lube tank vents, clean, with the plug tied by a chain.\n\nFINDING WHEN:\n• Missing or dirty\n\nWHAT THE INSPECTOR DOES:\n• Visual check","fg":"Malinis ang save-alls sa vents ng FO/DO/LO tanks, nakakadena ang plug.","fc":["May save-alls sa lahat ng fuel/lube tank vents, malinis at walang laman","Drain plug naka-secure ng kadena"],"fx":"ANO ANG HINIHINGI:\nMay save-alls sa paligid ng vents ng fuel/diesel/lube tanks, malinis, at nakakadena ang plug.\n\nKAILAN MAY FINDING:\n• Wala o marumi\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check"},{"id":"7A.5","s":"7A","sn":"Fuel Management (Oil)","a":"ER","h":1,"c":["Bunker analysis (e.g. VPS/DNV) for each stem","LO analysis ME/AE/stern tube at maker's intervals; hydraulic oil (hatch, cranes, steering)","Actions taken on recommendations (Finding if ignored)"],"o":"Are there procedures for the analysis of fuel, lubricating and hydraulic oils, and are oil sampling requirements aligned with equipment manufacturer’s recommendations? (V & M)","eg":"FO/LO/hydraulic oil analysis per maker, action on results.","ex":"WHAT IS ASKED:\nProcedures for fuel, lube and hydraulic oil analysis, at maker's frequency.\n\nFINDING WHEN:\n• Maker's frequency not followed\n• No action on the recommendations\n\nWHAT THE INSPECTOR DOES:\n• Checks the latest results","fg":"FO/LO/hydraulic oil analysis ayon sa maker, may aksyon sa resulta.","fc":["Bunker analysis (hal. VPS/DNV) sa bawat stem","LO analysis ME/AE/stern tube sa interval ng maker; hydraulic oil (hatch, cranes, steering)","May aksyon sa recommendations (finding kung binalewala)"],"fx":"ANO ANG HINIHINGI:\nMay procedures para sa fuel, lube at hydraulic oil analysis, sa dalas ayon sa maker.\n\nKAILAN MAY FINDING:\n• Hindi sinusunod ang dalas ng maker\n• Walang aksyon sa recommendations\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang pinakabagong resulta"},{"id":"7A.7","s":"7A","sn":"Fuel Management (Oil)","a":"ER","h":1,"c":["Bunker plan & pre-bunkering checklist for last bunkering","Tank max 85–90%, sounding records, communication, SOPEP ready","Bunker Delivery Note & MARPOL sample retained"],"o":"Are bunkering and oil fuel transfer procedures carefully planned and executed in accordance with industry standards, are the details of the last operation in accordance with industry standards, is the vessel equipped with a procedure for sampling the oil fuel used on board, and are bunker samples stored in a sheltered location? (V)","eg":"Bunkering plan, checklist, pre-bunker meeting; last bunkering correct.","ex":"WHAT IS ASKED:\nBunkering and transfers planned and carried out to industry standards.\n\nFINDING WHEN:\n• Incomplete plan or checklist\n\nWHAT THE INSPECTOR DOES:\n• Checks the last bunkering","fg":"Bunkering plan, checklist, pre-bunker meeting; tama ang huling bunkering.","fc":["Bunker plan at pre-bunkering checklist ng huling bunkering","Tank max 85–90%, sounding records, komunikasyon, handa ang SOPEP","Itinago ang Bunker Delivery Note at MARPOL sample"],"fx":"ANO ANG HINIHINGI:\nAng bunkering at transfers ay planado at ginawa ayon sa industry standards.\n\nKAILAN MAY FINDING:\n• Kulang ang plan o checklist\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang huling bunkering"},{"id":"7A.9","s":"7A","sn":"Fuel Management (Oil)","a":"ER","h":0,"c":["Ship-specific changeover procedure & calculation","Changeover log: times, positions, tank volumes – matches deck log"],"o":"Are ship-specific procedures to control the change from residual to low-sulphur / distillate fuels and vice versa provided, and is the fuel oil change over logbook and data collection system being maintained correctly? (V & M)","eg":"Fuel changeover procedure & log for ECA.","ex":"WHAT IS ASKED:\nFuel changeover procedure for ECA and a correct changeover log.\n\nFINDING WHEN:\n• Missing or with errors\n\nWHAT THE INSPECTOR DOES:\n• Checks it\n\nREMEMBER:\n• MARPOL VI Reg 14","fg":"Fuel changeover procedure at log para sa ECA.","fc":["Ship-specific changeover procedure at calculation","Changeover log: oras, positions, tank volumes – tugma sa deck log"],"fx":"ANO ANG HINIHINGI:\nProcedure sa pagpapalit ng fuel para sa ECA at tamang changeover log.\n\nKAILAN MAY FINDING:\n• Wala o may mali\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check\n\nTANDAAN:\n• MARPOL VI Reg 14"},{"id":"7A.10","s":"7A","sn":"Fuel Management (Oil)","a":"ER","h":1,"c":["QCV test records (each valve) per PMS","Remote station marked & air/hydraulic system ready","Valves not wedged/blocked open"],"o":"Are the Quick Closing Valves serving fuel and lubricating oil systems being regularly tested and in good order? (V)","eg":"Quick closing valves tested and working.","ex":"WHAT IS ASKED:\nQuick closing valves tested and in good condition.\n\nFINDING WHEN:\n• No test or blocked\n\nWHAT THE INSPECTOR DOES:\n• Checks records","fg":"Nasubukan at gumagana ang quick closing valves.","fc":["QCV test records (bawat valve) ayon sa PMS","May marka ang remote station at handa ang air/hydraulic system","Hindi naka-wedge/naka-block na bukas ang valves"],"fx":"ANO ANG HINIHINGI:\nNasubukan at maayos ang quick closing valves.\n\nKAILAN MAY FINDING:\n• Walang test o naka-block\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang records"},{"id":"7A.11","s":"7A","sn":"Fuel Management (Oil)","a":"ER","h":0,"c":["Jacketed HP lines on ME/AE; leak tank alarms tested & recorded"],"o":"Are high pressure fuel delivery pipes of diesel engines protected with a jacketed piping and alarm system, and is the alarm system being tested regularly and in good order? (V)","eg":"High-pressure fuel pipes jacketed with a leak alarm that is tested.","ex":"WHAT IS ASKED:\nHP fuel pipes with jacket and a tested leak alarm.\n\nFINDING WHEN:\n• Alarm not working\n\nWHAT THE INSPECTOR DOES:\n• Checks it\n\nREMEMBER:\n• SOLAS II-2/4","fg":"Jacketed ang high-pressure fuel pipes na may leak alarm na sinusubukan.","fc":["Jacketed HP lines sa ME/AE; nasubukan at naka-record ang leak tank alarms"],"fx":"ANO ANG HINIHINGI:\nHP fuel pipes na may jacket at nasubukang leak alarm.\n\nKAILAN MAY FINDING:\n• Hindi gumagana ang alarm\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check\n\nTANDAAN:\n• SOLAS II-2/4"},{"id":"7A.12","s":"7A","sn":"Fuel Management (Oil)","a":"ER","h":1,"c":["Purifier room clean, no oil on floor, no leaks","Ventilation running; fire flaps; drip trays clean"],"o":"Are purifier rooms and fuel and lubricating oil handling areas ventilated, free of oil leaks and clean? (V)","eg":"Purifier room: clean, no leaks, ventilation, fire protection.","ex":"WHAT IS ASKED:\nPurifier room ventilated, clean, no leaks.\n\nFINDING WHEN:\n• Oil or leaks\n\nWHAT THE INSPECTOR DOES:\n• Visual check","fg":"Purifier room: malinis, walang leak, ventilation, fire protection.","fc":["Malinis ang purifier room, walang langis sa sahig, walang leak","Umaandar ang ventilation; fire flaps; malinis ang drip trays"],"fx":"ANO ANG HINIHINGI:\nMay hangin, malinis at walang leak ang purifier room.\n\nKAILAN MAY FINDING:\n• May langis o leak\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check"},{"id":"7A.13","s":"7A","sn":"Fuel Management (Oil)","a":"ER","h":0,"c":["Em'cy gen fuel tank level vs 18h consumption; gauge glass self-closing","Suitable fuel (MGO), not water-contaminated","📋 Inspector: Emergency generator: fuel for 18 hours, insulation readings, quick-closing valve on the tank"],"o":"Is the reserve fuel tank of the emergency generator filled with sufficient fuel of a suitable type for at least 18 hours operation? (V)","eg":"Emergency generator tank full for ≥18 hours.","ex":"WHAT IS ASKED:\nEmergency generator tank full for at least 18 hours.\n\nFINDING WHEN:\n• Low level\n\nWHAT THE INSPECTOR DOES:\n• Checks the level\n\nREMEMBER:\n• SOLAS II-1/43","fg":"Puno ang tank ng emergency generator para sa ≥18 oras.","fc":["Level ng em'cy gen fuel tank kumpara sa 18h na konsumo; self-closing ang gauge glass","Angkop na fuel (MGO), walang tubig","📋 Inspector: Emergency generator: fuel for 18 hours, insulation readings, quick-closing valve on the tank"],"fx":"ANO ANG HINIHINGI:\nPuno ang tank ng emergency generator para sa hindi bababa sa 18 oras.\n\nKAILAN MAY FINDING:\n• Mababa ang level\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang level\n\nTANDAAN:\n• SOLAS II-1/43"},{"id":"8A.2","s":"8A","sn":"Cargo – Solid Bulk other than Grain","a":"DOC","h":0,"c":["Shipper's cargo declaration (IMSBC 4.2) – BCSN, group, properties"],"o":"Has appropriate information about the cargo and its characteristics been provided to the Master prior to loading? (V)","eg":"Cargo information (IMSBC) from the shipper before loading.","ex":"WHAT IS ASKED:\nThe shipper has given cargo information before loading.\n\nFINDING WHEN:\n• Not given\n\nWHAT THE INSPECTOR DOES:\n• Checks it\n\nREMEMBER:\n• IMSBC 4.2","fg":"Cargo information (IMSBC) mula sa shipper bago magkarga.","fc":["Cargo declaration ng shipper (IMSBC 4.2) – BCSN, group, properties"],"fx":"ANO ANG HINIHINGI:\nNagbigay ang shipper ng cargo information bago magkarga.\n\nKAILAN MAY FINDING:\n• Hindi ibinigay\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check\n\nTANDAAN:\n• IMSBC 4.2"},{"id":"8A.3","s":"8A","sn":"Cargo – Solid Bulk other than Grain","a":"DOC","h":1,"c":["MC & TML certificate signed, ≤7 days sampling, for Group A cargoes","Angle of repose/density info","No cargo damage claims due to other reasons"],"o":"Has the Master been provided with a signed certificate or declaration, indicating the moisture content, Transportable Moisture Limit (TML), angle of repose and density, and was the cargo free of evident damage? (V & M)","eg":"MC/TML certificate, angle of repose, density – signed; no cargo damage.","ex":"WHAT IS ASKED:\nA signed certificate with MC, TML, angle of repose and density, and cargo without damage.\n\nFINDING WHEN:\n• Missing\n• Cargo damage from any cause other than hatch cover weathertightness\n\nWHAT THE INSPECTOR DOES:\n• Checks it\n\nREMEMBER:\n• IMSBC 4.3: sampling ≤7 days before loading","fg":"MC/TML certificate, angle of repose, density – may pirma; walang cargo damage.","fc":["MC at TML certificate may pirma, sampling ≤7 araw, para sa Group A cargoes","Angle of repose/density info","Walang cargo damage claim dahil sa ibang dahilan"],"fx":"ANO ANG HINIHINGI:\ er approved by Class and regular accuracy tests.\n\nFINDING WHEN:\n• No test\n\nWHAT THE INSPECTOR DOES:\n• Checks records","fg":"Class approved ang loading computer, regular ang test conditions (bawat 3 buwan / ayon sa SMS).","fc":["Class approval ng loading software (cert/version)","Periodic accuracy test kumpara sa approved test conditions – may records","Annual class verification"],"fx":"ANO ANG HINIHINGI:\nAprubado ng Class ang loading computer at may regular na accuracy test.\n\nKAILAN MAY FINDING:\n• Walang test\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang records","ff":["Hindi na-run ang loading computer test conditions sa takdang interval"]},{"id":"8A.7","s":"8A","sn":"Cargo – Solid Bulk other than Grain","a":"DOC","h":1,"c":["Loading plan with SF/BM at each step; actual readings during ops","Draft checks at intermediate steps vs computer","Ballast in sync with loading"],"o":"Are the stresses, stability information and any limitations included in the cargo plan understood by the cargo watch officers, and are conditions being monitored and maintained within design limits throughout the cargo operation? (V)","eg":"Stress & stability monitored through the loading, draft checks, ballast in sync.","ex":"WHAT IS ASKED:\nOfficers know the stresses and stability of the cargo plan and monitor them through the whole loading.\n\nFINDING WHEN:\n• No monitoring\n\nWHAT THE INSPECTOR DOES:\n• Checks cargo and ballast go together and draft checks are done in between\n\nREMEMBER:\n• Drafts must agree with the calculation","fg":"Binabantayan ang stress at stability sa buong loading, draft checks, sabay ang ballast.","fc":["Loading plan na may SF/BM sa bawat step; aktuwal na readings habang may ops","Draft checks sa intermediate steps kumpara sa computer","Sabay ang ballast sa loading"],"fx":"ANO ANG HINIHINGI:\nAlam ng officers ang stresses at stability ng cargo plan at binabantayan ito sa buong loading.\n\nKAILAN MAY FINDING:\n• Walang monitoring\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check kung sabay ang cargo at ballast at may draft checks sa gitna\n\nTANDAAN:\n• Dapat tugma ang drafts sa computation"},{"id":"8A.8","s":"8A","sn":"Cargo – Solid Bulk other than Grain","a":"DOC","h":0,"c":["Procedure for ballast hold use; blank flanges/bilge isolation"],"o":"Are there procedures in place for loading, ballasting and de-ballasting of the designated ballast holds? (V)","eg":"Procedure for ballast holds (filling/emptying/flooding).","ex":"WHAT IS ASKED:\nProcedures for ballast holds.\n\nFINDING WHEN:\n• Missing\n\nWHAT THE INSPECTOR DOES:\n• Checks them","fg":"Procedure para sa ballast holds (pagpuno/pag-ubos/flooding).","fc":["Procedure sa paggamit ng ballast hold; blank flanges/bilge isolation"],"fx":"ANO ANG HINIHINGI:\nMay procedures para sa ballast holds.\n\nKAILAN MAY FINDING:\n• Wala\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"8A.9","s":"8A","sn":"Cargo – Solid Bulk other than Grain","a":"HOLD","h":0,"c":["Hold cleaning procedure & records; washing water disposal recorded"],"o":"Are there guidelines and procedures for hold cleaning after completion of unloading? (V)","eg":"Hold cleaning instructions after discharge.","ex":"WHAT IS ASKED:\nInstructions for hold cleaning.\n\nFINDING WHEN:\n• Missing\n\nWHAT THE INSPECTOR DOES:\n• Checks them","fg":"Instructions sa hold cleaning pagkatapos mag-discharge.","fc":["Hold cleaning procedure at records; naka-record ang pagtapon ng washing water"],"fx":"ANO ANG HINIHINGI:\nMay instructions para sa hold cleaning.\n\nKAILAN MAY FINDING:\n• Wala\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"8A.10","s":"8A","sn":"Cargo – Solid Bulk other than Grain","a":"DOC","h":0,"c":["Know loading manual restrictions (BC-A/B/C, empty holds, max draft)","Inspector records them – be precise"],"o":"Is the vessel free of any limitations or restrictions specified in the Loading Manual or Trim and Stability Booklet? (V)","eg":"Know the loading manual restrictions (e.g. alternat  fumigation procedure; pamilyar ang Master/C/O"],"fx":"ANO ANG HINIHINGI:\nMay fumigation procedures, at alam ito ng Master/C/O.\n\nKAILAN MAY FINDING:\n• Hindi alam\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Nagtatanong\n\nTANDAAN:\n• MSC.1/Circ.1264"},{"id":"8B.16","s":"8B","sn":"Cargo – Bulk Grain","a":"DOC","h":0,"c":["Crew briefing records on phosphine hazards"],"o":"Is crew familiar with major problems associated with fumigation of cargo in stowage on board? (V)","eg":"Crew know the hazards of fumigation.","ex":"WHAT IS ASKED:\nCrew know the hazards of fumigation.\n\nFINDING WHEN:\n• Crew do not know\n\nWHAT THE INSPECTOR DOES:\n• Asks","fg":"Alam ng crew ang panganib ng fumigation.","fc":["Crew briefing records sa panganib ng phosphine"],"fx":"ANO ANG HINIHINGI:\nAlam ng crew ang panganib ng fumigation.\n\nKAILAN MAY FINDING:\n• Hindi alam\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Nagtatanong"},{"id":"8B.17","s":"8B","sn":"Cargo – Bulk Grain","a":"LSA","h":0,"c":["Phosphine detection tubes/meters (calibrated) + BA","First aid & MFAG; antidote info"],"o":"Do on-board safety requirements for fumigation comply with sub-section 3.3.2.7 of the IMO recommendation on the safe use of pesticides? (V)","eg":"Fumigation safety requirements (IMO MSC.1/Circ.1264) – gas detectors, BA, first aid.","ex":"WHAT IS ASKED:\nFumigation safety measures as per IMO recommendation 3.3.2.7.\n\nFINDING WHEN:\n• Instruments or equipment missing\n\nWHAT THE INSPECTOR DOES:\n• Checks them","fg":"Fumigation safety requirements (IMO MSC.1/Circ.1264) – gas detectors, BA, first aid.","fc":["Phosphine detection tubes/meters (calibrated) + BA","First aid at MFAG; antidote info"],"fx":"ANO ANG HINIHINGI:\nSafety measures sa fumigation ayon sa IMO recommendation 3.3.2.7.\n\nKAILAN MAY FINDING:\n• Kulang ang instruments o equipment\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"8B.18","s":"8B","sn":"Cargo – Bulk Grain","a":"DOC","h":0,"c":["Training of appointed persons; gas reading records"],"o": • Missing\n\nWHAT THE INSPECTOR DOES:\n• Visual check","fg":"Warning signs/marka sa pasukan ng fumigated spaces.","fc":["Warning signs sa hold access hatches at katabing spaces"],"fx":"ANO ANG HINIHINGI:\nMay signs para walang pumasok sa spaces na may fumigant.\n\nKAILAN MAY FINDING:\n• Wala\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check"},{"id":"8B.21","s":"8B","sn":"Cargo – Bulk Grain","a":"DOC","h":0,"c":["VSP signed by Master before sailing"],"o":"Has the Voyage Safety Plan (VSP), including the checklist for fumigation during the voyage, been discussed with and signed by the Master prior to sailing to the discharge port? (V)","eg":"Voyage Safety Plan & fumigation checklist signed.","ex":"WHAT IS ASKED:\nVoyage Safety Plan signed by the Master before sailing.\n\nFINDING WHEN:\n• Missing\n\nWHAT THE INSPECTOR DOES:\n• Checks it","fg":"May pirma ang Voyage Safety Plan at fumigation checklist.","fc":["VSP may pirma ng Master bago umalis"],"fx":"ANO ANG HINIHINGI:\nVoyage Safety Plan na may pirma ng Master bago umalis.\n\nKAILAN MAY FINDING:\n• Wala\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"8B.22","s":"8B","sn":"Cargo – Bulk Grain","a":"ACC","h":0,"c":["A/C on recirculation; ER intakes considered"],"o":"Have the air conditioning intakes for the accommodation, the engine room and other spaces been set to prevent the possibility of drawing in fumigant gas? (V)","eg":"A/C intakes set so they do not draw in fumigant.","ex":"WHAT IS ASKED:\nAir intakes set so they do not draw in fumigant.\n\nFINDING WHEN:\n• Not done\n\nWHAT THE INSPECTOR DOES:\n• Checks it","fg":"Naka-set ang A/C intakes para hindi humigop ng fumigant.","fc":["A/C naka-recirculation; isinaalang-alang ang ER intakes"],"fx":"ANO ANG HINIHINGI:\nNaka-set ang air intakes para hindi humigop ng fumigant.\n\nKAILAN MAY FINDING:\n• Hindi\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"8B.23","s":"8B","sn":"Cargo – Bulk Grain","a":"DOC","h":0,"c":["Emergency entry procedure with BA & gas test"],"o":"Are procedures in place for entering any cargo holds sealed for fumigation in transit? (V)","eg":"Procedure for entering sealed fumigated holds.","ex":"WHAT IS ASKED:\nProcedure for entering sealed holds.\n\nFINDING WHEN:\n• Missing\n\nWHAT THE INSPECTOR DOES:\n• Checks it","fg":"Procedure sa pagpasok sa sealed fumigated holds.","fc":["Emergency entry procedure na may BA at gas test"],"fx":"ANO ANG HINIHINGI:\nProcedure sa pagpasok sa sealed holds.\n\nKAILAN MAY FINDING:\n• Wala\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"8B.24","s":"8B","sn":"Cargo – Bulk Grain","a":"DOC","h":0,"c":["Notification message on file (≥24h before arrival)"],"o":"Has the Master informed the appropriate authorities of the country of destination about the fumigation? (V)","eg":"Notification to destination authorities about fumigation.","ex":"WHAT IS ASKED:\nNotice to the destination authorities about the fumigation.\n\nFINDING WHEN:\n• Not done\n\nWHAT THE INSPECTOR DOES:\n• Checks it","fg":"Abiso sa awtoridad ng destinasyon tungkol sa fumigation.","fc":["Naka-file ang notification message (≥24h bago dumating)"],"fx":"ANO ANG HINIHINGI:\nAbiso sa awtoridad ng destinasyon tungkol sa fumigation.\n\nKAILAN MAY FINDING:\n• Hindi nagawa\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"8B.25","s":"8B","sn":"Cargo – Bulk Grain","a":"DOC","h":0,"c":["Gas-free cert or ventilation & monitoring records"],"o":"Did the vessel receive a fumigant gas-free certificate issued by the fumigator-in-charge at or prior to the discharge port or, in the absence of a gas-free certificate did the Master implement appropriate safety measures to manage potential residual fumigant risks before and during discharge operations? (V)","eg":"Gas-free certificate or safety measures at the discharge port.","ex":"WHAT IS ASKED:\nGas-free certificate at the discharge port, or safety measures.\n\nFINDING WHEN:\n• Nothing at all\n\nWHAT THE INSPECTOR DOES:\n• Checks it","fg":"Gas-free certificate o safety measures sa discharge port.","fc":["Gas-free cert o ventilation at monitoring records"],"fx":"ANO ANG HINIHINGI:\nGas-free certificate sa discharge port o safety measures.\n\nKAILAN MAY FINDING:\n• Walang kahit ano\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"8B.26","s":"8B","sn":"Cargo – Bulk Grain","a":"DOC","h":0,"c":["Gas readings log during voyage"],"o":"Are records maintained of fumigation operations? (V)","eg":"Records of fumigation operations.","ex":"WHAT IS ASKED:\nFumigation records.\n\nFINDING WHEN:\n• Missing\n\nWHAT THE INSPECTOR DOES:\n• Checks them","fg":"Records ng fumigation operations.","fc":["Gas readings log habang naglalayag"],"fx":"ANO ANG HINIHINGI:\nRecords ng fumigation.\n\nKAILAN MAY FINDING:\n• Wala\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"8B.27","s":"8B","sn":"Cargo – Bulk Grain","a":"HOLD","h":0,"c":["Hygrometer/psychrometer + spare, calibration records"],"o":"Are necessary instruments (with spare) to determine the dew point provided, maintained in good condition and are there records of the calibration of such instruments? (V)","eg":"Dew point instruments (with spare) calibrated.","ex":"WHAT IS ASKED:\nDew point instruments with spare, calibrated.\n\nFINDING WHEN:\n• Missing\n\nWHAT THE INSPECTOR DOES:\n• Checks them","fg":"Calibrated ang dew point instruments (may spare).","fc":["Hygrometer/psychrometer + spare, calibration records"],"fx":"ANO ANG HINIHINGI:\nDew point instruments na may spare, calibrated.\n\nKAILAN MAY FINDING:\n• Wala\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"8B.29","s":"8B","sn":"Cargo – Bulk Grain","a":"DOC","h":0,"c":["Ventilation log with dew point readings"],"o":"Is ventilation of cargo holds, where required, being carried out and recorded? (V)","eg":"Hold ventilation recorded (dew point rule).","ex":"WHAT IS ASKED:\nHold ventilation, where needed, with records.\n\nFINDING WHEN:\n• No records\n\nWHAT THE INSPECTOR DOES:\n• Checks them","fg":"Naka-record ang hold ventilation (dew point rule).","fc":["Ventilation log na may dew point readings"],"fx":"ANO ANG HINIHINGI:\nHold ventilation, kung kailangan, may records.\n\nKAILAN MAY FINDING:\n• Walang records\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"8B.30","s":"8B","sn":"Cargo – Bulk Grain","a":"DOC","h":1,"c":["Grain heeling moments with correct SF & full volumes; partly-filled holds treated","Criteria met: angle of heel ≤12°, residual dynamic stability, GM"],"o":"Is there evidence of a satisfactory grain stability calculation for the last voyage? (M)","eg":"Grain stability calculation of the last voyage satisfactory.","ex":"WHAT IS ASKED:\nA satisfactory grain stability calculation for the last voyage.\n\nFINDING WHEN:\n• Wrong calculation\n\nWHAT THE INSPECTOR DOES:\n• Checks stowage factor, hold volumes, partly filled holds\n\nREMEMBER:\n• Grain Code: heel ≤12°","fg":"Maayos ang grain stability calculation ng huling voyage.","fc":["Grain heeling moments na may tamang SF at full volumes; tamang trato sa partly-filled holds","Pasado ang criteria: angle of heel ≤12°, residual dynamic stability, GM"],"fx":"ANO ANG HINIHINGI:\nMaayos ang grain stability calculation para sa huling voyage.\n\nKAILAN MAY FINDING:\n• Mali ang computation\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang stowage factor, volume ng holds, partly filled\n\nTANDAAN:\n• Grain Code: heel ≤12°"},{"id":"8B.31","s":"8B","sn":"Cargo – Bulk Grain","a":"DOC","h":0,"c":["As 8A.14"],"o":"Has a cargo loading/unloading plan providing detailed sequences of cargo and ballast transfer been prepared, understood, and signed off by the Master and deck officers? (V)","eg":"Loading/unloading plan signed.","ex":"WHAT IS ASKED:\nLoading plan signed.\n\nFINDING WHEN:\n• Missing\n\nWHAT THE INSPECTOR DOES:\n• Checks it","fg":"May pirma ang loading/unloading plan.","fc":["Gaya ng 8A.14"],"fx":"ANO ANG HINIHINGI:\nMay pirma ang loading plan.\n\nKAILAN MAY FINDING:\n• Wala\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"8B.32","s":"8B","sn":"Cargo – Bulk Grain","a":"HOLD","h":1,"c":["Bilge wells clean & covered with burlap/cement-sealed","Hold openings grain tight"],"o":"Are the hold bilges cleaned prior to loading and have all hold openings been made grain tight? (V)","eg":"Bilges clean, bilge covers grain-tight (burlap), all openings grain-tight.","ex":"WHAT IS ASKED:\nBilges clean and all openings grain-tight.\n\nFINDING WHEN:\n• Dirty or open\n\nWHAT THE INSPECTOR DOES:\n• Checks them","fg":"Malinis ang bilges, grain-tight ang bilge covers (burlap), grain-tight lahat ng openings.","fc":["Malinis ang bilge wells at natakpan ng burlap/cement-sealed","Grain tight ang hold openings"],"fx":"ANO ANG HINIHINGI:\nMalinis ang bilges at grain-tight lahat ng openings.\n\nKAILAN MAY FINDING:\n• Marumi o bukas\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"8B.33","s":"8B","sn":"Cargo – Bulk Grain","a":"HOLD","h":0,"c":["Isolation records of hold lights (fire risk with grain dust)"],"o":"Do records on board verify that cargo lights in holds, where fitted, were properly isolated before cargo was loaded? (V)","eg":"Cargo hold lights isolated before loading – records.","ex":"WHAT IS ASKED:\nRecords that hold lights were isolated before loading.\n\nFINDING WHEN:\n• Missing\n\nWHAT THE INSPECTOR DOES:\n• Writes the safety measures in the comments","fg":"Naka-isolate ang cargo hold lights bago magkarga – may records.","fc":["Isolation records ng hold lights (panganib ng sunog sa grain dust)"],"fx":"ANO ANG HINIHINGI:\nRecords na na-isolate ang ilaw ng holds bago magkarga.\n\nKAILAN MAY FINDING:\n• Wala\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Isinusulat sa comments ang safety measures"},{"id":"8B.34","s":"8B","sn":"Cargo – Bulk Grain","a":"DOC","h":0,"c":["As 8A.15"],"o":"Is an adequate record of all cargo operation activities maintained during loading and unloading? (V)","eg":"Cargo log.","ex":"WHAT IS ASKED:\nRecords of cargo operations.\n\nFINDING WHEN:\n• Incomplete\n\nWHAT THE INSPECTOR DOES:\n• Checks them","fg":"Cargo log.","fc":["Gaya ng 8A.15"],"fx":"ANO ANG HINIHINGI:\nRecords ng cargo operations.\n\nKAILAN MAY FINDING:\n• Kulang\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"8B.35","s":"8B","sn":"Cargo – Bulk Grain","a":"LSA","h":0,"c":["As 8A.17"],"o":"Are the dangers associated with oxygen depletion of grain cargo understood by officers and crew, and have reasonable precautions been taken during routine inspections of the cargo, when entering the holds and adjacent spaces? (V)","eg":"Grain O2 depletion: precautions for hold entry.","ex":"WHAT IS ASKED:\nKnowledge of the risk of O2 depletion with grain.\n\nFINDING WHEN:\n• Crew do not know\n\nWHAT THE INSPECTOR DOES:\n• Asks","fg":"O2 depletion sa grain: pag-iingat sa pagpasok sa hold.","fc":["Gaya ng 8A.17"],"fx":"ANO ANG HINIHINGI:\nKaalaman sa panganib ng kulang na O2 sa grain.\n\nKAILAN MAY FINDING:\n• Hindi alam\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Nagtatanong"},{"id":"9A.1","s":"9A","sn":"Hatch Cover and Lifting Appliances","a":"HOLD","h":1,"c":["Inspect hold walls, frames, hoppers & underside of covers for loose scale","Chip/sweep loose scale before inspection if time permits"],"o":"Are the cargo holds, including the underside of hatch covers, free of loose rust scale and paint flakes? (V)","f":["Loose scale and paint flakes in holds and hatch cover underside"],"eg":"Holds and hatch cover undersides without loose rust scale & paint flakes.","ex":"WHAT IS ASKED:\nHolds and hatch cover undersides without loose rust and flaking paint.\n\nFINDING WHEN:\n• They exist\n\nWHAT THE INSPECTOR DOES:\n• Visual check","fg":"Holds at ilalim ng hatch covers na walang maluwag na kalawang at natuklap na pintura.","fc":["I-inspect ang hold walls, frames, hoppers at ilalim ng covers para sa maluwag na kalawang","Tuktukin/walisin ang maluwag na kalawang bago ang inspection kung may oras"],"fx":"ANO ANG HINIHINGI:\nHolds at ilalim ng hatch covers na walang maluwag na kalawang at natuklap na pintura.\n\nKAILAN MAY FINDING:\n• Meron\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check","ff":["Maluwag na kalawang at natuklap na pintura sa holds at ilalim ng hatch cover"]},{"id":"9A.2","s":"9A","sn":"Hatch Cover and Lifting Appliances","a":"HOLD","h":0,"c":["Hatch cover manual & procedure; training certificate (maker/company) Master & C/O","📋 Inspector: Hatch cover clearance measurements every 6 months, recorded"],"o":"Is there a procedure in place for the safe operation and inspection of hatch covers and, has the Master/Chief Officer received appropriate training in hatch cover inspection and maintenance?","f":["Hatch cover component clearances not measured every 6 months / spare parts list missing"],"eg":"Procedure for operating/inspecting hatch covers; Master/C/O training.","ex":"WHAT IS ASKED:\nA procedure for operating and inspecting hatch covers, training of Master/C/O.\n\nFINDING WHEN:\n• No training\n\nWHAT THE INSPECTOR DOES:\n• Checks it","fg":"Procedure sa pag-operate/pag-inspect ng hatch covers; training ng Master/C/O.","fc":["Hatch cover manual at procedure; training certificate (maker/company) ng Master at C/O","📋 Inspector: Hatch cover clearance measurements every 6 months, recorded"],"fx":"ANO ANG HINIHINGI:\nMay procedure sa pag-operate at pag-inspect ng hatch covers, training ng Master/C/O.\n\nKAILAN MAY FINDING:\n• Walang training\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check","ff":["Hindi nasusukat bawat 6 buwan ang clearances ng hatch cover components / walang spare parts list"]},{"id":"9A.3","s":"9A","sn":"Hatch Cover and Lifting Appliances","a":"HOLD","h":1,"c":["Hose test / UT records (with photos) per SMS interval","Leaks rectified & retested"],"o":"Are adequate procedures in place for carrying out hose and / or ultrasonic testing of hatch covers and is documented evidence of such testing available? (V)","f":["Hose / UT test of hatch covers not done or not recorded before last cargo"],"eg":"Hose/ultrasonic tests of hatch covers with evidence.","ex":"WHAT IS ASKED:\nProcedures for hose or ultrasonic test, with evidence.\n\nFINDING WHEN:\n• No records\n\nWHAT THE INSPECTOR DOES:\n• Checks them","fg":"Hose/ultrasonic tests ng hatch covers na may patunay.","fc":["Hose test / UT records (may picture) ayon sa SMS interval","Inayos at sinubukan ulit ang leaks"],"fx":"ANO ANG HINIHINGI:\nMay procedures para sa hose o ultrasonic test, may patunay.\n\nKAILAN MAY FINDING:\n• Walang records\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check","ff":["Hindi nagawa o hindi naka-record ang hose / UT test ng hatch covers bago ang huling cargo"]},{"id":"9A.4","s":"9A","sn":"Hatch Cover and Lifting Appliances","a":"HOLD","h":1,"c":["Compression bars straight, not wasted, free of paint/scale","Channels clean of cargo residue"],"o":"Are the compression bars and the coaming tops’ water channels clean, free of corrosion and maintained in good condition? (V)","f":["Compression bars bent, corroded / water channels not clean"],"eg":"Compression bars & water channels clean, without corrosion.","ex":"WHAT IS ASKED:\nCompression bars and coaming water channels clean and without corrosion.\n\nFINDING WHEN:\n• Corrosion\n\nWHAT THE INSPECTOR DOES:\n• Visual check","fg":"Malinis at walang kalawang ang compression bars at water channels.","fc":["Tuwid at hindi bulok ang compression bars, walang pintura/kalawang","Malinis ang channels, walang cargo residue"],"fx":"ANO ANG HINIHINGI:\nMalinis at walang kalawang ang compression bars at water channels ng coaming.\n\nKAILAN MAY FINDING:\n• May kalawang\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check","ff":["Baluktot o kalawangin ang compression bars / hindi malinis ang water channels"]},{"id":"9A.5","s":"9A","sn":"Hatch Cover and Lifting Appliances","a":"HOLD","h":1,"c":["Coaming drains clear; non-return balls/flaps present & free","No vertical rust staining inside coaming (sign of leakage)"],"o":"Are the drain holes of coamings clean, the inboard coamings faces free from any vertical rust staining and are the non-return valves in good condition? (V)","f":["Drain channels blocked, non-return valves missing","Rust streaks inside coaming indicating leakage"],"eg":"Drain holes clear, non-return valves OK, no rust streaks inside the coaming.","ex":"WHAT IS ASKED:\nDrain holes clear, non-return valves in good condition, no vertical rust streaks inside the coaming.\n\nFINDING WHEN:\n• Signs of leakage\n\nWHAT THE INSPECTOR DOES:\n• Visual check","fg":"Malinis ang drain holes, OK ang non-return valves, walang bakas ng kalawang sa loob ng coaming.","fc":["Malinis ang coaming drains; may non-return balls/flaps at malayang gumagalaw","Walang patayong mantsa ng kalawang sa loob ng coaming (palatandaan ng leak)"],"fx":"ANO ANG HINIHINGI:\nMalinis ang drain holes, maayos ang non-return valves, walang patayong bakas ng kalawang sa loob ng coaming.\n\nKAILAN MAY FINDING:\n• May bakas ng leak\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check","ff":["Barado ang drain channels, walang non-return valves","Bakas ng kalawang sa loob ng coaming na palatandaan ng leak"]},{"id":"9A.6","s":"9A","sn":"Hatch Cover and Lifting Appliances","a":"HOLD","h":1,"c":["All cleats present & working; rubber washers flexible, not painted/cracked","Cleat adjustment nuts correct"],"o":"Are quick-acting cleats and crutches all in place and in good working condition with the rubber washers flexible and free from paint and cracks? (V)","f":["Quick-acting cleats missing, seized, painted / washers hardened"],"eg":"Quick-acting cleats all in place, washers flexible, unpainted.","ex":"WHAT IS ASKED:\nAll cleats in place, with flexible washers and no paint.\n\nFINDING WHEN:\n• Missing or defective\n\nWHAT THE INSPECTOR DOES:\n• Visual check","fg":"Kumpleto ang quick-acting cleats, malambot ang washers, walang pintura.","fc":["Kumpleto at gumagana ang cleats; malambot ang rubber washers, walang pintura/bitak","Tama ang adjustment nuts ng cleats"],"fx":"ANO ANG HINIHINGI:\nKumpleto ang cleats, may malambot na washers na walang pintura.\n\nKAILAN MAY FINDING:\n• Kulang o sira\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check","ff":["Kulang, naninigas o may pintura ang quick-acting cleats / tumigas ang washers"]},{"id":"9A.7","s":"9A","sn":"Hatch Cover and Lifting Appliances","a":"HOLD","h":0,"c":["Check coaming tops for wear/grooves"],"o":"If the hatch panel side and end plates are in steel-to-steel contact with the coaming tops when closed, are the coaming tops free from grooving or wear? (V)","eg":"Steel-to-steel contact: coaming tops without grooving/wear.","ex":"WHAT IS ASKED:\nSteel-to-steel: coaming tops without wear.\n\nFINDING WHEN:\n• Wear\n\nWHAT THE INSPECTOR DOES:\n• Visual check","fg":"Steel-to-steel contact: walang uka/pagkasira ang coaming tops.","fc":["I-check ang coaming tops para sa pagkasira/uka"],"fx":"ANO ANG HINIHINGI:\nSteel-to-steel: walang pagkasira ang coaming tops.\n\nKAILAN MAY FINDING:\n• May pagkasira\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check"},{"id":"9A.8","s":"9A","sn":"Hatch Cover and Lifting Appliances","a":"HOLD","h":0,"c":["Bearing pads intact, not worn/missing"],"o":"If the hatch covers are supported by bearing pads, are they free from wear or damage? (V)","eg":"Bearing pads without wear.","ex":"WHAT IS ASKED:\nBearing pads without wear.\n\nFINDING WHEN:\n• Wear\n\nWHAT THE INSPECTOR DOES:\n• Visual check","fg":"Bearing pads na walang pagkasira.","fc":["Buo ang bearing pads, hindi sira/kulang"],"fx":"ANO ANG HINIHINGI:\nBearing pads na walang pagkasira.\n\nKAILAN MAY FINDING:\n• May pagkasira\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check"},{"id":"9A.9","s":"9A","sn":"Hatch Cover and Lifting Appliances","a":"HOLD","h":1,"c":["Rubber packing: no tears, permanent set >50%, hardening or paint","Joints in packing butted, no gaps"],"o":"Are the side and cross-joint rubber seals in good condition? (V)","f":["Rubber packing with permanent set, torn or painted / not contacting compression bar"],"eg":"Side & cross-joint rubber seals: no permanent set, tears or paint.","ex":"WHAT IS ASKED:\nSealing rubbers in good condition.\n\nFINDING WHEN:\n• Torn, hard or painted\n\nWHAT THE INSPECTOR DOES:\n• Visual check","fg":"Side at cross-joint rubber seals: walang permanent set, punit o pintura.","fc":["Rubber packing: walang punit, permanent set >50%, pagtigas o pintura","Magkadikit ang dugtungan ng packing, walang puwang"],"fx":"ANO ANG HINIHINGI:\nMaayos ang rubber seals.\n\nKAILAN MAY FINDING:\n• Punit, matigas o may pintura\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check","ff":["Rubber packing na may permanent set, punit o may pintura / hindi dumidikit sa compression bar"]},{"id":"9A.10","s":"9A","sn":"Hatch Cover and Lifting Appliances","a":"HOLD","h":0,"c":["Panels close evenly; no misalignment at cross joints"],"o":"Are hatch cover panels free of misalignment? (V)","eg":"Panels aligned.","ex":"WHAT IS ASKED:\nPanels without misalignment.\n\nFINDING WHEN:\n• Misalignment\n\nWHAT THE INSPECTOR DOES:\n• Visual check","fg":"Pantay ang pagkakahanay ng panels.","fc":["Pantay ang pagsara ng panels; walang misalignment sa cross joints"],"fx":"ANO ANG HINIHINGI:\nPanels na walang misalignment.\n\nKAILAN MAY FINDING:\n• May misalignment\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check"},{"id":"9A.11","s":"9A","sn":"Hatch Cover and Lifting Appliances","a":"HOLD","h":0,"c":["Channels intact, no wastage behind rubber"],"o":"Are seal retaining channels in good condition and free of corrosion? (V)","eg":"Seal retaining channels without corrosion.","ex":"WHAT IS ASKED:\nSeal retaining channels without corrosion.\n\nFINDING WHEN:\n• Corrosion\n\nWHAT THE INSPECTOR DOES:\n• Visual check","fg":"Seal retaining channels na walang kalawang.","fc":["Buo ang channels, walang pagkabulok sa likod ng goma"],"fx":"ANO ANG HINIHINGI:\nSeal retaining channels na walang kalawang.\n\nKAILAN MAY FINDING:\n• May kalawang\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check"},{"id":"9A.12","s":"9A","sn":"Hatch Cover and Lifting Appliances","a":"HOLD","h":0,"c":["Check cross-joints straight & intact"],"o":"Are the cross-joint seal retaining channels and the cross-joint compression bar straight, free of corrosion and damage, and are the channel supports and brackets in good condition? (V)","eg":"Cross-joint channels & compression bar straight, brackets OK.","ex":"WHAT IS ASKED:\nCross-joint channels and compression bar straight, without damage.\n\nFINDING WHEN:\n• Damage\n\nWHAT THE INSPECTOR DOES:\n• Visual check","fg":"Tuwid ang cross-joint channels at compression bar, OK ang brackets.","fc":["I-check na tuwid at buo ang cross-joints"],"fx":"ANO ANG HINIHINGI:\nTuwid at walang sira ang cross-joint channels at compression bar.\n\nKAILAN MAY FINDING:\n• May sira\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check"},{"id":"9A.13","s":"9A","sn":"Hatch Cover and Lifting Appliances","a":"HOLD","h":1,"c":["Wheels/bearings free; trackways clean","Hydraulic hoses: no leaks, in date; protective wrapping may be removed at random by inspector","Chains, link pins, safety pins, cylinders, securing devices","Operate one hatch cover in front of you"],"o":"Are the following parts of the hatch covers, where applicable, all in good order and do they appear to be well maintained? (V) > Wheels/bearings or trackway > Hydraulic system including hoses > Chains > Link pin and safety pin > Cargo holds’ ventilator on the side and end of hatch panel","f":["Hydraulic leaks at hatch cover cylinders and pipes","Wheels, chains, pins worn or not greased"],"eg":"Wheels, tracks, hydraulics & hoses, chains, pins, cylinders, stoppers in good condition.","ex":"WHAT IS ASKED:\nWheels, tracks, hydraulics, chains, pins in good condition.\n\nFINDING WHEN:\n• Leaks or wear\n\nWHAT THE INSPECTOR DOES:\n• With Master's agreement, asks to remove the wrapping from random hydraulic hoses","fg":"Maayos ang wheels, tracks, hydraulics at hoses, chains, pins, cylinders, stoppers.","fc":["Malayang umiikot ang wheels/bearings; malinis ang trackways","Hydraulic hoses: walang leak, hindi expired; puwedeng tanggalin ng inspector ang protective wrapping nang random","Chains, link pins, safety pins, cylinders, securing devices","Mag-operate ng isang hatch cover sa harap mo"],"fx":"ANO ANG HINIHINGI:\nMaayos ang wheels, tracks, hydraulics, chains, pins.\n\nKAILAN MAY FINDING:\n• May leak o pagkasira\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Kung payag ang Master, ipinatatanggal ang wrapping ng random na hydraulic hoses","ff":["Hydraulic leaks sa hatch cover cylinders at pipes","Sira o walang grasa ang wheels, chains, pins"]},{"id":"9A.14","s":"9A","sn":"Hatch Cover and Lifting Appliances","a":"HOLD","h":0,"c":["Wedges present & engage"],"o":"Are cross-joint wedges and their wedge bridge (where fitted) in place, operational and effective? (V)","eg":"Cross-joint wedges in place, working.","ex":"WHAT IS ASKED:\nCross-joint wedges in place and working.\n\nFINDING WHEN:\n• Missing\n\nWHAT THE INSPECTOR DOES:\n• Visual check","fg":"Nasa lugar at gumagana ang cross-joint wedges.","fc":["Kumpleto ang wedges at kumakapit"],"fx":"ANO ANG HINIHINGI:\nNasa lugar at gumagana ang cross-joint wedges.\n\nKAILAN MAY FINDING:\n• Kulang\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Visual na check"},{"id":"9A.15","s":"9A","sn":"Hatch Cover and Lifting Appliances","a":"HOLD","h":0,"c":["Oil analysis report & actions"],"o":"If hatch covers are hydraulically operated, has the hydraulic oil been tested regularly for contamination and deterioration? (V & M)","eg":"Hatch cover hydraulic oil analysed regularly.","ex":"WHAT IS ASKED:\nHydraulic oil analysis.\n\nFINDING WHEN:\n• No analysis\n\nWHAT THE INSPECTOR DOES:\n• Checks it","fg":"Regular na na-a-analyse ang hydraulic oil ng hatch covers.","fc":["Oil analysis report at aksyon"],"fx":"ANO ANG HINIHINGI:\nAnalysis ng hydraulic oil.\n\nKAILAN MAY FINDING:\n• Walang analysis\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"9A.16","s":"9A","sn":"Hatch Cover and Lifting Appliances","a":"HOLD","h":0,"c":["Emergency operation procedure posted at control stand; drill/training record"],"o":"Are officers familiar with emergency hatch cover operation arrangements and is there evidence of effective training of personnel available on board? (V)","f":["Officers unfamiliar with emergency opening/closing of hatch covers"],"eg":"Emergency hatch cover operation: officers know it, training.","ex":"WHAT IS ASKED:\nOfficers know the emergency operation of the hatch covers.\n\nFINDING WHEN:\n• Officers do not know\n\nWHAT THE INSPECTOR DOES:\n• Asks","fg":"Emergency operation ng hatch cover: alam ng officers, may training.","fc":["Nakapaskil sa control stand ang emergency operation procedure; drill/training record"],"fx":"ANO ANG HINIHINGI:\nAlam ng officers ang emergency operation ng hatch covers.\n\nKAILAN MAY FINDING:\n• Hindi alam\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Nagtatanong","ff":["Hindi alam ng officers ang emergency opening/closing ng hatch covers"]},{"id":"9A.17","s":"9A","sn":"Hatch Cover and Lifting Appliances","a":"HOLD","h":1,"c":["Cargo Gear Register (ILO 152) with annual exam & 5-yr load test entries","Certificates for cranes, grabs, hooks"],"o":"Has a thorough examination and load test of lifting appliances been carried out and is the record of the test and examination being maintained properly? (V & M)","f":["Annual thorough examination / 5-yearly load test overdue in Register of Lifting Appliances"],"eg":"Annual thorough examination & 5-yearly load test of cranes – Register of Lifting Appliances.","ex":"WHAT IS ASKED:\nThorough examination and load test of lifting appliances, with records.\n\nFINDING WHEN:\n• Missing\n\nWHAT THE INSPECTOR DOES:\n• Checks the Register\n\nREMEMBER:\n• ILO C152: annual exam, load test every 5 years","fg":"Annual thorough examination at 5-yearly load test ng cranes – Register of Lifting Appliances.","fc":["Cargo Gear Register (ILO 152) na may entries ng annual exam at 5-yr load test","Certificates ng cranes, grabs, hooks"],"fx":"ANO ANG HINIHINGI:\nThorough examination at load test ng lifting appliances, may records.\n\nKAILAN MAY FINDING:\n• Wala\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check ang Register\n\nTANDAAN:\n• ILO C152: taon-taong exam, load test bawat 5 taon","ff":["Overdue ang annual thorough examination / 5-yearly load test sa Register of Lifting Appliances"]},{"id":"9A.18","s":"9A","sn":"Hatch Cover and Lifting Appliances","a":"HOLD","h":1,"c":["Wire certificates; inspection & lubrication records per PMS","No broken wires/kinks/corrosion; end terminations"],"o":"Are the hoist and luffing wires of cranes, where fitted, reported in good order and is there recorded evidence of regular inspection and maintenance? (V)","f":["Wire certificates missing / wires dry or with broken strands"],"eg":"Hoist & luffing wires: certificates, inspection/lubrication records.","ex":"WHAT IS ASKED:\nCrane wires in good condition, with records.\n\nFINDING WHEN:\n• Poor condition\n\nWHAT THE INSPECTOR DOES:\n• Checks them","fg":"Hoist at luffing wires: certificates, inspection/lubrication records.","fc":["Wire certificates; inspection at lubrication records ayon sa PMS","Walang putol na hibla/kink/kalawang; end terminations"],"fx":"ANO ANG HINIHINGI:\nMaayos ang wires ng cranes, may records.\n\nKAILAN MAY FINDING:\n• Hindi maayos\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check","ff":["Walang wire certificates / tuyo ang wires o may putol na hibla"]},{"id":"9A.19","s":"9A","sn":"Hatch Cover and Lifting Appliances","a":"HOLD","h":1,"c":["Pedestal, jib, foundation no cracks/corrosion","Slewing bearing rocking test ≤6 months (Finding if not)","Bolts all present"],"o":"Are the main structures, foundation structures and mountings of the cargo cranes free of apparent defect or damage? (V)","f":["Crane rocking test not done every 6 months / not compared with maker limits"],"eg":"Crane structures/foundations without damage, rocking test every 6 months.","ex":"WHAT IS ASKED:\nCrane structure and foundations without damage.\n\nFINDING WHEN:\n• Rocking test not done at least every 6 months\n\nWHAT THE INSPECTOR DOES:\n• Checks it","fg":"Walang sira ang crane structures/foundations, rocking test bawat 6 buwan.","fc":["Pedestal, jib, foundation walang bitak/kalawang","Slewing bearing rocking test ≤6 buwan (finding kung wala)","Kumpleto ang bolts"],"fx":"ANO ANG HINIHINGI:\nWalang sira ang structure at foundation ng cranes.\n\nKAILAN MAY FINDING:\n• Hindi nagawa ang rocking test kahit bawat 6 buwan\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check","ff":["Hindi ginagawa ang crane rocking test bawat 6 buwan / hindi ikinukumpara sa limits ng maker"]},{"id":"9A.20","s":"9A","sn":"Hatch Cover and Lifting Appliances","a":"HOLD","h":1,"c":["Limit switches (hoist, luff, slew) & overload work; emergency stop","Cab clean, windows/wipers, controls marked; electrical cabinets closed & clean","SWL marked on jib"],"o":"Is the cargo crane’s machinery and operator’s cab, including the operator’s cab controls, in good working order and inspected, tested, and maintained in accordance with manufacturer’s recommendations?","f":["Limit switch or emergency stop not working","Cab dirty, wiper defective, no extinguisher"],"eg":"Crane machinery & cab: limit switches, emergency stop, controls, cleanliness.","ex":"WHAT IS ASKED:\nCrane machinery and cab in good condition, with tests per maker.\n\nFINDING WHEN:\n• Defective limit switches or controls\n\nWHAT THE INSPECTOR DOES:\n• Also checks the electrical cabinets","fg":"Crane machinery at cab: limit switches, emergency stop, controls, kalinisan.","fc":["Gumagana ang limit switches (hoist, luff, slew) at overload; emergency stop","Malinis ang cab, bintana/wipers, may marka ang controls; sarado at malinis ang electrical cabinets","May markang SWL sa jib"],"fx":"ANO ANG HINIHINGI:\nMaayos ang machinery at cab ng cranes, may tests ayon sa maker.\n\nKAILAN MAY FINDING:\n• Sira ang limit switches o controls\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check din ang electrical cabinets","ff":["Hindi gumagana ang limit switch o emergency stop","Marumi ang cab, sira ang wiper, walang extinguisher"]},{"id":"9A.21","s":"9A","sn":"Hatch Cover and Lifting Appliances","a":"HOLD","h":0,"c":["Grab maintenance in PMS; certificates; wires"],"o":"Are the ship’s grabs being maintained as per manufacturer recommendations and have the maintenance requirements been incorporated in the PMS? (V)","eg":"Grabs maintained per maker, in the PMS.","ex":"WHAT IS ASKED:\nGrabs maintained per maker, in the PMS.\n\nFINDING WHEN:\n• Not in the PMS\n\nWHAT THE INSPECTOR DOES:\n• Checks it","fg":"Naaalagaan ang grabs ayon sa maker, nasa PMS.","fc":["Grab maintenance nasa PMS; certificates; wires"],"fx":"ANO ANG HINIHINGI:\nNaaalagaan ang grabs ayon sa maker, nasa PMS.\n\nKAILAN MAY FINDING:\n• Wala sa PMS\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"9A.22","s":"9A","sn":"Hatch Cover and Lifting Appliances","a":"HOLD","h":0,"c":["Shackles, slings, hooks marked with ID & SWL, certificates match"],"o":"Are the loose gears of lifting appliances clearly marked and are the certificates of the loose gears available and traceable on board? (V)","eg":"Loose gear marked & certificates traceable.","ex":"WHAT IS ASKED:\nLoose gear marked, with matching certificates.\n\nFINDING WHEN:\n• No marking\n\nWHAT THE INSPECTOR DOES:\n• Checks it","fg":"May marka ang loose gear at traceable ang certificates.","fc":["Shackles, slings, hooks na may ID at SWL marking, tugma ang certificates"],"fx":"ANO ANG HINIHINGI:\nMay marka ang loose gear at tugma ang certificates.\n\nKAILAN MAY FINDING:\n• Walang marka\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check"},{"id":"10.1","s":"10","sn":"Mooring Operations","a":"DECK","h":1,"c":["MLMP per MEG4 / INTERTANKO section 2: retirement criteria, inspection intervals","Line records: inspections, end-for-end, rotation, hours/usage","Evidence plan is implemented (not just on paper)"],"o":"Has the company established guidelines and procedures for the inspection, maintenance and wear zone management of the mooring lines and are they being implemented? (V & M)","f":["Mooring line management plan not implemented – no inspection, rotation, end-for-end records","Retirement criteria not followed","Fewer than two spare mooring lines"],"eg":"Mooring Line Management Plan (MEG4/INTERTANKO) and it is applied (inspections, rotation).","ex":"WHAT IS ASKED:\nCompany instructions for inspection, maintenance and wear zones of mooring lines, and they are applied.\n\nFINDING WHEN:\n• Mooring Line Management Plan does not cover INTERTANKO section 2\n• No evidence it is applied\n\nWHAT THE INSPECTOR DOES:\n• Does random checks on the plan\n\nREMEMBER:\n• OCIMF MEG4","fg":"Mooring Line Management Plan (MEG4/INTERTANKO) at ipinapatupad (inspections, rotation).","fc":["MLMP ayon sa MEG4 / INTERTANKO section 2: retirement criteria, inspection intervals","Line records: inspections, end-for-end, rotation, oras/gamit","Patunay na ipinapatupad ang plan (hindi lang sa papel)"],"fx":"ANO ANG HINIHINGI:\nMay instructions ang company sa inspection, maintenance at wear zones ng mooring lines, at ipinapatupad.\n\nKAILAN MAY FINDING:\n• Hindi sakop ng Mooring Line Management Plan ang INTERTANKO section 2\n• Walang patunay na ipinapatupad\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Random na chine-check ang plan\n\nTANDAAN:\n• OCIMF MEG4","ff":["Hindi ipinapatupad ang mooring line management plan – walang inspection, rotation, end-for-end records","Hindi sinusunod ang retirement criteria","Kulang sa dalawa ang spare mooring lines"]},{"id":"10.3","s":"10","sn":"Mooring Operations","a":"DECK","h":0,"c":["Certificate for each line/tail (ID tags match)"],"o":"Are the certificates of mooring lines and mooring tails available on board? (V & M)","f":["Line / tail certificates missing or ID tags do not match"],"eg":"Mooring line & tail certificates available and matching.","ex":"WHAT IS ASKED:\nCertificates for lines and tails.\n\nFINDING WHEN:\n• Missing\n\nWHAT THE INSPECTOR DOES:\n• Checks them","fg":"May certificates ang mooring lines at tails at tugma.","fc":["Certificate ng bawat line/tail (tugma ang ID tags)"],"fx":"ANO ANG HINIHINGI:\nMay certificates ang lines at tails.\n\nKAILAN MAY FINDING:\n• Wala\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chine-check","ff":["Walang line / tail certificates o hindi tugma ang ID tags"]},{"id":"10.4","s":"10","sn":"Mooring Operations","a":"DECK","h":1,"c":["Compare LDBF of every line (incl. spares) to ship design MBL – ≥100%","Tails TDBF ≥125% of MBL","HMPE lines MUST have tails","No chafed/damaged lines","📋 Inspector: Mooring line certificates with SDMBL and LDBF, 2 spare lines"],"o":"Do mooring lines and mooring tails comply with industry guidelines and are they in good order? (V & M)","f":["Line LDBF <100% of ship design MBL, tail TDBF <125%","Lines chafed / damaged, HMPE without tails","Different line types on the same lead"],"eg":"Lines LDBF ≥100% of MBL, tails ≥125%, HMPE with tails, in good condition.","ex":"WHAT IS ASKED:\nLines and tails as per industry guidelines and in good condition.\n\nFINDING WHEN:\n• Line (or spare) with LDBF below 100% of MBL\n• Tail with TDBF below 125%\n• HMPE without tails\n\nWHAT THE INSPECTOR DOES:\n• Checks certificates and condition\n\nREMEMBER:\n• MEG4","fg":"Lines LDBF ≥100% ng MBL, tails ≥125%, HMPE na may tails, maayos.","fc":["Ikumpara ang LDBF ng bawat line (kasama spares) sa ship design MBL – ≥100%","Tails TDBF ≥125% ng MBL","Ang HMPE lines ay DAPAT may tails","Walang gasgas/sirang lines","📋 Inspector: Mooring line certificates with SDMBL and LDBF, 2 spare lines"],"fx":"ANO ANG HINIHINGI:\nLines at tails ayon sa industry guidelines at maayos.\n\nKAILAN MAY FINDING:\n• Line (o spare) na LDBF ay mas mababa sa 100% ng MBL\n• Tail na TDBF ay mas mababa sa 125%\n• HMPE na walang tails\n\nANO ANG GINAGAWA NG INSPECTOR:\n• Chi
