# Επιβίωση 72+ / Survival 72+ – iOS.  Created by George Barbaris
# Το Xcode project φτιάχνεται με XcodeGen:  cd native/ios && xcodegen generate
name: Survival72
options:
  bundleIdPrefix: gr.barbaris
  deploymentTarget: { iOS: "15.0" }
  developmentLanguage: el
targets:
  Survival72:
    type: application
    platform: iOS
    sources:
      - path: Survival72
      # Offline αντίγραφο = η ΙΔΙΑ web εφαρμογή (docs/survival) – δεν αλλάζει τίποτα εκεί
      - path: ../../docs/survival
        type: folder
        buildPhase: resources
      - path: ../shared/shim.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gr.barbaris.survival72
        PRODUCT_NAME: Survival72
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Survival72/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
