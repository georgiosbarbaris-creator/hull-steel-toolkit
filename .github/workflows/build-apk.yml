name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Κλειδί υπογραφής Επιβίωσης 72+ (από τα GitHub secrets)
        env:
          KS: ${{ secrets.SURVIVAL_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/survival72.jks"; echo "SURVIVAL_KEYSTORE=$RUNNER_TEMP/survival72.jks" >> "$GITHUB_ENV"; echo "SIGNED=1" >> "$GITHUB_ENV"; else echo "Χωρίς κλειδί – δεν δημοσιεύεται APK Επιβίωσης"; fi
      - env:
          SURVIVAL_KEYSTORE_PASSWORD: ${{ secrets.SURVIVAL_KEYSTORE_PASSWORD }}
        run: chmod +x gradlew && ./gradlew :app:assembleDebug :thermo:assembleDebug :survivalapp:assembleRelease :survivalapp:bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: HullSteel-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Thermometro-apk
          path: thermo/build/outputs/apk/debug/thermo-debug.apk
      - name: Publish Θερμόμετρο APK (stable download link)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp thermo/build/outputs/apk/debug/thermo-debug.apk Thermometro.apk
          gh release view thermo-latest >/dev/null 2>&1 || gh release create thermo-latest --title "Θερμόμετρο Κινητού (Android)" --notes "Τελευταίο APK του Θερμόμετρου. Κατέβασε το Thermometro.apk στο Android και εγκατέστησέ το."
          gh release upload thermo-latest Thermometro.apk --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: Epiviosi72-apk
          path: |
            native/android/build/outputs/apk/release/*.apk
            native/android/build/outputs/bundle/release/*.aab
      - name: Publish Επιβίωση 72+ APK (stable download link)
        if: github.ref == 'refs/heads/main' && env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp native/android/build/outputs/apk/release/survivalapp-release.apk Epiviosi72.apk
          gh release view survival-latest >/dev/null 2>&1 || gh release create survival-latest --title "Επιβίωση 72+ / Survival 72+ (Android)" --notes "Δωρεάν για όλους. Κατέβασε το Epiviosi72.apk στο Android και εγκατέστησέ το. Free for everyone – download Epiviosi72.apk on Android and install it. © 2026 Γεώργιος Μπαρμπαρής"
          cp native/android/build/outputs/bundle/release/survivalapp-release.aab Epiviosi72-GooglePlay.aab
          gh release upload survival-latest Epiviosi72.apk Epiviosi72-GooglePlay.aab --clobber
      - name: Publish Επιβίωση 72+ BETA APK (κλάδος ble-mesh – μόνο για δοκιμή)
        if: github.ref == 'refs/heads/ble-mesh' && env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp native/android/build/outputs/apk/release/survivalapp-release.apk Epiviosi72-beta.apk
          gh release view survival-beta >/dev/null 2>&1 || gh release create survival-beta --prerelease --target ble-mesh --title "Επιβίωση 72+ BETA (Android) – Μηνύματα Bluetooth" --notes "ΔΟΚΙΜΑΣΤΙΚΗ έκδοση με μηνύματα Bluetooth. Για δοκιμή μόνο. © 2026 Γεώργιος Μπαρμπαρής"
          gh release upload survival-beta Epiviosi72-beta.apk --clobber
